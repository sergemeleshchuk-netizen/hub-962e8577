<title>Capy Doku — playable</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;padding:0;height:100%;background:#0c1a1c;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#fff;overflow:hidden}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:360px;height:640px;overflow:hidden;transform-origin:center center;
    background:
      radial-gradient(120% 70% at 50% 12%, rgba(255,255,255,.10), rgba(255,255,255,0) 60%),
      linear-gradient(180deg,#2bb6bd 0%,#1f9aa6 45%,#178390 100%);
    border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
  /* лёгкие блики воды */
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;
    background:radial-gradient(40px 22px at 20% 30%,#fff,transparent),
      radial-gradient(60px 30px at 80% 60%,#fff,transparent),
      radial-gradient(50px 26px at 60% 88%,#fff,transparent)}
  /* ---- top bar ---- */
  #bar{position:absolute;left:0;right:0;top:14px;display:flex;align-items:center;justify-content:center;
    gap:10px;z-index:12;padding:0 16px}
  .rbtn{width:38px;height:38px;border-radius:12px;background:#f3f7f4;color:#2b6e74;display:flex;
    align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 0 #c5d2cf;flex:none}
  #level{flex:1;text-align:center;background:#0e5b63;border:2px solid #ffffff55;border-radius:14px;
    padding:8px 0;font-weight:800;letter-spacing:1px;font-size:18px;color:#fff;
    text-shadow:0 2px 3px rgba(0,0,0,.4);max-width:180px;margin:0 auto}
  #goal{position:absolute;left:0;right:0;top:64px;text-align:center;font-size:15px;font-weight:700;z-index:11;
    text-shadow:0 2px 4px rgba(0,0,0,.35)}

  .cell{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cell .x{width:58%;height:58%;opacity:0;transform:scale(.4);transition:opacity .18s,transform .18s}
  .cell .x.show{opacity:.95;transform:scale(1)}
  .cell .x svg{width:100%;height:100%;display:block}
  .cell .capy{position:absolute;width:118%;height:118%;left:-9%;top:-16%;object-fit:contain;
    pointer-events:none;opacity:0;transform:scale(.3) translateY(8px);
    transition:opacity .22s,transform .28s cubic-bezier(.34,1.6,.5,1);
    filter:drop-shadow(0 4px 5px rgba(0,0,0,.4));z-index:3}
  .cell .capy.show{opacity:1;transform:scale(1) translateY(0)}
  .cell.bad{animation:bad .5s ease}
  .cell.bad::before{content:"";position:absolute;inset:6%;border-radius:12px;
    background:#ff4b4b;border:3px solid #fff;box-shadow:0 0 14px #ff4b4b;z-index:4;animation:badflash .5s ease}
  @keyframes badflash{0%,100%{opacity:0}30%,70%{opacity:.9}}
  @keyframes bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .cell.hintzone{animation:hz 1s ease-in-out infinite}
  @keyframes hz{0%,100%{box-shadow:inset 0 0 0 0 #fff0}50%{box-shadow:inset 0 0 0 3px #ffffffcc}}

function fit(){stage.style.transform="scale("+scale()+")";}
function rectInStage(el){var r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect(),s=scale();
  return{x:(r.left-sr.left)/s,y:(r.top-sr.top)/s,w:r.width/s,h:r.height/s};}
window.addEventListener("resize",fit);

// ====== BUILD ======
function build(){
  grid=Array.from({length:N},function(){return Array(N).fill(0);});
  auto=Array.from({length:N},function(){return Array(N).fill(false);});
  cells=Array.from({length:N},function(){return Array(N).fill(null);});
  complete=false; placed=0;
  board.innerHTML='';
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var cell=document.createElement('div'); cell.className='cell'; cell.dataset.r=r; cell.dataset.c=c;
    var x=document.createElement('div'); x.className='x'; x.innerHTML=XMARK; cell.appendChild(x);
    var cap=document.createElement('img'); cap.className='capy'; cap.src=CAPY_SRC; cell.appendChild(cap);
    board.appendChild(cell); cells[r][c]=cell;
  }
  recomputeAuto(); repaint();
  tip.innerHTML='Tap a tile to place a <b>capybara</b>';
  setTimeout(showHint,500);
}

// авто-крестики: 3×3 вокруг капибары + вся строка + весь столбец
function recomputeAuto(){
  for(var r=0;r<N;r++)for(var c=0;c<N;c++) auto[r][c]=false;
  for(var r=0;r<N;r++)for(var c=0;c<N;c++) if(grid[r][c]===2){
    for(var k=0;k<N;k++){ if(grid[r][k]!==2)auto[r][k]=true; if(grid[k][c]!==2)auto[k][c]=true; } // строка+столбец
    for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){          // 3×3 соседи
      var nr=r+dr,nc=c+dc; if(nr<0||nc<0||nr>=N||nc>=N)continue;
      if(grid[nr][nc]!==2) auto[nr][nc]=true;
    }
  }
}
function paint(r,c){
  var cell=cells[r][c], cap=cell.querySelector('.capy'), x=cell.querySelector('.x');
  if(grid[r][c]===2){ cap.classList.add('show'); x.classList.remove('show'); }
  else { cap.classList.remove('show'); if(auto[r][c]) x.classList.add('show'); else x.classList.remove('show'); }
}
function repaint(){ for(var r=0;r<N;r++)for(var c=0;c<N;c++) paint(r,c); }

// причина, почему в (r,c) ставить нельзя (null = можно)
function conflict(r,c){
  for(var rr=0;rr<N;rr++)for(var cc=0;cc<N;cc++) if(grid[rr][cc]===2){
    if(rr===r&&cc===c) continue;
    if(Math.abs(rr-r)<=1&&Math.abs(cc-c)<=1) return 'Too close!';
    if(rr===r||cc===c) return 'No same row or column';
    if(REGIONS[rr][cc]===REGIONS[r][c]) return 'One capybara per color';
  }
  return null;
}

board.addEventListener('pointerdown',function(ev){
  var el=ev.target.closest('.cell'); if(!el||complete) return;
  var r=+el.dataset.r, c=+el.dataset.c;
  if(grid[r][c]===2){ // снять капибару
    grid[r][c]=0; placed--; recomputeAuto(); repaint(); return;
  }
  var bad=conflict(r,c);
  if(bad){ flashBad(el,bad); return; }
  // ставим
  grid[r][c]=2; placed++;
  recomputeAuto(); repaint();
  el.classList.remove('pop'); cells[r][c].querySelector('.capy');
  hand.style.opacity=0; hand.classList.remove('tap');
  burstAt(el,9,['#ffe27a','#ffd166','#fff','#8fe3c0'],46);
  afterPlace();
});

function flashBad(el,msg){
  el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad');
  setTimeout(function(){el.classList.remove('bad');},520);
  tip.innerHTML='<b>'+msg+'</b>';
}

function afterPlace(){
  // контекстная подсказка после первой постановки
  if(placed===1){ tip.innerHTML='No <b>neighbors</b> — and no same <b>row</b> or <b>column</b>!'; }
  else if(!complete){ tip.innerHTML='Find the safe tile in each color'; }
  if(checkWin()) return;
  setTimeout(showHint,260);
}

function checkWin(){
  if(placed!==N) return false;
  var rows={},cols={},reg={};
  for(var r=0;r<N;r++)for(var c=0;c<N;c++) if(grid[r][c]===2){
    if(rows[r]||cols[c]||reg[REGIONS[r][c]]) return false;
    rows[r]=1;cols[c]=1;reg[REGIONS[r][c]]=1;
  }
  if(Object.keys(reg).length!==N) return false;
  complete=true; hand.style.opacity=0;
  tip.innerHTML='<b>Level Complete!</b>';
  for(var r=0;r<N;r++)for(var c=0;c<N;c++) if(grid[r][c]===2) burstAt(cells[r][c],12,['#ffe27a','#ffd166','#fff','#8fe3c0','#9bdcff'],64);
  setTimeout(showEnd,820);
  return true;
}

// ====== HAND HINT — ведёт к следующей клетке по сценарию ======
function showHint(){
  if(complete) return;
  for(var i=0;i<ORDER.length;i++){
    var s=ORDER[i];
    if(grid[s[0]][s[1]]!==2 && !conflict(s[0],s[1])){ pointHandAt(cells[s[0]][s[1]]); return; }
  }
}
function pointHandAt(el){
  var r=rectInStage(el); var tx=r.x+r.w*0.5, ty=r.y+r.h*0.55;
  hand.style.opacity=1; hand.classList.add('tap');
  hand.style.left=(tx-42.7)+'px'; hand.style.top=(ty-2.1)+'px';
}

// ====== FX ======
function burstAt(target,n,colors,spread){
  var rc=rectInStage(target),cx=rc.x+rc.w/2,cy=rc.y+rc.h/2;
  for(var i=0;i<n;i++){
    var p=document.createElement("div");p.className="spark";var sz=6+(i%3)*3;
    p.style.cssText="width:"+sz+"px;height:"+sz+"px;background:"+colors[i%colors.length]+";left:"+cx+"px;top:"+cy+"px";
    stage.appendChild(p);var a=Math.PI*2*i/n,d=spread*(0.6+(i%4)*0.16);
    (function(p,dx,dy){p.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+dx+"px,"+dy+"px) scale(0)",opacity:0}],
      {duration:640,easing:"cubic-bezier(.2,.7,.3,1)"});setTimeout(function(){p.remove();},660);})(p,Math.cos(a)*d,Math.sin(a)*d);
  }
}

// ====== END ======
function showEnd(){
  document.getElementById('end-img').src=CAPY_SRC;
  endScreen.classList.add('show');
  setTimeout(function(){ burstAt({getBoundingClientRect:function(){return {left:0,top:0,width:0,height:0};}},0,[],0); },10);
  // конфетти
  var colors=['#ffe27a','#ffd166','#fff','#8fe3c0','#9bdcff','#ff9ec0'];
  for(var i=0;i<34;i++){
    var p=document.createElement("div");p.className="spark";var sz=8+(i%3)*3;
    p.style.cssText="width:"+sz+"px;height:"+sz+"px;background:"+colors[i%colors.length]+";left:180px;top:230px;z-index:210";
    stage.appendChild(p);var a=Math.PI*2*i/34,d=140*(0.6+(i%4)*0.16);
    (function(p,dx,dy){p.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+dx+"px,"+dy+"px) scale(0)",opacity:0}],
      {duration:950,easing:"cubic-bezier(.2,.7,.3,1)"});setTimeout(function(){p.remove();},970);})(p,Math.cos(a)*d,Math.sin(a)*d);
  }
}

// ====== CTA ======
var ctaFired=false;
function ctaClick(){
  if(ctaFired)return; ctaFired=true;
  try{if(window.FbPlayableAd&&FbPlayableAd.onCTAClick){FbPlayableAd.onCTAClick();return;}}catch(e){}
  try{if(typeof ExitApi!=='undefined'&&ExitApi.exit){ExitApi.exit();return;}}catch(e){}
  try{if(window.mraid&&mraid.open){mraid.open(STORE_URL);return;}}catch(e){}
  try{window.open(STORE_URL,'_blank');}catch(e){}
}
document.getElementById('btn-play').addEventListener('click',ctaClick);
document.getElementById('btn-cta').addEventListener('click',ctaClick);
stage.addEventListener('click',function(ev){
  if(endScreen.classList.contains('show') && ev.target.id!=='btn-cta'){ ctaClick(); }
});

// ====== BOOT ======
fit(); build();
</script>
</body>
</html>
