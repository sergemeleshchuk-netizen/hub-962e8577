<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Galaxy Words — Accrete the Cosmos</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#02040c;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  #wrap{
    position:relative;width:430px;max-width:100vw;height:900px;max-height:100vh;
    margin:0 auto;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 30%, #182a55 0%, #0a1430 38%, #050a1c 70%, #02040c 100%);
    touch-action:none;user-select:none;
  }
  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;z-index:40;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(180deg,rgba(3,8,22,.85),rgba(3,8,22,0));pointer-events:none;}
  #title{font-size:15px;font-weight:800;letter-spacing:.5px;color:#ffd778;text-shadow:0 0 10px rgba(255,200,80,.5);}
  #stats{display:flex;gap:14px;align-items:center;}
  .chip{font-size:12px;font-weight:700;color:#cfe8ff;background:rgba(40,70,130,.45);border:1px solid rgba(120,180,255,.3);
    padding:5px 9px;border-radius:20px;text-shadow:0 0 6px rgba(120,200,255,.4);}
  .chip b{color:#7fffe0;}
  #restart{pointer-events:auto;cursor:pointer;width:34px;height:34px;border-radius:50%;border:1px solid rgba(120,180,255,.4);
    background:rgba(40,70,130,.5);color:#cfe8ff;font-size:18px;display:flex;align-items:center;justify-content:center;}
  #restart:active{transform:scale(.9);}
  /* stage */
  #stage{position:absolute;inset:0;z-index:10;}
  #starfield{position:absolute;inset:0;z-index:5;}
  /* planet */
  .planet{position:absolute;z-index:20;display:flex;align-items:center;justify-content:center;border-radius:50%;
    color:#fff;font-weight:800;text-align:center;cursor:grab;touch-action:none;
    text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 6px rgba(0,0,0,.6);
    transition:box-shadow .15s;will-change:transform;}
  .planet .ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.25);
    width:150%;height:46%;left:-25%;top:27%;transform:rotate(-22deg);pointer-events:none;}
  .planet .badge{position:absolute;top:-6px;right:-6px;background:#0a1430;border:1px solid rgba(255,255,255,.45);
    border-radius:12px;font-size:10px;font-weight:800;padding:2px 5px;color:#7fffe0;box-shadow:0 0 8px rgba(0,0,0,.6);}
  .planet .lbl{padding:0 6px;line-height:1.05;pointer-events:none;}
  .planet.drag{cursor:grabbing;z-index:60;}
  .planet.hot{box-shadow:0 0 0 4px rgba(127,255,224,.7),0 0 26px rgba(127,255,224,.6) !important;}
  /* toast */
  #toast{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);z-index:70;pointer-events:none;
    font-size:22px;font-weight:900;color:#fff;text-shadow:0 0 14px rgba(255,210,90,.9),0 2px 6px rgba(0,0,0,.7);
    opacity:0;transition:opacity .3s, top .5s;white-space:nowrap;}
  #toast.show{opacity:1;}
  /* overlay */
  #over{position:absolute;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(70% 60% at 50% 45%,rgba(10,24,60,.92),rgba(2,4,12,.97));text-align:center;padding:30px;}
  #over.show{display:flex;}
  #over h1{font-size:30px;color:#ffd778;text-shadow:0 0 18px rgba(255,200,80,.6);}
  #over p{font-size:15px;color:#bcd6ff;line-height:1.5;}
  .btn{cursor:pointer;pointer-events:auto;font-size:16px;font-weight:800;color:#04122a;padding:12px 26px;border-radius:30px;
    border:none;background:linear-gradient(180deg,#9fe9ff,#5cc4ff);box-shadow:0 0 22px rgba(90,196,255,.6);}
  .btn:active{transform:scale(.95);}
  .btn.gold{background:linear-gradient(180deg,#ffe39a,#ffc14d);box-shadow:0 0 22px rgba(255,193,77,.6);}
  #hint{position:absolute;bottom:14px;left:0;right:0;z-index:30;text-align:center;font-size:11px;color:rgba(180,210,255,.6);pointer-events:none;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="starfield"></canvas>
  <div id="stage"></div>
  <div id="hud">
    <div id="title">🪐 GALAXY WORDS</div>
    <div id="stats">
      <div class="chip">Moves <b id="moves">0</b></div>
      <div class="chip">Systems <b id="prog">0/0</b></div>
      <div id="restart">↻</div>
    </div>
  </div>
  <div id="toast"></div>
  <div id="hint">Drag a planet onto a same-colour planet to accrete · drag empty space to orbit</div>
  <div id="over">
    <h1 id="overTitle"></h1>
    <p id="overText"></p>
    <button class="btn" id="overBtn"></button>
  </div>
</div>
<script>
"use strict";
(function(){
  // ===== CONTENT (verbatim from SHARED.md) =====
  const CATS = [
   {name:'Planets',     emoji:'🪐', color:'#7a5cf6', words:['MERCURY','VENUS','MARS','SATURN']},
   {name:'Royalty',     emoji:'👑', color:'#e6a33f', words:['KING','QUEEN','PRINCE','PRINCESS']},
   {name:'Writing',     emoji:'✏️', color:'#36c6c0', words:['PEN','PENCIL','CRAYON','MARKER']},
   {name:'Boats',       emoji:'⛵', color:'#3f8fe6', words:['BOAT','SHIP','BARGE','RAFT']},
   {name:'Organs',      emoji:'🫀', color:'#e8563f', words:['HEART','LIVER','LUNG','KIDNEY']},
   {name:'Weather',     emoji:'🌪️', color:'#5b7cf5', words:['STORM','TORNADO','CYCLONE','BLIZZARD']},
   {name:'Veggies',     emoji:'🥕', color:'#7da04a', words:['CARROT','CELERY','ONION','PEPPER']},
   {name:'Reptiles',    emoji:'🦎', color:'#2ea49a', words:['GECKO','IGUANA','SNAKE','LIZARD']},
   {name:'Birds',       emoji:'🦜', color:'#ef6aa0', words:['CROW','EAGLE','PARROT','ROBIN']},
   {name:'Continents',  emoji:'🌍', color:'#4aa6a0', words:['EUROPE','AFRICA','ASIA','AMERICA']},
   {name:'Pastry',      emoji:'🥐', color:'#d99b3f', words:['DONUT','BAGEL','MUFFIN','PRETZEL']},
   {name:'Temperature', emoji:'🌡️', color:'#e07a3f', words:['HOT','WARM','COLD','COOL']},
  ];

  const W=430, H=900;
  const stage=document.getElementById('stage');
  const cv=document.getElementById('starfield');
  const ctx=cv.getContext('2d');
  const movesEl=document.getElementById('moves');
  const progEl=document.getElementById('prog');
  const toastEl=document.getElementById('toast');
  const over=document.getElementById('over');
  const overTitle=document.getElementById('overTitle');
  const overText=document.getElementById('overText');
  const overBtn=document.getElementById('overBtn');

  // field center for orbit rotation
  const CX=W/2, CY=H/2+30;

  // ===== STARFIELD =====
  let stars=[];
  function initStars(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    stars=[];
    for(let i=0;i<140;i++){
      const a=Math.random()*Math.PI*2;
      const r=Math.random()*Math.max(W,H)*0.75;
      stars.push({a:a, r:r, size:Math.random()*1.6+0.4, depth:0.3+Math.random()*0.7, tw:Math.random()*Math.PI*2});
    }
  }
  let fieldRot=0; // radians, the board orbit angle
  function drawStars(t){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      // parallax: deeper stars rotate less
      const ang=s.a + fieldRot*s.depth;
      const x=CX+Math.cos(ang)*s.r*s.depth;
      const y=CY+Math.sin(ang)*s.r*s.depth*0.85;
      const tw=0.5+0.5*Math.sin(t*0.002+s.tw);
      ctx.globalAlpha=0.35+tw*0.55*s.depth;
      ctx.fillStyle= s.depth>0.6?'#ffffff':'#bcd6ff';
      ctx.beginPath();
      ctx.arc(x,y,s.size,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // ===== GAME STATE =====
  let level=0;          // 0-based; level index drives number of categories
  let groups=[];        // active word-groups (planets)
  let moves=0;
  let totalCats=0, doneCats=0;
  let uid=0;

  function levelCatCount(){ return 4+level; }

  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

  // place planets within an inner ellipse around the centre, non-overlapping-ish
  function placePos(){
    const rx=W*0.40, ry=H*0.30;
    return { x: CX + (Math.random()*2-1)*rx, y: CY + (Math.random()*2-1)*ry };
  }

  function startLevel(){
    stage.querySelectorAll('.planet').forEach(n=>n.remove());
    groups=[];
    fieldRot=0;
    const n=levelCatCount();
    const chosen=shuffle(CATS.slice()).slice(0,n);
    totalCats=chosen.length;
    doneCats=0;
    // moves budget: minimum needed = 3 merges per category = 3*n; give a small cushion
    moves = totalCats*3 + Math.max(2, Math.round(totalCats));
    // build one single-word object per word, scatter
    let objs=[];
    chosen.forEach((cat,ci)=>{
      cat.words.forEach(w=>{
        objs.push({cat:ci, color:cat.color, words:[w], total:cat.words.length});
      });
    });
    shuffle(objs);
    // distribute on grid-ish to avoid heavy overlap
    objs.forEach((o,i)=>{
      const g={id:++uid, cat:o.cat, color:o.color, words:o.words, total:o.total};
      const p=spreadPos(i, objs.length);
      g.x=p.x; g.y=p.y;
      makePlanet(g);
      groups.push(g);
    });
    updateHUD();
    hideOver();
  }

  function spreadPos(i,total){
    // distribute across rows inside the play ellipse
    const cols=4;
    const rows=Math.ceil(total/cols);
    const col=i%cols, row=Math.floor(i/cols);
    const padX=70, padY=170;
    const usableW=W-padX*2, usableH=H-padY-110;
    const cellW=usableW/cols, cellH=usableH/Math.max(1,rows);
    const jx=(Math.random()*2-1)*cellW*0.18;
    const jy=(Math.random()*2-1)*cellH*0.18;
    return {
      x: padX + cellW*(col+0.5) + jx,
      y: padY + cellH*(row+0.5) + jy
    };
  }

  function planetSize(g){
    return 56 + (g.words.length-1)*12; // grows with collected words
  }

  function makePlanet(g){
    const el=document.createElement('div');
    el.className='planet';
    el.dataset.id=g.id;
    g.el=el;
    paintPlanet(g);
    stage.appendChild(el);
    layoutPlanet(g);
    attachDrag(g);
  }

  function paintPlanet(g){
    const sz=planetSize(g);
    const el=g.el;
    el.style.width=sz+'px';
    el.style.height=sz+'px';
    const fs = g.words.length>1 ? Math.max(10, 15 - g.words.length) : Math.max(10, 17 - Math.floor(g.words[0].length/2));
    el.style.fontSize=fs+'px';
    el.style.background='radial-gradient(circle at 35% 30%, '+lighten(g.color,55)+' 0%, '+g.color+' 55%, '+darken(g.color,40)+' 100%)';
    el.style.boxShadow='0 0 18px '+hexA(g.color,.6)+', inset -6px -8px 14px rgba(0,0,0,.45), inset 6px 6px 12px '+hexA(lighten(g.color,60),.5);
    const label = g.words.length===1 ? g.words[0] : g.words[g.words.length-1];
    el.innerHTML='<div class="ring"></div><div class="lbl">'+label+'</div>'+
      '<div class="badge">'+g.words.length+'/'+g.total+'</div>';
  }

  function layoutPlanet(g){
    if(!g.el) return;
    const sz=planetSize(g);
    // apply orbit rotation around centre (parallax-ish small effect)
    const pos=orbited(g.x,g.y);
    g.el.style.left=(pos.x - sz/2)+'px';
    g.el.style.top =(pos.y - sz/2)+'px';
  }

  // rotate a world point around the centre by fieldRot for the orbital look
  function orbited(x,y){
    const dx=x-CX, dy=y-CY;
    const c=Math.cos(fieldRot), s=Math.sin(fieldRot);
    return { x: CX + dx*c - dy*s*0.9, y: CY + dx*s*0.55 + dy*c };
  }
  // inverse: screen point -> world point
  function unorbit(sx,sy){
    const dx=sx-CX, dy=sy-CY;
    const c=Math.cos(fieldRot), s=Math.sin(fieldRot);
    // approximate inverse of the (non-uniform) forward map by solving the 2x2 system
    // forward: dx' = dx*c - dy*s*0.9 ; dy' = dx*s*0.55 + dy*c
    const a=c, b=-s*0.9, cc=s*0.55, d=c;
    const det=a*d-b*cc || 1e-6;
    const wx=(dx*d - dy*b)/det;
    const wy=(-dx*cc + dy*a)/det;
    return { x:CX+wx, y:CY+wy };
  }

  // ===== color helpers =====
  function hx(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
  function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
  function lighten(h,amt){const[r,g,b]=hx(h);return `rgb(${clamp(r+amt)},${clamp(g+amt)},${clamp(b+amt)})`;}
  function darken(h,amt){const[r,g,b]=hx(h);return `rgb(${clamp(r-amt)},${clamp(g-amt)},${clamp(b-amt)})`;}
  function hexA(h,a){const[r,g,b]=hx(h);return `rgba(${r},${g},${b},${a})`;}

  // ===== HUD =====
  function updateHUD(){
    movesEl.textContent=moves;
    progEl.textContent=doneCats+'/'+totalCats;
  }

  let toastTimer=null;
  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1100);
  }

  // ===== DRAG (pointer) =====
  let drag=null; // {g, startX, startY, offX, offY}
  let orbitDrag=null; // {startX, startRot}

  function attachDrag(g){
    g.el.addEventListener('pointerdown',(e)=>{
      e.stopPropagation();
      startPlanetDrag(g,e);
    });
  }

  function startPlanetDrag(g,e){
    if(over.classList.contains('show')) return;
    const sz=planetSize(g);
    const pos=orbited(g.x,g.y);
    // store offset between pointer (in wrap coords) and planet centre
    const p=toWrap(e);
    drag={ g:g, offX:p.x-pos.x, offY:p.y-pos.y, sz:sz, moved:false };
    g.el.classList.add('drag');
    if(g.el.setPointerCapture){ try{ g.el.setPointerCapture(e.pointerId); }catch(_){} }
  }

  const wrap=document.getElementById('wrap');
  function toWrap(e){
    const r=wrap.getBoundingClientRect();
    return { x:e.clientX-r.left, y:e.clientY-r.top };
  }

  // background orbit drag
  wrap.addEventListener('pointerdown',(e)=>{
    if(drag) return;
    if(over.classList.contains('show')) return;
    if(e.target.closest('.planet')) return; // planet handles its own
    const p=toWrap(e);
    orbitDrag={ startX:p.x, startRot:fieldRot };
  });

  window.addEventListener('pointermove',(e)=>{
    if(drag){
      const p=toWrap(e);
      const nx=p.x-drag.offX, ny=p.y-drag.offY;
      drag.moved=true;
      drag.g.el.style.left=(nx-drag.sz/2)+'px';
      drag.g.el.style.top =(ny-drag.sz/2)+'px';
      // hover detection
      const target=findTargetUnder(nx,ny,drag.g);
      groups.forEach(gg=>{ if(gg!==drag.g) gg.el.classList.remove('hot'); });
      if(target && target.cat===drag.g.cat) target.el.classList.add('hot');
    } else if(orbitDrag){
      const p=toWrap(e);
      fieldRot = orbitDrag.startRot + (p.x-orbitDrag.startX)*0.006;
      // relayout all planets to new orbit
      groups.forEach(layoutPlanet);
    }
  },{passive:false});

  window.addEventListener('pointerup',(e)=>{
    if(drag){
      const g=drag.g;
      g.el.classList.remove('drag');
      groups.forEach(gg=>gg.el.classList.remove('hot'));
      const p=toWrap(e);
      const nx=p.x-drag.offX, ny=p.y-drag.offY;
      const target=findTargetUnder(nx,ny,g);
      if(drag.moved && target){
        if(target.cat===g.cat){
          doMerge(g,target);
          drag=null; return;
        }
      }
      // snap back
      layoutPlanet(g);
      drag=null;
    }
    orbitDrag=null;
  });

  function findTargetUnder(x,y,self){
    let best=null,bd=1e9;
    for(const g of groups){
      if(g===self) continue;
      const pos=orbited(g.x,g.y);
      const d=Math.hypot(pos.x-x,pos.y-y);
      const reach=planetSize(g)/2 + 26;
      if(d<reach && d<bd){bd=d;best=g;}
    }
    return best;
  }

  // ===== MERGE (core rule 2 & 3) =====
  function doMerge(a, b){
    // b absorbs a (target stays in place)
    b.words=b.words.concat(a.words);
    // remove a
    groups=groups.filter(g=>g!==a);
    a.el.remove();
    // cost a move
    moves--;
    paintPlanet(b);
    layoutPlanet(b);
    // pop animation
    b.el.animate([{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:220,easing:'cubic-bezier(.3,1.6,.5,1)'});

    if(b.words.length>=b.total){
      completeCategory(b);
    } else {
      toast('Accreted '+b.words.length+'/'+b.total);
    }
    updateHUD();
    checkEnd();
  }

  function completeCategory(g){
    doneCats++;
    const el=g.el;
    // warp away off-screen: solar-system zoom out
    el.style.zIndex=65;
    el.animate([
      {transform:'scale(1) rotate(0deg)',opacity:1, offset:0},
      {transform:'scale(1.5) rotate(40deg)',opacity:1, offset:0.25},
      {transform:'scale(0.05) rotate(720deg)',opacity:0, offset:1}
    ],{duration:700,easing:'cubic-bezier(.6,0,.9,.2)'}).onfinish=()=>el.remove();
    groups=groups.filter(x=>x!==g);
    toast('🌌 System formed!');
    updateHUD();
  }

  // ===== END CHECK =====
  function checkEnd(){
    if(doneCats>=totalCats){
      showOver(true);
    } else if(moves<=0){
      // any merge still possible? if out of moves -> lose
      showOver(false);
    }
  }

  function showOver(win){
    over.classList.add('show');
    if(win){
      overTitle.textContent='⭐ Galaxy Complete!';
      overText.textContent='All systems formed across the sector. Ready for a deeper field?';
      overBtn.textContent='Next Level (+1 system)';
      overBtn.className='btn gold';
      overBtn.onclick=()=>{ level++; startLevel(); };
    } else {
      overTitle.textContent='💫 Out of Moves';
      overText.textContent='The cosmos drifted apart. Re-align the planets and try again.';
      overBtn.textContent='Retry Sector';
      overBtn.className='btn';
      overBtn.onclick=()=>{ startLevel(); };
    }
  }
  function hideOver(){ over.classList.remove('show'); }

  document.getElementById('restart').addEventListener('click',()=>{ level=0; startLevel(); });

  // ===== RAF loop for stars =====
  function loop(t){ drawStars(t); requestAnimationFrame(loop); }

  // ===== INIT =====
  function init(){
    initStars();
    startLevel();
    requestAnimationFrame(loop);
  }
  window.addEventListener('resize',initStars);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
</body>
</html>
