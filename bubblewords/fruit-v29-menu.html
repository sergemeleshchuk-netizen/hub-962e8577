<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruit Bubble Jam · ORIGINAL · v29</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#10131c;color:#eef7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{display:flex;justify-content:center;padding:28px 14px}.wrap{width:min(720px,100%)}
  h1{font-size:24px;margin:0 0 6px}.sub{color:#91b7d5;margin-bottom:22px}
  .controls{display:grid;gap:12px;margin-top:18px}
  label{display:grid;gap:6px;color:#9fc4dd;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  select,button{width:100%;min-height:48px;border:0;border-radius:13px;font:inherit;font-weight:800}
  select{padding:0 14px;background:#eaf6fc;color:#15344a;outline:none}
  button{background:linear-gradient(180deg,#39b97b,#16875b);color:#fff;box-shadow:0 3px 0 #0a553b;cursor:pointer}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #0a553b}.note{margin-top:20px;color:#7897ad;font-size:13px;line-height:1.45}
</style>
</head>
<body><main class="wrap">
  <h1>Fruit Bubble Jam · ORIGINAL · v29</h1>
  <div class="sub">Fruit Jam · 10 семейств фруктов · уровни 1–199 · улучшенная геометрия и загрузка</div>
  <div class="controls">
    <label>Уровень<select id="level"></select></label>
    <label>Модификатор механики<select id="modifier">
      <option value="none">Без модификатора</option>
      <option value="halves">Половинки пузырей</option>
      <option value="ice">Лёд на пузырях</option>
      <option value="hidden">Скрытые пузыри</option>
      <option value="chain">Цепочка</option>
    </select></label>
    <button id="play">Открыть уровень ▶</button>
  </div>
  <div class="note">Playable перенесён из BB с последними правками: фиксированная досыпка, лупа с приоритетом недособранной категории, магнит и по 3 заряда каждого бустера.</div>
</main>
<script>
  const level=document.getElementById('level');
  for(let n=1;n<=199;n++){
    const o=document.createElement('option');o.value=n-1;o.textContent=`${n} · Fruit Jam`;level.appendChild(o);
  }
  document.getElementById('play').onclick=()=>{
    const mod=document.getElementById('modifier').value;
    location.href=`v29-fruit.html?pack=fruit-jam-v27-original&n=${level.value}&mod=${mod}`;
  };
</script>
</body></html>
