<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Word Crash — Picture Puns · v4 (all levels open)</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:manipulation;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  /* ===== РАМКА-ТЕЛЕФОН 9:16 ===== */
  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:#f8b64c;}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }
  #bg{position:absolute;inset:0;z-index:0;transition:background .4s;}

  /* ================= КАРТА УРОВНЕЙ ================= */
  #mapScr{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;}
  #mapScr .mtitle{text-align:center;color:#fff;margin:5% 0 0;font-weight:900;font-size:clamp(20px,6.5vmin,34px);
    text-shadow:0 3px 0 #0003;letter-spacing:.5px;position:relative;z-index:2;}
  #mapScr .msub{text-align:center;color:#fff9;margin:4px 0 0;font-size:clamp(11px,3vmin,15px);position:relative;z-index:2;}
  #mapWrap{flex:1;position:relative;min-height:0;}
  #mapSvg{position:absolute;inset:0;width:100%;height:100%;}
  .node{position:absolute;width:15.5%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:clamp(18px,5.4vmin,30px);color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#b9c2d4,#8d97ac);box-shadow:0 5px 0 #6b7488,0 8px 16px #0004;}
  .node.open{background:linear-gradient(180deg,#cfd8e8,#98a4bd);box-shadow:0 5px 0 #707c98,0 8px 16px #0004;}
  .node.done{background:linear-gradient(180deg,#8fdb5e,#57b33a);box-shadow:0 5px 0 #3d8a26,0 8px 16px #0004;}
  .node.cur{background:linear-gradient(180deg,#ffd166,#f5a33b);box-shadow:0 5px 0 #c97c1d,0 8px 16px #0005;
    animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.09)}}
  .node .play{position:absolute;top:-42%;left:50%;transform:translateX(-50%);background:#fff;color:#e0662f;
    font-size:clamp(10px,2.6vmin,13px);font-weight:900;padding:4px 10px;border-radius:999px;white-space:nowrap;
    box-shadow:0 3px 8px #0003;}
  .node .play:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:#fff;}

  /* ================= ИГРОВОЙ ЭКРАН ================= */
  #gameScr{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;}
  #hud{width:100%;padding:12px 14px 4px;display:flex;align-items:center;gap:10px;z-index:3;}
  #btnBack{width:38px;height:38px;border:none;border-radius:12px;background:#ffffffd9;color:#555;
    font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 2px 6px #0002;flex:none;}
  #lvlName{flex:1;text-align:center;color:#fff;font-weight:800;font-size:clamp(15px,4.4vmin,20px);text-shadow:0 2px 0 #0003;}
  #coins{flex:none;background:#ffffffd9;border-radius:999px;padding:6px 12px;font-weight:800;color:#8a6d1f;
    font-size:clamp(12px,3.4vmin,15px);box-shadow:0 2px 6px #0002;}

  /* карточка-картинка (каламбур) */
  #cardWrap{width:88%;height:31%;flex:none;z-index:3;display:flex;align-items:stretch;gap:6px;margin-top:6px;}
  .carr{border:none;background:#ffffffb0;border-radius:12px;width:30px;color:#777;font-size:17px;font-weight:900;
    cursor:pointer;flex:none;}
  #card{flex:1;background:#fff;border-radius:16px;box-shadow:0 8px 20px #0003;padding:10px 10px 6px;
    display:flex;flex-direction:column;align-items:center;min-width:0;}
  #riddle{flex:1;min-height:0;width:100%;position:relative;display:flex;align-items:center;justify-content:center;}
  #riddle img{max-height:100%;max-width:100%;border-radius:12px;object-fit:contain;box-shadow:0 3px 10px #0002;}
  #plabel{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:#57b33ae6;color:#fff;
    font-weight:900;padding:3px 14px;border-radius:999px;font-size:clamp(12px,3.4vmin,16px);display:none;
    white-space:nowrap;box-shadow:0 2px 8px #0003;}
  #plabel.on{display:block;}
  #dots{display:flex;gap:7px;padding:8px 0 2px;}
  .dot{width:11px;height:11px;border-radius:50%;background:#d7dbe6;cursor:pointer;transition:all .2s;border:none;padding:0;}
  .dot.act{transform:scale(1.45);}

  /* слоты ответа */
  #slots{display:flex;gap:6px;margin:12px 0 4px;z-index:3;min-height:40px;}
  .slot{width:clamp(30px,9vmin,44px);aspect-ratio:1;border-radius:10px;background:#ffffffcc;
    box-shadow:inset 0 2px 5px #0002;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:clamp(17px,5vmin,25px);color:#fff;transition:background .15s;}
  #slots.shake{animation:shk .4s;}
  @keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

  /* поле гексов */
  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  #board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center;}
  .hex{position:absolute;display:flex;align-items:center;justify-content:center;cursor:pointer;
    clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    font-weight:900;color:#8b93a8;transition:transform .12s;
    background:linear-gradient(180deg,#ffffff 0%,#e8ecf4 55%,#c9d0de 100%);}
  .hex:active{transform:scale(.93);}
  .hex.picked{color:#fff !important;}
  .hex.solved{color:#fff !important;cursor:default;animation:pop .35s;}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
  .hex.blocker{cursor:default;background:linear-gradient(180deg,#c98a4b,#8e5a28);}

  /* win-оверлей */
  #winOv{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:#0007;backdrop-filter:blur(2px);}
  #winOv.on{display:flex;}
  #winBox{background:#fff;border-radius:22px;padding:26px 30px;text-align:center;max-width:78%;
    box-shadow:0 20px 50px #0006;animation:winin .35s;}
  @keyframes winin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  #winBox .stars{font-size:34px;letter-spacing:4px;}
  #winBox h2{margin:8px 0 4px;color:#3c3c55;font-size:clamp(18px,5.4vmin,24px);}
  #winBox p{margin:0 0 16px;color:#8a8aa0;font-size:14px;}
  #btnNext{border:none;border-radius:14px;padding:13px 34px;font-weight:900;font-size:16px;color:#fff;
    cursor:pointer;background:linear-gradient(180deg,#8fdb5e,#57b33a);box-shadow:0 5px 0 #3d8a26;}
  #btnNext:active{transform:translateY(3px);box-shadow:0 2px 0 #3d8a26;}

  .conf{position:absolute;width:9px;height:13px;z-index:19;pointer-events:none;}
</style>
</head>

<div id="phone">
  <div id="bg"></div>

  <!-- карта уровней -->
  <div id="mapScr">
    <div class="mtitle">Word Crash</div>

    <div id="mapWrap">
      <svg id="mapSvg" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <!-- игра -->
  <div id="gameScr" style="display:none">
    <div id="hud">
      <button id="btnBack">‹</button>
      <div id="lvlName">Level 1</div>
      <div id="coins">🪙 150</div>
    </div>
    <div id="cardWrap">
      <button class="carr" id="arrL">‹</button>
      <div id="card"><div id="riddle"><img id="pimg" alt=""><div id="plabel"></div></div><div id="dots"></div></div>
      <button class="carr" id="arrR">›</button>
    </div>
    <div id="slots"></div>
    <div id="stage"><div id="board"></div></div>
  </div>

  <div id="winOv"><div id="winBox">
    <div class="stars">⭐⭐⭐</div><h2 id="winTitle"></h2><p id="winSub"></p>
    <button id="btnNext">Next</button>
  </div></div>
</div>

/* ============ УТИЛИТЫ ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const $=id=>document.getElementById(id);

/* спираль гекс-колец (axial, pointy-top) — компактная «капля» из N клеток */
function spiralCells(n){
  const cells=[{q:0,r:0}];
  const dirs=[[0,1],[-1,1],[-1,0],[0,-1],[1,-1],[1,0]]; // обход кольца против часовой
  let ring=1;
  while(cells.length<n){
    let q=ring,r=-ring; // угловая клетка кольца
    for(let d=0;d<6&&cells.length<n;d++)
      for(let s=0;s<ring&&cells.length<n;s++){ cells.push({q,r}); q+=dirs[d][0]; r+=dirs[d][1]; }
    ring++;
  }
  return cells;
}

let done=[false,false,false,false,false]; // пройденные уровни (сессия), все открыты сразу

/* ============ КАРТА ============ */
const NODE_POS=[[50,86],[26,70],[68,55],[32,40],[56,23]]; // % (x,y), L1 внизу
function showMap(){
  $('mapScr').style.display='flex'; $('gameScr').style.display='none';
  $('bg').style.background='radial-gradient(120% 90% at 50% 0%,#8ed0f5,#5aa8dd 55%,#3c7fb8)';
  const wrap=$('mapWrap'); wrap.querySelectorAll('.node').forEach(n=>n.remove());
  const svg=$('mapSvg'); const W=wrap.clientWidth,H=wrap.clientHeight;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const pts=NODE_POS.map(p=>[p[0]/100*W,p[1]/100*H]);
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){
    const [x0,y0]=pts[i-1],[x1,y1]=pts[i];
    d+=` C ${x0} ${(y0+y1)/2}, ${x1} ${(y0+y1)/2}, ${x1} ${y1}`;
  }
  svg.innerHTML=`<path d="${d}" fill="none" stroke="#ffffff88" stroke-width="10"
     stroke-linecap="round" stroke-dasharray="2 18"/>`;
  NODE_POS.forEach((p,i)=>{
    const n=document.createElement('div');
    const cur=done.findIndex(d=>!d);
    n.className='node '+(done[i]?'done':i===cur?'cur':'open');
    n.style.left=p[0]+'%'; n.style.top=p[1]+'%';
    n.innerHTML=(done[i]?'✓':i===cur?(i+1)+'<div class="play">PLAY</div>':(i+1));
    n.onclick=()=>startLevel(i);
    wrap.appendChild(n);
  });
}

/* ============ УРОВЕНЬ ============ */
function startLevel(i){
  L=i; busy=false;
  const lv=LEVELS[L];
  $('mapScr').style.display='none'; $('gameScr').style.display='flex';
  $('bg').style.background=lv.bg;
  $('lvlName').textContent=`Level ${L+1} · ${lv.theme}`;
  solved=lv.riddles.map(()=>false); active=0; picks=[];
  buildBoard(); renderCard(); renderSlots();
  requestAnimationFrame(fit);
}

function buildBoard(){
  const lv=LEVELS[L], rnd=mulberry32(L*999+7);
  const letters=lv.riddles.flatMap((r,wi)=>[...r.a].map(ch=>({ch,word:wi})));
  const nBlock=lv.blockers||0;
  const cells=spiralCells(letters.length+nBlock);
  // блокеры — у центра (индексы 1..) чтобы мешали визуально
  const blockIdx=new Set(); let bi=1;
  while(blockIdx.size<nBlock){ blockIdx.add(bi); bi+=3; }
  // перемешать буквы
  for(let i=letters.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[letters[i],letters[j]]=[letters[j],letters[i]];}
  const S=34; // размер гекса (полурадиус)
  const w=Math.sqrt(3)*S, h=2*S;
  const board=$('board'); board.innerHTML=''; tiles=[];
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9; const pos=[];
  cells.forEach(c=>{
    const x=w*(c.q+c.r/2), y=1.5*S*c.r;
    pos.push([x,y]);
    minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);
  });
  board.style.width=(maxX-minX+w)+'px'; board.style.height=(maxY-minY+h)+'px';
  let li=0;
  cells.forEach((c,ci)=>{
    const el=document.createElement('div');
    el.className='hex';
    el.style.width=(w-4)+'px'; el.style.height=(h-4)+'px';
    el.style.left=(pos[ci][0]-minX)+'px'; el.style.top=(pos[ci][1]-minY)+'px';
    el.style.fontSize=(S*.72)+'px';
    if(blockIdx.has(ci)){ el.classList.add('blocker'); el.textContent='🍪'; board.appendChild(el); return; }
    const t={...letters[li++],el,state:'free'};
    el.textContent=t.ch;
    el.onclick=()=>tapTile(t);
    tiles.push(t); board.appendChild(el);
  });
}

/* ============ КАРТОЧКА-ЗАГАДКА ============ */
function renderCard(){
  const lv=LEVELS[L];
  $('pimg').src=PICS[lv.riddles[active].pic];
  const lab=$('plabel');
  if(solved[active]){ lab.textContent='✓ '+(lv.riddles[active].disp||lv.riddles[active].a); lab.classList.add('on'); }
  else lab.classList.remove('on');
  const dots=$('dots'); dots.innerHTML='';
  lv.riddles.forEach((r,i)=>{
    const d=document.createElement('button');
    d.className='dot'+(i===active?' act':'');
    if(solved[i]) d.style.background=WORD_COLORS[i];
    else if(i===active) d.style.background='#8a90a5';
    d.onclick=()=>switchRiddle(i);
    dots.appendChild(d);
  });
}
function switchRiddle(i){
  if(busy||i===active) return;
  clearPicks(); active=i; renderCard(); renderSlots();
}
function nextUnsolved(from){
  const n=LEVELS[L].riddles.length;
  for(let k=1;k<=n;k++){ const i=(from+k)%n; if(!solved[i]) return i; }
  return -1;
}
$('arrL').onclick=()=>switchRiddle((active-1+LEVELS[L].riddles.length)%LEVELS[L].riddles.length);
$('arrR').onclick=()=>switchRiddle((active+1)%LEVELS[L].riddles.length);

/* ============ СЛОТЫ ============ */
function renderSlots(){
  const box=$('slots'); box.innerHTML='';
  const r=LEVELS[L].riddles[active];
  const len=r.a.length;
  // ужать слоты под длинные слова; разрыв 12px между словами двухсловного ответа
  const sw=Math.min(44,Math.max(24,Math.floor(($('gameScr').clientWidth*0.92-6*(len-1)-(r.gap?12:0))/len)));
  for(let i=0;i<len;i++){
    const s=document.createElement('div'); s.className='slot';
    s.style.width=s.style.height=sw+'px'; s.style.fontSize=Math.round(sw*.58)+'px';
    if(r.gap&&i===r.gap) s.style.marginLeft='12px';
    if(solved[active]){ s.textContent=r.a[i]; s.style.background=WORD_COLORS[active]; }
    else if(i<picks.length){ s.textContent=tiles[picks[i]].ch; s.style.background=WORD_COLORS[active]; }
    box.appendChild(s);
  }
}

/* ============ ИГРОВАЯ ЛОГИКА ============ */
function tapTile(t){
  if(busy||solved[active]) return;
  const idx=tiles.indexOf(t);
  if(t.state==='solved') return;
  if(t.state==='picked'){                 // снять выбор
    picks=picks.filter(p=>p!==idx);
    t.state='free'; t.el.classList.remove('picked'); t.el.style.background='';
    renderSlots(); return;
  }
  const need=LEVELS[L].riddles[active].a.length;
  if(picks.length>=need) return;
  t.state='picked'; t.el.classList.add('picked');
  t.el.style.background=WORD_COLORS[active];
  picks.push(idx); renderSlots();
  if(picks.length===need) checkWord();
}

function checkWord(){
  const word=picks.map(i=>tiles[i].ch).join('');
  const ans=LEVELS[L].riddles[active].a;
  busy=true;
  if(word===ans){
    picks.forEach(i=>{ const t=tiles[i]; t.state='solved'; t.el.classList.remove('picked');
      t.el.classList.add('solved'); t.el.style.background=WORD_COLORS[active]; });
    solved[active]=true; picks=[];
    renderCard(); renderSlots();
    if(solved.every(Boolean)){ setTimeout(win,1000); return; }   // пауза ~1с перед попапом
    setTimeout(()=>{ busy=false; switchTo(nextUnsolved(active)); },600);
  }else{
    $('slots').classList.add('shake');
    setTimeout(()=>{ $('slots').classList.remove('shake'); clearPicks(); renderSlots(); busy=false; },450);
  }
}
function switchTo(i){ if(i<0) return; active=i; renderCard(); renderSlots(); }
function clearPicks(){
  picks.forEach(i=>{ const t=tiles[i]; t.state='free'; t.el.classList.remove('picked'); t.el.style.background=''; });
  picks=[];
}

/* ============ ПОБЕДА ============ */
function win(){
  confetti();
  done[L]=true;
  const last=done.every(Boolean);
  $('winTitle').textContent=`Level ${L+1} complete!`;
  $('winSub').textContent=last?'All levels complete! 🎉':'Choose your next level on the map';
  $('btnNext').textContent=last?'To map':'Next';
  $('winOv').classList.add('on');
}
$('btnNext').onclick=()=>{ $('winOv').classList.remove('on'); showMap(); };
$('btnBack').onclick=()=>{ if(!busy) showMap(); };

function confetti(){
  const ph=$('phone');
  for(let i=0;i<18;i++){
    const c=document.createElement('div'); c.className='conf';
    c.style.background=WORD_COLORS[i%WORD_COLORS.length];
    c.style.left=(20+Math.random()*60)+'%'; c.style.top='-4%';
    c.style.borderRadius=Math.random()<.5?'50%':'2px';
    ph.appendChild(c);
    const fall=c.animate([
      {transform:`translateY(0) rotate(0deg)`,opacity:1},
      {transform:`translateY(${ph.clientHeight*1.1}px) rotate(${360+Math.random()*360}deg)`,opacity:.7}
    ],{duration:1400+Math.random()*800,easing:'ease-in'});
    fall.onfinish=()=>c.remove();
  }
}

/* ============ МАСШТАБ ПОЛЯ ============ */
function fit(){
  const stage=$('stage'), board=$('board');
  if(!board.offsetWidth||$('gameScr').style.display==='none') return;
  const sw=stage.clientWidth-24, sh=stage.clientHeight-24;
  const s=Math.max(.4,Math.min(sw/board.offsetWidth,sh/board.offsetHeight,1.4));
  board.style.transform=`translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize',()=>{fit(); if($('mapScr').style.display!=='none') showMap();});

showMap();

/* хук для авто-проверки (PLAY-verify) */
window.__game={ get tiles(){return tiles}, get picks(){return picks}, get solved(){return solved},
  get active(){return active}, get progress(){return done.filter(Boolean).length}, get done(){return done},
  get level(){return L}, startLevel, LEVELS };
</script>
