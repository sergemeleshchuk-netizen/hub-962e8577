function isComplete(box, cap) { return box.length === cap && box.every(c => c === box[0]); }
function canPark(box, color, cap) {
  if (isComplete(box, cap)) return false;
  if (box.length >= cap) return false;
  return box.length === 0 || box[box.length - 1] === color;
}
function topGroup(box) {
  if (!box.length) return null;
  const color = box[box.length - 1];
  let size = 0;
  for (let i = box.length - 1; i >= 0 && box[i] === color; i--) size++;
  return { color, size };
}
// приоритет парковки (как в v7): сперва загон с СОВПАДАЮЩИМ верхним цветом,
// потом первый пустой.
function pickDest(boxes, src, color, cap) {
  const n = boxes.length;
  for (let d = 1; d <= n; d++) {
    const j = (src + d) % n, b = boxes[j];
    if (b.length > 0 && b.length < cap && b[b.length - 1] === color) return j;
  }
  for (let d = 1; d <= n; d++) {
    const j = (src + d) % n;
    if (boxes[j].length === 0) return j;
  }
  return -1;
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

let ring = { x0: 36, y0: 226, x1: W - 36, y1: 436, r: 26 };
let PATH = null;
function ringPath() {
  const { x0, y0, x1, y1, r } = ring;
  const arc = Math.PI * r / 2;
  const segs = [
    { type: 'h', x: x0 + r, y: y0, len: (x1 - r) - (x0 + r), dir: 1 },
    { type: 'a', cx: x1 - r, cy: y0 + r, a0: -Math.PI / 2, len: arc },
    { type: 'v', x: x1, y: y0 + r, len: (y1 - r) - (y0 + r), dir: 1 },
    { type: 'a', cx: x1 - r, cy: y1 - r, a0: 0, len: arc },
    { type: 'h', x: x1 - r, y: y1, len: (x1 - r) - (x0 + r), dir: -1 },
    { type: 'a', cx: x0 + r, cy: y1 - r, a0: Math.PI / 2, len: arc },
    { type: 'v', x: x0, y: y1 - r, len: (y1 - r) - (y0 + r), dir: -1 },
    { type: 'a', cx: x0 + r, cy: y0 + r, a0: Math.PI, len: arc },
  ];
  let acc = 0;
  for (const s of segs) { s.start = acc; acc += s.len; }
  return { segs, total: acc };
}
function pointAt(s) {
  s = ((s % PATH.total) + PATH.total) % PATH.total;
  for (const seg of PATH.segs) {
    if (s <= seg.start + seg.len) {
      const t = s - seg.start;
      if (seg.type === 'h') return { x: seg.x + seg.dir * t, y: seg.y };
      if (seg.type === 'v') return { x: seg.x, y: seg.y + seg.dir * t };
      const a = seg.a0 + t / seg.len * Math.PI / 2;
      return { x: seg.cx + ring.r * Math.cos(a), y: seg.cy + ring.r * Math.sin(a) };
    }
  }

}
function dirAt(s) { const a = pointAt(s - 4), b = pointAt(s + 4); return Math.atan2(b.y - a.y, b.x - a.x); }
function nearestS(px, py) {
  let best = 0, bd = 1e9, N = 720;
  for (let i = 0; i < N; i++) {
    const s = i / N * PATH.total, p = pointAt(s);
    const d = (p.x - px) ** 2 + (p.y - py) ** 2;
    if (d < bd) { bd = d; best = s; }

}

const VW = 64, VH = 120, HW = 92, HHt = 54, PAD = 6;
function vp(x, y, gate) { return { x, y, w: VW, h: VH, gate }; }   // ворота 'up'|'down'
function hp(x, y, gate) { return { x, y, w: HW, h: HHt, gate }; }  // ворота 'left'|'right'
function isVert(p) { return p.gate === 'up' || p.gate === 'down'; }
function penGeom(p) {
  if (isVert(p)) return { cw: (p.w - 2 * PAD) / 2, ch: (p.h - 2 * PAD) / 4 };
  return { cw: (p.w - 2 * PAD) / 4, ch: (p.h - 2 * PAD) / 2 };
}
function penSheepScale(p) { const g = penGeom(p); return Math.min(g.cw, g.ch) / 23; }
function gatePoint(p) {
  if (p.gate === 'down') return { x: p.x + p.w / 2, y: p.y + p.h };
  if (p.gate === 'up') return { x: p.x + p.w / 2, y: p.y };
  if (p.gate === 'right') return { x: p.x + p.w, y: p.y + p.h / 2 };
  return { x: p.x, y: p.y + p.h / 2 };
}
// k = расстояние от ворот в «парах» (k=0 — у ворот, верх стопки). Возвращает центр ячейки.
function cellForK(p, k) {
  const g = penGeom(p), dg = Math.floor(k / 2), lane = k % 2;
  if (isVert(p)) {
    const x = p.x + PAD + lane * g.cw + g.cw / 2;
    const y = p.gate === 'down'
      ? p.y + p.h - PAD - dg * g.ch - g.ch / 2
      : p.y + PAD + dg * g.ch + g.ch / 2;
    return { x, y };
  }
  const y = p.y + PAD + lane * g.ch + g.ch / 2;
  const x = p.gate === 'right'
    ? p.x + p.w - PAD - dg * g.cw - g.cw / 2
    : p.x + PAD + dg * g.cw + g.cw / 2;
  return { x, y };
}

    case 1: return { ring: { x0: 112, y0: 206, x1: 278, y1: 454, r: 30 },
      pens: [vp(163, 78, 'down'), hp(292, 248, 'left'), vp(163, 478, 'up'), hp(6, 332, 'right')] };
    case 2: return { ring: { x0: 132, y0: 116, x1: 282, y1: 548, r: 30 },
      pens: [hp(290, 150, 'left'), hp(290, 305, 'left'), hp(290, 458, 'left'),
             hp(8, 458, 'right'), hp(8, 150, 'right')] };
    case 3: return { ring: { x0: 62, y0: 236, x1: 328, y1: 438, r: 30 },
      pens: [vp(70, 96, 'down'), vp(256, 96, 'down'), hp(296, 314, 'left'),
             vp(163, 472, 'up'), hp(2, 314, 'right')] };
    case 4: return { ring: { x0: 104, y0: 208, x1: 286, y1: 470, r: 32 },
      pens: [vp(70, 80, 'down'), vp(256, 80, 'down'), hp(296, 232, 'left'), hp(296, 388, 'left'),
             vp(256, 492, 'up'), vp(70, 492, 'up'), hp(2, 312, 'right')] };
  }
}

// ---------- состояние игры ----------
let lvlIdx = 0, boxes = [], spec = null, pens = [], docks = [];
let flocks = [];           // активные стада с собаками
let dogsTotal = 3, dogsFree = 3;
let over = false, won = false, tapped = false;
let wolf = null;           // патрульный волк на кольце: { s, dist }
let wolfCooldown = 0;      // сек до следующего выхода волка
let wolfEnabled = false;   // волк появляется только с 3-го уровня
let stranded = [];         // овцы без собаки: убегают по кольцу, их может догнать волк
let flockSeq = 0;
const GAP = 26, SPEED = 150, WIN_DELAY = 1000, RETURN_T = 0.45;
const WOLF_MULT = 2, WOLF_COOLDOWN = 3, CATCH_DIST = 15;

function buildGeo(n) {
  const g = GEOS(n);
  ring = g.ring; PATH = ringPath();
  pens = g.pens.map(p => ({ ...p }));
  docks = pens.map(p => { const gp = gatePoint(p); return nearestS(gp.x, gp.y); });
}
function ringCenter() { return { x: (ring.x0 + ring.x1) / 2, y: (ring.y0 + ring.y1) / 2 }; }

function load(n) {
  lvlIdx = n; over = false; won = false; tapped = false;
  flocks = []; wolf = null; wolfCooldown = 0; stranded = []; flockSeq = 0;
  wolfEnabled = n >= 2; // волк — с 3-го уровня (индекс 2)
  spec = LEVELS[n].spec;
  boxes = spec.boxes.map(b => b.slice());
  dogsTotal = LEVELS[n].dogs || 3; dogsFree = dogsTotal;
  buildGeo(n);
  document.getElementById('overlay').style.display = 'none';
  document.querySelectorAll('#bar button[data-lvl]').forEach((el, i) =>
    el.classList.toggle('active', i === n));
  updateHand();
}

// раздать пункты назначения всем овечкам в пути (учитываем уже летящих)
function assignDests() {
  const cap = spec.cap;
  const sim = boxes.map(b => b.slice());
  const pending = [];
  for (const f of flocks) {
    if (f.state !== 'leading') continue;
    for (const s of f.sheep) if (!s.parked) { s.dest = null; pending.push({ s, src: f.src }); }
  }
  let changed = true;
  while (changed) {
    changed = false;
    for (const p of pending) {
      if (p.s.dest !== null) continue;
      const j = pickDest(sim, p.src, p.s.color, cap);
      if (j !== -1) { p.s.dest = j; sim[j].push(p.s.color); changed = true; }
    }
  }
}

function tapPen(i) {
  if (over) return false;
  const b = boxes[i];
  if (!b.length || isComplete(b, spec.cap)) return false;
  if (dogsFree <= 0) { showToast('🐕 Нет свободных собак — подожди!'); return false; }
  const g = topGroup(b);
  for (let k = 0; k < g.size; k++) b.pop();
  dogsFree--;
  const headS0 = docks[i] + 10;
  const f = {
    id: ++flockSeq, src: i, headS: headS0, dist: 0, state: 'leading', retT: 0,
    span: g.size * GAP,
    sheep: [], dogPt: null,
  };
  for (let k = 0; k < g.size; k++) {
    const offset = (k + 1) * GAP;
    f.sheep.push({ color: g.color, offset, dest: null, parked: false, s: headS0 - offset, prev: null });
  }
  flocks.push(f);
  tapped = true; updateHand();
  assignDests();
  return true;
}

function showToast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function finish(win) {
  if (over && win === false && !won) { /* проигрыш уже идёт */ }
  over = true; won = win; updateHand();
  if (win) setTimeout(() => showResult(true), WIN_DELAY);
}
function showResult(win) {
  const ov = document.getElementById('overlay');
  document.getElementById('ovTitle').textContent = win
    ? 'Все овечки дома! 🎉🐑'
    : '🐺 Волк добрался до брошенных овечек!';
  const btn = document.getElementById('ovBtn');
  btn.textContent = win ? (lvlIdx + 1 < LEVELS.length ? 'Дальше' : 'Сначала') : 'Ещё раз';
  btn.className = win ? '' : 'retry';
  btn.onclick = () => load(win ? (lvlIdx + 1) % LEVELS.length : lvlIdx);
  ov.style.display = 'flex';
}

// один шаг симуляции
function step(dt) {
  nowT += dt;
  if (over) return;
  const sp = SPEED * dt;
  let parked = false;

  for (const f of flocks) {
    if (f.state === 'returning') { f.retT += dt; continue; }
    if (f.state !== 'leading') continue;
    f.headS += sp; f.dist += sp;
    for (const s of f.sheep) {
      if (s.parked) continue;
      s.prev = s.s; s.s = f.headS - s.offset;
      if (s.dest === null) continue;
      const d = docks[s.dest];
      const a = ((s.prev % PATH.total) + PATH.total) % PATH.total;
      const bb = ((s.s % PATH.total) + PATH.total) % PATH.total;
      const crossed = a <= bb ? (d > a && d <= bb) : (d > a || d <= bb);
      if (!crossed) continue;
      // нельзя ВЕРНУТЬ овец в тот же загон, из которого забрали, не сделав круг
      if (s.dest === f.src && f.dist < PATH.total * 0.55) continue;
      // как в v7: не занимаем пустой загон, если есть подходящий цветной
      if (boxes[s.dest].length === 0) {
        const better = pickDest(boxes, f.src, s.color, spec.cap);
        if (better !== -1 && boxes[better].length > 0) { s.dest = better; continue; }
      }
      if (canPark(boxes[s.dest], s.color, spec.cap)) {
        boxes[s.dest].push(s.color); s.parked = true; parked = true;
      }
    }
    const left = f.sheep.filter(s => !s.parked);
    if (left.length === 0) {
      // всё стадо устроено → собака бежит обратно в будку
      f.state = 'returning'; f.retT = 0; f.dogPt = pointAt(f.headS);
    } else {
      // брошены только те, кому ВООБЩЕ нет дома (dest=null); кто едет в свой
      // загон после круга (dest=src) — ждём, они доедут.
      const homeless = left.filter(s => s.dest === null);
      if (homeless.length && f.dist >= PATH.total) strand(f, homeless);
    }
  }

  if (parked) assignDests();

  // убрать собак, добежавших до будки
  for (let i = flocks.length - 1; i >= 0; i--) {
    const f = flocks[i];
    if (f.state === 'returning' && f.retT >= RETURN_T) {
      flocks.splice(i, 1); dogsFree = Math.min(dogsTotal, dogsFree + 1);
    }
  }

  // овцы без собаки убегают и могут самоустроиться; волк патрулирует
  updateStranded(dt);
  updateWolf(dt);

  // победа: нет активных стад, нет брошенных овец, все загоны собраны/пусты
  const active = flocks.some(f => f.state === 'leading');
  if (!over && !active && !stranded.length && boxes.every(b => !b.length || isComplete(b, spec.cap))) finish(true);
}

// собака сделала круг и не пристроила овец → уходит домой, овцы остаются БЕЗ собаки
function strand(f, homeless) {
  f.state = 'returning'; f.retT = 0; f.dogPt = pointAt(f.headS);
  for (const s of homeless) {
    stranded.push({ color: s.color, src: f.src, s: s.s, prev: s.s });
    s.parked = true; // вынуть из активного стада, чтобы собака могла уйти
  }
  showToast('🐑 Овечки остались без собаки!');
}

// брошенные овцы медленно бредут по кольцу и могут сами зайти в открывшийся загон (спасение)
function updateStranded(dt) {
  if (!stranded.length) return;
  const sp = SPEED * dt;
  for (let i = stranded.length - 1; i >= 0; i--) {
    const st = stranded[i];
    st.prev = st.s; st.s += sp;
    const j = pickDest(boxes, st.src, st.color, spec.cap);
    if (j === -1) continue;
    const d = docks[j];
    const a = ((st.prev % PATH.total) + PATH.total) % PATH.total;
    const bb = ((st.s % PATH.total) + PATH.total) % PATH.total;
    const crossed = a <= bb ? (d > a && d <= bb) : (d > a || d <= bb);
    if (crossed && canPark(boxes[j], st.color, spec.cap)) {
      boxes[j].push(st.color); stranded.splice(i, 1);
    }
  }
}

// волк (с 3-го ур.): появляется, когда есть овцы без собаки; делает ОДИН круг
// на 2× скорости. Догоняет бегущую овцу (closing rate 1×) → ловит ≈ если она
// в пределах полукруга впереди от точки спавна → ~50/50 при случайном спавне.
// Не догнал за круг → ушёл, через WOLF_COOLDOWN сек может появиться снова.
function updateWolf(dt) {
  if (!wolfEnabled) return;
  if (!wolf) {
    if (!stranded.length) { wolfCooldown = 0; return; }
    if (wolfCooldown > 0) { wolfCooldown -= dt; return; }
    wolf = { s: Math.random() * PATH.total, dist: 0 };
    showToast('🐺 Волк вышел на охоту!');
    return;
  }
  const sp = WOLF_MULT * SPEED * dt;
  wolf.s += sp; wolf.dist += sp;
  for (const st of stranded) {
    const gap = (((st.s - wolf.s) % PATH.total) + PATH.total) % PATH.total;
    if (gap <= CATCH_DIST) { loseToWolf(); return; }
  }
  if (wolf.dist >= PATH.total) { wolf = null; wolfCooldown = WOLF_COOLDOWN; }
}

function loseToWolf() {
  over = true; won = false; updateHand();
  showToast('🐺 Волк поймал овечку!');
  setTimeout(() => showResult(false), 800); // дать увидеть момент поимки
}

// ---------- рука-подсказка ----------
function updateHand() {
  if (lvlIdx === 0 && !tapped && !over) showHand(0);
  else hideHand();
}
function showHand(boxIndex) {
  const L = pens[boxIndex]; if (!L) return;
  const scale = cv.clientWidth / W;
  hand.style.left = (cv.offsetLeft + (L.x + L.w / 2) * scale - 8) + 'px';
  hand.style.top = (cv.offsetTop + (L.y + L.h / 2) * scale - 4) + 'px';
  hand.style.opacity = 1; hand.classList.add('tap');
}
function hideHand() { hand.style.opacity = 0; hand.classList.remove('tap'); }
window.addEventListener('resize', updateHand);

// ---------- отрисовка ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// овечка, окрашенная в цвет (адаптировано из shepherds-dog v13)
function drawSheepAt(cx, cy, s, col, dir = 0, danger = false) {
  const img = SHEEP_IMG[col];
  if (!(img && img.complete && img.naturalWidth)) return drawSheepVec(cx, cy, s, col, dir, danger);
  const h = s * 24, w = h * img.naturalWidth / img.naturalHeight;
  ctx.fillStyle = 'rgba(30,40,20,.20)';
  ctx.beginPath(); ctx.ellipse(cx, cy + h * 0.40, w * 0.40, h * 0.15, 0, 0, TAU); ctx.fill();
  if (danger) { const g = 0.5 + 0.5 * Math.sin(frameN * 0.3); ctx.save(); ctx.shadowColor = '#ff3b2e'; ctx.shadowBlur = 14 + 10 * g; ctx.fillStyle = 'rgba(255,59,46,' + (0.25 + 0.3 * g) + ')'; ctx.beginPath(); ctx.arc(cx, cy, w * 0.5, 0, TAU); ctx.fill(); ctx.restore(); }
  ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
}
function drawSheepVec(cx, cy, s, col, dir = 0, danger = false) {
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(30,40,20,.18)';
  ctx.beginPath(); ctx.ellipse(0, 11 * s, 12 * s, 4.5 * s, 0, 0, TAU); ctx.fill();
  if (dir) ctx.rotate(dir);
  if (danger) {
    const g = 0.5 + 0.5 * Math.sin(frameN * 0.3);
    ctx.save(); ctx.shadowColor = '#ff3b2e'; ctx.shadowBlur = 12 + 8 * g;
    ctx.fillStyle = 'rgba(255,59,46,' + (0.2 + 0.25 * g) + ')';
    ctx.beginPath(); ctx.arc(0, 0, 13 * s, 0, TAU); ctx.fill(); ctx.restore();
  }
  // ножки
  ctx.fillStyle = '#5b4636';
  for (const lx of [-5 * s, 4 * s]) { rr(lx, 5 * s, 2.6 * s, 6 * s, 1.3 * s); ctx.fill(); }
  const bumps = [[-7, -4, 7], [-8, 2, 6.5], [-3, 5, 7], [3, 5, 7], [7, 2, 7], [6, -4, 6.5], [1, -6, 7], [-1, 0, 9]];
  ctx.fillStyle = shade(col, -22);
  for (const [dx, dy, r] of bumps) { ctx.beginPath(); ctx.arc(dx * s, dy * s + 1, r * s, 0, TAU); ctx.fill(); }
  ctx.fillStyle = col;
  for (const [dx, dy, r] of bumps) { ctx.beginPath(); ctx.arc(dx * s, dy * s, r * s * 0.93, 0, TAU); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.arc(-2 * s, -3 * s, 3.2 * s, 0, TAU); ctx.fill();
  // мордочка
  ctx.fillStyle = '#46392f'; ctx.beginPath(); ctx.ellipse(9 * s, 0, 6 * s, 5 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3a2f27';
  ctx.beginPath(); ctx.ellipse(6.5 * s, -5 * s, 3 * s, 1.8 * s, -0.7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6.5 * s, 5 * s, 3 * s, 1.8 * s, 0.7, 0, TAU); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(5.5 * s, 0, 3.2 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(11 * s, -2 * s, 1.5 * s, 0, TAU); ctx.arc(11 * s, 2 * s, 1.5 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1c150f';
  ctx.beginPath(); ctx.arc(11.5 * s, -2 * s, 0.8 * s, 0, TAU); ctx.arc(11.5 * s, 2 * s, 0.8 * s, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawDogAt(cx, cy, s, dir) {
  const BR = '#a4651f', BRD = '#73430f', WH = '#fbf3e2';
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(20,28,12,.26)'; ctx.beginPath(); ctx.ellipse(0, 11 * s, 16 * s, 6 * s, 0, 0, TAU); ctx.fill();
  ctx.rotate(dir);
  ctx.strokeStyle = BR; ctx.lineWidth = 5.5 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-12 * s, 0); ctx.quadraticCurveTo(-20 * s, -4 * s, -22 * s, -10 * s); ctx.stroke();
  ctx.fillStyle = BR; ctx.strokeStyle = BRD; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, 14 * s, 9 * s, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = WH; ctx.beginPath(); ctx.ellipse(2 * s, 3 * s, 9 * s, 5 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = BR; ctx.beginPath(); ctx.ellipse(-1 * s, -3.5 * s, 10 * s, 4.5 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = BR; ctx.beginPath(); ctx.ellipse(12 * s, 0, 8 * s, 7 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = BRD;
  ctx.beginPath(); ctx.moveTo(8 * s, -6 * s); ctx.lineTo(5 * s, -12 * s); ctx.lineTo(12 * s, -7 * s); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(8 * s, 6 * s); ctx.lineTo(5 * s, 12 * s); ctx.lineTo(12 * s, 7 * s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = WH;
  ctx.beginPath(); ctx.ellipse(17 * s, 0, 6 * s, 4 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#23150b'; ctx.beginPath(); ctx.arc(21 * s, 0, 2 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(14 * s, -3 * s, 1.6 * s, 0, TAU); ctx.arc(14 * s, 3 * s, 1.6 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = '#0f0c08'; ctx.beginPath(); ctx.arc(15 * s, -3 * s, 0.9 * s, 0, TAU); ctx.arc(15 * s, 3 * s, 0.9 * s, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawWolfAt(cx, cy, s, dir) {
  const GR = '#4d535d', GRD = '#2c3036', BELLY = '#8b919b';
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(15,20,28,.30)'; ctx.beginPath(); ctx.ellipse(0, 13 * s, 20 * s, 7 * s, 0, 0, TAU); ctx.fill();

  ctx.fillStyle = GR; ctx.strokeStyle = GRD; ctx.lineWidth = 2;

  ctx.fillStyle = GRD; ctx.beginPath(); ctx.ellipse(-2 * s, -4.5 * s, 12 * s, 5 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = GR; ctx.beginPath(); ctx.ellipse(14 * s, 0, 8 * s, 7 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = GRD;
  ctx.beginPath(); ctx.moveTo(10 * s, -5 * s); ctx.lineTo(8 * s, -14 * s); ctx.lineTo(15 * s, -7 * s); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10 * s, 5 * s); ctx.lineTo(8 * s, 14 * s); ctx.lineTo(15 * s, 7 * s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = GR; ctx.beginPath(); ctx.ellipse(21 * s, 0, 6 * s, 4 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#15120e'; ctx.beginPath(); ctx.arc(26 * s, 0, 2 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f5d23a';
  ctx.beginPath(); ctx.ellipse(16 * s, -3 * s, 1.8 * s, 1.3 * s, -0.3, 0, TAU);

  ctx.fillStyle = '#1c150f'; ctx.beginPath(); ctx.arc(17 * s, -3 * s, 0.8 * s, 0, TAU); ctx.arc(17 * s, 3 * s, 0.8 * s, 0, TAU); ctx.fill();
  ctx.restore();
}

// будка с собаками в центре кольца (свободный ресурс)
function drawKennel() {
  const c = ringCenter(), cxc = c.x, cyc = c.y;
  const narrow = (ring.x1 - ring.x0) < 200;
  const slotGap = narrow ? 30 : 40, dscale = narrow ? 0.72 : 0.85;
  const totalW = (dogsTotal - 1) * slotGap;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3f5a28'; ctx.font = 'bold ' + (narrow ? 12 : 13) + 'px sans-serif';
  ctx.fillText('🏠 Будка', cxc, cyc - 26);
  for (let i = 0; i < dogsTotal; i++) {
    const x = cxc - totalW / 2 + i * slotGap, y = cyc + 2;
    ctx.fillStyle = 'rgba(60,80,40,.30)';
    ctx.beginPath(); ctx.arc(x, y + 6, narrow ? 14 : 17, 0, TAU); ctx.fill();
    if (i < dogsFree) drawDogAt(x, y, dscale, 0);
  }
  ctx.fillStyle = dogsFree > 0 ? '#2c3f1a' : '#b4281c';
  ctx.font = 'bold ' + (narrow ? 13 : 15) + 'px sans-serif';
  ctx.fillText('🐕 свободно: ' + dogsFree + '/' + dogsTotal, cxc, cyc + 32);
  ctx.textAlign = 'left';
}

function draw() {
  frameN++;
  ctx.clearRect(0, 0, W, H);
  // трава с пятнами
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#9ccb71'); grad.addColorStop(1, '#7faa54');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.10;
  for (let i = 0; i < 22; i++) {
    const x = (i * 97) % W, y = (i * 173) % H, r = 30 + (i * 37) % 60;
    ctx.fillStyle = i % 2 ? '#5f8533' : '#bfe08a';
    ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.6, 0, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // дорога-тропа
  ctx.lineWidth = 36; ctx.strokeStyle = '#c8a06a'; ctx.lineCap = 'round';
  rr(ring.x0, ring.y0, ring.x1 - ring.x0, ring.y1 - ring.y0, ring.r); ctx.stroke();
  ctx.lineWidth = 30; ctx.strokeStyle = '#d8b67e';
  rr(ring.x0, ring.y0, ring.x1 - ring.x0, ring.y1 - ring.y0, ring.r); ctx.stroke();
  ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff66'; ctx.setLineDash([9, 13]);
  rr(ring.x0, ring.y0, ring.x1 - ring.x0, ring.y1 - ring.y0, ring.r); ctx.stroke();
  ctx.setLineDash([]);

  // загоны (тропки рисуем до будки, чтобы будка была сверху)
  pens.forEach((p, i) => {
    const gp = gatePoint(p), dp = pointAt(docks[i]);
    ctx.strokeStyle = '#c8a06a'; ctx.lineWidth = 16; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(gp.x, gp.y); ctx.lineTo(dp.x, dp.y); ctx.stroke();
  });

  // будка собак
  drawKennel();

  // загоны
  pens.forEach((p, i) => {
    const b = boxes[i], done = isComplete(b, spec.cap), sc = penSheepScale(p);
    ctx.fillStyle = done ? '#caa84f' : '#a9763f';
    rr(p.x - 3, p.y - 3, p.w + 6, p.h + 6, 12); ctx.fill();
    ctx.fillStyle = done ? '#e7f3c8' : '#cfe6a6';
    rr(p.x, p.y, p.w, p.h, 9); ctx.fill();
    // пустые ячейки (от ворот вглубь) — метки
    for (let k = b.length; k < spec.cap; k++) {
      const c = cellForK(p, k);
      ctx.fillStyle = 'rgba(90,110,55,.18)';
      ctx.beginPath(); ctx.ellipse(c.x, c.y + 3, 8 * sc, 3 * sc, 0, 0, TAU); ctx.fill();
    }
    // овечки: stackIdx 0 = низ (далеко от ворот), верх стопки — у ворот
    for (let si = 0; si < b.length; si++) {
      const k = b.length - 1 - si;
      const c = cellForK(p, k);
      drawSheepAt(c.x, c.y, sc, COLOR_HEX[b[si]], 0);
    }
    if (done) {
      ctx.fillStyle = '#3f7a1f'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('✓', p.x + p.w / 2, p.y + p.h / 2 + 8); ctx.textAlign = 'left';
    }
  });

  // стада на дороге (собака впереди + овечки сзади, мордой по ходу движения)
  const home = ringCenter();
  for (const f of flocks) {
    for (const s of f.sheep) {
      if (s.parked) continue;
      const p = pointAt(s.s);
      const danger = (over && !won) && s.dest === null;
      drawSheepAt(p.x, p.y, 1.25, COLOR_HEX[s.color], dirAt(s.s), danger);
    }
    if (f.state === 'returning') {
      const k = Math.min(1, f.retT / RETURN_T);
      const from = f.dogPt || pointAt(f.headS);
      const dx = home.x - from.x, dy = home.y - from.y;
      drawDogAt(from.x + dx * k, from.y + dy * k, 1.0, Math.atan2(dy, dx));
    } else {
      const p = pointAt(f.headS);
      drawDogAt(p.x, p.y, 1.05, dirAt(f.headS));
    }
  }

  // убегающие овцы без собаки (тревога) + волк на кольце
  for (const st of stranded) {
    const p = pointAt(st.s);
    drawSheepAt(p.x, p.y, 1.25, COLOR_HEX[st.color], dirAt(st.s), true);
  }
  if (wolf) { const p = pointAt(wolf.s); drawWolfAt(p.x, p.y, 1.08, dirAt(wolf.s)); }

  // заголовок
  ctx.fillStyle = '#2c3f1a'; ctx.font = 'bold 17px sans-serif';
  ctx.fillText(LEVELS[lvlIdx].name + ' · 🐑 Овечий Сорт', 14, 26);
}

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width), y = (e.clientY - r.top) * (H / r.height);
  pens.forEach((p, i) => {
    if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) tapPen(i);
  });
});

// панель уровней
const bar = document.getElementById('bar');
LEVELS.forEach((l, i) => {
  const b = document.createElement('button');
  b.dataset.lvl = i; b.textContent = (i + 1);
  b.onclick = () => load(i);
  bar.appendChild(b);
});
const rb = document.createElement('button');
rb.textContent = '↻ заново'; rb.onclick = () => load(lvlIdx);
bar.appendChild(rb);

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  step(dt); draw(); requestAnimationFrame(frame);
}
load(0);
requestAnimationFrame(frame);

// хуки для автопрогона
window.__game = {
  load, tapPen,
  step: (dt) => step(dt),
  tick: (n, dt = 0.05) => { for (let k = 0; k < n; k++) step(dt); },
  flockCount: () => flocks.length,
  dogsFree: () => dogsFree,
  boxesState: () => boxes.map(b => b.join('')),
  isOver: () => over,
  isWon: () => won,
  strandedCount: () => stranded.length,
  wolfOn: () => !!wolf,
  hasWolf: () => !!wolf || stranded.length > 0,
  title: () => document.getElementById('ovTitle').textContent,
  overlayShown: () => document.getElementById('overlay').style.display === 'flex',
  // тест: одна убегающая овца, волк со случайного спавна, ОДИН круг → 'catch'|'escape'
  _wolfTrial: () => {
    let s = PATH.total * 0.5, ws = Math.random() * PATH.total, dist = 0;
    const dt = 0.02;
    while (true) {
      s += SPEED * dt;
      ws += WOLF_MULT * SPEED * dt; dist += WOLF_MULT * SPEED * dt;
      const gap = (((s - ws) % PATH.total) + PATH.total) % PATH.total;
      if (gap <= CATCH_DIST) return 'catch';
      if (dist >= PATH.total) return 'escape';
    }
  },
};
</script>
