<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Smash Fest — v13</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:#7ec8f7;}
  @media (max-aspect-ratio:1/1){
    #phone{width:100vw;height:100dvh;border-radius:0;}
  }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }
  #cv{position:absolute;inset:0;width:100%;height:100%;z-index:1;}

  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
       align-items:flex-start;padding:12px 12px 0;z-index:3;pointer-events:none;}
  .plate{background:linear-gradient(#4a8de0,#2c5fc2);border:3px solid #17408f;border-radius:13px;
         box-shadow:0 3px 0 #17408f,inset 0 2px 3px rgba(255,255,255,.35);
         color:#fff;text-align:center;padding:3px 12px 5px;min-width:84px;}
  .plate .lbl{font-size:12px;font-weight:800;background:linear-gradient(#5aa4f0,#3b74d4);
         border:2px solid #1c4a9e;border-radius:9px;padding:1px 9px;margin-top:-14px;display:inline-block;
         box-shadow:0 2px 0 rgba(0,0,0,.2);}
  .plate .val{font-size:26px;font-weight:900;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.25);}

  #ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
      background:rgba(10,18,40,.55);opacity:0;pointer-events:none;transition:opacity .25s;}
  #ov.show{opacity:1;pointer-events:auto;}
  .card{width:78%;max-width:340px;background:linear-gradient(#2f6ad0,#2456b4);border:6px solid #f4b62d;
        border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:0 18px 22px;
        transform:translateY(12px) scale(.96);transition:transform .25s;}
  #ov.show .card{transform:translateY(0) scale(1);}
  .chead{margin:-24px auto 14px;width:86%;background:linear-gradient(#57a2ef,#2f6ad0);
        border:4px solid #f4b62d;border-radius:16px;text-align:center;color:#fff;
        font-size:32px;font-weight:900;padding:8px 6px;text-shadow:0 2px 0 rgba(20,50,120,.6);}
  .cbody{background:#fdeee0;border-radius:14px;color:#7a5a3a;text-align:center;
        font-size:17px;font-weight:700;padding:18px 12px;line-height:1.45;}
  .cbody .big{font-size:40px;line-height:1.1;}
  .btn{display:block;margin:18px auto 0;width:78%;padding:12px 0 14px;font-size:26px;font-weight:900;
       color:#fff;text-shadow:0 2px 0 rgba(0,60,0,.35);cursor:pointer;
       background:linear-gradient(#8fdc3f,#4cae19);border:4px solid #2e7a0d;border-radius:18px;
       box-shadow:0 5px 0 #2e7a0d,inset 0 3px 4px rgba(255,255,255,.45);}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2e7a0d;}
</style>
</head>
<body>
<div id="phone">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="plate"><span class="lbl">Balls</span><div class="val" id="hballs">0</div></div>
    <div class="plate"><span class="lbl">Level</span><div class="val" id="hlevel">1</div></div>
  </div>
  <div id="ov"><div class="card">
    <div class="chead" id="ptitle">Level 1</div>
    <div class="cbody" id="pmsg"></div>
    <button class="btn" id="pbtn">Play</button>
  </div></div>
</div>

<script>
'use strict';
const {Engine,Bodies,Body,Composite,Sleeping,Events} = Matter;

/* ===== v13 «Aim»: арт целиком из референс-картинки (фон, банки, шар — вырезки
   из одного JPEG), механика ПРОСТАЯ: тянешь палец — видна пунктирная траектория
   от шара до пирамиды, отпустил — шар катится по дорожке по этой линии и
   врезается в банки. Банка от удара бьётся сразу (краска проливается на песок).
   Никакой доп. механики. ===== */
const W=720,H=1280,CX=360;

/* картинка 853×1844 → мир: масштаб IS, сдвиг IOY (верх с нарисованным HUD обрезан) */
const IMG_W=853,IMG_H=1844,IS=W/IMG_W,IOY=-200;

const GROUND_Y=655;                            // песок: на нём стоит пирамида
const JW=76,JH=124,STEPX=88;                   // банка (как на картинке) / шаг ряда
const BALL_R=28;                               // физический шар
const REST={x:CX,y:960};                       // шар ждёт на дорожке (как на картинке)
const REST_R=46;                               // его видимый радиус на дорожке
const BALL_V=30;
const CAT_JAR=1,CAT_BALL=4,CAT_GROUND=8;

/* вырезки из картинки: банки по цветам (нижний ряд + чёрная), шар */
const JAR_SRC={          // тело банки ~73px, шаг ряда 101px (замерено по пикселям)
  P:[123,872,81,120], G:[224,872,81,120], B:[325,872,81,120],
  O:[426,872,81,120], V:[527,872,81,120], K:[426,649,81,112]
};
const BALL_SRC=[366,1315,116,116];
const PAINT={P:'#f0569e',G:'#3fbf58',B:'#2f7de0',V:'#8a46e8',O:'#ff8c2e',K:'#26262e'};

/* ===== уровни: пирамиды банок на песке; L1 — в точности референс ===== */
/* лимиты по боту 22.07: медианы M = 6/5/7/8/7 → normal M+3, спайк на 5-м = M−1 */
const LEVELS=[
 {balls:9,  towers:[{x:CX, tiers:["PGBOVP","OBPPO","GPKB","BVO","PG"]}]},
 {balls:8,  towers:[{x:190,tiers:["PGB","OV"]},
                    {x:530,tiers:["BOG","PV"]}]},
 {balls:10, towers:[{x:CX, tiers:["OBPGVK","PGBOP","VOGB","OPB","GV"]}]},
 {balls:11, towers:[{x:190,tiers:["BOGP","PVB","GO"]},
                    {x:530,tiers:["GPOV","BGP","OB"]}]},
 {balls:6,  towers:[{x:CX, tiers:["PGBOVK","OBPPO","GVKB","BVO","PG"]}]}
];

let engine,world;
let jars=[],balls=[],poofs=[],confetti=[],rings=[];
let stains=[],drops=[],shards=[];
let roll=null,aim=null;
let level=0,ballsLeft=0,state='start';
let calm=0,winT=0,shake=0,tglob=0;

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const hballs=document.getElementById('hballs'),hlevel=document.getElementById('hlevel');
const ov=document.getElementById('ov'),ptitle=document.getElementById('ptitle'),
      pmsg=document.getElementById('pmsg'),pbtn=document.getElementById('pbtn');

/* ===== арт из картинки ===== */
const img=new Image();
let bgc=null,sprJar={},sprBall=null;

function makeBg(){
  bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;
  const b=bgc.getContext('2d');
  b.drawImage(img,0,0,IMG_W,IMG_H, 0,IOY,W,IMG_H*IS);
  /* заплатка поверх нарисованной пирамиды: клонируем ЧИСТУЮ правую кромку картинки
     той же высоты (тон моря/линии берега/песка совпадает по y), тайлы зеркалим */
  const SX=772,SW=79;                               // источник в px картинки
  const x0=88,x1=634,y0=156,y1=664,tw=SW*IS;
  const sy=(y0-IOY)/IS,sh=(y1-y0)/IS;
  let flip=false;
  for(let x=x0;x<x1;x+=tw-2){
    const w=Math.min(tw,x1-x);
    b.save();
    if(flip){b.translate(x*2+w,0);b.scale(-1,1);}
    b.drawImage(img,SX,sy,w/IS,sh, x,y0,w,y1-y0);
    b.restore();
    flip=!flip;
  }
  /* стойка под канистрой (низ родной стойки срезан заплаткой) */
  b.fillStyle='#a8763e';
  b.fillRect(310,150,96,10);
  b.fillRect(318,160,9,38);b.fillRect(389,160,9,38);
  b.strokeStyle='#8f5f2e';b.lineWidth=3;
  b.beginPath();b.moveTo(322,196);b.lineTo(394,166);b.stroke();
  /* круглая растушёванная заплатка деревом поверх нарисованного шара (клон ниже по дорожке) */
  const t=document.createElement('canvas');t.width=150;t.height=150;
  const g=t.getContext('2d');
  g.drawImage(img,340,1445,178,178, 0,0,150,150);
  const rg=g.createRadialGradient(75,75,50,75,75,75);
  rg.addColorStop(0,'rgba(0,0,0,1)');rg.addColorStop(1,'rgba(0,0,0,0)');
  g.globalCompositeOperation='destination-in';
  g.fillStyle=rg;g.fillRect(0,0,150,150);
  b.drawImage(t,287,887);
}
function makeJarSprite(ch){
  const c=document.createElement('canvas');c.width=JW*2;c.height=JH*2;
  const g=c.getContext('2d'),[sx,sy,sw,sh]=JAR_SRC[ch];
  g.beginPath();
  g.roundRect(38,0,76,52,[8,8,12,12]);           // крышка
  g.roundRect(7,23,138,223,[40,40,26,26]);       // тело (канвас 152×248)
  g.clip();
  g.drawImage(img,sx,sy,sw,sh, 0,0,JW*2,JH*2);
  return c;
}
function makeBallSprite(){
  const c=document.createElement('canvas');c.width=128;c.height=128;
  const g=c.getContext('2d'),[sx,sy,sw,sh]=BALL_SRC;
  g.beginPath();g.arc(64,64,60,0,6.3);g.clip();
  g.drawImage(img,sx,sy,sw,sh, 2,2,124,124);
  return c;
}
function prepArt(){
  makeBg();
  for(const ch in JAR_SRC)sprJar[ch]=makeJarSprite(ch);
  sprBall=makeBallSprite();
}

/* ===== постройка уровня ===== */
function buildLevel(n){
  engine=Engine.create({enableSleeping:true});
  engine.gravity.y=1.15;
  world=engine.world;
  jars=[];balls=[];poofs=[];confetti=[];rings=[];
  stains=[];drops=[];shards=[];
  roll=null;aim=null;shake=0;

  Composite.add(world,Bodies.rectangle(CX,GROUND_Y+20,W+240,40,
    {isStatic:true,friction:.9,restitution:.05,label:'ground',
     collisionFilter:{category:CAT_GROUND,mask:CAT_JAR}}));

  /* удар шара или жёсткое соударение при обрушении → банка бьётся (одно касание).
     ВАЖНО: collisionStart — ДО солвера; менять тела только ПОСЛЕ Engine.update */
  Events.on(engine,'collisionStart',ev=>{
    for(const pr of ev.pairs){
      const bo=balls.find(o=>o.body===pr.bodyA||o.body===pr.bodyB);
      if(bo){
        const other=bo.body===pr.bodyA?pr.bodyB:pr.bodyA;
        const pv=bo.pv||bo.body.velocity, sp=Math.hypot(pv.x,pv.y);
        const jar=jars.find(o=>o.body===other&&!o.dead);
        if(jar&&sp>9){jar.dead=true;bo.q.push({jar,pv});}
        continue;
      }
      const rel=Math.hypot(pr.bodyA.velocity.x-pr.bodyB.velocity.x,
                           pr.bodyA.velocity.y-pr.bodyB.velocity.y);
      if(rel<8.5)continue;
      for(const bd of [pr.bodyA,pr.bodyB]){
        const o=jars.find(q=>q.body===bd&&!q.dead);
        if(o&&Math.hypot(bd.velocity.x,bd.velocity.y)>7){o.dead=true;hitQ.push(o);}
      }
    }
  });

  const L=LEVELS[n];
  for(const tw of L.towers){
    let curY=GROUND_Y;
    for(let t=0;t<tw.tiers.length;t++){
      const row=tw.tiers[t],nc=row.length;
      for(let i=0;i<nc;i++){
        const ch=row[i]; if(!PAINT[ch])continue;
        const cx=tw.x+(i-(nc-1)/2)*STEPX;
        const b=Bodies.rectangle(cx,curY-JH/2-1,JW,JH,
          {density:.0024,friction:.9,restitution:.03,chamfer:{radius:12},
           collisionFilter:{category:CAT_JAR,mask:CAT_JAR|CAT_GROUND|CAT_BALL}});
        jars.push({body:b,color:ch});
        Composite.add(world,b);
      }
      curY-=JH+2;
    }
  }
  ballsLeft=L.balls; calm=0; winT=0;
  hballs.textContent=ballsLeft; hlevel.textContent=(n+1);
}
let hitQ=[];

/* ===== попапы ===== */
function popup(title,msg,btn,cb){
  ptitle.textContent=title; pmsg.innerHTML=msg; pbtn.textContent=btn;
  pbtn.onclick=()=>{ov.classList.remove('show');cb();};
  ov.classList.add('show');
}
function showStart(){
  state='start';
  popup('Level '+(level+1),
    'Drag to aim, release —<br>the ball rolls into the jars!<div class="big">⚪ × '+LEVELS[level].balls+'</div>',
    'Play',()=>{state='play';});
}
function showWin(){
  if(level>=LEVELS.length-1){ state='done';
    popup('🏆','<div class="big">🎉</div>All 5 levels cleared!','Play again',
      ()=>{level=0;buildLevel(0);showStart();});
  } else { state='win';
    popup('Level '+(level+1),'<div class="big">⭐⭐⭐</div>Cleared!','Next',
      ()=>{level++;buildLevel(level);state='play';});
  }
}
function showLose(){
  state='lose';
  popup('Level '+(level+1),'<div class="big">😵</div>Out of balls!','Try Again',
    ()=>{buildLevel(level);state='play';});
}

/* ===== пролив краски: брызги + лужа на песке ===== */
function spillPaint(jar,x,y){
  const col=PAINT[jar.color];
  for(let i=0;i<12;i++){const a=Math.random()*6.3,v=2+Math.random()*4;
    drops.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2.4,r:3+Math.random()*4.5,c:col,t:1,
      fy:GROUND_Y+6+Math.random()*30});}
  addStain(stains,x+(Math.random()-.5)*36, GROUND_Y+8+Math.random()*26, 15+Math.random()*16, col);
}
function addStain(arr,x,y,r,c){
  if(arr.length>240)arr.splice(0,20);
  const blobs=[],n=3+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++)blobs.push({dx:(Math.random()-.5)*r*1.6,dy:(Math.random()-.5)*r*.5,
    rx:r*(.4+Math.random()*.5),ry:r*(.16+Math.random()*.2)});
  arr.push({x:Math.max(18,Math.min(W-18,x)),y,c,blobs});
}
function glassPoof(x,y){
  for(let i=0;i<9;i++){const a=Math.random()*6.3,v=1.8+Math.random()*4;
    shards.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2.8,rot:Math.random()*6.3,
      vr:(Math.random()-.5)*.5,s:5+Math.random()*8,t:1});}
}
/* банка бьётся: краска проливается, стекло — брызгами */
function shatterJar(jar,idx){
  const p=jar.body.position;
  const inX=p.x>-60&&p.x<W+60, y=Math.min(p.y,GROUND_Y);
  spillPaint(jar,inX?p.x:Math.max(30,Math.min(W-30,p.x)),y);
  if(inX)glassPoof(p.x,y);
  Composite.remove(world,jar.body); jars.splice(idx,1);
  jars.forEach(o=>Sleeping.set(o.body,false));
  shake=Math.min(1,shake+.3);
  window.__smashed=(window.__smashed||0)+1;
}

/* ===== бросок: тянем — целимся траекторией, отпустили — шар катится ===== */
function aimAt(px,py){
  let dx=px-REST.x, dy=py-REST.y;
  if(dy>-40)dy=-40;                                  // целимся только вперёд
  const t=(GROUND_Y-6-REST.y)/dy;
  const hx=Math.max(56,Math.min(W-56,REST.x+dx*t));
  return hx;
}
function fire(hx){
  if(state!=='play'||ballsLeft<=0||roll)return;
  ballsLeft--; hballs.textContent=ballsLeft;
  rings.push({x:hx,y:GROUND_Y-10,t:1});
  roll={t:0,hx,ph:0};
}
function launch(hx){
  const dx=hx-REST.x, dy=(GROUND_Y-24)-REST.y;
  const d=Math.hypot(dx,dy), ux=dx/d, uy=dy/d;
  const b=Bodies.circle(hx-ux*30,GROUND_Y-24-uy*30,BALL_R,
    {density:.012,restitution:.12,friction:.08,frictionAir:.0006,
     collisionFilter:{category:CAT_BALL,mask:CAT_JAR|CAT_BALL}});
  Body.setVelocity(b,{x:ux*BALL_V,y:uy*BALL_V});
  Body.setAngularVelocity(b,.5);
  Composite.add(world,b);
  balls.push({body:b,age:0,q:[]});
  jars.forEach(o=>Sleeping.set(o.body,false));
  shake=Math.min(1,shake+.22); calm=0;
}
/* позиция шара на дорожке: прямая от места ожидания к точке удара */
function rollPos(t,hx){
  return {x:REST.x+(hx-REST.x)*t, y:REST.y+((GROUND_Y-18)-REST.y)*t};
}

/* ===== партиклы ===== */
function burstConfetti(){
  const cols=Object.values(PAINT).filter(c=>c!=='#26262e');
  for(let i=0;i<26;i++){
    confetti.push({x:CX+(Math.random()-.5)*360,y:300+Math.random()*180,
      vx:(Math.random()-.5)*3,vy:-3-Math.random()*3,w:8+Math.random()*7,
      a:Math.random()*6.3,va:(Math.random()-.5)*.3,t:1.4,
      c:cols[i%cols.length]});
  }
}

/* ===== тик ===== */
function tick(dt){
  tglob+=dt;
  balls.forEach(o=>o.pv={x:o.body.velocity.x,y:o.body.velocity.y});
  Engine.update(engine,1000/60);
  // дорожка: шар катится к пирамиде, у основания — в физику
  if(roll){ roll.t+=dt/0.5; roll.ph+=dt*13;
    if(roll.t>=1){ launch(roll.hx); roll=null; } }
  // прямые попадания — после шага физики (шар пробивает насквозь ×0.75)
  for(const bo of balls){
    if(!bo.q.length)continue;
    for(const q of bo.q){
      const idx=jars.indexOf(q.jar); if(idx<0)continue;
      shatterJar(q.jar,idx);
      const nv={x:q.pv.x*.75,y:q.pv.y*.75};
      Body.setVelocity(bo.body,nv); bo.pv=nv;
    }
    bo.q=[];
  }
  // каскадные соударения
  if(hitQ.length){
    for(const o of hitQ){
      const idx=jars.indexOf(o); if(idx>=0)shatterJar(o,idx);
    }
    hitQ=[];
  }
  // банки, улетевшие за экран/упавшие — бьются
  for(let i=jars.length-1;i>=0;i--){
    const p=jars[i].body.position;
    if(p.y>GROUND_Y+140||p.x<-70||p.x>W+70)shatterJar(jars[i],i);
  }
  // шары: вылет / старость
  for(let i=balls.length-1;i>=0;i--){
    const o=balls[i],p=o.body.position; o.age+=dt;
    if(p.y>GROUND_Y+180||p.x<-60||p.x>W+60||o.age>6){
      Composite.remove(world,o.body); balls.splice(i,1);
    }
  }
  // партиклы
  for(let i=poofs.length-1;i>=0;i--){const o=poofs[i];
    o.x+=o.vx;o.y+=o.vy;o.vy+=.12;o.t-=dt*2.4; if(o.t<=0)poofs.splice(i,1);}
  for(let i=drops.length-1;i>=0;i--){const o=drops[i];
    o.x+=o.vx;o.y+=o.vy;o.vy+=.16;o.t-=dt*.9;
    if(o.y>o.fy){addStain(stains,o.x,o.fy,5+Math.random()*5,o.c);drops.splice(i,1);continue;}
    if(o.t<=0)drops.splice(i,1);}
  for(let i=shards.length-1;i>=0;i--){const o=shards[i];
    o.x+=o.vx;o.y+=o.vy;o.vy+=.18;o.rot+=o.vr;o.t-=dt*1.4;
    if(o.t<=0||o.y>GROUND_Y+120)shards.splice(i,1);}
  for(let i=confetti.length-1;i>=0;i--){const o=confetti[i];
    o.x+=o.vx;o.y+=o.vy;o.vy+=.09;o.a+=o.va;o.t-=dt*.7; if(o.t<=0)confetti.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){rings[i].t-=dt*2.4; if(rings[i].t<=0)rings.splice(i,1);}
  shake=Math.max(0,shake-dt*2.6);

  if(state==='play'){
    if(jars.length<=0){                     // все банки пролиты — победа (пауза ~1с)
      state='winwait'; winT=0; burstConfetti();
    } else if(ballsLeft<=0&&!roll&&balls.length===0){
      calm+=dt; if(calm>1.2)showLose();     // проигрыш — сразу после осадки
    } else calm=0;
  } else if(state==='winwait'){
    winT+=dt; if(winT>=1)showWin();
  }
}

/* ===== отрисовка ===== */
function drawStain(o){
  ctx.fillStyle=o.c;ctx.globalAlpha=.82;
  for(const b of o.blobs){
    ctx.beginPath();ctx.ellipse(o.x+b.dx,o.y+b.dy,b.rx,b.ry,0,0,6.3);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawBallSprite(x,y,r,ang){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.drawImage(sprBall,-r,-r,r*2,r*2);
  ctx.restore();
}

function render(){
  const dpr=window.devicePixelRatio||1;
  const cw=cv.clientWidth,ch=cv.clientHeight;
  if(cv.width!==cw*dpr||cv.height!==ch*dpr){cv.width=cw*dpr;cv.height=ch*dpr;}
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  const s=Math.min(cw/W,ch/H),ox=(cw-W*s)/2,oy=(ch-H*s)/2;
  ctx.scale(dpr,dpr);
  ctx.fillStyle='#4aa8f0';ctx.fillRect(0,0,cw,ch);
  ctx.setTransform(dpr*s,0,0,dpr*s,ox*dpr,oy*dpr);
  if(shake>0)ctx.translate((Math.random()-.5)*9*shake,(Math.random()-.5)*7*shake);

  // фон целиком из референса (пирамида и шар на нём закрыты заплатками)
  if(bgc)ctx.drawImage(bgc,0,0);

  // лужи краски на песке (навсегда)
  stains.forEach(drawStain);

  // тень под пирамидой
  if(jars.length){
    ctx.fillStyle='rgba(150,105,50,.22)';
    ctx.beginPath();ctx.ellipse(CX,GROUND_Y+6,280,16,0,0,6.3);ctx.fill();
  }

  // банки (спрайты из картинки; рисуем чуть шире тела — плотнее, как на референсе)
  jars.forEach(o=>{const p=o.body.position;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(o.body.angle);
    ctx.drawImage(sprJar[o.color],-(JW+6)/2,-JH/2,JW+6,JH);ctx.restore();});

  // шары в полёте
  balls.forEach(o=>{const p=o.body.position;
    drawBallSprite(p.x,p.y,BALL_R,o.body.angle);});

  // стёкла и капли краски
  shards.forEach(o=>{
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);
    ctx.globalAlpha=Math.max(0,o.t)*.85;
    ctx.fillStyle='rgba(220,240,255,.9)';
    ctx.beginPath();ctx.moveTo(0,-o.s*.6);ctx.lineTo(o.s*.5,o.s*.4);ctx.lineTo(-o.s*.5,o.s*.3);
    ctx.closePath();ctx.fill();
    ctx.restore();});
  drops.forEach(o=>{
    ctx.globalAlpha=Math.max(.2,Math.min(1,o.t));
    ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.3);ctx.fill();});
  ctx.globalAlpha=1;

  // пуфы
  poofs.forEach(o=>{ctx.globalAlpha=Math.max(0,o.t);
    ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(o.x,o.y,o.r*(1.4-o.t*.4),0,6.3);ctx.fill();});
  ctx.globalAlpha=1;

  // траектория прицеливания (пунктир от шара к точке удара)
  if(aim&&state==='play'&&!roll&&ballsLeft>0){
    const hx=aim.hx, tx=hx-REST.x, ty=(GROUND_Y-10)-REST.y;
    ctx.setLineDash([2,16]);ctx.lineCap='round';
    ctx.lineWidth=7;ctx.strokeStyle='rgba(255,255,255,.9)';
    ctx.beginPath();ctx.moveTo(REST.x,REST.y);ctx.lineTo(REST.x+tx,REST.y+ty);ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.95)';
    ctx.beginPath();ctx.arc(hx,GROUND_Y-10,16,0,6.3);ctx.stroke();
    ctx.beginPath();ctx.arc(hx,GROUND_Y-10,3,0,6.3);ctx.fillStyle='#fff';ctx.fill();
  }

  // шар: катится по траектории или ждёт на дорожке
  if(roll){const t=Math.min(1,roll.t),p=rollPos(t,roll.hx),r=REST_R+(BALL_R-REST_R)*t;
    ctx.fillStyle='rgba(80,50,15,.28)';
    ctx.beginPath();ctx.ellipse(p.x,p.y+r*.85,r*.95,r*.3,0,0,6.3);ctx.fill();
    drawBallSprite(p.x,p.y,r,roll.ph);}
  else if(state==='play'&&ballsLeft>0){
    ctx.fillStyle='rgba(80,50,15,.28)';
    ctx.beginPath();ctx.ellipse(REST.x,REST.y+REST_R*.8,REST_R*.9,REST_R*.28,0,0,6.3);ctx.fill();
    drawBallSprite(REST.x,REST.y,REST_R,tglob*.6);
  }

  // метка точки удара
  rings.forEach(o=>{ctx.globalAlpha=o.t*.8;ctx.lineWidth=3;ctx.strokeStyle='#fff';
    ctx.beginPath();ctx.arc(o.x,o.y,14+(1-o.t)*24,0,6.3);ctx.stroke();});
  ctx.globalAlpha=1;

  // конфетти
  confetti.forEach(o=>{ctx.save();ctx.globalAlpha=Math.min(1,o.t);
    ctx.translate(o.x,o.y);ctx.rotate(o.a);ctx.fillStyle=o.c;
    ctx.fillRect(-o.w/2,-o.w/4,o.w,o.w/2);ctx.restore();});
  ctx.globalAlpha=1;
}

/* ===== ввод: тянем — целимся, отпустили — бросок ===== */
function toWorld(e){
  const r=cv.getBoundingClientRect();
  const s=Math.min(r.width/W,r.height/H),ox=(r.width-W*s)/2,oy=(r.height-H*s)/2;
  return {x:(e.clientX-r.left-ox)/s, y:(e.clientY-r.top-oy)/s};
}
cv.addEventListener('pointerdown',e=>{
  if(state!=='play'||roll||ballsLeft<=0)return;
  const p=toWorld(e); aim={hx:aimAt(p.x,p.y)};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(!aim)return;
  const p=toWorld(e); aim.hx=aimAt(p.x,p.y);
});
cv.addEventListener('pointerup',e=>{
  if(!aim)return;
  const p=toWorld(e); fire(aimAt(p.x,p.y)); aim=null;
});
cv.addEventListener('pointercancel',()=>{aim=null;});

/* ===== цикл с фикс-шагом (headless rAF бывает 2.5fps) ===== */
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(250,now-last);last=now;
  try{
    while(acc>=1000/60){tick(1/60);acc-=1000/60;window.__ticks=(window.__ticks||0)+1;}
    render();
  }catch(err){window.__tickErr=String(err&&err.stack||err);}
  requestAnimationFrame(loop);
}

  get state(){return state}, get ballsLeft(){return ballsLeft},
  get jars(){return jars.length},
  get level(){return level+1}, get rolling(){return !!roll},
  get activeBalls(){return balls.length+(roll?1:0)},
  get jarPos(){return jars.map(o=>({x:o.body.position.x,y:o.body.position.y,c:o.color}))},
  get stains(){return stains.length},
  fire, btn:()=>pbtn.click(),
  skip:n=>{level=n;buildLevel(n);state='play';ov.classList.remove('show');}
};

img.onload=()=>{prepArt();buildLevel(0);showStart();requestAnimationFrame(loop);};
