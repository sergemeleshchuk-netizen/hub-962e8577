<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Water Blocks — proto v4</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:linear-gradient(180deg,#cbdbfc 0%,#b3c9f7 55%,#9fbaf3 100%);}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }

  #hud{width:100%;padding:10px 12px;z-index:3;display:flex;align-items:center;gap:8px;}
  .pill{background:#fff;color:#2b4a8f;border-radius:16px;padding:7px 14px;font-weight:800;
        font-size:15px;box-shadow:0 3px 8px rgba(43,74,143,.22);}
  #timer{font-variant-numeric:tabular-nums;font-size:18px;min-width:86px;text-align:center;}
  .ibtn{width:38px;height:38px;border-radius:50%;background:#fff;color:#4b7bd8;border:0;
        font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;
        cursor:pointer;box-shadow:0 3px 8px rgba(43,74,143,.22);}
  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  .ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:14px;background:rgba(214,228,255,.88);backdrop-filter:blur(3px);}
  .ov h1{color:#274a94;font-size:34px;margin:0;text-shadow:0 2px 0 #fff;}
  .ov .sub{color:#4a63a0;font-size:15px;margin:0 28px;text-align:center;line-height:1.45;}
  .btn{background:linear-gradient(180deg,#ffd54d,#f4a825);border:0;border-radius:18px;padding:14px 34px;
       font-size:19px;font-weight:900;color:#5b3a00;cursor:pointer;box-shadow:0 5px 0 #b97b12;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b97b12;}
  .btn.sec{background:linear-gradient(180deg,#6fa2f2,#4b7bd8);color:#fff;box-shadow:0 5px 0 #2d55a8;}
  #lvls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:300px;}
  .lv{width:52px;height:52px;border-radius:14px;font-size:20px;font-weight:900;border:0;cursor:pointer;
      background:linear-gradient(180deg,#6fa2f2,#4b7bd8);color:#fff;box-shadow:0 4px 0 #2d55a8;}
  .lv.lock{background:#c3d2f0;color:#8fa4cf;box-shadow:0 4px 0 #9db1da;cursor:default;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="phone">
  <div id="hud">
    <button class="ibtn" id="btnHome">⌂</button>
    <div style="flex:1"></div>
    <div class="pill" id="timer">0:00</div>
    <div style="flex:1"></div>
    <div class="pill" id="lvlLab">Level 1</div>
    <button class="ibtn" id="btnRetry">⟳</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>

  <div class="ov" id="home">
    <h1>WATER BLOCKS</h1>
    <p class="sub">В баке плавают цветные капли-кляксы. Подвинь блок вплотную к баку —<br>жидкость <b>его цвета</b> со дна стечёт в него; чужая капля запирает колонку.<br>Полный блок исчезает. Осуши бак до конца таймера!</p>
    <div id="lvls"></div>
  </div>
  <div class="ov hidden" id="win">
    <h1>LEVEL DONE!</h1>
    <button class="btn" id="btnNext">Next level</button>
    <button class="btn sec" id="btnWinHome">Home</button>
  </div>
  <div class="ov hidden" id="lose">
    <h1>TIME'S UP</h1>
    <button class="btn" id="btnRetryOv">Retry</button>
    <button class="btn sec" id="btnLoseHome">Home</button>
  </div>
</div>

<script>
/* ================= Water Blocks proto v4 =================
   Бак-«картинка из жидкостей»: базовая жидкость + плавающие
   цветные кляксы (симуляция v1-песка, рендер гладкой жидкостью).
   Кляксы опускаются, когда жидкость под ними уходит. Блоки по
   визуалу референса Water Out: толстые глянцевые скруглённые рамки.
   ========================================================= */
/*CORE-BEGIN*/
const BC=6, BR=7, CELL=56;           // лоток 6x7
const LW=396, LH=672;                // логическая сцена
const BX=30, BY=264;                 // лоток x,y
const TX=30, TTOP=14, TBOT=238;      // бак (336x224 px)
const TWg=84, THg=56;                // сетка жидкости 84x56 (4px «капля»)
const GPC=14;                        // колонок жидкости на колонку лотка
const K=170;                         // капель на 1 клетку объёма блока
const DRAIN=2;                       // капель/тик с колонки жидкости
const SUB=3;                         // подшагов гравитации за тик

const PAL=[
  {n:'yellow', a:'#f7c843', b:'#d9a318', f:'#ffe27a'},
  {n:'purple', a:'#9257e0', b:'#6f3cba', f:'#b58af0'},
  {n:'green',  a:'#4fc85e', b:'#37a447', f:'#7fe08a'},
  {n:'red',    a:'#ef5350', b:'#c93a38', f:'#ff8683'},
  {n:'blue',   a:'#4b8ff0', b:'#3671cc', f:'#7fb3ff'},
];
const SH={
  S1:[[0,0]], H2:[[0,0],[1,0]], V2:[[0,0],[0,1]],
  H3:[[0,0],[1,0],[2,0]], L3:[[0,0],[0,1],[1,1]],
  O4:[[0,0],[1,0],[0,1],[1,1]], T4:[[0,0],[1,0],[2,0],[1,1]],
};
// уровень: c=[цвет,форма,x,y]; base=цвет фона; blobs=[{col,q(клеток),cx,cyb(от дна)}]
const LEVELS=[
 {t:50, base:0, c:[[1,'O4',2,1],[0,'O4',0,4],[0,'H3',3,5]],
  blobs:[{col:1,q:4,cx:42,cyb:10}]},
 {t:60, base:0, c:[[0,'O4',0,2],[1,'H3',2,4],[2,'L3',4,1],[0,'H2',1,6]],
  blobs:[{col:1,q:3,cx:24,cyb:14},{col:2,q:3,cx:62,cyb:6}]},
 {t:80, base:4, c:[[4,'T4',1,1],[3,'O4',4,2],[3,'V2',3,3],[2,'L3',0,4],[4,'H2',2,5],[2,'V2',5,5]],
  blobs:[{col:3,q:6,cx:30,cyb:8},{col:2,q:2.5,cx:66,cyb:16},{col:2,q:2.5,cx:12,cyb:22}]},
 {t:110, base:0, c:[[0,'O4',0,1],[4,'T4',2,2],[1,'O4',4,4],[2,'L3',0,4],[2,'S1',5,1],[0,'H3',1,6],[4,'H2',2,4]],
  blobs:[{col:4,q:6,cx:42,cyb:6},{col:1,q:4,cx:14,cyb:18},{col:2,q:2,cx:68,cyb:12},{col:2,q:2,cx:54,cyb:26}]},
 {t:140, base:0, c:[[0,'O4',0,1],[1,'O4',2,1],[0,'H2',4,1],[4,'H2',4,2],[3,'V2',0,3],[1,'V2',5,3],
            [3,'S1',1,4],[4,'T4',2,4],[2,'S1',0,6],[2,'S1',5,6]],
  blobs:[{col:4,q:6,cx:20,cyb:7},{col:1,q:3,cx:60,cyb:9},{col:1,q:3,cx:42,cyb:22},
         {col:3,q:3,cx:72,cyb:18},{col:2,q:1,cx:10,cyb:26},{col:2,q:1,cx:50,cyb:34}]},
];

let tank, conts, tick=0, timeLeft=0, level=0, playing=false;
let winFlag=false, loseFlag=false, winAt=0, clearedAll=false;
let ffMult=1, botOn=false, botCd=0, botHist=[];
let pourCols=[];                     // [{col,c}] куда льётся в этом тике
const idx=(x,y)=>y*TWg+x;

function mkCont(col,shape,x,y,id){
  const cells=SH[shape].map(c=>c.slice());
  return {id,col,cells,x,y,cap:cells.length,fillGr:0,
          state:'idle',popT:0,lastGain:-9};
}
const fillOf=c=>c.fillGr/K;
function occMap(skip){
  const m=new Array(BC*BR).fill(0);
  for(const c of conts){ if(c.state!=='idle'||c===skip) continue;
    for(const[dx,dy]of c.cells) m[(c.y+dy)*BC+(c.x+dx)]=1; }
  return m;
}
function canPlace(c,nx,ny,m){
  for(const[dx,dy]of c.cells){ const x=nx+dx,y=ny+dy;
    if(x<0||x>=BC||y<0||y>=BR) return false; if(m[y*BC+x]) return false; }
  return true;
}
function buildLevel(n){
  const L=LEVELS[n];
  conts=L.c.map((d,i)=>mkCont(d[0],d[1],d[2],d[3],i));
  tick=0; timeLeft=L.t; winFlag=loseFlag=false; winAt=0; clearedAll=false;
  botHist=[]; pourCols=[];
  // реверс-экономика: капель цвета = ёмкость его блоков * K
  const quota=new Array(PAL.length).fill(0);
  for(const c of conts) quota[c.col]+=c.cap*K;
  const total=quota.reduce((a,b)=>a+b,0);
  const all=[];
  for(let y=0;y<THg;y++)for(let x=0;x<TWg;x++)
    all.push({x,y,k:y+1.5*Math.sin(x/TWg*Math.PI*2)});
  all.sort((a,b)=>b.k-a.k);
  const sel=all.slice(0,total);
  tank=new Uint8Array(TWg*THg);
  const used=new Set();
  for(const p of (L.blobs||[])){       // кляксы забирают ближайшие к центру капли
    let q=Math.round(p.q*K);
    const cy=THg-p.cyb;
    const fit=sel.filter(s=>!used.has(s.y*TWg+s.x))
      .sort((a,b)=>((a.x-p.cx)**2+(a.y-cy)**2)-((b.x-p.cx)**2+(b.y-cy)**2));
    for(const s of fit){ if(q<=0)break; tank[idx(s.x,s.y)]=p.col+1; used.add(s.y*TWg+s.x);
      quota[p.col]--; q--; }
  }
  // остаток (база + спилы) — снизу вверх, базовый цвет первым
  const order=[L.base,...quota.map((_,i)=>i).filter(i=>i!==L.base)];
  let si=0;
  for(const col of order){ let q=quota[col];
    while(q>0&&si<sel.length){ const s=sel[si++]; if(used.has(s.y*TWg+s.x))continue;
      tank[idx(s.x,s.y)]=col+1; q--; }
    quota[col]=0;
  }
}
function receiver(col){ // приёмник колонки лотка: самая верхняя клетка пристыкованного
  let best=null;
  for(const c of conts){ if(c.state!=='idle'||c.y!==0) continue;
    for(const[dx,dy]of c.cells){ if(c.x+dx!==col) continue;
      if(!best||dy<best.row) best={c,row:dy}; }
  }
  return best&&best.c;
}
let topY=new Int16Array(TWg);
function calcTops(){ topY.fill(THg);
  for(let x=0;x<TWg;x++)for(let y=0;y<THg;y++) if(tank[idx(x,y)]){topY[x]=y;break;}
}
function settle(){ // жидкость: падение + диагонали + выравнивание поверхности
  const dir=tick&1?1:-1;
  for(let y=THg-2;y>=0;y--){
    for(let i=0;i<TWg;i++){ const x=dir>0?i:TWg-1-i;
      const v=tank[idx(x,y)]; if(!v) continue;
      if(!tank[idx(x,y+1)]){ tank[idx(x,y+1)]=v; tank[idx(x,y)]=0; continue; }
      const x1=x+dir,x2=x-dir;
      if(x1>=0&&x1<TWg&&!tank[idx(x1,y+1)]&&!tank[idx(x1,y)]){ tank[idx(x1,y+1)]=v; tank[idx(x,y)]=0; }
      else if(x2>=0&&x2<TWg&&!tank[idx(x2,y+1)]&&!tank[idx(x2,y)]){ tank[idx(x2,y+1)]=v; tank[idx(x,y)]=0; }
    }
  }
  calcTops();                        // выравнивание: поверхностная капля сползает в яму
  for(let i=0;i<TWg;i++){ const x=dir>0?i:TWg-1-i;
    const y=topY[x]; if(y>=THg) continue;
    for(const d of [dir,-dir]){ const nx=x+d;
      if(nx<0||nx>=TWg) continue;
      if(topY[nx]>y+1){ tank[idx(nx,topY[nx]-1)]=tank[idx(x,y)]; tank[idx(x,y)]=0;
        topY[nx]--; topY[x]=(y+1<THg&&tank[idx(x,y+1)])?y+1:THg; break; }
    }
  }
}
function drain(){
  pourCols=[];
  for(let col=0;col<BC;col++){
    const c=receiver(col);
    if(!c||fillOf(c)>=c.cap) continue;
    let got=0;
    for(let pass=0;pass<DRAIN;pass++){
      for(let g=0;g<GPC;g++){ const gx=col*GPC+g;
        if(c.fillGr>=c.cap*K) break;
        if(tank[idx(gx,THg-1)]===c.col+1){ tank[idx(gx,THg-1)]=0; c.fillGr++; got++; }
      }
    }
    if(got){ c.lastGain=tick/60; pourCols.push({col,c});
      if(c.fillGr>=c.cap*K&&c.state==='idle'){ c.state='clear'; c.popT=0; } }
  }
}
function step(dt){
  tick++;
  for(let s=0;s<SUB;s++) settle();
  drain();
  for(const c of conts){ if(c.state==='clear'){ c.popT+=dt; if(c.popT>.45) c.state='gone'; } }
  if(!winFlag&&!loseFlag){
    timeLeft-=dt;
    if(conts.every(c=>c.state==='gone')&&!clearedAll){ clearedAll=true; winAt=tick/60+1; }
    if(clearedAll&&tick/60>=winAt){ winFlag=true; playing=false; showWin(); }
    else if(timeLeft<=0){ timeLeft=0; loseFlag=true; playing=false; showLose(); }
  }
}
/*CORE-END*/

/* ================= рендер ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let scale=1, offX=0, offY=0;
function fit(){
  const st=document.getElementById('stage');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=st.clientWidth*dpr; cv.height=st.clientHeight*dpr;
  scale=Math.min(st.clientWidth/LW, st.clientHeight/LH);
  offX=(st.clientWidth-LW*scale)/2; offY=(st.clientHeight-LH*scale)/2;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
}
window.addEventListener('resize',fit);

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
const colX=col=>BX+(col+.5)*CELL;
const hex2rgb=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];};
const RGB=PAL.map(p=>hex2rgb(p.a));

// низкорезный канвас жидкости → апскейл со сглаживанием
const liq=document.createElement('canvas'); liq.width=TWg; liq.height=THg;
const lctx=liq.getContext('2d');
const limg=lctx.createImageData(TWg,THg);

const bgBub=[], tkBub=[];
for(let i=0;i<12;i++) bgBub.push({x:Math.random()*LW,y:Math.random()*LH,
  r:3+Math.random()*6,s:6+Math.random()*10});
for(let i=0;i<10;i++) tkBub.push({x:TX+8+Math.random()*(TWg*4-16),y:TBOT-Math.random()*100,
  r:1.5+Math.random()*3,s:8+Math.random()*14});

function draw(){
  const t=tick/60;
  ctx.clearRect(-offX/scale,-offY/scale,LW+2*offX/scale,LH+2*offY/scale);
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5;
  for(const b of bgBub){
    b.y-=b.s/60; if(b.y<-10){b.y=LH+10;b.x=Math.random()*LW;}
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.stroke();
  }
  drawTank(t);
  drawBoard();
  // струи (за блоками)
  for(const pc of pourCols){
    const c=pc.c; if(c.state==='gone') continue;
    const maxdy=Math.max(...c.cells.map(k=>k[1]));
    const surf=BY+(c.y+maxdy+1)*CELL-6-(fillOf(c)/c.cap)*(maxdy+1)*CELL;
    const x=colX(pc.col), col=PAL[c.col];
    ctx.fillStyle=col.a; ctx.globalAlpha=.92;
    rr(x-9,TBOT,18,Math.max(4,surf-TBOT),9); ctx.fill();
    ctx.fillStyle=col.f; ctx.globalAlpha=.7;
    rr(x-3,TBOT,5,Math.max(4,surf-TBOT),3); ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=col.f;
    ctx.beginPath(); ctx.ellipse(x,surf,15,4.5,0,0,7); ctx.fill();
  }
  for(const c of conts) if(c.state!=='gone') drawCont(c,t);
  drawConfetti();
}
function drawTank(t){
  // стеклянный корпус
  rr(TX-10,TTOP-10,TWg*4+20,TBOT-TTOP+26,18);
  ctx.fillStyle='rgba(255,255,255,.30)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=3; ctx.stroke();
  rr(TX-3,TTOP-3,TWg*4+6,TBOT-TTOP+10,10);
  ctx.fillStyle='rgba(226,238,255,.45)'; ctx.fill();
  // жидкость: низкорезный кадр → плавный апскейл
  const d=limg.data;
  for(let i=0;i<TWg*THg;i++){ const v=tank[i];
    if(!v){ d[i*4+3]=0; continue; }
    const c=RGB[v-1]; d[i*4]=c[0]; d[i*4+1]=c[1]; d[i*4+2]=c[2]; d[i*4+3]=255;
  }
  lctx.putImageData(limg,0,0);
  ctx.save();
  rr(TX-3,TTOP-3,TWg*4+6,TBOT-TTOP+6,10); ctx.clip();
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.filter='blur(2px)';
  ctx.drawImage(liq,TX,TBOT-THg*4,TWg*4,THg*4);
  ctx.filter='none';
  // волнистый блик по поверхности
  calcTops();
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=2.5;
  ctx.beginPath(); let started=false;
  for(let x=0;x<TWg;x++){ if(topY[x]>=THg){started=false;continue;}
    const px=TX+x*4+2, py=TBOT-(THg-topY[x])*4+Math.sin(t*2.5+x*.3)*1.5;
    started?ctx.lineTo(px,py):ctx.moveTo(px,py); started=true;
  }
  ctx.stroke();
  // пузырьки в жидкости
  ctx.fillStyle='rgba(255,255,255,.4)';
  for(const b of tkBub){
    b.y-=b.s/60;
    const gx=Math.max(0,Math.min(TWg-1,((b.x-TX)/4)|0));
    const surf=TBOT-(THg-topY[gx])*4;
    if(b.y<surf+6){ b.y=TBOT-6; b.x=TX+8+Math.random()*(TWg*4-16); }
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
  }
  ctx.restore();
  // дно-решётка + мини-капли: цвет дна каждой колонки
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.fillRect(TX-3,TBOT+4,TWg*4+6,3);
  const pouring=new Set(pourCols.map(p=>p.col));
  for(let col=0;col<BC;col++){
    if(pouring.has(col)) continue;
    const cnt=new Array(PAL.length).fill(0);
    for(let g=0;g<GPC;g++){ const v=tank[idx(col*GPC+g,THg-1)]; if(v) cnt[v-1]++; }
    let bi=-1; for(let i=0;i<PAL.length;i++) if(cnt[i]>(bi<0?0:cnt[bi])) bi=i;
    if(bi<0) continue;
    const x=colX(col), pul=1+Math.sin(t*5+col)*.1;
    ctx.fillStyle=PAL[bi].a; ctx.strokeStyle='#fff'; ctx.lineWidth=1.8;
    ctx.beginPath();
    ctx.moveTo(x-7*pul,TBOT+8); ctx.lineTo(x+7*pul,TBOT+8); ctx.lineTo(x,TBOT+8+10*pul);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function drawBoard(){
  const W=BC*CELL+28, H=BR*CELL+28;
  rr(BX-14,BY-14+9,W,H,22); ctx.fillStyle='#2c3468'; ctx.fill();   // 3D-юбка
  rr(BX-14,BY-14,W,H,22); ctx.fillStyle='#454e97'; ctx.fill();
  ctx.strokeStyle='#333c78'; ctx.lineWidth=3; ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.lineWidth=2;
  for(let x=1;x<BC;x++){ ctx.beginPath();
    ctx.moveTo(BX+x*CELL,BY+4); ctx.lineTo(BX+x*CELL,BY+BR*CELL-4); ctx.stroke(); }
  for(let y=1;y<BR;y++){ ctx.beginPath();
    ctx.moveTo(BX+4,BY+y*CELL); ctx.lineTo(BX+BC*CELL-4,BY+y*CELL); ctx.stroke(); }
  ctx.fillStyle='rgba(255,255,255,.06)';
  for(let y=0;y<BR;y++)for(let x=0;x<BC;x++){
    const cx=BX+x*CELL+CELL/2, cy=BY+y*CELL+CELL/2;
    ctx.fillRect(cx-5,cy-1,10,2); ctx.fillRect(cx-1,cy-5,2,10);
  }
}
// ---- контур полимино со скруглением всех углов (стиль референса) ----
function outlineOf(c){
  if(c._out) return c._out;
  const has=(x,y)=>c.cells.some(k=>k[0]===x&&k[1]===y);
  const edges=new Map();
  for(const[x,y]of c.cells){
    if(!has(x,y-1)) edges.set(x+','+y,[x+1,y]);
    if(!has(x+1,y)) edges.set((x+1)+','+y,[x+1,y+1]);
    if(!has(x,y+1)) edges.set((x+1)+','+(y+1),[x,y+1]);
    if(!has(x-1,y)) edges.set(x+','+(y+1),[x,y]);
  }
  const pts=[]; let key=edges.keys().next().value;
  const start=key;
  do{ const[sx,sy]=key.split(',').map(Number); const e=edges.get(key);
    pts.push([sx,sy]); key=e[0]+','+e[1];
  }while(key!==start&&pts.length<64);
  // убрать коллинеарные
  const out=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[(i+pts.length-1)%pts.length],b=pts[i],e=pts[(i+1)%pts.length];
    if((b[0]-a[0])*(e[1]-b[1])!==(b[1]-a[1])*(e[0]-b[0])) out.push(b);
  }
  c._out=out; return out;
}
function contPath(c,px,py,r,d=8){
  // d: отступ контура внутрь фигуры (нормали соседних рёбер, обход по часовой)
  const raw=outlineOf(c).map(([gx,gy])=>[px+gx*CELL, py+gy*CELL]);
  const n=raw.length, pts=[];
  for(let i=0;i<n;i++){
    const a=raw[(i+n-1)%n], b=raw[i], e=raw[(i+1)%n];
    const d1x=Math.sign(b[0]-a[0]), d1y=Math.sign(b[1]-a[1]);
    const d2x=Math.sign(e[0]-b[0]), d2y=Math.sign(e[1]-b[1]);
    pts.push([b[0]+(-d1y-d2y)*d, b[1]+(d1x+d2x)*d]);
  }
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const p=pts[i%n], nx=pts[(i+1)%n];
    const mx=(p[0]+nx[0])/2, my=(p[1]+nx[1])/2;
    if(i===0) ctx.moveTo(mx,my);
    else ctx.arcTo(p[0],p[1],mx,my,r);
  }
  ctx.closePath();
}
function drawCont(c,t){
  ctx.save();
  const maxdx=Math.max(...c.cells.map(k=>k[0])),maxdy=Math.max(...c.cells.map(k=>k[1]));
  const px=BX+c.x*CELL, py=BY+c.y*CELL;
  if(c.state==='clear'){ const f=c.popT/.45;
    ctx.globalAlpha=1-f;
    const cx=px+(maxdx+1)*CELL/2, cy=py+(maxdy+1)*CELL/2;
    ctx.translate(cx,cy); ctx.scale(1+f*.25,1+f*.25); ctx.translate(-cx,-cy);
  }
  const ga=ctx.globalAlpha;
  // нутро: приглушённое стекло + разделители клеток
  contPath(c,px,py,13);
  ctx.fillStyle='#3a4284'; ctx.fill();
  ctx.fillStyle=PAL[c.col].a; ctx.globalAlpha=ga*.14;
  contPath(c,px,py,13); ctx.fill(); ctx.globalAlpha=ga;
  ctx.save();
  contPath(c,px,py,13); ctx.clip();
  ctx.strokeStyle='rgba(0,0,0,.16)'; ctx.lineWidth=2;
  for(const[dx,dy]of c.cells){
    const has=(ax,ay)=>c.cells.some(k=>k[0]===ax&&k[1]===ay);
    if(has(dx+1,dy)){ ctx.beginPath();
      ctx.moveTo(px+(dx+1)*CELL,py+dy*CELL+8); ctx.lineTo(px+(dx+1)*CELL,py+(dy+1)*CELL-8); ctx.stroke(); }
    if(has(dx,dy+1)){ ctx.beginPath();
      ctx.moveTo(px+dx*CELL+8,py+(dy+1)*CELL); ctx.lineTo(px+(dx+1)*CELL-8,py+(dy+1)*CELL); ctx.stroke(); }
  }
  // жидкость: единая волнистая поверхность по всей фигуре
  const f=fillOf(c)/c.cap;
  if(f>0){
    const bboxB=py+(maxdy+1)*CELL, surfY=bboxB-6-f*((maxdy+1)*CELL-12);
    ctx.fillStyle=PAL[c.col].a; ctx.globalAlpha=ga*.96;
    ctx.beginPath();
    ctx.moveTo(px-4,bboxB+4);
    for(let x=px-4;x<=px+(maxdx+1)*CELL+4;x+=10)
      ctx.lineTo(x,surfY+Math.sin(t*4+x*.09)*2.2);
    ctx.lineTo(px+(maxdx+1)*CELL+4,bboxB+4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=PAL[c.col].f; ctx.lineWidth=2.5; ctx.globalAlpha=ga*.9;
    ctx.beginPath();
    for(let x=px-4;x<=px+(maxdx+1)*CELL+4;x+=10){
      const y=surfY+Math.sin(t*4+x*.09)*2.2;
      x===px-4?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.20)'; ctx.globalAlpha=ga;
    ctx.fillRect(px+10,Math.max(surfY+4,py+10),7,Math.max(0,bboxB-8-Math.max(surfY+4,py+10)));
  }
  ctx.restore();
  // рамка-«трубка»: тёмный кант → градиентная труба → блик
  ctx.lineJoin='round';
  contPath(c,px,py,13);
  ctx.lineWidth=15; ctx.strokeStyle=PAL[c.col].b; ctx.stroke();
  const g=ctx.createLinearGradient(0,py-8,0,py+(maxdy+1)*CELL+8);
  g.addColorStop(0,PAL[c.col].f); g.addColorStop(.45,PAL[c.col].a); g.addColorStop(1,PAL[c.col].b);
  ctx.lineWidth=11; ctx.strokeStyle=g; ctx.stroke();
  ctx.lineWidth=2.5; ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.stroke();
  // бейдж %
  const pct=Math.floor(100*fillOf(c)/c.cap+1e-6);
  const bx=px+(maxdx+1)*CELL-30, by=py+(maxdy+1)*CELL-14;
  rr(bx-16,by-9,44,18,9); ctx.fillStyle='#fff'; ctx.fill();
  ctx.fillStyle='#2b4a8f'; ctx.font='800 11px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(pct+'%',bx+6,by+1);
  ctx.restore();
}

/* ================= конфетти (умеренно) ================= */
let confetti=[];
function popConfetti(){ confetti=[];
  for(let i=0;i<60;i++) confetti.push({x:LW/2,y:LH*.4,vx:(Math.random()-.5)*420,
    vy:-Math.random()*420-80,c:PAL[(Math.random()*PAL.length)|0].a,r:3+Math.random()*4,l:1.6});
}
function drawConfetti(){ if(!confetti.length) return;
  for(let i=confetti.length-1;i>=0;i--){ const p=confetti[i];
    p.vy+=800/60; p.x+=p.vx/60; p.y+=p.vy/60; p.l-=1/60;
    if(p.l<=0){confetti.splice(i,1);continue;}
    ctx.globalAlpha=Math.min(1,p.l); ctx.fillStyle=p.c;
    ctx.fillRect(p.x,p.y,p.r,p.r); ctx.globalAlpha=1; }
}

/* ================= управление (драг) ================= */
let grab=null;
function toLocal(e){ const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left-offX)/scale, y:(e.clientY-r.top-offY)/scale}; }
function contAt(p){
  const cx=Math.floor((p.x-BX)/CELL), cy=Math.floor((p.y-BY)/CELL);
  for(const c of conts){ if(c.state!=='idle') continue;
    for(const[dx,dy]of c.cells) if(c.x+dx===cx&&c.y+dy===cy) return c; }
  return null;
}
cv.addEventListener('pointerdown',e=>{ if(!playing) return;
  const p=toLocal(e), c=contAt(p); if(!c) return;
  grab={c, ox:p.x-(BX+c.x*CELL), oy:p.y-(BY+c.y*CELL)};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{ if(!grab||!playing) return;
  const p=toLocal(e);
  const txc=Math.round((p.x-grab.ox-BX)/CELL), tyc=Math.round((p.y-grab.oy-BY)/CELL);
  moveToward(grab.c,txc,tyc);
});
cv.addEventListener('pointerup',()=>{grab=null;});
cv.addEventListener('pointercancel',()=>{grab=null;});
function moveToward(c,txc,tyc){
  const m=occMap(c);
  for(let s=0;s<12;s++){
    const dx=Math.sign(txc-c.x), dy=Math.sign(tyc-c.y);
    if(!dx&&!dy) break;
    const tryX=Math.abs(txc-c.x)>=Math.abs(tyc-c.y);
    let moved=false;
    const seq=tryX?[[dx,0],[0,dy]]:[[0,dy],[dx,0]];
    for(const[mx,my]of seq){ if(!mx&&!my) continue;
      if(canPlace(c,c.x+mx,c.y+my,m)){ c.x+=mx; c.y+=my; moved=true; break; } }
    if(!moved) break;
  }
}

/* ================= бот (для верификации/лимитов) ================= */
function bfsAll(c){
  const m=occMap(c), seen=new Map([[c.x+','+c.y,[]]]), q=[[c.x,c.y]];
  while(q.length){ const[x,y]=q.shift(); const path=seen.get(x+','+y);
    for(const[mx,my]of[[0,-1],[1,0],[-1,0],[0,1]]){
      const nx=x+mx,ny=y+my,k=nx+','+ny;
      if(seen.has(k)||!canPlace(c,nx,ny,m)) continue;
      seen.set(k,path.concat([[nx,ny]])); q.push([nx,ny]);
    }
  } return seen;
}
function bfsPath(c,gx,gy){ const p=bfsAll(c).get(gx+','+gy); return p===undefined?null:p; }
function botStep(){
  if(!playing) return 'stopped';
  const now=tick/60;
  const flowing=c=>c.state==='idle'&&c.y===0&&fillOf(c)<c.cap&&now-c.lastGain<0.5;
  let best=null, bestAny=null;
  for(const c of conts){ if(c.state!=='idle'||fillOf(c)>=c.cap) continue;
    if(flowing(c)) continue;
    const maxdx=Math.max(...c.cells.map(k=>k[0]));
    for(let x=0;x<=BC-1-maxdx;x++){
      let sc=0;
      for(const dx of [...new Set(c.cells.map(k=>k[0]))]){
        const col=x+dx;
        const minRow=Math.min(...c.cells.filter(k=>k[0]===dx).map(k=>k[1]));
        if(minRow>0){
          if(conts.some(o=>o!==c&&o.state==='idle'&&o.y===0&&
             o.cells.some(([ax,ay])=>o.x+ax===col&&ay===0))) continue;
        }
        for(let g=0;g<GPC;g++)for(let ry=1;ry<=6;ry++){
          const v=tank[idx(col*GPC+g,THg-ry)];
          if(v===c.col+1) sc++; else break; // непрерывная полоса своего цвета от дна
        }
      }
      if(sc>0){
        if(!bestAny||sc>bestAny.sc) bestAny={c,x,sc};
        if(!best||sc>best.sc){ const path=bfsPath(c,x,0); if(path) best={c,x,sc,path}; }
      }
    }
  }
  if(best){ for(const[nx,ny]of best.path){ best.c.x=nx; best.c.y=ny; } return 'docked'; }
  if(bestAny){
    const cand=bestAny.c;
    const region=cand.cells.map(([dx,dy])=>[bestAny.x+dx,dy]);
    const corr=new Set(region.map(r=>r[0]));
    const others=conts.filter(o=>o!==cand&&o.state==='idle'&&!flowing(o))
      .sort((a,b)=>{const ai=a.cells.some(([dx])=>corr.has(a.x+dx))?0:1;
                    const bi=b.cells.some(([dx])=>corr.has(b.x+dx))?0:1; return ai-bi;});
    const spotsOf=o=>[...bfsAll(o).entries()].map(([k,path])=>{
        const[x,y]=k.split(',').map(Number); return {x,y,path}; })
      .filter(s=>(s.x!==o.x||s.y!==o.y)&&
        !o.cells.some(([dx,dy])=>region.some(r=>r[0]===s.x+dx&&r[1]===s.y+dy)))
      .map(s=>{ const dcol=Math.min(...o.cells.map(([dx])=>{
          let m=99; for(const cc of corr) m=Math.min(m,Math.abs(s.x+dx-cc)); return m;}));
        s.score=dcol*3+s.y; return s; })
      .sort((a,b)=>b.score-a.score);
    for(const o of others){
      for(const s of spotsOf(o)){
        const ox=o.x,oy=o.y; o.x=s.x; o.y=s.y;
        const p=bfsPath(cand,bestAny.x,0);
        o.x=ox; o.y=oy;
        if(p){ for(const[nx,ny]of s.path){o.x=nx;o.y=ny;} return 'shuffle'; }
      }
    }
    for(const o1 of others.slice(0,5)){
      for(const s1 of spotsOf(o1).slice(0,7)){
        const ox1=o1.x,oy1=o1.y; o1.x=s1.x; o1.y=s1.y;
        let ok=false;
        for(const o2 of others){ if(o2===o1) continue;
          for(const[k2]of bfsAll(o2)){
            const[x2,y2]=k2.split(',').map(Number);
            if(x2===o2.x&&y2===o2.y) continue;
            if(o2.cells.some(([dx,dy])=>region.some(r=>r[0]===x2+dx&&r[1]===y2+dy))) continue;
            const ox2=o2.x,oy2=o2.y; o2.x=x2; o2.y=y2;
            if(bfsPath(cand,bestAny.x,0)) ok=true;
            o2.x=ox2; o2.y=oy2;
            if(ok) break;
          }
          if(ok) break;
        }
        o1.x=ox1; o1.y=oy1;
        if(ok){ for(const[nx,ny]of s1.path){o1.x=nx;o1.y=ny;} return 'shuffle-2ply'; }
      }
    }
    for(const o of others){
      const s=spotsOf(o).find(s=>!botHist.includes(o.id+'@'+s.x+','+s.y));
      if(s){ for(const[nx,ny]of s.path){o.x=nx;o.y=ny;}
        botHist.push(o.id+'@'+s.x+','+s.y); if(botHist.length>24) botHist.shift();
        return 'shuffle2'; }
    }
    return 'stuck';
  }
  for(const c of conts){ if(c.state!=='idle'||c.y!==0||flowing(c)) continue;
    for(let y=BR-1;y>=2;y--)for(let x=0;x<BC;x++){
      const path=bfsPath(c,x,y); if(path){ for(const[nx,ny]of path){c.x=nx;c.y=ny;} return 'evac'; } }
  }
  return 'idle';
}

/* ================= экраны/цикл ================= */
const $=s=>document.querySelector(s);
const PKEY='sandblocks_v4_progress';
let unlocked=+(localStorage.getItem(PKEY)||1);
function renderHome(){
  const d=$('#lvls'); d.innerHTML='';
  for(let i=1;i<=LEVELS.length;i++){
    const b=document.createElement('button');
    b.className='lv'+(i>unlocked?' lock':''); b.textContent=i>unlocked?'🔒':i;
    if(i<=unlocked) b.onclick=()=>startLevel(i-1);
    d.appendChild(b);
  }
}
function startLevel(n){
  level=n; buildLevel(n); playing=true; confetti=[];
  $('#home').classList.add('hidden'); $('#win').classList.add('hidden'); $('#lose').classList.add('hidden');
  $('#lvlLab').textContent='Level '+(n+1);
}
function showWin(){ popConfetti();
  unlocked=Math.max(unlocked,Math.min(LEVELS.length,level+2));
  localStorage.setItem(PKEY,unlocked);
  $('#btnNext').style.display=level+1<LEVELS.length?'':'none';
  setTimeout(()=>{ if(winFlag) $('#win').classList.remove('hidden'); },150);
}
function showLose(){ $('#lose').classList.remove('hidden'); }
$('#btnHome').onclick=()=>{playing=false;renderHome();$('#home').classList.remove('hidden');};
$('#btnWinHome').onclick=$('#btnHome').onclick;
$('#btnLoseHome').onclick=$('#btnHome').onclick;
$('#btnRetry').onclick=()=>startLevel(level);
$('#btnRetryOv').onclick=()=>startLevel(level);
$('#btnNext').onclick=()=>startLevel(level+1);

function fmt(t){ t=Math.max(0,Math.ceil(t)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last) last=ts;
  let dt=Math.min(.1,(ts-last)/1000); last=ts;
  if(playing){
    let steps=Math.round(dt*60*ffMult);
    for(let i=0;i<Math.max(1,steps);i++) step(1/60);
    if(botOn&&--botCd<=0){ botStep(); botCd=Math.max(3,18/ffMult); }
  }
  $('#timer').textContent=fmt(timeLeft);
  draw();
}
buildLevel(0); renderHome();
requestAnimationFrame(loop); fit();

/* ================= тест-хуки ================= */
window.__game={
  start:n=>startLevel(n),
  snap:()=>({level:level+1,time:+timeLeft.toFixed(1),win:winFlag,lose:loseFlag,playing,
    tankLeft:tank.reduce((a,v)=>a+(v?1:0),0),
    conts:conts.map(c=>({col:PAL[c.col].n,x:c.x,y:c.y,fill:+fillOf(c).toFixed(2),cap:c.cap,state:c.state}))}),
  ff:m=>{ffMult=m;},
  bot:on=>{botOn=on;},
  botStep,
  setTime:s=>{timeLeft=s;},
};
</script>
