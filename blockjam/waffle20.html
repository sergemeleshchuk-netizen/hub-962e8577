<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Waffle Sort v20 — ворота из арта (без лишней плашки)</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);
    display:flex;align-items:center;justify-content:center}
  #phone{position:relative;overflow:hidden;background:linear-gradient(#2a2350,#161235)}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0} }
  @media (min-aspect-ratio:1/1){ #phone{height:96dvh;aspect-ratio:9/16;width:auto;
      border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15} }
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .hint{position:absolute;left:0;right:0;bottom:7px;z-index:5;color:#c4cae8;font-size:11px;
    text-align:center;line-height:1.32;padding:0 12px;pointer-events:none}
  .rst{position:absolute;top:10px;left:10px;z-index:6;background:rgba(91,124,245,.9);color:#fff;border:none;
    font-weight:800;padding:7px 13px;border-radius:14px;font-size:13px;box-shadow:0 3px 0 #3f5ad0}
  .toast{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;background:rgba(10,8,26,.55)}
  .toast b{font-size:50px;color:#ffd84d;-webkit-text-stroke:4px #c98a00;font-weight:900;
    text-shadow:0 6px 0 rgba(0,0,0,.25);transform:rotate(-6deg)}
  .toast.lose b{color:#ff8a8a;-webkit-text-stroke:4px #a83232;font-size:40px}
  .toast .btn{background:#5b7cf5;color:#fff;border:none;font-weight:800;padding:11px 26px;border-radius:18px;
    box-shadow:0 4px 0 #3f5ad0;font-size:15px;pointer-events:auto}
</style></head>
<body>
<div id="phone">
  <canvas id="cv"></canvas>
  <button class="rst" id="reset">↺</button>
  <div class="hint">Тащи фигуру в <b>ворота её цвета</b>. Кусочки летят в <b>3 общие колбы</b> — миксы разбирает
  фигура того же цвета. Полная колба <b>упаковывается</b> в товар. Кончилось место — проигрыш. Цель — очистить поле.</div>
  <div class="toast" id="toast"><b>Cleared!</b><button class="btn" id="reset2">↺ Ещё раз</button></div>
  <div class="toast lose" id="losetoast"><b>Нет места!</b><button class="btn" id="reset3">↺ Заново</button></div>
</div>
<script src="levels_waffle_psd_v3.js?v=20"></script>
<script src="engine_waffle20.js?v=20"></script>
</body></html>
