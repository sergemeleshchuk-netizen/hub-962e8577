<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bus Jam — proto v1 (top-down)</title>
<!--
  Прототип механики "Bus Jam" (распознано из ScreenRecording_06-01-2026).
  Построен по PLAYBOOK/data-first-prototyping.md:
   - данные уровня: сетка автобусов (cell, dir, color, cap) + очередь пассажиров + слоты
   - решаемо ПО ПОСТРОЕНИЮ: сетка генерится обратной сборкой (как gen_solvable стрелок),
     очередь = порядок снятия -> выигрышная линия существует всегда
   - extraction-движок = тот же, что в proto-arrows (тап -> выезд в сторону стрелки,
     если путь до края свободен)
   - проверка: автопрогон в браузере (puppeteer) по выигрышной линии
-->
<style>
  :root{--ink:#23314a;--bg1:#eaf0fb;--bg2:#d7e2f5;--good:#34c759;--bad:#ff4d5e;--road:#b9c2d4;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,var(--bg1),var(--bg2));color:var(--ink);
    display:flex;justify-content:center;align-items:flex-start;min-height:100%;padding:12px;}
  #app{width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .title{font-weight:800;font-size:18px;}
  /* queue */
  #queueWrap{background:#fff;border-radius:16px;padding:10px;box-shadow:0 6px 18px #4a5b8022;}
  .qlabel{font-size:12px;color:#8a93ad;margin-bottom:6px;}
  #queue{display:flex;flex-wrap:wrap;gap:5px;}
  .pax{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 -2px 0 #00000022;}
  .pax.boarded{opacity:.12;}
  /* parking */
  #parkWrap{background:var(--road);border-radius:16px;padding:10px;box-shadow:inset 0 2px 6px #0003;}
  #park{display:flex;gap:8px;justify-content:center;}
  .slot{flex:1;height:54px;border-radius:10px;border:2px dashed #ffffff88;background:#ffffff14;
    display:flex;align-items:center;justify-content:center;position:relative;transition:all .15s;}
  .slot.full{border-style:solid;border-color:#fff;}
  .pbus{width:88%;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:15px;box-shadow:0 2px 5px #0003;}
  /* board */
  #board-wrap{background:#fff;border-radius:18px;padding:10px;box-shadow:0 10px 26px #4a5b8022;}
  #grid{position:relative;margin:0 auto;}
  .bus{position:absolute;border-radius:10px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;cursor:pointer;box-shadow:0 3px 6px #00000030;transition:opacity .2s;
    border:2px solid #ffffff55;}
  .bus .cap{font-size:16px;text-shadow:0 1px 2px #0006;}
  .bus .arr{position:absolute;font-size:15px;line-height:1;opacity:.95;text-shadow:0 1px 2px #0006;}
  .bus.bad{animation:buzz .3s;}
  @keyframes buzz{0%,100%{transform:translate(var(--tx,0),var(--ty,0))}25%{transform:translate(calc(var(--tx,0) - 4px),var(--ty,0))}75%{transform:translate(calc(var(--tx,0) + 4px),var(--ty,0))}}
  .hint{text-align:center;color:#8a93ad;font-size:13px;}
  footer{display:flex;gap:10px;justify-content:center;}
  button{font:inherit;font-weight:700;border:none;border-radius:13px;padding:11px 16px;cursor:pointer;
    background:#fff;color:#4a5b80;box-shadow:0 2px 8px #00000012;}
  button.primary{background:linear-gradient(90deg,#5b8def,#7a5cf6);color:#fff;}
  .overlay{position:fixed;inset:0;background:#23314a99;display:flex;align-items:center;justify-content:center;z-index:30;}
  .overlay.hidden{display:none;}
  .card{background:#fff;border-radius:22px;padding:26px;width:84%;max-width:340px;text-align:center;box-shadow:0 20px 60px #0004;}
  .card h2{margin:.1em 0;font-size:24px;} .card .em{font-size:46px;} .card p{color:#6a7390;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="title">🚌 Bus Jam <span style="font-weight:600;color:#8a93ad">proto v1</span></div>
    <button id="btnReset">↻ Reset</button>
  </div>

  <div id="queueWrap">
    <div class="qlabel">Очередь пассажиров (садятся в автобус своего цвета)</div>
    <div id="queue"></div>
  </div>

  <div id="parkWrap"><div id="park"></div></div>

  <div id="board-wrap"><div id="grid"></div></div>

  <div class="hint">Тапни автобус — он выедет в сторону стрелки, если путь до края свободен, и встанет на парковку.</div>
  <footer><button id="btnReset2" class="primary">↻ Заново</button></footer>
</div>

<div id="overlay" class="overlay hidden">
  <div class="card"><div class="em" id="ovEm"></div><h2 id="ovT"></h2><p id="ovP"></p>
    <button class="primary" id="ovB"></button></div>
</div>

<script>
// ---------- ДАННЫЕ / ПАРАМЕТРЫ ----------
const COLORS = {R:'#ef4d4d',B:'#3b82f6',G:'#27c06a',Y:'#f4b400'};
const COLOR_KEYS = Object.keys(COLORS);
const DIRS = {U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
const ARROW = {U:'▲',D:'▼',L:'◀',R:'▶'};
const CFG = {cols:4, rows:5, nBuses:12, slots:4, cap:[3,4], seed:7};

// детерминированный ГСЧ (чтобы прогон воспроизводился)
let _s = CFG.seed;
function rnd(){ _s=(_s*1103515245+12345)&0x7fffffff; return _s/0x7fffffff; }
function ri(n){ return Math.floor(rnd()*n); }
function pick(a){ return a[ri(a.length)]; }

let G=null; // состояние

// ---------- ГЕНЕРАЦИЯ РЕШАЕМОГО УРОВНЯ (обратная сборка) ----------
// Каждый новый автобус ставим так, чтобы путь перед его носом до края был свободен
// от уже поставленных. Тогда порядок снятия = обратный порядку постановки.
function genLevel(){
  _s=CFG.seed;
  const {cols,rows,nBuses}=CFG;
  const occ=new Set(); const placed=[];
  const key=(c,r)=>c+','+r;
  const inb=(c,r)=>c>=0&&c<cols&&r>=0&&r<rows;
  let tries=0;
  while(placed.length<nBuses && tries++<5000){
    const c=ri(cols), r=ri(rows); if(occ.has(key(c,r))) continue;
    const d=pick(Object.keys(DIRS)); const [dx,dy]=DIRS[d];
    // путь перед носом до края свободен от occ?
    let cx=c+dx, cy=r+dy, ok=true;
    while(inb(cx,cy)){ if(occ.has(key(cx,cy))){ok=false;break;} cx+=dx; cy+=dy; }
    if(!ok) continue;
    occ.add(key(c,r));
    placed.push({c,r,dir:d});
  }
  // порядок снятия = обратный постановке
  const removeOrder=placed.slice().reverse();
  // назначаем цвет/вместимость; очередь = по порядку снятия (победная линия)
  const queue=[];
  removeOrder.forEach((b,i)=>{
    b.color=COLOR_KEYS[i % COLOR_KEYS.length];
    b.cap=CFG.cap[ri(CFG.cap.length)];
    for(let k=0;k<b.cap;k++) queue.push(b.color);
  });
  // id и стартовый порядок (как в массиве placed)
  placed.forEach((b,i)=>b.id=i);
  return {cols,rows,buses:placed,queue,slots:CFG.slots,removeOrder:removeOrder.map(b=>b.id)};
}

// ---------- ПРАВИЛО ВЫЕЗДА (как в proto-arrows) ----------
function occupied(except){
  const s=new Set();
  for(const b of G.buses){ if(b.removed||b===except) continue; s.add(b.c+','+b.r); }
  return s;
}
function canExit(b){
  const {cols,rows}=G; const occ=occupied(b); const [dx,dy]=DIRS[b.dir];
  let cx=b.c+dx, cy=b.r+dy;
  while(cx>=0&&cx<cols&&cy>=0&&cy<rows){ if(occ.has(cx+','+cy)) return false; cx+=dx; cy+=dy; }
  return true;
}

// ---------- РЕНДЕР ----------
const CELL=78, GAP=6;
function el(tag,cls){ const e=document.createElement(tag); if(cls)e.className=cls; return e; }
function renderGrid(){
  const grid=document.getElementById('grid');
  grid.style.width=(G.cols*CELL)+'px'; grid.style.height=(G.rows*CELL)+'px';
  grid.innerHTML='';
  for(const b of G.buses){
    if(b.removed) continue;
    const d=el('div','bus'); d.style.left=(b.c*CELL+GAP)+'px'; d.style.top=(b.r*CELL+GAP)+'px';
    d.style.width=(CELL-2*GAP)+'px'; d.style.height=(CELL-2*GAP)+'px';
    d.style.background=COLORS[b.color];
    d.innerHTML='<span class="cap">'+b.cap+'</span><span class="arr">'+ARROW[b.dir]+'</span>';
    // позиция стрелки у носа
    const a=d.querySelector('.arr');
    if(b.dir==='U'){a.style.top='3px';a.style.left='50%';a.style.transform='translateX(-50%)';}
    if(b.dir==='D'){a.style.bottom='3px';a.style.left='50%';a.style.transform='translateX(-50%)';}
    if(b.dir==='L'){a.style.left='4px';a.style.top='50%';a.style.transform='translateY(-50%)';}
    if(b.dir==='R'){a.style.right='4px';a.style.top='50%';a.style.transform='translateY(-50%)';}
    d.onclick=()=>onTap(b);
    b.el=d; grid.appendChild(d);
  }
}
function renderPark(){
  const p=document.getElementById('park'); p.innerHTML='';
  for(let i=0;i<G.slots;i++){
    const s=el('div','slot'); const bus=G.parked[i];
    if(bus){ s.classList.add('full'); const pb=el('div','pbus'); pb.style.background=COLORS[bus.color];
      pb.textContent=bus.seatsLeft+'/'+bus.cap; s.appendChild(pb); }
    p.appendChild(s);
  }
}
function renderQueue(){
  const q=document.getElementById('queue'); q.innerHTML='';
  G.queue.forEach((col,i)=>{ const d=el('div','pax'+(i<G.qHead?' boarded':'')); d.style.background=COLORS[col]; q.appendChild(d); });
}
function renderAll(){ renderGrid(); renderPark(); renderQueue(); }

// ---------- ИГРОВАЯ ЛОГИКА ----------
function boardingPass(){
  // пока передний пассажир может сесть в припаркованный автобус своего цвета — сажаем
  let moved=true;
  while(moved){
    moved=false;
    if(G.qHead>=G.queue.length) break;
    const col=G.queue[G.qHead];
    const bus=G.parked.find(b=>b&&b.color===col&&b.seatsLeft>0);
    if(bus){ bus.seatsLeft--; G.qHead++; moved=true;
      if(bus.seatsLeft===0){ const idx=G.parked.indexOf(bus); G.parked[idx]=null; } // уехал
    }
  }
}
function park(b){
  const idx=G.parked.findIndex(x=>!x);
  if(idx<0) return false; // нет места
  G.parked[idx]={color:b.color,cap:b.cap,seatsLeft:b.cap};
  return true;
}
function checkEnd(){
  if(G.qHead>=G.queue.length && G.buses.every(b=>b.removed)){
    return over('🏆','Уровень пройден!','Все пассажиры уехали.'); }
  // тупик: парковка полна, передний пассажир не имеет своего автобуса на парковке,
  // и в сетке/парковке его цвет тоже не выехать сейчас выгодно -> проигрыш по переполнению
  const full=G.parked.every(x=>x);
  if(full && G.qHead<G.queue.length){
    const col=G.queue[G.qHead];
    const canBoard=G.parked.some(b=>b&&b.color===col&&b.seatsLeft>0);
    if(!canBoard) return over('💥','Парковка забита','Переднему пассажиру некуда сесть.');
  }
}
function onTap(b){
  if(G.busy||b.removed||G.ended) return;
  if(canExit(b)){
    if(!park(b)){ shake(b); return; }   // парковка полна — не выезжаем
    b.removed=true;
    boardingPass();
    renderAll();
    checkEnd();
  } else { shake(b); }
}
function shake(b){ if(!b.el) return; b.el.classList.add('bad'); setTimeout(()=>b.el&&b.el.classList.remove('bad'),320); }

function over(em,t,p){ G.ended=true;
  document.getElementById('ovEm').textContent=em; document.getElementById('ovT').textContent=t;
  document.getElementById('ovP').textContent=p; document.getElementById('ovB').textContent='Заново';
  document.getElementById('overlay').classList.remove('hidden'); return true; }
function hideOver(){ document.getElementById('overlay').classList.add('hidden'); }

function load(){
  hideOver();
  const lv=genLevel();
  G={cols:lv.cols,rows:lv.rows,buses:lv.buses,queue:lv.queue,slots:lv.slots,
     parked:new Array(lv.slots).fill(null),qHead:0,busy:false,ended:false,removeOrder:lv.removeOrder};
  window.G=G;
  renderAll();
}
document.getElementById('btnReset').onclick=load;
document.getElementById('btnReset2').onclick=load;
document.getElementById('ovB').onclick=load;
load();
</script>
</body>
</html>
