<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Math Solitaire — v11 (final · real SFX)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b3d22;font-family:Arial,Helvetica,sans-serif;touch-action:none}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:360px;height:640px;overflow:hidden;transform-origin:center center;background:#34763b}

  /* logo — square badge: 6×7 on top, MATH+SOLITAIRE stacked below, all inside a square */
  .logo{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:6}
  .logo .badge{width:66px;height:64px;background:#2f6b40;border:2px solid #215134;border-radius:13px;
               box-shadow:0 2px 5px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);
               display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1}
  .logo .cards{height:24px;display:flex;align-items:center;gap:1px}
  .logo .lc{display:inline-block;width:17px;height:23px;background:#fff;border-radius:3px;border:1px solid #cfd8df;
            font-weight:900;font-size:13px;line-height:23px;text-align:center;color:#2b7a3a}
  .logo .lc.l{transform:rotate(-7px)}
  .logo .lc.r{color:#d33;transform:rotate(7deg)}
  .logo .x{color:#d33;font-weight:900;font-size:11px;margin:0 1px}
  .logo .math{color:#ffcf33;font-weight:900;font-size:12px;letter-spacing:1.5px;text-shadow:0 1px 0 #9c7308}
  .logo .sol{background:#d33;color:#fff;font-weight:900;font-size:8px;letter-spacing:2px;padding:1px 7px;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.3)}

  .moves{position:absolute;top:62px;left:14px;width:74px;background:#fff;border-radius:14px;padding:7px 0 9px;text-align:center;
         box-shadow:0 2px 5px rgba(0,0,0,.25);z-index:5}
  .moves .lbl{font-size:10px;font-weight:800;color:#2b7a3a;letter-spacing:1px;border-bottom:2px dashed #b9d3bd;display:inline-block;padding-bottom:2px;margin-bottom:3px}
  .moves .num{font-size:24px;font-weight:900;color:#1b5e2a;line-height:1}

  .stock{position:absolute;top:62px;right:14px;width:56px;height:78px;border-radius:9px;z-index:5;cursor:pointer;
         background:#da5853;border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
  .stock::after{content:"";width:26px;height:26px;border:3px solid #c9433e;border-radius:6px;transform:rotate(45deg)}
  .stock.empty{background:#2c6340;border-color:#3f7a52;box-shadow:none;cursor:default}
  .stock.empty::after{opacity:.25}
  .stock.hot{box-shadow:0 0 0 3px #f5d986,0 0 16px rgba(245,217,134,.85)}
  .stock .badge{position:absolute;bottom:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:#222;color:#fff;
                font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;z-index:2}

  /* drawn-card slot — directly LEFT of the stock deck */
  .draw{position:absolute;top:62px;right:78px;width:56px;height:78px;z-index:5}

  /* headline overlay — ON TOP of everything, fades after first action */
  /* CATEGORIZE — over the FOUNDATION zone; DRAG — below the white cards */
  .h1{position:absolute;top:180px;left:0;right:0;text-align:center;z-index:190;pointer-events:none;color:#eafff0;font-size:18px;
      font-weight:900;letter-spacing:.5px;text-shadow:0 2px 5px rgba(0,0,0,.7);transition:opacity .45s}
  .h2{position:absolute;top:430px;left:0;right:0;text-align:center;z-index:190;pointer-events:none;color:#fff;font-size:14px;
      font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.6);transition:opacity .45s}
  .faded{opacity:0}

  .founds{position:absolute;top:150px;left:14px;right:14px;display:flex;gap:8px;z-index:3}
  .found{flex:1;height:88px;border-radius:10px;background:#1d4314;position:relative;transition:transform .12s}
  .found.hot{box-shadow:0 0 0 3px #f5d986,0 0 16px rgba(245,217,134,.85);transform:translateY(-2px)}
  .found.pop{transform:scale(1.08)}
  /* opened foundation: .goldstate (category just placed, no white yet) -> .whitestate (after first white) */
  .found .goldface,.found .whiteface{position:absolute;inset:0;border-radius:9px;display:none;flex-direction:column;align-items:center;justify-content:center}
  .found.goldstate{background:#f5d986;border:2px solid #e3c266}
  .found.goldstate .goldface{display:flex;color:#5b4a12}
  .found.whitestate{background:#f5f7f9;border:2px solid #d7e3ee}            /* white bg + outline */
  .found.whitestate .whiteface{display:flex;justify-content:flex-start;padding-top:8px;gap:9px}
  .found .goldface .gval{font-size:22px;font-weight:900;margin-top:1px}
  .found .whiteface .wval{font-size:11px;font-weight:800;color:#5b4a12;letter-spacing:.5px}  /* small font on top */
  .found .dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;width:88%}
  .found .dots i{width:7px;height:7px;border-radius:50%;background:#d2d8d2;transition:background .2s}
  .found .dots i.fill{background:#37c06a}
  .found .gold{position:absolute;inset:0;border-radius:10px;background:#f5d986;opacity:0;pointer-events:none;z-index:3}
  .found.flash .gold{animation:goldflash .55s ease}
  @keyframes goldflash{0%{opacity:.95}100%{opacity:0}}
  .found.burn{animation:burnaway .62s cubic-bezier(.3,.1,.4,1) forwards}
  @keyframes burnaway{0%{transform:scale(1);opacity:1}30%{transform:scale(1.2);opacity:1;box-shadow:0 0 30px 10px #ffd23f}100%{transform:scale(.55);opacity:0}}
  .cr{fill:currentColor;display:block}   /* flat crown (no emoji) */
  .found .goldface .cr{width:20px;height:15px}

  .card{width:56px;height:78px;border-radius:8px;background:#f5f7f9;border:2px solid #d7e3ee;box-shadow:0 2px 4px rgba(0,0,0,.22);
        display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#520b06}
  .card.cat{background:#f5d986;border:2px solid #e3c266;color:#5b4a12;flex-direction:column;gap:1px}
  .card .crown{line-height:0;margin-bottom:1px}
  .card .crown .cr{width:18px;height:13px}
  .card.cat .cv{font-size:18px;font-weight:900}
  .card.back{background:#da5853;border:2px solid #fff}
  .card.back::after{content:"";width:18px;height:18px;border:2px solid #c9433e;border-radius:4px;transform:rotate(45deg)}

  .tableau{position:absolute;top:282px;left:14px;right:14px;bottom:66px;display:flex;gap:8px;z-index:2}
  .col{flex:1;position:relative}
  .col .card{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:60px}
  .col .card.front{cursor:grab;box-shadow:0 3px 7px rgba(0,0,0,.3)}

  #dragLayer{position:absolute;inset:0;z-index:140;pointer-events:none}
  #dragLayer .card{position:absolute;width:60px;max-width:60px;transform:scale(1.06);box-shadow:0 12px 22px rgba(0,0,0,.45)}
  .card.snap{transition:left .18s ease,top .18s ease,transform .18s ease}

  .playbar{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;z-index:8}
  .playbar button{background:linear-gradient(#8ed24f,#69aa32);color:#fff;font-size:24px;font-weight:900;letter-spacing:1px;border:none;
        border-radius:14px;padding:14px 56px;box-shadow:0 5px 0 #4e8424,0 8px 14px rgba(0,0,0,.35);cursor:pointer;text-shadow:0 1px 1px rgba(0,0,0,.25);
        animation:cta 1.3s ease-in-out infinite}
  @keyframes cta{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  /* hand — pointer (reused from v1) */
  .hand{position:absolute;width:44px;height:44px;z-index:160;pointer-events:none;opacity:0;
        transition:left .35s ease,top .35s ease,opacity .2s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
  .hand.tap{animation:tap 1s ease-in-out infinite}
  @keyframes tap{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-3px,-8px) scale(.93)}}

  .spark{position:absolute;border-radius:2px;z-index:135;pointer-events:none}
  .star{position:absolute;z-index:136;pointer-events:none;font-size:20px}

  #end{position:absolute;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;background:#34763b}
  #end.show{display:flex;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="fit"><div id="stage">

  <div class="logo">
    <div class="badge">
      <div class="cards"><span class="lc l">6</span><span class="x">×</span><span class="lc r">7</span></div>
      <span class="math">MATH</span>
      <span class="sol">SOLITAIRE</span>
    </div>
  </div>

  <div class="moves"><span class="lbl">MOVES</span><div class="num" id="moves">130</div></div>
  <div class="draw" id="draw"></div>
  <div class="stock" id="stock"><div class="badge" id="stockBadge">3</div></div>

  <div class="h1" id="h1">CATEGORIZE ALL CARDS</div>
  <div class="founds" id="founds"></div>
  <div class="h2" id="h2">DRAG THE CARDS!</div>
  <div class="tableau" id="tableau"></div>

  <div id="dragLayer"></div>

  <svg class="hand" id="hand" viewBox="0 0 64 64"><path fill="#ffe0bd" stroke="#caa17a" stroke-width="2"
    d="M26 6c3 0 5 2 5 5v18l3-1c2-1 4 0 5 2l8 16c2 5 1 12-4 16-4 3-9 4-14 4-7 0-12-3-15-9L9 42c-1-3 0-6 3-7s6 0 7 3l2 4V11c0-3 2-5 5-5z"/></svg>

  <div class="playbar"><button onclick="ctaClick()">PLAY NOW</button></div>

  <div id="end">
    <div class="logo" style="position:static;transform:none;margin-bottom:26px">
      <div class="badge" style="width:150px;height:146px;border-radius:26px;gap:8px">
        <div class="cards" style="height:62px;gap:3px">
          <span class="lc l" style="width:44px;height:60px;font-size:30px;line-height:60px">6</span>
          <span class="x" style="font-size:24px">×</span>
          <span class="lc r" style="width:44px;height:60px;font-size:30px;line-height:60px">7</span></div>
        <span class="math" style="font-size:28px;letter-spacing:2px">MATH</span>
        <span class="sol" style="font-size:14px;letter-spacing:3px;padding:2px 14px">SOLITAIRE</span>
      </div>
    </div>
    <div class="playbar" style="position:static"><button onclick="ctaClick()">PLAY NOW</button></div>
  </div>

</div></div>

var AC=null, SFX_ON=true, BUF={}, _decoded=false;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function decodeAll(){ if(_decoded) return; var a=ac(); if(!a) return; _decoded=true;
  Object.keys(SFX_SRC).forEach(function(k){ try{
    var bin=atob(SFX_SRC[k].split(',')[1]), u=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    a.decodeAudioData(u.buffer, function(buf){ BUF[k]=buf; }, function(){});
  }catch(e){} }); }
function playBuf(k,vol,rate){ var a=ac(); if(!a||!SFX_ON||!BUF[k]) return;
  var s=a.createBufferSource(); s.buffer=BUF[k]; s.playbackRate.value=rate||1;
  var g=a.createGain(); g.gain.value=(vol==null?0.8:vol); s.connect(g); g.connect(a.destination); s.start(0); }
function sndPick(){ playBuf('pick',0.7); }
function sndDeck(){ playBuf('deck',0.7); }
function sndOpen(){ playBuf('open',0.85); }
function sndFill(n){ playBuf('fill',0.6, 1+Math.min(n,8)*0.05); }      /* rising-pitch combo */
function sndComplete(){ playBuf('complete',0.85); }
function sndInvalid(){ playBuf('invalid',0.7); }
function sndWin(){ playBuf('win',0.95); }

/* ---------- LEVEL ---------- */
var LEVEL = {
  movesStart:130,
  draw:{t:'cat',v:16},                          // gold category already on field (next to deck)
  // deck = categories + 2 WHITE cards mixed in (whites placed after their category opens)
  stock:[ {t:'cat',v:15}, {t:'cat',v:9}, {t:'expr',e:'30/2'}, {t:'cat',v:12}, {t:'expr',e:'48/4'} ],
  stacks:[
    [ {t:'expr',e:'36/3'}, {t:'expr',e:'32/2'}, {t:'expr',e:'10+5'}, {t:'expr',e:'8+8'} ],   // 12,16,15,16
    [ {t:'expr',e:'2×6'},  {t:'expr',e:'45/3'}, {t:'expr',e:'24/2'}, {t:'expr',e:'20−4'} ],  // 12,15,12,16
    [ {t:'expr',e:'6+6'},  {t:'expr',e:'3×4'},  {t:'expr',e:'√81'},  {t:'expr',e:'3×5'} ],   // 12,12,9,15
    [ {t:'expr',e:'4×4'},  {t:'expr',e:'20−5'}, {t:'expr',e:'18/2'}, {t:'expr',e:'3²'} ]     // 16,15,9,9
  ]
  // needs: 16->4, 15->5, 9->3, 12->6   (15 & 12 each have 1 white in the deck)
};

function val(e){
  var s=(""+e).replace(/×|X|x/g,"*").replace(/÷|\//g,"/").replace(/−|–/g,"-").replace(/\s/g,""),m;
  if((m=s.match(/^√(\d+)$/)))return Math.round(Math.sqrt(+m[1]));
  if((m=s.match(/^(\d+)²$/)))return (+m[1])*(+m[1]);
  if((m=s.match(/^(\d+)([*/+\-])(\d+)$/))){var a=+m[1],b=+m[3];return m[2]==="*"?a*b:m[2]==="/"?a/b:m[2]==="+"?a+b:a-b;}
  return +s;
}
function cardValue(c){return c.t==='cat'?c.v:val(c.e);}
function cardLabel(c){return c.t==='cat'?(""+c.v):c.e;}
/* category cards get a CROWN above the value; expr cards plain */
var CROWN='<svg class="cr" viewBox="0 0 24 18"><path d="M2 16 V6.5 L7.5 11 L12 3 L16.5 11 L22 6.5 V16 Z"/></svg>';
function setCardFace(el,t,label){ if(t==='cat') el.innerHTML='<span class="crown">'+CROWN+'</span><span class="cv">'+label+'</span>'; else el.textContent=label; }

var need={},allCards=[],catVals={};
function scan(c){allCards.push(c);if(c.t==='expr'){var v=val(c.e);need[v]=(need[v]||0)+1;}else catVals[c.v]=true;}
scan(LEVEL.draw);LEVEL.stock.forEach(scan);LEVEL.stacks.forEach(function(s){s.forEach(scan);});

function validate(){
  var errs=[];
  Object.keys(need).forEach(function(v){if(!catVals[v])errs.push("expr "+v+" no category");});
  console.log(errs.length?"VALIDATE ERR:\n"+errs.join("\n"):"VALIDATE OK ("+allCards.length+" cards; cats "+Object.keys(catVals).join(",")+"; needs "+JSON.stringify(need)+")");
  return {ok:errs.length===0,errs:errs,total:allCards.length};
}

/* ---------- state ---------- */
var stage=document.getElementById("stage"),dragLayer=document.getElementById("dragLayer"),hand=document.getElementById("hand"),stockEl=document.getElementById("stock");
var founds=[],cols=[],stockArr=LEVEL.stock.slice(),drawCard=null;
var moves=LEVEL.movesStart,placed=0,total=allCards.length;
var started=false, tutorialStep=0, tutorialOff=false;  // 0:place cat, 1:place white on it, 2:tap deck, 3:done
var pick=new Map();

function render(){
  document.getElementById("moves").textContent=moves; refreshStockBadge();
  var fe=document.getElementById("founds");fe.innerHTML="";founds=[];
  for(var i=0;i<4;i++){var d=document.createElement("div");d.className="found";
    d.innerHTML='<div class="gold"></div>'
      +'<div class="goldface"><span class="crown">'+CROWN+'</span><span class="gval"></span></div>'
      +'<div class="whiteface"><span class="wval"></span><div class="dots"></div></div>';
    fe.appendChild(d);founds.push({el:d,value:null,need:0,count:0});}
  var te=document.getElementById("tableau");te.innerHTML="";cols=[];pick.clear();
  LEVEL.stacks.forEach(function(stack,ci){
    var c=document.createElement("div");c.className="col";te.appendChild(c);var cards=[];
    stack.forEach(function(spec,idx){var el=document.createElement("div");el.className="card";el.style.top=(idx*15)+"px";c.appendChild(el);
      cards.push({el:el,t:spec.t,v:cardValue(spec),label:cardLabel(spec),baseTop:idx*15});});
    cols.push({el:c,cards:cards});refreshCol(ci);});
  drawCard=null;document.getElementById("draw").innerHTML="";spawnDraw(LEVEL.draw);
}
function refreshStockBadge(){document.getElementById("stockBadge").textContent=stockArr.length;stockEl.classList.toggle("empty",stockArr.length===0);}
function refreshCol(ci){var col=cols[ci];col.cards.forEach(function(card,idx){var front=(idx===col.cards.length-1);pick.delete(card.el);
  if(front){card.el.className="card front"+(card.t==='cat'?" cat":"");setCardFace(card.el,card.t,card.label);pick.set(card.el,{card:card,source:"col",col:ci});}
  else{card.el.className="card back";card.el.textContent="";}});}
function spawnDraw(spec){var el=document.createElement("div");el.className="card front"+(spec.t==='cat'?" cat":"");
  el.style.position="absolute";el.style.left="0";el.style.top="0";el.style.width="56px";setCardFace(el,spec.t,cardLabel(spec));
  document.getElementById("draw").appendChild(el);drawCard={el:el,t:spec.t,v:cardValue(spec),label:cardLabel(spec)};pick.set(el,{card:drawCard,source:"draw"});}

function drawFromStock(){if(drawCard||!stockArr.length)return false;var spec=stockArr.shift();refreshStockBadge();spawnDraw(spec);guide();return true;}
stockEl.addEventListener("click",function(){
  if(!tutorialOff && tutorialStep<2) return;           // deck locked until the scripted "tap" step
  fadeHeadlines();
  if(tutorialStep===2){ tutorialStep=3; tutorialOff=true; }   // step3: hand hides after taking a new category
  if(drawFromStock()){ stockEl.classList.remove("hot"); sndDeck(); }
  if(tutorialOff){ hand.style.opacity=0; hand.classList.remove("tap"); }
});

function emptySlot(){for(var i=0;i<founds.length;i++)if(founds[i].value===null)return i;return -1;}
function targetFoundation(card){
  if(card.t==='cat')return emptySlot();
  for(var i=0;i<founds.length;i++)if(founds[i].value===card.v&&founds[i].count<founds[i].need)return i;
  return -1;
}
function openCount(){var n=0;founds.forEach(function(f){if(f.value!==null)n++;});return n;}
function frontCards(){return cols.filter(function(c){return c.cards.length;}).map(function(c){return c.cards[c.cards.length-1];});}
function existsUnplaceableExpr(){var l=frontCards();if(drawCard&&drawCard.t==='expr')l.push(drawCard);
  return l.some(function(c){return c.t==='expr'&&targetFoundation(c)<0;});}

function scale(){return Math.min(window.innerWidth/360,window.innerHeight/640);}
function toStage(x,y){var r=stage.getBoundingClientRect(),s=scale();return{x:(x-r.left)/s,y:(y-r.top)/s};}
function rectInStage(el){var r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect(),s=scale();return{x:(r.left-sr.left)/s,y:(r.top-sr.top)/s,w:r.width/s,h:r.height/s};}

/* ---------- suggest (used for hand + as a validity oracle) ---------- */
function suggest(){
  if(drawCard&&drawCard.t==='cat'&&emptySlot()>=0)return{type:'card',card:drawCard};
  if(openCount()<2&&!drawCard&&stockArr.length>0)return{type:'stock'};
  var fc=frontCards(),i;
  for(i=0;i<fc.length;i++)if(fc[i].t==='cat'&&emptySlot()>=0)return{type:'card',card:fc[i]};
  if(drawCard&&drawCard.t==='expr'&&targetFoundation(drawCard)>=0)return{type:'card',card:drawCard};
  for(i=0;i<fc.length;i++)if(fc[i].t==='expr'&&targetFoundation(fc[i])>=0)return{type:'card',card:fc[i]};
  if(stockArr.length>0&&emptySlot()>=0&&(existsUnplaceableExpr()||!drawCard))return{type:'stock'};
  return null;
}
/* a front WHITE card that fits an already-open foundation (for tutorial step 1) */
function whiteForOpenFound(){var fc=frontCards();for(var i=0;i<fc.length;i++)if(fc[i].t==='expr'&&targetFoundation(fc[i])>=0)return fc[i];return null;}

/* SCRIPTED tutorial hand:
   step0 = place the gold category already on field
   step1 = place a WHITE card (solution) onto that opened category
   step2 = tap the deck to take a NEW category   -> then hand hides forever */
function pointHandAt(el,bias){var r=rectInStage(el);hand.style.opacity=1;hand.classList.add("tap");
  hand.style.left=(r.x+r.w*0.5-16)+"px";hand.style.top=(r.y+r.h*(bias||0.5)-2)+"px";}
function guide(){
  hand.classList.remove("tap");stockEl.classList.remove("hot");
  if(tutorialOff){hand.style.opacity=0;return;}
  if(tutorialStep===0){
    if(drawCard&&drawCard.t==='cat'){ pointHandAt(drawCard.el,0.5); return; }
  } else if(tutorialStep===1){
    var w=whiteForOpenFound(); if(w){ pointHandAt(w.el,0.42); return; }
  } else if(tutorialStep===2){
    stockEl.classList.add("hot"); pointHandAt(stockEl,0.55); return;
  }
  hand.style.opacity=0;
}
function fadeHeadlines(){if(!started){started=true;document.getElementById("h1").classList.add("faded");document.getElementById("h2").classList.add("faded");}}

/* ---------- DRAG ---------- */
var drag=null;
stage.addEventListener("pointerdown",function(ev){
  var el=ev.target.closest(".card");if(!el||!pick.has(el))return;
  var info=pick.get(el),card=info.card;ev.preventDefault();
  fadeHeadlines(); sndPick(); hand.style.opacity=0;hand.classList.remove("tap");stockEl.classList.remove("hot");
  var rc=rectInStage(el),p=toStage(ev.clientX,ev.clientY);
  drag={info:info,card:card,grabX:p.x-rc.x,grabY:p.y-rc.y,w:rc.w,h:rc.h};
  pick.delete(el);dragLayer.appendChild(el);
  el.className="card"+(card.t==='cat'?" cat":"");setCardFace(el,card.t,card.label);
  el.style.left=rc.x+"px";el.style.top=rc.y+"px";el.style.transform="scale(1.06)";moveDrag(ev);
});
window.addEventListener("pointermove",function(ev){if(drag)moveDrag(ev);});
window.addEventListener("pointerup",function(ev){if(drag)dropDrag(ev);});
function moveDrag(ev){var p=toStage(ev.clientX,ev.clientY),el=drag.card.el;
  el.style.left=(p.x-drag.grabX)+"px";el.style.top=(p.y-drag.grabY)+"px";
  var fi=targetFoundation(drag.card);founds.forEach(function(f,i){f.el.classList.toggle("hot",i===fi);});}
function dropDrag(ev){var fi=targetFoundation(drag.card),over=foundationUnder(ev.clientX,ev.clientY);
  founds.forEach(function(f){f.el.classList.remove("hot");});
  var accept=(over===fi)||(over<0&&nearFoundRow(ev.clientY)&&fi>=0);
  if(accept&&fi>=0)land(drag.info,fi);else returnCard(drag.info);drag=null;}
function foundationUnder(x,y){for(var i=0;i<founds.length;i++){var r=founds[i].el.getBoundingClientRect();
  if(x>=r.left-14&&x<=r.right+14&&y>=r.top-14&&y<=r.bottom+14)return i;}return -1;}
function nearFoundRow(y){var r=document.getElementById("founds").getBoundingClientRect();return y<r.bottom+44;}

function returnCard(info){var el=info.card.el,card=info.card; sndInvalid();
  if(info.source==="col"){cols[info.col].el.appendChild(el);el.className="card front snap"+(card.t==='cat'?" cat":"");setCardFace(el,card.t,card.label);
    el.style.left="50%";el.style.top=card.baseTop+"px";el.style.transform="translateX(-50%)";pick.set(el,info);
    setTimeout(function(){el.classList.remove("snap");el.style.transform="translateX(-50%)";guide();},190);}
  else{document.getElementById("draw").appendChild(el);el.className="card front snap"+(card.t==='cat'?" cat":"");setCardFace(el,card.t,card.label);
    el.style.left="0";el.style.top="0";el.style.transform="scale(1)";pick.set(el,info);
    setTimeout(function(){el.classList.remove("snap");guide();},190);}}

function land(info,fi){
  var card=info.card,el=card.el,f=founds[fi];
  if(info.source==="col"){cols[info.col].cards.pop();refreshCol(info.col);}else{drawCard=null;}
  if(card.t==='cat'){
    f.value=card.v;f.need=need[card.v]||0;f.count=0;
    f.el.classList.add("goldstate","flash");            // stays GOLD until first white card
    f.el.querySelector(".goldface .gval").textContent=card.v;
    f.el.querySelector(".whiteface .wval").textContent=card.v;
    var dots="";for(var i=0;i<f.need;i++)dots+="<i></i>";f.el.querySelector(".whiteface .dots").innerHTML=dots;
    setTimeout(function(){f.el.classList.remove("flash");},560);
    sndOpen();
  }
  var rc=rectInStage(f.el);el.classList.add("snap");
  el.style.left=(rc.x+(rc.w-drag.w)/2)+"px";el.style.top=(rc.y+(rc.h-drag.h)/2)+"px";el.style.transform="scale(.85)";
  setTimeout(function(){
    el.remove();
    if(card.t==='expr'){
      if(f.count===0){ f.el.classList.remove("goldstate"); f.el.classList.add("whitestate"); }  // first white -> gold→white
      f.count++;var di=f.el.querySelectorAll(".whiteface .dots i");if(di[f.count-1])di[f.count-1].classList.add("fill");
      sndFill(f.count);
    }
    f.el.classList.add("pop");setTimeout(function(){f.el.classList.remove("pop");},140);
    burst(f.el,12,["#ffe066","#7ed957","#fff","#37c06a"],26);
    placed++;moves--;document.getElementById("moves").textContent=moves;fadeHeadlines();

    if(!tutorialOff){
      if(tutorialStep===0 && card.t==='cat') tutorialStep=1;          // placed first category -> now show white solution
      else if(tutorialStep===1 && card.t==='expr') tutorialStep=2;    // placed a white -> now show deck tap
    }

    var completed = (card.t==='expr' && f.count>=f.need && f.need>0);
    if(completed) completeFoundation(f);

    if(placed>=total){ win(); }
    else { guide(); }
  },170);
}

/* ---------- category complete: gold burst + burn away ---------- */
function completeFoundation(f){
  burst(f.el,26,["#ffd23f","#ffe066","#fff7cc","#ffb84d"],46);   // big GOLD burst (no star — it flickered)
  sndComplete();
  f.el.classList.add("burn");
  setTimeout(function(){
    f.value=null;f.need=0;f.count=0;
    f.el.classList.remove("burn","goldstate","whitestate");      // back to empty dark slot
    f.el.querySelector(".goldface .gval").textContent="";
    f.el.querySelector(".whiteface .wval").textContent="";
    f.el.querySelector(".whiteface .dots").innerHTML="";
    f.el.style.transform="";f.el.style.opacity="";
    guide();
  },640);
}

function burst(target,n,colors,spread){var rc=rectInStage(target),cx=rc.x+rc.w/2,cy=rc.y+rc.h/2;
  for(var i=0;i<n;i++){var p=document.createElement("div");p.className="spark";var sz=6+(i%3)*3;
    p.style.width=sz+"px";p.style.height=sz+"px";p.style.background=colors[i%colors.length];
    p.style.left=cx+"px";p.style.top=cy+"px";stage.appendChild(p);
    var a=Math.PI*2*i/n,d=spread*(0.6+(i%4)*0.16);(function(p,dx,dy){p.animate([{transform:"translate(0,0) scale(1)",opacity:1},
      {transform:"translate("+dx+"px,"+dy+"px) scale(0)",opacity:0}],{duration:620,easing:"cubic-bezier(.2,.7,.3,1)"});
      setTimeout(function(){p.remove();},640);})(p,Math.cos(a)*d,Math.sin(a)*d);}}

function win(){ sndWin(); setTimeout(function(){document.getElementById("end").classList.add("show");},560);}
var ctaFired=false;
function ctaClick(){if(ctaFired)return;ctaFired=true;
  try{if(window.FbPlayableAd&&FbPlayableAd.onCTAClick){FbPlayableAd.onCTAClick();return;}}catch(e){}
  try{if(typeof ExitApi!=="undefined"&&ExitApi.exit){ExitApi.exit();return;}}catch(e){}
  try{if(window.mraid&&mraid.open){mraid.open(STORE_URL);return;}}catch(e){}
  try{window.open(STORE_URL,"_blank");}catch(e){}}

function fit(){stage.style.transform="scale("+scale()+")";}
window.addEventListener("resize",function(){fit();guide();});
validate();render();fit();
requestAnimationFrame(function(){requestAnimationFrame(function(){fit();guide();});});
setTimeout(guide,400);
try{decodeAll();}catch(e){}
</script>
</body>
</html>
