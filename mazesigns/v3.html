<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Maze Signs v3 · Driving School</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;height:100dvh;display:flex;align-items:center;justify-content:center;
  overflow:hidden;user-select:none;touch-action:none;background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}
#phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,#a9dcff 0%,#d8f1ff 38%,#bfe3b1 100%);}
@media (max-aspect-ratio:1/1){#phone{width:100vw;height:100dvh;border-radius:0;}}
@media (min-aspect-ratio:1/1){#phone{height:96dvh;aspect-ratio:9/16;width:auto;border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}}
#bg{position:absolute;inset:0;z-index:0;overflow:hidden}
#bg .cloud{position:absolute;width:120px;height:40px;background:#fff;border-radius:40px;opacity:.8;filter:blur(1px);animation:cl 40s linear infinite}
#bg .cloud::before{content:'';position:absolute;left:25px;top:-22px;width:60px;height:60px;background:#fff;border-radius:50%}
@keyframes cl{from{transform:translateX(-160px)}to{transform:translateX(560px)}}

#hud{width:100%;padding:12px 16px 4px;z-index:3;display:flex;align-items:center;gap:12px;visibility:hidden}
.pill{background:rgba(255,255,255,.9);border-radius:14px;padding:7px 12px;font-weight:800;color:#1e3a5f;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.08);white-space:nowrap}
#fuelWrap{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 rgba(0,0,0,.08);transition:box-shadow .3s}
#fuelWrap.gain{box-shadow:0 0 0 4px #7ed957,0 3px 0 rgba(0,0,0,.08)}
#fuelBar{flex:1;height:14px;background:#dfe6ee;border-radius:8px;overflow:hidden}
#fuelFill{height:100%;width:100%;background:linear-gradient(90deg,#2ecc71,#7ed957);border-radius:8px;transition:width .25s}
#fuelFill.low{background:linear-gradient(90deg,#e53935,#ff7043)}
#fuelNum{font-weight:800;color:#1e3a5f;font-size:13px;min-width:22px;text-align:right}
.btn{border:none;cursor:pointer;font:inherit}
#homeBtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.9);font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.08)}

#stage{flex:1;width:100%;position:relative;z-index:2;min-height:0}
#hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:12;background:#fff;border-radius:16px;padding:9px 14px;font-weight:800;color:#1e3a5f;font-size:13px;max-width:88%;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.1),0 8px 20px rgba(0,0,0,.15);display:none;animation:pop .35s cubic-bezier(.2,1.6,.4,1);line-height:1.3}
#hint.on{display:block}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center;border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.28),0 0 0 6px #4b5160}
#cells{position:absolute;inset:0;display:grid;border-radius:12px;overflow:hidden}
.c{position:relative;overflow:hidden}
.c.road{background:#565c6b}
.c.house{background:#565c6b}
.c.house::before{content:'';position:absolute;inset:4px;border-radius:7px;background:var(--roof,#e8a25c);box-shadow:0 5px 8px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.35)}
.c.house::after{content:'';position:absolute;left:50%;top:4px;bottom:4px;width:3px;background:rgba(0,0,0,.18);transform:translateX(-50%)}
.c.park{background:#565c6b}
.c.park::before{content:'';position:absolute;inset:4px;border-radius:7px;background:#84cc72;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.c.park::after{content:'';position:absolute;left:22%;top:22%;width:56%;height:56%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#69b65a,#3f8f38 70%);box-shadow:0 3px 4px rgba(0,0,0,.3)}
.c.block{background:#565c6b}
.c.block::before{content:'';position:absolute;left:14%;right:14%;top:50%;height:14px;margin-top:-7px;border-radius:7px;background:repeating-linear-gradient(90deg,#fff 0 10px,#e53935 10px 20px);box-shadow:0 3px 5px rgba(0,0,0,.45)}
.c.block.v::before{left:50%;right:auto;top:14%;bottom:14%;height:auto;width:14px;margin:0 0 0 -7px;background:repeating-linear-gradient(180deg,#fff 0 10px,#e53935 10px 20px)}
.c.block::after{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:#ff8f00;left:50%;top:50%;margin:-5px;box-shadow:0 0 0 3px #565c6b}
.c.exit{background:repeating-conic-gradient(#f5f5f5 0 25%,#2b2b2b 0 50%) 0 0/16px 16px}
#marks,#route{position:absolute;inset:0;pointer-events:none;overflow:visible}
#route polyline{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 10;animation:march 1s linear infinite;opacity:.9}
@keyframes march{to{stroke-dashoffset:-40}}
#route .exit{stroke:#7ef29a}
#route .crash{stroke:#ff6b6b}
#route .stop{stroke:#fff}
#route .fuelout{stroke:#ffab40}
#routeEnd{position:absolute;width:34px;height:34px;margin:-17px;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;pointer-events:none;box-shadow:0 3px 8px rgba(0,0,0,.35);z-index:7}
#routeEnd.crash{display:flex;background:#e53935}
#routeEnd.fuelout{display:flex;background:#ff8f00;font-size:17px}
#slots,#signs,#fx{position:absolute;inset:0;pointer-events:none}
.slot{position:absolute;width:40px;height:40px;margin:-20px;border-radius:50%;border:3px dashed rgba(255,255,255,.4);transition:transform .15s,border-color .15s,background .15s;z-index:4}
.slot.hot{border-color:#fff;background:rgba(255,255,255,.3);transform:scale(1.2);box-shadow:0 0 0 6px rgba(255,255,255,.25)}
.slot.taken{opacity:0}
.slot.taken.hot{opacity:1;border-color:#ff5252;background:rgba(255,82,82,.25);box-shadow:0 0 0 6px rgba(255,82,82,.3)}
.slot.here{border-color:#ffd54f;border-style:solid;width:60px;height:60px;margin:-30px;animation:pulse 1s ease-in-out infinite}
.slot.tut{border-color:#ffd54f;border-style:solid;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,213,79,.6)}50%{transform:scale(1.15);box-shadow:0 0 0 10px rgba(255,213,79,0)}}
.sign{position:absolute;width:44px;height:44px;margin:-22px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;background:var(--c1);box-shadow:0 3px 0 var(--c2),0 6px 12px rgba(0,0,0,.4)}
.sign svg{width:28px;height:28px;display:block;filter:drop-shadow(0 1px 0 rgba(0,0,0,.3))}
.sign.oct{background:none;border:none;box-shadow:none;border-radius:0}
.sign.oct svg{width:100%!important;height:100%!important;filter:drop-shadow(0 3px 0 #8e0000) drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.sign.pop{animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.sign.bad{animation:shake .35s}
.sign.eat{animation:eat .35s forwards}
.sign.tghost{opacity:.42;animation:tpulse 1.1s ease-in-out infinite;z-index:3}
@keyframes tpulse{0%,100%{transform:scale(.95)}50%{transform:scale(1.08)}}
@keyframes eat{to{transform:scale(0);opacity:0}}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
#flag{position:absolute;margin:-40px -24px;width:48px;height:20px;border-radius:8px;background:#fff;color:#2e9e44;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.3);pointer-events:none;letter-spacing:1px;z-index:8}
.gas{position:absolute;width:48px;height:48px;margin:-24px;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 3px 0 #b0bec5,0 6px 12px rgba(0,0,0,.3);z-index:2;transition:opacity .4s,filter .4s}
.gas span{font-size:20px}.gas b{font-size:11px;color:#2e9e44;margin-top:1px}
.gas.empty{opacity:.45;filter:grayscale(1)}
.gas.pulse{animation:gpulse 1.2s ease-in-out infinite}
@keyframes gpulse{0%,100%{box-shadow:0 3px 0 #b0bec5,0 0 0 0 rgba(126,217,87,.7)}50%{box-shadow:0 3px 0 #b0bec5,0 0 0 10px rgba(126,217,87,0)}}
.float{position:absolute;margin:-14px -30px;width:60px;text-align:center;font-weight:900;font-size:20px;color:#2e9e44;text-shadow:0 2px 0 #fff,0 0 8px #fff;animation:floatUp 1.2s ease-out forwards;z-index:9;pointer-events:none}
@keyframes floatUp{to{transform:translateY(-50px);opacity:0}}

.car{position:absolute;width:32px;height:54px;left:0;top:0;margin-left:-16px;margin-top:-27px;will-change:transform;z-index:6}
.car .sh{position:absolute;inset:2px -2px -4px;background:rgba(0,0,0,.35);border-radius:12px;filter:blur(3px)}
.car .body{position:absolute;inset:0;background:linear-gradient(90deg,#b71c1c,#ef5350 45%,#f06060 55%,#b71c1c);border-radius:11px 11px 9px 9px}
.car .glass{position:absolute;left:5px;right:5px;top:12px;height:10px;background:linear-gradient(#bfe7ff,#7cc4f5);border-radius:3px 3px 2px 2px}
.car .roof{position:absolute;left:4px;right:4px;top:22px;height:16px;background:#e53935;border-radius:3px}
.car .arr{position:absolute;left:7px;right:7px;top:23px;height:14px;background:#fff;clip-path:polygon(50% 0,100% 100%,68% 100%,50% 48%,32% 100%,0 100%);filter:drop-shadow(0 1px 0 rgba(0,0,0,.3))}
.car .glass2{position:absolute;left:5px;right:5px;bottom:7px;height:7px;background:#7cc4f5;border-radius:2px 2px 3px 3px}
.car .hl{position:absolute;top:1px;width:8px;height:4px;background:#fff59d;border-radius:2px;box-shadow:0 0 8px 2px rgba(255,245,157,.8)}
.car .hl.l{left:4px}.car .hl.r{right:4px}
.car .tl{position:absolute;bottom:1px;width:7px;height:3px;background:#ff1744;border-radius:2px}
.car .tl.l{left:4px}.car .tl.r{right:4px}
.car .wh{position:absolute;width:6px;height:12px;background:#1b1b1b;border-radius:2px}
.car .wh.a{left:-3px;top:9px}.car .wh.b{right:-3px;top:9px}.car .wh.c{left:-3px;bottom:9px}.car .wh.d{right:-3px;bottom:9px}
#nose{position:absolute;width:22px;height:14px;margin:-7px -11px;background:#ffd54f;clip-path:polygon(50% 0,100% 100%,50% 65%,0 100%);z-index:5;pointer-events:none;display:none;animation:nose .9s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
@keyframes nose{0%,100%{opacity:.55}50%{opacity:1}}
#boom{position:absolute;font-size:54px;margin:-32px;display:none;z-index:9;animation:pop .3s}
#board.shake{animation:bshake .5s}
@keyframes bshake{0%,100%{transform:translate(-50%,-50%) scale(var(--s))}20%{transform:translate(calc(-50% - 8px),-50%) scale(var(--s))}40%{transform:translate(calc(-50% + 8px),-50%) scale(var(--s))}60%{transform:translate(calc(-50% - 5px),-50%) scale(var(--s))}80%{transform:translate(calc(-50% + 5px),-50%) scale(var(--s))}}

#tray{width:100%;padding:8px 16px 22px;display:flex;justify-content:center;gap:16px;z-index:3;visibility:hidden}
.tcard{width:84px;height:84px;border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 6px 0 rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;position:relative;cursor:grab;transition:transform .15s}
.tcard .sign{position:relative;margin:0;width:58px;height:58px}
.tcard .sign svg{width:38px;height:38px}
.tcard .post{position:absolute;left:50%;top:50%;width:6px;height:30px;margin-left:-3px;background:#8d8d8d;border-radius:3px}
.tcard .lbl{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;color:#5c728f;letter-spacing:.3px}
.tcard.used{background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5);cursor:default}
.tcard.sel{transform:translateY(-8px) scale(1.06);box-shadow:0 10px 0 rgba(0,0,0,.12),0 0 0 4px #ffd54f}
.tcard.new{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
#ghost{position:absolute;z-index:40;pointer-events:none;display:none}
#ghost .sign{position:relative;margin:0;width:58px;height:58px;transform:scale(1.1)}
#ghost .sign svg{width:38px;height:38px}

.ov{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,30,50,.55);backdrop-filter:blur(3px)}
.ov.hidden{display:none}
.card{background:#fff;border-radius:26px;padding:26px 28px;text-align:center;min-width:250px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.card h2{margin:0 0 6px;font-size:28px;color:#1e3a5f}
.card p{margin:0 0 18px;color:#5c728f;font-weight:600}
.big{display:block;width:100%;padding:14px;border-radius:16px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(#4caf50,#2e9e44);box-shadow:0 5px 0 #23782f;margin-top:10px}
.big.alt{background:linear-gradient(#ffb300,#ff8f00);box-shadow:0 5px 0 #c66900}
.big.grey{background:linear-gradient(#90a4ae,#78909c);box-shadow:0 5px 0 #546e7a}

#home{position:absolute;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,#a9dcff 0%,#d8f1ff 38%,#bfe3b1 100%)}
#home h1{margin:7dvh 0 2px;font-size:44px;color:#1259c9;text-shadow:0 4px 0 rgba(255,255,255,.7),0 8px 20px rgba(0,0,0,.15);letter-spacing:1px}
#home .sub{color:#2a4d7a;font-weight:700;margin-bottom:1dvh;text-align:center;padding:0 24px}
#legend{display:flex;gap:8px;margin:6px 0 1dvh;align-items:center}
#legend .sign{position:relative;margin:0;width:38px;height:38px;border-width:2px}
#legend .sign svg{width:24px;height:24px}
#legend .gas{position:relative;margin:0;width:38px;height:38px;border-radius:9px}
#legend .gas span{font-size:15px}#legend .gas b{font-size:9px}
#map{position:relative;width:300px;flex:1;max-height:56dvh}
#map svg{position:absolute;inset:0;width:100%;height:100%}
.lv{position:absolute;width:62px;height:62px;margin:-31px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3c86f0,#1259c9 70%);border:4px solid #fff;color:#fff;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #0b3f8f,0 8px 16px rgba(0,0,0,.3);cursor:pointer;transition:transform .15s}
.lv:active{transform:scale(.95)}
.lv.done{background:radial-gradient(circle at 40% 35%,#7ed957,#2e9e44 70%);box-shadow:0 5px 0 #23782f,0 8px 16px rgba(0,0,0,.3)}
.lv small{position:absolute;top:66px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;color:#1e3a5f;text-shadow:0 1px 0 #fff}
.conf{position:absolute;width:10px;height:14px;border-radius:2px;z-index:28;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110dvh) rotate(720deg);opacity:.6}}
</style>
</head>
<body>
<div id="phone">
  <div id="bg"><div class="cloud" style="top:6%;left:10%"></div><div class="cloud" style="top:14%;left:60%;animation-delay:-18s;transform:scale(.7)"></div></div>
  <div id="hud">
    <div class="pill" id="lvlPill">LEVEL 1</div>
    <div id="fuelWrap"><span>⛽</span><div id="fuelBar"><div id="fuelFill"></div></div><span id="fuelNum">0</span></div>
    <button class="btn" id="homeBtn">⌂</button>
  </div>
  <div id="stage">
    <div id="hint"></div>
    <div id="board">
      <div id="cells"></div>
      <svg id="marks"></svg>
      <svg id="route"><polyline id="routeLine" class="stop" points=""/></svg>
      <div id="routeEnd">✕</div>
      <div id="slots"></div>
      <div id="signs"></div>
      <div id="flag">EXIT</div>
      <div id="nose"></div>
      <div class="car" id="car"><div class="sh"></div><div class="body"></div><div class="glass"></div><div class="roof"></div><div class="arr"></div><div class="glass2"></div>
        <div class="hl l"></div><div class="hl r"></div><div class="tl l"></div><div class="tl r"></div>
        <div class="wh a"></div><div class="wh b"></div><div class="wh c"></div><div class="wh d"></div></div>
      <div id="boom">💥</div>
    </div>
  </div>
  <div id="tray"></div>
  <div id="ghost"></div>
  <div id="winOv" class="ov hidden"><div class="card"><h2>Level complete!</h2><p id="winTxt"></p><button class="btn big" id="nextBtn">Next level</button><button class="btn big grey" id="winHome">Home</button></div></div>
  <div id="loseOv" class="ov hidden"><div class="card"><h2 id="loseH">Crash!</h2><p id="loseTxt"></p><button class="btn big alt" id="retryBtn">Retry</button><button class="btn big grey" id="loseHome">Home</button></div></div>
  <div id="home">
    <h1>MAZE SIGNS</h1>
    <div class="sub">Driving school · signs from the driver's seat · STOP breaks a chain · ⛽ refuels</div>
    <div id="legend"></div>
    <div id="map"><svg viewBox="0 0 300 500" preserveAspectRatio="none"><path id="mapPath" d="M150 460 C 40 420, 40 360, 150 340 S 260 280, 150 220 S 40 160, 150 100 S 260 60, 150 30" fill="none" stroke="#565c6b" stroke-width="30" stroke-linecap="round"/><path d="M150 460 C 40 420, 40 360, 150 340 S 260 280, 150 220 S 40 160, 150 100 S 260 60, 150 30" fill="none" stroke="#f7c948" stroke-width="3" stroke-dasharray="10 10"/></svg></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const CELL=64, DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const key=(x,y)=>x+','+y;
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function shuffle(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=(r()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

// ---------- SIGNS (относительно курса машины) ----------
// налево/направо — синие, остальные каждый своего цвета; STOP — красный восьмиугольник, машина на нём останавливается
const SIGNS={
  S:{name:'STRAIGHT',c1:'#2e9e44',c2:'#1b6b2c',svg:'<svg viewBox="0 0 24 24"><path d="M12 2.5 L20.5 11 H15.5 V21.5 H8.5 V11 H3.5 Z" fill="#fff"/></svg>'},
  L:{name:'LEFT',c1:'#1a63d6',c2:'#0b3f8f',svg:'<svg viewBox="0 0 24 24"><path d="M14 21.5 V12 H9.5 V16.5 L2.5 10 L9.5 3.5 V8 H16 A3 3 0 0 1 19 11 V21.5 Z" fill="#fff"/></svg>'},
  R:{name:'RIGHT',c1:'#1a63d6',c2:'#0b3f8f',svg:'<svg viewBox="0 0 24 24"><path d="M10 21.5 V12 H14.5 V16.5 L21.5 10 L14.5 3.5 V8 H8 A3 3 0 0 0 5 11 V21.5 Z" fill="#fff"/></svg>'},
  U:{name:'U-TURN',c1:'#f57c00',c2:'#b35300',svg:'<svg viewBox="0 0 24 24"><path d="M6 21.5 V10 A6 6 0 0 1 18 10 V13.5 H21.5 L16.5 20 L11.5 13.5 H15 V10 A3 3 0 0 0 9 10 V21.5 Z" fill="#fff"/></svg>'},
  D:{name:'STRAIGHT ×2',c1:'#7e57c2',c2:'#4d2f8a',svg:'<svg viewBox="0 0 24 24"><path d="M12 1.5 L19.5 9 H14.5 V12 H9.5 V9 H4.5 Z" fill="#fff"/><path d="M12 11 L19.5 18.5 H14.5 V22.5 H9.5 V18.5 H4.5 Z" fill="#fff" opacity=".85"/></svg>'},
  T:{name:'STOP',c1:'#d32f2f',c2:'#8e0000',svg:'<svg viewBox="0 0 24 24"><polygon points="7.5,1 16.5,1 23,7.5 23,16.5 16.5,23 7.5,23 1,16.5 1,7.5" fill="#d32f2f" stroke="#fff" stroke-width="1.8"/><text x="12" y="14.6" text-anchor="middle" font-size="6.6" font-weight="900" fill="#fff" font-family="Arial,Helvetica,sans-serif">STOP</text></svg>'},
};
const MOVE_KEYS=['S','L','R','U','D'];           // знаки-манёвры (для планировщика)
const ALL_KEYS=[...MOVE_KEYS,'T'];
const SIGN_W={S:30,L:20,R:20,U:14,D:16,T:12};    // веса для случайных знаков
const signHtml=(k,cls='sign')=>`<div class="${cls}${k==='T'?' oct':''}" style="--c1:${SIGNS[k].c1};--c2:${SIGNS[k].c2}">${SIGNS[k].svg}</div>`;
// манёвр → новое направление и число кварталов
function maneuver(k,h){return k==='S'?{d:h,n:1}:k==='L'?{d:(h+3)%4,n:1}:k==='R'?{d:(h+1)%4,n:1}:k==='U'?{d:(h+2)%4,n:1}:{d:h,n:2};}

// ---------- LEVELS ----------
// bw×bh домов; blocks = перекрытых улиц; useful = гарантированно полезных знаков в тройке; fuel = кварталов (от PLAY-бота)
// tutorial: лоток даёт ровно нужные знаки (1 карта на первых двух шагах, потом 3), цель подсвечена, подсказки
// gas: заправка на перекрёстке в стороне; топливо = кратчайший маршрут − 1, крюк через колонку даёт +G (G = крюк − топливо + slack)
const LEVELS=[
 {name:'Driving school',bw:2,bh:2,blocks:2, useful:3,seed:1001,minTurns:1,fuel:10,tutorial:true,minSigns:3,maxSigns:5,minRoutes:2},
 {name:'Old town',      bw:3,bh:4,blocks:5, useful:2,seed:1201,minTurns:3,fuel:16},
 {name:'Midtown',       bw:4,bh:4,blocks:8, useful:1,seed:1301,minTurns:3,gas:true,slack:4},
 {name:'Uptown',        bw:4,bh:5,blocks:11,useful:1,seed:1401,minTurns:4,gas:true,slack:3},
 {name:'Rush hour',     bw:4,bh:5,blocks:14,useful:1,seed:1501,minTurns:4,gas:true,slack:2},
];

// ---------- CITY MODEL ----------
// перекрёстки на чётных (x,y); улицы — одна координата нечётная; дома — обе нечётные
const isX=(x,y)=>x%2===0&&y%2===0;
function streetOpen(mz,x,y,d){const sx=x+DIRS[d][0],sy=y+DIRS[d][1];if(sx<0||sy<0||sx>=mz.W||sy>=mz.H)return false;return mz.open[sy][sx];}
function isExit(mz,x,y){return x===mz.exit[0]&&y===mz.exit[1];}
function degree(mz,x,y){let n=0;for(let d=0;d<4;d++)if(streetOpen(mz,x,y,d))n++;return n;}
// симуляция цепочки знаков от состояния (x,y,h): выполняем знак под машиной, едем, повторяем; конец: exit / stop / crash
// STOP: снимается и машина остаётся стоять (цепочка обрывается)
function simulate(mz,x,y,h,sg,max=60){const pts=[[x,y]];let cx=x,cy=y,ch=h,end='stop',used=[],blocks=0;const s2=new Map(sg);
  for(let i=0;i<max;i++){if(isExit(mz,cx,cy)){end='exit';break;}
    const k=s2.get(key(cx,cy));if(!k)break;s2.delete(key(cx,cy));used.push([cx,cy,k]);
    if(k==='T')break;
    const m=maneuver(k,ch);ch=m.d;let ok=true;
    for(let j=0;j<m.n;j++){if(!streetOpen(mz,cx,cy,ch)){ok=false;break;}cx+=2*DIRS[ch][0];cy+=2*DIRS[ch][1];pts.push([cx,cy]);blocks++;}
    if(!ok){end='crash';pts.push([cx+DIRS[ch][0]*.6,cy+DIRS[ch][1]*.6]);break;}}
  return {pts,end,used,blocks,x:cx,y:cy,h:ch};}
// Дейкстра по кварталам (знаки как малая надбавка), уже стоящие знаки обязательны (STOP не обязателен: машина на нём просто встанет)
// goal=[gx,gy] → возвращает {acts,blocks}; goal=null → полная карта расстояний {dist,prev}
function dijk(mz,x,y,h,sg,goal){const start=key(x,y)+','+h;const dist=new Map([[start,0]]),prev=new Map();const pq=[[0,x,y,h]];
  while(pq.length){pq.sort((a,b)=>a[0]-b[0]);const [c,cx,cy,ch]=pq.shift();const sk=key(cx,cy)+','+ch;if(c>dist.get(sk))continue;
    if(goal&&cx===goal[0]&&cy===goal[1])return {acts:pathFrom(prev,sk),blocks:Math.floor(c+1e-6)};
    if(isExit(mz,cx,cy))continue; // выезд с выхода не моделируем
    let forced=sg.get(key(cx,cy));if(forced==='T')forced=null;const opts=forced?[forced]:MOVE_KEYS;
    for(const a of opts){const m=maneuver(a,ch);let nx=cx,ny=cy,ok=true;for(let j=0;j<m.n;j++){if(!streetOpen(mz,nx,ny,m.d)){ok=false;break;}nx+=2*DIRS[m.d][0];ny+=2*DIRS[m.d][1];}
      if(!ok)continue;const nk=key(nx,ny)+','+m.d;const nc=c+m.n+(forced?0:0.01);
      if(!dist.has(nk)||nc<dist.get(nk)){dist.set(nk,nc);prev.set(nk,{from:sk,act:{x:cx,y:cy,k:a}});pq.push([nc,nx,ny,m.d]);}}}
  return goal?null:{dist,prev};}
function pathFrom(prev,sk){const acts=[];let k=sk;while(prev.has(k)){const p=prev.get(k);acts.unshift(p.act);k=p.from;}return acts;}
function plan(mz,x,y,h,sg,goal){return dijk(mz,x,y,h,sg,goal||mz.exit);}
// план через заправку: до колонки (любой курс прибытия) + от колонки до выхода; leg1 = кварталов до колонки
function viaPlan(mz,x,y,h,sg,g){const full=dijk(mz,x,y,h,sg,null);let best=null;
  for(let h2=0;h2<4;h2++){const sk=key(g.x,g.y)+','+h2;if(!full.dist.has(sk))continue;const d1=Math.floor(full.dist.get(sk)+1e-6);
    const back=plan(mz,g.x,g.y,h2,sg);if(!back)continue;const tot=d1+back.blocks;
    if(!best||tot<best.blocks)best={acts:pathFrom(full.prev,sk).concat(back.acts),blocks:tot,leg1:d1,via:true};}
  return best;}
function countRoutes(mz,x,y,limit=200){let n=0;const vis=new Set([key(x,y)]);
  (function dfs(cx,cy){if(n>=limit)return;if(isExit(mz,cx,cy)){n++;return;}for(let d=0;d<4;d++){if(!streetOpen(mz,cx,cy,d))continue;const nx=cx+2*DIRS[d][0],ny=cy+2*DIRS[d][1];const k=key(nx,ny);if(vis.has(k))continue;vis.add(k);dfs(nx,ny);vis.delete(k);}})(x,y);return n;}

function genCity(L){const W=2*L.bw+1,H=2*L.bh+1;
  for(let seed=L.seed;seed<L.seed+5000;seed++){const r=rng(seed*7919+13);
    const open=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>!(x%2===1&&y%2===1)));
    const streets=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if((x%2===1)!==(y%2===1))streets.push([x,y]);
    shuffle(streets,r);for(let k=0;k<L.blocks&&k<streets.length;k++){const [x,y]=streets[k];open[y][x]=false;}
    const ex=2*((r()*(L.bw+1))|0),sx=2*((r()*(L.bw+1))|0);
    const mz={W,H,open,exit:[ex,0],start:[sx,H-1],seed};
    const p=plan(mz,sx,H-1,0,new Map());if(!p)continue;
    const turns=p.acts.filter(a=>a.k!=='S'&&a.k!=='D').length;if(turns<L.minTurns)continue;
    if(L.minSigns&&p.acts.length<L.minSigns)continue;if(L.maxSigns&&p.acts.length>L.maxSigns)continue;
    if(Math.abs(ex-sx)<2)continue;
    const rc=countRoutes(mz,sx,H-1);if(rc<(L.minRoutes||3))continue;
    let dead=0,inter=0;for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){const dg=degree(mz,x,y);if(dg>=1)inter++;if(dg===1)dead++;}
    if(dead<1&&!L.tutorial)continue;
    if(L.gas){ // заправка: перекрёсток вне прямого маршрута, достижимый с запасом, с минимальным крюком
      const sgP=new Map(p.acts.map(a=>[key(a.x,a.y),a.k]));const onPath=new Set(simulate(mz,sx,H-1,0,sgP).pts.map(q=>key(q[0],q[1])));
      const full=dijk(mz,sx,H-1,0,new Map(),null);const F=p.blocks-1;let best=null;
      for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){const dg=degree(mz,x,y);if(dg===0||isExit(mz,x,y)||onPath.has(key(x,y)))continue;
        for(let h2=0;h2<4;h2++){const sk=key(x,y)+','+h2;if(!full.dist.has(sk))continue;const d1=Math.floor(full.dist.get(sk)+1e-6);if(d1<3||d1>F-1)continue;
          const back=plan(mz,x,y,h2,new Map());if(!back)continue;const tot=d1+back.blocks;if(tot<=p.blocks)continue;if(tot-F+L.slack>12)continue;
          if(!best||tot<best.tot||(tot===best.tot&&dg<best.dg))best={x,y,tot,dg,d1};}}
      if(!best)continue;
      mz.gas={x:best.x,y:best.y,g:best.tot-F+L.slack,left:true,tot:best.tot};mz.fuel=F;}
    mz.routesCount=rc;mz.minBlocks=p.blocks;mz.minSigns=p.acts.length;mz.inter=inter;mz.dead=dead;mz.turns=turns;return mz;}
  throw new Error('no city');}

// ---------- GAME STATE ----------
let LI=0,L=null,maze=null,signs=new Map(),tray=[null,null,null],car=null,over=false,forks=[],fuel=0,fuelMax=0;
let tutTargets=new Map(),previewSign=null,lastT=0,botMode=null,botDelay=0,lastBot=0,selected=-1,done=new Set(),stats={placed:0,dumped:0,executed:0,stops:0,erased:0};
const board=$('board');let scale=1;const SPEED=3.2; // клеток/с

function build(){const W=maze.W,H=maze.H;board.style.width=W*CELL+'px';board.style.height=H*CELL+'px';
  const cells=$('cells');cells.innerHTML='';cells.style.gridTemplateColumns=`repeat(${W},${CELL}px)`;
  const r=rng(maze.seed*31+7);const roofs=['#e8a25c','#d96a5a','#8fa3d9','#c9a0dc','#f0c36b','#7fb3c8'];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=document.createElement('div');
    if(x%2===1&&y%2===1){const v=r();c.className='c '+(v<.3?'park':'house');c.style.setProperty('--roof',roofs[(r()*roofs.length)|0]);}
    else if(!maze.open[y][x]){c.className='c block'+(y%2===0?' v':'');}
    else c.className='c road'+(isExit(maze,x,y)?' exit':'');
    cells.appendChild(c);}
  const mk=$('marks');mk.setAttribute('viewBox',`0 0 ${W*CELL} ${H*CELL}`);let s='';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!maze.open[y][x]||isExit(maze,x,y))continue;const cx=x*CELL+CELL/2,cy=y*CELL+CELL/2;
    const ds=[];if(isX(x,y)){for(let d=0;d<4;d++)if(streetOpen(maze,x,y,d))ds.push(d);}else if(x%2===1)ds.push(1,3);else ds.push(0,2);
    for(const d of ds)s+=`<line x1="${cx}" y1="${cy}" x2="${cx+DIRS[d][0]*CELL/2}" y2="${cy+DIRS[d][1]*CELL/2}" stroke="#f7c948" stroke-width="3" stroke-dasharray="7 9" stroke-linecap="round"/>`;}
  mk.innerHTML=s;$('route').setAttribute('viewBox',`0 0 ${W*CELL} ${H*CELL}`);
  forks=[];const sl=$('slots');sl.innerHTML='';
  if(maze.gas){const g=document.createElement('div');g.className='gas pulse';g.id='gas';g.style.left=(maze.gas.x*CELL+CELL/2)+'px';g.style.top=(maze.gas.y*CELL+CELL/2)+'px';g.innerHTML=`<span>⛽</span><b>+${maze.gas.g}</b>`;sl.appendChild(g);}
  for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){if(degree(maze,x,y)===0||isExit(maze,x,y))continue;const e=document.createElement('div');e.className='slot';e.style.left=(x*CELL+CELL/2)+'px';e.style.top=(y*CELL+CELL/2)+'px';e.dataset.k=key(x,y);sl.appendChild(e);forks.push({x,y,el:e});}
  $('signs').innerHTML='';$('flag').style.left=(maze.exit[0]*CELL+CELL/2)+'px';$('flag').style.top=(maze.exit[1]*CELL+CELL/2)+'px';
  $('boom').style.display='none';board.classList.remove('shake');fit();}
function fit(){const stage=$('stage');if(!maze)return;const sw=stage.clientWidth-24,sh=stage.clientHeight-(L&&L.tutorial?90:24);
  scale=Math.max(.3,Math.min(sw/(maze.W*CELL),sh/(maze.H*CELL),1.6));board.style.top=L&&L.tutorial?'calc(50% + 34px)':'50%';board.style.setProperty('--s',scale);board.style.transform=`translate(-50%,-50%) scale(${scale})`;}
window.addEventListener('resize',fit);

function load(n,fuelOverride){LI=n;L=LEVELS[n];maze=genCity(L);signs=new Map();over=false;selected=-1;stats={placed:0,dumped:0,executed:0,stops:0,erased:0};previewSign=null;
  car={x:maze.start[0],y:maze.start[1],h:0,tx:maze.start[0],ty:maze.start[1],prog:1,ang:0,moving:false,queue:[],exiting:false};
  fuelMax=fuelOverride||maze.fuel||L.fuel;fuel=fuelMax;
  $('lvlPill').textContent='LEVEL '+(n+1);$('hud').style.visibility='visible';$('tray').style.visibility='visible';$('home').style.display='none';
  $('winOv').classList.add('hidden');$('loseOv').classList.add('hidden');
  build();tray=[null,null,null];refill();renderCar();updateFuel();updateHere();updateTut();requestAnimationFrame(fit);}

// ---------- FUEL / PLAN HELPERS ----------
function gasLeft(){return !!(maze.gas&&maze.gas.left);}
// сколько топлива даст симулированная цепочка (проезд через колонку); при движении pts[0] = ещё не достигнутая цель
function gainOf(sim){if(!gasLeft())return 0;const g=maze.gas;const from=car.moving?0:1;for(let i=from;i<sim.pts.length;i++)if(sim.pts[i][0]===g.x&&sim.pts[i][1]===g.y)return g.g;return 0;}
function fuelAfter(sim){return fuel-(car.moving?1:0)-sim.blocks+gainOf(sim);}
// лучший план из состояния с учётом топлива: прямой, если хватает; иначе через заправку
function bestPlan(st,avail,gas){const direct=plan(maze,st.x,st.y,st.h,signs);
  if(!gas)return direct;
  if(direct&&direct.blocks<=avail)return direct;
  const via=viaPlan(maze,st.x,st.y,st.h,signs,maze.gas);
  if(via&&via.leg1<=avail&&via.blocks<=avail+maze.gas.g)return via;
  return direct||via;}
// состояние «после цепочки» + план оттуда
function planAhead(){const st=planState();const sim=simulate(maze,st.x,st.y,st.h,signs);
  const avail=fuelAfter(sim);const gas=gasLeft()&&!gainOf(sim);
  const p=sim.end==='stop'?bestPlan({x:sim.x,y:sim.y,h:sim.h},avail,gas):null;return {sim,avail,p};}

// ---------- TRAY ----------
function randSign(){let t=0;for(const k of ALL_KEYS)t+=SIGN_W[k];let v=Math.random()*t;for(const k of ALL_KEYS){v-=SIGN_W[k];if(v<=0)return k;}return 'S';}
function planState(){return car.moving?{x:car.tx,y:car.ty,h:car.h}:{x:car.x,y:car.y,h:car.h};}
function genTray(){const out=[];const {sim,p}=planAhead();
  // полезные знаки — первые действия плана на ещё пустых перекрёстках
  const need=p?p.acts.filter(a=>!signs.has(key(a.x,a.y))):[];
  if(L.tutorial){const n=stats.executed<2?1:3;for(const a of need.slice(0,n))out.push(a.k);while(out.length<3)out.push(null);return out;}
  for(const a of need.slice(0,L.useful))out.push(a.k);
  while(out.length<3)out.push(randSign());
  return shuffle(out);}
function refill(){tray=genTray();renderTray(true);}
function renderTray(fresh){const t=$('tray');t.innerHTML='';tray.forEach((k,i)=>{const c=document.createElement('div');c.className='tcard'+(k==null?' used':'')+(fresh&&k!=null?' new':'')+(i===selected?' sel':'');c.dataset.i=i;
  if(k!=null)c.innerHTML=`<div class="post"></div>${signHtml(k)}<div class="lbl">${SIGNS[k].name}</div>`;t.appendChild(c);});}

// STOP можно ставить и на занятый перекрёсток — он заменяет стоящий знак
function canPlace(ti,x,y){const k=tray[ti];if(k==null||over)return false;if(!isX(x,y)||isExit(maze,x,y)||degree(maze,x,y)===0)return false;if(L.tutorial&&tutTargets.get(ti)!==key(x,y))return false;return k==='T'||!signs.has(key(x,y));}
function place(ti,x,y){if(!canPlace(ti,x,y))return false;const k=tray[ti];const kk=key(x,y);
  if(signs.has(kk)){const old=[...$('signs').children].find(e=>e.dataset.k===kk);if(old){old.classList.add('eat');setTimeout(()=>old.remove(),350);}signs.delete(kk);stats.erased++;}
  signs.set(kk,k);tray[ti]=null;stats.placed++;
  const e=document.createElement('div');e.innerHTML=signHtml(k,'sign pop');const el=e.firstChild;el.style.left=(x*CELL+CELL/2)+'px';el.style.top=(y*CELL+CELL/2)+'px';el.dataset.k=kk;$('signs').appendChild(el);
  const slot=forks.find(f=>f.x===x&&f.y===y);if(slot)slot.el.classList.add('taken');
  selected=-1;previewSign=null;
  if(tray.every(v=>v==null))refill();else renderTray(false);
  if(!car.moving)tryGo();updateHere();updateTut();return true;}

// ---------- CAR ----------
// машина стоит; если под ней знак — выполняет его и едет; по прибытии повторяет; STOP снимается, машина остаётся
function tryGo(){if(over||car.moving||car.exiting)return;if(isExit(maze,car.x,car.y)){startExit();return;}
  const k=signs.get(key(car.x,car.y));if(!k)return;
  signs.delete(key(car.x,car.y));
  const el=[...$('signs').children].find(e=>e.dataset.k===key(car.x,car.y));if(el){el.classList.add('eat');setTimeout(()=>el.remove(),350);}
  const slot=forks.find(f=>f.x===car.x&&f.y===car.y);if(slot)slot.el.classList.remove('taken');
  if(k==='T'){stats.stops++;updateHere();updateTut();return;}
  stats.executed++;
  const m=maneuver(k,car.h);car.h=m.d;car.queue=[];let cx=car.x,cy=car.y,ok=true;
  for(let j=0;j<m.n;j++){if(!streetOpen(maze,cx,cy,car.h)){ok=false;break;}cx+=2*DIRS[car.h][0];cy+=2*DIRS[car.h][1];car.queue.push([cx,cy]);}
  if(!ok)car.queue.push([cx+DIRS[car.h][0]*.45,cy+DIRS[car.h][1]*.45,'crash']);
  nextLeg();}
function nextLeg(){const q=car.queue.shift();if(!q){car.moving=false;updateHere();updateTut();if(!over)tryGo();return;}
  car.moving=true;car.tx=q[0];car.ty=q[1];car.prog=0;car.legLen=Math.hypot(q[0]-car.x,q[1]-car.y);car.crashLeg=q[2]==='crash';}
function arrive(){car.x=car.tx;car.y=car.ty;car.prog=1;
  if(car.crashLeg){car.moving=false;crash();return;}
  fuel-=1;
  if(gasLeft()&&car.x===maze.gas.x&&car.y===maze.gas.y){maze.gas.left=false;fuel+=maze.gas.g;refuelFx();}
  updateFuel();
  if(isExit(maze,car.x,car.y)){car.moving=false;startExit();return;}
  if(fuel<=0&&!isExit(maze,car.x,car.y)){car.moving=false;lose('fuel');return;}
  nextLeg();}
function refuelFx(){const g=$('gas');if(g){g.classList.add('empty');g.classList.remove('pulse');}
  const f=document.createElement('div');f.className='float';f.textContent='+'+maze.gas.g+' ⛽';f.style.left=(car.x*CELL+CELL/2)+'px';f.style.top=(car.y*CELL+CELL/2-30)+'px';$('signs').appendChild(f);setTimeout(()=>f.remove(),1300);
  $('fuelWrap').classList.add('gain');setTimeout(()=>$('fuelWrap').classList.remove('gain'),700);}
function startExit(){car.exiting=true;car.moving=true;car.h=0;car.tx=car.x;car.ty=car.y-1.6;car.prog=0;car.legLen=1.6;car.crashLeg=false;}

function updateHere(){forks.forEach(f=>f.el.classList.toggle('here',!over&&!car.moving&&f.x===car.x&&f.y===car.y&&!signs.has(key(f.x,f.y))));}
function updateFuel(){const f=$('fuelFill');const p=Math.max(0,Math.min(100,fuel/fuelMax*100));f.style.width=p+'%';f.classList.toggle('low',p<30);$('fuelNum').textContent=Math.max(0,fuel);}
// обучение: подсказка + призрак нужного знака на целевом перекрёстке для каждой карты лотка
function updateTut(){$('signs').querySelectorAll('.tghost').forEach(e=>e.remove());forks.forEach(f=>f.el.classList.remove('tut'));tutTargets=new Map();
  const hint=$('hint');if(!L||!L.tutorial||over){hint.classList.remove('on');return;}
  const st=stats.executed;const idx=[];tray.forEach((k,i)=>{if(k!=null)idx.push(i);});const cards=idx.map(i=>tray[i]);
  const txt=st===0?'Drag the sign onto the glowing ring under the car. The white arrow on the roof shows where the car looks.'
    :st===1?(cards[0]==='L'||cards[0]==='R'?`Turns are from the driver's seat: ${SIGNS[cards[0]].name} is the car's ${SIGNS[cards[0]].name.toLowerCase()}, not yours.`:'Every sign is read from the driver\'s seat.')
    :st===2?'Place all the signs ahead. The car drives the whole chain by itself.':'';
  hint.textContent=txt;hint.classList.toggle('on',!!txt);
  if(!cards.length)return;const {p}=planAhead();if(!p)return;const need=p.acts.filter(a=>!signs.has(key(a.x,a.y)));
  cards.forEach((k,j)=>{const a=need[j];if(!a||a.k!==k)return;tutTargets.set(idx[j],key(a.x,a.y));const e=document.createElement('div');e.innerHTML=signHtml(k,'sign tghost');const el=e.firstChild;el.style.left=(a.x*CELL+CELL/2)+'px';el.style.top=(a.y*CELL+CELL/2)+'px';$('signs').appendChild(el);
    const f=forks.find(f=>f.x===a.x&&f.y===a.y);if(f)f.el.classList.add('tut');});}
function renderCar(){const px=(car.x+(car.tx-car.x)*car.prog)*CELL+CELL/2,py=(car.y+(car.ty-car.y)*car.prog)*CELL+CELL/2;
  const target=car.h*90;let d=((target-car.ang)%360+540)%360-180;car.ang+=d*0.3;
  $('car').style.transform=`translate(${px}px,${py}px) rotate(${car.ang}deg)`;
  const n=$('nose');const show=!car.moving&&!over&&!car.exiting&&!isExit(maze,car.x,car.y);n.style.display=show?'block':'none';
  if(show){n.style.left=(px+DIRS[car.h][0]*42)+'px';n.style.top=(py+DIRS[car.h][1]*42)+'px';n.style.transform=`rotate(${car.h*90}deg)`;}
  return [px,py];}
function renderRoute(px,py){const line=$('routeLine'),endEl=$('routeEnd');
  if(over||car.exiting){line.setAttribute('points','');endEl.className='';return;}
  const st=planState();const sg=previewSign?new Map([...signs,[key(previewSign.x,previewSign.y),previewSign.k]]):signs;
  const sim=simulate(maze,st.x,st.y,st.h,sg);
  if(sim.pts.length<2){line.setAttribute('points','');endEl.className='';return;}
  const left=fuel-(car.moving?1:0)-sim.blocks+gainOf(sim);
  const cls=(sim.end==='exit'&&left<0)||(sim.end==='stop'&&left<=0)?'fuelout':sim.end;
  line.setAttribute('class',cls);const pts=(car.moving?[[px,py]]:[]).concat(sim.pts.map(p=>[p[0]*CELL+CELL/2,p[1]*CELL+CELL/2]));
  if(!car.moving)pts[0]=[px,py];
  line.setAttribute('points',pts.map(p=>p.join(',')).join(' '));
  const last=sim.pts[sim.pts.length-1];endEl.className=cls==='crash'||cls==='fuelout'?cls:'';endEl.textContent=cls==='fuelout'?'⛽':'✕';endEl.style.left=(last[0]*CELL+CELL/2)+'px';endEl.style.top=(last[1]*CELL+CELL/2)+'px';}
function tick(){const now=performance.now();let dt=(now-lastT)/1000;lastT=now;if(dt>0.12)dt=0.12;if(!maze||over)return;
  if(botMode&&now-lastBot>=botDelay*1000){lastBot=now;botMode==='random'?randomBotAct():botAct();}
  if(car.moving){car.prog+=SPEED*dt/Math.max(.5,car.legLen);
    if(car.prog>=1){if(car.exiting){car.prog=1;car.moving=false;win();}else arrive();}}
  const [px,py]=renderCar();renderRoute(px,py);}
setInterval(()=>{try{tick();}catch(e){window.__err=String(e.stack||e);}},16);

function crash(){renderCar();const b=$('boom');b.style.left=(car.x*CELL+CELL/2)+'px';b.style.top=(car.y*CELL+CELL/2)+'px';b.style.display='block';board.classList.add('shake');lose('crash');}
function lose(why){over=true;updateHere();updateTut();$('nose').style.display='none';$('routeLine').setAttribute('points','');$('routeEnd').className='';
  $('loseH').textContent=why==='fuel'?'Out of fuel!':'Crash!';$('loseTxt').textContent=why==='fuel'?(maze.gas?'Not enough gas for that route. Try the ⛽ station':'The car ran out of gas in the city'):'That sign led straight into a building';
  $('loseOv').classList.remove('hidden');window.__result={win:false,why,level:LI+1,fuelUsed:fuelMax-fuel,gas:maze.gas?!maze.gas.left:null,car:[car.x,car.y],...stats};}
function win(){over=true;done.add(LI);updateTut();window.__result={win:true,level:LI+1,fuelUsed:fuelMax-fuel,gas:maze.gas?!maze.gas.left:null,...stats};confetti();
  setTimeout(()=>{$('winTxt').textContent=`Level ${LI+1} · ${L.name} · ${stats.executed} signs`;$('nextBtn').style.display=LI<LEVELS.length-1?'block':'none';$('winOv').classList.remove('hidden');},1000);}
function confetti(){const ph=$('phone');const cols=['#ff5252','#ffd740','#69f0ae','#40c4ff','#e040fb'];for(let i=0;i<50;i++){const c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'%';c.style.top='-20px';c.style.background=cols[i%cols.length];c.style.animationDuration=(1.4+Math.random()*1.2)+'s';c.style.animationDelay=(Math.random()*.6)+'s';ph.appendChild(c);setTimeout(()=>c.remove(),3200);}}

// ---------- INPUT: drag / tap-select (с превью маршрута) ----------
let drag=null;const ghost=$('ghost');
function slotAt(px,py,anyTaken){let best=null,bd=1e9;for(const f of forks){if(!anyTaken&&signs.has(key(f.x,f.y)))continue;const r=f.el.getBoundingClientRect();const d=Math.hypot(px-(r.left+r.width/2),py-(r.top+r.height/2));if(d<bd){bd=d;best=f;}}
  return best&&bd<CELL*scale*.7?best:null;}
function clearHot(){forks.forEach(f=>f.el.classList.remove('hot'));previewSign=null;}
$('tray').addEventListener('pointerdown',e=>{const c=e.target.closest('.tcard');if(!c||c.classList.contains('used')||over)return;const i=+c.dataset.i;
  drag={i,sx:e.clientX,sy:e.clientY,moved:false};ghost.innerHTML=signHtml(tray[i]);});
window.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8){drag.moved=true;ghost.style.display='block';}
  if(!drag.moved)return;const pr=$('phone').getBoundingClientRect();ghost.style.left=(e.clientX-pr.left-29)+'px';ghost.style.top=(e.clientY-pr.top-29-24)+'px';
  clearHot();const f=slotAt(e.clientX,e.clientY,tray[drag.i]==='T');if(f&&canPlace(drag.i,f.x,f.y)){f.el.classList.add('hot');previewSign={x:f.x,y:f.y,k:tray[drag.i]};}});
window.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;ghost.style.display='none';clearHot();
  if(d.moved){const f=slotAt(e.clientX,e.clientY,tray[d.i]==='T');if(f)place(d.i,f.x,f.y);}
  else{selected=selected===d.i?-1:d.i;renderTray(false);}});
window.addEventListener('pointercancel',()=>{drag=null;ghost.style.display='none';clearHot();});
$('stage').addEventListener('pointermove',e=>{if(selected<0||drag)return;clearHot();const f=slotAt(e.clientX,e.clientY,tray[selected]==='T');if(f&&canPlace(selected,f.x,f.y)){f.el.classList.add('hot');previewSign={x:f.x,y:f.y,k:tray[selected]};}});
$('stage').addEventListener('pointerup',e=>{if(selected<0||drag)return;const f=slotAt(e.clientX,e.clientY,tray[selected]==='T');if(!f)return;place(selected,f.x,f.y);});

// ---------- HOME ----------
function showHome(){maze=null;over=true;$('home').style.display='flex';$('hud').style.visibility='hidden';$('tray').style.visibility='hidden';$('winOv').classList.add('hidden');$('loseOv').classList.add('hidden');$('hint').classList.remove('on');$('nose').style.display='none';renderHome();}
function renderHome(){const map=$('map');map.querySelectorAll('.lv').forEach(e=>e.remove());const path=$('mapPath');const len=path.getTotalLength();
  $('legend').innerHTML=ALL_KEYS.map(k=>signHtml(k)).join('')+'<div class="gas"><span>⛽</span><b>+N</b></div>';
  LEVELS.forEach((lv,i)=>{const p=path.getPointAtLength(len*(i/(LEVELS.length-1))*0.98+len*0.01);const e=document.createElement('div');e.className='lv'+(done.has(i)?' done':'');
    e.style.left=(p.x/300*100)+'%';e.style.top=(p.y/500*100)+'%';e.innerHTML=`${i+1}<small>${lv.name}</small>`;e.onclick=()=>load(i);map.appendChild(e);});}
$('homeBtn').onclick=showHome;$('winHome').onclick=showHome;$('loseHome').onclick=showHome;
$('retryBtn').onclick=()=>load(LI);$('nextBtn').onclick=()=>load(Math.min(LI+1,LEVELS.length-1));

// ---------- BOTS (PLAY-проверка) ----------
function botAct(){if(over||car.exiting)return;
  const {sim,avail,p}=planAhead();const ti=tray.indexOf('T');
  if(sim.end==='exit'){if(fuelAfter(sim)>=0)return; // цепочка доводит до выхода и топлива хватает — ждём
    if(ti>=0&&sim.used.length){place(ti,sim.used[0][0],sim.used[0][1]);stats.dumped++;} // топлива не хватит — рвём цепочку STOP'ом
    return;}
  if(sim.end==='crash'){if(ti>=0&&sim.used.length){const u=sim.used[sim.used.length-1];place(ti,u[0],u[1]);}return;} // спасаем STOP'ом
  if(!p)return;
  const need=p.acts.filter(a=>!signs.has(key(a.x,a.y)));let placedAny=false;
  const seen=new Set();for(const a of need){const ck=key(a.x,a.y);if(seen.has(ck))break;seen.add(ck);const i=tray.indexOf(a.k);if(i>=0&&place(i,a.x,a.y))placedAny=true;}
  window.__trace&&window.__trace.push({via:!!p.via,blocks:p.blocks,avail,need:need.length,placedAny,tray:[...tray],fuel});
  if(!placedAny&&need.length){ // нужного знака нет — сливаем лишний: STOP под стоящую машину (бесплатно) или любой знак вне плана
    if(ti>=0&&!car.moving&&canPlace(ti,car.x,car.y)){stats.dumped++;place(ti,car.x,car.y);return;}
    const pathCells=new Set(p.acts.map(a=>key(a.x,a.y)));pathCells.add(key(sim.x,sim.y));sim.pts.forEach(q=>pathCells.add(key(q[0],q[1])));
    for(let i=0;i<3;i++){const k=tray[i];if(k==null)continue;
      const f=forks.find(f=>!signs.has(key(f.x,f.y))&&!pathCells.has(key(f.x,f.y)));
      if(f){stats.dumped++;place(i,f.x,f.y);break;}}}}
function randomBotAct(){if(over)return;const opts=[];tray.forEach((k,i)=>{if(k==null)return;forks.forEach(f=>{if(canPlace(i,f.x,f.y))opts.push([i,f.x,f.y]);});});
  if(!opts.length)return;const o=opts[(Math.random()*opts.length)|0];place(...o);}
window.__game={load,place,canPlace,botAct,LEVELS,SIGNS,get state(){return {level:LI+1,fuel,fuelMax,over,tray:[...tray],signs:[...signs],car:{...car},forks:forks.length,gas:maze&&maze.gas,maze:maze&&{W:maze.W,H:maze.H,seed:maze.seed,routes:maze.routesCount,minBlocks:maze.minBlocks,minSigns:maze.minSigns,inter:maze.inter,dead:maze.dead,turns:maze.turns,fuel:maze.fuel},stats:{...stats}};},
  bot(mode,delay){botMode=mode;botDelay=delay||0;},skipGo(){},sim:()=>{const s=planState();return simulate(maze,s.x,s.y,s.h,signs);},plan:()=>planAhead().p,gen:n=>{const m=genCity(LEVELS[n]);return {seed:m.seed,minBlocks:m.minBlocks,minSigns:m.minSigns,routes:m.routesCount,gas:m.gas,fuel:m.fuel,turns:m.turns};}};

lastT=performance.now();showHome();
</script>
