<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Water Blocks — proto v7</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:linear-gradient(180deg,#cbdbfc 0%,#b3c9f7 55%,#9fbaf3 100%);}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }

  #hud{width:100%;padding:10px 12px;z-index:3;display:flex;align-items:center;gap:8px;}
  .pill{background:#fff;color:#2b4a8f;border-radius:16px;padding:7px 14px;font-weight:800;
        font-size:15px;box-shadow:0 3px 8px rgba(43,74,143,.22);}
  #timer{font-variant-numeric:tabular-nums;font-size:18px;min-width:86px;text-align:center;}
  .ibtn{width:38px;height:38px;border-radius:50%;background:#fff;color:#4b7bd8;border:0;
        font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;
        cursor:pointer;box-shadow:0 3px 8px rgba(43,74,143,.22);}
  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  .ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:14px;background:rgba(214,228,255,.88);backdrop-filter:blur(3px);}
  .ov h1{color:#274a94;font-size:34px;margin:0;text-shadow:0 2px 0 #fff;}
  .ov .sub{color:#4a63a0;font-size:15px;margin:0 28px;text-align:center;line-height:1.45;}
  .btn{background:linear-gradient(180deg,#ffd54d,#f4a825);border:0;border-radius:18px;padding:14px 34px;
       font-size:19px;font-weight:900;color:#5b3a00;cursor:pointer;box-shadow:0 5px 0 #b97b12;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b97b12;}
  .btn.sec{background:linear-gradient(180deg,#6fa2f2,#4b7bd8);color:#fff;box-shadow:0 5px 0 #2d55a8;}
  #lvls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:300px;}
  .lv{width:52px;height:52px;border-radius:14px;font-size:20px;font-weight:900;border:0;cursor:pointer;
      background:linear-gradient(180deg,#6fa2f2,#4b7bd8);color:#fff;box-shadow:0 4px 0 #2d55a8;}
  .lv.lock{background:#c3d2f0;color:#8fa4cf;box-shadow:0 4px 0 #9db1da;cursor:default;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="phone">
  <div id="hud">
    <button class="ibtn" id="btnHome">⌂</button>
    <div style="flex:1"></div>
    <div class="pill" id="timer">0:00</div>
    <div style="flex:1"></div>
    <div class="pill" id="lvlLab">Level 1</div>
    <button class="ibtn" id="btnRetry">⟳</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>

  <div class="ov" id="home">
    <h1>WATER BLOCKS</h1>
    <p class="sub">В баке — базовая жидкость и шары-капли других цветов, как в лава-лампе.<br>Подвинь блок вплотную к баку — жидкость <b>его цвета</b> со дна стечёт в него.<br>Шар на дне запирает свои колонки. Осуши бак до конца таймера!</p>
    <div id="lvls"></div>
  </div>
  <div class="ov hidden" id="win">
    <h1>LEVEL DONE!</h1>
    <button class="btn" id="btnNext">Next level</button>
    <button class="btn sec" id="btnWinHome">Home</button>
  </div>
  <div class="ov hidden" id="lose">
    <h1>TIME'S UP</h1>
    <button class="btn" id="btnRetryOv">Retry</button>
    <button class="btn sec" id="btnLoseHome">Home</button>
  </div>
</div>

<script>
/* ================= Water Blocks proto v7 =================
   v7: ПЛОТНЫЙ лоток — 62-81% клеток заняты (v6: 29-55%), первый
   блок базы зажат и требует клоцки-перетасовки; бот получил
   настоящий клоцки-солвер (BFS по совместным положениям блоков).
   Ядро v6: лава-лампа, шары висят и садятся по мере слива базы.
   ========================================================= */
/*CORE-BEGIN*/
const BC=6, BR=7, CELL=56;
const LW=396, LH=672;
const BX=30, BY=264;
const TX=30, TTOP=14, TBOT=238;      // бак 336x224
const TWpx=336;
const S=2450;                        // px² на 1 клетку объёма
const RATE=0.66;                     // слив на колонку, клеток/с (+20%)
const FLOOR=TBOT-3;

const PAL=[
  {n:'yellow', a:'#f7c843', b:'#d9a318', f:'#ffe27a'},
  {n:'purple', a:'#9257e0', b:'#6f3cba', f:'#b58af0'},
  {n:'green',  a:'#4fc85e', b:'#37a447', f:'#7fe08a'},
  {n:'red',    a:'#ef5350', b:'#c93a38', f:'#ff8683'},
  {n:'blue',   a:'#4b8ff0', b:'#3671cc', f:'#7fb3ff'},
];
const SH={
  S1:[[0,0]], H2:[[0,0],[1,0]], V2:[[0,0],[0,1]],
  H3:[[0,0],[1,0],[2,0]], V3:[[0,0],[0,1],[0,2]], L3:[[0,0],[0,1],[1,1]],
  O4:[[0,0],[1,0],[0,1],[1,1]], T4:[[0,0],[1,0],[2,0],[1,1]],
  L4:[[0,0],[0,1],[0,2],[1,2]], S4:[[1,0],[2,0],[0,1],[1,1]],
};
// уровень: base=цвет базы; c=[цвет,форма,x,y] (базовые блоки — внизу лотка);
// balls=[[цвет,объём,x-доля ширины]]
const LEVELS=[
 // L1 — интро, 28/42: занято 28/42, база 16 кл.
 {t:75, base:0,
  c:[[1,'O4',0,1],[2,'H3',3,1],[0,'H3',3,2],[0,'H2',0,3],[0,'H2',2,3],[2,'V3',5,3],[0,'H2',3,4],[0,'H2',0,5],[1,'H2',3,5],[0,'H3',0,6],[0,'H2',4,6]],
  balls:[[1,3,0.15,0.75],[2,3,0.85,0.55],[1,3,0.5,0.35],[2,3,0.3,0.15]]},
 // L2 — 31/42: занято 31/42, база 10 кл.
 {t:90, base:4,
  c:[[3,'H3',1,0],[2,'O4',0,1],[4,'T4',3,1],[2,'V3',5,2],[3,'H2',0,3],[4,'H2',3,3],[3,'S1',0,4],[3,'H3',2,4],[3,'H3',3,5],[4,'H2',0,5],[4,'H2',0,6],[2,'H2',3,6]],
  balls:[[3,4,0.15,0.8],[2,5,0.85,0.6],[3,4,0.5,0.45],[2,4,0.3,0.3],[3,4,0.7,0.12]]},
 // L3 — 31/42, 4 цвета: занято 31/42, база 8 кл.
 {t:110, base:2,
  c:[[0,'O4',0,1],[1,'H3',2,1],[2,'H2',3,2],[3,'V3',5,2],[2,'H2',0,3],[1,'H2',3,3],[0,'H3',0,4],[2,'H2',3,4],[2,'H2',0,5],[3,'H3',3,5],[1,'H2',0,6],[0,'H2',3,6],[3,'S1',5,6]],
  balls:[[0,5,0.2,0.8],[3,4,0.8,0.65],[1,4,0.5,0.5],[0,4,0.9,0.35],[1,3,0.1,0.2],[3,3,0.6,0.1]]},
 // L4 — 32/42, замок из S1: занято 32/42, база 10 кл.
 {t:130, base:0,
  c:[[4,'H3',0,1],[2,'H3',3,1],[1,'H2',0,2],[0,'H3',3,2],[1,'S1',0,3],[0,'H2',2,3],[4,'H2',4,3],[0,'H3',0,4],[2,'H2',4,4],[4,'H2',0,5],[3,'H3',3,5],[0,'H2',0,6],[1,'H2',2,6],[3,'S1',5,6],[3,'S1',5,0]],
  balls:[[4,4,0.15,0.8],[2,5,0.85,0.6],[1,5,0.5,0.45],[3,5,0.3,0.3],[4,3,0.7,0.12]]},
 // L5 — спайк 34/42, 5 цветов: занято 34/42, база 7 кл.
 {t:180, base:4,
  c:[[0,'O4',0,1],[1,'H3',2,1],[3,'V3',5,1],[4,'H3',2,2],[2,'H2',0,3],[4,'S1',3,3],[3,'H3',0,4],[0,'H2',3,4],[4,'H2',0,5],[2,'H3',3,5],[0,'H2',0,6],[1,'H2',2,6],[4,'S1',5,6],[2,'S1',5,0],[1,'S1',4,3],[3,'S1',5,4]],
  balls:[[0,4,0.15,0.82],[3,4,0.85,0.66],[1,3,0.5,0.5],[2,3,0.3,0.38],[0,4,0.7,0.26],[3,3,0.95,0.16],[1,3,0.08,0.08],[2,3,0.6,0.02]]},
];

let balls, baseVol, base0, baseCol, conts, tick=0, timeLeft=0, level=0, playing=false;
let winFlag=false, loseFlag=false, winAt=0, clearedAll=false;
let ffMult=1, botOn=false, botCd=0, botHist=[];
let drainCols=[], drops=[];

const r2v=v=>Math.sqrt(v*S/Math.PI);
function mkCont(col,shape,x,y,id){
  const cells=SH[shape].map(c=>c.slice());
  return {id,col,cells,x,y,cap:cells.length,fill:0,
          state:'idle',popT:0,lastGain:-9};
}
function occMap(skip){
  const m=new Array(BC*BR).fill(0);
  for(const c of conts){ if(c.state!=='idle'||c===skip) continue;
    for(const[dx,dy]of c.cells) m[(c.y+dy)*BC+(c.x+dx)]=1; }
  return m;
}
function canPlace(c,nx,ny,m){
  for(const[dx,dy]of c.cells){ const x=nx+dx,y=ny+dy;
    if(x<0||x>=BC||y<0||y>=BR) return false; if(m[y*BC+x]) return false; }
  return true;
}
function buildLevel(n){
  const L=LEVELS[n];
  conts=L.c.map((d,i)=>mkCont(d[0],d[1],d[2],d[3],i));
  baseCol=L.base;
  balls=L.balls.map((b,i)=>({col:b[0],vol:b[1],x:TX+b[2]*TWpx,
    a:b[3],y:0,ph:i*1.7}));
  baseVol=conts.filter(c=>c.col===baseCol).reduce((a,c)=>a+c.cap,0);
  base0=baseVol;
  for(const b of balls){ const r=r2v(b.vol); b.y=Math.max(TTOP+r+4, FLOOR-r/b.a); }
  // реверс-экономика: объём шаров цвета = ёмкость его блоков
  const q=new Array(PAL.length).fill(0);
  for(const c of conts) q[c.col]+=c.cap;
  q[baseCol]-=baseVol;
  for(const b of balls) q[b.col]-=b.vol;
  console.assert(q.every(v=>Math.abs(v)<1e-6),'economy mismatch L'+(n+1),q);
  tick=0; timeLeft=L.t; winFlag=loseFlag=false; winAt=0; clearedAll=false;
  botHist=[]; drainCols=[]; drops=[];
}
function receiver(col){
  let best=null;
  for(const c of conts){ if(c.state!=='idle'||c.y!==0) continue;
    for(const[dx,dy]of c.cells){ if(c.x+dx!==col) continue;
      if(!best||dy<best.row) best={c,row:dy}; }
  }
  return best&&best.c;
}
const colCx=col=>BX+(col+.5)*CELL;
function floorBall(col){ // покоящийся шар, накрывающий колонку
  const cx=colCx(col);
  let best=null;
  for(const b of balls){ const r=r2v(b.vol);
    if(!landed(b)) continue;                     // ещё висит в базе
    const cover=Math.max(r*.85, CELL*.5);        // маленький шар всегда накрывает ближайшую колонку
    if(Math.abs(b.x-cx)<cover&&(!best||Math.abs(b.x-cx)<Math.abs(best.x-cx))) best=b;
  }
  return best;
}
function ballsPhys(dt){
  const ratio=base0>0?baseVol/base0:0;
  for(const b of balls){ const r=r2v(b.vol);
    const tY=Math.max(TTOP+r+4, Math.min(FLOOR-r, FLOOR-(r/b.a)*ratio));
    b.y+=(tY-b.y)*Math.min(1,5*dt);                 // плавное погружение, без рывков
  }
  for(let it=0;it<4;it++){
    for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
      const a=balls[i],b=balls[j],ra=r2v(a.vol),rb=r2v(b.vol);
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,min=(ra+rb)*.92;
      if(d<min){ const push=(min-d)/2,nx=dx/d,ny=dy/d;
        const wa=rb*rb/(ra*ra+rb*rb), wb=1-wa;
        a.x-=nx*push*2*wa; a.y-=ny*push*2*wa;
        b.x+=nx*push*2*wb; b.y+=ny*push*2*wb;
      }
    }
    for(const b of balls){ const r=r2v(b.vol);
      if(b.y>FLOOR-r) b.y=FLOOR-r;
      b.x=Math.max(TX+r,Math.min(TX+TWpx-r,b.x));
    }
  }
}
const landed=b=>base0<=0||baseVol/base0<=b.a+1e-9; // шар доступен, когда база слита до его порога
function drain(dt){
  drainCols=[];
  for(let col=0;col<BC;col++){
    const c=receiver(col);
    if(!c||c.fill>=c.cap) continue;
    const fb=floorBall(col);
    let src=null;
    if(fb){ if(fb.col===c.col) src=fb; }
    else if(baseVol>1e-4&&baseCol===c.col) src='base';
    if(!src) continue;
    const avail=src==='base'?baseVol:src.vol;
    const amt=Math.min(RATE*dt, avail, c.cap-c.fill);
    if(amt<=0) continue;
    c.fill+=amt; c.lastGain=tick/60;
    if(src==='base') baseVol-=amt; else src.vol-=amt;
    drainCols.push({col,c});
    if(c.fill>=c.cap-1e-6&&c.state==='idle'){ c.fill=c.cap; c.state='clear'; c.popT=0; }
  }
  balls=balls.filter(b=>b.vol>1e-4);
}
function step(dt){
  tick++;
  ballsPhys(dt);
  drain(dt);
  for(const c of conts){ if(c.state==='clear'){ c.popT+=dt; if(c.popT>.45) c.state='gone'; } }
  if(!winFlag&&!loseFlag){
    timeLeft-=dt;
    if(conts.every(c=>c.state==='gone')&&!clearedAll){ clearedAll=true; winAt=tick/60+1; }
    if(clearedAll&&tick/60>=winAt){ winFlag=true; playing=false; showWin(); }
    else if(timeLeft<=0){ timeLeft=0; loseFlag=true; playing=false; showLose(); }
  }
}
/*CORE-END*/

/* ================= рендер ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let scale=1, offX=0, offY=0;
function fit(){
  const st=document.getElementById('stage');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=st.clientWidth*dpr; cv.height=st.clientHeight*dpr;
  scale=Math.min(st.clientWidth/LW, st.clientHeight/LH);
  offX=(st.clientWidth-LW*scale)/2; offY=(st.clientHeight-LH*scale)/2;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
}
window.addEventListener('resize',fit);
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

const bgBub=[], tkBub=[];
for(let i=0;i<12;i++) bgBub.push({x:Math.random()*LW,y:Math.random()*LH,
  r:3+Math.random()*6,s:6+Math.random()*10});
for(let i=0;i<8;i++) tkBub.push({x:TX+10+Math.random()*(TWpx-20),y:TBOT-Math.random()*80,
  r:1.5+Math.random()*2.5,s:8+Math.random()*12});

function surfaceY(){
  const ratio=base0>0?baseVol/base0:0;
  return Math.max(TTOP+8, TBOT-180*ratio);
}
function draw(){
  const t=tick/60;
  ctx.clearRect(-offX/scale,-offY/scale,LW+2*offX/scale,LH+2*offY/scale);
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5;
  for(const b of bgBub){
    b.y-=b.s/60; if(b.y<-10){b.y=LH+10;b.x=Math.random()*LW;}
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.stroke();
  }
  drawTank(t);
  drawBoard();
  // капли слива (вместо труб)
  for(const dc of drainCols){
    const c=dc.c; if(c.state==='gone') continue;
    if(Math.random()<.5){
      const src=floorBall(dc.col);
      const colr=src&&src.col===c.col?PAL[src.col]:PAL[c.col];
      drops.push({x:colCx(dc.col)+(Math.random()-.5)*14,y:TBOT+6,
        vy:120+Math.random()*100,col:c.col,tc:c});
    }
  }
  for(let i=drops.length-1;i>=0;i--){ const p=drops[i];
    p.vy+=1300/60; p.y+=p.vy/60;
    const c=p.tc, maxdy=Math.max(...c.cells.map(k=>k[1]));
    const surf=BY+(c.y+maxdy+1)*CELL-6-(c.fill/c.cap)*((maxdy+1)*CELL-12);
    if(p.y>=surf||c.state==='gone'){ drops.splice(i,1); continue; }
    ctx.fillStyle=PAL[p.col].a;
    ctx.beginPath(); ctx.ellipse(p.x,p.y,3,4.5,0,0,7); ctx.fill();
  }
  for(const c of conts) if(c.state!=='gone') drawCont(c,t);
  drawConfetti();
}
function drawTank(t){
  rr(TX-10,TTOP-10,TWpx+20,TBOT-TTOP+26,18);
  ctx.fillStyle='rgba(255,255,255,.30)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=3; ctx.stroke();
  rr(TX-3,TTOP-3,TWpx+6,TBOT-TTOP+10,10);
  ctx.fillStyle='rgba(226,238,255,.45)'; ctx.fill();
  ctx.save();
  rr(TX-3,TTOP-3,TWpx+6,TBOT-TTOP+6,10); ctx.clip();
  // базовая жидкость (за шарами)
  const sy=surfaceY();
  if(baseVol>0||balls.length){
    ctx.fillStyle=PAL[baseCol].a;
    ctx.beginPath();
    ctx.moveTo(TX-3,TBOT+4);
    for(let x=TX-3;x<=TX+TWpx+3;x+=9)
      ctx.lineTo(x,sy+Math.sin(t*2.4+x*.05)*2);
    ctx.lineTo(TX+TWpx+3,TBOT+4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=PAL[baseCol].f; ctx.lineWidth=2.5; ctx.globalAlpha=.9;
    ctx.beginPath();
    for(let x=TX-3;x<=TX+TWpx+3;x+=9){
      const y=sy+Math.sin(t*2.4+x*.05)*2;
      x===TX-3?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke(); ctx.globalAlpha=1;
    // пузырьки в базе
    ctx.fillStyle='rgba(255,255,255,.4)';
    for(const b of tkBub){
      b.y-=b.s/60;
      if(b.y<sy+6){ b.y=TBOT-6; b.x=TX+10+Math.random()*(TWpx-20); }
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
    }
  }
  // шары-капли (лава-лампа: живая форма, поверх базы, без смешивания)
  for(const b of balls) drawBall(b,t);
  ctx.restore();
  // дно-решётка + мини-капли: цвет дна каждой колонки
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.fillRect(TX-3,TBOT+4,TWpx+6,3);
  const pouring=new Set(drainCols.map(p=>p.col));
  for(let col=0;col<BC;col++){
    if(pouring.has(col)) continue;
    const fb=floorBall(col);
    const ci=fb?fb.col:(baseVol>1e-4?baseCol:-1);
    if(ci<0) continue;
    const x=colCx(col), pul=1+Math.sin(t*5+col)*.1;
    ctx.fillStyle=PAL[ci].a; ctx.strokeStyle='#fff'; ctx.lineWidth=1.8;
    ctx.beginPath();
    ctx.moveTo(x-7*pul,TBOT+8); ctx.lineTo(x+7*pul,TBOT+8); ctx.lineTo(x,TBOT+8+10*pul);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function drawBall(b,t){
  const r=r2v(b.vol), P=PAL[b.col];
  ctx.save();
  const bob=landed(b)?0:Math.sin(t*.9+b.ph*2)*2.5;
  ctx.translate(b.x,b.y+bob);
  ctx.scale(1,landed(b)?0.94:1);                  // сплюск только на дне
  ctx.beginPath();
  for(let a=0;a<=Math.PI*2+.01;a+=.22){
    const rad=r*(1+.05*Math.sin(3*a+b.ph+t*1.7)+.04*Math.sin(5*a-b.ph-t*2.3));
    const x=Math.cos(a)*rad, y=Math.sin(a)*rad;
    a===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
  const g=ctx.createRadialGradient(-r*.35,-r*.4,r*.15,0,0,r*1.05);
  g.addColorStop(0,P.f); g.addColorStop(.55,P.a); g.addColorStop(1,P.b);
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle=P.b; ctx.lineWidth=2; ctx.globalAlpha=.5; ctx.stroke();
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,.35)';          // блик
  ctx.beginPath(); ctx.ellipse(-r*.35,-r*.45,r*.22,r*.13,-.5,0,7); ctx.fill();
  ctx.restore();
}
function drawBoard(){
  const W=BC*CELL+28, H=BR*CELL+28;
  rr(BX-14,BY-14+9,W,H,22); ctx.fillStyle='#2c3468'; ctx.fill();
  rr(BX-14,BY-14,W,H,22); ctx.fillStyle='#454e97'; ctx.fill();
  ctx.strokeStyle='#333c78'; ctx.lineWidth=3; ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.lineWidth=2;
  for(let x=1;x<BC;x++){ ctx.beginPath();
    ctx.moveTo(BX+x*CELL,BY+4); ctx.lineTo(BX+x*CELL,BY+BR*CELL-4); ctx.stroke(); }
  for(let y=1;y<BR;y++){ ctx.beginPath();
    ctx.moveTo(BX+4,BY+y*CELL); ctx.lineTo(BX+BC*CELL-4,BY+y*CELL); ctx.stroke(); }
  ctx.fillStyle='rgba(255,255,255,.06)';
  for(let y=0;y<BR;y++)for(let x=0;x<BC;x++){
    const cx=BX+x*CELL+CELL/2, cy=BY+y*CELL+CELL/2;
    ctx.fillRect(cx-5,cy-1,10,2); ctx.fillRect(cx-1,cy-5,2,10);
  }
}
function outlineOf(c){
  if(c._out) return c._out;
  const has=(x,y)=>c.cells.some(k=>k[0]===x&&k[1]===y);
  const edges=new Map();
  for(const[x,y]of c.cells){
    if(!has(x,y-1)) edges.set(x+','+y,[x+1,y]);
    if(!has(x+1,y)) edges.set((x+1)+','+y,[x+1,y+1]);
    if(!has(x,y+1)) edges.set((x+1)+','+(y+1),[x,y+1]);
    if(!has(x-1,y)) edges.set(x+','+(y+1),[x,y]);
  }
  const pts=[]; let key=edges.keys().next().value;
  const start=key;
  do{ const[sx,sy]=key.split(',').map(Number); const e=edges.get(key);
    pts.push([sx,sy]); key=e[0]+','+e[1];
  }while(key!==start&&pts.length<64);
  const out=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[(i+pts.length-1)%pts.length],b=pts[i],e=pts[(i+1)%pts.length];
    if((b[0]-a[0])*(e[1]-b[1])!==(b[1]-a[1])*(e[0]-b[0])) out.push(b);
  }
  c._out=out; return out;
}
function contPath(c,px,py,r,d=8){
  const raw=outlineOf(c).map(([gx,gy])=>[px+gx*CELL, py+gy*CELL]);
  const n=raw.length, pts=[];
  for(let i=0;i<n;i++){
    const a=raw[(i+n-1)%n], b=raw[i], e=raw[(i+1)%n];
    const d1x=Math.sign(b[0]-a[0]), d1y=Math.sign(b[1]-a[1]);
    const d2x=Math.sign(e[0]-b[0]), d2y=Math.sign(e[1]-b[1]);
    pts.push([b[0]+(-d1y-d2y)*d, b[1]+(d1x+d2x)*d]);
  }
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const p=pts[i%n], nx=pts[(i+1)%n];
    const mx=(p[0]+nx[0])/2, my=(p[1]+nx[1])/2;
    if(i===0) ctx.moveTo(mx,my);
    else ctx.arcTo(p[0],p[1],mx,my,r);
  }
  ctx.closePath();
}
function drawCont(c,t){
  ctx.save();
  const maxdx=Math.max(...c.cells.map(k=>k[0])),maxdy=Math.max(...c.cells.map(k=>k[1]));
  const px=BX+c.x*CELL, py=BY+c.y*CELL;
  if(c.state==='clear'){ const f=c.popT/.45;
    ctx.globalAlpha=1-f;
    const cx=px+(maxdx+1)*CELL/2, cy=py+(maxdy+1)*CELL/2;
    ctx.translate(cx,cy); ctx.scale(1+f*.25,1+f*.25); ctx.translate(-cx,-cy);
  }
  const ga=ctx.globalAlpha;
  contPath(c,px,py,13);
  ctx.fillStyle='#3a4284'; ctx.fill();
  ctx.fillStyle=PAL[c.col].a; ctx.globalAlpha=ga*.14;
  contPath(c,px,py,13); ctx.fill(); ctx.globalAlpha=ga;
  ctx.save();
  contPath(c,px,py,13); ctx.clip();
  ctx.strokeStyle='rgba(0,0,0,.16)'; ctx.lineWidth=2;
  for(const[dx,dy]of c.cells){
    const has=(ax,ay)=>c.cells.some(k=>k[0]===ax&&k[1]===ay);
    if(has(dx+1,dy)){ ctx.beginPath();
      ctx.moveTo(px+(dx+1)*CELL,py+dy*CELL+8); ctx.lineTo(px+(dx+1)*CELL,py+(dy+1)*CELL-8); ctx.stroke(); }
    if(has(dx,dy+1)){ ctx.beginPath();
      ctx.moveTo(px+dx*CELL+8,py+(dy+1)*CELL); ctx.lineTo(px+(dx+1)*CELL-8,py+(dy+1)*CELL); ctx.stroke(); }
  }
  const f=c.fill/c.cap;
  if(f>0){
    const bboxB=py+(maxdy+1)*CELL, surfY=bboxB-6-f*((maxdy+1)*CELL-12);
    ctx.fillStyle=PAL[c.col].a; ctx.globalAlpha=ga*.96;
    ctx.beginPath();
    ctx.moveTo(px-4,bboxB+4);
    for(let x=px-4;x<=px+(maxdx+1)*CELL+4;x+=10)
      ctx.lineTo(x,surfY+Math.sin(t*4+x*.09)*2.2);
    ctx.lineTo(px+(maxdx+1)*CELL+4,bboxB+4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=PAL[c.col].f; ctx.lineWidth=2.5; ctx.globalAlpha=ga*.9;
    ctx.beginPath();
    for(let x=px-4;x<=px+(maxdx+1)*CELL+4;x+=10){
      const y=surfY+Math.sin(t*4+x*.09)*2.2;
      x===px-4?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.20)'; ctx.globalAlpha=ga;
    ctx.fillRect(px+10,Math.max(surfY+4,py+10),7,Math.max(0,bboxB-8-Math.max(surfY+4,py+10)));
  }
  ctx.restore();
  ctx.lineJoin='round';
  contPath(c,px,py,13);
  ctx.lineWidth=15; ctx.strokeStyle=PAL[c.col].b; ctx.stroke();
  const g=ctx.createLinearGradient(0,py-8,0,py+(maxdy+1)*CELL+8);
  g.addColorStop(0,PAL[c.col].f); g.addColorStop(.45,PAL[c.col].a); g.addColorStop(1,PAL[c.col].b);
  ctx.lineWidth=11; ctx.strokeStyle=g; ctx.stroke();
  ctx.lineWidth=2.5; ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.stroke();
  const pct=Math.floor(100*c.fill/c.cap+1e-6);
  const bx=px+(maxdx+1)*CELL-30, by=py+(maxdy+1)*CELL-14;
  rr(bx-16,by-9,44,18,9); ctx.fillStyle='#fff'; ctx.fill();
  ctx.fillStyle='#2b4a8f'; ctx.font='800 11px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(pct+'%',bx+6,by+1);
  ctx.restore();
}

/* ================= конфетти (умеренно) ================= */
let confetti=[];
function popConfetti(){ confetti=[];
  for(let i=0;i<60;i++) confetti.push({x:LW/2,y:LH*.4,vx:(Math.random()-.5)*420,
    vy:-Math.random()*420-80,c:PAL[(Math.random()*PAL.length)|0].a,r:3+Math.random()*4,l:1.6});
}
function drawConfetti(){ if(!confetti.length) return;
  for(let i=confetti.length-1;i>=0;i--){ const p=confetti[i];
    p.vy+=800/60; p.x+=p.vx/60; p.y+=p.vy/60; p.l-=1/60;
    if(p.l<=0){confetti.splice(i,1);continue;}
    ctx.globalAlpha=Math.min(1,p.l); ctx.fillStyle=p.c;
    ctx.fillRect(p.x,p.y,p.r,p.r); ctx.globalAlpha=1; }
}

/* ================= управление (драг) ================= */
let grab=null;
function toLocal(e){ const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left-offX)/scale, y:(e.clientY-r.top-offY)/scale}; }
function contAt(p){
  const cx=Math.floor((p.x-BX)/CELL), cy=Math.floor((p.y-BY)/CELL);
  for(const c of conts){ if(c.state!=='idle') continue;
    for(const[dx,dy]of c.cells) if(c.x+dx===cx&&c.y+dy===cy) return c; }
  return null;
}
cv.addEventListener('pointerdown',e=>{ if(!playing) return;
  const p=toLocal(e), c=contAt(p); if(!c) return;
  grab={c, ox:p.x-(BX+c.x*CELL), oy:p.y-(BY+c.y*CELL)};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{ if(!grab||!playing) return;
  const p=toLocal(e);
  const txc=Math.round((p.x-grab.ox-BX)/CELL), tyc=Math.round((p.y-grab.oy-BY)/CELL);
  moveToward(grab.c,txc,tyc);
});
cv.addEventListener('pointerup',()=>{grab=null;});
cv.addEventListener('pointercancel',()=>{grab=null;});
function moveToward(c,txc,tyc){
  const m=occMap(c);
  for(let s=0;s<12;s++){
    const dx=Math.sign(txc-c.x), dy=Math.sign(tyc-c.y);
    if(!dx&&!dy) break;
    const tryX=Math.abs(txc-c.x)>=Math.abs(tyc-c.y);
    let moved=false;
    const seq=tryX?[[dx,0],[0,dy]]:[[0,dy],[dx,0]];
    for(const[mx,my]of seq){ if(!mx&&!my) continue;
      if(canPlace(c,c.x+mx,c.y+my,m)){ c.x+=mx; c.y+=my; moved=true; break; } }
    if(!moved) break;
  }
}

/* ================= бот (для верификации/лимитов) ================= */
/*BOT-BEGIN*/
function bfsAll(c){
  const m=occMap(c), seen=new Map([[c.x+','+c.y,[]]]), q=[[c.x,c.y]];
  while(q.length){ const[x,y]=q.shift(); const path=seen.get(x+','+y);
    for(const[mx,my]of[[0,-1],[1,0],[-1,0],[0,1]]){
      const nx=x+mx,ny=y+my,k=nx+','+ny;
      if(seen.has(k)||!canPlace(c,nx,ny,m)) continue;
      seen.set(k,path.concat([[nx,ny]])); q.push([nx,ny]);
    }
  } return seen;
}
function bfsPath(c,gx,gy){ const p=bfsAll(c).get(gx+','+gy); return p===undefined?null:p; }
// Клоцки-солвер: направленный поиск (взвешенный A*, f=g+2h) по СОВМЕСТНЫМ
// положениям всех подвижных блоков. h = смещение до цели + число блоков,
// стоящих в коридоре над кандидатом. Цель: cand в ряду 0 на одной из колонок
// goalXs. Возвращает список ходов [{c,x,y}] (по одной клетке) или null.
let botStats={states:0,plans:0};
function planDock(cand,goalXs,movables,cap){
  cap=cap||150000;
  const n=movables.length, ci=movables.indexOf(cand);
  const fixed=new Array(BC*BR).fill(0);
  for(const c of conts){ if(c.state!=='idle'||movables.includes(c)) continue;
    for(const[dx,dy]of c.cells) fixed[(c.y+dy)*BC+(c.x+dx)]=1; }
  const key=s=>{ let k=''; for(let i=0;i<n;i++) k+=String.fromCharCode(48+s[i][0]*8+s[i][1]); return k; };
  const goal=[...new Set(goalXs)];
  const own=new Array(BC*BR);
  const fillOwn=s=>{ own.fill(-1); for(let i=0;i<n;i++){ const c=movables[i];
      for(const[dx,dy]of c.cells) own[(s[i][1]+dy)*BC+(s[i][0]+dx)]=i; } };
  const h=s=>{ const cx=s[ci][0], cy=s[ci][1]; let best=99;
    for(const gx of goal){ let v=Math.abs(cx-gx)+cy; const seen=new Set();
      for(const[dx,dy]of cand.cells){ const col=gx+dx;
        for(let y=0;y<cy+dy;y++){ const k=y*BC+col; if(fixed[k]) v+=3;
          else if(own[k]>=0&&own[k]!==ci&&!seen.has(own[k])){ seen.add(own[k]); v++; } } }
      if(v<best) best=v; }
    return best; };
  const start=movables.map(c=>[c.x,c.y]);
  const prev=new Map([[key(start),null]]);
  const buckets=[]; let fmin=0;
  const push=(f,s,g)=>{ (buckets[f]=buckets[f]||[]).push([s,g]); if(f<fmin) fmin=f; };
  fillOwn(start); push(2*h(start),start,0);
  while(true){
    while(fmin<buckets.length&&!(buckets[fmin]&&buckets[fmin].length)) fmin++;
    if(fmin>=buckets.length) break;
    const [s,g]=buckets[fmin].pop();
    if(s[ci][1]===0&&goal.includes(s[ci][0])){
      const moves=[]; let k=key(s), p;
      while((p=prev.get(k))){ moves.push({c:movables[p[1]],x:p[2],y:p[3]}); k=p[0]; }
      moves.reverse(); botStats.states+=prev.size; botStats.plans++; return moves;
    }
    if(prev.size>cap) break;
    const m=fixed.slice();
    for(let i=0;i<n;i++){ const c=movables[i];
      for(const[dx,dy]of c.cells) m[(s[i][1]+dy)*BC+(s[i][0]+dx)]=1; }
    const sk=key(s);
    for(let i=0;i<n;i++){ const c=movables[i];
      for(const[dx,dy]of c.cells) m[(s[i][1]+dy)*BC+(s[i][0]+dx)]=0;
      for(const[mx,my]of[[0,-1],[1,0],[-1,0],[0,1]]){
        const nx=s[i][0]+mx, ny=s[i][1]+my;
        if(!canPlace(c,nx,ny,m)) continue;
        const ns=s.slice(); ns[i]=[nx,ny]; const k=key(ns);
        if(prev.has(k)) continue; prev.set(k,[sk,i,nx,ny]);
        fillOwn(ns); push(g+1+2*h(ns),ns,g+1);
      }
      for(const[dx,dy]of c.cells) m[(s[i][1]+dy)*BC+(s[i][0]+dx)]=1;
    }
  }
  botStats.states+=prev.size; return null;
}
let botPlan=null, botFailSig='';
function botStep(){
  if(!playing) return 'stopped';
  const now=tick/60;
  const flowing=c=>c.state==='idle'&&c.y===0&&c.fill<c.cap&&now-c.lastGain<0.5;
  // исполнение готового плана: один блок за шаг (слитые подряд ходы одного блока)
  if(botPlan&&botPlan.length){
    const c=botPlan[0].c;
    if(c.state!=='idle'){ botPlan=null; }
    else{
      let m=occMap(c), k=0;
      while(k<botPlan.length&&botPlan[k].c===c&&canPlace(c,botPlan[k].x,botPlan[k].y,m)){
        c.x=botPlan[k].x; c.y=botPlan[k].y; k++; }
      if(k===0){ botPlan=null; } else { botPlan.splice(0,k); if(!botPlan.length) botPlan=null; return 'plan'; }
    }
  }
  // кандидаты на стыковку: блок × колонка со своей жидкостью снизу
  const cands=[];
  for(const c of conts){ if(c.state!=='idle'||c.fill>=c.cap) continue;
    if(flowing(c)) continue;
    const maxdx=Math.max(...c.cells.map(k=>k[0]));
    const xs=[]; let bestSc=0;
    for(let x=0;x<=BC-1-maxdx;x++){
      let sc=0;
      for(const dx of [...new Set(c.cells.map(k=>k[0]))]){
        const col=x+dx;
        const minRow=Math.min(...c.cells.filter(k=>k[0]===dx).map(k=>k[1]));
        if(minRow>0){
          if(conts.some(o=>o!==c&&o.state==='idle'&&o.y===0&&
             o.cells.some(([ax,ay])=>o.x+ax===col&&ay===0))) continue;
        }
        const fb=floorBall(col);
        if(fb){ if(fb.col===c.col) sc+=Math.min(fb.vol,c.cap-c.fill); }
        else if(baseVol>1e-4&&baseCol===c.col) sc+=Math.min(baseVol,c.cap-c.fill);
      }
      if(sc>1e-4){ xs.push(x); bestSc=Math.max(bestSc,sc); }
    }
    if(xs.length) cands.push({c,xs,sc:bestSc});
  }
  cands.sort((a,b)=>b.sc-a.sc);
  // 1) прямой путь без расчистки
  for(const cd of cands){
    for(const x of cd.xs){ const path=bfsPath(cd.c,x,0);
      if(path){ for(const[nx,ny]of path){ cd.c.x=nx; cd.c.y=ny; } return 'docked'; } }
  }
  // 2) клоцки-план: короче — лучше (перебираем до 4 лучших кандидатов);
  //    неудачу помним по сигнатуре позиции, чтобы не перебирать заново каждый шаг
  if(cands.length){
    const movables=conts.filter(o=>o.state==='idle'&&!flowing(o));
    const sig=conts.map(c=>c.state==='idle'?c.x+','+c.y:'-').join('|')+'#'+
      cands.map(cd=>cd.c.id+':'+cd.xs.join('')).join('|');
    if(sig===botFailSig) return 'stuck';
    let best=null;
    for(const cd of cands.slice(0,4)){
      const plan=planDock(cd.c,cd.xs,movables);
      if(plan&&(!best||plan.length<best.length)) best=plan;
    }
    if(best){ botPlan=best; return botStep(); }
    botFailSig=sig; return 'stuck';
  }
  // 3) ждём шар: освобождаем верхний ряд
  for(const c of conts){ if(c.state!=='idle'||c.y!==0||flowing(c)) continue;
    for(let y=BR-1;y>=2;y--)for(let x=0;x<BC;x++){
      const path=bfsPath(c,x,y); if(path){ for(const[nx,ny]of path){c.x=nx;c.y=ny;} return 'evac'; } }
  }
  return 'idle';
}
/*BOT-END*/

/* ================= экраны/цикл ================= */
const $=s=>document.querySelector(s);
const PKEY='sandblocks_v7_progress';
let unlocked=+(localStorage.getItem(PKEY)||1);
function renderHome(){
  const d=$('#lvls'); d.innerHTML='';
  for(let i=1;i<=LEVELS.length;i++){
    const b=document.createElement('button');
    b.className='lv'+(i>unlocked?' lock':''); b.textContent=i>unlocked?'🔒':i;
    if(i<=unlocked) b.onclick=()=>startLevel(i-1);
    d.appendChild(b);
  }
}
function startLevel(n){
  level=n; buildLevel(n); playing=true; confetti=[];
  $('#home').classList.add('hidden'); $('#win').classList.add('hidden'); $('#lose').classList.add('hidden');
  $('#lvlLab').textContent='Level '+(n+1);
}
function showWin(){ popConfetti();
  unlocked=Math.max(unlocked,Math.min(LEVELS.length,level+2));
  localStorage.setItem(PKEY,unlocked);
  $('#btnNext').style.display=level+1<LEVELS.length?'':'none';
  setTimeout(()=>{ if(winFlag) $('#win').classList.remove('hidden'); },150);
}
function showLose(){ $('#lose').classList.remove('hidden'); }
$('#btnHome').onclick=()=>{playing=false;renderHome();$('#home').classList.remove('hidden');};
$('#btnWinHome').onclick=$('#btnHome').onclick;
$('#btnLoseHome').onclick=$('#btnHome').onclick;
$('#btnRetry').onclick=()=>startLevel(level);
$('#btnRetryOv').onclick=()=>startLevel(level);
$('#btnNext').onclick=()=>startLevel(level+1);

function fmt(t){ t=Math.max(0,Math.ceil(t)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last) last=ts;
  let dt=Math.min(.1,(ts-last)/1000); last=ts;
  if(playing){
    let steps=Math.round(dt*60*ffMult);
    for(let i=0;i<Math.max(1,steps);i++) step(1/60);
    if(botOn&&--botCd<=0){ botStep(); botCd=Math.max(3,18/ffMult); }
  }
  $('#timer').textContent=fmt(timeLeft);
  draw();
}
buildLevel(0); renderHome();
requestAnimationFrame(loop); fit();

/* ================= тест-хуки ================= */
window.__game={
  start:n=>startLevel(n),
  snap:()=>({level:level+1,time:+timeLeft.toFixed(1),win:winFlag,lose:loseFlag,playing,
    tankLeft:+(baseVol+balls.reduce((a,b)=>a+b.vol,0)).toFixed(2),
    balls:balls.map(b=>PAL[b.col].n[0]+':'+b.vol.toFixed(1)),
    conts:conts.map(c=>({col:PAL[c.col].n,x:c.x,y:c.y,fill:+c.fill.toFixed(2),cap:c.cap,state:c.state}))}),
  ff:m=>{ffMult=m;},
  bot:on=>{botOn=on;},
  botStep,
  setTime:s=>{timeLeft=s;},
};
