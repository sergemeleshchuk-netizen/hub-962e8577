<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Size Match · визуальная примерка</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 12%,#253568,#111a3a 62%,#080e24);color:#f4f6ff;font:700 16px/1.3 system-ui,sans-serif;display:flex;flex-direction:column}
    header{text-align:center;padding:20px 12px 10px}header small{display:block;color:#a5b6e3;letter-spacing:.14em;text-transform:uppercase;font-size:11px}h1{font-size:25px;margin:5px 0 0}.note{font-size:12px;color:#c0cae5;font-weight:500;margin:5px auto 0;max-width:400px}
    main{width:100%;max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 28px}.card{min-width:0;background:#1d2d5b;border:1px solid #4b609c;border-radius:20px;box-shadow:0 12px 30px #02071c66;overflow:hidden}.art{height:min(48vh,400px);display:flex;align-items:center;justify-content:center;padding:15px;background:radial-gradient(circle,#324884,#17234f)}img{display:block;max-width:100%;max-height:100%;object-fit:contain}.meta{padding:12px 10px 16px;text-align:center}.meta strong{display:block;font-size:15px}.meta span{display:block;font-size:11px;color:#c4cee8;font-weight:500;margin-top:5px}.vs{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);border-radius:50%;background:#ffd453;color:#15203b;padding:10px;font-size:13px;box-shadow:0 4px 14px #0008}
    @media(max-width:450px){header{padding-top:12px}h1{font-size:20px}main{gap:6px;padding:8px 8px 18px}.card{border-radius:14px}.art{height:38vh;padding:7px}.meta{padding:8px 5px 12px}.meta strong{font-size:12px}.vs{top:43%;padding:7px}}
  </style>
</head>
<body>
  <header><small>Size Match Atlas</small><h1 id="heading">Визуальная примерка пары</h1><p class="note">Это просмотр изображений на уровне. Реальные размеры новых объектов ещё уточняются.</p></header>
  <main id="cards"></main><span class="vs">VS</span>
  <script>
    const params=new URLSearchParams(location.search),keys=[params.get('a'),params.get('b')];
    document.querySelector('#heading').textContent=`Визуальная примерка · уровень ${Math.max(1,Number(params.get('l'))||1)}`;
    fetch('atlas.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(atlas=>{
      const all=[...atlas.objects,...(atlas.art_ready_objects||[])],byKey=Object.fromEntries(all.map(o=>[o.key,o]));
      for(const key of keys){const o=byKey[key];if(!o)throw Error('Неизвестный объект: '+key);
        const card=document.createElement('article');card.className='card';const art=document.createElement('div');art.className='art';const img=document.createElement('img');img.src='../'+o.image;img.alt=o.name_ru||o.name;art.append(img);
        const meta=document.createElement('div');meta.className='meta';const name=document.createElement('strong');name.textContent=o.name_ru||o.name;const size=document.createElement('span');size.textContent=o.size_m>0?(o.label||`${o.size_m} м`):'Размер уточняется';meta.append(name,size);card.append(art,meta);document.querySelector('#cards').append(card);
      }
    }).catch(err=>{document.querySelector('#cards').textContent='Не удалось загрузить изображения: '+err.message});
  </script>
</body>
</html>
