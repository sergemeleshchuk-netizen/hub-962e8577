<title>Sheep Sort — v1</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#1f2a1a,#0e130c 80%);}

  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;background:#86bd4a;}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }

  #hud{width:100%;padding:14px 14px 0;z-index:3;position:relative;height:66px;flex:none;display:flex;align-items:center;justify-content:space-between;}
  #gearBtn{width:46px;height:46px;border:none;cursor:pointer;border-radius:14px;background:linear-gradient(#8d6a3c,#6d4f2a);
    box-shadow:0 4px 0 #4a3418,0 6px 12px rgba(40,30,10,.35);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;}
  #gearBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #4a3418;}
  #lvlBadge{background:#fff8e6;color:#5d4322;font-weight:900;font-size:17px;letter-spacing:1px;padding:8px 22px;border-radius:14px;
    box-shadow:0 4px 0 #cdb58c,0 6px 12px rgba(40,30,10,.25);}
  #counter{background:#fff8e6;color:#5d4322;font-weight:900;font-size:16px;padding:8px 12px;border-radius:14px;min-width:92px;text-align:center;
    box-shadow:0 4px 0 #cdb58c,0 6px 12px rgba(40,30,10,.25);}

  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #fx{z-index:15;pointer-events:none;}

  .ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(20,32,10,.62);}
  .hidden{display:none !important;}
  .card{position:relative;width:78%;max-width:360px;background:#fff8e6;border:6px solid #8d6a3c;border-radius:28px;padding:64px 22px 26px;
    display:flex;flex-direction:column;align-items:center;box-shadow:0 24px 60px rgba(0,0,0,.45);}
  .ribbon{position:absolute;top:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(#ffb52e,#f08a13);color:#fff;
    font-weight:900;font-size:26px;letter-spacing:1px;padding:12px 34px;border-radius:14px;text-shadow:0 3px 0 rgba(160,70,0,.55);
    box-shadow:0 6px 0 #c86a08,0 10px 18px rgba(0,0,0,.3);}
  .ribbon.red{background:linear-gradient(#ff5964,#e0333f);box-shadow:0 6px 0 #b0222c,0 10px 18px rgba(0,0,0,.3);text-shadow:0 3px 0 rgba(150,20,30,.55);}
  .emoji{font-size:84px;margin:6px 0 14px;}
  .rewardPill{background:#7cb043;color:#fff;font-weight:900;font-size:24px;border-radius:40px;padding:10px 28px;margin-bottom:20px;}
  .bigBtn{border:none;cursor:pointer;color:#fff;font-weight:900;font-size:26px;letter-spacing:1px;padding:15px 60px;border-radius:18px;
    background:linear-gradient(#5fd435,#3fae1e);box-shadow:0 6px 0 #2e8514,0 10px 18px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(30,90,10,.5);}
  .bigBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #2e8514;}
  .bigBtn.blue{background:linear-gradient(#5b8cf0,#3a68d8);box-shadow:0 6px 0 #2749a8,0 10px 18px rgba(0,0,0,.25);}
  .bigBtn.blue:active{box-shadow:0 2px 0 #2749a8;}
  .bigBtn.brown{background:linear-gradient(#a57a45,#7c5729);box-shadow:0 6px 0 #533a1a,0 10px 18px rgba(0,0,0,.25);}
  .bigBtn.grey{background:#8a9a80;box-shadow:0 6px 0 #5d6b55;}

  #home{background:linear-gradient(#a9d66d,#7fb745);z-index:25;}
  #home h1{margin:0 0 6px;font-size:44px;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 3px 0 #4e7f22,0 8px 14px rgba(30,60,10,.35);text-align:center;line-height:1.05;}
  #home .sub{color:#2f5a14;font-weight:800;margin-bottom:8px;}
  #home .hint{color:#fff;font-weight:600;font-size:14px;margin:0 30px 26px;text-align:center;line-height:1.35;text-shadow:0 1px 0 rgba(0,0,0,.2);}
  #homeIcon{margin-bottom:22px;}
  #lvlRow{display:flex;gap:10px;margin:4px 0 22px;flex-wrap:wrap;justify-content:center;padding:0 20px;}
  .lvlBtn{width:50px;height:50px;border-radius:14px;border:none;cursor:pointer;font-weight:900;font-size:20px;color:#5d4322;background:#fff8e6;
    box-shadow:0 4px 0 #cdb58c,0 6px 12px rgba(40,30,10,.2);}
  .lvlBtn.sel{background:linear-gradient(#ffb52e,#f08a13);color:#fff;box-shadow:0 4px 0 #c86a08,0 6px 12px rgba(90,60,10,.35);}
  .lvlBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #cdb58c;}
  #menuCard{background:#fff8e6;border:5px solid #8d6a3c;border-radius:24px;padding:26px 30px;display:flex;flex-direction:column;gap:14px;align-items:stretch;box-shadow:0 20px 50px rgba(0,0,0,.4);}
  #menuCard .bigBtn{font-size:20px;padding:12px 40px;}
</style>

<body>
<div id="phone">
  <div id="hud">
    <button id="gearBtn">⚙</button>
    <div id="lvlBadge">LEVEL 1</div>
    <div id="counter">🐑 0/12</div>
  </div>
  <div id="stage"><canvas id="game"></canvas></div>
  <canvas id="fx"></canvas>

  <div id="winOv" class="ov hidden">
    <div class="card">
      <div class="ribbon">ALL SORTED!</div>
      <div class="emoji">🐑</div>
      <div class="rewardPill">🪙 +20</div>
      <button class="bigBtn" id="nextBtn">NEXT</button>
    </div>
  </div>
  <div id="loseOv" class="ov hidden">
    <div class="card">
      <div class="ribbon red" id="loseRibbon">PEN IS FULL</div>
      <div class="emoji">😵</div>
      <button class="bigBtn blue" id="retryBtn">RETRY</button>
    </div>
  </div>
  <div id="menuOv" class="ov hidden">
    <div id="menuCard">
      <button class="bigBtn blue" id="mRestart">RESTART</button>
      <button class="bigBtn brown" id="mHome">HOME</button>
      <button class="bigBtn grey" id="mClose">CLOSE</button>
    </div>
  </div>
  <div id="home" class="ov">
    <div id="homeIcon"></div>
    <h1>SHEEP<br>SORT</h1>
    <div class="hint">Tap a sheep. If a pen on top wants its color, it runs there: 3 of a kind complete the order.
      Otherwise it waits on the road, and the road holds only 5. Fenced flocks open after a few taps.</div>
    <div class="sub">Choose a level</div>
    <div id="lvlRow"></div>
    <button class="bigBtn" id="playBtn">PLAY</button>
  </div>
</div>

<script src="art.js"></script>
<script src="core.js"></script>
<script src="levels.js"></script>
<script src="../proto-kit/proto-kit.js"></script>
<script>
'use strict';
/* ================= Sheep Sort v1 =================
   Механика Fish Sort Puzzle (Shycheese) в сеттинге овечьей фермы (UE-рендер дизайнера: трава, тропа,
   цветные трубы-загоны, силосы; спрайты овец и тайл травы — из Car Sort v10, арт = интеграция).
   Правила и боты — core.js (одна реализация для игры/солвера). Уровни — levels.js (генератор в tools/).
   Логика применяется мгновенно на тап, анимация — только визуал (ввод не блокируется). */

const $=id=>document.getElementById(id);
const stage=$('stage'), cvs=$('game'), ctx=cvs.getContext('2d');
const fxCvs=$('fx'), fxCtx=fxCvs.getContext('2d');
const Core=window.SheepCore, LEVELS=window.SHEEP_LEVELS;
const TAU=Math.PI*2;
const PALETTE=['R','B','G','Y','P','O','C','M'];
const COLOR_HEX={R:'#e74c3c',B:'#3498db',G:'#2ecc71',Y:'#f1c40f',P:'#9b59b6',O:'#e67e22',C:'#1abc9c',M:'#e84393'};
const SHEEP_IMG={}; for(const k in window.SHEEP_SRC){const i=new Image();i.src=window.SHEEP_SRC[k];SHEEP_IMG[k]=i;}
const grassImg=new Image(); grassImg.src=window.GRASS_TILE; let grassPat=null;

const FLY=0.38, DONE=0.75, WIN_DELAY=1.0;
const OFFS={1:[[0,0]],2:[[-15,0],[15,0]],3:[[-17,7],[17,7],[0,-11]],4:[[-15,-12],[15,-12],[-15,13],[15,13]]};
const RAD={1:24,2:34,3:38,4:42};

let level=parseInt(localStorage.getItem('sheepSort.level')||'1'); if(!(level>=1&&level<=LEVELS.length))level=1;
let st=null, spec=null, playing=false, now=0, winTimer=0;
let W=0,H=0,DPR=1;
let geo={};                 // геометрия экрана: заказы, ожидание, луг
let cview=[];               // вид кучек: {x,y,r,sc,slots:{id→[dx,dy]},shake}
let vPen=[];                // вид загонов-заказов: {c,ids[],doneUntil,closed}
let vTray=[];               // id овец, стоящих в ожидании (порядок = место)
let flyers=[], timeline=[], decos=[], sheepColor={};
let penReadyAt=[];          // когда загон визуально показывает текущий заказ ядра
let loseAt=0, timeLeft=0;      // таймер уровня (spec.time, секунды; 0 = без лимита)

/* ---------- геометрия ---------- */
function layout(){
  const rect=stage.getBoundingClientRect();
  DPR=window.devicePixelRatio||1; W=rect.width; H=rect.height;
  cvs.width=W*DPR; cvs.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  const phone=$('phone').getBoundingClientRect();
  fxCvs.width=phone.width*DPR; fxCvs.height=phone.height*DPR; fxCtx.setTransform(DPR,0,0,DPR,0,0);
  if(!spec)return;
  const n=spec.slots, gap=10, side=14;
  const PW=Math.min(86,(W-side*2-(n-1)*gap)/n), PH=Math.min(108,Math.max(92,H*0.135));
  const totalW=n*PW+(n-1)*gap, x0=(W-totalW)/2, py=8;
  geo.pens=[]; for(let i=0;i<n;i++)geo.pens.push({x:x0+i*(PW+gap),y:py,w:PW,h:PH});
  geo.badgeY=py+PH+4;
  geo.nextY=py+PH+30;                     // строка NEXT
  const TH=Math.min(84,Math.max(70,H*0.1));
  geo.tray={x:10,y:H-8-TH,w:W-20,h:TH};
  geo.meadow={x:8,y:geo.nextY+30,w:W-16,h:geo.tray.y-10-(geo.nextY+30)};
  placeClusters();
  makeDecos();
}
function slotPos(oi,k){const p=geo.pens[oi]; const cx=p.x+p.w/2, top=p.y+22, step=(p.h-30)/2; return {x:cx,y:top+k*step};}
function trayPos(i){const t=geo.tray; const n=spec.tray; const step=(t.w-56)/(n-1); return {x:t.x+24+Math.min(i,n-1)*step+(i>=n?18:0),y:t.y+t.h*0.52};}

/* раскладка кучек на лугу: случайные позиции + расталкивание; не влезло — уменьшаем масштаб */
function placeClusters(){
  const m=geo.meadow, rng=Core.mulberry32((spec.seed||1)*31+7);
  const items=spec.clusters.map((cl,i)=>({i,n:cl.s.length}));
  const init=items.map(()=>[rng(),rng()]);
  // мало кучек — овцы крупнее (до ×1.5), пока хватает места
  const sumArea=items.reduce((a,it)=>a+Math.PI*RAD[it.n]*RAD[it.n],0);
  let sc=Math.max(1,Math.min(1.5,Math.sqrt(m.w*m.h*0.42/sumArea)));
  for(let attempt=0;attempt<10;attempt++){
    const rs=items.map(it=>RAD[it.n]*sc);
    const pos=items.map((it,k)=>[m.x+rs[k]+init[k][0]*(m.w-2*rs[k]), m.y+rs[k]+init[k][1]*(m.h-2*rs[k])]);
    let worst=0;
    for(let it=0;it<160;it++){
      worst=0;
      for(let a=0;a<pos.length;a++)for(let b=a+1;b<pos.length;b++){
        const dx=pos[b][0]-pos[a][0], dy=pos[b][1]-pos[a][1], d=Math.hypot(dx,dy)||0.01, need=rs[a]+rs[b]+8;
        if(d<need){const push=(need-d)/2, ux=dx/d, uy=dy/d; pos[a][0]-=ux*push;pos[a][1]-=uy*push;pos[b][0]+=ux*push;pos[b][1]+=uy*push; worst=Math.max(worst,need-d);}
      }
      for(let a=0;a<pos.length;a++){pos[a][0]=Math.min(m.x+m.w-rs[a],Math.max(m.x+rs[a],pos[a][0]));pos[a][1]=Math.min(m.y+m.h-rs[a],Math.max(m.y+rs[a],pos[a][1]));}
    }
    if(worst<3||attempt===9){
      cview=items.map((it,k)=>{const cl=spec.clusters[it.i]; const slots={}; const ids=st.clusters[it.i].allIds;
        ids.forEach((id,j)=>slots[id]=OFFS[cl.s.length][j]); return {x:pos[k][0],y:pos[k][1],r:rs[k],sc,slots,shake:0};});
      return;
    }
    sc*=0.92;
  }
}
function makeDecos(){
  decos=[]; const m=geo.meadow, rng=Core.mulberry32((spec.seed||1)*97+3); let tries=0;
  const kinds=['rock','flower','tuft','flower','tuft'];
  while(decos.length<26&&tries++<600){
    const x=m.x+rng()*m.w, y=m.y+rng()*m.h;
    if(cview.some(c=>Math.hypot(c.x-x,c.y-y)<c.r+14))continue;
    decos.push({kind:kinds[(rng()*kinds.length)|0],x,y,s:0.6+rng()*0.7,h:rng()});
  }
}
window.addEventListener('resize',layout);

/* ---------- уровень ---------- */
function buildLevel(n){
  spec=LEVELS[n-1]; st=Core.newState(spec);
  st.clusters.forEach(cl=>cl.allIds=cl.sheep.map(s=>s.id));
  sheepColor={}; st.clusters.forEach(cl=>cl.sheep.forEach(s=>sheepColor[s.id]=s.c));
  vPen=st.orders.map(o=>o?{c:o.c,ids:[],doneUntil:0,closed:false}:{c:0,ids:[],doneUntil:0,closed:true});
  penReadyAt=vPen.map(()=>0);
  vTray=[]; flyers=[]; timeline=[]; now=0; loseAt=0; timeLeft=spec.time||0; playing=true; stopConfetti(); clearTimeout(winTimer);
  $('lvlBadge').textContent='LEVEL '+n; updCounter(); layout();
}
function updCounter(){$('counter').textContent='🐑 '+st.sorted+'/'+st.total;}

/* ---------- ввод ---------- */
function sheepScreenPos(ci,id){const cv=cview[ci]; const o=cv.slots[id]; return {x:cv.x+o[0]*cv.sc,y:cv.y+o[1]*cv.sc};}
cvs.addEventListener('pointerdown',e=>{
  if(!playing)return;
  const r=cvs.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  let best=null,bd=1e9;
  st.clusters.forEach(cl=>{ for(const s of cl.sheep){ const p=sheepScreenPos(cl.i,s.id); const d=Math.hypot(p.x-px,p.y-py); if(d<bd){bd=d;best={cl,s};} } });
  if(!best||bd>26*cview[best.cl.i].sc+8)return;
  if(best.cl.lock>0){cview[best.cl.i].shake=0.35;return;}
  doTap(best.cl.i,best.s.c,best.s.id);
});
function doTap(ci,c,id){
  // ядро мгновенно; событие → визуальная таймлиния
  const cl=st.clusters[ci]; if(id===undefined){const s=cl.sheep.find(s=>s.c===c); if(!s)return null; id=s.id;}
  // ядро снимает ПЕРВУЮ овцу цвета c — переставим нужную вперёд, чтобы визуал совпал с логикой
  const k=cl.sheep.findIndex(s=>s.id===id); if(k>0){const s=cl.sheep.splice(k,1)[0]; cl.sheep.unshift(s);}
  const from=sheepScreenPos(ci,id);
  const ev=Core.tap(st,ci,c); if(!ev)return null;
  updCounter(); schedule(ev,from);
  return ev;
}
function at(t,fn){timeline.push({at:now+t,fn});}
function schedule(ev,from){
  let start=0, lastArrive=0, doneAt=0, trayStagger=0;
  for(const e of ev){
    if(e.t==='unlock'){ const ci=e.ci; at(0,()=>{cview[ci].openT=now;}); }
    else if(e.t==='toOrder'||e.t==='trayToOrder'){
      const isTray=e.t==='trayToOrder';
      let s0=isTray?start+trayStagger:start;
      s0=Math.max(s0,penReadyAt[e.oi]-now);            // загон должен уже показывать этот заказ
      if(isTray)trayStagger+=0.09;
      const oi=e.oi,k=e.k,id=e.id,c=e.c,src=isTray?null:from;
      at(s0,()=>{
        let p0=src; if(!p0){const ti=vTray.indexOf(id); p0=trayPos(ti<0?0:ti); if(ti>=0)vTray.splice(ti,1);}
        const p1=slotPos(oi,k);
        flyers.push({id,c,x0:p0.x,y0:p0.y,x1:p1.x,y1:p1.y,t0:now,dur:FLY,hop:isTray?70:46,arrive(){vPen[oi].ids.push(id);}});
      });
      lastArrive=s0+FLY;
    }
    else if(e.t==='toTray'){
      const id=e.id,c=e.c,ti=e.ti,over=ti>=spec.tray;
      at(start,()=>{const p1=trayPos(ti); flyers.push({id,c,x0:from.x,y0:from.y,x1:p1.x,y1:p1.y,t0:now,dur:FLY,hop:46,arrive(){vTray.push(id);}});});
      lastArrive=start+FLY;
      if(over)loseAt=now+lastArrive+0.15;
    }
    else if(e.t==='orderDone'){ doneAt=lastArrive; const oi=e.oi; at(doneAt,()=>{vPen[oi].doneUntil=now+DONE;}); penReadyAt[oi]=now+doneAt+DONE; }
    else if(e.t==='newOrder'){ const oi=e.oi,c=e.c; start=doneAt+DONE; trayStagger=0; at(start,()=>{vPen[oi]={c,ids:[],doneUntil:0,closed:false};}); }
    else if(e.t==='slotClosed'){ const oi=e.oi; at(doneAt+DONE,()=>{vPen[oi]={c:0,ids:[],doneUntil:0,closed:true};}); }
    else if(e.t==='lose'){ playing=false; }
    else if(e.t==='win'){ playing=false; at(lastArrive+WIN_DELAY,()=>{win();}); }
  }
  if(loseAt&&!playing){ at(loseAt-now,()=>{loseWith('PEN IS FULL');}); loseAt=0; }
}

/* ---------- рисование ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function strokeRR(x,y,w,h,r){rr(x,y,w,h,r);ctx.stroke();}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return `rgb(${r},${g},${b})`;}
function hexOf(c){return COLOR_HEX[PALETTE[c]];}
function drawSheep(cx,cy,h,c,alpha){
  const img=SHEEP_IMG[PALETTE[c]];
  ctx.save(); if(alpha!==undefined)ctx.globalAlpha=alpha;
  if(img&&img.complete&&img.naturalWidth){
    const w=h*img.naturalWidth/img.naturalHeight;
    ctx.fillStyle='rgba(30,40,20,.22)'; ctx.beginPath(); ctx.ellipse(cx,cy+h*0.42,w*0.42,h*0.15,0,0,TAU); ctx.fill();
    ctx.drawImage(img,cx-w/2,cy-h/2,w,h);
  } else { ctx.fillStyle=hexOf(c); ctx.beginPath(); ctx.arc(cx,cy,h*0.4,0,TAU); ctx.fill(); }
  ctx.restore();
}
function drawDeco(d){
  ctx.save();ctx.translate(d.x,d.y);const s=d.s;
  if(d.kind==='rock'){
    ctx.fillStyle='rgba(20,30,10,.20)';ctx.beginPath();ctx.ellipse(0,6*s,11*s,4*s,0,0,TAU);ctx.fill();
    ctx.fillStyle='#8f8b80';ctx.beginPath();ctx.ellipse(0,0,10*s,8*s,0,0,TAU);ctx.fill();
    ctx.fillStyle='#b3afa4';ctx.beginPath();ctx.ellipse(-2.5*s,-2.5*s,5.5*s,4*s,0,0,TAU);ctx.fill();
    ctx.fillStyle='#6f6b61';ctx.beginPath();ctx.ellipse(3*s,3*s,4*s,2.6*s,0,0,TAU);ctx.fill();
  }else if(d.kind==='flower'){
    ctx.fillStyle=d.h<.33?'#ffffff':d.h<.66?'#ff8fbf':'#ffd84a';
    for(let i=0;i<5;i++){const a=i/5*TAU;ctx.beginPath();ctx.arc(Math.cos(a)*3.4*s,Math.sin(a)*3.4*s,2.4*s,0,TAU);ctx.fill();}
    ctx.fillStyle='#f2b200';ctx.beginPath();ctx.arc(0,0,2*s,0,TAU);ctx.fill();
  }else{
    ctx.strokeStyle='#5c9432';ctx.lineWidth=2*s;ctx.lineCap='round';
    for(const dx of [-4*s,0,4*s]){ctx.beginPath();ctx.moveTo(dx,4*s);ctx.quadraticCurveTo(dx*1.3,-3*s,dx*1.6+(dx===0?2*s:0),-8*s);ctx.stroke();}
    ctx.strokeStyle='#77b048';ctx.beginPath();ctx.moveTo(0,4*s);ctx.lineTo(1*s,-7*s);ctx.stroke();
  }
  ctx.restore();
}
function drawSilo(cx,cy,k){
  const w=34*k,h=50*k,x=cx-w/2,y=cy-h*0.62;
  ctx.fillStyle='rgba(20,30,10,.24)';ctx.beginPath();ctx.ellipse(cx,y+h-2,w*0.55,7*k,0,0,TAU);ctx.fill();
  ctx.save();rr(x,y,w,h,8*k);ctx.clip();
  for(let i=0;i<5;i++){ctx.fillStyle=i%2?'#e0554c':'#f4efe1';ctx.fillRect(x,y+i*h/5,w,h/5+1);}
  ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(x,y,w*0.34,h);ctx.restore();
  ctx.strokeStyle='rgba(90,60,40,.35)';ctx.lineWidth=2;strokeRR(x,y,w,h,8*k);
  ctx.fillStyle='#c9ccd2';ctx.beginPath();ctx.ellipse(cx,y,w*0.52,9*k,0,0,TAU);ctx.fill();
  ctx.fillStyle='#eef0f3';ctx.beginPath();ctx.ellipse(cx-3,y-2,w*0.34,5*k,0,0,TAU);ctx.fill();
}
/* загон-заказ: земляной пол + глянцевая цветная труба-оградка + 3 места */
function drawPen(oi){
  const p=geo.pens[oi], v=vPen[oi], o=st.orders[oi];
  const col=v.closed?'#e7dcc2':hexOf(v.c);
  ctx.fillStyle='rgba(205,175,110,.62)'; rr(p.x+3,p.y+3,p.w-6,p.h-6,10); ctx.fill();
  const R=14; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.strokeStyle='rgba(0,0,0,.16)';ctx.lineWidth=13;strokeRR(p.x,p.y+2.5,p.w,p.h,R);
  ctx.strokeStyle=shade(col,-48);ctx.lineWidth=13;strokeRR(p.x,p.y,p.w,p.h,R);
  ctx.strokeStyle=col;ctx.lineWidth=8.5;strokeRR(p.x,p.y,p.w,p.h,R);
  ctx.strokeStyle=shade(col,62);ctx.lineWidth=3;strokeRR(p.x,p.y,p.w,p.h,R);
  // ворота снизу (вырез в оградке)
  ctx.fillStyle='rgba(205,175,110,.95)'; ctx.fillRect(p.x+p.w/2-14,p.y+p.h-8,28,16);
  const shown=v.ids.length;
  for(let k=0;k<Core.NEED;k++){const s=slotPos(oi,k);
    if(k<shown)drawSheep(s.x,s.y,26,v.c);
    else if(!v.closed){ctx.fillStyle='rgba(90,70,40,.16)';ctx.beginPath();ctx.ellipse(s.x,s.y+6,12,4.5,0,0,TAU);ctx.fill();}
  }
  // бейдж счётчика
  const by=geo.badgeY, bw=Math.min(p.w,64), bx=p.x+p.w/2-bw/2;
  ctx.fillStyle='#fff8e6'; rr(bx,by,bw,22,11); ctx.fill();
  ctx.strokeStyle=shade(col,-30); ctx.lineWidth=2.5; strokeRR(bx,by,bw,22,11);
  ctx.fillStyle='#5d4322'; ctx.font='900 14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(v.closed?'✓':shown+'/'+Core.NEED, p.x+p.w/2, by+11.5);
  if(v.doneUntil>now){ // WELL DONE
    const k=(v.doneUntil-now)/DONE, a=Math.min(1,k*3);
    ctx.save(); ctx.globalAlpha=a; ctx.shadowColor='rgba(255,230,90,.9)'; ctx.shadowBlur=18;
    ctx.strokeStyle='#ffe66b'; ctx.lineWidth=6; strokeRR(p.x,p.y,p.w,p.h,R);
    ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.strokeStyle='#c2620a'; ctx.lineWidth=4; ctx.font='900 15px sans-serif';
    const ty=p.y+p.h/2+(1-k)*(-8); ctx.strokeText('WELL',p.x+p.w/2,ty-9); ctx.fillText('WELL',p.x+p.w/2,ty-9);
    ctx.strokeText('DONE!',p.x+p.w/2,ty+9); ctx.fillText('DONE!',p.x+p.w/2,ty+9); ctx.restore();
  }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}
function drawNext(){
  const y=geo.nextY; const nx=W-14;
  const nc=st.qi<spec.queue.length?spec.queue[st.qi]:-1;
  ctx.fillStyle='rgba(60,90,30,.55)'; rr(nx-92,y,92,26,13); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='900 12px sans-serif'; ctx.textBaseline='middle'; ctx.fillText('NEXT',nx-84,y+13.5);
  if(nc>=0)drawSheep(nx-26,y+12,24,nc); else {ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('—',nx-30,y+13.5);}
  // подпись слева: сколько заказов осталось
  const left=spec.queue.length-st.qi+st.orders.filter(o=>o).length;
  ctx.fillStyle='rgba(60,90,30,.55)'; rr(14,y,118,26,13); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText('ORDERS LEFT: '+left,22,y+13.5);
  if(spec.time){ // таймер уровня по центру
    const t=Math.max(0,Math.ceil(timeLeft)), txt='⏱ '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0'), hot=timeLeft<10;
    ctx.fillStyle=hot?(Math.sin(now*10)>0?'#d63a2a':'#a8281c'):'rgba(60,90,30,.55)'; rr(W/2-34,y,68,26,13); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='900 13px sans-serif'; ctx.textAlign='center'; ctx.fillText(txt,W/2,y+13.5); ctx.textAlign='left';
  }
  ctx.textBaseline='alphabetic';
}
function drawCluster(ci){
  const cv=cview[ci], cl=st.clusters[ci];
  if(!cl.sheep.length&&cl.lock===0&&!(cv.openT&&now-cv.openT<0.5))return;
  let sx=0; if(cv.shake>0){cv.shake-=1/60; sx=Math.sin(cv.shake*60)*4*cv.shake;}
  ctx.save(); ctx.translate(sx,0);
  // земляной пятачок
  ctx.fillStyle='rgba(205,175,110,.42)'; ctx.beginPath(); ctx.ellipse(cv.x,cv.y+4,cv.r*0.98,cv.r*0.72,0,0,TAU); ctx.fill();
  const sorted=cl.sheep.slice().sort((a,b)=>cv.slots[a.id][1]-cv.slots[b.id][1]);
  for(const s of sorted){const p=sheepScreenPos(ci,s.id); drawSheep(p.x,p.y,30*cv.sc,s.c,cl.lock>0?0.85:1);}
  if(cl.lock>0||(cv.openT&&now-cv.openT<0.5)){ // деревянный заборчик с замком
    const a=cl.lock>0?1:Math.max(0,1-(now-cv.openT)/0.5);
    ctx.save(); ctx.globalAlpha=a; if(cl.lock===0){const k=1+(now-cv.openT)*0.6;ctx.translate(cv.x,cv.y);ctx.scale(k,k);ctx.translate(-cv.x,-cv.y);}
    const posts=Math.max(8,Math.round(cv.r/7)); const rx=cv.r*1.0, ry=cv.r*0.76;
    ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=3.5; ctx.beginPath(); ctx.ellipse(cv.x,cv.y+2,rx,ry,0,0,TAU); ctx.stroke();
    ctx.strokeStyle='#c98a4b'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(cv.x,cv.y-1,rx,ry,0,0,TAU); ctx.stroke();
    for(let i=0;i<posts;i++){const t=i/posts*TAU; const x=cv.x+Math.cos(t)*rx, y=cv.y+Math.sin(t)*ry;
      ctx.fillStyle='#6d4322'; ctx.fillRect(x-2.5,y-9,5,14); ctx.fillStyle='#b07a46'; ctx.fillRect(x-2.5,y-9,2,14);}
    // табличка с числом тапов до открытия
    if(cl.lock>0){
      const bw=44,bh=24,bx=cv.x-bw/2,by=cv.y-ry-24;
      ctx.fillStyle='#4a3418'; rr(bx,by+2,bw,bh,8); ctx.fill(); ctx.fillStyle='#8d6a3c'; rr(bx,by,bw,bh,8); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='900 14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🔒 '+cl.lock,cv.x,by+bh/2+0.5); ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    }
    ctx.restore();
  }
  ctx.restore();
}
function drawTray(){
  const t=geo.tray, full=vTray.length>=spec.tray;
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle='#a4834c';ctx.lineWidth=t.h;ctx.beginPath();ctx.moveTo(t.x+t.h/2,t.y+t.h/2);ctx.lineTo(t.x+t.w-t.h/2,t.y+t.h/2);ctx.stroke();
  ctx.strokeStyle='#cdaf74';ctx.lineWidth=t.h-8;ctx.beginPath();ctx.moveTo(t.x+t.h/2,t.y+t.h/2);ctx.lineTo(t.x+t.w-t.h/2,t.y+t.h/2);ctx.stroke();
  ctx.strokeStyle='#d9bd84';ctx.lineWidth=t.h*0.42;ctx.beginPath();ctx.moveTo(t.x+t.h/2,t.y+t.h/2);ctx.lineTo(t.x+t.w-t.h/2,t.y+t.h/2);ctx.stroke();
  for(let i=0;i<spec.tray;i++){const p=trayPos(i);
    ctx.fillStyle=full?'rgba(200,60,40,.28)':'rgba(120,90,50,.22)';ctx.beginPath();ctx.ellipse(p.x,p.y+8,14,5.5,0,0,TAU);ctx.fill();}
  vTray.forEach((id,i)=>{const p=trayPos(i);drawSheep(p.x,p.y,28,sheepColor[id]);});
  // подпись
  ctx.fillStyle=full?'#d63a2a':'rgba(60,90,30,.6)'; rr(t.x+8,t.y-12,112,22,11); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='900 12px sans-serif'; ctx.textBaseline='middle';
  ctx.fillText('WAITING  '+Math.min(vTray.length,spec.tray)+'/'+spec.tray, t.x+16, t.y-1); ctx.textBaseline='alphabetic';
  if(full){ctx.save();ctx.shadowColor='rgba(255,60,40,.8)';ctx.shadowBlur=16+Math.sin(now*8)*6;ctx.strokeStyle='rgba(230,60,40,.75)';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(t.x+t.h/2,t.y+t.h/2);ctx.lineTo(t.x+t.w-t.h/2,t.y+t.h/2);ctx.lineWidth=t.h;ctx.strokeStyle='rgba(230,60,40,.18)';ctx.stroke();ctx.restore();}
}
function draw(){
  ctx.clearRect(0,0,W,H);
  if(!grassPat&&grassImg.complete&&grassImg.naturalWidth){ // тайл 2×2 с зеркалами — швы сетки не читаются
    const w=grassImg.naturalWidth,h=grassImg.naturalHeight,oc=document.createElement('canvas');oc.width=w*2;oc.height=h*2;const o=oc.getContext('2d');
    o.drawImage(grassImg,0,0);o.save();o.translate(w*2,0);o.scale(-1,1);o.drawImage(grassImg,0,0);o.restore();
    o.save();o.translate(0,h*2);o.scale(1,-1);o.drawImage(grassImg,0,0);o.restore();
    o.save();o.translate(w*2,h*2);o.scale(-1,-1);o.drawImage(grassImg,0,0);o.restore();
    grassPat=ctx.createPattern(oc,'repeat');}
  if(grassPat){ctx.fillStyle=grassPat;ctx.fillRect(0,0,W,H);}
  else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#93c552');g.addColorStop(1,'#7cb043');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  if(!spec||!st)return;
  for(const d of decos)drawDeco(d);
  const m=geo.meadow; drawSilo(m.x+22,m.y+34,0.8); drawSilo(m.x+m.w-22,m.y+m.h-16,0.8);
  for(let i=0;i<geo.pens.length;i++)drawPen(i);
  drawNext(); drawTray();
  const order=cview.map((c,i)=>i).sort((a,b)=>cview[a].y-cview[b].y);
  for(const i of order)drawCluster(i);
  for(let i=flyers.length-1;i>=0;i--){const f=flyers[i]; const k=Math.min(1,(now-f.t0)/f.dur), e=k*k*(3-2*k);
    const x=f.x0+(f.x1-f.x0)*e, y=f.y0+(f.y1-f.y0)*e-Math.sin(k*Math.PI)*f.hop;
    drawSheep(x,y,30,f.c); if(k>=1){flyers.splice(i,1);f.arrive();}}
}

/* ---------- конфетти / экраны ---------- */
let confetti=[],confettiOn=false;
function startConfetti(){confetti=[];confettiOn=true;const w=fxCvs.width/DPR,h=fxCvs.height/DPR;
  const cols=['#ff5964','#f8c92e','#3a7cf6','#45c454','#ff8ac2','#59e0e8','#b04ef5','#ff9b2e'];
  for(let i=0;i<130;i++)confetti.push({x:Math.random()*w,y:-Math.random()*h*0.8,vy:110+Math.random()*160,ph:Math.random()*7,om:2+Math.random()*3,s:4+Math.random()*6,c:cols[(Math.random()*cols.length)|0],r:Math.random()*7});}
function stopConfetti(){confettiOn=false;fxCtx.clearRect(0,0,fxCvs.width,fxCvs.height);}
function drawConfetti(dt){if(!confettiOn)return;const w=fxCvs.width/DPR,h=fxCvs.height/DPR;fxCtx.clearRect(0,0,w,h);
  for(const p of confetti){p.y+=p.vy*dt;p.ph+=p.om*dt;p.r+=3*dt;if(p.y>h+20){p.y=-20;p.x=Math.random()*w;}
    fxCtx.save();fxCtx.translate(p.x+Math.sin(p.ph)*14,p.y);fxCtx.rotate(p.r);fxCtx.scale(1,Math.abs(Math.cos(p.ph)));fxCtx.fillStyle=p.c;fxCtx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);fxCtx.restore();}}
function win(){startConfetti();$('winOv').classList.remove('hidden');}
function loseWith(txt){$('loseRibbon').textContent=txt;$('loseOv').classList.remove('hidden');}
$('nextBtn').onclick=()=>{stopConfetti();$('winOv').classList.add('hidden');ProtoKit.play(level%LEVELS.length+1);};
$('retryBtn').onclick=()=>{$('loseOv').classList.add('hidden');buildLevel(level);};
$('playBtn').onclick=()=>ProtoKit.play(level);
function renderLevelRow(){const row=$('lvlRow');row.textContent='';
  for(let i=1;i<=LEVELS.length;i++){const b=document.createElement('button');b.className='lvlBtn'+(i===level?' sel':'');b.textContent=i;b.onclick=()=>ProtoKit.play(i);row.appendChild(b);}}
$('gearBtn').onclick=()=>{if(st)$('menuOv').classList.remove('hidden');};
$('mClose').onclick=()=>$('menuOv').classList.add('hidden');
$('mRestart').onclick=()=>{$('menuOv').classList.add('hidden');buildLevel(level);};
$('mHome').onclick=()=>{$('menuOv').classList.add('hidden');stopConfetti();ProtoKit.home();};

/* ---------- тест-хук ---------- */
window.__game={
  get state(){return st&&{clusters:st.clusters.map(c=>({i:c.i,lock:c.lock,sheep:c.sheep.map(s=>s.c)})),tray:st.tray.map(s=>s.c),
    orders:st.orders.map(o=>o&&{c:o.c,got:o.got.length}),qi:st.qi,sorted:st.sorted,total:st.total,won:st.won,lost:st.lost,playing,level,timeLeft,flyers:flyers.length,timeline:timeline.length};},
  setTime(s){timeLeft=s;},
  tap(ci,c){return doTap(ci,c);},
  solve(){return Core.solve(spec).solution;},
  load(n){level=n;buildLevel(n);},
  bounds(){const sr=stage.getBoundingClientRect(),pr=$('phone').getBoundingClientRect();
    return {left:sr.left-pr.left+8,top:sr.top-pr.top+8,right:sr.left-pr.left+W-8,bottom:sr.top-pr.top+H-8};},
};

/* ---------- цикл (setInterval: честный dt и в headless) ---------- */
let last=performance.now();
setInterval(()=>{
  const t=performance.now(); const rdt=(t-last)/1000, dt=Math.min(0.1,rdt); last=t; now+=dt;
  if(timeline.length){timeline.sort((a,b)=>a.at-b.at); while(timeline.length&&timeline[0].at<=now){timeline.shift().fn();}}
  // таймер идёт по реальным часам (анимация — по зажатому dt, чтобы не скакать при просадке fps)
  if(playing&&spec&&spec.time&&$('menuOv').classList.contains('hidden')){ timeLeft-=Math.min(1,rdt);
    if(timeLeft<=0){timeLeft=0;playing=false;loseWith("TIME'S UP");} }
  draw(); drawConfetti(dt);
},1000/60);
$('homeIcon').appendChild(ProtoKit.iconTile(104));
ProtoKit.init({slug:'sheepsort',name:'Sheep Sort',icon:'icon.png',iconEmoji:'🐑',accent:'#6aa84f',levels:LEVELS.length,
  startLevel(n){level=n;localStorage.setItem('sheepSort.level',n);
    $('home').classList.add('hidden');$('winOv').classList.add('hidden');$('loseOv').classList.add('hidden');buildLevel(n);},
  showHome(){playing=false;st=null;spec=null;$('winOv').classList.add('hidden');$('loseOv').classList.add('hidden');layout();renderLevelRow();$('home').classList.remove('hidden');},
});
</script>
