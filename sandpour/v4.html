<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Liquid Pour — proto v4</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}
  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:linear-gradient(180deg,#5db1ec 0%,#4a95dc 60%,#3f7fcc 100%);}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }
  #hud{width:100%;padding:10px 12px;z-index:3;display:flex;align-items:center;gap:8px;}
  .pill{background:#2b5a9c;color:#fff;border-radius:16px;padding:7px 14px;font-weight:800;
        font-size:15px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.25);}
  .ibtn{width:38px;height:38px;border-radius:12px;background:#2b5a9c;color:#e6f2ff;border:0;
        font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  .ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:14px;background:rgba(22,60,120,.88);backdrop-filter:blur(3px);}
  .ov h1{color:#fff;font-size:34px;margin:0;text-shadow:0 3px 0 rgba(0,0,0,.35);letter-spacing:1px;}
  .ov .sub{color:#d8d3ff;font-size:15px;margin:0 28px;text-align:center;line-height:1.45;}
  .btn{background:linear-gradient(180deg,#ffd54d,#f4a825);border:0;border-radius:18px;padding:14px 34px;
       font-size:19px;font-weight:900;color:#5b3a00;cursor:pointer;box-shadow:0 5px 0 #b97b12;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b97b12;}
  .btn.sec{background:linear-gradient(180deg,#5aa8f0,#3b82d6);color:#fff;box-shadow:0 5px 0 #24589c;}
  /* карта-путь уровней: снизу вверх */
  #path{display:flex;flex-direction:column-reverse;align-items:center;gap:0;margin:6px 0;}
  .node{width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;font-size:22px;font-weight:900;color:#fff;
        background:linear-gradient(180deg,#5aa8f0,#3b82d6);box-shadow:0 5px 0 #24589c,0 8px 16px rgba(0,0,0,.3);}
  .node.spike{background:linear-gradient(180deg,#ff8a5c,#e9553c);box-shadow:0 5px 0 #a8321f,0 8px 16px rgba(0,0,0,.3);}
  .node:active{transform:translateY(3px);}
  .link{width:6px;height:22px;background:repeating-linear-gradient(180deg,#d9ecff 0 5px,transparent 5px 10px);margin:2px 0;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="phone">
  <div id="hud">
    <button class="ibtn" id="btnHome">⌂</button>
    <div style="flex:1"></div>
    <div class="pill" id="lvlLab">Level 1</div>
    <div style="flex:1"></div>
    <button class="ibtn" id="btnRetry">⟳</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>

  <div class="ov" id="home">
    <h1 id="title">LIQUID POUR</h1>
    <p class="sub" id="homeSub">Тапни кубик: он растекается жидкостью и стекает в приёмник.<br>
      Жидкость идёт в <b>передний стакан своего цвета</b>. Чужой цвет остаётся в баке<br>
      и заполняет его. Бак переполнен, проиграл. Заполни все стаканы!</p>
    <div id="path"></div>
  </div>
  <div class="ov hidden" id="win">
    <h1>LEVEL DONE!</h1>
    <button class="btn" id="btnNext">Next level</button>
    <button class="btn sec" id="btnWinHome">Home</button>
  </div>
  <div class="ov hidden" id="lose">
    <h1>OVERFLOW!</h1>
    <p class="sub" id="loseSub">Бак переполнен чужой жидкостью.</p>
    <button class="btn" id="btnRetryOv">Retry</button>
    <button class="btn sec" id="btnLoseHome">Home</button>
  </div>
</div>

<script>
/* ================= Liquid Pour proto v4 (из v3 make_v4.py: бак-контейнер с ёмкостью, слои жидкости, % заполнения) =================
   Наклонный бак с кубиками песка. Тап: кубик рассыпается,
   песок стекает в горловину -> приёмник -> чашки-очереди.
   Чужой цвет копится в баке (cap кубиков = 100%), переполнение = LOSE.
   ======================================================== */
const MODE='liquid';                     // 'sand' | 'liquid'
const LW=396, LH=650, GP=2;
const TANK={x:16,y:6,w:364,h:368,r:36};
const IN={x:30,y:20,w:336,h:342};
const GW=IN.w/GP|0, GH=IN.h/GP|0;        // 112 x 114
const NECK={cx:198,hw:9};   // узкая горловина: жидкость собирается лужей
const COLR={x:34,y:382,w:328,h:80,r:40}; // бак-приёмник (овал); заполняется чужой жидкостью
const CUPS={x:38,y:478,colw:80,frontH:46,rowH:24,gap:5,panelY:472};
const ROT=40*Math.PI/180, RC=Math.cos(ROT), RS=Math.sin(ROT);
const RATE=2.6;                          // заполнение чашки, ед/с
const PAL=[
  {n:'orange',a:'#f5901f',b:'#b8620a',l:'#ffb954'},
  {n:'yellow',a:'#f9c930',b:'#c08f0e',l:'#ffe27a'},
  {n:'blue',  a:'#3ec5f6',b:'#1a86b8',l:'#93e4ff'},
  {n:'green', a:'#55d43b',b:'#2f961e',l:'#a0f088'},
  {n:'pink',  a:'#ff7fd8',b:'#c2459f',l:'#ffb7ec'},
  {n:'brown', a:'#95603b',b:'#5e351b',l:'#bf8d69'},
  {n:'red',   a:'#e84d5a',b:'#a52a36',l:'#ff8f98'},
];
// rows: '.' пусто, '0'-'6' цвет кубика, 'X' бомба (счётчики в bombs по порядку чтения);
// hid: '#' скрытый кубик ('?'); cap: мест ожидания в приёмнике
const LEVELS=[
 {name:'Warm-up', cap:4, seed:7,      // бак на 4 кубика (25% каждый)
  rows:['012','120','201'],
  hid: ['...','...','...'], bombs:[]},
 {name:'Hidden', cap:4, seed:13,
  rows:['.012','2301','1230','30.2'],
  hid: ['.#..','..#.','#...','...#'], bombs:[]},
 {name:'Bombs', cap:4, seed:42,       // 24 кубика, 6 цветов, 2 бомбы
  rows:['..012.','.3451.','X20345','15X201','.43520','..1.4.'],
  hid: ['..##..','.#....','..##..','#...##','.#...#','..#.#.'], bombs:[3,3]},
 {name:'Deep', cap:4, seed:43,        // 35 кубиков, 7 цветов, 3 бомбы
  rows:['.01234.','5601X25','3X41530','6250164','143X602','.05231.'],
  hid: ['.##.#..','...#.#.','..#..##','#...###','....##.','..#.#..'], bombs:[3,3,3]},
 {name:'Spike', cap:3, seed:81,       // бак всего на 3 кубика (33% каждый)
  rows:['.60123.','25X4016','4130X52','0364215','5X21360','.13504.'],
  hid: ['.#.#...','#....#.','#..#..#','..#..#.','#..##.#','...###.'], bombs:[3,3,3]},
];

/* ---------- состояние ---------- */
let L, level=0, cubes=[], bombs=[], cups=[], cupsTotal=0, cupsDone=0;
let arrived=new Float64Array(7), unitsIF=new Float64Array(7), grainsIF=new Int32Array(7), pool=[0,0,0,0,0,0,0];
let grid, mv, mask, exitCol, shapeSet, CS=40, cx=198, cy=150, Wb=3, Hb=3, yB=160, yF=210;
let tankVis=new Float64Array(7); // визуальный уровень чужой жидкости в баке по цветам (тянется к pool)
let drops=[], streams=[], confetti=[], popAnims=[], colOff=[0,0,0,0], shakeT=0, badTap=null;
let playing=false, winFlag=false, loseFlag=false, winAt=0, tick=0, stall=0, speed=1, stamp=1;
let botKind=null, botPlan=null, botTimer=0, lastTime=performance.now();
let cav; // offscreen canvas для отрисовки полости

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const idx=(x,y)=>y*GW+x;

/* ---------- геометрия ---------- */
function toLocal(px,py){const dx=px-cx,dy=py-cy;return [(dx*RC+dy*RS)/CS+(Wb-1)/2, (-dx*RS+dy*RC)/CS+(Hb-1)/2];}
function cellCenter(i,j){const lx=(i-(Wb-1)/2)*CS, ly=(j-(Hb-1)/2)*CS;return [cx+lx*RC-ly*RS, cy+lx*RS+ly*RC];}
function inCells(px,py){const [lx,ly]=toLocal(px,py);const i=Math.round(lx),j=Math.round(ly);
  if(!shapeSet.has(i+','+j))return false;const pad=0.5+1.6/CS;return Math.abs(lx-i)<=pad&&Math.abs(ly-j)<=pad;}
function funnelX(py){ // левая стенка канала на высоте py (правая симметрична)
  if(py<yF)return IN.x; const t=(py-yF)/(IN.y+IN.h-yF); return IN.x+(NECK.cx-NECK.hw-IN.x)*t;}
function inFunnel(px,py){if(py<yB)return false;const xl=funnelX(py);return px>=xl&&px<=2*NECK.cx-xl;}

function buildMask(){
  mask=new Int8Array(GW*GH); exitCol=new Uint8Array(GW);
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const px=IN.x+(gx+.5)*GP, py=IN.y+(gy+.5)*GP;
    mask[idx(gx,gy)]=(inCells(px,py)||inFunnel(px,py))?0:1;
  }
  for(let gx=0;gx<GW;gx++){const px=IN.x+(gx+.5)*GP; exitCol[gx]=(Math.abs(px-NECK.cx)<NECK.hw&&!mask[idx(gx,GH-1)])?1:0;}
  // полость на offscreen (векторно)
  cav=document.createElement('canvas');cav.width=LW*2;cav.height=LH*2;const c=cav.getContext('2d');c.scale(2,2);
  c.fillStyle='#d9ecff';
  c.beginPath();c.moveTo(IN.x,yB);c.lineTo(IN.x+IN.w,yB);c.lineTo(IN.x+IN.w,yF);
  c.lineTo(NECK.cx+NECK.hw,IN.y+IN.h+30);c.lineTo(NECK.cx-NECK.hw,IN.y+IN.h+30);c.lineTo(IN.x,yF);c.closePath();c.fill();
  for(const key of shapeSet){const [i,j]=key.split(',').map(Number);const [x,y]=cellCenter(i,j);
    c.save();c.translate(x,y);c.rotate(ROT);rr(c,-CS/2-1.6,-CS/2-1.6,CS+3.2,CS+3.2,3);c.fill();c.restore();}
}

/* ---------- уровень ---------- */
function buildLevel(n){
  L=LEVELS[n]; level=n; document.getElementById('lvlLab').textContent='Level '+(n+1);
  Hb=L.rows.length; Wb=Math.max(...L.rows.map(r=>r.length));
  cubes=[];bombs=[];shapeSet=new Set();let bi=0;
  L.rows.forEach((r,j)=>[...r].forEach((ch,i)=>{ if(ch==='.')return; shapeSet.add(i+','+j);
    if(ch==='X'){bombs.push({i,j,n:L.bombs[bi++],alive:true});return;}
    cubes.push({i,j,col:+ch,hidden:L.hid[j][i]==='#',alive:true,id:cubes.length}); }));
  CS=Math.min(46, Math.floor(318/(Wb*RC+Hb*RS)), Math.floor(282/(Wb*RS+Hb*RC)));
  const bh=(Wb*RS+Hb*RC)*CS; cx=198; cy=IN.y+8+bh/2; yB=cy; yF=Math.min(yB+50, IN.y+IN.h-150);
  buildMask();
  grid=new Int8Array(GW*GH); mv=new Uint8Array(GW*GH);
  arrived.fill(0);unitsIF.fill(0);grainsIF.fill(0);
  drops=[];streams=[];confetti=[];popAnims=[];colOff=[0,0,0,0];tankVis.fill(0);
  winFlag=false;loseFlag=false;winAt=0;tick=0;stall=0;cupsDone=0;botPlan=null;
  // очереди чашек: реверс-генерация из случайного допустимого порядка тапов
  const rng=mulberry32(L.seed);
  const st=logicState(); const seq=[];
  let guard=0;
  while(st.alive.some(a=>a)&&guard++<500){
    let cands=[];for(let k=0;k<cubes.length;k++)if(st.alive[k]&&!st.hidden[k])cands.push(k);
    if(!cands.length){for(let k=0;k<cubes.length;k++)if(st.alive[k]){st.hidden[k]=false;cands.push(k);break;}}
    logicPop(st,cands[Math.floor(rng()*cands.length)],seq);
  }
  cups=[[],[],[],[]];
  for(const col of seq){const min=Math.min(...cups.map(q=>q.length));let k;
    if(rng()<.55){const ms=[0,1,2,3].filter(q=>cups[q].length===min);k=ms[Math.floor(rng()*ms.length)];}
    else k=Math.floor(rng()*4); cups[k].push({col,fill:0,as:false,done:false});}
  pool=[0,0,0,0,0,0,0];
  cupsTotal=seq.length;
  console.assert(cupsTotal===cubes.length,'economy');
  playing=true;
}

/* ---------- логика (общая для игры, генератора, солвера, бота) ---------- */
function logicState(){return {alive:cubes.map(c=>c.alive),hidden:cubes.map(c=>c.hidden),bn:bombs.map(b=>b.alive?b.n:0)};}
function logicPop(st,k,out){ // out: массив цветов (или индексов при out.idx)
  if(!st.alive[k])return; st.alive[k]=false; st.hidden[k]=false; out.push(out.idx?k:cubes[k].col);
  const c=cubes[k];
  for(let q=0;q<cubes.length;q++){const o=cubes[q];if(st.alive[q]&&st.hidden[q]&&Math.abs(o.i-c.i)+Math.abs(o.j-c.j)===1)st.hidden[q]=false;}
  for(let b=0;b<bombs.length;b++){const B=bombs[b];if(st.bn[b]<=0)continue;
    if(Math.max(Math.abs(B.i-c.i),Math.abs(B.j-c.j))===1){st.bn[b]--; if(st.bn[b]<=0){
      for(let q=0;q<cubes.length;q++){const o=cubes[q];if(st.alive[q]&&Math.max(Math.abs(o.i-B.i),Math.abs(o.j-B.j))===1)logicPop(st,q,out);}}}}
}
// МОДЕЛЬ ОЧЕРЕДЕЙ: единица песка при тапе бронирует ЛЕВУЮ свободную (небронированную)
// чашку своего цвета; иначе ждёт в pool. Освободившаяся «виртуальная передняя» чашка
// сразу берёт из pool. Ожидание = сумма pool. Одна модель для игры, солвера и бота.
function qmodel(){return {vf:cups.map(q=>q.filter(c=>c.as).length),pool:pool.slice()};}
function qcols(){return cups.map(q=>q.map(c=>c.col));}
function assignUnit(m,cols,c){ // m: {vf,pool}; true если забронировано
  for(let k=0;k<cols.length;k++){const q=cols[k];if(m.vf[k]<q.length&&q[m.vf[k]]===c){advance(m,cols,k);return true;}}
  m.pool[c]++;return false;}
function advance(m,cols,k){m.vf[k]++;const q=cols[k];
  while(m.vf[k]<q.length&&m.pool[q[m.vf[k]]]>=1){m.pool[q[m.vf[k]]]--;m.vf[k]++;}}
function poolSum(m){return m.pool.reduce((a,b)=>a+b,0);}
function logicalWaiting(){return pool.reduce((a,b)=>a+b,0);}
function tankFull(){return logicalWaiting()>=L.cap;}
function noSafeMove(){ // нет видимого кубика, после которого бак не переполнится
  const cols=qcols();
  for(let k=0;k<cubes.length;k++){const c=cubes[k];if(!c.alive||c.hidden)continue;
    const st=logicState();const out=[];out.idx=true;logicPop(st,k,out);
    const m=qmodel();for(const q of out)assignUnit(m,cols,cubes[q].col);
    if(poolSum(m)<=L.cap)return false;}
  return true;}
// солвер-оракул (знает скрытые цвета): последовательность индексов кубиков с ожиданием <= cap
function solve(maxNodes=150000){
  const cap=L.cap; const memo=new Set(); let nodes=0; const cols=qcols(); const total=cols.reduce((a,q)=>a+q.length,0);
  function key(st,m){return st.alive.map(a=>a?1:0).join('')+'|'+st.bn.join(',')+'|'+m.vf.join(',')+'|'+m.pool.join(',');}
  function dfs(st,m){
    if(m.vf.reduce((a,b)=>a+b,0)>=total)return [];
    if(++nodes>maxNodes)return null;
    const k0=key(st,m);if(memo.has(k0))return null;
    const fronts=new Set();cols.forEach((q,k)=>{if(m.vf[k]<q.length)fronts.add(q[m.vf[k]]);});
    const cands=[];for(let k=0;k<cubes.length;k++)if(st.alive[k]&&!st.hidden[k])cands.push(k);
    cands.sort((a,b)=>(fronts.has(cubes[b].col)?1:0)-(fronts.has(cubes[a].col)?1:0));
    for(const k of cands){
      const ns={alive:st.alive.slice(),hidden:st.hidden.slice(),bn:st.bn.slice()};const out=[];out.idx=true;logicPop(ns,k,out);
      const nm={vf:m.vf.slice(),pool:m.pool.slice()};for(const q of out)assignUnit(nm,cols,cubes[q].col);
      if(poolSum(nm)>cap)continue;
      const r=dfs(ns,nm);if(r)return [k,...r];
    }
    memo.add(k0);return null;
  }
  return dfs(logicState(),qmodel());
}
// слепой бот (не знает скрытые цвета): жадный выбор с одношаговой оценкой
function naivePick(){const cols=qcols();const m=qmodel();const fronts=new Set();cols.forEach((q,k)=>{if(m.vf[k]<q.length)fronts.add(q[m.vf[k]]);});
  const vis=cubes.filter(c=>c.alive&&!c.hidden);if(!vis.length)return -1;const good=vis.filter(c=>fronts.has(c.col));
  const pick=(good.length?good:vis)[Math.floor(Math.random()*(good.length?good:vis).length)];return pick.id;}
function blindPick(rnd=Math.random){
  const cols=qcols();let best=null,bs=-1e9;
  for(let k=0;k<cubes.length;k++){const c=cubes[k];if(!c.alive||c.hidden)continue;
    const st=logicState();const out=[];out.idx=true;logicPop(st,k,out);
    const m=qmodel();let unknown=0,reveals=0;
    for(const q of out){if(cubes[q].hidden&&q!==k)unknown++;else assignUnit(m,cols,cubes[q].col);}
    for(let q=0;q<cubes.length;q++)if(cubes[q].hidden&&!st.hidden[q]&&st.alive[q])reveals++;
    const w=poolSum(m)+unknown;
    let depth=99;cols.forEach((qq,kk)=>{for(let d=m.vf[kk];d<qq.length;d++)if(qq[d]===c.col){depth=Math.min(depth,d-m.vf[kk]);break;}});
    let s=-w*10+reveals*1.5-Math.min(depth,6)*1.2+rnd()*0.5;
    if(w>L.cap)s-=1000;
    if(s>bs){bs=s;best=k;}
  }
  return best;
}

// логическая симуляция без физики: winrate наивного/жадного бота на текущем уровне
function simBots(kind,runs){let wins=0;const cols=qcols();const total=cubes.length;
  for(let r=0;r<runs;r++){const st=logicState();const m={vf:[0,0,0,0],pool:[0,0,0,0,0,0,0]};let lose=false,guard=0;
    while(m.vf.reduce((a,b)=>a+b,0)<total&&!lose&&guard++<200){
      const vis=[];for(let k=0;k<cubes.length;k++)if(st.alive[k]&&!st.hidden[k])vis.push(k);
      if(!vis.length)break;
      let pick;
      if(kind==='naive'){const fronts=new Set();cols.forEach((q,k)=>{if(m.vf[k]<q.length)fronts.add(q[m.vf[k]]);});
        const good=vis.filter(k=>fronts.has(cubes[k].col));const arr=good.length?good:vis;pick=arr[Math.floor(Math.random()*arr.length)];}
      else{let bs=-1e9;for(const k of vis){const ns={alive:st.alive.slice(),hidden:st.hidden.slice(),bn:st.bn.slice()};const out=[];out.idx=true;logicPop(ns,k,out);
          const nm={vf:m.vf.slice(),pool:m.pool.slice()};let unknown=0,reveals=0;for(const q of out){if(st.hidden[q]&&q!==k)unknown++;else assignUnit(nm,cols,cubes[q].col);}
          for(let q=0;q<cubes.length;q++)if(st.hidden[q]&&!ns.hidden[q]&&ns.alive[q])reveals++;
          const w=poolSum(nm)+unknown;let depth=99;cols.forEach((qq,kk)=>{for(let d=m.vf[kk];d<qq.length;d++)if(qq[d]===cubes[k].col){depth=Math.min(depth,d-m.vf[kk]);break;}});
          let sc=-w*10+reveals*1.5-Math.min(depth,6)*1.2+Math.random()*.5;if(w>L.cap)sc-=1000;if(sc>bs){bs=sc;pick=k;}}}
      const out=[];out.idx=true;logicPop(st,pick,out);for(const q of out)assignUnit(m,cols,cubes[q].col);
      if(poolSum(m)>L.cap)lose=true;}
    if(!lose&&m.vf.reduce((a,b)=>a+b,0)>=total)wins++;}
  return wins/runs;}

/* ---------- физика песка/жидкости ---------- */
function spawnGrains(c){
  const [x0,y0]=cellCenter(c.i,c.j);let G=0;const col=c.col+1;
  const gx0=Math.floor((x0-IN.x-CS)/GP), gy0=Math.floor((y0-IN.y-CS)/GP);
  for(let gy=gy0;gy<gy0+2*CS/GP+2;gy++)for(let gx=gx0;gx<gx0+2*CS/GP+2;gx++){
    if(gx<0||gy<0||gx>=GW||gy>=GH)continue;const i=idx(gx,gy);if(mask[i])continue;
    const px=IN.x+(gx+.5)*GP,py=IN.y+(gy+.5)*GP;const [lx,ly]=toLocal(px,py);
    if(Math.abs(lx-c.i)<=0.5-3/CS&&Math.abs(ly-c.j)<=0.5-3/CS){if(grid[i]>0){if(grainsIF[grid[i]-1]>0)grainsIF[grid[i]-1]--;}grid[i]=col;G++;}
  }
  unitsIF[c.col]+=1;grainsIF[c.col]+=G;
}
function arrive(v,gx){const c=v-1;
  if(grainsIF[c]>0){const u=unitsIF[c]/grainsIF[c];arrived[c]+=u;unitsIF[c]-=u;grainsIF[c]--;}
  if(drops.length<420)drops.push({x:IN.x+(gx+.5)*GP+(Math.random()-.5)*4,y:IN.y+IN.h-2,vy:60+Math.random()*60,vx:(Math.random()-.5)*20,col:c});
}
function simStep(dirFlag){
  stamp=(stamp%250)+1;let moved=0;const liquid=MODE==='liquid';
  for(let y=GH-1;y>=0;y--){
    const xs=dirFlag?0:GW-1, xe=dirFlag?GW:-1, dx=dirFlag?1:-1;
    for(let x=xs;x!==xe;x+=dx){
      const i=idx(x,y);const v=grid[i];if(v<=0||mv[i]===stamp)continue;
      if(y===GH-1){if(exitCol[x]){grid[i]=0;arrive(v,x);moved++;}continue;}
      const b=i+GW;
      if(!mask[b]&&grid[b]===0){grid[b]=v;grid[i]=0;mv[b]=stamp;moved++;continue;}
      const d=Math.random()<.5?-1:1;
      for(let t=0;t<2;t++){const nx=x+(t?-d:d);if(nx<0||nx>=GW)continue;const n=b+(t?-d:d);
        if(!mask[n]&&grid[n]===0&&(liquid||(!mask[i+(t?-d:d)]&&grid[i+(t?-d:d)]===0))){grid[n]=v;grid[i]=0;mv[n]=stamp;moved++;t=9;}}
      if(grid[i]!==v)continue;
      // боковое стекание к горловине
      if(liquid||Math.random()<.22){
        const toNeck=Math.sign(NECK.cx-(IN.x+(x+.5)*GP))||d;const s=Math.random()<(liquid?.55:.8)?toNeck:-toNeck;
        let best=-1;for(let st=1;st<=(liquid?2:1);st++){const nx=x+s*st;if(nx<0||nx>=GW)break;const n=i+s*st;if(mask[n]||grid[n]!==0)break;best=n;}
        if(best>=0){grid[best]=v;grid[i]=0;mv[best]=stamp;moved++;}
      }
    }
  }
  return moved;
}
function grainsTotal(){let s=0;for(let c=0;c<7;c++)s+=grainsIF[c];return s;}

/* ---------- игровой тик ---------- */
function update(dt){
  if(!playing)return; tick++;
  let moved=0;const sub=MODE==='liquid'?2:3;/* v3: жидкость в 2 раза медленнее */for(let s=0;s<sub;s++)moved+=simStep((tick*sub+s)&1);
  for(let c=0;c<7;c++)if(grainsIF[c]<=0&&unitsIF[c]>1e-9){arrived[c]+=unitsIF[c];unitsIF[c]=0;grainsIF[c]=0;} // сироты без зёрен
  if(grainsTotal()>0){ if(moved===0){if(++stall>40){ // страховка: застрявшие зёрна досыпаем в приёмник
      for(let i=0;i<grid.length;i++)if(grid[i]>0){arrive(grid[i],i%GW);grid[i]=0;} stall=0;}} else stall=0; }
  // капли из горловины в приёмник
  for(let k=drops.length-1;k>=0;k--){const p=drops[k];p.vy+=900*dt;p.y+=p.vy*dt;p.x+=p.vx*dt;if(p.y>COLR.y+COLR.h-10)drops.splice(k,1);}
  // заполнение: физически передняя чашка колонки, если забронирована
  for(let k=0;k<4;k++){const cup=cups[k].find(c=>!c.done);if(!cup||!cup.as)continue;const c=cup.col;
    if(arrived[c]<=1e-9)continue;const d=Math.min(arrived[c],1-cup.fill,RATE*dt);
    cup.fill+=d;arrived[c]-=d;
    if(Math.random()<.9&&streams.length<200)streams.push({x:CUPS.x+k*CUPS.colw+CUPS.colw/2+(Math.random()-.5)*10,y:COLR.y+COLR.h-6,vy:120,col:c});
    if(cup.fill>=1-1e-6){cup.done=true;cupsDone++;popAnims.push({k,col:c,t:0});colOff[k]=CUPS.frontH+CUPS.gap;}
  }
  for(let k=0;k<4;k++)colOff[k]=Math.max(0,colOff[k]-dt*220);
  for(let k=streams.length-1;k>=0;k--){const p=streams[k];p.y+=p.vy*dt;p.vy+=500*dt;if(p.y>CUPS.y+8)streams.splice(k,1);}
  for(let k=popAnims.length-1;k>=0;k--){popAnims[k].t+=dt;if(popAnims[k].t>.4)popAnims.splice(k,1);}
  if(shakeT>0)shakeT-=dt;
  // конфетти
  for(let k=confetti.length-1;k>=0;k--){const p=confetti[k];p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.life-=dt;if(p.life<=0)confetti.splice(k,1);}
  // lose / win
  if(!winFlag&&!loseFlag&&logicalWaiting()>L.cap){loseFlag=true;playing=false;botKind=null;document.getElementById('loseSub').textContent='Бак переполнен чужой жидкостью.';showOv('lose');}
  if(!winFlag&&!loseFlag&&cupsDone<cupsTotal&&tankFull()&&noSafeMove()&&cubes.some(c=>c.alive&&!c.hidden)){loseFlag=true;playing=false;botKind=null;document.getElementById('loseSub').textContent='Бак полон на 100%, а подходящего цвета нет: лить больше некуда.';showOv('lose');}
  for(let c=0;c<7;c++){const t=pool[c];tankVis[c]+=(t-tankVis[c])*Math.min(1,dt*7);if(Math.abs(t-tankVis[c])<.005)tankVis[c]=t;}
  if(!winFlag&&!loseFlag&&cupsDone>=cupsTotal){winFlag=true;winAt=performance.now();burstConfetti();}
  if(winFlag&&playing&&performance.now()-winAt>1000){playing=false;botKind=null;showOv('win');}
  // бот
  if(botKind&&playing&&!winFlag){botTimer-=dt;if(botTimer<=0){botTimer=.25;botStep();}}
}
function popCube(k){const c=cubes[k];if(!c.alive)return;
  const st=logicState();const out=[];out.idx=true;logicPop(st,k,out);
  const cols=qcols();const m=qmodel();
  for(const q of out){const o=cubes[q];o.alive=false;o.hidden=false;spawnGrains(o);assignUnit(m,cols,o.col);}
  pool=m.pool;cups.forEach((q,k)=>q.forEach((cup,d)=>{cup.as=d<m.vf[k];}));
  cubes.forEach((o,q)=>{o.hidden=st.hidden[q];});
  bombs.forEach((b,q)=>{b.n=st.bn[q];if(b.n<=0)b.alive=false;});
  if(!cubes.some(o=>o.alive&&!o.hidden)){const h=cubes.find(o=>o.alive);if(h)h.hidden=false;}
}
function tapAt(px,py){if(!playing||winFlag||loseFlag)return false;
  const [lx,ly]=toLocal(px,py);const i=Math.round(lx),j=Math.round(ly);
  if(Math.abs(lx-i)>.5||Math.abs(ly-j)>.5)return false;
  const k=cubes.findIndex(c=>c.alive&&c.i===i&&c.j===j);if(k<0)return false;
  if(cubes[k].hidden){badTap={k,t:.3};return false;}
  popCube(k);return true;
}
function botStep(){
  if(botKind==='oracle'){
    if(!botPlan||!botPlan.length){botPlan=solve();if(!botPlan){console.log('oracle: no solution');botKind=null;return;}}
    const k=botPlan[0];if(!cubes[k].alive||cubes[k].hidden){botPlan=null;return;}
    botPlan.shift();popCube(k);
  }else{ // blind: ждём, пока песок дойдёт и чашки примут своё
    if(grainsTotal()>0)return;
    if(cups.some(q=>q.some(c=>c.as&&!c.done)))return;
    const k=botKind==='naive'?naivePick():blindPick();if(k==null||k<0){botKind=null;return;}popCube(k);
  }
}

function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

  else{ctx.imageSmoothingEnabled=true;ctx.drawImage(low,IN.x,IN.y,IN.w,IN.h);ctx.globalAlpha=.6;ctx.drawImage(low,IN.x,IN.y,IN.w,IN.h);ctx.globalAlpha=1;}

  drawTank();
  // % заполнения бака чужой жидкостью; цвет: белый пусто, жёлтый частично, оранжевый с пульсом 100%, красный переполнение

  const pcol=(loseFlag&&wq>cap)?'#ff3b4a':full?'#ff8a3d':wq>0?'#ffd34d':'#ffffff';
  const pulse=full?1+Math.sin(performance.now()/120)*.06:1;

function drawGrid(){const d=img.data;
  for(let i=0,p=0;i<grid.length;i++,p+=4){const v=grid[i];
    if(v<=0){d[p+3]=0;continue;}
    const rgb=PALRGB[v-1];const sh=MODE==='sand'?(NOISE[i]<64?1:(NOISE[i]>232?2:0)):0;const c=rgb[sh];
    d[p]=c[0];d[p+1]=c[1];d[p+2]=c[2];d[p+3]=255;}
  lctx.putImageData(img,0,0);}
function drawCube(c){const [x,y]=cellCenter(c.i,c.j);const s=CS-7,r=Math.max(6,CS*.2);
  let wob=0;if(badTap&&badTap.k===c.id){wob=Math.sin(badTap.t*50)*3;badTap.t-=1/60;if(badTap.t<=0)badTap=null;}
  const pal=c.hidden?{a:'#c9c6dc',b:'#8c88a8',l:'#ecebf5'}:PAL[c.col];
  ctx.save();ctx.translate(x+wob,y+4);ctx.rotate(ROT);ctx.fillStyle=pal.b;rr(ctx,-s/2,-s/2,s,s,r);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(x+wob,y);ctx.rotate(ROT);
  ctx.fillStyle='#2a2650';rr(ctx,-s/2-2,-s/2-2,s+4,s+4,r+2);ctx.fill();
  const g=ctx.createLinearGradient(0,-s/2,0,s/2);g.addColorStop(0,pal.l);g.addColorStop(.35,pal.a);g.addColorStop(1,pal.a);
  ctx.fillStyle=g;rr(ctx,-s/2,-s/2,s,s,r);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-s*.2,-s*.25,s*.18,s*.11,-.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.ellipse(s*.22,s*.22,s*.09,s*.06,-.5,0,Math.PI*2);ctx.fill();

// бак: чужая жидкость слоями по цветам, высота = доля ёмкости

  const b=document.createElement('button');b.className='node'+(i===LEVELS.length-1?' spike':'');b.textContent=i+1;b.title=l.name;b.onclick=()=>start(i);path.appendChild(b);});
document.getElementById('btnHome').onclick=()=>{playing=false;botKind=null;hideOvs();showOv('home');};
document.getElementById('btnRetry').onclick=()=>start(level);
document.getElementById('btnRetryOv').onclick=()=>start(level);
document.getElementById('btnNext').onclick=()=>start(Math.min(LEVELS.length-1,level+1));
document.getElementById('btnWinHome').onclick=document.getElementById('btnLoseHome').onclick=()=>{hideOvs();showOv('home');};
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const px=(e.clientX-r.left-offX)/scale,py=(e.clientY-r.top-offY)/scale;tapAt(px,py);});

/* ---------- цикл: setInterval с реальным dt (headless-friendly) ---------- */
resize();
setInterval(()=>{const now=performance.now();let dt=Math.min(.12,(now-lastTime)/1000);lastTime=now;
  for(let s=0;s<speed;s++)update(dt);draw();},16);
buildLevel(0);playing=false; // фон под home
showOv('home');

window.__game={start,get L(){return L},get cubes(){return cubes},get cups(){return cups},get arrived(){return arrived},
  tap:(i,j)=>{const k=cubes.findIndex(c=>c.alive&&c.i===i&&c.j===j);if(k<0||cubes[k].hidden)return false;popCube(k);return true;},
  pop:popCube,solve,blindPick,naivePick,simBots,bot:(kind)=>{botKind=kind;botPlan=null;botTimer=0;},setSpeed:(s)=>{speed=s;},
  snap:()=>({level:level+1,cubesLeft:cubes.filter(c=>c.alive).length,cupsDone,cupsTotal,pool:pool.slice(),wait:logicalWaiting(),grains:grainsTotal(),win:winFlag,lose:loseFlag,playing}),
  state:()=>({cubes:cubes.map(c=>({i:c.i,j:c.j,col:c.col,hidden:c.hidden,alive:c.alive})),bombs:bombs.map(b=>({i:b.i,j:b.j,n:b.n,alive:b.alive})),cups:cups.map(q=>q.filter(c=>!c.done).map(c=>c.col))}),
  cellCenter, LEVELS};
</script>
