<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Словоблок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@600;700;800&family=Rubik:wght@700;800&display=swap">
<style>
/* Layout: один экран телефона без прокрутки — шапка, кленовая полоска кроссворда, инструменты, деревянная доска и лоток; всё остальное во всплывающих снизу листах */
:root{
  --table:#1C140E; --table-hi:#3B291C; --walnut-lo:#2C1B10;
  --maple:#EDD2A0; --burn:#3A2113; --ink:#F3E4C8; --ink-dim:#B39B7B;
  --amber:#F0A845; --leaf:#A9C487; --leaf-lo:#7E9A5E; --danger:#E27A5E;
  --display:'Unbounded','Rubik',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tile:'Rubik','Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;overflow:hidden;background:var(--table);background-image:radial-gradient(130% 55% at 50% -6%,var(--table-hi) 0%,var(--table) 66%);color:var(--ink);font-family:var(--body);
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;touch-action:manipulation}
#app{height:100%;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:8px 6px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
.hud{flex:none;display:flex;align-items:center;gap:8px}
.ic{width:38px;height:38px;flex:none;border-radius:12px;border:0;cursor:pointer;display:grid;place-items:center;position:relative;
  background:linear-gradient(#70482C,#4C301C);box-shadow:inset 0 1px 0 rgba(255,228,186,.28),0 3px 0 var(--walnut-lo);color:var(--ink)}
.ic:active,.tool:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,228,186,.28),0 1px 0 var(--walnut-lo)}
.ic svg{width:19px;height:19px}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.lvl{flex:1;min-width:0}
.lvl small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-weight:800}
.lvl b{display:block;font:600 15px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{text-align:right;flex:none}
.stat small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-weight:800}
.stat b{font:700 16px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat.low b{color:var(--danger)}
.band{flex:none;border-radius:16px;padding:8px 10px 6px;color:var(--burn);cursor:pointer;
  background:repeating-linear-gradient(94deg,rgba(120,72,30,.06) 0 2px,transparent 2px 9px),linear-gradient(170deg,#F1D8AA,#DDB781);
  box-shadow:inset 0 1px 0 rgba(255,250,235,.7),0 4px 0 #8C6239,0 12px 24px rgba(0,0,0,.4)}
.band-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.band-head h2{margin:0;font:700 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.band-head .prog{font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;opacity:.7}
.cw-grid{--cs:24px;display:grid;gap:3px;grid-auto-rows:var(--cs);justify-content:center}
.cw-void{width:var(--cs);height:var(--cs)}
.cw-cell{width:var(--cs);height:var(--cs);border-radius:calc(var(--cs)*.22);position:relative;display:grid;place-items:center;
  background:rgba(70,40,20,.16);box-shadow:inset 0 2px 3px rgba(60,30,10,.28),inset 0 -1px 0 rgba(255,245,225,.5);transition:background .25s,box-shadow .25s}
.cw-cell .no{position:absolute;top:1px;left:2px;font:800 calc(var(--cs)*.28)/1 var(--body);opacity:.55}
.cw-grid.tiny .no{display:none}
.cw-cell .ch{font:800 calc(var(--cs)*.58)/1 var(--tile);opacity:0}
.cw-cell.on{background:linear-gradient(#FFF3DA,#F0D6A6);box-shadow:0 2px 0 #B48650,0 3px 5px rgba(60,30,10,.22)}
.cw-cell.on .ch{opacity:1}
.cw-cell.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
.cw-cell.done{background:linear-gradient(#EAF2D2,#C9DCA2);box-shadow:0 2px 0 var(--leaf-lo)}
.cw-cell.done .ch{color:#2F4318}
.cw-cell.wave{animation:wave .5s ease}
.cw-cell.sel{outline:2px solid #C06A1F;outline-offset:1px}
@keyframes pop{0%{transform:scale(.55)}100%{transform:scale(1)}}
@keyframes wave{0%,100%{transform:translateY(0)}40%{transform:translateY(-4px) scale(1.1)}}
.strip{display:flex;align-items:center;gap:6px;margin-top:6px;border-top:1px dashed rgba(58,33,19,.25);padding-top:6px}
.strip .nav{width:30px;height:30px;flex:none;border:0;border-radius:9px;background:rgba(70,40,20,.13);color:var(--burn);font-weight:800;font-size:18px;line-height:1;cursor:pointer}
.strip .cur{flex:1;min-width:0;border:0;background:none;text-align:left;font-weight:800;font-size:13.5px;line-height:1.25;color:var(--burn);padding:2px;cursor:pointer;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.strip .cur em{font-style:normal;color:#9A4E14;margin-right:4px}
.strip .cur .tap{opacity:.5;font-weight:700}
.tools{flex:none;display:flex;gap:8px}
.tool{flex:1;height:42px;border:0;border-radius:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;position:relative;
  background:linear-gradient(#5E3D25,#432916);box-shadow:inset 0 1px 0 rgba(255,228,186,.22),0 3px 0 var(--walnut-lo);color:var(--ink);font-weight:800;font-size:12.5px}
.tool svg{width:20px;height:20px;flex:none}
.tool .n{min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--amber);color:var(--burn);font:800 12px/20px var(--tile);text-align:center;box-sizing:border-box}
.tool[data-empty="1"]{opacity:.5}
.tool[data-empty="1"] .n{background:rgba(255,228,186,.2);color:var(--ink)}
.tool.on{background:linear-gradient(#F3B55A,#D98C2B);color:var(--burn);box-shadow:inset 0 1px 0 rgba(255,250,220,.5),0 3px 0 #8A5617,0 0 18px rgba(240,168,69,.55)}
.tool.pulse{animation:tpulse .9s ease 3}
@keyframes tpulse{50%{transform:scale(1.07);box-shadow:0 0 0 3px rgba(240,168,69,.6),0 3px 0 var(--walnut-lo)}}
.ring{position:relative;width:24px;height:24px;flex:none}
.ring svg{position:absolute;inset:0;width:24px;height:24px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 11px var(--tile)}
.play{flex:1;min-height:0;position:relative;display:flex;justify-content:center;align-items:flex-start}
#cv{display:block;touch-action:none}
.toast{position:absolute;left:50%;top:10%;transform:translate(-50%,0);width:min(90%,360px);box-sizing:border-box;text-align:center;pointer-events:none;
  background:rgba(28,18,11,.92);border:1px solid rgba(240,168,69,.35);border-radius:14px;padding:11px 14px;box-shadow:0 12px 30px rgba(0,0,0,.5);
  font-weight:700;font-size:13.5px;line-height:1.4;transition:opacity .3s,transform .3s;opacity:0}
.toast.show{opacity:1;transform:translate(-50%,-6px)}
.toast b{display:block;font:700 15px/1.3 var(--display);color:var(--amber);margin-bottom:3px;letter-spacing:.04em}
.toast .rew{display:block;margin-top:6px;color:var(--leaf);font-weight:800;font-size:12.5px}
#fly{position:fixed;inset:0;pointer-events:none;z-index:40}
.fl{position:fixed;display:grid;place-items:center;border-radius:22%;color:var(--burn);font-family:var(--tile);font-weight:800;
  background:linear-gradient(#FFF3DA,#EBCB93);box-shadow:0 3px 0 #A97A45,0 8px 18px rgba(0,0,0,.4);will-change:transform}
.sw{position:fixed;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(14,9,5,.62);animation:fade .2s ease}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,480px);max-height:90%;overflow:auto;box-sizing:border-box;
  border-radius:24px 24px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));color:var(--burn);
  background:repeating-linear-gradient(94deg,rgba(120,72,30,.06) 0 2px,transparent 2px 9px),linear-gradient(170deg,#F3DCB0,#DDB781);
  box-shadow:inset 0 1px 0 rgba(255,250,235,.7),0 -10px 40px rgba(0,0,0,.5);animation:up .32s cubic-bezier(.2,1.15,.4,1)}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:rgba(58,33,19,.25);margin:0 auto 12px}
.sheet.shake{animation:shake .4s}
@keyframes up{from{transform:translate(-50%,100%)}}
@keyframes fade{from{opacity:0}}
@keyframes shake{0%,100%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% - 9px))}40%{transform:translateX(calc(-50% + 8px))}60%{transform:translateX(calc(-50% - 5px))}80%{transform:translateX(calc(-50% + 3px))}}
.eyebrow{margin:0 0 4px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.62}
.sheet h3{margin:0 0 12px;font:700 19px/1.25 var(--display);text-wrap:balance}
.sheet p{margin:0 0 12px;font-size:14.5px;line-height:1.45;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;border:0;cursor:pointer;border-radius:13px;padding:13px 14px;font:700 13.5px var(--display);
  background:linear-gradient(#6E462A,#4A2E1B);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,228,186,.28),0 4px 0 var(--walnut-lo)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,228,186,.28),0 1px 0 var(--walnut-lo)}
.btn.alt{background:rgba(70,40,20,.13);color:var(--burn);box-shadow:inset 0 0 0 2px rgba(70,40,20,.22)}
.btn[disabled]{opacity:.45}
.slots{display:flex;gap:5px;justify-content:center;margin:4px 0 6px}
.slot{flex:0 1 42px;aspect-ratio:.88;max-width:42px;border-radius:10px;display:grid;place-items:center;font:800 21px var(--tile);background:rgba(70,40,20,.14);box-shadow:inset 0 2px 3px rgba(60,30,10,.25)}
.slot.k{background:linear-gradient(#FFF3DA,#F0D6A6);box-shadow:0 2px 0 #B48650}
.slot.t{background:#FFF7E6;color:#9A4E14;box-shadow:0 2px 0 #C9A06A;animation:pop .2s}
.slot.next{box-shadow:inset 0 0 0 2px #C06A1F}
.gmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 2px;font-size:12.5px;font-weight:800;opacity:.75}
.lnk{border:0;background:rgba(70,40,20,.13);border-radius:10px;padding:7px 10px;font-weight:800;font-size:12.5px;color:var(--burn);cursor:pointer;display:flex;align-items:center;gap:5px}
.lnk[disabled]{opacity:.4}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.kr{display:flex;gap:4px;justify-content:center}
.key{flex:1;max-width:40px;height:48px;border:0;padding:0;border-radius:9px;font:800 18px var(--tile);color:var(--burn);cursor:pointer;
  background:linear-gradient(#FFF4DE,#EBCB93);box-shadow:0 3px 0 #A97A45}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #A97A45}
.key.wide{max-width:none;flex:1.7;background:linear-gradient(#6E462A,#4A2E1B);color:var(--ink);box-shadow:0 3px 0 var(--walnut-lo);font-size:14px}
.key.wide svg{width:20px;height:20px}
.clue{width:100%;display:grid;grid-template-columns:26px 16px 1fr auto;gap:6px;align-items:baseline;text-align:left;border:0;background:none;cursor:pointer;padding:9px 6px;border-radius:9px;color:var(--burn);font-size:14.5px;line-height:1.3;font-weight:700}
.clue:active{background:rgba(70,40,20,.1)}
.clue .n{font:700 13px var(--display);color:#9A4E14}
.clue .len{font-size:12px;opacity:.6;font-weight:800}
.clue.done .t{color:#4F6B2C;text-decoration:line-through;text-decoration-color:rgba(79,107,44,.4)}
.big-cw{margin:2px 0 12px}
.planks{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.plank{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;border:0;cursor:pointer;border-radius:14px;padding:9px 12px;
  background:linear-gradient(#6E462A,#4A2E1B);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,228,186,.25),0 4px 0 var(--walnut-lo)}
.plank:active{transform:translateY(2px)}
.plank .num{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:700 18px var(--display);color:var(--burn);background:linear-gradient(#FFF3DA,#EBCB93);box-shadow:0 2px 0 #A97A45}
.plank.ok .num{background:linear-gradient(#EAF2D2,#C9DCA2);color:#2F4318;box-shadow:0 2px 0 var(--leaf-lo)}
.plank.inf .num{background:linear-gradient(#F6C77A,#D98C2B)}
.plank b{display:block;font:600 14.5px/1.2 var(--display)}
.plank small{display:block;font-size:12.5px;line-height:1.35;color:var(--ink-dim);margin-top:2px;font-weight:700}
.plank .best{font:700 12.5px var(--display);color:var(--amber);font-variant-numeric:tabular-nums;text-align:right}
.words{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.wcard{border-radius:13px;padding:10px 12px;background:rgba(255,250,238,.55);box-shadow:inset 0 0 0 1px rgba(70,40,20,.12)}
.wcard b{font:800 15px var(--tile);letter-spacing:.1em;color:#2F4318}
.wcard i{display:block;font-style:normal;font-size:12.5px;font-weight:800;opacity:.6;margin:1px 0 4px}
.wcard span{display:block;font-size:13.5px;line-height:1.4;font-weight:600}
.wcard.lock b{color:rgba(58,33,19,.35);letter-spacing:.3em}
.score-line{display:flex;gap:18px;margin:0 0 14px}
.score-line small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.score-line b{font:700 24px var(--display);font-variant-numeric:tabular-nums}
.steps{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.step i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:700 16px var(--display);font-style:normal;background:linear-gradient(#FFF3DA,#EBCB93);box-shadow:0 2px 0 #A97A45}
.step b{display:block;font:700 14px/1.3 var(--display);margin-bottom:2px}
.step span{font-size:13.5px;line-height:1.4;font-weight:600}
.seg{font:700 12px var(--display);letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin:14px 0 8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="app">
  <header class="hud">
    <button class="ic" id="bMenu" aria-label="Уровни"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></button>
    <div class="lvl"><small id="lvlNo">Уровень 1</small><b id="lvlName">Опушка</b></div>
    <div class="stat" id="movesBox" hidden><small>Ходы</small><b id="moves">0</b></div>
    <div class="stat"><small>Очки</small><b id="score">0</b></div>
    <button class="ic" id="bDict" aria-label="Словарь"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 11.5h5"/></svg></button>
    <button class="ic" id="bSound" aria-label="Звук"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path id="sndWave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path id="sndOff" d="M16 9l5 6M21 9l-5 6" style="display:none"/></svg></button>
  </header>

  <section class="band" id="band" aria-label="Кроссворд">
    <div class="band-head"><h2>Кроссворд</h2><span class="prog" id="cwProg">0/0</span></div>
    <div class="cw-grid" id="cw"></div>
    <div class="strip">
      <button class="nav" id="sPrev" aria-label="Предыдущий вопрос">‹</button>
      <button class="cur" id="sCur"></button>
      <button class="nav" id="sNext" aria-label="Следующий вопрос">›</button>
    </div>
  </section>

  <div class="tools">
    <button class="tool" id="tHammer" aria-label="Молоток: разбить один брусок"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 6.5l4 4"/><path d="M11 9l-7.5 7.5a1.8 1.8 0 0 0 2.5 2.5L13.5 11.5"/><path d="M12.5 3.5l8 8-2.5 2.5-8-8z" fill="currentColor"/></svg><span>Молоток</span><span class="n" id="nHammer">1</span></button>
    <button class="tool" id="tReroll" aria-label="Новые бруски в лоток"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg><span>Бруски</span><span class="n" id="nReroll">1</span></button>
    <button class="tool" id="tHint" aria-label="Лампа: открыть букву"><span class="ring"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="rgba(255,228,186,.2)" stroke-width="3"/><circle id="ringArc" cx="12" cy="12" r="10" fill="none" stroke="#F0A845" stroke-width="3" stroke-linecap="round" stroke-dasharray="62.83" stroke-dashoffset="62.83"/></svg><b id="nHint">2</b></span><span>Буква</span></button>
  </div>

  <section class="play" id="play">
    <canvas id="cv" aria-label="Игровая доска"></canvas>
    <div class="toast" id="toast"></div>
  </section>
</div>
<div id="fly"></div>
<div class="sw" id="sw" hidden><div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog"></div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
let DPR=Math.min(window.devicePixelRatio||1,2.5);

/* ---------- utils ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function shade(h,a){const[r,g,b]=hexRgb(h);const f=a<0?0:255,k=Math.abs(a);return`rgb(${Math.round(r+(f-r)*k)},${Math.round(g+(f-g)*k)},${Math.round(b+(f-b)*k)})`}
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const ri=n=>Math.floor(Math.random()*n);
const pick=a=>a[ri(a.length)];
const ease=k=>1-Math.pow(1-k,3);
function plural(n,a,b,c){const m=n%100,d=n%10;if(m>10&&m<20)return c;if(d===1)return a;if(d>=2&&d<=4)return b;return c}
const store={get(){try{return JSON.parse(localStorage.getItem('slovoblok-v2'))||{}}catch(e){return{}}},set(v){try{localStorage.setItem('slovoblok-v2',JSON.stringify(v))}catch(e){}},
  patch(f){const s=this.get();f(s);this.set(s);return s}};

/* ---------- words ---------- */
const LEVELS=[
 {name:'Опушка',tag:'Знакомство с игрой',info:'Ставь бруски и собирай полные ряды. Буквы из разбитых брусков сами летят в кроссворд.',
  pool:'easy',chance:.62,given:1,seed:11,words:[

/* ---------- crossword ---------- */
function initCW(words,seed,given){
  const res=buildCrossword(words,seed,11);
  cw={rows:res.rows,cols:res.cols,cells:new Map(),words:[]};
  res.words.forEach(w=>{const o={word:w.word,clue:w.clue,fact:w.fact,dir:w.dir,keys:[],done:false,num:0};
    for(let i=0;i<w.word.length;i++){const r=w.r+(w.dir?i:0),c=w.c+(w.dir?0:i),k=r+','+c;
      if(!cw.cells.has(k))cw.cells.set(k,{key:k,r,c,letter:w.word[i],revealed:false,reserved:false,words:[],el:null});
      cw.cells.get(k).words.push(o);o.keys.push(k)}
    cw.words.push(o)});
  const starts=[...new Set(cw.words.map(w=>w.keys[0]))].map(k=>cw.cells.get(k)).sort((a,b)=>a.r-b.r||a.c-b.c);
  starts.forEach((c,i)=>{c.num=i+1});cw.words.forEach(w=>w.num=cw.cells.get(w.keys[0]).num);
  cw.words.sort((a,b)=>a.num-b.num||a.dir-b.dir);
  const rng=mulberry(seed+5);const all=[...cw.cells.values()];
  for(let i=0;i<given&&i<all.length-2;i++){const pool=all.filter(c=>!c.revealed);pool[Math.floor(rng()*pool.length)].revealed=true}
  renderCW()}
function gridHTML(cs,withEl){

  for(let r=0;r<cw.rows;r++)for(let c=0;c<cw.cols;c++){const k=r+','+c,cl=cw.cells.get(k),d=document.createElement('div');
    if(!cl){d.className='cw-void';g.appendChild(d);continue}
    const done=cl.words.some(w=>w.done);
    d.className='cw-cell'+(cl.revealed?' on':'')+(done&&cl.revealed?' done':'');d.dataset.key=k;
    d.innerHTML=(cl.num?`<span class="no">${cl.num}</span>`:'')+`<span class="ch">${cl.letter}</span>`;
    if(withEl)cl.el=d;g.appendChild(d)}

function bandCS(){const bw=$('#band').clientWidth-20;const maxH=Math.max(64,Math.min(128,innerHeight*.15));

  if(!open.length){el.innerHTML='Все слова разгаданы';return}
  stripIdx=(stripIdx%open.length+open.length)%open.length;const w=open[stripIdx];
  el.innerHTML=`<em>${w.num}${w.dir?'↓':'→'}</em>${w.clue} <span class="tap">· ${w.word.length} ${plural(w.word.length,'буква','буквы','букв')}</span>`}
function stripWord(){const open=cw.words.filter(w=>!w.done);return open.length?open[(stripIdx%open.length+open.length)%open.length]:null}

$('#band').addEventListener('click',e=>{ensureAudio();
  if(e.target.closest('#sPrev')){stripIdx--;renderStrip();tock(900,.08,.04);return}

/* ---------- letters economy ---------- */
function neededLetters(){
  const cnt={};for(const c of cw.cells.values())if(!c.revealed&&!c.reserved)cnt[c.letter]=(cnt[c.letter]||0)+1;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=board[r][c];if(t&&t.letter)cnt[t.letter]=(cnt[t.letter]||0)-1}
  for(const p of tray)if(p)for(const k in p.letters)cnt[p.letters[k]]=(cnt[p.letters[k]]||0)-1;
  const out=[];for(const l in cnt)for(let i=0;i<cnt[l];i++)out.push(l);return out}
function revealCell(k,opts={}){
  const c=cw.cells.get(k);if(!c||c.revealed)return;c.revealed=true;c.reserved=false;
  if(c.el){c.el.classList.add('on','pop');setTimeout(()=>c.el&&c.el.classList.remove('pop'),450)}
  chime(note(revealCount++%15,523),.2);addScore(opts.bonus??25);
  c.words.forEach(w=>{if(!w.done&&w.keys.every(x=>cw.cells.get(x).revealed))completeWord(w)});
  renderStrip();if(sheetKind==='cw')openCrossword(true);if(sheetKind==='guess'&&guessRender)guessRender()}
function completeWord(w){
  w.done=true;w.keys.forEach((k,i)=>{const el=cw.cells.get(k).el;if(el)setTimeout(()=>{el.classList.add('done','wave');setTimeout(()=>el.classList.remove('wave'),520)},i*70)});
  setTimeout(()=>arp(392),120);haptic(20);addScore(100);
  store.patch(s=>{s.learned=s.learned||{};s.learned[w.word]=1});
  const k=cw.words.filter(x=>x.done).length;let rew;
  if(k%2===1){hammers++;rew='Награда: молоток'}else{rerolls++;rew='Награда: новые бруски'}
  updateTools();
  showToast(`<b>${w.word}</b>${w.fact}<span class="rew">+100 · ${rew}</span>`,4200);
  updateProg();
  if(cw.words.every(x=>x.done)){
    if(L.endless){setTimeout(nextRound,1600)}
    else if(over!=='done'){over='done';drag=null;hammerMode=false;setTimeout(win,1600)}}}

/* ---------- pieces ---------- */
function makePiece(){
  const sh=SHAPES[pickShape(L.pool)];const p={cells:sh.cells,w:sh.w,h:sh.h,color:pick(STAINS),v:ri(4),letters:{},spawn:now,ret:null};
  const need=neededLetters();
  if(need.length&&Math.random()<L.chance){const i=ri(p.cells.length);p.letters[i]=pick(need);
    if(p.cells.length>=4&&Math.random()<.35){need.splice(need.indexOf(p.letters[i]),1);if(need.length){let j=ri(p.cells.length);if(j===i)j=(j+1)%p.cells.length;p.letters[j]=pick(need)}}}
  return p}
function fits(p,r0,c0){for(const[dr,dc]of p.cells){const r=r0+dr,c=c0+dc;if(r<0||c<0||r>=N||c>=N||board[r][c])return false}return true}

function deal(){
  for(let a=0;a<14;a++){tray=[null,null,null];for(let i=0;i<3;i++)tray[i]=makePiece();if(tray.some(anyFit))break}
  if(!tray.some(anyFit)){const s=SHAPES.o1;tray[0]={cells:s.cells,w:1,h:1,color:pick(STAINS),v:0,letters:{},spawn:now,ret:null}}
  tray.forEach((p,i)=>{p.spawn=now+i*80});swish(.05,.3)}

/* ---------- placement & lines ---------- */
function place(p,r0,c0){
  p.cells.forEach(([dr,dc],i)=>{board[r0+dr][c0+dc]={color:p.color,v:(p.v+i)%4,letter:p.letters[i]||null,hp:1,pop:now+i*24}});
  p.cells.forEach((_,i)=>tock(300+Math.random()*60,.42,.1,i*.024));haptic(10);
  moves++;if(L.moves)movesLeft--;
  addScore(p.cells.length);tray[tray.indexOf(p)]=null;
  resolveLines(r0+p.h/2,c0+p.w/2);
  if(tray.every(x=>!x))setTimeout(()=>{if(!over)deal()},260);
  updateHud();setTimeout(checkEnd,900)}
function fullLines(extra){
  const filled=(r,c)=>board[r][c]||(extra&&extra.has(r+','+c));const rows=[],cols=[];
  for(let r=0;r<N;r++){let f=true;for(let c=0;c<N;c++)if(!filled(r,c)){f=false;break}if(f)rows.push(r)}
  for(let c=0;c<N;c++){let f=true;for(let r=0;r<N;r++)if(!filled(r,c)){f=false;break}if(f)cols.push(c)}
  return{rows,cols}}
function resolveLines(cr,cc){
  const{rows,cols}=fullLines();const lines=rows.length+cols.length;
  if(!lines){streak=0;return}
  streak++;
  const set=new Map();rows.forEach(r=>{for(let c=0;c<N;c++)set.set(r+','+c,[r,c])});cols.forEach(c=>{for(let r=0;r<N;r++)set.set(r+','+c,[r,c])});
  const list=[...set.values()].map(([r,c])=>({r,c,d:Math.hypot(r+.5-cr,c+.5-cc)})).sort((a,b)=>a.d-b.d);
  let broken=0;
  list.forEach(({r,c,d},i)=>{const t=board[r][c];const delay=60+d*48;
    if(t.hp>1){t.hp=1;t.strap=now+delay;events.push({t:now+delay,fn:()=>{const[x,y]=cellXY(r,c);chips(x+cell/2,y+cell/2,'#7C8288',7,true);tock(1500,.12,.06)}})}
    else{broken++;board[r][c]=null;fading.push({r,c,t,t0:now+delay});
      events.push({t:now+delay,fn:()=>{const[x,y]=cellXY(r,c);chips(x+cell/2,y+cell/2,t.color,9);tock(note(i,330),.32,.12);if(t.letter)releaseLetter(t.letter,x+cell/2,y+cell/2)}})}});
  swish(.07+lines*.02,.35);haptic(lines>1?[12,40,18]:16);if(lines>1)shake(3+lines,320);

  const label=lines>=3?'Щепки летят!':lines===2?'Дважды!':streak>=2?`Серия ×${streak}`:'';
  if(label)floaters.push({x,y:y-cell*.75,t0:now+120,text:label,size:cell*.4,color:'#F0A845'});

  if(gained)floaters.push({x:W*.82,y:trayTop-cell*.2,t0:now+300,text:'+ буква',size:cell*.34,color:'#A9C487'});

function releaseLetter(letter,x,y){

/* ---------- levels ---------- */
function startLevel(i){

  fading=[];particles=[];floaters=[];events=[];drag=null;stripIdx=0;selWord=null;$('#fly').innerHTML='';
  board=Array.from({length:N},()=>Array(N).fill(null));tray=[null,null,null];

    const fx=Math.min(W-10,Math.max(10,f.x));ctx.lineWidth=4;ctx.strokeStyle='rgba(40,22,10,.85)';ctx.strokeText(f.text,fx,f.y-k*cell*1.1);ctx.fillStyle=f.color;ctx.fillText(f.text,fx,f.y-k*cell*1.1);ctx.restore()}}
function drawPiece(p,cx,cy,s,a){const ts=cell*s;const ox=cx-p.w*ts/2,oy=cy-p.h*ts/2;
  p.cells.forEach(([dr,dc],i)=>drawTile(ox+dc*ts,oy+dr*ts,ts,{color:p.color,v:(p.v+i)%4,letter:p.letters[i]||null,hp:1},{alpha:a}))}

/* ---------- boot ---------- */
new ResizeObserver(()=>{if(L)layout()}).observe($('#play'));
addEventListener('resize',()=>{DPR=Math.min(window.devicePixelRatio||1,2.5);if(cw)renderCW()});
const saved=store.get();
if(saved.muted){muted=true;$('#sndWave').style.display='none';$('#sndOff').style.display=''}
startLevel(typeof saved.last==='number'&&saved.last<=5?saved.last:0);
requestAnimationFrame(frame);
if(!saved.seenHow)setTimeout(showHow,400);
if(document.fonts&&document.fonts.load){Promise.all(['800 20px Rubik','700 20px Unbounded'].map(f=>document.fonts.load(f))).then(()=>sprites.clear()).catch(()=>{})}
})();
