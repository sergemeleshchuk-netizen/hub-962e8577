<script>
/* ================= Water Blocks proto v9 =================
   v9 «Waffle Sprites»: САМ арт дизайнера Waffle Sort (PSD grid_6x7_polina):
   поддон 6×7 склеен из кусков platform_base.png, блоки = спрайты вафель
   (9 форм: S1 H2 V2 L3 G3 J3 R3 O4 T4), перекраска по оттенку под цвет
   жидкости, карманы найдены на спрайтах автоматически (kit.json), сироп
   наливается в карманы снизу вверх. Ассеты: waffle-kit/.
   v8 «Waffle Tray»: UI из дизайна Waffle Sort — розовая скатерть,
   деревянный поддон с плиткой, блоки = цветные ВАФЛИ с карманами
   2×2 на клетку; жидкость (сироп) наливается в карманы снизу вверх,
   карман за карманом. Механика и уровни = v7.
   v7: ПЛОТНЫЙ лоток — 62-81% клеток заняты (v6: 29-55%), первый
   блок базы зажат и требует клоцки-перетасовки; бот получил
   настоящий клоцки-солвер (BFS по совместным положениям блоков).
   Ядро v6: лава-лампа, шары висят и садятся по мере слива базы.
   ========================================================= */
/*CORE-BEGIN*/
const BC=6, BR=7, CELL=52;
const LW=396, LH=672;
const BX=42, BY=258;
const TX=30, TTOP=14, TBOT=214;      // бак 336x200
const TWpx=336;
const S=2450;                        // px² на 1 клетку объёма
const RATE=0.66;                     // слив на колонку, клеток/с (+20%)
const FLOOR=TBOT-3;

const PAL=[
  {n:'pink', a:'#fc6e8e', b:'#fa2051', d:'#c3042f', f:'#fdc7d4', hls:[0.9624,0.7118,0.9597]},
  {n:'violet', a:'#9a65cc', b:'#793ab4', d:'#55297f', f:'#c09edf', hls:[0.7532,0.6,0.5098]},
  {n:'turquoise', a:'#17c69c', b:'#129b7a', d:'#0c6d56', f:'#2ee6ba', hls:[0.4599,0.4353,0.7913]},
  {n:'yellow', a:'#f5c700', b:'#bf9b00', d:'#866d00', f:'#ffd833', hls:[0.1354,0.4804,1.0]},
  {n:'blue', a:'#2f8cff', b:'#0069eb', d:'#004aa6', f:'#7ab6ff', hls:[0.5918,0.5922,1.0]},
];
const SH={
  S1:[[0,0]], H2:[[0,0],[1,0]], V2:[[0,0],[0,1]],
  H3:[[0,0],[1,0],[2,0]], V3:[[0,0],[0,1],[0,2]], L3:[[0,0],[0,1],[1,1]],
  O4:[[0,0],[1,0],[0,1],[1,1]], T4:[[0,0],[1,0],[2,0],[1,1]],
  L4:[[0,0],[0,1],[0,2],[1,2]], S4:[[1,0],[2,0],[0,1],[1,1]],
  // уголки из 3 клеток — 4 ориентации спрайтов дизайнера (pink_1, red, yellow_2)
  G3:[[0,0],[1,0],[0,1]], J3:[[1,0],[0,1],[1,1]], R3:[[0,0],[1,0],[1,1]],
};
// уровень: base=цвет базы; c=[цвет,форма,x,y] (базовые блоки — внизу лотка);
// balls=[[цвет,объём,x-доля ширины]]
const LEVELS=[
 // L1 — интро: занято 28/42, база 14 кл.
 {t:75, base:0,
  c:[[1,'O4',0,1],[2,'T4',3,1],[0,'S1',2,2],[0,'V2',5,2],[0,'H2',0,3],[0,'H2',3,3],[0,'G3',0,4],[1,'H2',2,4],[2,'V2',5,4],[0,'H2',2,5],[0,'H2',0,6],[1,'H2',3,6]],
  balls:[[1,4,0.15,0.75],[2,3,0.85,0.55],[1,4,0.5,0.35],[2,3,0.3,0.15]]},
 // L2: занято 32/42, база 11 кл.
 {t:90, base:4,
  c:[[3,'T4',1,0],[0,'H2',0,1],[0,'H2',3,1],[4,'H2',0,2],[4,'H2',3,2],[3,'V2',5,2],[3,'H2',0,3],[0,'H2',3,3],[4,'S1',0,4],[3,'H2',2,4],[4,'H2',4,4],[0,'H2',0,5],[4,'H2',3,5],[0,'H2',0,6],[4,'H2',3,6],[3,'S1',5,6]],
  balls:[[3,4,0.15,0.8],[0,5,0.85,0.6],[3,4,0.5,0.45],[0,5,0.3,0.3],[3,3,0.7,0.12]]},
 // L3 — 4 цвета: занято 30/42, база 9 кл.
 {t:110, base:2,
  c:[[0,'O4',0,1],[1,'T4',2,1],[2,'S1',2,2],[3,'S1',4,2],[3,'V2',5,2],[2,'H2',0,3],[2,'H2',3,3],[0,'V2',0,4],[1,'H2',2,4],[0,'L3',4,4],[2,'H2',1,5],[3,'H2',0,6],[2,'H2',3,6],[1,'S1',5,6]],
  balls:[[0,5,0.2,0.8],[1,4,0.8,0.65],[3,5,0.5,0.5],[0,4,0.9,0.35],[1,3,0.1,0.2]]},
 // L4 — замок в углу: занято 33/42, база 10 кл.
 {t:130, base:3,
  c:[[4,'O4',0,1],[0,'T4',2,1],[1,'V2',5,1],[3,'S1',2,2],[3,'S1',4,2],[3,'H2',0,3],[3,'H2',3,3],[2,'V2',5,3],[4,'S1',0,4],[2,'H2',2,4],[4,'S1',4,4],[3,'H2',2,5],[1,'S1',4,5],[4,'H2',0,5],[3,'H2',0,6],[1,'S1',5,0],[0,'H2',3,6],[2,'S1',5,6]],
  balls:[[4,4,0.15,0.8],[0,3,0.85,0.65],[1,4,0.5,0.5],[2,5,0.3,0.38],[4,4,0.7,0.25],[0,3,0.92,0.1]]},
 // L5 — спайк, 5 цветов: занято 34/42, база 7 кл.
 {t:180, base:4,
  c:[[3,'O4',0,1],[0,'T4',2,1],[1,'V2',5,1],[4,'S1',2,2],[4,'S1',4,2],[2,'H2',0,3],[4,'H2',2,3],[3,'H2',4,3],[1,'S1',0,4],[2,'H2',2,4],[4,'S1',4,4],[4,'H2',0,5],[1,'H2',3,5],[3,'S1',5,5],[3,'H2',0,6],[2,'S1',0,0],[0,'S1',5,0],[2,'H2',3,6],[0,'S1',5,6]],
  balls:[[3,5,0.15,0.82],[0,3,0.85,0.68],[2,4,0.5,0.55],[1,5,0.3,0.42],[3,4,0.7,0.3],[2,3,0.92,0.18],[0,3,0.08,0.06]]},
];

let balls, baseVol, base0, baseCol, conts, tick=0, timeLeft=0, level=0, playing=false;
let winFlag=false, loseFlag=false, winAt=0, clearedAll=false;
let ffMult=1, botOn=false, botCd=0, botHist=[];
let drainCols=[], drops=[];

const r2v=v=>Math.sqrt(v*S/Math.PI);
function mkCont(col,shape,x,y,id){
  const cells=SH[shape].map(c=>c.slice());
  return {id,col,cells,x,y,shape,cap:cells.length,fill:0,
          state:'idle',popT:0,lastGain:-9};
}
function occMap(skip){
  const m=new Array(BC*BR).fill(0);
  for(const c of conts){ if(c.state!=='idle'||c===skip) continue;
    for(const[dx,dy]of c.cells) m[(c.y+dy)*BC+(c.x+dx)]=1; }
  return m;
}
function canPlace(c,nx,ny,m){
  for(const[dx,dy]of c.cells){ const x=nx+dx,y=ny+dy;
    if(x<0||x>=BC||y<0||y>=BR) return false; if(m[y*BC+x]) return false; }
  return true;
}
function buildLevel(n){
  const L=LEVELS[n];
  conts=L.c.map((d,i)=>mkCont(d[0],d[1],d[2],d[3],i));
  baseCol=L.base;
  balls=L.balls.map((b,i)=>({col:b[0],vol:b[1],x:TX+b[2]*TWpx,
    a:b[3],y:0,ph:i*1.7}));
  baseVol=conts.filter(c=>c.col===baseCol).reduce((a,c)=>a+c.cap,0);
  base0=baseVol;
  for(const b of balls){ const r=r2v(b.vol); b.y=Math.max(TTOP+r+4, FLOOR-r/b.a); }
  // реверс-экономика: объём шаров цвета = ёмкость его блоков
  const q=new Array(PAL.length).fill(0);
  for(const c of conts) q[c.col]+=c.cap;
  q[baseCol]-=baseVol;
  for(const b of balls) q[b.col]-=b.vol;
  console.assert(q.every(v=>Math.abs(v)<1e-6),'economy mismatch L'+(n+1),q);
  tick=0; timeLeft=L.t; winFlag=loseFlag=false; winAt=0; clearedAll=false;
  botHist=[]; drainCols=[]; drops=[];
}
function receiver(col){
  let best=null;
  for(const c of conts){ if(c.state!=='idle'||c.y!==0) continue;
    for(const[dx,dy]of c.cells){ if(c.x+dx!==col) continue;
      if(!best||dy<best.row) best={c,row:dy}; }
  }
  return best&&best.c;
}
const colCx=col=>BX+(col+.5)*CELL;
function floorBall(col){ // покоящийся шар, накрывающий колонку
  const cx=colCx(col);
  let best=null;
  for(const b of balls){ const r=r2v(b.vol);
    if(!landed(b)) continue;                     // ещё висит в базе
    const cover=Math.max(r*.85, CELL*.5);        // маленький шар всегда накрывает ближайшую колонку
    if(Math.abs(b.x-cx)<cover&&(!best||Math.abs(b.x-cx)<Math.abs(best.x-cx))) best=b;
  }
  return best;
}
function ballsPhys(dt){
  const ratio=base0>0?baseVol/base0:0;
  for(const b of balls){ const r=r2v(b.vol);
    const tY=Math.max(TTOP+r+4, Math.min(FLOOR-r, FLOOR-(r/b.a)*ratio));
    b.y+=(tY-b.y)*Math.min(1,5*dt);                 // плавное погружение, без рывков
  }
  for(let it=0;it<4;it++){
    for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
      const a=balls[i],b=balls[j],ra=r2v(a.vol),rb=r2v(b.vol);
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,min=(ra+rb)*.92;
      if(d<min){ const push=(min-d)/2,nx=dx/d,ny=dy/d;
        const wa=rb*rb/(ra*ra+rb*rb), wb=1-wa;
        a.x-=nx*push*2*wa; a.y-=ny*push*2*wa;
        b.x+=nx*push*2*wb; b.y+=ny*push*2*wb;
      }
    }
    for(const b of balls){ const r=r2v(b.vol);
      if(b.y>FLOOR-r) b.y=FLOOR-r;
      b.x=Math.max(TX+r,Math.min(TX+TWpx-r,b.x));
    }
  }
}
const landed=b=>base0<=0||baseVol/base0<=b.a+1e-9; // шар доступен, когда база слита до его порога
function drain(dt){
  drainCols=[];
  for(let col=0;col<BC;col++){
    const c=receiver(col);
    if(!c||c.fill>=c.cap) continue;
    const fb=floorBall(col);
    let src=null;
    if(fb){ if(fb.col===c.col) src=fb; }
    else if(baseVol>1e-4&&baseCol===c.col) src='base';
    if(!src) continue;
    const avail=src==='base'?baseVol:src.vol;
    const amt=Math.min(RATE*dt, avail, c.cap-c.fill);
    if(amt<=0) continue;
    c.fill+=amt; c.lastGain=tick/60;
    if(src==='base') baseVol-=amt; else src.vol-=amt;
    drainCols.push({col,c});
    if(c.fill>=c.cap-1e-6&&c.state==='idle'){ c.fill=c.cap; c.state='clear'; c.popT=0; }
  }
  balls=balls.filter(b=>b.vol>1e-4);
}
function step(dt){
  tick++;
  ballsPhys(dt);
  drain(dt);
  for(const c of conts){ if(c.state==='clear'){ c.popT+=dt; if(c.popT>.45) c.state='gone'; } }
  if(!winFlag&&!loseFlag){
    timeLeft-=dt;
    if(conts.every(c=>c.state==='gone')&&!clearedAll){ clearedAll=true; winAt=tick/60+1; }
    if(clearedAll&&tick/60>=winAt){ winFlag=true; playing=false; showWin(); }
    else if(timeLeft<=0){ timeLeft=0; loseFlag=true; playing=false; showLose(); }
  }
}
/*CORE-END*/
/* ================= ассеты (waffle-kit, спрайты дизайнера) ================= */
const KIT={"tray":{"file":"tray_6x7.png","w":909,"h":1121,"ox":116,"oy":150,"cx":113.142857,"cy":115.5},"sprites":{"S1":{"file":"yellow_1.png","cells":[[0,0]],"dx":3,"dy":-12,"w":112,"h":122,"pockets":[[16,66,34,36],[61,66,34,36],[16,18,34,36],[61,18,34,36]],"hls":[0.1354,0.4804,1.0]},"H2":{"file":"violet_2.png","cells":[[0,0],[1,0]],"dx":0,"dy":-7,"w":221,"h":125,"pockets":[[17,66,36,36],[66,66,36,36],[115,66,35,36],[164,66,35,36],[17,18,36,35],[66,18,36,35],[114,18,36,35],[163,18,36,35]],"hls":[0.7532,0.602,0.5149]},"V2":{"file":"blue_1.png","cells":[[0,0],[0,1]],"dx":0,"dy":-7,"w":121,"h":238,"pockets":[[15,173,38,39],[66,173,38,39],[15,120,37,39],[66,120,38,39],[15,67,38,39],[66,67,38,39],[66,15,38,39],[15,15,37,38]],"hls":[0.5918,0.5922,1.0]},"L3":{"file":"pink_2.png","cells":[[0,0],[0,1],[1,1]],"dx":-7,"dy":-4,"w":219,"h":231,"pockets":[[16,169,37,40],[66,169,37,40],[117,169,36,40],[167,169,35,40],[117,118,36,39],[167,118,35,39],[16,116,37,40],[66,116,37,39],[16,66,37,40],[66,66,37,40],[66,14,37,39],[16,14,37,38]],"hls":[0.9624,0.7118,0.9597]},"G3":{"file":"pink_1.png","cells":[[0,0],[1,0],[0,1]],"dx":-3,"dy":-11,"w":229,"h":243,"pockets":[[17,184,38,39],[69,184,39,39],[17,129,38,40],[69,129,39,40],[69,75,39,40],[122,75,38,40],[17,75,38,39],[174,75,38,39],[17,20,38,40],[69,20,39,40],[122,20,38,40],[174,20,37,40]],"hls":[0.964,0.7,0.9608]},"J3":{"file":"red.png","cells":[[1,0],[0,1],[1,1]],"dx":1,"dy":0,"w":229,"h":227,"pockets":[[17,167,39,38],[69,167,38,38],[120,167,39,38],[173,167,38,38],[17,116,38,38],[69,116,38,38],[120,116,39,38],[172,116,39,38],[120,65,39,38],[172,65,39,38],[120,15,39,37],[172,15,39,37]],"hls":[0.0039,0.4647,0.7143]},"R3":{"file":"yellow_2.png","cells":[[0,0],[1,0],[1,1]],"dx":0,"dy":-2,"w":233,"h":233,"pockets":[[122,170,38,38],[174,170,38,38],[174,118,38,39],[122,118,38,38],[122,66,38,39],[174,67,39,38],[18,66,39,38],[70,66,39,38],[122,15,38,38],[174,15,39,38],[18,14,38,38],[70,14,39,38]],"hls":[0.1364,0.4863,1.0]},"O4":{"file":"turquoise_1.png","cells":[[0,0],[1,0],[0,1],[1,1]],"dx":0,"dy":-7,"w":233,"h":231,"pockets":[[19,170,37,37],[70,170,37,37],[121,170,38,37],[172,170,38,37],[19,119,37,37],[70,119,37,37],[121,119,37,37],[172,119,38,37],[19,68,37,38],[70,68,37,38],[121,68,38,38],[172,68,38,38],[19,18,37,37],[70,18,37,37],[121,18,38,37],[172,18,38,37]],"hls":[0.4599,0.4353,0.7913]},"T4":{"file":"turquoise_2.png","cells":[[0,0],[1,0],[2,0],[1,1]],"dx":0,"dy":-8,"w":337,"h":236,"pockets":[[122,173,38,38],[174,173,38,38],[174,121,38,39],[122,121,38,38],[122,70,38,38],[174,70,39,38],[18,69,39,38],[70,69,39,38],[225,69,39,38],[278,68,38,39],[122,18,38,38],[174,18,39,38],[226,18,38,38],[278,18,39,38],[18,17,38,38],[70,17,39,38]],"hls":[0.4599,0.4314,0.7982]}}};
const IMG={}; let imgsLeft=0;
function loadImg(f){ imgsLeft++; const im=new Image(); im.onload=()=>{imgsLeft--;}; im.src='waffle-kit/'+f; IMG[f]=im; return im; }
loadImg(KIT.tray.file); for(const k in KIT.sprites) loadImg(KIT.sprites[k].file);
// перекраска спрайта по оттенку: hue/sat/light пикселя переносятся с исходного цвета на целевой
const TINT={};
function tinted(shape,col){
  const key=shape+':'+col; if(TINT[key]) return TINT[key];
  const sp=KIT.sprites[shape], im=IMG[sp.file]; if(!im.complete||!im.naturalWidth) return null;
  const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
  const x=c.getContext('2d'); x.drawImage(im,0,0);
  const [sh,sl,ss]=sp.hls, [th,tl,ts]=PAL[col].hls;
  if(Math.abs(sh-th)>0.01||Math.abs(sl-tl)>0.08){
    const d=x.getImageData(0,0,c.width,c.height), p=d.data;
    for(let i=0;i<p.length;i+=4){ if(p[i+3]<8) continue;
      const r=p[i]/255,g=p[i+1]/255,b=p[i+2]/255;
      const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2; let h=0,sat=0;
      if(mx!==mn){ const dd=mx-mn; sat=l>.5?dd/(2-mx-mn):dd/(mx+mn);
        h=mx===r?((g-b)/dd+(g<b?6:0))/6:mx===g?((b-r)/dd+2)/6:((r-g)/dd+4)/6; }
      const nh=(h-sh+th+1)%1, nl=Math.max(0,Math.min(1,l*(tl/sl))), ns=Math.max(0,Math.min(1,sat*(ts/ss)));
      const q=nl<.5?nl*(1+ns):nl+ns-nl*ns, pp=2*nl-q;
      const f=t=>{ t=(t+1)%1; return t<1/6?pp+(q-pp)*6*t:t<.5?q:t<2/3?pp+(q-pp)*(2/3-t)*6:pp; };
      p[i]=f(nh+1/3)*255; p[i+1]=f(nh)*255; p[i+2]=f(nh-1/3)*255;
    }
    x.putImageData(d,0,0);
  }
  TINT[key]=c; return c;
}

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let scale=1, offX=0, offY=0;
function fit(){
  const st=document.getElementById('stage');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=st.clientWidth*dpr; cv.height=st.clientHeight*dpr;
  scale=Math.min(st.clientWidth/LW, st.clientHeight/LH);
  offX=(st.clientWidth-LW*scale)/2; offY=(st.clientHeight-LH*scale)/2;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
}

}

function drawBall(b,t){
  const r=r2v(b.vol), P=PAL[b.col];
  ctx.save();
  const bob=landed(b)?0:Math.sin(t*.9+b.ph*2)*2.5;
  ctx.translate(b.x,b.y+bob);
  ctx.scale(1,landed(b)?0.94:1);                  // сплюск только на дне
  ctx.beginPath();
  for(let a=0;a<=Math.PI*2+.01;a+=.22){
    const rad=r*(1+.05*Math.sin(3*a+b.ph+t*1.7)+.04*Math.sin(5*a-b.ph-t*2.3));
    const x=Math.cos(a)*rad, y=Math.sin(a)*rad;
    a===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
  const g=ctx.createRadialGradient(-r*.35,-r*.4,r*.15,0,0,r*1.05);
  g.addColorStop(0,P.f); g.addColorStop(.55,P.a); g.addColorStop(1,P.b);
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle=P.b; ctx.lineWidth=2; ctx.globalAlpha=.5; ctx.stroke();
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,.35)';          // блик
  ctx.beginPath(); ctx.ellipse(-r*.35,-r*.45,r*.22,r*.13,-.5,0,7); ctx.fill();
  ctx.restore();
}
function drawCloth(){ // розовая скатерть в клетку (как в дизайне Waffle Sort)
  const x0=-offX/scale, y0=-offY/scale, w=LW+2*offX/scale, h=LH+2*offY/scale, q=44;
  ctx.fillStyle='#f8d5dc'; ctx.fillRect(x0,y0,w,h);
  ctx.fillStyle='#f1b9c6';
  for(let y=Math.floor(y0/q)*q;y<y0+h;y+=q)for(let x=Math.floor(x0/q)*q;x<x0+w;x+=q)
    if(((x/q+y/q)&1)===0) ctx.fillRect(x,y,q,q);
  ctx.fillStyle='rgba(255,255,255,.28)';
  for(let y=Math.floor(y0/q)*q;y<y0+h;y+=q) ctx.fillRect(x0,y+q/2-1,w,2);
  for(let x=Math.floor(x0/q)*q;x<x0+w;x+=q) ctx.fillRect(x+q/2-1,y0,2,h);
}
function drawBoard(){ // поддон дизайнера: склейка 6×7 из platform_base.png
  const T=KIT.tray, im=IMG[T.file]; if(!im.complete||!im.naturalWidth) return;
  const kx=CELL/T.cx, ky=CELL/T.cy;          // масштаб: клетка арта (113×115.5) -> клетка поля
  ctx.drawImage(im, BX-T.ox*kx, BY-T.oy*ky, T.w*kx, T.h*ky);
}
function outlineOf(c){
  if(c._out) return c._out;
  const has=(x,y)=>c.cells.some(k=>k[0]===x&&k[1]===y);
  const edges=new Map();
  for(const[x,y]of c.cells){
    if(!has(x,y-1)) edges.set(x+','+y,[x+1,y]);
    if(!has(x+1,y)) edges.set((x+1)+','+y,[x+1,y+1]);
    if(!has(x,y+1)) edges.set((x+1)+','+(y+1),[x,y+1]);
    if(!has(x-1,y)) edges.set(x+','+(y+1),[x,y]);
  }
  const pts=[]; let key=edges.keys().next().value;
  const start=key;
  do{ const[sx,sy]=key.split(',').map(Number); const e=edges.get(key);
    pts.push([sx,sy]); key=e[0]+','+e[1];
  }while(key!==start&&pts.length<64);
  const out=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[(i+pts.length-1)%pts.length],b=pts[i],e=pts[(i+1)%pts.length];
    if((b[0]-a[0])*(e[1]-b[1])!==(b[1]-a[1])*(e[0]-b[0])) out.push(b);
  }
  c._out=out; return out;
}
function contPath(c,px,py,r,d=8){
  const raw=outlineOf(c).map(([gx,gy])=>[px+gx*CELL, py+gy*CELL]);
  const n=raw.length, pts=[];
  for(let i=0;i<n;i++){
    const a=raw[(i+n-1)%n], b=raw[i], e=raw[(i+1)%n];
    const d1x=Math.sign(b[0]-a[0]), d1y=Math.sign(b[1]-a[1]);
    const d2x=Math.sign(e[0]-b[0]), d2y=Math.sign(e[1]-b[1]);
    pts.push([b[0]+(-d1y-d2y)*d, b[1]+(d1x+d2x)*d]);
  }
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const p=pts[i%n], nx=pts[(i+1)%n];
    const mx=(p[0]+nx[0])/2, my=(p[1]+nx[1])/2;
    if(i===0) ctx.moveTo(mx,my);
    else ctx.arcTo(p[0],p[1],mx,my,r);
  }
  ctx.closePath();
}
function drawCont(c,t){
  const sp=KIT.sprites[c.shape]; if(!sp) return;
  const P=PAL[c.col], img=tinted(c.shape,c.col); if(!img) return;
  ctx.save();
  const maxdx=Math.max(...c.cells.map(k=>k[0])),maxdy=Math.max(...c.cells.map(k=>k[1]));
  const px=BX+c.x*CELL, py=BY+c.y*CELL;
  if(c.state==='clear'){ const f=c.popT/.45;
    ctx.globalAlpha=1-f;
    const cx=px+(maxdx+1)*CELL/2, cy=py+(maxdy+1)*CELL/2;
    ctx.translate(cx,cy); ctx.scale(1+f*.25,1+f*.25); ctx.translate(-cx,-cy);
  }
  const kx=CELL/KIT.tray.cx, ky=CELL/KIT.tray.cy;   // px спрайта -> px поля
  const ox=px+sp.dx*kx, oy=py+sp.dy*ky;      // спрайт стоит относительно сетки как в раскладке дизайнера
  ctx.drawImage(img, ox, oy, sp.w*kx, sp.h*ky);
  // сироп в карманах: порядок снизу вверх, слева направо (kit.json)
  const pk=sp.pockets, N=pk.length, filled=c.fill/c.cap*N;
  for(let i=0;i<N;i++){
    const lvl=Math.max(0,Math.min(1,filled-i)); if(lvl<=0) break;
    const [qx,qy,qw,qh]=pk[i];
    const x=ox+qx*kx+1, y=oy+qy*ky+1, w=qw*kx-2, h=qh*ky-2;
    ctx.save(); rr(x,y,w,h,3); ctx.clip();
    const top=y+h*(1-lvl)+(lvl<1?Math.sin(t*6+i)*.7:0);
    const g=ctx.createLinearGradient(0,top,0,y+h);
    g.addColorStop(0,'#fff'); g.addColorStop(.2,P.f); g.addColorStop(1,P.a);
    ctx.fillStyle=g; ctx.fillRect(x,top,w,y+h-top);
    if(lvl>=1){ ctx.fillStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(x+w*.32,y+h*.3,w*.2,h*.12,-.6,0,7); ctx.fill(); }
    else { ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fillRect(x,top,w,1.5); }
    ctx.restore();
  }
  ctx.restore();
}

let grab=null;
function toLocal(e){ const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left-offX)/scale, y:(e.clientY-r.top-offY)/scale}; }
function contAt(p){
  const cx=Math.floor((p.x-BX)/CELL), cy=Math.floor((p.y-BY)/CELL);
  for(const c of conts){ if(c.state!=='idle') continue;
    for(const[dx,dy]of c.cells) if(c.x+dx===cx&&c.y+dy===cy) return c; }
  return null;
}
cv.addEventListener('pointerdown',e=>{ if(!playing) return;
  const p=toLocal(e), c=contAt(p); if(!c) return;
  grab={c, ox:p.x-(BX+c.x*CELL), oy:p.y-(BY+c.y*CELL)};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{ if(!grab||!playing) return;
  const p=toLocal(e);
  const txc=Math.round((p.x-grab.ox-BX)/CELL), tyc=Math.round((p.y-grab.oy-BY)/CELL);
  moveToward(grab.c,txc,tyc);
});
cv.addEventListener('pointerup',()=>{grab=null;});
cv.addEventListener('pointercancel',()=>{grab=null;});
function moveToward(c,txc,tyc){
  const m=occMap(c);
  for(let s=0;s<12;s++){
    const dx=Math.sign(txc-c.x), dy=Math.sign(tyc-c.y);
    if(!dx&&!dy) break;
    const tryX=Math.abs(txc-c.x)>=Math.abs(tyc-c.y);
    let moved=false;
    const seq=tryX?[[dx,0],[0,dy]]:[[0,dy],[dx,0]];
    for(const[mx,my]of seq){ if(!mx&&!my) continue;
      if(canPlace(c,c.x+mx,c.y+my,m)){ c.x+=mx; c.y+=my; moved=true; break; } }
    if(!moved) break;
  }
}

/*BOT-BEGIN*/
function bfsAll(c){
  const m=occMap(c), seen=new Map([[c.x+','+c.y,[]]]), q=[[c.x,c.y]];
  while(q.length){ const[x,y]=q.shift(); const path=seen.get(x+','+y);
    for(const[mx,my]of[[0,-1],[1,0],[-1,0],[0,1]]){
      const nx=x+mx,ny=y+my,k=nx+','+ny;
      if(seen.has(k)||!canPlace(c,nx,ny,m)) continue;
      seen.set(k,path.concat([[nx,ny]])); q.push([nx,ny]);
    }
  } return seen;
}
function bfsPath(c,gx,gy){ const p=bfsAll(c).get(gx+','+gy); return p===undefined?null:p; }
// Клоцки-солвер: направленный поиск (взвешенный A*, f=g+2h) по СОВМЕСТНЫМ
// положениям всех подвижных блоков. h = смещение до цели + число блоков,
// стоящих в коридоре над кандидатом. Цель: cand в ряду 0 на одной из колонок
// goalXs. Возвращает список ходов [{c,x,y}] (по одной клетке) или null.
let botStats={states:0,plans:0};
function planDock(cand,goalXs,movables,cap){
  cap=cap||150000;
  const n=movables.length, ci=movables.indexOf(cand);
  const fixed=new Array(BC*BR).fill(0);
  for(const c of conts){ if(c.state!=='idle'||movables.includes(c)) continue;
    for(const[dx,dy]of c.cells) fixed[(c.y+dy)*BC+(c.x+dx)]=1; }
  const key=s=>{ let k=''; for(let i=0;i<n;i++) k+=String.fromCharCode(48+s[i][0]*8+s[i][1]); return k; };
  const goal=[...new Set(goalXs)];
  const own=new Array(BC*BR);
  const fillOwn=s=>{ own.fill(-1); for(let i=0;i<n;i++){ const c=movables[i];
      for(const[dx,dy]of c.cells) own[(s[i][1]+dy)*BC+(s[i][0]+dx)]=i; } };
  const h=s=>{ const cx=s[ci][0], cy=s[ci][1]; let best=99;
    for(const gx of goal){ let v=Math.abs(cx-gx)+cy; const seen=new Set();
      for(const[dx,dy]of cand.cells){ const col=gx+dx;
        for(let y=0;y<cy+dy;y++){ const k=y*BC+col; if(fixed[k]) v+=3;
          else if(own[k]>=0&&own[k]!==ci&&!seen.has(own[k])){ seen.add(own[k]); v++; } } }
      if(v<best) best=v; }
    return best; };
  const start=movables.map(c=>[c.x,c.y]);
  const prev=new Map([[key(start),null]]);
  const buckets=[]; let fmin=0;
  const push=(f,s,g)=>{ (buckets[f]=buckets[f]||[]).push([s,g]); if(f<fmin) fmin=f; };
  fillOwn(start); push(2*h(start),start,0);
  while(true){
    while(fmin<buckets.length&&!(buckets[fmin]&&buckets[fmin].length)) fmin++;
    if(fmin>=buckets.length) break;
    const [s,g]=buckets[fmin].pop();
    if(s[ci][1]===0&&goal.includes(s[ci][0])){
      const moves=[]; let k=key(s), p;
      while((p=prev.get(k))){ moves.push({c:movables[p[1]],x:p[2],y:p[3]}); k=p[0]; }
      moves.reverse(); botStats.states+=prev.size; botStats.plans++; return moves;
    }
    if(prev.size>cap) break;
    const m=fixed.slice();
    for(let i=0;i<n;i++){ const c=movables[i];
      for(const[dx,dy]of c.cells) m[(s[i][1]+dy)*BC+(s[i][0]+dx)]=1; }
    const sk=key(s);
    for(let i=0;i<n;i++){ const c=movables[i];
      for(const[dx,dy]of c.cells) m[(s[i][1]+dy)*BC+(s[i][0]+dx)]=0;
      for(const[mx,my]of[[0,-1],[1,0],[-1,0],[0,1]]){
        const nx=s[i][0]+mx, ny=s[i][1]+my;
        if(!canPlace(c,nx,ny,m)) continue;
        const ns=s.slice(); ns[i]=[nx,ny]; const k=key(ns);
        if(prev.has(k)) continue; prev.set(k,[sk,i,nx,ny]);
        fillOwn(ns); push(g+1+2*h(ns),ns,g+1);
      }
      for(const[dx,dy]of c.cells) m[(s[i][1]+dy)*BC+(s[i][0]+dx)]=1;
    }
  }
  botStats.states+=prev.size; return null;
}
let botPlan=null, botFailSig='';
function botStep(){
  if(!playing) return 'stopped';
  const now=tick/60;
  const flowing=c=>c.state==='idle'&&c.y===0&&c.fill<c.cap&&now-c.lastGain<0.5;
  // исполнение готового плана: один блок за шаг (слитые подряд ходы одного блока)
  if(botPlan&&botPlan.length){
    const c=botPlan[0].c;
    if(c.state!=='idle'){ botPlan=null; }
    else{
      let m=occMap(c), k=0;
      while(k<botPlan.length&&botPlan[k].c===c&&canPlace(c,botPlan[k].x,botPlan[k].y,m)){
        c.x=botPlan[k].x; c.y=botPlan[k].y; k++; }
      if(k===0){ botPlan=null; } else { botPlan.splice(0,k); if(!botPlan.length) botPlan=null; return 'plan'; }
    }
  }
  // кандидаты на стыковку: блок × колонка со своей жидкостью снизу
  const cands=[];
  for(const c of conts){ if(c.state!=='idle'||c.fill>=c.cap) continue;
    if(flowing(c)) continue;
    const maxdx=Math.max(...c.cells.map(k=>k[0]));
    const xs=[]; let bestSc=0;
    for(let x=0;x<=BC-1-maxdx;x++){
      let sc=0;
      for(const dx of [...new Set(c.cells.map(k=>k[0]))]){
        const col=x+dx;
        const minRow=Math.min(...c.cells.filter(k=>k[0]===dx).map(k=>k[1]));
        if(minRow>0){
          if(conts.some(o=>o!==c&&o.state==='idle'&&o.y===0&&
             o.cells.some(([ax,ay])=>o.x+ax===col&&ay===0))) continue;
        }
        const fb=floorBall(col);
        if(fb){ if(fb.col===c.col) sc+=Math.min(fb.vol,c.cap-c.fill); }
        else if(baseVol>1e-4&&baseCol===c.col) sc+=Math.min(baseVol,c.cap-c.fill);
      }
      if(sc>1e-4){ xs.push(x); bestSc=Math.max(bestSc,sc); }
    }
    if(xs.length) cands.push({c,xs,sc:bestSc});
  }
  cands.sort((a,b)=>b.sc-a.sc);
  // 1) прямой путь без расчистки
  for(const cd of cands){
    for(const x of cd.xs){ const path=bfsPath(cd.c,x,0);
      if(path){ for(const[nx,ny]of path){ cd.c.x=nx; cd.c.y=ny; } return 'docked'; } }
  }
  // 2) клоцки-план: короче — лучше (перебираем до 4 лучших кандидатов);
  //    неудачу помним по сигнатуре позиции, чтобы не перебирать заново каждый шаг
  if(cands.length){
    const movables=conts.filter(o=>o.state==='idle'&&!flowing(o));
    const sig=conts.map(c=>c.state==='idle'?c.x+','+c.y:'-').join('|')+'#'+
      cands.map(cd=>cd.c.id+':'+cd.xs.join('')).join('|');
    if(sig===botFailSig) return 'stuck';
    let best=null;
    for(const cd of cands.slice(0,4)){
      const plan=planDock(cd.c,cd.xs,movables);
      if(plan&&(!best||plan.length<best.length)) best=plan;
    }
    if(best){ botPlan=best; return botStep(); }
    botFailSig=sig; return 'stuck';
  }
  // 3) ждём шар: освобождаем верхний ряд
  for(const c of conts){ if(c.state!=='idle'||c.y!==0||flowing(c)) continue;
    for(let y=BR-1;y>=2;y--)for(let x=0;x<BC;x++){
      const path=bfsPath(c,x,y); if(path){ for(const[nx,ny]of path){c.x=nx;c.y=ny;} return 'evac'; } }
  }
  return 'idle';
}
/*BOT-END*/

/* ================= экраны/цикл ================= */
const $=s=>document.querySelector(s);
const PKEY='sandblocks_v9_progress';
let unlocked=+(localStorage.getItem(PKEY)||1);
function renderHome(){
  const d=$('#lvls'); d.innerHTML='';
  for(let i=1;i<=LEVELS.length;i++){
    const b=document.createElement('button');
    b.className='lv'+(i>unlocked?' lock':''); b.textContent=i>unlocked?'🔒':i;
    if(i<=unlocked) b.onclick=()=>startLevel(i-1);
    d.appendChild(b);
  }
}
function startLevel(n){
  level=n; buildLevel(n); playing=true; confetti=[];
  $('#home').classList.add('hidden'); $('#win').classList.add('hidden'); $('#lose').classList.add('hidden');
  $('#lvlLab').textContent='Level '+(n+1);
}
function showWin(){ popConfetti();
  unlocked=Math.max(unlocked,Math.min(LEVELS.length,level+2));
  localStorage.setItem(PKEY,unlocked);
  $('#btnNext').style.display=level+1<LEVELS.length?'':'none';
  setTimeout(()=>{ if(winFlag) $('#win').classList.remove('hidden'); },150);
}
function showLose(){ $('#lose').classList.remove('hidden'); }
$('#btnHome').onclick=()=>{playing=false;renderHome();$('#home').classList.remove('hidden');};
$('#btnWinHome').onclick=$('#btnHome').onclick;
$('#btnLoseHome').onclick=$('#btnHome').onclick;
$('#btnRetry').onclick=()=>startLevel(level);
$('#btnRetryOv').onclick=()=>startLevel(level);
$('#btnNext').onclick=()=>startLevel(level+1);

function fmt(t){ t=Math.max(0,Math.ceil(t)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last) last=ts;
  let dt=Math.min(.1,(ts-last)/1000); last=ts;
  if(playing){
    let steps=Math.round(dt*60*ffMult);
    for(let i=0;i<Math.max(1,steps);i++) step(1/60);
    if(botOn&&--botCd<=0){ botStep(); botCd=Math.max(3,18/ffMult); }
  }
  $('#timer').textContent=fmt(timeLeft);
  draw();
}
buildLevel(0); renderHome();
requestAnimationFrame(loop); fit();

/* ================= тест-хуки ================= */
window.__game={
  start:n=>startLevel(n),
  snap:()=>({level:level+1,time:+timeLeft.toFixed(1),win:winFlag,lose:loseFlag,playing,
    tankLeft:+(baseVol+balls.reduce((a,b)=>a+b.vol,0)).toFixed(2),
    balls:balls.map(b=>PAL[b.col].n[0]+':'+b.vol.toFixed(1)),
    conts:conts.map(c=>({col:PAL[c.col].n,x:c.x,y:c.y,fill:+c.fill.toFixed(2),cap:c.cap,state:c.state}))}),
  ff:m=>{ffMult=m;},
  bot:on=>{botOn=on;},
  botStep,
  setTime:s=>{timeLeft=s;},
};
</script>
