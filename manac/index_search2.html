<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Guess the Word — 5 уровней</title>
<style>
  :root{ --bg:#0c1730; --cell:#e9eef7; --ink:#e6e9f0; --muted:#8fa0c0; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:linear-gradient(180deg,#0a1228,#0d1c3a); color:var(--ink);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; overscroll-behavior:none; }
  #app{ max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
    align-items:center; padding:14px 14px 26px; }
  header{ width:100%; display:flex; align-items:center; justify-content:center; position:relative; margin:2px 0; }
  header h1{ font-size:23px; font-weight:800; margin:0; text-align:center; line-height:1.2; }
  header h1 .g{ color:#7CF06B; }
  #reset{ position:absolute; right:0; top:-2px; background:#1a2c4d; color:var(--ink);
    border:none; border-radius:10px; padding:7px 12px; font-size:13px; cursor:pointer; }
  #prog{ color:var(--muted); font-size:12.5px; font-weight:600; margin:8px 0 2px; letter-spacing:.4px; }
  #clue{ width:100%; max-width:248px; aspect-ratio:1/1; margin:8px 0 2px; border-radius:20px;
    background:#13213f; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,.35); overflow:hidden; }
  #clue img{ width:100%; height:100%; object-fit:cover; }
  #clue .rebus{ display:flex; align-items:center; gap:10px; font-size:84px; line-height:1; }
  #hint{ color:var(--muted); font-size:13px; margin:10px 0 8px; text-align:center; min-height:18px; }
  #answer{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:0 0 12px; min-height:38px; }
  #answer .slot{ width:30px; height:38px; border-radius:8px; background:#16243f; border:1.5px solid #2c3e63;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; color:#dfe6f5;
    transition:background .12s, color .12s, transform .12s; }
  #answer .slot.on{ background:#e9eef7; color:#16233f; border-color:#e9eef7; transform:translateY(-2px); }
  #answer .slot.ok{ background:#7CF06B; color:#10331a; border-color:#7CF06B; }
  #answer .slot.bad{ background:#3a2030; color:#e2566a; border-color:#e2566a; }
  #board{ position:relative; display:grid; gap:7px; touch-action:none; user-select:none; }
  .cell{ position:relative; border-radius:11px; background:var(--cell);
    display:flex; align-items:center; justify-content:center; font-weight:800; color:#16233f;
    transition:background .16s, color .16s; }
  .cell.solved{ background:var(--c); color:#fff; }
  .cell.sel{ outline:4px solid #7CF06B; outline-offset:-4px; background:#fff; }
  .cell.bad{ outline:4px solid #e2566a; outline-offset:-4px; }
  #win{ position:fixed; inset:0; background:rgba(10,13,20,.86); display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; z-index:10; }
  #win.show{ display:flex; }
  #win .big{ font-size:36px; font-weight:800; font-style:italic; }
  #win .lbl{ color:#aab; font-size:17px; font-weight:700; letter-spacing:1px; }
  #win button{ background:#fff; color:#141821; border:none; border-radius:14px; padding:13px 28px;
    font-size:16px; font-weight:700; cursor:pointer; }

{target:"BUTTERFLY",H:5,W:6,tr:1,tc:1,th:3,tw:3,color:"#a06cd6",grid:["ESZYCI","DBUTPY","OTERPU","MFLYZG","DPAMNT"],pic:{type:"rebus",emo:"🧈 🪰"}},
{target:"HOTDOG",H:4,W:6,tr:1,tc:2,th:2,tw:3,color:"#e0944f",grid:["ESZYCI","DPHOTY","OPDOGU","MZGDPA"],pic:{type:"rebus",emo:"🔥 🐶"}},
{target:"STARFISH",H:4,W:6,tr:1,tc:1,th:2,tw:4,color:"#2ea4a4",grid:["ESZYCI","DSTARP","YFISHO","PUMZGD"],pic:{type:"rebus",emo:"⭐ 🐟"}},
{target:"FOOTBALL",H:4,W:7,tr:1,tc:2,th:2,tw:4,color:"#5b86e0",grid:["ESZYCID","PYFOOTO","PUBALLM","ZGDPAMN"],pic:{type:"rebus",emo:"🦶 ⚽"}}
];

let cur=0, L, W, H, grid, cells=[], won=false;
const board=document.getElementById('board');
const clueEl=document.getElementById('clue');
const answerEl=document.getElementById('answer');
const hand=document.getElementById('hand');

function buildBoard(){
  W=L.W; H=L.H; grid=L.grid;
  board.style.gridTemplateColumns='repeat('+W+',1fr)';
  board.innerHTML=''; cells=[];
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const d=document.createElement('div'); d.className='cell'; d.dataset.r=r; d.dataset.c=c;
    board.appendChild(d); cells.push(d);
  }
  board.appendChild(hand);
}
const cellAt=(r,c)=>cells[r*W+c];

function sizeBoard(){
  const bw=Math.min(window.innerWidth-28, W*52);
  const gap=7, cw=(bw-gap*(W-1))/W;
  board.style.width=bw+'px';
  cells.forEach(c=>{ c.style.height=cw+'px'; c.style.fontSize=(cw*0.42)+'px'; });
}

function renderClue(){
  if(L.pic.type==='img') clueEl.innerHTML='<img alt="загадка" src="'+L.pic.src+'">';
  else clueEl.innerHTML='<div class="rebus">'+L.pic.emo+'</div>';
}

function paint(){
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const cell=cellAt(r,c); cell.className='cell'; cell.textContent=grid[r][c]; cell.style.removeProperty('--c');
    if(won && r>=L.tr && r<L.tr+L.th && c>=L.tc && c<L.tc+L.tw){ cell.classList.add('solved'); cell.style.setProperty('--c',L.color); }
  }
}

// ---- зона ответа ----
function buildAnswer(){ answerEl.innerHTML=''; for(let i=0;i<L.target.length;i++){ const s=document.createElement('div'); s.className='slot'; answerEl.appendChild(s); } }
function readSel(bb){ let s=''; for(let r=bb.r0;r<=bb.r1;r++)for(let c=bb.c0;c<=bb.c1;c++) s+=grid[r][c]; return s; }
function fillAnswer(str,state){ const sl=answerEl.children; for(let i=0;i<sl.length;i++){ const has=i<str.length; sl[i].textContent=has?str[i]:''; sl[i].className='slot'+(has?' on':'')+(state&&has?' '+state:''); } }
function clearAnswer(){ fillAnswer('',''); }

// ---- tutorial hand (только L1) ----
let guideTimer=null;
function stopGuide(){ clearTimeout(guideTimer); guideTimer=null; hand.classList.remove('tap'); hand.style.opacity=0; }
function guide(){
  stopGuide();
  if(cur!==0||won) return;
  const ctr=(r,c)=>{ const el=cellAt(r,c); return {x:el.offsetLeft+el.offsetWidth*0.5-42.7, y:el.offsetTop+el.offsetHeight*0.55-2.1}; };
  const A=ctr(L.tr,L.tc), B=ctr(L.tr+L.th-1,L.tc+L.tw-1);
  (function cycle(){
    hand.style.transition='opacity .2s';
    hand.style.left=A.x+'px'; hand.style.top=A.y+'px';
    hand.style.opacity=1; hand.classList.add('tap');
    guideTimer=setTimeout(()=>{
      hand.classList.remove('tap');
      hand.style.transition='left .9s ease, top .9s ease, opacity .2s';
      hand.style.left=B.x+'px'; hand.style.top=B.y+'px';
      guideTimer=setTimeout(()=>{ hand.style.opacity=0; guideTimer=setTimeout(cycle,600); },1050);
    },800);
  })();
}

// ---- drag ----
let dragging=false, sr=0, sc=0;
function pos(e){
  const t=(e.touches&&e.touches.length)?e.touches[0]
        :(e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e;
  const rc=board.getBoundingClientRect();
  const cw=rc.width/W, ch=rc.height/H;
  let c=Math.floor((t.clientX-rc.left)/cw), r=Math.floor((t.clientY-rc.top)/ch);
  return {r:Math.max(0,Math.min(H-1,r)), c:Math.max(0,Math.min(W-1,c))}; }
function bbox(r,c){ return {r0:Math.min(sr,r),c0:Math.min(sc,c),r1:Math.max(sr,r),c1:Math.max(sc,c)}; }
function showSel(bb){ paint();
  for(let r=bb.r0;r<=bb.r1;r++)for(let c=bb.c0;c<=bb.c1;c++){ const cell=cellAt(r,c);
    if(!cell.classList.contains('solved')) cell.classList.add('sel'); } }
function start(e){ if(won)return; e.preventDefault(); stopGuide(); const p=pos(e); sr=p.r; sc=p.c; dragging=true; const bb=bbox(sr,sc); showSel(bb); fillAnswer(readSel(bb),''); }
function move(e){ if(!dragging)return; e.preventDefault(); const p=pos(e); const bb=bbox(p.r,p.c); showSel(bb); fillAnswer(readSel(bb),''); }
function end(e){ if(!dragging)return; dragging=false; e.preventDefault();
  const p=pos(e), bb=bbox(p.r,p.c), read=readSel(bb);
  if(read===L.target){
    won=true; paint(); stopGuide(); fillAnswer(L.target,'ok');
    document.getElementById('hint').textContent=L.target+' ✓';
    setTimeout(showWin,450); return;
  }
  fillAnswer(read,'bad');
  for(let r=bb.r0;r<=bb.r1;r++)for(let c=bb.c0;c<=bb.c1;c++) cellAt(r,c).classList.add('bad');
  setTimeout(()=>{ paint(); clearAnswer(); },350);
  guide(); }
board.addEventListener('mousedown',start); board.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
board.addEventListener('touchstart',start,{passive:false}); board.addEventListener('touchmove',move,{passive:false}); board.addEventListener('touchend',end,{passive:false});

function showWin(){
  const last=cur===LEVELS.length-1;
  document.getElementById('winlbl').textContent=L.target;
  document.getElementById('next').textContent=last?'Сначала 🔁':'Дальше ▶';
  document.getElementById('win').classList.add('show');
}
document.getElementById('next').onclick=()=>{
  document.getElementById('win').classList.remove('show');
  loadLevel(cur===LEVELS.length-1?0:cur+1);
};
document.getElementById('reset').onclick=()=>loadLevel(cur);

function loadLevel(idx){
  cur=idx; L=LEVELS[idx]; won=false;
  document.getElementById('win').classList.remove('show');
  document.getElementById('prog').textContent='Уровень '+(idx+1)+' / '+LEVELS.length;
  document.getElementById('hint').textContent='Найди слово среди букв и обведи его';
  renderClue(); buildBoard(); buildAnswer(); clearAnswer(); paint(); sizeBoard(); guide();
}
window.addEventListener('resize',()=>{ if(L){ sizeBoard(); guide(); } });
loadLevel(0);
</script>
