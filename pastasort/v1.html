<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Color Pasta Sort — v1</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#2a2420,#120f0d 80%);}

  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:radial-gradient(90% 60% at 50% 30%,#fbf3e4,#efe1c8 70%,#e6d3b4);}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }

  #hud{width:100%;padding:18px 16px 0;z-index:3;position:relative;height:110px;flex:none;}
  .hudBtn{position:absolute;top:22px;width:52px;height:52px;border:none;cursor:pointer;
    border-radius:16px;background:linear-gradient(#f07b3a,#d95f1f);
    box-shadow:0 5px 0 #a3430f,0 8px 14px rgba(160,80,20,.3);
    color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;font-weight:900;}
  .hudBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #a3430f;}
  #gearBtn{left:16px;}
  #undoBtn{right:16px;font-size:30px;}
  #undoBtn.dim{opacity:.45;}
  #lvlWrap{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center;}
  #lvlBadge{display:inline-block;background:#b8412b;color:#fff;font-weight:800;font-size:15px;
    letter-spacing:1px;padding:5px 20px;border-radius:10px;box-shadow:0 3px 0 #7d2a1a;}
  #movesBanner{margin-top:-4px;background:#fff;color:#8a3a22;font-weight:800;font-size:26px;
    padding:6px 34px;border:3px solid #f0b489;position:relative;
    clip-path:polygon(0 50%,7% 0,93% 0,100% 50%,93% 100%,7% 100%);
    filter:drop-shadow(0 3px 3px rgba(150,80,40,.3));}

  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #fx{z-index:15;pointer-events:none;}
  #toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:12;pointer-events:none;
    background:rgba(60,30,20,.82);color:#fff;font-weight:800;font-size:20px;padding:10px 22px;border-radius:14px;
    opacity:0;transition:opacity .2s;white-space:nowrap;}
  #toast.on{opacity:1;}

  .ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
      flex-direction:column;background:rgba(40,20,10,.62);}
  .hidden{display:none !important;}

  .card{position:relative;width:78%;max-width:360px;background:#fff7ec;border:6px solid #e8632b;
    border-radius:28px;padding:64px 22px 26px;display:flex;flex-direction:column;align-items:center;
    box-shadow:0 24px 60px rgba(0,0,0,.45);}
  .ribbon{position:absolute;top:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:linear-gradient(#ff9b2e,#f07713);color:#fff;font-weight:900;font-size:26px;
    letter-spacing:1px;padding:12px 34px;border-radius:14px;
    text-shadow:0 3px 0 rgba(160,70,0,.55);box-shadow:0 6px 0 #c85c08,0 10px 18px rgba(0,0,0,.3);}
  .ribbon.red{background:linear-gradient(#ff5964,#e0333f);box-shadow:0 6px 0 #b0222c,0 10px 18px rgba(0,0,0,.3);

  .bigBtn.blue:active{box-shadow:0 2px 0 #2749a8;}
  .bigBtn.orange{background:linear-gradient(#f79e2d,#e0801a);box-shadow:0 6px 0 #b56412,0 10px 18px rgba(0,0,0,.25);}

  #lvlRow{display:flex;gap:10px;margin:4px 0 22px;flex-wrap:wrap;justify-content:center;padding:0 20px;}
  .lvlBtn{width:50px;height:50px;border-radius:14px;border:none;cursor:pointer;font-weight:900;font-size:20px;color:#b8412b;

    display:flex;flex-direction:column;gap:14px;align-items:stretch;box-shadow:0 20px 50px rgba(0,0,0,.4);}
  #menuCard .bigBtn{font-size:20px;padding:12px 40px;}

    <div id="lvlRow"></div>
    <button class="bigBtn" id="playBtn">PLAY</button>
  </div>
</div>

<script src="../proto-kit/proto-kit.js"></script>
<script>
/* Color Pasta Sort — общее ядро: геометрия пасты, зависимости «кто на ком лежит», правила
   очереди банок и лотка, солвер и боты. Работает и в браузере (globalThis.PastaCore), и в node. */
const PastaCore=(()=>{
  // формы в единицах радиуса тарелки (=1). len = длина, w = толщина
  const SHAPES={
    penne:{len:0.34,w:0.125,pts:2},
    spag:{len:1.15,w:0.055,pts:2},
    fusi:{len:0.72,w:0.105,pts:18,wave:0.07,periods:2},
  };
  function poly(p){
    const s=SHAPES[p.s],n=s.pts,ca=Math.cos(p.a),sa=Math.sin(p.a),pts=[];
    for(let i=0;i<n;i++){
      const t=i/(n-1)-0.5,u=t*s.len,v=s.wave?Math.sin(t*Math.PI*2*s.periods)*s.wave:0;
      pts.push([p.x+u*ca-v*sa,p.y+u*sa+v*ca]);
    }
    return pts;
  }
  function ptSegDist2(px,py,ax,ay,bx,by){
    const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
    let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;t=t<0?0:t>1?1:t;
    const qx=ax+t*dx-px,qy=ay+t*dy-py;return qx*qx+qy*qy;
  }
  function cross(ax,ay,bx,by){return ax*by-ay*bx;}
  function segsIntersect(a,b,c,d){
    const d1=cross(d[0]-c[0],d[1]-c[1],a[0]-c[0],a[1]-c[1]),d2=cross(d[0]-c[0],d[1]-c[1],b[0]-c[0],b[1]-c[1]);
    const d3=cross(b[0]-a[0],b[1]-a[1],c[0]-a[0],c[1]-a[1]),d4=cross(b[0]-a[0],b[1]-a[1],d[0]-a[0],d[1]-a[1]);
    return ((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));
  }
  function segDist2(a,b,c,d){
    if(segsIntersect(a,b,c,d))return 0;
    return Math.min(ptSegDist2(a[0],a[1],c[0],c[1],d[0],d[1]),ptSegDist2(b[0],b[1],c[0],c[1],d[0],d[1]),
      ptSegDist2(c[0],c[1],a[0],a[1],b[0],b[1]),ptSegDist2(d[0],d[1],a[0],a[1],b[0],b[1]));
  }
  function polyDist2(A,B){
    let m=Infinity;
    for(let i=0;i+1<A.length;i++)for(let j=0;j+1<B.length;j++){const d=segDist2(A[i],A[i+1],B[j],B[j+1]);if(d<m)m=d;}
    return m;
  }
  function overlaps(p,q){
    const th=(SHAPES[p.s].w+SHAPES[q.s].w)/2*0.9;
    const A=poly(p),B=poly(q);
    return polyDist2(A,B)<th*th;
  }
  // blockers[i] = маска фишек, лежащих поверх i (z больше и пересекаются)
  function buildBlockers(pieces){
    const n=pieces.length,bl=new Array(n).fill(0);
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){
      if(i===j||pieces[j].z<=pieces[i].z)continue;
      if(overlaps(pieces[i],pieces[j]))bl[i]|=1<<j;
    }
    return bl;
  }
  // Состояние из маски убранных фишек: какие цвета активны (банка на столе), сколько в лотке
  function evalMask(L,mask){
    const nc=L.queue.length,cnt=new Array(nc).fill(0);
    for(let i=0;i<L.pieces.length;i++)if(mask>>i&1)cnt[L.pieces[i].c]++;
    const active=new Array(nc).fill(false),done=new Array(nc).fill(false);
    let open=0,buf=0;
    for(let k=0;k<L.queue.length;k++){
      const c=L.queue[k];
      if(open<L.slots){ if(cnt[c]===L.cap)done[c]=true; else {active[c]=true;open++;} }
      else buf+=cnt[c];
    }
    return {cnt,active,done,buf};
  }
  function legalMoves(L,bl,mask){
    const st=evalMask(L,mask),out=[];
    for(let i=0;i<L.pieces.length;i++){
      if(mask>>i&1)continue;
      if((mask&bl[i])!==bl[i])continue;
      const c=L.pieces[i].c;
      if(st.active[c])out.push({i,dest:'jar'});
      else if(st.buf<L.buf)out.push({i,dest:'buf'});
    }
    return out;
  }
  function solve(L,bl){
    const n=L.pieces.length,full=(2**n)-1,memo=new Map();let dead=0;
    function rec(mask){
      if(mask===full)return [];
      if(memo.has(mask))return memo.get(mask);
      memo.set(mask,null);
      const mv=legalMoves(L,bl,mask);
      if(!mv.length)dead++;
      // сначала ходы в банку
      mv.sort((a,b)=>(a.dest==='jar'?0:1)-(b.dest==='jar'?0:1));
      for(const m of mv){const r=rec(mask|(1<<m.i));if(r){const res=[m,...r];memo.set(mask,res);return res;}}
      return null;
    }
    const sol=rec(0);
    return {solvable:!!sol,solution:sol,visited:memo.size,dead};
  }
  function playBot(L,bl,pick,rng){
    const n=L.pieces.length,full=(2**n)-1;let mask=0,steps=0;
    while(mask!==full){
      const mv=legalMoves(L,bl,mask);if(!mv.length)return {win:false,steps};
      const m=pick(mv,mask);mask|=1<<m.i;steps++;
    }
    return {win:true,steps};
  }
  function makeRng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
  function botRandom(rng){return (mv)=>mv[(rng()*mv.length)|0];}
  function botGreedy(L,rng){
    const rank=new Map(L.queue.map((c,i)=>[c,i]));
    return (mv)=>{
      const jar=mv.filter(m=>m.dest==='jar');if(jar.length)return jar[(rng()*jar.length)|0];
      let best=mv[0],br=Infinity;for(const m of mv){const r=rank.get(L.pieces[m.i].c);if(r<br){br=r;best=m;}}
      return best;
    };
  }
  // «думающий» бот: в банку — сразу; в лоток — только если после хода не тупик, предпочитая ближайший в очереди цвет
  function botSmart(L,bl,rng){
    const rank=new Map(L.queue.map((c,i)=>[c,i]));
    return (mv,mask)=>{
      const jar=mv.filter(m=>m.dest==='jar');if(jar.length)return jar[(rng()*jar.length)|0];
      const safe=mv.filter(m=>legalMoves(L,bl,mask|(1<<m.i)).length>0);
      const pool=safe.length?safe:mv;
      let br=Infinity;for(const m of pool)br=Math.min(br,rank.get(L.pieces[m.i].c));
      const best=pool.filter(m=>rank.get(L.pieces[m.i].c)===br);
      return best[(rng()*best.length)|0];
    };
  }
  return {SHAPES,poly,overlaps,buildBlockers,evalMask,legalMoves,solve,playBot,makeRng,botRandom,botGreedy,botSmart,ptSegDist2};
})();

:1.016,"z":16},{"c":1,"s":"penne","x":-0.607,"y":0.373,"a":3.008,"z":17},{"c":4,"s":"penne","x":-0.007,"y":-0.576,"a":2.843,"z":18},{"c":3,"s":"fusi","x":0.357,"y":-0.737,"a":0.508,"z":19}],"seed":89,"solution":[10,15,13,18,11,9,17,8,6,16,7,14,5,12,0,2,4,1,3,19]}];
'use strict';
/* ================= Color Pasta Sort v1 =================
   По спеке «Color Pasta Sort» и её финальной заметке: паста лежит переплетённой кучей на тарелке,
   вытащить можно только кусок, на котором ничего не лежит (геометрия решает, что доступно).
   Цвет = место назначения: банка своего цвета. Банки приходят по очереди (на столе `slots` штук):
   нет банки этого цвета — кусок ждёт на лотке (`buf` мест). Полная банка уезжает, приходит следующая,
   ждущие куски с лотка перелетают в неё сами. Лоток полон и нечего положить в банки = проигрыш.
   Управление: тап по свободному куску = авто-раскладка; drag = явный выбор банки/лотка.
   Логика мгновенная, анимации только визуал (ввод не блокируется); UNDO без лимита. */
const $=id=>document.getElementById(id);
const CORE=PastaCore;
const COLORS=[
  {n:'Red',   f:'#e8483f',d:'#9e2a22',l:'#ff9c94',t:'rgba(232,72,63,.16)'},
  {n:'Yellow',f:'#f5c542',d:'#b3831a',l:'#fff0a8',t:'rgba(245,197,66,.2)'},
  {n:'Green', f:'#5cbb4c',d:'#2f7a25',l:'#b6f0a8',t:'rgba(92,187,76,.16)'},
  {n:'Purple',f:'#a35de0',d:'#6a2fa8',l:'#dcb8ff',t:'rgba(163,93,224,.16)'},
  {n:'Blue',  f:'#4a95e6',d:'#245ea3',l:'#b3d8ff',t:'rgba(74,149,230,.16)'},
];
const cvs=$('game'),ctx=cvs.getContext('2d'),fxCvs=$('fx'),fxCtx=fxCvs.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);

/* ---------- Состояние ---------- */
let level=1,L=null,pieces=[],bl=[],removed=[],moves=0,jars=[],qi=0,tray=[],history=[];
let playing=false,over=false;
const now=()=>performance.now();

/* ---------- Раскладка ---------- */
let W=390,H=700,PL={cx:195,cy:190,R:170},JAR={y:0,w:90,h:120,gap:18,xs:[]},NEXT={y:0,h:26},TRAY={x:0,y:0,w:0,h:64,cell:58,gap:8};
function layout(){
  const r=$('stage').getBoundingClientRect();W=r.width;H=r.height;
  cvs.width=W*DPR;cvs.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  const pr=$('phone').getBoundingClientRect();
  fxCvs.width=pr.width*DPR;fxCvs.height=pr.height*DPR;fxCtx.setTransform(DPR,0,0,DPR,0,0);
  JAR.w=Math.min(96,W*0.24);JAR.h=JAR.w*1.3;JAR.gap=Math.min(22,W*0.05);
  TRAY.cell=Math.min(58,W*0.14);TRAY.gap=8;TRAY.h=TRAY.cell+18;
  const bottom=H-38;                                  // под банкой ещё счётчик n/cap
  const stack=12+22+TRAY.h+14+NEXT.h+10+JAR.h+38;     // всё, что стоит под тарелкой, плюс поля
  const R=Math.min(W*0.45,(H-stack)/2);
  PL={cx:W/2,cy:12+R,R};
  JAR.y=bottom-JAR.h;
  NEXT.y=JAR.y-NEXT.h-10;
  const trayTop=PL.cy+R+22,trayBot=NEXT.y-14;
  TRAY.y=trayTop+Math.max(0,(trayBot-trayTop-TRAY.h)/2);
  if(L){
    const nb=L.buf;TRAY.w=nb*TRAY.cell+(nb+1)*TRAY.gap+64;TRAY.x=W/2-TRAY.w/2;
    const ns=L.slots,tot=ns*JAR.w+(ns-1)*JAR.gap;JAR.xs=[];
    for(let s=0;s<ns;s++)JAR.xs.push(W/2-tot/2+s*(JAR.w+JAR.gap));
  }
}
function trayCell(k){return {x:TRAY.x+32+TRAY.gap+k*(TRAY.cell+TRAY.gap)+TRAY.cell/2,y:TRAY.y+12+TRAY.cell/2};}
function jarCenter(s){return {x:JAR.xs[s]+JAR.w/2,y:JAR.y+JAR.h*0.62};}
function piecePos(p){return {x:PL.cx+p.x*PL.R,y:PL.cy+p.y*PL.R};}
function boardBounds(){
  const top=$('stage').offsetTop;
  return {left:PL.cx-PL.R,top:top+PL.cy-PL.R,right:PL.cx+PL.R,bottom:top+JAR.y+JAR.h+24};
}
window.addEventListener('resize',layout);

/* ---------- Визуальное состояние ---------- */
let vjars=[],vtray=[],flights=[],events=[],vt=0,fxp=[];
function sched(fn,dur){const t=Math.max(vt,now());events.push({t,fn});vt=t+dur;return t;}
function syncVisual(){
  events=[];flights=[];vt=0;
  vjars=jars.map(j=>j?{c:j.c,shown:j.count,state:'in',t0:0}:null);
  vtray=tray.map((i,k)=>({i,x:trayCell(k).x,tx:trayCell(k).x,y:trayCell(k).y}));
  for(const p of pieces){p.drag=null;p.ret=null;p.shake=0;p.flash=0;}
}
function addFlight(i,from,to,onLand,delay=0){
  const p=pieces[i];const t0=Math.max(vt,now())+delay;
  flights.push({i,c:p.c,s:p.s,a:p.a,from,to,t0,dur:280,onLand});
  return t0+280;
}

/* ---------- Правила ---------- */
function isFree(i){for(let j=0;j<pieces.length;j++)if((bl[i]>>j&1)&&!removed[j])return false;return true;}
function blockersOf(i){const out=[];for(let j=0;j<pieces.length;j++)if((bl[i]>>j&1)&&!removed[j])out.push(j);return out;}
function slotOf(c){return jars.findIndex(j=>j&&j.c===c);}
function legalDest(i){
  if(removed[i]||!isFree(i))return null;
  if(slotOf(pieces[i].c)>=0)return 'jar';
  if(tray.length<L.buf)return 'buf';
  return null;
}
function legalMoves(){const out=[];for(let i=0;i<pieces.length;i++){const d=legalDest(i);if(d)out.push({i,dest:d});}return out;}
function snapshot(){history.push({removed:[...removed],moves,jars:jars.map(j=>j?{...j}:null),qi,tray:[...tray]});updateUndo();}
function updateUndo(){$('undoBtn').classList.toggle('dim',!history.length);}
function setMoves(){$('movesBanner').textContent='Moves: '+moves;}

function buildLevel(n){
  level=n;L=LEVELS[n-1];
  pieces=L.pieces.map(p=>({...p,drag:null,ret:null,shake:0,flash:0}));
  bl=CORE.buildBlockers(pieces);
  removed=pieces.map(()=>false);moves=0;history=[];tray=[];qi=0;
  jars=[];for(let s=0;s<L.slots;s++)jars.push(qi<L.queue.length?{c:L.queue[qi++],count:0}:null);
  playing=true;over=false;drag=null;
  $('lvlBadge').textContent='LEVEL '+n;setMoves();updateUndo();
  $('winOv').classList.add('hidden');$('loseOv').classList.add('hidden');$('menuOv').classList.add('hidden');
  stopConfetti();layout();syncVisual();
  for(const j of vjars)if(j){j.state='entering';j.t0=now();}
}

/* Ход: кусок i → банка своего цвета или лоток. from = откуда лететь (px) */
function doMove(i,dest,from){
  if(over||!playing)return false;
  const d=legalDest(i);if(!d||d!==dest)return false;
  snapshot();
  const p=pieces[i];removed[i]=true;moves++;setMoves();
  from=from||piecePos(p);
  if(dest==='jar'){
    const s=slotOf(p.c);jars[s].count++;
    addFlight(i,from,jarCenter(s),()=>{if(vjars[s]&&vjars[s].c===p.c)vjars[s].shown++;});
  }else{
    tray.push(i);const k=tray.length-1;const cell=trayCell(k);
    addFlight(i,from,cell,()=>{vtray.push({i,x:cell.x,tx:cell.x,y:cell.y});});
  }
  vt=Math.max(vt,now()+280);
  settle();
  if(qi>=L.queue.length&&jars.every(j=>!j)){over=true;const t=Math.max(vt,now())+900;events.push({t,fn:win});}
  else if(!legalMoves().length){over=true;loseWith('TRAY FULL');}
  return true;
}
/* Полные банки уезжают, следующие приходят, ждущие куски с лотка перелетают в них */
function settle(){
  let guard=0;
  while(guard++<20){
    const s=jars.findIndex(j=>j&&j.count===L.cap);if(s<0)break;
    const doneC=jars[s].c;
    sched(()=>{const v=vjars[s];if(v&&v.c===doneC){v.state='leaving';v.t0=now();}},420);
    const next=qi<L.queue.length?L.queue[qi++]:null;
    jars[s]=next===null?null:{c:next,count:0};
    sched(()=>{vjars[s]=next===null?null:{c:next,shown:0,state:'entering',t0:now()};},300);
    if(next!==null){
      const flow=tray.filter(i=>pieces[i].c===next);
      for(const i of flow){
        tray.splice(tray.indexOf(i),1);jars[s].count++;
        sched(()=>{
          const k=vtray.findIndex(e=>e.i===i);let from=jarCenter(s);
          if(k>=0){from={x:vtray[k].x,y:vtray[k].y};vtray.splice(k,1);retargetTray();}
          const t0=Math.max(vt,now());
          flights.push({i,c:pieces[i].c,s:pieces[i].s,a:pieces[i].a,from,to:jarCenter(s),t0,dur:260,
            onLand:()=>{if(vjars[s]&&vjars[s].c===next)vjars[s].shown++;}});
        },160);
      }
      if(flow.length)vt+=140;
    }
  }
}
function retargetTray(){vtray.forEach((e,k)=>{const c=trayCell(k);e.tx=c.x;e.y=c.y;});}

function undo(){
  if(!history.length||!playing)return;
  const h=history.pop();
  removed=h.removed;moves=h.moves;jars=h.jars;qi=h.qi;tray=h.tray;over=false;
  $('loseOv').classList.add('hidden');setMoves();updateUndo();syncVisual();
}

/* ---------- Фидбек ---------- */
let toastT=0;
function toast(txt){$('toast').textContent=txt;$('toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('on'),900);}
function blockedFeedback(i){
  pieces[i].shake=now()+420;
  for(const j of blockersOf(i))pieces[j].flash=now()+650;
}

/* ---------- Ввод: тап и drag ---------- */
let drag=null;
function hitPiece(px,py){
  let best=-1,bz=-1;
  for(let i=0;i<pieces.length;i++){
    if(removed[i])continue;const p=pieces[i];
    const pts=CORE.poly(p).map(([x,y])=>[PL.cx+x*PL.R,PL.cy+y*PL.R]);
    const rad=CORE.SHAPES[p.s].w*PL.R/2+9;let hit=false;
    for(let k=0;k+1<pts.length;k++){if(CORE.ptSegDist2(px,py,pts[k][0],pts[k][1],pts[k+1][0],pts[k+1][1])<rad*rad){hit=true;break;}}
    if(hit&&p.z>bz){bz=p.z;best=i;}
  }
  return best;
}
function inRect(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
function dropTarget(x,y,c){
  const s=slotOf(c);
  if(s>=0&&inRect(x,y,{x:JAR.xs[s]-12,y:JAR.y-24,w:JAR.w+24,h:JAR.h+40}))return 'jar';
  if(s<0&&inRect(x,y,{x:TRAY.x-8,y:TRAY.y-18,w:TRAY.w+16,h:TRAY.h+36}))return tray.length<L.buf?'buf':'full';
  return null;
}
function tapPiece(i){
  const d=legalDest(i);
  if(d){doMove(i,d,null);return;}
  if(removed[i])return;
  if(!isFree(i)){blockedFeedback(i);return;}
  pieces[i].shake=now()+420;toast('Tray is full');
}
function stagePoint(e){const r=cvs.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
cvs.addEventListener('pointerdown',e=>{
  if(!playing||over)return;
  const {x,y}=stagePoint(e);const i=hitPiece(x,y);if(i<0)return;
  if(!isFree(i)){blockedFeedback(i);return;}
  drag={i,sx:x,sy:y,x,y,moved:false};pieces[i].drag={dx:0,dy:0};
  cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener('pointermove',e=>{
  if(!drag)return;const {x,y}=stagePoint(e);drag.x=x;drag.y=y;
  if(!drag.moved&&Math.hypot(x-drag.sx,y-drag.sy)>7)drag.moved=true;
  if(drag.moved){const p=pieces[drag.i];p.drag={dx:x-drag.sx,dy:y-drag.sy-34};}
});
function endDrag(e){
  if(!drag)return;const d=drag;drag=null;const p=pieces[d.i];
  if(!d.moved){p.drag=null;tapPiece(d.i);return;}
  const dropX=d.x,dropY=d.y-34;
  const t=dropTarget(dropX,dropY,p.c);
  const pos=piecePos(p);const from={x:pos.x+p.drag.dx,y:pos.y+p.drag.dy};
  if(t==='jar'||t==='buf'){p.drag=null;doMove(d.i,t,from);return;}
  if(t==='full')toast('Tray is full');
  p.ret={dx:p.drag.dx,dy:p.drag.dy,t0:now()};p.drag=null;
}
cvs.addEventListener('pointerup',endDrag);cvs.addEventListener('pointercancel',endDrag);

/* ---------- Отрисовка ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function pathPts(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let k=1;k<pts.length;k++)ctx.lineTo(pts[k][0],pts[k][1]);}
function drawPasta(p,cx,cy,S,o={}){
  const col=COLORS[p.c],sh=CORE.SHAPES[p.s],w=sh.w*S*(o.scale||1);
  const pts=CORE.poly({...p,x:0,y:0}).map(([x,y])=>[cx+x*S*(o.scale||1),cy+y*S*(o.scale||1)]);
  ctx.save();ctx.globalAlpha=o.alpha==null?1:o.alpha;ctx.lineCap='round';ctx.lineJoin='round';
  // тень
  ctx.save();ctx.translate(o.lift?5:2,o.lift?9:3);pathPts(pts);ctx.strokeStyle=`rgba(40,20,10,${o.lift?.28:.2})`;ctx.lineWidth=w+2;ctx.stroke();ctx.restore();
  if(o.flash){pathPts(pts);ctx.strokeStyle='rgba(255,40,40,.85)';ctx.lineWidth=w+9;ctx.stroke();}
  if(o.glow){pathPts(pts);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=w+8;ctx.stroke();}
  pathPts(pts);ctx.strokeStyle=col.d;ctx.lineWidth=w+3;ctx.stroke();
  pathPts(pts);ctx.strokeStyle=col.f;ctx.lineWidth=w;ctx.stroke();
  if(w>7){ctx.save();ctx.translate(0,-w*0.22);pathPts(pts);ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=w*0.3;ctx.stroke();ctx.restore();}
  if(p.s==='penne'){ // отверстия трубочки на концах
    for(const [ex,ey] of [pts[0],pts[pts.length-1]]){ctx.beginPath();ctx.arc(ex,ey,w*0.27,0,7);ctx.fillStyle=col.d;ctx.fill();
      ctx.beginPath();ctx.arc(ex,ey,w*0.14,0,7);ctx.fillStyle='rgba(60,20,10,.55)';ctx.fill();}
  }
  ctx.restore();
}
function drawPlate(){
  const {cx,cy,R}=PL;
  ctx.save();ctx.shadowColor='rgba(80,40,10,.28)';ctx.shadowBlur=26;ctx.shadowOffsetY=10;
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fillStyle='#fdfcf8';ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.strokeStyle='#e4dccd';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,R*0.86,0,7);ctx.strokeStyle='#eef1f6';ctx.lineWidth=R*0.09;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,R*0.86,0,7);ctx.strokeStyle='#c9d6ea';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,R*0.77,0,7);ctx.fillStyle='#f9f7f1';ctx.fill();
}
function drawPile(t){
  const order=[...pieces.keys()].filter(i=>!removed[i]).sort((a,b)=>pieces[a].z-pieces[b].z);
  const dragI=drag&&drag.moved?drag.i:-1;
  const ping=drag&&drag.moved&&legalDest(drag.i);
  for(const i of order){
    if(i===dragI)continue;
    const p=pieces[i];let {x,y}=piecePos(p);
    if(p.ret){const k=Math.min(1,(t-p.ret.t0)/220),e=1-(1-k)*(1-k);x+=p.ret.dx*(1-e);y+=p.ret.dy*(1-e);if(k>=1)p.ret=null;}
    if(p.shake>t)x+=Math.sin((p.shake-t)/18)*5;
    drawPasta(p,x,y,PL.R,{flash:p.flash>t&&Math.floor(t/110)%2===0});
  }
  if(dragI>=0){const p=pieces[dragI];const {x,y}=piecePos(p);drawPasta(p,x+p.drag.dx,y+p.drag.dy,PL.R,{lift:true,scale:1.08,glow:!!ping});}
}
function drawMiniPasta(c,x,y,len,th){
  ctx.save();ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-len/2,y);ctx.lineTo(x+len/2,y);
  ctx.strokeStyle=COLORS[c].d;ctx.lineWidth=th+3;ctx.stroke();ctx.strokeStyle=COLORS[c].f;ctx.lineWidth=th;ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-len/2+2,y-th*0.22);ctx.lineTo(x+len/2-2,y-th*0.22);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=th*0.3;ctx.stroke();
  ctx.restore();
}
function drawJar(s,t){
  const v=vjars[s];const x=JAR.xs[s],y=JAR.y,w=JAR.w,h=JAR.h;
  if(!v){ctx.save();ctx.setLineDash([6,6]);rr(x,y,w,h,14);ctx.strokeStyle='rgba(120,90,60,.25)';ctx.lineWidth=2;ctx.stroke();ctx.restore();return;}
  let dy=0,sc=1,al=1;
  if(v.state==='entering'){const k=Math.min(1,(t-v.t0)/300);const e=1-Math.pow(1-k,3);dy=(1-e)*60;al=e;if(k>=1)v.state='in';}
  if(v.state==='leaving'){const k=Math.min(1,(t-v.t0)/420);sc=1+0.18*Math.sin(k*Math.PI);al=k<0.6?1:1-(k-0.6)/0.4;dy=-k*k*90;}
  const col=COLORS[v.c];const cap=L.cap;
  const hl=drag&&drag.moved&&pieces[drag.i].c===v.c&&legalDest(drag.i)==='jar';
  ctx.save();ctx.globalAlpha=al;ctx.translate(x+w/2,y+h/2+dy);ctx.scale(sc,sc);ctx.translate(-w/2,-h/2);
  if(hl){ctx.save();ctx.shadowColor='#ffe066';ctx.shadowBlur=22+8*Math.sin(t/120);rr(-3,-3,w+6,h+6,18);ctx.fillStyle='rgba(255,230,120,.55)';ctx.fill();ctx.restore();}
  ctx.save();ctx.shadowColor='rgba(60,30,10,.2)';ctx.shadowBlur=12;ctx.shadowOffsetY=6;rr(0,10,w,h-10,14);ctx.fillStyle='rgba(255,255,255,.62)';ctx.fill();ctx.restore();
  // содержимое
  const inner={x:6,y:26,w:w-12,h:h-34};const bh=(inner.h-4*(cap-1))/cap;
  for(let k=0;k<v.shown;k++){const by=inner.y+inner.h-(k+1)*bh-k*4;drawMiniPasta(v.c,inner.x+inner.w/2,by+bh/2,inner.w-10,Math.min(bh-4,16));}
  rr(0,10,w,h-10,14);ctx.strokeStyle=col.d;ctx.lineWidth=2.5;ctx.stroke();
  // блик стекла
  ctx.beginPath();ctx.moveTo(10,24);ctx.lineTo(10,h-18);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();
  // крышка
  rr(w*0.12,0,w*0.76,18,6);ctx.fillStyle=col.f;ctx.fill();ctx.strokeStyle=col.d;ctx.lineWidth=2;ctx.stroke();
  rr(w*0.12,0,w*0.76,7,3);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();
  // счётчик
  ctx.fillStyle=v.state==='leaving'?'#2e8514':col.d;ctx.font='800 15px -apple-system,Segoe UI,Roboto,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(v.state==='leaving'?'✓ DONE':`${Math.min(v.shown,cap)}/${cap}`,w/2,h+14);
  ctx.restore();
}
function drawNext(){
  const list=L.queue.slice(qi,qi+4);
  ctx.save();ctx.font='800 13px -apple-system,Segoe UI,Roboto,sans-serif';ctx.textBaseline='middle';
  const iw=22,gap=8,lw=48;const tot=lw+(list.length?list.length*(iw+gap):0);const x0=W/2-tot/2;
  ctx.fillStyle='#a58a6a';ctx.textAlign='left';ctx.fillText(list.length?'NEXT':'',x0,NEXT.y+NEXT.h/2);
  list.forEach((c,k)=>{const x=x0+lw+k*(iw+gap),y=NEXT.y+2;
    rr(x,y+4,iw,NEXT.h-6,5);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fill();ctx.strokeStyle=COLORS[c].d;ctx.lineWidth=1.5;ctx.stroke();
    rr(x+3,y,iw-6,7,2);ctx.fillStyle=COLORS[c].f;ctx.fill();
  });
  ctx.restore();
}
function drawTray(t){
  const hl=drag&&drag.moved&&legalDest(drag.i)==='buf';
  ctx.save();
  if(hl){ctx.shadowColor='#ffe066';ctx.shadowBlur=22+8*Math.sin(t/120);rr(TRAY.x-3,TRAY.y-3,TRAY.w+6,TRAY.h+6,18);ctx.fillStyle='rgba(255,230,120,.55)';ctx.fill();ctx.shadowBlur=0;}
  ctx.shadowColor='rgba(60,30,10,.18)';ctx.shadowBlur=12;ctx.shadowOffsetY=5;
  rr(TRAY.x,TRAY.y,TRAY.w,TRAY.h,16);ctx.fillStyle='#d9a86c';ctx.fill();ctx.restore();
  rr(TRAY.x,TRAY.y,TRAY.w,TRAY.h,16);ctx.strokeStyle='#a9743d';ctx.lineWidth=2.5;ctx.stroke();
  ctx.save();ctx.translate(TRAY.x+18,TRAY.y+TRAY.h/2);ctx.rotate(-Math.PI/2);ctx.fillStyle='#7a4d1f';ctx.font='800 12px -apple-system,Segoe UI,Roboto,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('TRAY',0,0);ctx.restore();
  for(let k=0;k<L.buf;k++){const c=trayCell(k);rr(c.x-TRAY.cell/2,c.y-TRAY.cell/2,TRAY.cell,TRAY.cell,12);ctx.fillStyle='rgba(120,70,30,.28)';ctx.fill();ctx.strokeStyle='rgba(90,50,20,.35)';ctx.lineWidth=1.5;ctx.stroke();}
  for(const e of vtray){e.x+=(e.tx-e.x)*0.25;drawMiniPasta(pieces[e.i].c,e.x,e.y,TRAY.cell-16,14);}
}
function drawFlights(t){
  for(let k=flights.length-1;k>=0;k--){
    const f=flights[k];if(t<f.t0)continue;
    const kk=Math.min(1,(t-f.t0)/f.dur),e=1-Math.pow(1-kk,2);
    const x=f.from.x+(f.to.x-f.from.x)*e,y=f.from.y+(f.to.y-f.from.y)*e-Math.sin(kk*Math.PI)*40;
    drawPasta({c:f.c,s:f.s,a:f.a+kk*1.2},x,y,PL.R,{scale:1-0.45*kk,alpha:1});
    if(kk>=1){flights.splice(k,1);if(f.onLand)f.onLand();}
  }
}
function draw(){
  const t=now();
  for(let k=0;k<events.length;k++){if(events[k].t<=t){const e=events.splice(k,1)[0];k--;e.fn();}}
  ctx.clearRect(0,0,W,H);
  if(!L||!playing)return;
  drawPlate();drawPile(t);drawTray(t);drawNext();
  for(let s=0;s<L.slots;s++)drawJar(s,t);
  drawFlights(t);
}

/* ---------- Конфетти ---------- */
let confetti=[],confettiOn=false;
function startConfetti(){
  confetti=[];confettiOn=true;
  const w=fxCvs.width/DPR,h=fxCvs.height/DPR;
  const cols=['#ff5964','#f8c92e','#3a7cf6','#45c454','#ff8ac2','#59e0e8','#b04ef5','#ff9b2e'];
  for(let i=0;i<130;i++)confetti.push({x:Math.random()*w,y:-Math.random()*h*0.8,vy:110+Math.random()*160,ph:Math.random()*7,om:2+Math.random()*3,s:4+Math.random()*6,c:cols[(Math.random()*cols.length)|0],r:Math.random()*7});
}
function stopConfetti(){confettiOn=false;fxCtx.clearRect(0,0,fxCvs.width,fxCvs.height);}
function drawConfetti(dt){
  if(!confettiOn)return;const w=fxCvs.width/DPR,h=fxCvs.height/DPR;fxCtx.clearRect(0,0,w,h);
  for(const p of confetti){p.y+=p.vy*dt;p.ph+=p.om*dt;p.r+=3*dt;if(p.y>h+20){p.y=-20;p.x=Math.random()*w;}
    fxCtx.save();fxCtx.translate(p.x+Math.sin(p.ph)*14,p.y);fxCtx.rotate(p.r);fxCtx.scale(1,Math.abs(Math.cos(p.ph)));fxCtx.fillStyle=p.c;fxCtx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);fxCtx.restore();}
}

/* ---------- Экраны ---------- */
function win(){if(!playing)return;startConfetti();$('winMoves').textContent='Moves: '+moves;$('winOv').classList.remove('hidden');}
function loseWith(txt){$('loseRibbon').textContent=txt;$('loseOv').classList.remove('hidden');}
$('nextBtn').onclick=()=>{stopConfetti();$('winOv').classList.add('hidden');ProtoKit.play(level%LEVELS.length+1);};
$('retryBtn').onclick=()=>{$('loseOv').classList.add('hidden');buildLevel(level);};
$('loseUndoBtn').onclick=()=>undo();
$('undoBtn').onclick=()=>undo();
$('playBtn').onclick=()=>ProtoKit.play(level);
function renderLevelRow(){
  const row=$('lvlRow');row.textContent='';
  for(let i=1;i<=LEVELS.length;i++){const b=document.createElement('button');b.className='lvlBtn'+(i===level?' sel':'');b.textContent=i;b.onclick=()=>ProtoKit.play(i);row.appendChild(b);}
}
$('gearBtn').onclick=()=>{if(playing)$('menuOv').classList.remove('hidden');};
$('mClose').onclick=()=>$('menuOv').classList.add('hidden');
$('mRestart').onclick=()=>{$('menuOv').classList.add('hidden');buildLevel(level);};
$('mHome').onclick=()=>{$('menuOv').classList.add('hidden');stopConfetti();ProtoKit.home();};

/* ---------- Тест-хук ---------- */
window.__game={
  get state(){return {level,moves,over,playing,removed:[...removed],jars:jars.map(j=>j?{...j}:null),qi,tray:[...tray],pieces:pieces.map(p=>({c:p.c,s:p.s,z:p.z}))};},
  free(){return legalMoves();},
  tap(i){tapPiece(i);},
  move(i,dest){return doMove(i,dest,null);},
  undo(){undo();},
  solution(){return [...LEVELS[level-1].solution];},
  load(n){buildLevel(n);},
  bounds(){return boardBounds();},
  pos(i){const p=piecePos(pieces[i]);return {x:p.x,y:p.y+$('stage').offsetTop};},
  jarPos(s){const p=jarCenter(s);return {x:p.x,y:p.y+$('stage').offsetTop};},
  trayPos(){return {x:TRAY.x+TRAY.w/2,y:TRAY.y+TRAY.h/2+$('stage').offsetTop};},
};

/* ---------- Цикл ---------- */
let last=now();
function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;draw();drawConfetti(dt);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
$('homeIcon').appendChild(ProtoKit.iconTile(104));
ProtoKit.init({slug:'pastasort',name:'Color Pasta Sort',icon:'icon.png',iconEmoji:'🍝',accent:'#e8632b',levels:LEVELS.length,
  startLevel(n){level=n;localStorage.setItem('pastaSort.level',n);
    $('home').classList.add('hidden');buildLevel(n);},
  showHome(){playing=false;over=false;$('winOv').classList.add('hidden');$('loseOv').classList.add('hidden');
    stopConfetti();renderLevelRow();$('home').classList.remove('hidden');},
});

</script>
