    const px = pr.x + pr.w * (amin[0] + (amax[0] - amin[0]) * piv[0]) + pos[0];
    const py = pr.y + pr.h * (amin[1] + (amax[1] - amin[1]) * piv[1]) + pos[1];
    n.rect = { x: px - piv[0] * w, y: py - piv[1] * h, w, h };
  }

  function applyArf(n, pr) {
    if (!n.arf || !n.arf[0]) return;

    const r = n.rect;
    if (mode === 1) { r.h = r.w / ratio; }
    else if (mode === 2) { r.w = r.h * ratio; }

  }

  function prefH(n) {
    if (!n.active) return 0;
    if (n.le && n.le.m_PreferredHeight != null && n.le.m_PreferredHeight >= 0) return n.le.m_PreferredHeight;
    const L = n.lay;
    if (L) {
      const pad = L.pad || {}, pv = (pad.m_Top || 0) + (pad.m_Bottom || 0);

  function layout(n, pr, placed) {

  /* ---------------- drawing ---------------- */
  function tinted(im, c) {

  function drawSliced(ctx, im, b, x, y, w, h, ppm, ss) {

  function drawImage(ctx, n, x, y, w, h) {

  /* ---- TMP-like text ---- */
  const FONTS = {
    "LilitaOne - Regular SDF With Shadow": { fam: "LilitaOne", fx: "shadow" },

  function measureLines(ctx, runs, fam, scale, maxW, wrap, cs) {

  function drawText(ctx, n, x, y, w, h, alpha) {
    const T = n.txt;

    if ((T.st || 0) & 8) s = s.toLowerCase();
    const F = FONTS[T.font] || { fam: "LilitaOne", fx: null };
    const fam = F.fam;

  function drawNode(ctx, n, H, alpha) {

  /* ---------------- tweens ---------------- */

      if (now < tw.t0) continue;
      const p = Math.min(1, (now - tw.t0) / tw.dur), e = tw.ease(p);
      for (const k in tw.to) {
        const a = tw.from[k], b = tw.to[k];
        tw.obj[k] = Array.isArray(b) ? b.map((v, j) => a[j] + (v - a[j]) * e) : a + (b - a) * e;
      }
      if (p >= 1) { tweens.splice(i, 1); tw.res(); }
    }
    return tweens.length > 0;
  }
  function killTweens(obj) { for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].obj === obj) tweens.splice(i, 1); }

  /* ---------------- ScrollRect (vertical drag) ---------------- */
  function makeScroll(scroll, content) {
    let y0 = 0, d0 = 0, moved = false;
    const clamp = () => {
      const vp = content.parent.rect, max = Math.max(0, content.rect.h - vp.h);
      content.dy = Math.max(0, Math.min(max, content.dy));
    };
    scroll.onDown = (x, y) => { y0 = y; d0 = content.dy; moved = false; };
    scroll.onDrag = (x, y) => { content.dy = d0 + (y - y0); if (Math.abs(y - y0) > 12) moved = true; clamp(); UI.dirty = true; };
    scroll.onUp = () => {};
    scroll.wasDrag = () => moved;
    scroll.mask = true;
    scroll.btn = true;
  }

  /* ---------------- UI root ---------------- */
  const UI = {
    Node, tween, killTweens, EASE, makeScroll, prefH, dirty: true, layers: [], W: REF_W, H: 2293, canvas: null, ctx: null,
    create(viewName) {
      const src = VIEWS[viewName];
      if (!src) throw new Error("view not found: " + viewName);
      const n = new Node(src, null);
      return n;
    },
    push(node, opts = {}) { node.layer = opts.layer || 0; this.layers.push(node); this.layers.sort((a, b) => a.layer - b.layer); this.dirty = true; return node; },
    remove(node) { const i = this.layers.indexOf(node); if (i >= 0) this.layers.splice(i, 1); this.dirty = true; },
    mount(canvas) {
      this.canvas = canvas; this.ctx = canvas.getContext("2d");
      const resize = () => {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(rect.width * dpr); canvas.height = Math.round(rect.height * dpr);
        const asp = rect.width / rect.height;
        if (asp > REF_W / REF_H) { this.H = REF_H; this.W = REF_H * asp; } else { this.W = REF_W; this.H = REF_W / asp; }
        this.scale = canvas.width / this.W;
        this.dirty = true;
      };
      resize();
      new ResizeObserver(resize).observe(canvas);
      const toLocal = (e) => {
        const rect = canvas.getBoundingClientRect();
        return [(e.clientX - rect.left) / rect.width * this.W, this.H - (e.clientY - rect.top) / rect.height * this.H];
      };
      let pressed = null, scrollAnc = null, downY = 0;
      canvas.addEventListener("pointerdown", (e) => {
        const [x, y] = toLocal(e);
        for (let i = this.layers.length - 1; i >= 0; i--) {
          const L = this.layers[i];
          if (!L.active) continue;
          const h = hit(L, x, y, this.H);
          if (h) {
            const handler = findHandler(h);
            if (handler && handler.onDown) handler.onDown(x, y, e);
            pressed = handler;
            scrollAnc = null; downY = y;
            for (let c = h.parent; c; c = c.parent) if (c.onDrag && c !== handler) { scrollAnc = c; break; }
            if (handler && handler.onClick) UI.pressFx(handler, true);
            return;
          }
        }
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!pressed) return;
        const [x, y] = toLocal(e);
        if (scrollAnc && pressed !== scrollAnc && Math.abs(y - downY) > 15) {
          if (pressed.onClick) UI.pressFx(pressed, false);
          pressed = scrollAnc; pressed.onDown(x, downY, e);
        }
        if (pressed.onDrag) pressed.onDrag(x, y, e);
      });
      const up = (e) => {
        if (!pressed) return;
        const p = pressed; pressed = null;
        const [x, y] = toLocal(e);
        if (p.onUp) p.onUp(x, y, e);
        if (p.onClick) {
          UI.pressFx(p, false);
          const r = p.rect;
          if (x >= r.x - 20 && x <= r.x + r.w + 20 && y >= r.y - 20 && y <= r.y + r.h + 20) { UI.sfx && UI.sfx("click"); p.onClick(e); }
        }
      };
      canvas.addEventListener("pointerup", up);
      canvas.addEventListener("pointercancel", up);
      const loop = (now) => {
        const busy = stepTweens(now);
        if (this.onFrame) this.onFrame(now);
        if (busy || this.dirty || this.animating) this.render();
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    },
    pressFx(n, down) {
      const t = n.sc && n.sc.includes("ButtonAnimations") ? n : (n.parent && n.parent.sc.includes("ButtonAnimations") ? n.parent : null);
      if (!t) return;
      killTweens(t);
      tween(t, { scale: down ? [0.92, 0.92] : [1, 1] }, down ? 80 : 160, down ? "outQuad" : "outBack");
    },
    render() {
      this.dirty = false;
      const ctx = this.ctx, s = this.scale;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = this.clearColor || "#1b2240";
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      ctx.setTransform(s, 0, 0, s, 0, 0);
      const screen = { x: 0, y: 0, w: this.W, h: this.H };
      for (const L of this.layers) {
        if (!L.active) continue;
        layout(L, screen, false);
        drawNode(ctx, L, this.H, 1);
      }
    },
    layoutNow() { const screen = { x: 0, y: 0, w: this.W, h: this.H }; for (const L of this.layers) layout(L, screen, false); },
  };
  window.UI = UI;
})();

/* ===== state-machine.js ===== */
/* Port of StarkGames template StateMachine (Common/ApplicationStates/Public/StateMachine.cs).
   - chain of states root..top; every screen/popup is a state that owns its view
   - goTo(type,args): existing in chain -> close above + resume; else walk up from top:
       creates(type) -> close collected, push as child; accepts(type) -> class from nearest ancestor
       that creates it, pushed under the accepting state (its view stays visible); else collect & go up
   - lock (isProcessing) covers close + init only; execute/resume run after the lock is released
   - goBack(): close top, parent is NOT resumed
   - StateTarget = deferred goTo, passed to screens as their exits */
(function () {
  const log = [];
  const listeners = [];
  function emit(kind, info) {
    const e = { t: performance.now(), kind, info };
    log.push(e); if (log.length > 300) log.shift();
    listeners.forEach((f) => f(e));
  }

  class State {
    constructor(sm, args, parent) { this.sm = sm; this.args = args || {}; this.parent = parent; this.views = []; this.closed = false; }
    get type() { return this.constructor.type; }
    creates() { return {}; }        // { TypeKey: Class }
    accepts() { return []; }        // [TypeKey]
    async init() {}
    async execute() {}
    async resume() {}
    async stop() { await Promise.all(this.views.map((v) => fadeOut(v))); }
    dispose() { this.views.forEach((v) => UI.remove(v)); this.views = []; }
    view(name, layer, opts = {}) {
      const v = UI.create(name);
      v.layer = layer; v.modal = opts.modal !== false; v.ownerState = this;
      if (opts.hidden !== false) v.alpha = 0;
      UI.push(v, { layer });
      this.views.push(v);
      v.all("LoadingCircles").forEach((n) => n.show(false));
      return v;
    }
    goTo(type, args, force) { return this.sm.goTo(type, args, force); }
    target(type, args) { return new StateTarget(type, args); }
  }

  class StateTarget {
    constructor(type, args) { this.type = type; this.args = args || {}; }
    go(sm) { return (sm || SM).goTo(this.type, this.args); }
    toString() { return this.type; }
  }

  async function fadeIn(v, d = 200) { UI.killTweens(v); v.active = true; await UI.tween(v, { alpha: 1 }, d, "linear"); }
  async function fadeOut(v, d = 200) { UI.killTweens(v); await UI.tween(v, { alpha: 0 }, d, "linear"); }

  class StateMachine {
    constructor() { this.chain = []; this.busy = false; this.gen = 0; }
    get top() { return this.chain[this.chain.length - 1]; }
    async start(RootClass) {
      const root = new RootClass(this, {}, null);
      this.chain = [root];
      emit("push", { type: RootClass.type, parent: null });
      await root.init();
      await root.execute();
    }
    find(type) { for (let i = this.chain.length - 1; i >= 0; i--) if (this.chain[i].type === type || (this.chain[i].constructor.aliases || []).includes(type)) return i; return -1; }
    goTo(type, args = {}, force = false) {
      if (type instanceof StateTarget) { args = type.args; type = type.type; }
      if (this.busy) { emit("ignored", { type, reason: "busy" }); return Promise.resolve(); }
      return this._goTo(type, args, force);
    }
    async _goTo(type, args, force) {
      this.busy = true;
      const myGen = ++this.gen;
      let isNew = false, st;
      emit("goto", { type, args: describeArgs(args) });
      try {
        const idx = force ? -1 : this.find(type);
        if (idx >= 0) {
          await this.closeAbove(idx);
          st = this.chain[idx];
          st.args = Object.assign(st.args, args);
        } else {
          const toClose = [];
          let created = null;
          for (let i = this.chain.length - 1; i >= 0 && !created; i--) {
            const s = this.chain[i];
            const cr = s.creates();
            if (cr[type]) { created = { parent: s, Cls: cr[type] }; break; }
            if (s.accepts().includes(type)) {
              for (let j = i - 1; j >= 0; j--) { const c2 = this.chain[j].creates(); if (c2[type]) { created = { parent: s, Cls: c2[type] }; break; } }
              if (!created) throw new Error("accepted but no creator for " + type);
              break;
            }
            toClose.push(s);
          }
          if (!created) throw new Error("no state can create " + type);
          await this.closeList(toClose);
          st = new created.Cls(this, args, created.parent);
          this.chain.push(st);
          emit("push", { type, cls: created.Cls.name, parent: created.parent.type });
          await st.init();
          isNew = true;
        }
      } catch (e) {
        console.error("StateMachine> goTo", type, e);
        emit("error", { type, msg: String(e.message || e) });
      } finally {
        this.busy = false;
      }
      if (!st) return;
      try {
        if (isNew) await st.execute(); else { emit("resume", { type }); await st.resume(args); }
      } catch (e) { console.error("StateMachine> execute", type, e); emit("error", { type, msg: String(e.message || e) }); }
    }
    async closeAbove(idx) { const list = this.chain.slice(idx + 1).reverse(); await this.closeList(list); }
    async closeList(list) {
      for (const s of list) {
        const i = this.chain.indexOf(s);
        const above = this.chain.slice(i + 1).reverse().filter((x) => !list.includes(x));
        for (const a of above) await this.closeOne(a);
        await this.closeOne(s);
      }
    }
    async closeOne(s) {
      if (s.closed) return;
      s.closed = true;
      await s.stop();
      s.dispose();
      const i = this.chain.indexOf(s); if (i >= 0) this.chain.splice(i, 1);
      emit("pop", { type: s.type });
    }
    goBack() {
      if (this.busy || this.chain.length < 2) return Promise.resolve();
      this.busy = true;
      emit("back", { type: this.top.type });
      return this.closeOne(this.top).finally(() => (this.busy = false));
    }
  }

  function describeArgs(a) {
    if (!a) return "";
    const out = [];
    for (const k in a) {
      const v = a[k];
      if (v instanceof StateTarget) out.push(k + "→" + v.type);
      else if (typeof v !== "object" && typeof v !== "function") out.push(k + "=" + v);
    }
    return out.join(", ");
  }

  window.State = State;
  window.StateTarget = StateTarget;
  window.StateMachine = StateMachine;
  window.SMLog = { log, on: (f) => listeners.push(f), emit };
  window.fadeIn = fadeIn;
  window.fadeOut = fadeOut;
})();

/* ===== model.js ===== */
/* Services mirroring the template's Public/* models + Size Match game model.
   Configs = APK TextAssets (window.CFG), texts = Localisation en (window.LOC). */
(function () {
  const C = window.CFG;
  const P = C.Parameters;
  const now = () => Date.now();
  const sec = () => Math.floor(Date.now() / 1000);

  /* ---------- persistence (repositories) ---------- */
  const PREFIX = "smr1_icons_r2_";
  const store = {
    get(k, d) { try { const v = localStorage.getItem(PREFIX + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) {} },
    clear() { try { Object.keys(localStorage).filter((k) => k.startsWith(PREFIX)).forEach((k) => localStorage.removeItem(k)); } catch (e) {} },
  };

  function T(key, ...args) {
    let s = (window.LOC && window.LOC[key]) || key;
    return s.replace(/\{(\d+)\}/g, (_, i) => (args[i] == null ? "" : args[i]));
  }
  const fmtNum = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  function fmtTime(s) {
    s = Math.max(0, Math.floor(s));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    if (h >= 24) return Math.floor(h / 24) + "d " + (h % 24) + "h";
    if (h > 0) return h + "h " + String(m).padStart(2, "0") + "m";
    return String(m).padStart(2, "0") + ":" + String(x).padStart(2, "0");
  }
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  /* ---------- User ---------- */
  const user = Object.assign({ coins: P.initialCoinsCount || 500, level: 1, sessions: 0, install: sec(), unshownCoins: 0, adsDay: "", adsToday: 0, noAds: false, name: "Player", avatar: "artist", purchases: [] }, store.get("user", {}));
  user.sessions++;
  const userEvents = [];
  const User = {
    d: user,
    save() { store.set("user", user); },
    get coins() { return user.coins; },
    get level() { return user.level; },
    addCoins(n, fly) { user.coins += n; if (fly) user.unshownCoins += n; User.save(); HUD.refresh(); },
    spend(n) { if (user.coins < n) return false; user.coins -= n; User.save(); HUD.refresh(); return true; },
    incrementLevel() { user.level++; User.save(); userEvents.forEach((f) => f(user.level)); },
    setLevel(l) { user.level = Math.max(1, l); User.save(); userEvents.forEach((f) => f(user.level)); },
    onLevel(f) { userEvents.push(f); },
    limitedAdsLeft() { const d = new Date().toDateString(); if (user.adsDay !== d) { user.adsDay = d; user.adsToday = 0; } return 9 - user.adsToday; },
    useLimitedAd() { User.limitedAdsLeft(); user.adsToday++; User.save(); },
  };
  User.save();

  /* ---------- Settings ---------- */
  const settings = Object.assign({ sound: true, music: true, vibro: true }, store.get("settings", {}));
  const Settings = { d: settings, set(k, v) { settings[k] = v; store.set("settings", settings); } };

  /* ---------- Lives (T:Public/Lives/Lives.cs) ---------- */
  const lives = Object.assign({ count: P.livesCountDefault, t0: 0 }, store.get("lives", {}));
  const Lives = {
    get active() { return user.level >= P.livesUnlockLevel; },
    tick() {
      if (lives.count >= P.livesRecoverLimit) { lives.t0 = 0; return; }
      if (!lives.t0) lives.t0 = sec();
      const el = sec() - lives.t0, n = Math.floor(el / P.livesRecoverTime);
      if (n > 0) { lives.count = Math.min(P.livesRecoverLimit, lives.count + n); lives.t0 = lives.count >= P.livesRecoverLimit ? 0 : lives.t0 + n * P.livesRecoverTime; store.set("lives", lives); }
    },
    get count() { Lives.tick(); return lives.count; },
    get canPlay() { return !Lives.active || Lives.count > 0; },
    get full() { return Lives.count >= P.livesRecoverLimit; },
    get nextIn() { Lives.tick(); return lives.t0 ? P.livesRecoverTime - (sec() - lives.t0) : 0; },
    loseLife() { if (!Lives.active || lives.count <= 0) return; if (lives.count >= P.livesRecoverLimit) lives.t0 = sec(); lives.count--; store.set("lives", lives); },
    add(n) { lives.count += n; if (lives.count >= P.livesRecoverLimit) lives.t0 = 0; store.set("lives", lives); },
  };

  /* ---------- Boosters (BoosterInventory) ---------- */
  const BCFG = {}; C.Boosters.boosters.forEach((b) => (BCFG[b.boosterId] = b));
  const inv = Object.assign({ granted: {} }, store.get("boosterInventory", {}));
  const Boosters = {
    cfg: BCFG,
    count(id) { return inv[id] || 0; },
    unlocked(id) { return user.level >= BCFG[id].unlockLevel; },
    add(id, n) { inv[id] = (inv[id] || 0) + n; store.set("boosterInventory", inv); },
    trySpend(id) { if (!inv[id]) return false; inv[id]--; store.set("boosterInventory", inv); return true; },
    grantUnlocks() { for (const id in BCFG) if (Boosters.unlocked(id) && !inv.granted[id]) { inv.granted[id] = 1; Boosters.add(id, BCFG[id].initialCount); } store.set("boosterInventory", inv); },
  };
  Boosters.grantUnlocks();
  User.onLevel(() => Boosters.grantUnlocks());

  /* ---------- Ads (AdsGamePlayLogic) ---------- */
  const adsState = Object.assign({ last: 0, perPlacement: {} }, store.get("ads", {}));
  const Ads = {
    canInterstitial(placement) {
      const A = C.Ads;
      if (!A.enabled || user.noAds || user.level < A.interstitialMinLevelToShow) return false;
      const p = A.interstitialPlacements.find((x) => x.placement === placement && x.segment === "Default");
      if (!p || !p.enabled || user.level < p.minLevel) return false;
      if (now() - adsState.last < A.interstitialGlobalCooldownSeconds * 1000) return false;
      const lp = adsState.perPlacement[placement] || 0;

      if (p.showEveryNLevels === 0) return true;

    },
    shown(placement) { adsState.last = now(); adsState.perPlacement[placement] = now(); store.set("ads", adsState); },

  };

  /* ---------- Products / Store ---------- */
  function priceOf(productId) {
    if (!productId) return "";
    const m = { no_ads_8: 7.99, no_ads_10: 9.99 };
    if (m[productId]) return "$" + m[productId];
    const n = /_(\d+)$/.exec(productId);
    return n ? "$" + (Number(n[1]) - 0.01).toFixed(2) : "$0.99";
  }
  const daily = store.get("dailyItems", {});
  const StoreSvc = {
    items: C.Store.items,
    priceOf,
    dailyReadyIn(item) { const t = daily[item.itemId] || 0; return Math.max(0, t + item.priceInTimeSeconds - sec()); },
    collectDaily(item) { daily[item.itemId] = sec(); store.set("dailyItems", daily); },
    coinBonusActive() { return sec() - user.install < 604800; },
  };

  /* ---------- Offers (starter + daily segmented) ---------- */
  const offersState = Object.assign({ bought: {} }, store.get("offers", {}));
  const Offers = {
    starter() {
      const o = C.Offers.offers.find((x) => x.offerId === "Starter_1");
      if (!o || offersState.bought.Starter_1 || user.noAds) return null;
      return { id: "Starter_1", productId: o.androidProductId, rewards: o.rewards, bonus: 300, ends: 0, nameToken: "Starter_1", icon: VIS.offer("Starter_1") };
    },
    daily() {
      const day = Math.floor((Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), new Date().getUTCDate()) - Date.UTC(2026, 0, 5)) / 86400000);
      const group = (((day % 5) + 5) % 5) + 1;
      const key = "daily_" + new Date().toISOString().slice(0, 10);
      if (offersState.bought[key]) return null;
      const seg = C.OfferSegmentation.offerGroups[group].contentTypes.Comfort.segments["2"];
      const content = C.OfferContent.contents[seg.contentId];
      const end = new Date(); end.setUTCHours(24, 0, 0, 0);
      return { id: key, group, productId: seg.androidProductId, rewards: content.rewards, bonus: seg.bonus, ends: Math.floor(end / 1000), icon: VIS.offer(group), nameToken: "Offer_" + group };
    },
    active() { return [Offers.starter(), Offers.daily()].filter(Boolean); },
    markBought(o) { offersState.bought[o.id] = 1; store.set("offers", offersState); },
    failOffer() { return C.FailOfferContent.entries.find((e) => e.segmentId === 2 && e.contentType === "Comfort"); },
    oobOffer() { return C.OutOfBoosterOfferContent.entries.find((e) => e.segmentId === 2 && e.contentType === "Comfort"); },
  };

  /* ---------- Rewards (RewardGiver + BoosterRewardGiver) ---------- */
  function giveRewards(list, fly) {
    for (const r of list) {
      if (BCFG[r.rewardId]) Boosters.add(r.rewardId, r.rewardValue);
      else if (r.rewardId === "Coin") User.addCoins(r.rewardValue, fly);

  const MovesRouter = { target: null, give(n) { if (MovesRouter.target) MovesRouter.target.addMoves(n); } };

  /* ---------- Visual config ---------- */
  const V = window.VISUALS || {};
  const VIS = {
    booster(id) { const b = (V.boosterVisuals || []).find((x) => x.BoosterId === id); return b && b.Icon; },

    reward(id) { if (BCFG[id]) return VIS.booster(id); const b = (V.rewardVisuals || []).find((x) => x.RewardId === id); return b && b.Icon; },
    offer(id) { const b = (V.offerVisuals || []).find((x) => String(x.OfferId) === String(id)); return b && b.MainIcon; },
    avatar(id) { const b = (V.avatarVisuals || []).find((x) => x.AvatarId === id); return b && b.Icon; },
    avatars() { return (V.avatarVisuals || []).map((x) => x.AvatarId); },
    lava: V.lavaQuestVisual || {},
    arena: V.starArenaVisual || {},
  };

  /* ---------- Lava Quest (T:Public/LavaQuest/LavaQuest.cs) ---------- */
  const LQ = C.LavaQuest;
  const lq = Object.assign({ phase: "Ready", stage: 0, bots: 0, end: 0, cooldownEnd: 0, lastPrompt: -99, tutorialSeen: false, counted: 0, schedule: [] }, store.get("lavaQuest", {}));
  const LavaQuest = {
    STAGES: 7,
    d: lq,
    save() { store.set("lavaQuest", lq); },
    get unlocked() { return user.level >= LQ.unlockLevel; },
    phase() {

    PAIRS: 5, STARS_PER_PAIR: 3, MIN: 0.04, MAX: 25, TOL: 4,
    score(guess, truth) { return Math.round(100 * Math.max(0, 1 - Math.abs(Math.log(guess / truth)) / Math.log(Rules.TOL))); },
    stars(score) { return score >= 75 ? 3 : score >= 50 ? 2 : score >= 25 ? 1 : 0; },
    verdict(score) { return score >= 90 ? ["NailedIt", "#7ED957"] : score >= 70 ? ["Close", "#C6E86A"] : score >= 45 ? ["OffABit", "#FFCC66"] : ["WayOff", "#FF7A7A"]; },
    sliderToGuess(t) { return Math.exp(Math.log(Rules.MIN) + t * (Math.log(Rules.MAX) - Math.log(Rules.MIN))); },
    guessToSlider(g) { return (Math.log(g) - Math.log(Rules.MIN)) / (Math.log(Rules.MAX) - Math.log(Rules.MIN)); },

    }

      const old = new Set(this.pairs.map((p) => p.ref.key + "|" + p.guess.key));
      let best = null;
      for (let a = 0; a < 200; a++) {
        const sh = objs.slice().sort(() => Math.random() - 0.5);
        const pairs = []; for (let i = 0; i < 10; i += 2) pairs.push({ ref: sh[i], guess: sh[i + 1] });
        const ok = pairs.every((p) => { const t = p.guess.size / p.ref.size; return t >= Rules.MIN && t <= Rules.MAX; });
        const fresh = pairs.filter((p) => !old.has(p.ref.key + "|" + p.guess.key)).length;

    layoutObjects(reveal, ghostScale) {
      UI.layoutNow();
      const p = this.round.pair;
      const top = this.ref.parent.rect, bot = this.guess.parent.rect;
      const dims = (o) => { const vb = o.viewBox || [1, 1]; return o.axis === "h" ? [o.size * vb[0] / vb[1], o.size] : [o.size, o.size * vb[1] / vb[0]]; };
      const [rw, rh] = dims(p.ref), [gw0, gh0] = dims(p.guess);

      const truth = this.round.truth, gv = this.round.guessV;
      const gFactor = gv / truth; // displayed guess = real guess size * guess/truth
      const need = (f) => Math.max((gw0 * f * ppm) / (bot.w - 40), (gh0 * f * ppm) / (bot.h - 40 - 64));
      let over = need(gFactor);
      if (reveal) over = Math.max(over, need(1));
      if (over > 1) ppm /= over;
      const setSize = (n, w, h) => { n.r.size = [w, h]; };
      setSize(this.ref, rw * ppm, rh * ppm);
      setSize(this.guess, gw0 * ppm * gFactor, gh0 * ppm * gFactor);

      this.refreshBoosters();

      this.ghost.show(true); this.ghost.img.c = [1, 0.35, 0.35, 0.45]; this.ghost.alpha = 1;
      this.layoutObjects(true, gFactor);

      UI.animating = true;

      clearInterval(tick); anim();

      const cnt = { n: 0 };
      const upd = () => score.txt.s = Math.round(cnt.n) + "<size=40%><color=#9FB0CF>/100</color></size>";
      const t2 = setInterval(() => { upd(); UI.dirty = true; }, 16);
      UI.tween(cnt, { n: res.score }, 700, "outQuad").then(() => { clearInterval(t2); upd(); UI.dirty = true; });

    build() {
      const v = this.v, content = v.find("ItemsRoot/Viewport/Content");
      const mk = (name, parent) => { const n = UI.create(name); n.parent = parent; return n; };
      const offerRoot = content.find("OfferRoot"); offerRoot.k = [];

        const n = mk("StoreOfferView", offerRoot); fillOffer(n, o);

        offerRoot.k.push(n);
      });
      const noAds = content.find("NoAdsItemRoot"); noAds.k = [];
      if (!User.d.noAds) {
        const item = StoreSvc.items.find((i) => i.itemId === "NoAds");
        const n = mk("NoAdsStoreItemView", noAds); hideLoading(n);
        n.find("Button/Root/Background/Text").text(priceStr(item.androidProductId));

      }
      const bonus = StoreSvc.coinBonusActive();
      content.find("CoinsItemsRoot/CoinsBonusBackground").show(bonus);
      content.find("CoinsBonusPlaceholder").show(bonus);
      const fill = (rootName, cat, viewName) => {
        const root = content.find(rootName); root.k = root.k.filter((k) => k.name === "CoinsBonusBackground");
        StoreSvc.items.filter((i) => i.storeCategory === cat).forEach((it) => {
          const n = mk(viewName, root); hideLoading(n);

            n.find("IconWithoutBonus").sprite(icon); n.find("IconWithoutBonus").img.pa = 1; n.find("IconWithBonus").show(false);
            n.find("CountWithoutBonus").text(fmtNum(it.rewardValue)); n.find("CountWithBonus").show(false);

            n.find("StoreItemVerticalBackground/BonusCountRoot").show(false);
            n.find("Button/Root/Background/Text").text(priceStr(it.androidProductId));
            btn(n, "Button", () => this.buyReal(it));
          } else if (viewName === "BoosterStoreItemView") {
            n.find("Image").sprite(icon); n.find("Image").img.pa = 1; n.find("Count").text("x" + it.rewardValue);
            n.deep("PriceRoot").find("Text").text(fmtNum(it.priceInCoins));
            btn(n, "Button", () => this.buyCoins(it));
          } else {
            n.find("Image").sprite(icon); n.find("Image").img.pa = 1; n.find("Count").text("x" + it.rewardValue);
            n.dailyItem = it;
            btn(n, "Button", () => this.buyDaily(it));
          }
          root.k.push(n);
        });
      };
      fill("CoinsItemsRoot", 1, "CoinStoreItemView");
      fill("BoostersItemsRoot", 2, "BoosterStoreItemView");
      fill("DailyItemsRoot", 3, "DailyStoreItemView");
      this.tick();

    tick() {
      const content = this.v.find("ItemsRoot/Viewport/Content");

      content.find("DailyItemsRoot").k.forEach((n) => {

        const b = n.find("Button/Root/Background");
        b.find("TimerRoot").show(left > 0); b.find("FreeTextRoot").show(left <= 0);
        b.find("TimerRoot/PriceText").text(fmtTime(left));
        b.find("FreeTextRoot/AdsIcon").show(it.priceType === 3 || /Ads/.test(it.rewardType || "") || it.itemId === "Daily-2");
      });
      UI.dirty = true;
    }
    async buyReal(it) {
      await FakeIAP.buy(it.androidProductId);
      const bonus = it.rewardType === "Coin" && StoreSvc.coinBonusActive() ? 2 : 1;
      const rewards = [{ rewardId: it.rewardType, rewardValue: it.rewardValue * bonus }];
      giveRewards(rewards);
      SM.goTo("RewardState", { rewards, icon: VIS.storeItem(it.itemId) || VIS.reward(it.rewardType), StateTarget: new StateTarget("StoreCoreState") });
    }
    buyCoins(it) {
      if (!User.spend(it.priceInCoins)) return;
      const rewards = [{ rewardId: it.rewardType, rewardValue: it.rewardValue }]; giveRewards(rewards);
      SM.goTo("RewardState", { rewards, icon: VIS.storeItem(it.itemId), StateTarget: new StateTarget("StoreCoreState") });
    }
    buyDaily(it) {
      if (StoreSvc.dailyReadyIn(it) > 0) return;
      const rewards = [{ rewardId: it.rewardType, rewardValue: it.rewardValue }];
      const after = () => { StoreSvc.collectDaily(it); giveRewards(rewards); };
      if (it.itemId === "Daily-2") return SM.goTo("IRewardedAdState", { onRewarded: after, StateTarget: new StateTarget("RewardState", { rewards, icon: VIS.storeItem(it.itemId), StateTarget: new StateTarget("StoreCoreState") }) });

  class LQEnterState extends State {

  class LQTutorialState extends State {
    static type = "LQTutorial";
    async init() {
      const v = (this.v = this.view("LavaQuestTutorialView", LAYER.TOP)), C = M.CFG.LavaQuest;
      v.find("Step1/PlayersText").fmt(C.playersCount); v.find("Step2/LevelsText").fmt(7); v.find("Step3/RewardText").fmt(fmtNum(C.rewardValue1));
      v.click(() => { LavaQuest.d.tutorialSeen = true; LavaQuest.save(); SM.goTo(this.args.next || "LQCore", this.args.nextArgs || { canPlay: LavaQuest.isActive() }); });

    async execute() { await fadeIn(this.v); }

  class LQSearchState extends State {
    static type = "LQSearch";
    async init() {
      const v = (this.v = this.view("LavaQuestSearchView", LAYER.TOP)), C = M.CFG.LavaQuest;
      v.find("PrizeSign/PrizeValue").text(fmtNum(C.rewardValue1));
      if (VIS.lava.Chest) v.find("Chest").sprite(VIS.lava.Chest);
      v.find("TapToContinue").show(false);
      v.deep("AvatarsPile").all("AvatarIcon").forEach((n, i) => { n.sprite(VIS.avatar(VIS.avatars()[i % VIS.avatars().length])); n.img.pa = 1; });
      v.deep("AvatarsPile").all("GreyOverlay").forEach((n) => n.show(false));

      v.click(() => { if (this.ready) { LavaQuest.start(); SM.goTo("LQCore", { canPlay: true }); } });

    async execute() {
      await fadeIn(this.v);
      const st = { n: 0 }; const t = setInterval(() => { this.counter.text(Math.round(st.n) + "/100"); UI.dirty = true; }, 30);
      await UI.tween(st, { n: 100 }, 1800, "outQuad"); clearInterval(t); this.counter.text("100/100");
      this.ready = true; this.v.find("TapToContinue").show(true);
    }
  }
  class LQCoreState extends State {
    static type = "LQCore";
    accepts() { return ["IInterstitialAdState", "IBuyLivesState"]; }
    async init() {
      const a = this.args, v = (this.v = this.view("LavaQuestView", LAYER.TOP)), r = lqRoot(this), d = LavaQuest.d;
      v.find("PrizeSign/PrizeValue").text(fmtNum(M.CFG.LavaQuest.rewardValue1));
      if (VIS.lava.Chest) v.find("Chest").sprite(VIS.lava.Chest);
      v.find("Header/TimerRoot/Timer").text(LavaQuest.isActive() ? fmtTime(d.end - sec()) : "--");
      const failed = a.result === "QuestFailed";
      v.find("Header/FailMessage").show(failed);
      const stage = failed ? 0 : d.stage;
      v.find("Header/StagesRoot/StagesValue").text(stage + "/7");
      v.find("Header/PlayersRoot/PlayersValue").text((LavaQuest.isActive() ? d.bots + 1 : 100) + "/100");
      const isl = v.find("IslandsRoot");
      const all = v.deep("AvatarsGroup").all("AvatarIcon"); all.forEach((n, i) => { n.sprite(VIS.avatar(VIS.avatars()[(i * 5 + 2) % VIS.avatars().length])); n.img.pa = 1; });
      v.deep("AvatarsGroup").all("GreyOverlay").forEach((n) => n.show(false));
      const playable = a.canPlay || (a.result === "StageWon");
      this.v.findPlay = null;
      const pb = v.deep("PlayButtonRoot") || v.deep("PlayButton");
      if (pb) { pb.show(!!a.canPlay && !a.result); btn(pb, ".", () => r.play()); }
      const close = v.deep("CloseButton"); if (close) btn(close, "ClickableArea", () => this.leave());
      const tap = v.deep("TapToContinue"); if (tap) tap.show(!!a.result);
      if (a.result) v.click(() => this.leave());
    }
    leave() { const r = lqRoot(this); if (this.args.result === "QuestCompleted") return SM.goTo("LQVictory", { ContinueTarget: this.args.ContinueTarget }); SM.goTo(this.args.ContinueTarget || r.closeT); }
    async execute() {
      await fadeIn(this.v);
      if (this.args.result === "StageWon") { this.autoClose = setTimeout(() => this.leave(), 7000); }

    dispose() { clearTimeout(this.autoClose); super.dispose(); }

  /* ================= Star Arena ("Shield Arena") ================= */
  class RootStarArenaState extends State {
    static type = "IStarArenaState";
    creates() { return { SAEnter: S.SAEnterState, SATutorial: S.SATutorialState, SACore: S.SACoreState }; }
    accepts() { return ["IInterstitialAdState", "RewardState"]; }
    async execute() {
      const p = StarArena.phase();
      if (p === "Finished") return this.goTo("SACore", { finished: true });
      if (p === "Active") return StarArena.d.tutorialSeen ? this.goTo("SACore") : this.goTo("SATutorial");
      this.goTo("SAEnter");
    }
    get closeT() { return this.args.CloseTarget || new StateTarget("IHomeState"); }

  const saRoot = (st) => { let p = st.parent; while (p && p.type !== "IStarArenaState") p = p.parent; return p; };
  class SAEnterState extends State {
    static type = "SAEnter";
    async init() {
      const v = (this.v = this.view("StarArenaEnterView", LAYER.TOP)), r = saRoot(this);
      v.find("Window/DescriptionTextRoot/DescriptionText").text(T("StarArena_EnterMessage_Text").replace(/\\n/g, "\n"));

    async execute() { await fadeIn(this.v); }
  }
  class SACoreState extends State {
    static type = "SACore";
    async init() {
      const a = this.args, v = (this.v = this.view("StarArenaView", LAYER.TOP)), r = saRoot(this), d = StarArena.d, C = M.CFG.StarArena;
      v.find("Header/TimerRoot/Timer").text(a.finished ? T("StarArena_Finished_Text") : fmtTime(StarArena.endsIn()));
      v.find("Header/RankRoot/RankValue").text("#" + StarArena.rank());
      const steps = [1, 2, 3, 4, 5].map((i) => v.find("Header/StreakBar/StreakStep" + i));
      steps.forEach((s, i) => s.find("Highlight").show(i === Math.min(d.streak, 4)));
      const content = v.find("Leaderboard/Viewport/Content");
      const rows = d.bots.map((b) => ({ name: b.name, shields: StarArena.botShields(b), av: b.av })).concat([{ name: User.d.name, shields: d.shields, av: User.d.avatar, me: true }]);
      rows.sort((x, y) => y.shields - x.shields || (y.me ? 1 : 0) - (x.me ? 1 : 0));
      const tpl = UI.create("StarArenaRow");
      content.lay = content.lay || { k: "V", sp: 12, pad: { m_Left: 0, m_Right: 0, m_Top: 20, m_Bottom: 300 }, ca: 1, cw: 0, ch: 0 };
      content.fit = [0, 2];
      const chests = (VIS.arena.Chests || []);
      content.k = rows.map((row, i) => {
        const n = tpl.clone(content); n.r.size = [1180, 220];
        n.find("PlaceRoot/PlaceText").text(i + 1); n.find("NameText").text(row.name); n.find("ShieldRoot/ShieldsText").text(row.shields);
        n.find("ShieldRoot/ShieldIcon").sprite(VIS.arena.ShieldIcon); n.find("ShieldRoot/ShieldIcon").img.pa = 1;
        n.deep("AvatarIcon").sprite(VIS.avatar(row.av)); n.deep("AvatarIcon").img.pa = 1;
        n.find("PlayerHighlight").show(!!row.me);
        const rr = n.find("RewardsRoot"); rr.show(i < 5);
        if (i < 3 && chests[i]) { rr.find("ChestImage").sprite(chests[i].Icon); rr.find("RewardAmountText").show(false); rr.find("RewardIconImage").show(false); }
        else if (i < 5) { rr.find("ChestImage").show(false); rr.find("RewardIconImage").sprite(VIS.booster(i === 3 ? "Plus" : "Hint")); rr.find("RewardAmountText").text("x" + (i === 3 ? 2 : 1)); }
        return n;
      });
      UI.makeScroll(v.find("Leaderboard"), content);
      v.find("PinnedPlayerRow").show(false);
      btn(v, "ContinueButtonRoot", () => this.leave());
      const close = v.deep("CloseButton"); if (close) btn(close, "ClickableArea", () => this.leave());
    }
    leave() {
      const r = saRoot(this);
      if (this.args.finished) {
        const place = StarArena.claim();
        const RW = { 1: [["Coin", 5000], ["Plus", 2], ["Hint", 2], ["Magnet", 1]], 2: [["Coin", 2500], ["Plus", 2], ["Hint", 1], ["Magnet", 1]], 3: [["Coin", 1000], ["Plus", 2], ["Hint", 1], ["Magnet", 1]], 4: [["Plus", 2]], 5: [["Hint", 1]] }[place];
        if (RW) { const rewards = RW.map(([id, v]) => ({ rewardId: id, rewardValue: v })); giveRewards(rewards); return SM.goTo("RewardState", { rewards, icon: (VIS.arena.Chests || [])[Math.min(place, 3) - 1] && VIS.arena.Chests[Math.min(place, 3) - 1].Icon, StateTarget: r.closeT }); }
      }
      SM.goTo(r.closeT);
    }
    async execute() { await fadeIn(this.v); }
  }

  Object.assign(S, { HomeState, SettingsState, RestorePurchasesState, ProfileState, RootStoreState, StoreCoreState, ProcessPurchaseState, OfferPresentationState, OfferPurchaseState, RewardState, BuyLivesState, OutOfBoosterState, RateUsState, RootLavaQuestState, LQEnterState, LQTutorialState, LQSearchState, LQCoreState, LQVictoryState, RootStarArenaState, SAEnterState, SATutorialState, SACoreState });
})();

(function () {
  window.SM = new StateMachine();

  UI.sfx = function () {};
  /* ---- boot ---- */
  if (/[?&]level=\d/.test(location.search)) window.__pkLevelPending = true;
  async function boot() {
    UI.mount(document.getElementById("c"));
    try { await document.fonts.load("40px LilitaOne"); } catch (e) {}

    await SM.start(STATES.RootTemplateState);
  }
  window.bootApp = boot;

  const settled = () => new Promise((res) => { const t = setInterval(() => { if (!SM.busy && SM.chain.some((s) => s.type === "IHomeState" || s.type === "LevelIntroState" || s.type === "SizeMatchRootState")) { clearInterval(t); setTimeout(res, 250); } }, 50); });
  window.PK_HOOKS = {
    async startLevel(n) {
      M.User.setLevel(n);
      window.__pkLevelPending = true;
      await settled();
      window.__pkLevelPending = false;
      SM.goTo("LevelIntroState");
    },
    async showHome() {
      await settled();
      if (!SM.chain.some((s) => s.type === "IHomeState")) SM.goTo("IHomeState", { PlayTarget: new StateTarget("LevelIntroState") });
    },
  };
})();
