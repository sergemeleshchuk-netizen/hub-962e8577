<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hexa Arrows with merge — v9</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">

<style>
  @font-face{font-family:"FuturaRound";src:url(../arrows-kit/FuturaRound-Bold.ttf) format("truetype");font-weight:700;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:"FuturaRound","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:#d6e6fb url(../arrows-kit/bg1.jpg) center/cover no-repeat;--u:3.9px;}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }

  /* ===== HUD (кит дизайнера: ../arrows-kit/, размеры в долях ширины телефона --u = 1%) ===== */
  #hud{width:100%;z-index:3;position:relative;height:calc(var(--u)*24);flex:none;}
  #gearBtn{position:absolute;left:calc(var(--u)*4.8);top:calc(var(--u)*5.2);width:calc(var(--u)*10.4);height:calc(var(--u)*10.4);
    border:none;cursor:pointer;background:url(../arrows-kit/gear.png) center/contain no-repeat;padding:0;}
  #gearBtn:active{transform:translateY(3px) scale(.96);}
  #lvlWrap{position:absolute;left:50%;top:calc(var(--u)*4.4);transform:translateX(-50%);text-align:center;
    display:flex;flex-direction:column;align-items:center;}
  #lvlBadge{width:calc(var(--u)*20);height:calc(var(--u)*5.3);background:url(../arrows-kit/lvl.png) center/100% 100% no-repeat;
    color:#fff;font-weight:700;font-size:calc(var(--u)*2.9);letter-spacing:.06em;display:flex;align-items:center;
    justify-content:center;z-index:2;}
  #movesBanner{margin-top:calc(var(--u)*-0.6);width:calc(var(--u)*41.5);height:calc(var(--u)*11);
    background:url(../arrows-kit/moves.png) center/100% 100% no-repeat;
    display:flex;align-items:center;justify-content:center;gap:.25em;
    color:#353b6f;font-weight:700;font-size:calc(var(--u)*5);}
  #movesBanner b{font-weight:700;}
  #hint{font-family:"Nunito",sans-serif;}
  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;}
  #fx{z-index:15;pointer-events:none;}
  #hint{position:absolute;bottom:34px;left:0;width:100%;text-align:center;color:#fff;text-shadow:0 1px 2px rgba(60,20,120,.6);
    font-weight:700;font-size:13px;z-index:3;padding:0 24px;pointer-events:none;}

  /* ===== Оверлеи ===== */
  .ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
      flex-direction:column;background:rgba(20,16,40,.66);}
  .hidden{display:none !important;}

  .card{position:relative;width:78%;max-width:360px;background:#fdf0dc;border:6px solid #8e38fc;
    border-radius:28px;padding:64px 22px 26px;display:flex;flex-direction:column;align-items:center;
    box-shadow:0 24px 60px rgba(0,0,0,.45);}
  .ribbon{position:absolute;top:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:linear-gradient(#ff9b2e,#f07713);color:#fff;font-weight:900;font-size:26px;
    letter-spacing:1px;padding:12px 34px;border-radius:14px;
    text-shadow:0 3px 0 rgba(160,70,0,.55);box-shadow:0 6px 0 #c85c08,0 10px 18px rgba(0,0,0,.3);}
  .ribbon.red{background:linear-gradient(#ff5964,#e0333f);box-shadow:0 6px 0 #b0222c,0 10px 18px rgba(0,0,0,.3);
    text-shadow:0 3px 0 rgba(150,20,30,.55);}
  .emoji{font-size:84px;margin:6px 0 14px;}
  .rewardPill{background:#b98fe8;color:#fff;font-weight:900;font-size:26px;border-radius:40px;
    padding:12px 30px;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
  .bigBtn{border:none;cursor:pointer;color:#fff;font-weight:900;font-size:26px;letter-spacing:1px;
    padding:15px 60px;border-radius:18px;background:linear-gradient(#5fd435,#3fae1e);
    box-shadow:0 6px 0 #2e8514,0 10px 18px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(30,90,10,.5);}
  .bigBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #2e8514;}
  .bigBtn.blue{background:linear-gradient(#5b8cf0,#3a68d8);box-shadow:0 6px 0 #2749a8,0 10px 18px rgba(0,0,0,.25);}
  .bigBtn.blue:active{box-shadow:0 2px 0 #2749a8;}

  /* Домашний экран */
  #home{background:#d6e6fb url(../arrows-kit/bg1.jpg) center/cover no-repeat;z-index:25;}
  #home h1{margin:0 0 6px;font-size:44px;font-weight:900;color:#5b5fca;letter-spacing:2px;
    text-shadow:0 3px 0 #fff,0 6px 10px rgba(80,80,150,.25);text-align:center;line-height:1.1;}
  #home .sub{color:#5b5fca;font-weight:800;margin-bottom:34px;}
  #homeIcon{width:150px;height:150px;border-radius:34px;margin-bottom:18px;display:block;
    box-shadow:0 14px 30px rgba(60,60,140,.35),0 0 0 5px #fff;}
  #home .sub{margin-bottom:10px;}
  #lvlRow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:300px;margin-bottom:22px;}
  .lvlBtn{width:50px;height:50px;border:none;border-radius:15px;cursor:pointer;font-weight:900;font-size:21px;
    color:#8a8ab0;background:#fff;box-shadow:0 4px 0 #c5c1dc,0 6px 12px rgba(80,80,140,.18);}
  .lvlBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #c5c1dc;}
  .lvlBtn.sel{color:#fff;background:linear-gradient(#9a4cf5,#7333c4);box-shadow:0 4px 0 #5615cf,0 6px 12px rgba(80,80,140,.3);}
  #lvlName{color:#5b5fca;font-weight:800;font-size:14px;margin:-8px 0 18px;min-height:18px;}

  /* Мини-меню шестерёнки */
  #menuCard{background:#efe9fa;border:5px solid #5b64cf;border-radius:24px;padding:26px 30px;
    display:flex;flex-direction:column;gap:14px;align-items:stretch;box-shadow:0 20px 50px rgba(0,0,0,.4);}
  #menuCard .bigBtn{font-size:20px;padding:12px 40px;}
</style>

<body>
<div id="phone">
  <div id="hud">
    <button id="gearBtn" aria-label="menu"></button>
    <div id="lvlWrap">
      <div id="lvlBadge">LEVEL 1</div>
      <div id="movesBanner">Moves: <b id="movesNum">0</b></div>
    </div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
  </div>
  <div id="hint"></div>
  <canvas id="fx"></canvas>

  <div id="winOv" class="ov hidden">
    <div class="card">
      <div class="ribbon">CONGRATS!!</div>
      <div class="emoji">😍</div>
      <div class="rewardPill">🪙 +20</div>
      <button class="bigBtn" id="nextBtn">NEXT</button>
    </div>
  </div>

  <div id="loseOv" class="ov hidden">
    <div class="card">
      <div class="ribbon red">OUT OF MOVES</div>
      <div class="emoji">😵</div>

    </div>
  </div>

  <div id="menuOv" class="ov hidden">
    <div id="menuCard">
      <button class="bigBtn blue" id="mRestart">RESTART</button>
      <button class="bigBtn" id="mHome" style="background:linear-gradient(#f79e2d,#e0801a);box-shadow:0 6px 0 #b56412;">HOME</button>
      <button class="bigBtn blue" id="mClose" style="background:#8a8ab0;box-shadow:0 6px 0 #6b6b8f;">CLOSE</button>
    </div>
  </div>

  <div id="home" class="ov">
    <img id="homeIcon" src="icon.png" alt="">
    <h1>HEXA ARROWS<br>WITH MERGE</h1>
    <div class="sub">Выбери уровень</div>
    <div id="lvlRow"></div>
    <div id="lvlName"></div>
    <button class="bigBtn" id="playBtn">PLAY</button>
  </div>
</div>

<script>
'use strict';
/* ======== Hexa Arrows with merge — v8: плитки и стрелки — спрайты из UI-кита ========
   v9 = v8 + интерфейс из архива дизайнера Art.zip (общий кит ../arrows-kit/): фон bg1, шестерёнка,
   плашки LEVEL/Moves, плитки 310 px с тенью и отдельной стрелкой, вид строго сверху (SQUASH=1),
   всплывашки x2/x3 (сбор цепочки) и Cool! (вылет стопки 3+). Панели OBJECTIVE, кремовой
   подложки и нижнего бара в мокапе нет — убраны. Шрифт Futura Round из архива.
   v8 = v7-3, поле рисуется спрайтами кита (ui/tile_*.png + ui/arrow.png) вместо процедурных
   призм: тело плитки (гекс без стрелки — стрелка стёрта PIL-ом), одна белая стрелка поверх,
   повёрнутая под направление (в ките у каждого цвета своя стрелка, у нас цвет=направление,
   6 цветов — оранжевый получен сдвигом оттенка жёлтого). Спрайт уже со «сплюснутостью» 0.92
   (как SQUASH), наклон поля ROT=0 как в мокапе. Толщина слоя стопки = толщина спрайта
   (LAYER_H = 0.256·s, считается в layout). Вылет: одна пластинка на слой (было 3 трети).
   Иконки OBJECTIVE — те же спрайты. Логика без изменений.
   ======== v7-3: OBJECTIVE по центру, обводка без шва ========
   v7-3 = v7-2: панель пересобрана из оригинала (panel_objective_compact2.png 564×132): стёрто
   содержимое построчно, вырезаны 52 строки только из ПРЯМОГО участка бортов (72..124) — шов
   на обводке исчез; нижняя внутренняя линия не задета. Ряд целей центрирован в зоне
   между шапкой и нижней линией.
   ======== v7-2: компактный OBJECTIVE ========
   v7-2 = v7, панель OBJECTIVE меньше (78% ширины) и без пустой полосы между шапкой и
   иконками: из картинки вырезаны 44 строки крема (panel_objective_compact.png, 564×140).
   ======== v7: интерфейс из UI-кита ChatGPT ========
   v7 = v6 + интерфейс по мокапу пользователя (ui/_mockup_full.png, лист элементов
   ui/_sheet.png → вырезки ui/*.png): шестерёнка, баннер LEVEL, панель Moves, панель
   OBJECTIVE (живые остатки плиток по цветам), кремовая подложка поля, фиолетовая нижняя
   панель, пастельный фон-небо, палитра плиток из кита, шрифт Nunito. Надписи с листа
   стёрты PIL-ом (banner_level_blank / panel_moves_blank / panel_objective_blank), текст
   живой поверх. Монеты и бустеры из мокапа НЕ добавлены (нет такой механики).
   ======== v6: перелистывание пластинок ========
   v6 = v5 + фирменный кувырок как в Hexa Arrows with piles v6: пластинка (вылет)
   и стопка (слияние на соседа) прыгают ПО КЛЕТКАМ и переворачиваются на КАЖДОМ
   прыжке (сжатие |cos| вдоль движения + подскок). Темп HOP=0.2 с/клетка — вдвое
   медленнее v5, чтобы кувырок читался на видео при 30 fps. За краем поля — два
   прыжка с растворением (вместо случайного кувырка осколков). Победа — после
   того как последняя пластинка растворилась, +1 с.
   ======== v5: 10 уровней разных форм ========
   v5 = v3 + пять уровней (L6-L10) с полями РАЗНОЙ ФОРМЫ И РАЗМЕРА для
   съёмки креативов: треугольник, кольцо с дырой, широкая полоса, звезда,
   гигантский гекс R=4 (61 фишка, спайк). Все 10 уровней доступны кнопками
   в главном меню. Иконка продукта на cover-экране (icon.png).
   Лучи считаются внутри ОПИСАННОГО гекса поля (hull): у невыпуклых форм
   фишка перелетает зазор/дыру и может упереться в фишку на другой стороне.
   ---- механика v3 ----
   Поле закрыто одноуровневыми фишками на 100% (как v1), цвет = направление.
   ТАП — фишка летит по своей стрелке до первого препятствия:
   • путь до края свободен — улетает с поля (цепочка пластинок);
   • первым на пути стоит фишка с ТОЙ ЖЕ стрелкой — задняя летит по лучу
     и собирает ВСЮ цепочку одинаковых стрелок: подбирает каждую и оседает
     стопкой на самой дальней (все клетки позади освобождаются);
   • стоит фишка с другой стрелкой — бамп.
   Стопка ведёт себя как одна фишка: летает и прыгает целиком.
   Любой тап = -1 ход. Слияние цепочки из k фишек убирает с поля k-1 фишку
   за один тап, поэтому минимум ходов ТЕПЕРЬ <= числа фишек — лимиты v1
   стали немного щедрее, оставлены как есть.
   Слияния не экономят ходы, но освобождают клетки и открывают лучи. */

const $=id=>document.getElementById(id);
const stage=$('stage'), cvs=$('game'), ctx=cvs.getContext('2d');
const fxCvs=$('fx'), fxCtx=fxCvs.getContext('2d');

/* ---------- Константы визуала ---------- */
const ROT=0;                  // v8: поле без наклона
const SQUASH=1;               // v9: мокап дизайнера — вид строго сверху, без перспективы
const CELL_GAP=0.94;          // зазор между гексами
const CELL_DEPTH=7;           // толщина серой подложки
let LAYER_H=8;                // толщина одного слоя стопки = толщина спрайта (пересчёт в layout)
const HOP=0.2;                // v6: сек на прыжок между клетками (общий темп кувырка)
const FLIP_MIN=0.06;          // минимальная ширина пластинки «ребром»
/* v7: палитра снята с плиток UI-кита (медиана верхней грани / бочка) */
const COLORS=[
  {top:'#4ac828',side:'#2a9412'},  // green
  {top:'#f79e2d',side:'#c4761a'},  // orange (в ките нет — оставлен прежний)
  {top:'#2a8ef5',side:'#1a5bc8'},  // blue
  {top:'#f0483a',side:'#c0271c'},  // red
  {top:'#9a4cf5',side:'#6a2bd0'},  // purple
  {top:'#f9c526',side:'#d09410'},  // yellow
];
/* v9: спрайты из архива дизайнера (../arrows-kit/). Плитка 310×310: грань 310 px от вершины
   до вершины (s=155), центр грани (155,134.5), бочок 41 px; стрелка 103×120 смотрит ВНИЗ. */
const KIT='../arrows-kit/';
const SPR_NAME=['green','orange','dblue','red','violet','yellow'];  // по индексу COLORS
const SPR={}; SPR_NAME.forEach(n=>{const i=new Image();i.src=KIT+'tile_'+n+'.png';SPR[n]=i;});
const ARROW=new Image(); ARROW.src=KIT+'arrow.png';
const SHADOW=new Image(); SHADOW.src=KIT+'shadow.png';
const POPS={x2:new Image(),x3:new Image(),cool:new Image()};
POPS.x2.src=KIT+'x2.png'; POPS.x3.src=KIT+'x3.png'; POPS.cool.src=KIT+'cool.png';
const SPR_W=310, SPR_CX=155, SPR_CY=134.5, SPR_THICK=41, ARW_W=103, ARW_H=120, ARW_K=1.15;
const THICK_K=SPR_THICK*2/SPR_W;   // толщина слоя в долях s
function drawBody(x,y,s,color){
  const img=SPR[SPR_NAME[color]]; if(!img.complete||!img.naturalWidth)return;
  const k=2*s/SPR_W;
  ctx.drawImage(img,x-SPR_CX*k,y-SPR_CY*k,img.naturalWidth*k,img.naturalHeight*k);
}
function drawShadow(x,y,s){
  if(!SHADOW.complete||!SHADOW.naturalWidth)return;
  const k=2*s/SPR_W*1.04;
  ctx.drawImage(SHADOW,x-SPR_CX*k,y-SPR_CY*k+s*0.10,SHADOW.naturalWidth*k,SHADOW.naturalHeight*k);
}
function drawArrowSpr(x,y,s,dir){
  if(!ARROW.complete||!ARROW.naturalWidth)return;
  const [vx,vy]=dirVec(dir), ang=Math.atan2(vy,vx)-Math.PI/2, k=2*s/SPR_W*ARW_K;
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.drawImage(ARROW,-ARW_W*k/2,-ARW_H*k/2,ARW_W*k,ARW_H*k);
  ctx.restore();
}
/* v9: всплывашки кита — x2/x3 при сборе цепочки, Cool! при вылете стопки 3+ */
let pops=[];
function popAt(kind,x,y){pops.push({kind,x,y,t:0});}
function drawPops(dt){
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t+=dt; const T=0.9;
    if(p.t>=T){pops.splice(i,1);continue;}
    const img=POPS[p.kind]; if(!img.complete||!img.naturalWidth)continue;
    const k=p.t<0.18?0.4+0.6*(1-Math.pow(1-p.t/0.18,2))*1.15:1+0.15*Math.max(0,1-(p.t-0.18)/0.12);
    const alpha=p.t>T-0.25?(T-p.t)/0.25:1;
    const w=S*(p.kind==='cool'?2.6:1.7), h=w*img.naturalHeight/img.naturalWidth;
    ctx.save();ctx.globalAlpha=alpha;ctx.translate(p.x,p.y-S*0.4-p.t*S*0.5);ctx.scale(k,k);
    ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();
  }
}
/* Направления flat-top гекса: N, NE, SE, S, SW, NW (axial q,r) */
const DIRS=[[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]];
/* Цвет жёстко привязан к направлению (как в референсе и v1):
   ↑ красный, ↗ синий, ↘ зелёный, ↓ жёлтый, ↙ фиолетовый, ↖ оранжевый */
const DIR_COLOR=[3,2,0,5,4,1];

/* ---------- Уровни (полное покрытие, все фишки высоты 1) ---------- */
function hexRegion(R){
  const out=[];
  for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++)
    if(Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=R)out.push([q,r]);
  return out;
}
const CORNERS3=[[3,0],[0,3],[-3,0],[0,-3],[3,-3],[-3,3]];   // углы гекса R=3
const RIM4=[[4,-2],[2,2],[-2,4],[-4,2],[-2,-2],[2,-4]];     // кайма: середины рёбер R=4
const hexDist=(q,r)=>Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r));
/* формы для L6-L10 (центрированы вокруг начала координат) */
function triangle(n){const b=[];const o=(n-1)/3|0;
  for(let q=0;q<n;q++)for(let r=0;r<n-q;r++)b.push([q-o,r-o]);return b;}
function ring(a,b){return hexRegion(a).filter(([q,r])=>hexDist(q,r)>b);}
function rect(cols,rows){const b=[];const q0=-((cols-1)/2|0);
  for(let i=0;i<cols;i++){const q=q0+i;for(let j=0;j<rows;j++)b.push([q,j-(rows>>1)-Math.floor(q/2)]);}
  return b;}
function star(){const b=hexRegion(2);
  for(const [dq,dr] of DIRS)for(let k=3;k<=4;k++)b.push([dq*k,dr*k]);return b;}
const ALL6=[0,1,2,3,4,5];
const LEVELS=[
  {mask:()=>hexRegion(2),                  dirs:[0,1,3,4],     fac:1.8,  name:'Hex 19'},
  {mask:()=>hexRegion(2).concat(CORNERS3), dirs:[0,1,2,3,4],   fac:1.7,  name:'Flower 25'},
  {mask:()=>hexRegion(3).filter(c=>!CORNERS3.some(k=>k[0]===c[0]&&k[1]===c[1])),
                                           dirs:ALL6,          fac:1.55, name:'Round 31'},
  {mask:()=>hexRegion(3),                  dirs:ALL6,          fac:1.4,  name:'Hex 37'},
  {mask:()=>hexRegion(3).concat(RIM4),     dirs:ALL6,          fac:1.28, name:'Gear 43'},
  /* ---- v5: новые формы для креативов ---- */
  {mask:()=>triangle(7),                   dirs:ALL6,          fac:1.5,  name:'Triangle 28'},
  {mask:()=>ring(3,1),                     dirs:ALL6,          fac:1.45, name:'Ring 30'},
  {mask:()=>rect(9,4),                     dirs:ALL6,          fac:1.4,  name:'Bar 36'},
  {mask:()=>star(),                        dirs:ALL6,          fac:1.35, name:'Star 31'},
  {mask:()=>hexRegion(4),                  dirs:ALL6,          fac:1.25, name:'Giant Hex 61'},  // спайк
];
/* луч живёт внутри описанного гекса поля: зазоры невыпуклых форм перелетаются */
let hullR=0;
const inHull=(q,r)=>hexDist(q,r)<=hullR;

/* ---------- Seeded RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- Состояние ---------- */
let level=parseInt(localStorage.getItem('hexaArrows9.merge.level')||'1');
if(!(level>=1&&level<=LEVELS.length)) level=1;
let cells=[], cellSet=new Set(), tiles=[], flyers=[], mergeFx=[], moves=0, S=34;
let playing=false, winPending=false, shake=0;
let W=0,H=0,DPR=1, cx=0, cy=0;

const key=(q,r)=>q+','+r;

/* ---------- Генерация уровня (полное покрытие, гарантированно решаемая) ----------
   Очистка с края, как в v1: порядок снятия = решение. Слияние решаемость
   сохраняет: стопка садится на клетку передней фишки с её же направлением,
   т.е. поле всегда = подмножество исходного расклада, а исходный порядок
   снятия для подмножества валиден. */
function genTiles(cfg,seed){
  const rng=mulberry32(seed);
  const rem=new Set(cells.map(c=>key(c[0],c[1])));
  const pool=cells.slice(), res=[];
  while(pool.length){
    const cand=[];
    for(const c of pool){
      const dirs=[];
      for(const d of cfg.dirs){
        let q=c[0]+DIRS[d][0], r=c[1]+DIRS[d][1], free=true;
        while(inHull(q,r)){
          if(rem.has(key(q,r))){free=false;break;}
          q+=DIRS[d][0]; r+=DIRS[d][1];
        }
        if(free)dirs.push(d);
      }
      if(dirs.length)cand.push([c,dirs]);
    }
    if(!cand.length)return null;   // теоретически недостижимо (крайняя фишка всегда свободна), страховка
    const [c,dirs]=cand[(rng()*cand.length)|0];
    rem.delete(key(c[0],c[1]));
    pool.splice(pool.indexOf(c),1);
    const dir=dirs[(rng()*dirs.length)|0];
    res.push({q:c[0],r:c[1],dir,
      color:DIR_COLOR[dir],           // цвет = направление
      layers:1, pop:0});
  }
  return res;
}
function buildLevel(n){
  const cfg=LEVELS[n-1];
  cells=cfg.mask(); cellSet.clear(); hullR=0;
  for(const c of cells){cellSet.add(key(c[0],c[1]));hullR=Math.max(hullR,hexDist(c[0],c[1]));}
  let res=null;
  for(let a=0;a<50&&!res;a++)res=genTiles(cfg,n*7919+1+a*104729);
  tiles=res||[];
  flyers=[]; mergeFx=[];
  // минимум ходов = число фишек (каждый удачный тап убирает с поля ровно одну)
  moves=Math.ceil(tiles.length*cfg.fac);
  winPending=false; playing=true;
  tiles.forEach((t,i)=>t.pop=-i*0.03);   // стаггер появления
  $('lvlBadge').textContent='LEVEL '+n;
  $('hint').textContent=n===1?'Тап — фишка летит по стрелке: путь свободен — улетает, впереди такие же стрелки — соберёт всю линию в одну стопку.':'';
  updateMoves();
  layout();
}
function updateMoves(){$('movesNum').textContent=moves;}
/* v9: панели OBJECTIVE в мокапе дизайнера нет — счётчики цветов убраны */
function updateObjective(){}
let objAll=new Set();

/* ---------- Геометрия ---------- */
function hexCenter(q,r){
  let x=1.5*S*q, y=Math.sqrt(3)*S*(r+q/2);
  const rx=x*Math.cos(ROT)-y*Math.sin(ROT), ry=x*Math.sin(ROT)+y*Math.cos(ROT);
  return [cx+rx, cy+ry*SQUASH];
}
function hexVerts(x,y,s){
  const v=[];
  for(let i=0;i<6;i++){
    const a=Math.PI/3*i;
    let px=Math.cos(a)*s, py=Math.sin(a)*s;
    const rx=px*Math.cos(ROT)-py*Math.sin(ROT), ry=px*Math.sin(ROT)+py*Math.cos(ROT);
    v.push([x+rx,y+ry*SQUASH]);
  }
  return v;
}
function dirVec(d){
  const [ax,ay]=hexCenter(0,0), [bx,by]=hexCenter(DIRS[d][0],DIRS[d][1]);
  const dx=bx-ax, dy=by-ay, l=Math.hypot(dx,dy);
  return [dx/l,dy/l];
}
function pointInPoly(px,py,v){
  let inside=false;
  for(let i=0,j=v.length-1;i<v.length;j=i++){
    if((v[i][1]>py)!==(v[j][1]>py) &&
       px<(v[j][0]-v[i][0])*(py-v[i][1])/(v[j][1]-v[i][1])+v[i][0]) inside=!inside;
  }
  return inside;
}

/* ---------- Рендер ---------- */
function drawHexPrism(x,y,s,depth,topCol,sideCol){
  const v=hexVerts(x,y,s);
  ctx.fillStyle=sideCol;
  for(let i=0;i<6;i++){
    const a=v[i], b=v[(i+1)%6];
    if((a[1]+b[1])/2>=y-0.5){
      ctx.beginPath();
      ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
      ctx.lineTo(b[0],b[1]+depth);ctx.lineTo(a[0],a[1]+depth);
      ctx.closePath();ctx.fill();
    }
  }
  ctx.beginPath();
  v.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.closePath();
  ctx.fillStyle=topCol;ctx.fill();
  return v;
}
function drawArrow(x,y,ang,s,col,shadow){
  ctx.save();
  ctx.translate(x,y);ctx.scale(1,SQUASH);ctx.rotate(ang);
  ctx.strokeStyle=col;ctx.fillStyle=col;
  ctx.lineWidth=s*0.24;ctx.lineCap='round';ctx.lineJoin='round';
  if(shadow){ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowOffsetY=s*0.09/SQUASH;ctx.shadowBlur=1;}
  ctx.beginPath();ctx.moveTo(-s*0.34,0);ctx.lineTo(s*0.30,0);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(s*0.14,-s*0.30);ctx.lineTo(s*0.48,0);ctx.lineTo(s*0.14,s*0.30);
  ctx.lineTo(s*0.26,0);ctx.closePath();ctx.fill();
  ctx.restore();
}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,Math.max(0,((n>>16)&255)*f))|0,
        g=Math.min(255,Math.max(0,((n>>8)&255)*f))|0,
        b=Math.min(255,Math.max(0,(n&255)*f))|0;
  return `rgb(${r},${g},${b})`;
}

let sparkles=[];
function layout(){
  const rect=stage.getBoundingClientRect();
  DPR=window.devicePixelRatio||1;
  W=rect.width;H=rect.height;
  cvs.width=W*DPR;cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const phone=$('phone').getBoundingClientRect();
  $('phone').style.setProperty('--u',(phone.width/100)+'px');
  fxCvs.width=phone.width*DPR;fxCvs.height=phone.height*DPR;
  fxCtx.setTransform(DPR,0,0,DPR,0,0);
  // масштаб и центр от фактических габаритов маски (формы могут быть несимметричны)
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const [q,r] of cells){
    const x=1.5*q, y=Math.sqrt(3)*(r+q/2);
    x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);
  }
  S=Math.min((W-40)/(x1-x0+2), (H-40)/(y1-y0+2.6));
  LAYER_H=S*CELL_GAP*0.99*THICK_K;   // v8: слой = толщина спрайта
  const mx=(x0+x1)/2, my=(y0+y1)/2;   // центр bbox в единицах S, до поворота
  cx=W/2-S*(mx*Math.cos(ROT)-my*Math.sin(ROT));
  cy=H/2-S*0.25-S*(mx*Math.sin(ROT)+my*Math.cos(ROT))*SQUASH;
  const rng=mulberry32(42);
  sparkles=[];
  for(let i=0;i<14;i++){
    const c=cells[(rng()*cells.length)|0];
    if(!c)break;
    const [x,y]=hexCenter(c[0],c[1]);
    const a=rng()*Math.PI*2, rr=S*(0.8+rng()*0.25);
    sparkles.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr*SQUASH,1+rng()*1.6]);
  }
}
window.addEventListener('resize',layout);

function draw(dt){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0){shake-=dt;ctx.translate((Math.random()-0.5)*4,(Math.random()-0.5)*4);}
  // v9: подложка — мягкая тень кита под каждой клеткой (в мокапе слотов нет, только тени плиток)
  for(const [q,r] of cells)drawShadow(...hexCenter(q,r),S*CELL_GAP);
  // фишки: сортируем по экранному Y, чтобы нижние перекрывали верхние
  const sorted=tiles.slice().sort((a,b)=>hexCenter(a.q,a.r)[1]-hexCenter(b.q,b.r)[1]);
  for(const t of sorted){
    t.pop=Math.min(1,t.pop+dt*3.2);
    if(t.pop<=0)continue;
    const sc=t.pop<1?(0.5+0.5*(1-Math.pow(1-t.pop,3))):1;
    const [x0,y0]=hexCenter(t.q,t.r);
    const x=x0+(t.ox||0), y=y0+(t.oy||0);
    const s=S*CELL_GAP*0.99*sc;
    const vis=Math.max(1,t.layers-(t.hideH||0));  // прилетающие пластинки дорисует mergeFx
    for(let l=0;l<vis;l++)drawBody(x,y-CELL_DEPTH-l*LAYER_H*sc,s,t.color);   // v8: спрайты слоями
    const topY=y-CELL_DEPTH-(vis-1)*LAYER_H*sc;
    drawArrowSpr(x,topY,s,t.dir);
    t.topV=hexVerts(x,topY,s); t.topY=topY;
  }
  // прыжок стопки на фишку впереди: по клеткам луча, с подскоком на каждой
  const MSTEP=HOP;
  for(let i=mergeFx.length-1;i>=0;i--){
    const m=mergeFx[i];
    m.t+=dt;
    const prog=m.t/MSTEP;
    // стопки цепочки, мимо которых уже пролетели, вливаются в летящую
    while(m.pickups.length&&prog>=m.pickups[0].idx){m.h+=m.pickups.shift().h;}
    if(prog>=m.path.length-1||!tiles.includes(m.dst)){
      if(tiles.includes(m.dst)){m.dst.hideH=Math.max(0,(m.dst.hideH||0)-m.h);m.dst.pop=0.65;
        if(m.stacks>=2){const [dx,dy]=hexCenter(m.dst.q,m.dst.r);popAt(m.stacks>=3?'x3':'x2',dx,dy-CELL_DEPTH-m.dst.layers*LAYER_H);}}
      mergeFx.splice(i,1);continue;
    }
    // ждущие стопки цепочки рисуем на месте (из tiles они уже удалены)
    const c=COLORS[m.color];
    const [avx,avy]=dirVec(m.dir);
    for(const p of m.pickups){
      const [px,py]=m.path[p.idx];
      for(let l=0;l<p.h;l++)drawBody(px,py-CELL_DEPTH-l*LAYER_H,S*CELL_GAP*0.99,m.color);
      drawArrowSpr(px,py-CELL_DEPTH-(p.h-1)*LAYER_H,S*CELL_GAP*0.99,m.dir);
    }
    const idx=prog|0, fr=prog-idx;
    const A=m.path[idx], B=m.path[idx+1];
    const x=A[0]+(B[0]-A[0])*fr, y=A[1]+(B[1]-A[1])*fr;
    const hop=Math.sin(fr*Math.PI)*S*0.3;
    // подъём на вершину: на последнем шаге — на стопку-цель, по пути — на очередную стопку цепочки
    const landVis=m.dst.layers-(m.dst.hideH||0);
    const pick=m.pickups.length&&m.pickups[0].idx===idx+1?m.pickups[0].h:0;
    const climb=idx===m.path.length-2?fr*landVis*LAYER_H:fr*pick*LAYER_H;
    const base=y-CELL_DEPTH-hop-climb;
    // v6: кувырок стопки на каждом прыжке — сжатие вдоль направления движения
    const fang=Math.atan2(avy,avx), fsq=Math.max(FLIP_MIN,Math.abs(Math.cos(fr*Math.PI)));
    ctx.save();
    ctx.translate(x,base);ctx.rotate(fang);ctx.scale(fsq,1);ctx.rotate(-fang);ctx.translate(-x,-base);
    for(let l=0;l<m.h;l++)drawBody(x,base-l*LAYER_H,S*CELL_GAP*0.99,m.color);
    drawArrowSpr(x,base-(m.h-1)*LAYER_H,S*CELL_GAP*0.99,m.dir);
    ctx.restore();
  }
  // улетающие: стопка из h пластинок-третей, цепочкой по клеткам на вылет,
  // за краем поля — свободный кувырок (анимация «пересыпания» из референса)
  const PH=LAYER_H, STEP=HOP, PLAG=0.65;   // v8: пластинка = целый слой-спрайт
  for(let i=flyers.length-1;i>=0;i--){
    const f=flyers[i];
    f.t+=dt;
    const lead=f.t/STEP;
    let chainActive=false;
    for(let p=f.n-1;p>=0;p--){
      if(f.gone[p])continue;
      const prog=Math.max(0,lead-p*PLAG);       // пластинка p идёт на p×0.65 клетки позади
      if(prog>=f.path.length-1){f.gone[p]=true;continue;}   // растворилась за полем
      chainActive=true;
      const idx=prog|0, fr=prog-idx;
      const A=f.path[idx],B=f.path[idx+1];
      const x=A[0]+(B[0]-A[0])*fr, y=A[1]+(B[1]-A[1])*fr;
      const hop=Math.sin(fr*Math.PI)*S*0.34;                  // подскок между клетками
      const lift=(f.n-1-p)*PH*Math.max(0,1-prog);             // расстопка на первом шаге
      const c=COLORS[f.color];
      // v6: кувырок на каждом прыжке + растворение за краем поля (2 прыжка)
      const fsq=Math.max(FLIP_MIN,Math.abs(Math.cos(fr*Math.PI)));
      const alpha=idx>=f.fadeFrom?Math.max(0,1-((idx-f.fadeFrom)+fr)/(f.path.length-1-f.fadeFrom)):1;
      const py=y-CELL_DEPTH-hop-lift;
      ctx.save();
      ctx.globalAlpha=alpha;
      ctx.translate(x,py);ctx.rotate(f.ang);ctx.scale(fsq,1);ctx.rotate(-f.ang);ctx.translate(-x,-py);
      drawBody(x,py,S*CELL_GAP*0.99,f.color); drawArrowSpr(x,py,S*CELL_GAP*0.99,f.dir);
      ctx.restore();
    }
    if(!chainActive)flyers.splice(i,1);
  }
  drawPops(dt);
  ctx.restore();
}

/* ---------- Логика ---------- */
function firstBlocker(t){
  let q=t.q+DIRS[t.dir][0], r=t.r+DIRS[t.dir][1];
  while(inHull(q,r)){
    const o=tiles.find(o=>o!==t&&o.q===q&&o.r===r);
    if(o)return o;
    q+=DIRS[t.dir][0]; r+=DIRS[t.dir][1];
  }
  return null;   // путь до края свободен
}
let hitAt=function(px,py){
  // фронтальные (ниже по экрану) в приоритете
  const sorted=tiles.slice().sort((a,b)=>hexCenter(b.q,b.r)[1]-hexCenter(a.q,a.r)[1]);
  for(const t of sorted){
    if(t.topV&&pointInPoly(px,py,t.topV))return t;
    const [x,y]=hexCenter(t.q,t.r);
    if(Math.abs(px-x)<S*0.8&&py>t.topY-S*0.5&&py<y+CELL_DEPTH)return t;
  }
  return null;
}
function doMerge(src,chain){
  // src летит по лучу, подбирая ВСЕ стопки цепочки, оседает на последней.
  // Логика мгновенная (dst сразу «толстеет»), прыжок с подбором — только визуал.
  const dst=chain[chain.length-1];
  tiles.splice(tiles.indexOf(src),1);
  const path=[hexCenter(src.q,src.r)];
  const pickups=[];   // промежуточные стопки цепочки: {idx клетки на пути, h слоёв}
  let q=src.q+DIRS[src.dir][0], r=src.r+DIRS[src.dir][1];
  while(!(q===dst.q&&r===dst.r)){
    const mid=chain.find(t=>t.q===q&&t.r===r);
    if(mid){pickups.push({idx:path.length,h:mid.layers});tiles.splice(tiles.indexOf(mid),1);}
    path.push(hexCenter(q,r));
    q+=DIRS[src.dir][0];r+=DIRS[src.dir][1];
  }
  path.push(hexCenter(dst.q,dst.r));
  const total=src.layers+pickups.reduce((s,p)=>s+p.h,0);
  dst.layers+=total;
  dst.hideH=(dst.hideH||0)+total;
  mergeFx.push({path,t:0,color:src.color,h:src.layers,dir:src.dir,dst,pickups,stacks:chain.length+1});
}
function tapAt(px,py){
  if(!playing)return;
  const hit=hitAt(px,py);
  if(!hit)return;
  moves--;updateMoves();
  const blk=firstBlocker(hit);
  if(!blk){
    // путь свободен — вся стопка улетает с поля
    tiles.splice(tiles.indexOf(hit),1);
    const path=[hexCenter(hit.q,hit.r)];
    let q=hit.q+DIRS[hit.dir][0], r=hit.r+DIRS[hit.dir][1];
    while(inHull(q,r)){path.push(hexCenter(q,r));q+=DIRS[hit.dir][0];r+=DIRS[hit.dir][1];}
    const fadeFrom=path.length-1;           // последняя клетка поля — дальше растворение
    for(let i=0;i<2;i++){path.push(hexCenter(q,r));q+=DIRS[hit.dir][0];r+=DIRS[hit.dir][1];}
    const n=hit.layers;     // v8: одна пластинка-спрайт на слой
    const [fvx,fvy]=dirVec(hit.dir);
    flyers.push({path,t:0,color:hit.color,dir:hit.dir,n,gone:new Array(n).fill(false),parts:[],fadeFrom,ang:Math.atan2(fvy,fvx)});
    if(n>=3){const [hx,hy]=hexCenter(hit.q,hit.r);popAt('cool',hx,hy-CELL_DEPTH);}
    if(!tiles.length){
      playing=false;winPending=true;        // победа: когда пластинки растворились, +1с (см. loop)
      return;
    }
  }else if(blk.dir===hit.dir){
    // такая же стрелка впереди — собрать ВСЮ цепочку одинаковых по лучу:
    // задняя прыгает по линии, подбирая каждую, и оседает на самой дальней
    const chain=[blk];
    let cur=blk,nxt;
    while((nxt=firstBlocker(cur))&&nxt.dir===hit.dir){chain.push(nxt);cur=nxt;}
    doMerge(hit,chain);
  }else{
    const [vx,vy]=dirVec(hit.dir);
    bump(hit,vx,vy);
    shake=0.12;
  }
  if(moves<=0&&tiles.length){playing=false;lose();}
}
function bump(t,vx,vy){
  const amp=S*0.42;let tt=0;
  const iv=setInterval(()=>{
    tt+=1/60;
    const k=tt/0.28;
    if(k>=1){t.ox=0;t.oy=0;clearInterval(iv);return;}
    const e=Math.sin(k*Math.PI)*(1-k*0.3);
    t.ox=vx*amp*e;t.oy=vy*amp*e;
  },1000/60);
}

cvs.addEventListener('pointerdown',e=>{
  const r=cvs.getBoundingClientRect();
  tapAt(e.clientX-r.left,e.clientY-r.top);
});

/* ---------- Конфетти ---------- */
let confetti=[],confettiOn=false;
function startConfetti(){
  confetti=[];confettiOn=true;
  const w=fxCvs.width/DPR,h=fxCvs.height/DPR;
  const cols=['#ff5964','#f8c92e','#3a7cf6','#45c454','#ff8ac2','#59e0e8','#b04ef5','#ff9b2e'];
  for(let i=0;i<130;i++)confetti.push({
    x:Math.random()*w,y:-Math.random()*h*0.8,
    vy:110+Math.random()*160,ph:Math.random()*7,om:2+Math.random()*3,
    s:4+Math.random()*6,c:cols[(Math.random()*cols.length)|0],r:Math.random()*7});
}
function stopConfetti(){confettiOn=false;fxCtx.clearRect(0,0,fxCvs.width,fxCvs.height);}
function drawConfetti(dt){
  if(!confettiOn)return;
  const w=fxCvs.width/DPR,h=fxCvs.height/DPR;
  fxCtx.clearRect(0,0,w,h);
  for(const p of confetti){
    p.y+=p.vy*dt;p.ph+=p.om*dt;p.r+=3*dt;
    if(p.y>h+20){p.y=-20;p.x=Math.random()*w;}
    fxCtx.save();
    fxCtx.translate(p.x+Math.sin(p.ph)*14,p.y);
    fxCtx.rotate(p.r);fxCtx.scale(1,Math.abs(Math.cos(p.ph)));
    fxCtx.fillStyle=p.c;
    fxCtx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);
    fxCtx.restore();
  }
}

/* ---------- Экраны ---------- */
function win(){
  startConfetti();
  $('winOv').classList.remove('hidden');
}
function lose(){ $('loseOv').classList.remove('hidden'); }   // проигрыш — сразу, без пауз
$('nextBtn').onclick=()=>{
  stopConfetti();$('winOv').classList.add('hidden');
  level=level%LEVELS.length+1;
  localStorage.setItem('hexaArrows9.merge.level',level);
  buildLevel(level);
};
$('retryBtn').onclick=()=>{$('loseOv').classList.add('hidden');buildLevel(level);};
$('playBtn').onclick=()=>{$('home').classList.add('hidden');buildLevel(level);};
$('gearBtn').onclick=()=>{if(playing)$('menuOv').classList.remove('hidden');};
$('mClose').onclick=()=>$('menuOv').classList.add('hidden');
$('mRestart').onclick=()=>{$('menuOv').classList.add('hidden');buildLevel(level);};
$('mHome').onclick=()=>{$('menuOv').classList.add('hidden');playing=false;$('home').classList.remove('hidden');
  refreshLvlRow();};

/* ---------- Выбор уровня в главном меню (все 10 доступны сразу) ---------- */
const lvlRow=$('lvlRow');
for(let n=1;n<=LEVELS.length;n++){
  const b=document.createElement('button');
  b.className='lvlBtn';b.textContent=n;
  b.onclick=()=>{level=n;localStorage.setItem('hexaArrows9.merge.level',level);refreshLvlRow();};
  lvlRow.appendChild(b);
}
function refreshLvlRow(){
  [...lvlRow.children].forEach((b,i)=>b.classList.toggle('sel',i+1===level));
  $('lvlName').textContent=LEVELS[level-1].name;
}
refreshLvlRow();

/* ---------- Тест-хук для PLAY-проверки ---------- */
window.__game={
  get state(){return {tiles:tiles.map(t=>({q:t.q,r:t.r,d:t.dir,h:t.layers})),moves,level,playing,
    cells:cells.length,hullR};},
  /* тап по клетке напрямую (мимо хит-теста): вылет / сбор цепочки / бамп — как в tapAt */
  tap(q,r){
    const t=tiles.find(t=>t.q===q&&t.r===r); if(!t||!playing)return null;
    const blk=firstBlocker(t);
    const kind=!blk?'exit':blk.dir===t.dir?'merge':'bump';
    const [x,y]=hexCenter(q,r);
    const saved=hitAt; // hitAt зависит от отрисованных полигонов — подменяем на прямое попадание
    hitAt=()=>t; tapAt(x,y); hitAt=saved;
    return kind;
  },
  /* жадный ход: любая фишка со свободным лучом, иначе слияние */
  greedy(){
    for(const t of tiles)if(!firstBlocker(t))return {q:t.q,r:t.r,kind:'exit'};
    for(const t of tiles){const b=firstBlocker(t);if(b&&b.dir===t.dir)return {q:t.q,r:t.r,kind:'merge'};}
    return null;
  },
  load(n){level=n;localStorage.setItem('hexaArrows9.merge.level',level);$('home').classList.add('hidden');buildLevel(n);},
};

/* ---------- Цикл ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  draw(dt);drawConfetti(dt);
  if(winPending&&!flyers.length){winPending=false;setTimeout(win,1000);}  // пауза ~1с перед победой
  requestAnimationFrame(loop);
}
buildLevel(level);       // строим сразу (скрыто под home), чтобы layout был готов
playing=false;           // играть можно после PLAY
requestAnimationFrame(loop);
</script>
