<script>/* proto-kit v1 — общий каркас экрана прототипа (стандарт rules.md, раздел 0.1)

     ProtoKit.init({slug:'arrowsort', name:'Arrow Sort', icon:'icon.png', iconEmoji:'🧪',

.pk-icon img{width:100%;height:100%;object-fit:cover;display:block;}

    if(selected){board.beginPath();board.roundRect(xx+1.5,yy+1.5,cell-3,cell-4,8);board.strokeStyle='#fff6dba0';board.lineWidth=1.2;board.stroke();}
    board.fillStyle='#fff9e7';board.textAlign='center';board.textBaseline='middle';board.font='12px sans-serif';board.fillText(col.symbol,xx+cell/2,yy+cell/2);
    if(isPinned(g.color)){
      // Full-width crossed ropes, so every fixed portion is unmistakable.
      board.globalAlpha=1;board.lineCap='round';
      const rope=()=>{board.beginPath();board.moveTo(xx+6,yy+6);board.lineTo(xx+cell-6,yy+cell-7);board.moveTo(xx+cell-6,yy+6);board.lineTo(xx+6,yy+cell-7);};
      rope();board.strokeStyle='#5f4936';board.lineWidth=6;board.stroke();
      rope();board.strokeStyle='#dfc390';board.lineWidth=3.6;board.stroke();
      rope();board.strokeStyle='#fff0c4';board.lineWidth=1.4;board.setLineDash([1.5,3]);board.stroke();board.setLineDash([]);
      A.ellipse(board,xx+cell/2,yy+cell/2,4,4,'#947348');
      A.ellipse(board,xx+cell/2-1,yy+cell/2-1,2,2,'#e9cf9d');
    }
    board.restore();
  }
  function drawBoard(time){
    board.clearRect(0,0,344,344);const level=L[state.level],{n,cell,ox,oy}=layout();
    A.rr(board,9,13,326,326,25,'#a9916945');A.rr(board,8,8,328,328,25,'#d8c6a5');A.rr(board,14,14,316,316,20,'#f8efd9');
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)A.rr(board,ox+x*cell+1,oy+y*cell+1,cell-2,cell-2,3,(x+y)%2?'#eddfc5':'#eaddc2');
    const walls=new Set(level.walls);
    for(const k of level.walls){const x=k%n,y=Math.floor(k/n),xx=ox+x*cell,yy=oy+y*cell;
      A.rr(board,xx+1,yy+3,cell-2,cell-2,5,'#9e9f83');A.rr(board,xx+1,yy,cell-2,cell-3,5,'#bec3a6');
      if(walls.has(k+1)&&x<n-1)board.fillRect(xx+cell-6,yy,9,cell-3);
      if(walls.has(k+n))board.fillRect(xx+1,yy+cell-7,cell-2,9);
      A.line(board,xx+7,yy+5,xx+cell-8,yy+5,'#e7ead366',1);
      for(let i=0;i<8;i++){const d=dust[(k*5+i)%dust.length];board.fillStyle='#6f806a20';board.fillRect(xx+4+d.x*(cell-8),yy+6+d.y*(cell-13),1.5,1.5);}
    }
    for(const p of level.ports){const xx=ox+(p.x+.5)*cell,yy=oy+(p.y+.5)*cell,c=C[p.color];
      A.ellipse(board,xx,yy,17,17,c.dark);A.ellipse(board,xx,yy-1,13,13,'#314a435c');
      board.strokeStyle=c.hex;board.lineWidth=4;board.stroke();
      board.fillStyle=c.light;board.font='17px sans-serif';board.textAlign='center';board.textBaseline='middle';board.fillText(c.symbol,xx,yy);
      if(!isPinned(p.color)){board.beginPath();board.arc(xx,yy,21,0,Math.PI*2);board.strokeStyle=c.hex+'99';board.lineWidth=1.5;board.stroke();}
    }
    for(const k of level.hazards){const xx=ox+(k%n+.5)*cell,yy=oy+(Math.floor(k/n)+.5)*cell;
      A.ellipse(board,xx,yy,18,18,'#456b72');
      board.save();board.translate(xx,yy);board.rotate(time*.001);
      for(let i=0;i<3;i++){board.beginPath();board.arc(0,0,5+i*4,i*.8,i*.8+3.5);board.strokeStyle=i%2?'#a9d5cf':'#6f9fa2';board.lineWidth=2;board.stroke();}
      board.restore();board.fillStyle='#fff0d2';board.font='bold 13px sans-serif';board.fillText('!',xx,yy+1);
    }
    const anim=state.anim;
    if(anim){
      const t=Math.max(0,(time-anim.start)/anim.step),i=Math.min(anim.frames.length-1,Math.floor(t)),f=Math.min(1,t-i);
      const from=anim.frames[i],to=anim.frames[Math.min(i+1,anim.frames.length-1)],target=new Map(to.map(g=>[g.id,g]));

    }else for(const g of state.grains)grainCloud(g,g.x,g.y,time,!isPinned(g.color));
  }
  function makeStreams(result,time){
    const {cell,ox,oy}=layout();
    for(const p of result.delivered){const sx=72+(ox+(p.x+.5)*cell)*288/344,sy=400+(oy+(p.y+.5)*cell)*288/344;
      for(let i=0;i<55;i++)state.streams.push({sx,sy,color:p.color,tx:135+random()*155,ty:120+random()*70,
        start:time+p.tick*95+random()*150,duration:650+random()*200,bend:(sx<216?-1:1)*(45+random()*40),size:1+random()*1.6});}
  }
  function act(dir){
    if(state.busy||state.finishAt||state.screen!=='game'||ProtoKit.state.screen==='loading')return false;
    if(!state.autoExecuting)pauseAuto();
    if(!activeMask()){message('All colors are pinned','Release a color. No tilt was spent.');return false;}
    // Only the autopilot follows a validated route. Player input is always free.
    if(state.autoExecuting&&!SafeSandGuide.allows(state.advice,state.grains,state.used,activeMask(),dir)){
      guideMessage();return false;
    }
    const l=L[state.level],result=tilt(l,state.grains,activeMask(),dir,true);
    if(!result.changed){message('The sand cannot move this way','Choose another direction. No tilt was spent.',true);return false;}
    state.audit.push({source:state.autoExecuting?'auto':'manual',mask:activeMask(),pinned:state.pinned.slice(),dir,
      before:structuredClone(state.grains),after:structuredClone(result.grains),delivered:structuredClone(result.delivered),lost:structuredClone(result.lost),used:state.used+1});
    state.history.push({grains:structuredClone(state.grains),filled:state.filled.slice(),used:state.used,pinned:state.pinned.slice()});
    state.used++;state.busy=true;state.hinted=null;
    state.anim={...result,start:performance.now(),step:95,dir,baseFilled:state.filled.slice()};
    makeStreams(result,state.anim.start);$('board').style.transform=`rotateX(${-D[dir].dy*8}deg) rotateY(${D[dir].dx*8}deg)`;
    if(state.autoExecuting)message(`Tilt ${state.used}: ${D[dir].arrow}`,state.advice.note);
    else message(result.lost.length?'Sand is falling into the whirlpool':result.delivered.length?'Sand is flowing into the castle':'Sand is moving',result.lost.length?'This sand was lost':'Free colors move. Pinned colors hold still.',!!result.lost.length);
    sound();update();return true;
  }
  function finishMove(){
    const a=state.anim;state.grains=a.grains;state.filled=a.baseFilled.slice();for(const g of a.delivered)state.filled[g.color]++;

    state.pinned=state.pinned.filter(c=>state.grains.some(g=>g.color===c));

    else if(!state.grains.length){state.result='win';state.finishAt=performance.now()+1100;message('Castle complete','All sand reached the castle.');sound(true);}
    else if(state.used>=L[state.level].limit){state.result='tide';state.finishAt=performance.now()+550;$('world').classList.add('surging');message('The tide has arrived','Try a shorter route.',true);}

    if(state.guiding&&!state.finishAt)guideNext();
  }
  function showResult(){
    pauseAuto(false);
    const won=state.result==='win';state.finishAt=0;state.screen=won?'win':'lose';$('gameScreen').inert=true;
    $('win').classList.remove('hidden');$('win').querySelector('.win-card').classList.toggle('fail',!won);
    $('win').querySelector('.win-badge').textContent=won?'✓':state.result==='tide'?'≈':'✕';
    $('resultEyebrow').textContent=won?'Castle complete':state.result==='tide'?'Out of tilts':'Sand lost';
    $('winTitle').textContent=won?'Castle complete':state.result==='tide'?'Out of tilts':'Sand lost';
    $('winText').textContent=won?`Remaining: ${L[state.level].limit-state.used} tilts. Castle complete.`:state.result==='tide'?'Try a shorter route.':'Avoid the whirlpool.';
    $('winMoves').textContent=state.used;$('resultPercent').textContent=progress()+'%';
    $('nextBtn').textContent=won&&state.level<L.length-1?'→':'↻';$('nextBtn').setAttribute('aria-label',won&&state.level<L.length-1?'Next level':'Play again');
    let undoButton=$('resultUndo');if(!undoButton){undoButton=document.createElement('button');undoButton.id='resultUndo';undoButton.className='text-button';undoButton.textContent='↶';undoButton.setAttribute('aria-label','Undo last tilt');undoButton.onclick=undo;$('winHomeBtn').before(undoButton);}
    undoButton.classList.toggle('hidden',won||!state.undoLeft||!state.history.length);
    if(won){if(!completed.includes(state.level+1))completed.push(state.level+1);try{localStorage.setItem('sand-castle-v10',JSON.stringify(completed));}catch{}}
    $('nextBtn').focus({preventScroll:true});
  }
  function undo(){
    if(state.busy||!state.history.length||!state.undoLeft)return;
    pauseAuto();
    const p=state.history.pop();Object.assign(state,p);state.undoLeft--;state.token++;state.finishAt=0;state.result=null;state.streams=[];state.screen='game';state.hinted=null;
    $('win').classList.add('hidden');$('gameScreen').inert=false;$('world').classList.remove('surging');
    message('Tilt undone','Sand and tilts restored.');update();
    if(state.guiding)guideNext();
  }
  function guideNext(){
    if(state.busy||state.finishAt||!state.guiding||state.screen!=='game'||!state.grains.length)return;
    const token=state.token;state.busy=true;state.advice=null;state.recovery=null;message('Finding the next step','Checking the current position.');update();
    setTimeout(()=>{
      if(token!==state.token)return;
      const a=SafeSandGuide.plan(L[state.level],state.grains,state.used);state.busy=false;state.advice=a;
      if(state.autoplay&&a.kind==='move')state.autoTotal=state.used+a.length;
      if(a.kind==='move'){state.hinted=a.move.dir;guideMessage();}
      else{pauseAuto();state.hinted=null;state.recovery=SafeSandGuide.recovery(L[state.level],state.history);
        if(state.recovery)message('A solvable position is available',`Restore step ${state.recovery.used+1}. This does not use an undo.`);
        else message(a.kind==='budget'?`Required: ${a.required} tilts; remaining: ${a.remaining}`:a.kind==='blocked'?'No route remains':'No route found yet',a.note,true);}
      update();
      if(state.autoplay)state.nextAutoAt=performance.now()+AUTO_READ_MS;

  function guideStep(source='manual'){
    if(state.busy||state.finishAt||state.screen!=='game'||!state.guiding||ProtoKit.state.screen==='loading')return;

      if(source==='auto'){pauseAuto();return;}

      state.history=state.history.slice(0,r.index);Object.assign(state,structuredClone(p));state.token++;state.advice=null;state.recovery=null;state.hinted=null;state.streams=[];state.result=null;

    if(state.advice?.kind==='move'){
      const m=state.advice.move;
      const changes=pinChanges();
      if(changes.length){for(const color of changes)togglePin(color,'guide');return;}
      if(!SafeSandGuide.allows(state.advice,state.grains,state.used,activeMask(),m.dir)){guideNext();return;}

  }
  function hint(){
    if(state.busy||state.finishAt||state.screen!=='game'||!state.grains.length)return;
    pauseAuto();
    state.guiding=!state.guiding;state.token++;state.advice=null;state.hinted=null;state.recovery=null;

  }
  function startLevel(n){
    state.token++;state.level=Math.max(0,Math.min(L.length-1,n-1));const l=L[state.level];
    state.grains=structuredClone(l.grains);state.selected=l.grains[0].color;state.pinned=[];state.used=0;state.undoLeft=3;state.history=[];state.filled=[0,0,0,0];state.totals=[0,0,0,0];
    l.grains.forEach(g=>state.totals[g.color]++);state.screen='game';state.busy=false;state.anim=null;state.streams=[];state.finishAt=0;state.hinted=null;state.result=null;state.advice=null;state.recovery=null;
    state.autoplay=autoRequested;state.autoSession=autoRequested;state.nextAutoAt=0;state.autoExecuting=false;state.audit=[];state.autoTotal=l.optimal;
    if(state.autoplay)state.guiding=true;
    $('home').classList.add('hidden');$('win').classList.add('hidden');$('world').classList.remove('surging');$('gameScreen').inert=false;$('board').style.transform='none';
    $('levelLabel').textContent=`${String(state.level+1).padStart(2,'0')} / 06`;$('levelName').textContent=l.name;
    $('colors').replaceChildren();for(const color of palette()){
      const card=document.createElement('div');card.className='color-card';card.dataset.color=color;
      const b=document.createElement('button');b.className='color-choice';b.dataset.color=color;b.style.setProperty('--color',C[color].hex);b.style.setProperty('--dark',C[color].dark);
      b.innerHTML=`<i aria-hidden="true">${C[color].symbol}</i>`;
      b.addEventListener('click',()=>togglePin(color));card.append(b);$('colors').appendChild(card);
    }
    $('directions').replaceChildren();D.forEach((d,i)=>{const b=document.createElement('button');b.className='direction';b.dataset.dir=i;b.textContent=d.arrow;b.setAttribute('aria-label',`Tilt ${d.name}`);b.onclick=()=>act(i);$('directions').appendChild(b);});
    message('Choose free colors, then tap a side','Tap a color to pin or release it. Ropes hold pinned sand.');update();fit();
    if(state.guiding)guideNext();
  }
  function showHome(){pauseAuto();state.autoSession=false;state.token++;state.screen='home';state.busy=false;state.anim=null;state.streams=[];state.finishAt=0;$('home').classList.remove('hidden');$('win').classList.add('hidden');$('world').classList.remove('surging');$('gameScreen').inert=true;
    $('levelGrid').replaceChildren();L.forEach((l,i)=>{const b=document.createElement('button');b.className='level-tile'+(completed.includes(i+1)?' complete':'');b.innerHTML=`<span class=tile-number>${String(i+1).padStart(2,'0')}</span><span class=tile-check>${completed.includes(i+1)?'✓':''}</span>`;b.setAttribute('aria-label',`Level ${i+1}: ${l.name}${completed.includes(i+1)?', complete':''}`);b.onclick=()=>ProtoKit.play(i+1);$('levelGrid').appendChild(b);});$('completedCount').textContent=`${completed.length} / ${L.length}`;$('playBtn').textContent='▶';$('playBtn').setAttribute('aria-label',completed.length?'Continue':'Play');fit();}
  function drawStreams(time){
    fx.clearRect(0,0,432,768);for(const p of state.streams){const t=(time-p.start)/p.duration;if(t<0||t>1)continue;
      const q=1-t,x=q*q*p.sx+2*q*t*(p.sx+p.bend)+t*t*p.tx,y=q*q*p.sy+2*q*t*(p.ty-60)+t*t*p.ty;

  }
  function pauseAuto(clearRequest=true){
    state.autoplay=false;state.nextAutoAt=0;if(clearRequest)autoRequested=false;update();
  }
  function toggleAuto(){
    if(state.screen!=='game'||state.finishAt)return;
    if(state.autoplay){pauseAuto();update();return;}
    autoRequested=true;state.autoplay=true;state.autoSession=true;state.guiding=true;state.nextAutoAt=0;
    update();if(!state.busy)guideNext();
  }
  function autoTick(time){
    if(!state.autoplay||state.screen!=='game'||state.finishAt)return;
    if(document.hidden||ProtoKit.state.screen!=='game'){state.nextAutoAt=0;return;}
    if(state.busy)return;
    if(state.advice?.kind!=='move'||state.recovery){pauseAuto();update();return;}
    if(!state.nextAutoAt){state.nextAutoAt=time+AUTO_READ_MS;return;}
    if(time<state.nextAutoAt)return;
    // Use the exact same validated action and animation as a player. Autoplay
    // never edits grain positions, restores history, or alters the move limit.
    const changes=pinChanges();
    if(changes.length){const c=changes[0];togglePin(c,'auto');message(`${isPinned(c)?'Pinning':'Releasing'} ${C[c].name.toLowerCase()} sand`,'Ropes show pinned colors. A tilt follows.');state.nextAutoAt=time+AUTO_READ_MS;return;}

  }
  function frame(time){
    if(state.anim){const a=state.anim;state.filled=a.baseFilled.slice();for(const g of a.delivered)state.filled[g.color]+=Math.max(0,Math.min(1,(time-a.start-g.tick*95-100)/450));update();}
    if(state.screen==='home'){A.beach(home,time,true);A.drawCastle(home,[1,1,1,1],time,true);}

  }
  $('board').addEventListener('click',e=>{if(state.busy||performance.now()<suppressClickUntil)return;const r=$('board').getBoundingClientRect(),{cell,ox,oy}=layout();
    const x=Math.floor(((e.clientX-r.left)*344/r.width-ox)/cell),y=Math.floor(((e.clientY-r.top)*344/r.height-oy)/cell),g=state.grains.find(g=>g.x===x&&g.y===y);if(g)togglePin(g.color);});

  $('board').addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};$('board').setPointerCapture(e.pointerId);});
  $('board').addEventListener('pointerup',e=>{if(!pointer)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer=null;if(Math.max(Math.abs(dx),Math.abs(dy))>28){suppressClickUntil=performance.now()+400;act(Math.abs(dx)>Math.abs(dy)?dx>0?3:0:dy>0?2:1);}});
  $('board').addEventListener('pointercancel',()=>pointer=null);
  $('playBtn').onclick=()=>ProtoKit.play(L.findIndex((l,i)=>!completed.includes(i+1))+1||1);$('homeBtn').onclick=()=>ProtoKit.home();$('winHomeBtn').onclick=()=>ProtoKit.home();$('restartBtn').onclick=()=>ProtoKit.play(state.level+1);
  $('nextBtn').onclick=()=>ProtoKit.play(state.screen==='win'?(state.level+1)%L.length+1:state.level+1);
  $('undoBtn').onclick=undo;$('hintBtn').onclick=hint;$('guideStep').onclick=()=>guideStep();
  $('autoToggle').onclick=toggleAuto;$('autoReplay').onclick=()=>{autoRequested=true;ProtoKit.play(state.level+1);};
  document.addEventListener('keydown',e=>{if(state.screen!=='game')return;const keys={ArrowLeft:0,ArrowUp:1,ArrowDown:2,ArrowRight:3};if(e.key in keys){e.preventDefault();act(keys[e.key]);}if(e.key.toLowerCase()==='z')undo();if(e.key.toLowerCase()==='h')hint();if(e.key==='Escape')ProtoKit.home();});
  const icon=document.createElement('canvas');icon.width=icon.height=512;const ic=icon.getContext('2d');ic.fillStyle='#dceee3';ic.fillRect(0,0,512,512);ic.save();ic.translate(-42,20);ic.scale(1.4,1.8);A.beach(ic,0,true);A.drawCastle(ic,[1,1,1,1],0,true);ic.restore();
  ProtoKit.init({slug:'sand-castle-v10',name:'Sand Castle',icon:icon.toDataURL(),accent:'#589987',levels:L.length,startLevel,showHome});
  window.__game={load:startLevel,state:()=>structuredClone({level:state.level+1,grains:state.grains,pinned:state.pinned,activeMask:activeMask(),used:state.used,limit:L[state.level].limit,filled:state.filled,totals:state.totals,busy:state.busy,screen:state.screen,undoLeft:state.undoLeft,hinted:state.hinted,guiding:state.guiding,advice:state.advice,recovery:state.recovery,autoplay:state.autoplay,autoSession:state.autoSession}),
    pins:()=>state.pinned.slice(),audit:()=>structuredClone(state.audit),
    bounds(){const p=$('phone').getBoundingClientRect(),b=$('stage').getBoundingClientRect();return{left:b.left-p.left,top:b.top-p.top,right:b.right-p.left,bottom:b.bottom-p.top};}};
  fit();requestAnimationFrame(frame);
})();
