<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pond Hop — v3 Capy Art</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  /* палитра пруда из Capy-Doku playable */
  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:linear-gradient(180deg,#3fc2d4 0%,#28a5b6 45%,#15818f 100%);}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }

  #bg{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .ripple{position:absolute;border:2px solid rgba(255,255,255,.10);border-radius:50%;
          animation:rip 7s linear infinite;}
  @keyframes rip{0%{transform:scale(.2);opacity:0}15%{opacity:.7}100%{transform:scale(1.6);opacity:0}}
  .glint{position:absolute;width:46px;height:8px;border-radius:6px;background:rgba(255,255,255,.08);
         transform:rotate(-12deg);}

  /* ===== HOME ===== */
  #home{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
        padding:40px 20px;color:#eafcff;}
  #home h1{margin:18px 0 2px;font-size:44px;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.25);}
  #home .sub{opacity:.75;margin-bottom:8px;font-size:15px;}
  #map{position:relative;width:340px;height:560px;flex:0 0 auto;margin:auto 0;
       transform-origin:top center;}
  .lvbtn{position:absolute;width:88px;height:92px;border:none;cursor:pointer;background:transparent;padding:0;}
  .lvbtn img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 8px 12px rgba(0,20,30,.35));}
  .lvbtn span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
              font-size:32px;font-weight:800;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.45);}
  .lvbtn:active{transform:scale(.93);}
  #map path.trail{stroke:rgba(255,255,255,.35);stroke-width:4;stroke-dasharray:2 12;stroke-linecap:round;fill:none;}
  .homefrog{position:absolute;width:62px;transform:scaleX(-1);
            filter:drop-shadow(0 6px 8px rgba(0,20,30,.35));}

  /* ===== GAME ===== */
  #game{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;}
  #hud{width:100%;padding:14px 16px;z-index:3;display:flex;align-items:center;gap:10px;color:#eafcff;}
  .hbtn{width:42px;height:42px;border-radius:13px;border:none;background:rgba(6,60,70,.45);color:#fff;
        font-size:20px;cursor:pointer;flex:0 0 auto;}
  .hbtn:active{transform:scale(.92);}
  #lvlName{font-weight:800;font-size:18px;flex:1;text-align:center;text-shadow:0 1px 0 rgba(0,0,0,.25);}
  #goalBox{background:rgba(6,60,70,.45);border-radius:13px;padding:7px 12px;font-weight:800;font-size:17px;
           display:flex;align-items:center;gap:6px;}
  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  #board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center;}
  /* панель воды под прудом — как доска в Capy-Doku */
  #board::before{content:'';position:absolute;inset:-20px;background:rgb(40,165,182);border-radius:30px;
        box-shadow:0 18px 40px rgba(0,25,35,.35), inset 0 2px 8px rgba(255,255,255,.25),
                   inset 0 -4px 10px rgba(0,40,55,.25);}
  .cell{position:absolute;border-radius:30px;background:rgba(6,80,95,.16);
        box-shadow:inset 0 4px 10px rgba(0,40,55,.20), inset 0 -2px 6px rgba(255,255,255,.10);}
  .cell.hl{background:rgba(255,255,200,.22);box-shadow:inset 0 0 0 4px rgba(255,240,150,.6);}
  .rock{position:absolute;border-radius:46% 54% 52% 48%/58% 50% 50% 42%;
        background:radial-gradient(80% 70% at 40% 30%,#9aa7ac,#5d6d73 70%,#46545a);
        box-shadow:0 6px 10px rgba(0,0,0,.3), inset 0 3px 5px rgba(255,255,255,.25);}
  .pad{position:absolute;transition:transform .18s ease;}
  .pad img.padimg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
        filter:drop-shadow(0 8px 10px rgba(0,25,35,.30));}
  @keyframes padpop{0%{transform:scale(.4)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
  .pad.pop{animation:padpop .28s ease;}
  @keyframes padsink{0%{transform:scale(1);opacity:1}100%{transform:scale(.25) rotate(35deg);opacity:0}}
  .pad.sink{animation:padsink .5s ease forwards;}

  /* капибара — спрайт из Capy-Doku playable, перекрашенная шерсть по семьям */
  .frog{position:absolute;width:44px;height:44px;z-index:6;will-change:transform,left,top;}
  .frog img{width:100%;height:100%;pointer-events:none;
        filter:drop-shadow(0 3px 3px rgba(0,30,40,.30));}

  /* очередь */
  #tray{width:100%;padding:8px 14px 20px;z-index:3;display:flex;justify-content:center;gap:14px;}
  .qslot{width:96px;height:96px;border-radius:24px;background:rgba(6,80,95,.22);
         box-shadow:inset 0 3px 8px rgba(0,40,55,.25), inset 0 -2px 5px rgba(255,255,255,.10);position:relative;}
  .qpad{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;
        transform:scale(.58);cursor:grab;touch-action:none;}
  .qpad img.padimg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
        filter:drop-shadow(0 6px 6px rgba(0,25,35,.3));}
  .qpad .frog{pointer-events:none;}
  #dragGhost{position:absolute;z-index:30;pointer-events:none;display:none;}
  #dragGhost .frog{pointer-events:none;}

  /* попапы */
  .ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
      background:rgba(6,20,26,.55);backdrop-filter:blur(3px);}
  .card{background:#fdf6e8;border-radius:26px;padding:28px 30px;text-align:center;min-width:250px;
        box-shadow:0 24px 60px rgba(0,0,0,.45);color:#1d5560;}
  .card h2{margin:0 0 6px;font-size:28px;}
  .card p{margin:0 0 18px;opacity:.75;font-size:16px;}
  .card button{border:none;border-radius:15px;padding:13px 26px;font-size:18px;font-weight:800;
        cursor:pointer;background:#1f9db1;color:#fff;margin:0 5px;box-shadow:0 4px 0 #14707f;}
  .card button.gray{background:#9db4b8;box-shadow:0 4px 0 #74898d;}
  .card button:active{transform:translateY(2px);box-shadow:none;}

  @keyframes splashUp{0%{transform:translateY(0) scale(.6);opacity:.95}100%{transform:translateY(-46px) scale(1.5);opacity:0}}
  .splash{position:absolute;z-index:12;font-size:24px;pointer-events:none;animation:splashUp .6s ease forwards;}
  @keyframes toastIn{0%{transform:translate(-50%,10px);opacity:0}20%{opacity:1}80%{opacity:1;transform:translate(-50%,-6px)}100%{opacity:0;transform:translate(-50%,-14px)}}
  #toast{position:absolute;left:50%;bottom:150px;z-index:15;transform:translate(-50%,0);display:none;
         background:rgba(6,60,70,.75);color:#fff;font-weight:800;padding:9px 18px;border-radius:14px;font-size:17px;}
</style>
</head>
<body>
<div id="phone">
  <div id="bg"></div>

  <div id="home">
    <h1>🦫 Pond Hop</h1>
    <div class="sub">Собери семью из 6 капибар на одной кувшинке</div>
    <div id="map"></div>
  </div>

  <div id="game">
    <div id="hud">
      <button class="hbtn" id="btnHome">🏠</button>
      <div id="lvlName">Уровень 1</div>
      <div id="goalBox">🦫 <span id="goalTxt">0/3</span></div>
      <button class="hbtn" id="btnRetry">↻</button>
    </div>
    <div id="stage"><div id="board"></div></div>
    <div id="tray"></div>
  </div>

  <div id="dragGhost"></div>
  <div id="toast"></div>

  <div class="ov" id="ovWin"><div class="card">
    <h2>🎉 Пруд чист!</h2><p id="winTxt">Все семьи собраны</p>
    <button class="gray" id="wHome">🏠</button><button id="wNext">Дальше ➜</button>
  </div></div>
  <div class="ov" id="ovLose"><div class="card">
    <h2>💦 Пруд переполнен</h2><p>Не осталось места для кувшинок</p>
    <button class="gray" id="lHome">🏠</button><button id="lRetry">Ещё раз ↻</button>
  </div></div>
</div>

   кувшинка = подушка с доски (hue→зелёный), капибары = спрайт
   с перекрашенной шерстью (6 семей), кнопки уровней = подушки.

/* Винрейт жадного бота (botStats, 200 игр): 99/89/85/66/25 % — рампа со спайком на 5-м */
const LEVELS = [
  {cols:3, rows:3, colors:3, goal:3, rocks:[]},
  {cols:3, rows:3, colors:4, goal:5, rocks:[]},
  {cols:3, rows:4, colors:5, goal:7, rocks:[]},
  {cols:3, rows:4, colors:6, goal:8, rocks:[]},
  {cols:3, rows:4, colors:6, goal:8, rocks:[4]}, // спайк: камень посреди пруда
];

const CELL=150, GAP=16, PAD=140, SEAT_R=40, FROG=44;
// капибары-спрайты не вращаем (урок Cargo Jam: спрайты не крутить), сидят мордой к игроку
const SEATS=[...Array(6)].map((_,k)=>{
  const a=(-90+k*60)*Math.PI/180;
  return {x:Math.cos(a)*SEAT_R, y:Math.sin(a)*SEAT_R, rot:0};
});

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- ЧИСТАЯ ЛОГИКА (общая для игры и бота) ---------- */
function neighbors(i,L){const c=i%L.cols,r=(i/L.cols)|0,res=[];
  if(c>0)res.push(i-1); if(c<L.cols-1)res.push(i+1);
  if(r>0)res.push(i-L.cols); if(r<L.rows-1)res.push(i+L.cols); return res;}

function cnt(arr,c){let n=0;for(const x of arr)if(x===c)n++;return n;}

// cells: (null|'rock'|color[])[] → лучший перескок или null
function nextTransfer(cells,L){
  let best=null;
  for(let i=0;i<cells.length;i++){
    const A=cells[i]; if(!Array.isArray(A))continue;
    for(const j of neighbors(i,L)){
      if(j<i)continue;
      const B=cells[j]; if(!Array.isArray(B))continue;
      const shared=[...new Set(A)].filter(c=>B.includes(c));
      for(const c of shared){
        const ca=cnt(A,c), cb=cnt(B,c);
        let from,to;
        if(ca>cb){from=j;to=i;}
        else if(cb>ca){from=i;to=j;}
        else{
          const oa=A.length-ca, ob=B.length-cb;
          if(oa<ob){from=j;to=i;} else if(ob<oa){from=i;to=j;} else {from=j;to=i;}
        }
        const src=cells[from], dst=cells[to];
        const space=6-dst.length; if(space<=0)continue;
        const move=Math.min(cnt(src,c),space); if(move<=0)continue;
        const dstC=cnt(dst,c), dstOther=dst.length-dstC;
        const completes=(dstOther===0 && dstC+move===6)?1:0;
        const score=completes*1000 + move*10 + dstC;
        if(!best||score>best.score)best={from,to,c,move,score};
      }
    }
  }
  return best;
}

function applyTransfer(cells,t){ // на массивах цветов; возвращает индексы убранных
  const src=cells[t.from];
  let moved=0;
  for(let k=src.length-1;k>=0 && moved<t.move;k--)
    if(src[k]===t.c){src.splice(k,1);moved++;}
  for(let m=0;m<moved;m++)cells[t.to].push(t.c);
}

function findComplete(cells){
  const res=[];
  for(let i=0;i<cells.length;i++){
    const p=cells[i];
    if(Array.isArray(p)&&p.length===6&&p.every(c=>c===p[0]))res.push(i);
  }
  return res;
}

function genPad(rng,L,colorCounts){
  const n=2+Math.floor(rng()*3); // 2..4 лягушки
  // активные цвета (недособранные семьи на поле) сильно приоритетнее:
  // калибровано ботом 2026-08-30, иначе поле забивается разноцветьем
  const active=[];
  for(let c=0;c<L.colors;c++){const cc=colorCounts[c]||0;if(cc>0&&cc%6!==0)active.push(c);}
  const w=[];
  for(let c=0;c<L.colors;c++)
    w.push(active.includes(c)?5:(active.length>=4?0.5:1.5));
  const pick=()=>{let s=w.reduce((a,b)=>a+b,0),r=rng()*s;
    for(let c=0;c<w.length;c++){r-=w[c];if(r<=0)return c;}return w.length-1;};
  let distinct=rng()<.45?1:(rng()<.85?2:3);
  distinct=Math.min(distinct,n,L.colors);
  const chosen=[];let guard=0;
  while(chosen.length<distinct&&guard++<60){const c=pick();if(!chosen.includes(c))chosen.push(c);}
  const frogs=[];
  for(let k=0;k<distinct;k++)frogs.push(chosen[k]);
  while(frogs.length<n)frogs.push(chosen[Math.floor(rng()*distinct)]);
  for(let k=frogs.length-1;k>0;k--){const j=Math.floor(rng()*(k+1));[frogs[k],frogs[j]]=[frogs[j],frogs[k]];}
  return frogs;
}

function boardColorCounts(cells,nColors){
  const cc=Array(nColors).fill(0);
  for(const p of cells)if(Array.isArray(p))for(const c of p)cc[c]++;
  return cc;
}

/* ---------- СИМУЛЯЦИЯ (для бота/калибровки) ---------- */
function simResolve(cells,L){
  let cleared=0,guard=0;
  while(guard++<300){
    // опустевшая кувшинка уплывает — клетка освобождается
    for(let i=0;i<cells.length;i++)if(Array.isArray(cells[i])&&cells[i].length===0)cells[i]=null;
    const done=findComplete(cells);
    if(done.length){for(const i of done){cells[i]=null;cleared++;}continue;}
    const t=nextTransfer(cells,L); if(!t)break;
    applyTransfer(cells,t);
  }
  return cleared;
}

function botPlay(levelIdx,seed){
  const L=LEVELS[levelIdx], rng=mulberry32(seed);
  const N=L.cols*L.rows;
  const cells=Array(N).fill(null); for(const r of L.rocks)cells[r]='rock';
  let queue=[],progress=0,placements=0;
  const refill=()=>{const cc=boardColorCounts(cells,L.colors);
    queue=[genPad(rng,L,cc),genPad(rng,L,cc),genPad(rng,L,cc)];};
  refill();
  while(placements<400){
    if(progress>=L.goal)return{win:true,placements};
    const empt=[];for(let i=0;i<N;i++)if(cells[i]===null)empt.push(i);
    if(!empt.length)return{win:false,placements};
    // жадный выбор: (pad × cell) с лучшим счётом после симуляции
    let best=null;
    for(let q=0;q<queue.length;q++){
      if(!queue[q])continue;
      for(const cell of empt){
        const sim=cells.map(p=>Array.isArray(p)?p.slice():p);
        sim[cell]=queue[q].slice();
        const cl=simResolve(sim,L);
        let conc=0,pads=0;
        for(const p of sim)if(Array.isArray(p)){pads++;
          let mx=0;for(const c of new Set(p))mx=Math.max(mx,cnt(p,c));conc+=mx*mx;}
        const score=cl*1e5+conc*10-pads*40;
        if(!best||score>best.score)best={q,cell,score};
      }
    }
    const pad=queue[best.q];queue[best.q]=null;
    cells[best.cell]=pad.slice();
    progress+=simResolve(cells,L);placements++;
    if(queue.every(x=>!x))refill();
  }
  return{win:progress>=L.goal,placements};
}

function botStats(levelIdx,games=100,seed0=1){
  let wins=0,pl=[];
  for(let g=0;g<games;g++){const r=botPlay(levelIdx,seed0+g*7919);
    if(r.win)wins++;pl.push(r.placements);}
  pl.sort((a,b)=>a-b);
  return{level:levelIdx+1,winrate:wins/games,medianPlacements:pl[games>>1]};
}

/* ---------- ИГРА (DOM) ---------- */
const $=id=>document.getElementById(id);
const boardEl=$('board'),stageEl=$('stage'),trayEl=$('tray');
let G=null, lock=false, frogSeq=1, padSeq=1;

function padImg(){return `<img class="padimg" src="${A_PAD}" draggable="false">`;}

function frogEl(color){
  const d=document.createElement('div');d.className='frog';
  d.innerHTML=`<img src="${A_CAPY[color]}" draggable="false">`;
  return d;
}

function cellXY(i,L){const c=i%L.cols,r=(i/L.cols)|0;
  return{x:c*(CELL+GAP),y:r*(CELL+GAP)};}

function fit(){
  if(!G)return;
  const sw=stageEl.clientWidth-24, sh=stageEl.clientHeight-24;
  if(!boardEl.offsetWidth)return;
  const s=Math.max(.3,Math.min(sw/boardEl.offsetWidth,sh/boardEl.offsetHeight,1.4));
  boardEl.style.transform=`translate(-50%,-50%) scale(${s})`;
  G.scale=s;
}
window.addEventListener('resize',fit);

function startLevel(idx){
  const L=LEVELS[idx];
  G={idx,L,cells:Array(L.cols*L.rows).fill(null),queue:[null,null,null],
     progress:0,scale:1,pads:{},frogs:{}};
  for(const r of L.rocks)G.cells[r]='rock';
  G.rng=mulberry32(Date.now()%2147483647||42);
  $('home').style.display='none';$('game').style.display='flex';
  $('ovWin').style.display='none';$('ovLose').style.display='none';
  $('lvlName').textContent='Уровень '+(idx+1);
  buildBoard();refillQueue();updateHUD();
  requestAnimationFrame(fit);
  lock=false;
}

function buildBoard(){
  const L=G.L;
  boardEl.innerHTML='';
  boardEl.style.width=(L.cols*CELL+(L.cols-1)*GAP)+'px';
  boardEl.style.height=(L.rows*CELL+(L.rows-1)*GAP)+'px';
  for(let i=0;i<G.cells.length;i++){
    const {x,y}=cellXY(i,L);
    if(G.cells[i]==='rock'){
      const rk=document.createElement('div');rk.className='rock';
      rk.style.cssText=`left:${x+18}px;top:${y+18}px;width:${CELL-36}px;height:${CELL-36}px;`;
      boardEl.appendChild(rk);
    }else{
      const el=document.createElement('div');el.className='cell';el.dataset.i=i;
      el.style.cssText=`left:${x+6}px;top:${y+6}px;width:${CELL-12}px;height:${CELL-12}px;`;
      boardEl.appendChild(el);
    }
  }
}

function makePadEl(frogColors){
  const pad=document.createElement('div');pad.className='pad';
  pad.style.width=PAD+'px';pad.style.height=PAD+'px';
  pad.innerHTML=padImg();
  frogColors.forEach((c,k)=>{
    const f=frogEl(c);
    const s=SEATS[k];
    f.style.left=(PAD/2+s.x-FROG/2)+'px';
    f.style.top=(PAD/2+s.y-FROG/2)+'px';
    f.style.transform=`rotate(${s.rot}deg)`;
    pad.appendChild(f);
  });
  return pad;
}

/* --- очередь --- */
function refillQueue(){
  const cc=boardColorCounts(G.cells,G.L.colors);
  for(let q=0;q<3;q++)G.queue[q]=genPad(G.rng,G.L,cc);
  renderQueue();
}
function renderQueue(){
  trayEl.innerHTML='';
  G.queue.forEach((padColors,q)=>{
    const slot=document.createElement('div');slot.className='qslot';
    if(padColors){
      const p=makePadEl(padColors);p.classList.add('qpad');p.classList.remove('pad');
      p.dataset.q=q;
      p.addEventListener('pointerdown',onDragStart);
      slot.appendChild(p);
    }
    trayEl.appendChild(slot);
  });
}

/* --- drag & drop --- */
let drag=null;
function onDragStart(e){
  if(lock)return;
  const q=+e.currentTarget.dataset.q;
  if(!G.queue[q])return;
  e.preventDefault();
  const ghost=$('dragGhost');
  ghost.innerHTML='';
  const p=makePadEl(G.queue[q]);p.style.position='static';
  ghost.appendChild(p);
  const sc=G.scale;
  ghost.style.width=PAD+'px';ghost.style.height=PAD+'px';
  ghost.style.display='block';
  ghost.style.transformOrigin='center';
  drag={q,ghost,sc};
  e.currentTarget.style.opacity=.25;
  moveGhost(e);
  window.addEventListener('pointermove',moveGhost);
  window.addEventListener('pointerup',onDrop,{once:true});
}
function phonePoint(e){
  const pr=$('phone').getBoundingClientRect();
  return{x:e.clientX-pr.left,y:e.clientY-pr.top};
}
function moveGhost(e){
  if(!drag)return;
  const {x,y}=phonePoint(e);
  drag.ghost.style.left=(x-PAD/2)+'px';
  drag.ghost.style.top=(y-PAD/2-40)+'px'; // палец не закрывает
  drag.ghost.style.transform=`scale(${drag.sc})`;
  // подсветка ближайшей свободной клетки
  const cell=hitCell(e);
  document.querySelectorAll('.cell.hl').forEach(el=>el.classList.remove('hl'));
  if(cell!=null){
    const el=boardEl.querySelector(`.cell[data-i="${cell}"]`);
    if(el)el.classList.add('hl');
  }
}
function hitCell(e){
  const gr=drag?{x:e.clientX,y:e.clientY-40*1}:null;
  let best=null,bd=Infinity;
  document.querySelectorAll('.cell').forEach(el=>{
    const i=+el.dataset.i;
    if(G.cells[i]!==null)return;
    const r=el.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const d=Math.hypot(gr.x-cx,gr.y-cy);
    if(d<bd){bd=d;best={i,r};}
  });
  if(best&&bd<best.r.width*0.85)return best.i;
  return null;
}
async function onDrop(e){
  window.removeEventListener('pointermove',moveGhost);
  if(!drag)return;
  const {q}=drag;
  drag.ghost.style.display='none';
  document.querySelectorAll('.cell.hl').forEach(el=>el.classList.remove('hl'));
  const cell=hitCell(e);
  drag=null;
  if(cell==null||lock){renderQueue();return;}
  await placePad(q,cell);
}

/* --- размещение и каскад с анимацией --- */
function padScreenPos(i){const {x,y}=cellXY(i,G.L);return{x:x+(CELL-PAD)/2,y:y+(CELL-PAD)/2};}

function mountPad(i,frogColors,pop){
  const id='p'+(padSeq++);
  const el=makePadEl([]);
  const {x,y}=padScreenPos(i);
  el.style.left=x+'px';el.style.top=y+'px';
  if(pop)el.classList.add('pop');
  boardEl.appendChild(el);
  const frogs=frogColors.map((c,k)=>{
    const f=frogEl(c);const fid='f'+(frogSeq++);
    f.dataset.fid=fid;
    positionFrog(f,i,k);
    f.style.transition='left .3s ease,top .3s ease';
    boardEl.appendChild(f);
    return{fid,c,el:f};
  });
  G.pads[i]={id,el,frogs};
  G.cells[i]=frogColors.slice();
  return G.pads[i];
}
function positionFrog(f,cellI,seat){
  const {x,y}=padScreenPos(cellI);
  const s=SEATS[seat];
  f.style.left=(x+PAD/2+s.x-FROG/2)+'px';
  f.style.top=(y+PAD/2+s.y-FROG/2)+'px';
  f.style.transform=`rotate(${s.rot}deg)`;
}
function reseat(i){
  const p=G.pads[i];if(!p)return;
  p.frogs.forEach((fr,k)=>positionFrog(fr.el,i,k));
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function animateHop(t){
  const src=G.pads[t.from],dst=G.pads[t.to];
  // забираем t.move лягушек цвета t.c с конца
  const movers=[];
  for(let k=src.frogs.length-1;k>=0&&movers.length<t.move;k--)
    if(src.frogs[k].c===t.c)movers.push(src.frogs.splice(k,1)[0]);
  movers.forEach((fr,m)=>{
    dst.frogs.push(fr);
    const seat=dst.frogs.length-1;
    // прыжок: приподнять + переставить
    fr.el.animate([{transform:fr.el.style.transform+' translateY(0) scale(1)'},
                   {transform:fr.el.style.transform+' translateY(-26px) scale(1.15)',offset:.5},
                   {transform:fr.el.style.transform+' translateY(0) scale(1)'}],{duration:300,easing:'ease'});
    positionFrog(fr.el,t.to,seat);
  });
  reseat(t.from);
  applyTransfer(G.cells,t);
  await wait(230);
}

async function animateClear(i,family){
  const p=G.pads[i];
  const {x,y}=padScreenPos(i);
  if(family)splash(x+PAD/2,y+PAD/2);
  p.frogs.forEach((fr,k)=>{
    const a=(k/6)*Math.PI*2;
    fr.el.style.transition='left .45s ease-in,top .45s ease-in,opacity .45s';
    fr.el.style.left=(parseFloat(fr.el.style.left)+Math.cos(a)*120)+'px';
    fr.el.style.top=(parseFloat(fr.el.style.top)+Math.sin(a)*120)+'px';
    fr.el.style.opacity=0;
  });
  p.el.classList.add('sink');
  await wait(family?480:300);
  p.frogs.forEach(fr=>fr.el.remove());
  p.el.remove();
  delete G.pads[i];
  G.cells[i]=null;
  if(family){G.progress++;updateHUD();}
}

function splash(bx,by){
  const s=document.createElement('div');s.className='splash';s.textContent='💦';
  s.style.left=(bx-12)+'px';s.style.top=(by-12)+'px';
  boardEl.appendChild(s);setTimeout(()=>s.remove(),650);
}

function toast(msg){
  const t=$('toast');t.textContent=msg;t.style.display='block';
  t.style.animation='none';void t.offsetWidth;t.style.animation='toastIn 1.2s ease forwards';
  setTimeout(()=>t.style.display='none',1200);
}

async function placePad(q,cell){
  lock=true;
  const colors=G.queue[q];G.queue[q]=null;
  renderQueue();
  mountPad(cell,colors,true);
  await wait(180);
  // каскад
  let guard=0;
  while(guard++<300){
    // опустевшие кувшинки уплывают, освобождая клетки
    const empties=[];
    for(let i=0;i<G.cells.length;i++)
      if(Array.isArray(G.cells[i])&&G.cells[i].length===0)empties.push(i);
    if(empties.length){for(const i of empties)await animateClear(i,false);continue;}
    const done=findComplete(G.cells);
    if(done.length){
      toast('🦫 Семья собрана!');
      for(const i of done)await animateClear(i,true);
      continue;
    }
    const t=nextTransfer(G.cells,G.L);
    if(!t)break;
    await animateHop(t);
  }
  updateHUD();
  if(G.progress>=G.L.goal){await wait(1000);showWin();return;}
  if(G.queue.every(x=>!x))refillQueue();
  const hasFree=G.cells.some(c=>c===null);
  if(!hasFree){showLose();return;}
  lock=false;
}

function updateHUD(){$('goalTxt').textContent=G.progress+'/'+G.L.goal;}

function showWin(){
  $('winTxt').textContent=G.idx<4?'Уровень '+(G.idx+1)+' пройден':'Все уровни пройдены!';
  $('wNext').textContent=G.idx<4?'Дальше ➜':'🏠 Домой';
  $('ovWin').style.display='flex';
}
function showLose(){$('ovLose').style.display='flex';}

/* --- home --- */
function buildHome(){
  const map=$('map');
  map.innerHTML=`<svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 340 560" preserveAspectRatio="none">
    <path class="trail" d="M60 500 C 200 470, 280 430, 260 370 C 240 310, 90 320, 80 250 C 72 190, 230 200, 250 130 C 262 85, 190 60, 160 60"/>
  </svg>`;
  const pos=[[16,456],[216,326],[36,206],[206,86],[116,16]];
  const tiles=[3,4,0,2,5]; // кнопки уровней = цветные подушки с доски playable
  for(let i=0;i<5;i++){
    const b=document.createElement('button');b.className='lvbtn';
    b.style.left=pos[i][0]+'px';b.style.top=pos[i][1]+'px';

  const f=document.createElement('img');f.className='homefrog';
  f.src=A_CAPY[4];
  f.style.left='120px';f.style.top='462px';
  map.appendChild(f);
}

/* --- фон --- */
(function bgFx(){

$('btnHome').onclick=()=>{$('game').style.display='none';$('home').style.display='flex';};
$('btnRetry').onclick=()=>startLevel(G.idx);
$('wHome').onclick=()=>{$('ovWin').style.display='none';$('game').style.display='none';$('home').style.display='flex';};
$('wNext').onclick=()=>{$('ovWin').style.display='none';
  if(G.idx<4)startLevel(G.idx+1);else{$('game').style.display='none';$('home').style.display='flex';}};
$('lHome').onclick=()=>{$('ovLose').style.display='none';$('game').style.display='none';$('home').style.display='flex';};
$('lRetry').onclick=()=>startLevel(G.idx);

buildHome();

/* карта home масштабируется под экран (кнопки в px, сами не сожмутся) */
function fitMap(){
  const home=$('home'),m=$('map');
  const availH=home.clientHeight-150, availW=home.clientWidth-24;
  const s=Math.min(1,availH/560,availW/340);
  m.style.transform=`scale(${s})`;
}
window.addEventListener('resize',fitMap);
fitMap();

/* --- API для PLAY-проверки и калибровки --- */
window.__game={
  get state(){return G&&{idx:G.idx,cells:G.cells.map(c=>Array.isArray(c)?c.slice():c),
    queue:G.queue.map(q=>q&&q.slice()),progress:G.progress,goal:G.L.goal,lock};},
  start:startLevel,
  place:(q,cell)=>placePad(q,cell),
  botStats, botPlay,
};
