<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fly Match — v5 (выбор уровня)</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:linear-gradient(#dfe9f4,#c9d9ea 70%,#bccfe4);}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }

  /* ===== HUD ===== */
  #hud{width:100%;padding:18px 16px 0;z-index:3;position:relative;height:104px;flex:none;}
  #gearBtn{position:absolute;left:16px;top:22px;width:52px;height:52px;border:none;cursor:pointer;
    border-radius:16px;background:linear-gradient(#5b8cf0,#3a68d8);
    box-shadow:0 5px 0 #2749a8,0 8px 14px rgba(40,60,110,.35);
    color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;}
  #gearBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2749a8;}
  #lvlWrap{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center;}
  #lvlBadge{display:inline-block;background:#3a68d8;color:#fff;font-weight:800;font-size:15px;
    letter-spacing:1px;padding:5px 20px;border-radius:10px;box-shadow:0 3px 0 #2749a8;}
  #leftBanner{margin-top:-4px;background:#fff;color:#2f5bb8;font-weight:800;font-size:26px;
    padding:6px 34px;border:3px solid #a9c4ec;position:relative;
    clip-path:polygon(0 50%,7% 0,93% 0,100% 50%,93% 100%,7% 100%);
    filter:drop-shadow(0 3px 3px rgba(50,80,140,.3));}

  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #fx{z-index:15;pointer-events:none;}

  /* ===== Лоток ===== */
  #trayWrap{flex:none;width:100%;padding:6px 10px 18px;display:flex;justify-content:center;z-index:4;}
  #tray{background:#3a68d8;border-radius:18px;padding:9px 10px;display:flex;gap:7px;
        box-shadow:inset 0 4px 10px rgba(0,0,60,.35),0 6px 16px rgba(40,60,110,.35);}
  .slot{width:46px;height:46px;display:flex;align-items:center;justify-content:center;
        background:#2c53b4;border-radius:10px;box-shadow:inset 0 2px 5px rgba(0,0,0,.35);}
  .chip{width:44px;height:44px;position:relative;
        clip-path:polygon(25% 3%,75% 3%,98% 50%,75% 97%,25% 97%,2% 50%);
        animation:pop .18s ease-out;}
  @keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
  .chip.packing{animation:packp .32s ease-in forwards;}
  @keyframes packp{40%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}

  /* ===== Оверлеи ===== */
  .ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
      flex-direction:column;background:rgba(18,28,48,.66);}
  .hidden{display:none !important;}

  .card{position:relative;width:78%;max-width:360px;background:#eef4fd;border:6px solid #5b8cf0;
    border-radius:28px;padding:64px 22px 26px;display:flex;flex-direction:column;align-items:center;
    box-shadow:0 24px 60px rgba(0,0,0,.45);}
  .ribbon{position:absolute;top:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:linear-gradient(#ff9b2e,#f07713);color:#fff;font-weight:900;font-size:26px;
    letter-spacing:1px;padding:12px 34px;border-radius:14px;
    text-shadow:0 3px 0 rgba(160,70,0,.55);box-shadow:0 6px 0 #c85c08,0 10px 18px rgba(0,0,0,.3);}
  .ribbon.red{background:linear-gradient(#ff5964,#e0333f);box-shadow:0 6px 0 #b0222c,0 10px 18px rgba(0,0,0,.3);
    text-shadow:0 3px 0 rgba(150,20,30,.55);}
  .emoji{font-size:84px;margin:6px 0 14px;}
  .rewardPill{background:#8fb4f2;color:#fff;font-weight:900;font-size:26px;border-radius:40px;
    padding:12px 30px;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
  .bigBtn{border:none;cursor:pointer;color:#fff;font-weight:900;font-size:26px;letter-spacing:1px;
    padding:15px 60px;border-radius:18px;background:linear-gradient(#5fd435,#3fae1e);
    box-shadow:0 6px 0 #2e8514,0 10px 18px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(30,90,10,.5);}
  .bigBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #2e8514;}
  .bigBtn.blue{background:linear-gradient(#5b8cf0,#3a68d8);box-shadow:0 6px 0 #2749a8,0 10px 18px rgba(0,0,0,.25);}
  .bigBtn.blue:active{box-shadow:0 2px 0 #2749a8;}

  #home{background:linear-gradient(#e8f0fa,#cddcf0);z-index:25;}
  #home h1{margin:0 0 6px;font-size:44px;font-weight:900;color:#3a68d8;letter-spacing:2px;
    text-shadow:0 3px 0 #fff,0 6px 10px rgba(50,80,140,.25);text-align:center;line-height:1.1;}
  #home .sub{color:#7f97bc;font-weight:700;margin-bottom:8px;}
  #home .hint{color:#8ba3c6;font-weight:600;font-size:14px;margin:0 30px 30px;text-align:center;line-height:1.35;}
  #homeTiles{font-size:44px;letter-spacing:6px;margin-bottom:26px;filter:drop-shadow(0 4px 4px rgba(50,80,140,.3));}
  #lvlRow{display:flex;gap:12px;margin-bottom:22px;}
  .lvlBtn{width:52px;height:52px;border:none;border-radius:16px;cursor:pointer;
    font-weight:900;font-size:22px;color:#7f97bc;background:#fff;
    box-shadow:0 4px 0 #b9c9e2,0 6px 12px rgba(50,80,140,.18);}
  .lvlBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9c9e2;}
  .lvlBtn.sel{color:#fff;background:linear-gradient(#5b8cf0,#3a68d8);box-shadow:0 4px 0 #2749a8,0 6px 12px rgba(50,80,140,.3);}

  #menuCard{background:#eef4fd;border:5px solid #5b8cf0;border-radius:24px;padding:26px 30px;
    display:flex;flex-direction:column;gap:14px;align-items:stretch;box-shadow:0 20px 50px rgba(0,0,0,.4);}
  #menuCard .bigBtn{font-size:20px;padding:12px 40px;}
</style>
</head>
<body>
<div id="phone">
  <div id="hud">
    <button id="gearBtn">⚙</button>
    <div id="lvlWrap">
      <div id="lvlBadge">LEVEL 1</div>
      <div id="leftBanner">Left: 0</div>
    </div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
  </div>
  <div id="trayWrap"><div id="tray"></div></div>
  <canvas id="fx"></canvas>

  <div id="winOv" class="ov hidden">
    <div class="card">
      <div class="ribbon">CONGRATS!!</div>
      <div class="emoji">😍</div>
      <div class="rewardPill">🪙 +20</div>
      <button class="bigBtn" id="nextBtn">NEXT</button>
    </div>
  </div>

  <div id="loseOv" class="ov hidden">
    <div class="card">
      <div class="ribbon red">TRAY FULL</div>
      <div class="emoji">😵</div>
      <button class="bigBtn blue" id="retryBtn">RETRY</button>
    </div>
  </div>

  <div id="menuOv" class="ov hidden">
    <div id="menuCard">
      <button class="bigBtn blue" id="mRestart">RESTART</button>
      <button class="bigBtn" id="mHome" style="background:linear-gradient(#f79e2d,#e0801a);box-shadow:0 6px 0 #b56412;">HOME</button>
      <button class="bigBtn blue" id="mClose" style="background:#8a8ab0;box-shadow:0 6px 0 #6b6b8f;">CLOSE</button>
    </div>
  </div>

  <div id="home" class="ov">
    <div id="homeTiles">⬡⬢⬡</div>
    <h1>FLY<br>MATCH</h1>
    <div class="sub">Выбери уровень</div>
    <div id="lvlRow"></div>
    <div class="hint">Слои цветных гексов, на каждом — стрелка (6 направлений).
      Гекс снимается, если его не накрывает верхний слой и путь по стрелке свободен.
      Три гекса одного цвета в лотке схлопываются. Не дай лотку переполниться!</div>
    <button class="bigBtn" id="playBtn">PLAY</button>
  </div>
</div>

<script>
'use strict';
/* ================= Fly Match v5 — гексы + выбор уровня в меню =================
   Как v3 (цвет + белая стрелка, слои Zen Match), но плитки ГЕКСАГОНАЛЬНЫЕ:
   верхний гекс лежит на стыке трёх нижних (сдвиг на центроид тройки),
   стрелок 6 направлений. Гекс доступен, если его не накрывает слой выше
   и луч по стрелке в его слое чист. Тап → улетает в лоток на 7 слотов,
   3 одного цвета схлопываются. Лоток полон = проигрыш; поле и лоток
   пусты = победа (~1с).
   Уровни: мини-пирамида, кольцо, гора, звезда, большая пирамида (спайк).
   Кратность 3 добирается авто-удалением накрытых (скрытых) гексов. */

const $=id=>document.getElementById(id);
const stage=$('stage'), cvs=$('game'), ctx=cvs.getContext('2d');
const fxCvs=$('fx'), fxCtx=fxCvs.getContext('2d');
const phoneEl=$('phone'), trayEl=$('tray');

const TRAY_CAP=7;
const COLORS=[
  {light:'#7fe08a',top:'#45c454',side:'#2f9139'},
  {light:'#ffc069',top:'#f79e2d',side:'#c4761a'},
  {light:'#7fa8ff',top:'#3a7cf6',side:'#2456bd'},
  {light:'#ff8a92',top:'#f2404f',side:'#bd2733'},
  {light:'#d18bff',top:'#b04ef5',side:'#8231c2'},
  {light:'#ffe27a',top:'#f8c92e',side:'#cc9c14'},
];
const DIRS=[[1,0],[0,1],[-1,0],[0,-1],[1,-1],[-1,1]];
const SQ3=Math.sqrt(3);
const LIFT_K=0.42, DEPTH_K=0.30;   // в долях S (радиус гекса)

/* мировые координаты в единицах S=1: слой L сдвинут на центроид тройки опор */
const uwx=t=>1.5*t.q + 0.5*t.L;
const uwy=t=>SQ3*(t.r+t.q/2) + (SQ3/2)*t.L;

/* ---------- Формы уровней ---------- */
const hkey=(q,r)=>q+','+r;
function disk(R){const s=[];for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++)
  if(Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=R)s.push([q,r]);return s;}
function stackShape(base,maxL){
  const out=[];
  let cur=base;
  for(let L=0;L<=maxL;L++){
    for(const [q,r] of cur)out.push([L,q,r]);
    if(L===maxL)break;
    const S=new Set(cur.map(([q,r])=>hkey(q,r)));
    cur=cur.filter(([q,r])=>S.has(hkey(q+1,r))&&S.has(hkey(q,r+1)));
    if(!cur.length)break;
  }
  return out;
}
function layPyrSmall(){return stackShape(disk(2),2);}                 // 37 → 36
function layRing(){return stackShape(disk(3).filter(([q,r])=>
  Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))>1),1);}             // 45
function layTriangle(){const b=[];for(let q=0;q<=6;q++)for(let r=0;r<=6-q;r++)b.push([q,r]);
  return stackShape(b,1);}                                            // 49 → 48
function layStar(){
  const b=disk(2);
  for(const [dq,dr] of DIRS)for(let k=3;k<=4;k++)b.push([dq*k,dr*k]);
  return stackShape(b,1);                                             // 43 → 42
}
function layPyrBig(){return stackShape(disk(3),3);}                   // 92 → 90, спайк
const LEVELS=[
  {make:layPyrSmall, colors:4, mix:1},
  {make:layRing,     colors:4, mix:2},
  {make:layTriangle, colors:5, mix:2},
  {make:layStar,     colors:5, mix:2},
  {make:layPyrBig,   colors:6, mix:3},   // спайк
];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

let level=parseInt(localStorage.getItem('flyMatch5.level')||'1');
if(!(level>=1&&level<=LEVELS.length)) level=1;
let tiles=[], tray=[], flyers=[], sol=[];
let playing=false, busy=false, shake=0, winTimer=null;
let W=0,H=0,DPR=1,S=30,offX=0,offY=0,minUx=0,minUy=0;

/* ---------- Покрытие и лучи ----------
   Гекс слоя выше накрывает нижний, если их 2D-центры ближе 1.3S
   (опоры лежат ровно на расстоянии S, все прочие ≥1.5S). */
function coveredBy(t,alive){
  for(const o of alive){
    if(o===t||o.L<=t.L)continue;
    const dx=uwx(o)-uwx(t), dy=uwy(o)-uwy(t);
    if(dx*dx+dy*dy<1.69)return true;
  }
  return false;
}
function onRay(t,o,dq,dr){
  const aq=o.q-t.q, ar=o.r-t.r;
  if(dq===0)return aq===0&&ar*dr>0;
  if(dr===0)return ar===0&&aq*dq>0;
  return aq===-ar&&aq*dq>0;
}
function rayFree(t,d,alive){
  const [dq,dr]=DIRS[d];
  for(const o of alive){
    if(o===t||o.L!==t.L)continue;
    if(onRay(t,o,dq,dr))return false;
  }
  return true;
}

/* ---------- Генерация ----------
   Кратность 3: пока счёт не делится на 3, убираем накрытый (скрытый)
   гекс с максимумом накрывающих. Порядок снятия: greedy — на каждом
   шаге берём не накрытый гекс со свободным лучом, стрелка назначается
   в момент снятия. Снятие только открывает поле → любой валидный ход
   игрока сохраняет разбираемость. Цвета тройками вдоль порядка с
   перемешиванием окна mix (лоток решения не превышает 7). */
function trimTo3(pool){
  while(pool.length%3){
    let best=null,bestScore=-1;
    for(const t of pool){
      let cov=0;
      for(const o of pool){
        if(o.L<=t.L)continue;
        const dx=uwx(o)-uwx(t), dy=uwy(o)-uwy(t);
        if(dx*dx+dy*dy<1.69)cov++;
      }
      if(!cov)continue;
      const score=cov*100-t.L*10-(Math.abs(t.q)+Math.abs(t.r));
      if(score>bestScore){bestScore=score;best=t;}
    }
    if(!best)best=pool[pool.length-1];
    pool.splice(pool.indexOf(best),1);
  }
}
function buildLevel(n){
  const cfg=LEVELS[n-1];
  let placed=null, order=null;
  for(let attempt=0;attempt<200&&!placed;attempt++){
    const rng=mulberry32(n*104729+attempt*7919+13);
    const pool=cfg.make().map(([L,q,r])=>({L,q,r,dir:0,color:0,pop:0}));
    trimTo3(pool);
    const alive=new Set(pool);
    order=[];
    let ok=true;
    while(alive.size){
      const cand=[];
      for(const t of alive){
        if(coveredBy(t,alive))continue;
        const ds=[];
        for(let d=0;d<6;d++)if(rayFree(t,d,alive))ds.push(d);
        if(ds.length)cand.push([t,ds]);
      }
      if(!cand.length){ok=false;break;}
      const [t,ds]=cand[(rng()*cand.length)|0];
      t.dir=ds[(rng()*ds.length)|0];
      alive.delete(t); order.push(t);
    }
    if(!ok)continue;
    const nTriples=pool.length/3;
    const tripleColors=[]; let prev=-1;
    for(let k=0;k<nTriples;k++){
      let c;
      do{c=(rng()*cfg.colors)|0;}while(c===prev&&cfg.colors>1);
      tripleColors.push(c);prev=c;
    }
    const colorByOrder=new Array(pool.length);
    for(let block=0;block<nTriples;block+=cfg.mix){
      const bt=Math.min(cfg.mix,nTriples-block);
      const pos=[];
      for(let i=0;i<bt*3;i++)pos.push(block*3+i);
      for(let i=pos.length-1;i>0;i--){const j=(rng()*(i+1))|0;[pos[i],pos[j]]=[pos[j],pos[i]];}
      let pi=0;
      for(let k=0;k<bt;k++)for(let m=0;m<3;m++)colorByOrder[pos[pi++]]=tripleColors[block+k];
    }
    order.forEach((t,i)=>t.color=colorByOrder[i]);
    placed=pool;
  }
  tiles=placed||[];
  sol=order?order.map(t=>({L:t.L,q:t.q,r:t.r})):[];
  if(winTimer){clearTimeout(winTimer);winTimer=null;}
  tray=[]; flyers=[]; busy=false; playing=true; shake=0; stopConfetti();
  tiles.forEach((t,i)=>t.pop=-((t.L*7+t.q+t.r+9)%9)*0.035);
  $('lvlBadge').textContent='LEVEL '+n;
  renderTray(); updateLeft(); layout();
}
function updateLeft(){$('leftBanner').textContent='Left: '+tiles.length;}

/* ---------- Лоток ---------- */
function renderTray(){
  let html='';
  for(let i=0;i<TRAY_CAP;i++){
    const e=tray[i];
    if(e&&e.landed){
      const c=COLORS[e.color];
      html+=`<div class="slot"><div class="chip${e.packing?' packing':''}" style="background:linear-gradient(180deg,${c.light},${c.top} 55%,${c.side})"></div></div>`;
    }else html+='<div class="slot"></div>';
  }
  trayEl.innerHTML=html;
}
function trayInsertIndex(color){
  for(let i=tray.length-1;i>=0;i--)
    if(tray[i].color===color)return i+1;
  return tray.length;
}
function slotCenter(i){
  const slots=trayEl.children;
  const el=slots[Math.min(i,slots.length-1)];
  const r=el.getBoundingClientRect(), p=phoneEl.getBoundingClientRect();
  return [r.left-p.left+r.width/2, r.top-p.top+r.height/2];
}
function stageOffset(){
  const s=stage.getBoundingClientRect(), p=phoneEl.getBoundingClientRect();
  return [s.left-p.left, s.top-p.top];
}

/* ---------- Геометрия ---------- */
function tileXY(t){
  return [offX+(uwx(t)-minUx)*S,
          offY+(uwy(t)-minUy)*S-t.L*S*LIFT_K];
}
function layout(){
  const rect=stage.getBoundingClientRect();
  DPR=window.devicePixelRatio||1;
  W=rect.width;H=rect.height;
  cvs.width=W*DPR;cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const phone=phoneEl.getBoundingClientRect();
  fxCvs.width=phone.width*DPR;fxCvs.height=phone.height*DPR;
  fxCtx.setTransform(DPR,0,0,DPR,0,0);
  const base=LEVELS[level-1].make().map(([L,q,r])=>({L,q,r}));
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const t of base){
    const x=uwx(t), y=uwy(t)-t.L*LIFT_K;
    x0=Math.min(x0,x);x1=Math.max(x1,x);
    y0=Math.min(y0,y);y1=Math.max(y1,y);
  }
  minUx=x0;minUy=y0;
  const uW=x1-x0+2, uH=y1-y0+SQ3+DEPTH_K;
  S=Math.min((W-26)/uW,(H-26)/uH);
  offX=(W-(x1-x0)*S)/2;
  offY=(H-uH*S)/2+(SQ3/2)*S;
  /* y в tileXY считается от minUy, где minUy уже включает −L·LIFT */
}
window.addEventListener('resize',layout);

/* ---------- Рендер ---------- */
function hexPath(c2,x,y,s){
  c2.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/3*i;
    const px=x+Math.cos(a)*s, py=y+Math.sin(a)*s;
    i?c2.lineTo(px,py):c2.moveTo(px,py);
  }
  c2.closePath();
}
function drawArrow(c2,x,y,ang,s,col,shadow){
  c2.save();
  c2.translate(x,y);c2.rotate(ang);
  c2.strokeStyle=col;c2.fillStyle=col;
  c2.lineWidth=s*0.16;c2.lineCap='round';c2.lineJoin='round';
  if(shadow){c2.shadowColor='rgba(0,0,0,.25)';c2.shadowOffsetY=s*0.05;c2.shadowBlur=1;}
  c2.beginPath();c2.moveTo(-s*0.30,0);c2.lineTo(s*0.20,0);c2.stroke();
  c2.beginPath();
  c2.moveTo(s*0.08,-s*0.26);c2.lineTo(s*0.42,0);c2.lineTo(s*0.08,s*0.26);
  c2.lineTo(s*0.18,0);c2.closePath();c2.fill();
  c2.restore();
}
function drawTile(c2,x,y,s,t,dim,blocked){
  const depth=s*DEPTH_K;
  const col=COLORS[t.color];
  c2.fillStyle='rgba(30,45,80,.18)';
  hexPath(c2,x+s*0.05,y+depth+s*0.10,s);c2.fill();
  /* бочок: нижние грани призмы */
  c2.fillStyle=col.side;
  for(let i=0;i<6;i++){
    const a1=Math.PI/3*i, a2=Math.PI/3*(i+1);
    const ax=x+Math.cos(a1)*s, ay=y+Math.sin(a1)*s;
    const bx=x+Math.cos(a2)*s, by=y+Math.sin(a2)*s;
    if((ay+by)/2>=y-0.5){
      c2.beginPath();
      c2.moveTo(ax,ay);c2.lineTo(bx,by);
      c2.lineTo(bx,by+depth);c2.lineTo(ax,ay+depth);
      c2.closePath();c2.fill();
    }
  }
  const g=c2.createLinearGradient(0,y-s,0,y+s);
  g.addColorStop(0,col.light);g.addColorStop(0.55,col.top);g.addColorStop(1,col.top);
  c2.fillStyle=g;
  hexPath(c2,x,y,s);c2.fill();
  c2.strokeStyle='rgba(255,255,255,.45)';
  c2.lineWidth=s*0.06;
  hexPath(c2,x,y,s*0.86);c2.stroke();
  const ang=Math.atan2(dirVec(t.dir)[1],dirVec(t.dir)[0]);
  drawArrow(c2,x,y,ang,s,blocked&&!dim?'rgba(255,255,255,.42)':'#fff',!blocked&&!dim);
  if(dim){
    c2.fillStyle='rgba(45,58,95,.45)';
    hexPath(c2,x,y,s);c2.fill();
    c2.fillStyle='rgba(45,58,95,.45)';
    c2.fillRect(x-s,y,s*2,depth);   /* приглушить и бочок ниже центра */
  }
}
function dirVec(d){
  const [dq,dr]=DIRS[d];
  const dx=1.5*dq, dy=SQ3*(dr+dq/2);
  const l=Math.hypot(dx,dy);
  return [dx/l,dy/l];
}

function drawOrderCmp(a,b){return a.L-b.L||uwy(a)-uwy(b)||uwx(a)-uwx(b);}
function draw(dt){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0){shake-=dt;ctx.translate((Math.random()-0.5)*4,(Math.random()-0.5)*4);}
  const alive=new Set(tiles);
  const sorted=tiles.slice().sort(drawOrderCmp);
  for(const t of sorted){
    t.pop=Math.min(1,t.pop+dt*3.2);
    if(t.pop<=0)continue;
    const sc=t.pop<1?(0.5+0.5*(1-Math.pow(1-t.pop,3))):1;
    const [x0,y0]=tileXY(t);
    const x=x0+(t.ox||0), y=y0+(t.oy||0);
    const dim=coveredBy(t,alive);
    const blocked=!dim&&!rayFree(t,t.dir,alive);
    drawTile(ctx,x,y,S*0.985*sc,t,dim,blocked);
    t.sx=x;t.sy=y;
  }
  ctx.restore();
}

/* ---------- Полёт в лоток (fx-канвас, координаты телефона) ---------- */
function drawFx(dt){
  const w=fxCvs.width/DPR,h=fxCvs.height/DPR;
  fxCtx.clearRect(0,0,w,h);
  drawConfetti(dt);
  for(let i=flyers.length-1;i>=0;i--){
    const f=flyers[i];
    f.t+=dt;
    let x,y,sc=1;
    if(f.t<f.t1){                       // разгон по стрелке
      const d=f.speed*f.t*f.t;
      x=f.x0+f.vx*d; y=f.y0+f.vy*d;
      f.px=x;f.py=y;
    }else{                              // дуга в слот
      const k=Math.min(1,(f.t-f.t1)/f.t2);
      const e=k*k*(3-2*k);
      const cxp=f.px+f.vx*140, cyp=f.py+f.vy*140;
      x=(1-e)*(1-e)*f.px+2*(1-e)*e*cxp+e*e*f.tx;
      y=(1-e)*(1-e)*f.py+2*(1-e)*e*cyp+e*e*f.ty;
      sc=1-0.35*e;
      if(k>=1){flyers.splice(i,1);landFlyer(f);continue;}
    }
    drawTile(fxCtx,x,y,S*0.985*sc,f,false,false);
  }
}

/* ---------- Логика ---------- */
function tileFree(t){
  const alive=new Set(tiles);
  return !coveredBy(t,alive)&&rayFree(t,t.dir,alive);
}
function tapAt(px,py){
  if(!playing||busy)return;
  const sorted=tiles.slice().sort(drawOrderCmp).reverse();
  for(const t of sorted){
    if(t.sx===undefined)continue;
    const dx=px-t.sx, dy=py-t.sy;
    if(dx*dx+dy*dy<=S*S*0.8||(Math.abs(dx)<S*0.8&&dy>0&&dy<S*(SQ3/2+DEPTH_K))){
      tapTileRef(t);return;
    }
  }
}
function tapTileRef(hit){
  if(!playing||busy)return;
  if(!tileFree(hit)){
    const [vx,vy]=dirVec(hit.dir);
    bump(hit,vx,vy); shake=0.12;
    return;
  }
  busy=true;
  const idx=trayInsertIndex(hit.color);
  const entry={color:hit.color,landed:false,packing:false};
  tray.splice(idx,0,entry);
  const [vx,vy]=dirVec(hit.dir);
  const [ox,oy]=stageOffset();
  const [x,y]=tileXY(hit);
  const [tx,ty]=slotCenter(idx);
  tiles.splice(tiles.indexOf(hit),1);
  updateLeft(); renderTray();
  flyers.push({x0:x+ox,y0:y+oy,vx,vy,t:0,t1:0.13,t2:0.30,speed:5200,
               color:hit.color,dir:hit.dir,tx,ty,entry});
}
function landFlyer(f){
  f.entry.landed=true;
  renderTray();
  const same=tray.filter(e=>e.landed&&e.color===f.entry.color);
  if(same.length>=3){
    same.slice(0,3).forEach(e=>e.packing=true);
    renderTray();
    setTimeout(()=>{
      let rm=0;
      tray=tray.filter(e=>{if(e.packing&&rm<3){rm++;return false;}return true;});
      renderTray();
      afterMove();
    },340);
  }else afterMove();
}
function afterMove(){
  busy=false;
  if(tray.length>=TRAY_CAP){playing=false;lose();return;}
  if(!tiles.length&&!tray.length){
    playing=false;
    winTimer=setTimeout(win,1000);
  }
}
function bump(t,vx,vy){
  const amp=S*0.3;let tt=0;
  const iv=setInterval(()=>{
    tt+=1/60;
    const k=tt/0.28;
    if(k>=1){t.ox=0;t.oy=0;clearInterval(iv);return;}
    const e=Math.sin(k*Math.PI)*(1-k*0.3);
    t.ox=vx*amp*e;t.oy=vy*amp*e;
  },1000/60);
}

cvs.addEventListener('pointerdown',e=>{
  const r=cvs.getBoundingClientRect();
  tapAt(e.clientX-r.left,e.clientY-r.top);
});

/* ---------- Конфетти ---------- */
let confetti=[],confettiOn=false;
function startConfetti(){
  confetti=[];confettiOn=true;
  const w=fxCvs.width/DPR,h=fxCvs.height/DPR;
  const cols=['#ff5964','#f8c92e','#3a7cf6','#45c454','#ff8ac2','#59e0e8','#b04ef5','#ff9b2e'];
  for(let i=0;i<130;i++)confetti.push({
    x:Math.random()*w,y:-Math.random()*h*0.8,
    vy:110+Math.random()*160,ph:Math.random()*7,om:2+Math.random()*3,
    s:4+Math.random()*6,c:cols[(Math.random()*cols.length)|0],r:Math.random()*7});
}
function stopConfetti(){confettiOn=false;}
function drawConfetti(dt){
  if(!confettiOn)return;
  const w=fxCvs.width/DPR,h=fxCvs.height/DPR;
  for(const p of confetti){
    p.y+=p.vy*dt;p.ph+=p.om*dt;p.r+=3*dt;
    if(p.y>h+20){p.y=-20;p.x=Math.random()*w;}
    fxCtx.save();
    fxCtx.translate(p.x+Math.sin(p.ph)*14,p.y);
    fxCtx.rotate(p.r);fxCtx.scale(1,Math.abs(Math.cos(p.ph)));
    fxCtx.fillStyle=p.c;
    fxCtx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);
    fxCtx.restore();
  }
}

/* ---------- Экраны ---------- */
function win(){startConfetti();$('winOv').classList.remove('hidden');}
function lose(){$('loseOv').classList.remove('hidden');}
$('nextBtn').onclick=()=>{
  stopConfetti();$('winOv').classList.add('hidden');
  level=level%LEVELS.length+1;
  localStorage.setItem('flyMatch5.level',level);
  buildLevel(level);
};
$('retryBtn').onclick=()=>{$('loseOv').classList.add('hidden');buildLevel(level);};
$('playBtn').onclick=()=>{$('home').classList.add('hidden');buildLevel(level);};
$('gearBtn').onclick=()=>{if(playing)$('menuOv').classList.remove('hidden');};
$('mClose').onclick=()=>$('menuOv').classList.add('hidden');
$('mRestart').onclick=()=>{$('menuOv').classList.add('hidden');buildLevel(level);};
$('mHome').onclick=()=>{$('menuOv').classList.add('hidden');playing=false;$('home').classList.remove('hidden');
  refreshLvlRow();};

/* ---------- Выбор уровня в главном меню ---------- */
const lvlRow=$('lvlRow');
for(let n=1;n<=LEVELS.length;n++){
  const b=document.createElement('button');
  b.className='lvlBtn';b.textContent=n;
  b.onclick=()=>{level=n;localStorage.setItem('flyMatch5.level',level);refreshLvlRow();};
  lvlRow.appendChild(b);
}
function refreshLvlRow(){
  [...lvlRow.children].forEach((b,i)=>b.classList.toggle('sel',i+1===level));
}
refreshLvlRow();

/* ---------- Тест-хук для PLAY-проверки ---------- */
window.__game={
  get state(){return {tiles:tiles.map(t=>({L:t.L,q:t.q,r:t.r,c:t.color,d:t.dir})),
    tray:tray.map(e=>({c:e.color,landed:e.landed})),level,busy,playing};},
  tap(L,q,r){const t=tiles.find(t=>t.L===L&&t.q===q&&t.r===r);if(t)tapTileRef(t);return !!t;},
  free(){return tiles.filter(tileFree).map(t=>({L:t.L,q:t.q,r:t.r,c:t.color}));},
  get solution(){return sol.slice();},
  load(n){level=n;buildLevel(n);},
};

/* ---------- Цикл ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  draw(dt);drawFx(dt);
  requestAnimationFrame(loop);
}
buildLevel(level);
playing=false;
requestAnimationFrame(loop);
</script>
