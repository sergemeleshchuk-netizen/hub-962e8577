<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111b28"><title>Новые объекты · Size Match Atlas</title><style>
*{box-sizing:border-box}body{margin:0;background:#111b28;color:#f1f5f8;font:15px/1.45 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:22px 16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}a{color:#f0d39b}h1{font-size:26px;margin:0}p{margin:5px 0;color:#b5c1ce}.back{border:1px solid #506176;border-radius:10px;padding:9px 12px;text-decoration:none;white-space:nowrap}.bar{position:sticky;top:0;background:#111b28f2;backdrop-filter:blur(8px);padding:8px 0 12px;display:flex;gap:8px;z-index:2}input,select{font:inherit;color:#eff5fa;background:#203044;border:1px solid #43586f;border-radius:10px;padding:10px;min-width:0}input{flex:1}#count{color:#aab9c9;align-self:center;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#1c2b3d;border:1px solid #33475e;border-radius:13px;overflow:hidden}.thumb{height:170px;background:#eeeae0;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain;padding:8px}.info{padding:9px 11px}.name{font-weight:700}.sub{color:#a9bacb;font-size:12px;margin-top:3px}.batch{float:right;border-radius:10px;background:#314359;color:#d3dce5;padding:2px 7px;font-size:11px}@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:580px){main{padding:16px 11px}h1{font-size:21px}header{display:block}.back{display:inline-block;margin-top:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.thumb{height:145px}.bar{flex-wrap:wrap}select{flex:1}}
</style></head><body><main><header><div><h1>100 новых объектов</h1><p>Пять новых батчей · прозрачные PNG · исходные файлы сохранены</p><p>Все 100 объектов включены в актуальную v45.</p></div><a class="back" href="../index.html">← Atlas</a></header><div class="bar"><input id="q" placeholder="Поиск по объекту или группе"><select id="batch"><option value="">Все батчи</option><option value="01">Батч 01</option><option value="02">Батч 02</option><option value="03">Батч 03</option><option value="04">Батч 04</option><option value="05">Батч 05</option><option value="06">Батч 06</option><option value="07">Батч 07</option><option value="08">Батч 08</option><option value="09">Батч 09</option><option value="10">Батч 10</option></select><span id="count"></span></div><div class="grid" id="grid"></div></main><script>fetch('objects.json').then(r=>r.json()).then(d=>{let q=document.querySelector('#q'),b=document.querySelector('#batch'),grid=document.querySelector('#grid'),count=document.querySelector('#count');function draw(){let s=q.value.toLowerCase(),items=d.objects.filter(o=>(!b.value||o.batch===b.value)&&(!s||(o.name+' '+o.ru+' '+o.group).toLowerCase().includes(s)));count.textContent=items.length+' / '+d.objects.length;grid.innerHTML=items.map(o=>`<article class="card"><div class="thumb"><img loading="lazy" src="${o.image}" alt="${o.name}"></div><div class="info"><span class="batch">Б${o.batch}</span><div class="name">${o.name}</div><div class="sub">${o.ru||o.group}</div></div></article>`).join('')}q.oninput=draw;b.onchange=draw;draw()})</script></body></html>
