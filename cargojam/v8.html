<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cargo Jam — v8 Crowd</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:
           repeating-linear-gradient(90deg,#00000007 0 3px,#ffffff09 3px 6px),
           linear-gradient(180deg,#c6d98f 0%,#bdd383 40%,#f2e7c9 40%,#ecdfba 100%);}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }

  #hud{width:100%;padding:10px 14px;z-index:6;display:flex;align-items:center;gap:10px;}
  .hbtn{width:44px;height:42px;border:none;border-radius:14px;background:#f4ead0;color:#6b4f2a;
    font-size:19px;box-shadow:inset 0 0 0 3px #fffef7,inset 0 0 0 5px #d9c9a3,0 4px 8px #6b4f2a30;
    cursor:pointer;flex:0 0 auto;}
  .hbtn:active{transform:translateY(2px);}
  #lvlname{flex:0 0 auto;background:#f4ead0;border-radius:16px;padding:9px 22px;text-align:center;
    font-weight:800;font-size:18px;color:#6b4f2a;letter-spacing:.4px;
    box-shadow:inset 0 0 0 3px #fffef7,inset 0 0 0 5px #d9c9a3,0 4px 8px #6b4f2a30;}
  #hud{justify-content:space-between;}
  #prog{flex:0 0 auto;background:#f4ead0;border-radius:14px;padding:9px 14px;font-weight:800;
    color:#6b4f2a;font-size:14px;box-shadow:inset 0 0 0 3px #fffef7,inset 0 0 0 5px #d9c9a3,0 4px 8px #6b4f2a30;
    min-width:64px;text-align:center;}

  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  #board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center;
         width:520px;height:846px;}

  /* --- верх: широкая дорожка с толпой (реф: группы фигурок цветными блоками, 3 в ряд) --- */
  #trackzone{position:absolute;left:0;top:0;width:520px;height:300px;}
  #tracksvg{position:absolute;inset:0;overflow:visible;}
  .balloon{position:absolute;width:0;height:0;pointer-events:none;}
  .mini{position:absolute;left:0;top:0;width:40px;height:54px;margin:-30px 0 0 -20px;transform-origin:50% 56%;}
  .mini .pers{animation:waddle var(--wt,.5s) ease-in-out infinite;animation-delay:var(--ph,0s);transform-origin:50% 90%;}
  @keyframes waddle{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-3px) rotate(4deg)}}
  .pers{position:absolute;inset:0;--c:#999;--cd:#666;--cl:#bbb;}
  .pers .sh{position:absolute;left:7px;bottom:-1px;width:26px;height:8px;border-radius:50%;background:#00000022;}
  .pers .head{position:absolute;left:8px;top:0;width:24px;height:24px;border-radius:50%;background:var(--c);
    box-shadow:inset -4px -4px 0 #00000024,inset 3px 3px 0 #ffffff38;z-index:3;}
  .pers .torso{position:absolute;left:6px;top:21px;width:28px;height:26px;border-radius:13px 13px 8px 8px;background:var(--c);
    box-shadow:inset -4px -5px 0 #00000024,inset 3px 3px 0 #ffffff30;z-index:2;}
  .pers .arm{position:absolute;top:24px;width:8px;height:17px;border-radius:4px;background:var(--cd);z-index:1;transform-origin:50% 3px;}
  .pers .arm.l{left:1px;animation:swing var(--wt,.5s) ease-in-out infinite;}
  .pers .arm.r{right:1px;animation:swing var(--wt,.5s) ease-in-out infinite reverse;}
  .pers .ft{position:absolute;bottom:2px;width:11px;height:9px;border-radius:5px 5px 4px 4px;background:var(--cd);z-index:1;}
  .pers .ft.l{left:9px;animation:stepA var(--wt,.5s) ease-in-out infinite;}
  .pers .ft.r{left:20px;animation:stepB var(--wt,.5s) ease-in-out infinite;}
  @keyframes stepA{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes stepB{0%,100%{transform:translateY(-4px)}50%{transform:translateY(0)}}
  @keyframes swing{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
  .balloon.wait .pers,.balloon.wait .pers .ft,.balloon.wait .pers .arm{animation-play-state:paused;}
  .mini .pers .ft,.mini .pers .arm{animation:none;}
  .balloon.wait{opacity:.45;transition:opacity .5s;}
  .balloon{transition:filter .45s,opacity .45s;}
  .balloon.pop .pers{animation:bpop .3s both;animation-delay:calc(var(--i,0)*.045s);transform-origin:50% 60%;}
  @keyframes bpop{35%{transform:scale(1.4);opacity:1}100%{transform:scale(.05);opacity:0}}
  #shead{position:absolute;width:88px;height:106px;margin:-64px 0 0 -44px;pointer-events:none;z-index:60;filter:drop-shadow(0 4px 5px #00000030);}
  #chick{position:absolute;z-index:59;font-size:34px;margin:-14px 0 0 -13px;filter:drop-shadow(0 2px 2px #00000040);}
  .proj{position:absolute;width:15px;height:15px;border-radius:50%;z-index:70;pointer-events:none;
    margin:-8px 0 0 -8px;box-shadow:0 0 10px 2px currentColor;}

  /* --- слоты --- */
  #orders{position:absolute;left:0;top:302px;width:520px;height:92px;display:flex;gap:10px;
    align-items:center;justify-content:center;}
  .ord{width:104px;height:82px;border-radius:18px;background:#f4ead0;position:relative;
    box-shadow:inset 0 0 0 3px #fffef7,inset 0 0 0 6px #d9c9a3,0 5px 10px #6b4f2a2a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
  .ord .chip{width:34px;height:34px;position:relative;}
  .ord .chip .pers{transform:scale(.6);transform-origin:top center;width:40px;height:54px;inset:auto;left:-3px;top:-1px;}
  .ord .cnt{font-weight:800;font-size:17px;color:#6b4f2a;}
  .ord.empty{background:#efe4c6;}
  .ord.empty .plus{font-size:28px;font-weight:800;color:#c4b48c;line-height:1;}
  .ord.empty .lbl2{font-size:10px;font-weight:700;color:#b3a17c;}
  .ord.locked .tv{font-size:24px;line-height:1;cursor:pointer;}
  .ord.locked{cursor:pointer;}
  .ord.locked .lbl2{font-size:10px;font-weight:800;color:#7ba33a;}
  .ord.pend{opacity:.6;}
  .ord.need{animation:need .35s;}
  @keyframes need{0%,100%{box-shadow:inset 0 0 0 3px #fffef7,inset 0 0 0 6px #d9c9a3,0 5px 10px #6b4f2a2a}
    50%{box-shadow:inset 0 0 0 3px #ffdcd7,inset 0 0 0 6px #e2574c,0 5px 10px #e2574c55}}
  #adov{position:absolute;inset:0;z-index:19;display:none;align-items:center;justify-content:center;
    background:#000000cc;}
  #adov.show{display:flex;}
  #adov .adcard{background:#1b1b24;border-radius:20px;padding:34px 40px;text-align:center;color:#fff;}
  #adov .adbar{width:180px;height:8px;border-radius:4px;background:#ffffff30;margin-top:14px;overflow:hidden;}
  #adov .adfill{height:100%;width:0;background:#7ba33a;transition:width 1.4s linear;}

  /* --- гекс-поле --- */
  #yard{position:absolute;left:0;top:398px;width:520px;height:448px;}
  #tray{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:504px;height:440px;
    border-radius:30px;background:
      repeating-linear-gradient(90deg,#00000005 0 3px,#ffffff08 3px 6px),#f6eed6;
    box-shadow:inset 0 0 0 5px #fffef7,inset 0 0 0 10px #ddcda6,0 8px 18px #6b4f2a26;}
  #hexes{position:absolute;left:50%;top:50%;}
  .cellbg{position:absolute;background:#eadfbd !important;
    filter:drop-shadow(0 1px 0 #cbbb95);}
  .cellbg::after{content:"";position:absolute;inset:12%;
    clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%);
    background:#f2e8cb;}
  .htile{position:absolute;cursor:pointer;transition:transform .22s ease,opacity .22s;}
  .htile .plate{position:absolute;inset:0;
    clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%);
    box-shadow:inset 0 3px 0 #ffffff55;}
  .htile .plate::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,#ffffff14 0 2px,#00000010 2px 4px);}
  .htile .arr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .htile .arr svg{width:46%;height:46%;filter:drop-shadow(0 1.5px 0 #00000045);}
  .htile .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-weight:900;color:#2f4156;text-shadow:0 1px 0 #ffffffaa;pointer-events:none;}
  .htile.deny{animation:hdeny .3s;}
  @keyframes hdeny{0%,100%{margin-left:0}30%{margin-left:-4px}70%{margin-left:4px}}

  /* --- оверлеи --- */
  .ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:#4a3b1bb0;opacity:0;pointer-events:none;transition:opacity .3s;}
  .ov.show{opacity:1;pointer-events:auto;}
  .card{background:#fffdf4;border-radius:26px;padding:30px 34px;text-align:center;
    box-shadow:0 20px 50px #00000066;transform:scale(.8);transition:transform .3s;max-width:82%;}
  .ov.show .card{transform:scale(1);}
  .card h2{margin:0 0 6px;font-size:26px;color:#6b4f2a;}
  .card p{margin:0 0 18px;color:#a08a5f;font-weight:600;}
  .cbtn{border:none;border-radius:16px;padding:14px 30px;font-size:17px;font-weight:800;cursor:pointer;
    background:linear-gradient(180deg,#a3c65a,#7ba33a);color:#fff;
    box-shadow:0 4px 0 #5c7c28,0 8px 18px #7ba33a55;margin:0 5px;}
  .cbtn.alt{background:linear-gradient(180deg,#f7fafc,#e8edf2);color:#4a6a7a;box-shadow:0 4px 0 #c2cdd4;}
  .cbtn:active{transform:translateY(2px);}

  #home{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:8px;background:linear-gradient(180deg,#c6d98f,#ecdfba);}
  #home.hide{display:none;}
  #home h1{margin:0;font-size:40px;color:#5c4522;text-shadow:0 3px 0 #ffffffaa;}
  #home .tag{color:#7d7346;font-weight:700;margin-bottom:20px;text-align:center;padding:0 30px;}
  .lvlbtn{width:230px;border:none;border-radius:18px;font-size:18px;font-weight:800;
    cursor:pointer;background:#f4ead0;color:#6b4f2a;
    box-shadow:inset 0 0 0 3px #fffef7,inset 0 0 0 5px #d9c9a3,0 5px 10px #6b4f2a2a;
    display:flex;align-items:center;justify-content:space-between;padding:15px 22px;margin:5px 0;}
  .lvlbtn:disabled{opacity:.45;cursor:default;}
  .lvlbtn:not(:disabled):active{transform:translateY(2px);}
  .conf{position:absolute;width:10px;height:4px;border-radius:2px;z-index:25;pointer-events:none;}
</style>
</head>
<body>
<div id="phone">
  <div id="home">
    <div style="font-size:66px;line-height:1;margin-bottom:6px;">🧶</div>
    <h1>Cargo Jam</h1>
    <div class="tag">v8: широкая дорожка с ТОЛПОЙ человечков — каждый юнит змейки = группа фигурок;<br>заряды 2-7 на стрелке, слоты-пушки, линия-превью сверху</div>
    <div id="lvlbtns"></div>
  </div>

  <div id="hud">
    <button class="hbtn" id="btnHome">🏠</button>
    <div id="lvlname">Level 1</div>
    <div id="prog">0%</div>
    <button class="hbtn" id="btnRestart">↺</button>
  </div>
  <div id="stage"><div id="board">
    <div id="trackzone"><svg id="tracksvg"></svg></div>
    <div id="orders"></div>
    <div id="yard"><div id="tray"></div><div id="hexes"></div></div>
  </div></div>

  <div id="adov"><div class="adcard"><div style="font-size:34px">📺</div><div style="font-weight:800;margin-top:6px">Реклама</div><div class="adbar"><div class="adfill" id="adfill"></div></div></div></div>
  <div class="ov" id="ovWin"><div class="card">
    <h2>Все пассажиры разобраны! 🎉</h2><p id="winTxt">Уровень пройден</p>
    <button class="cbtn" id="btnNext">Дальше</button>
  </div></div>
  <div class="ov" id="ovLose"><div class="card">
    <h2 id="loseTitle">Змея доползла 🐥</h2><p id="loseTxt">Птенец спасся бегством</p>
    <button class="cbtn alt" id="btnLoseHome">🏠</button>
    <button class="cbtn" id="btnRetry">Ещё раз</button>
  </div></div>
</div>

<script>
/* ================= Cargo Jam v6 — Numbers =================
   На каждой плитке-стрелке заряд 2-7 (мерж складывает заряды в одну плитку).
   Тап по плитке со свободным лучом: плитка летит в свободный слот (любой цвет,
   без выбора) и оттуда автоматически отстреливает шары СВОЕГО цвета в видимой
   зоне змеи (снаряд + лопанье, змея сжимается, лёгкий откат головы).
   Заряды == шары точно по построению: слот всегда опустеет.
   Большой заряд надолго блокирует слот — в этом риск мержей.
   3 слота + 4-й за rewarded. Проигрыш: голова доползла или пат стрелок.
============================================================ */
const DIRS=[[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]]; // N NE SE S SW NW (axial flat-top)
const COLORS=['#d95d4e','#4a7fd0','#63ab52','#e0ac2f','#9165c8','#e08a41'];
const BAL_GAP=40, PUSH=2, SHOT_IV=0.27, BELT=50, MINI=0.56; // шары на верхней линии-превью неактивны (полупрозрачны)
const LEVELS=[ // budget: с/шар; run: плиток в секции; num: заряд плитки; chain: доля стен
  {mask:'R2',    dirs:[0,1,3,4],       budget:1.4,  run:[2,3], chain:0.3,  num:[2,3]},
  {mask:'flower',dirs:[0,1,3,4],       budget:1.15, run:[2,3], chain:0.5,  num:[2,4]},
  {mask:'R3trim',dirs:[0,1,2,3,4],     budget:0.9,  run:[2,3], chain:0.75, num:[2,5]},
  {mask:'R3',    dirs:[0,1,2,3,4],     budget:0.7,  run:[2,3], chain:0.8,  num:[3,6]},
  {mask:'R3rim', dirs:[0,1,2,3,4,5],   budget:0.72, run:[2,3], chain:0.85, num:[3,7]},
];
const S=34; // радиус гекса
function hexXY(q,r){ return {x:1.5*S*q, y:Math.sqrt(3)*S*(r+q/2)}; }
function maskCells(kind){
  const inR=(q,r,R)=>Math.max(Math.abs(q),Math.abs(r),Math.abs(-q-r))<=R;
  const cells=[];
  for(let q=-4;q<=4;q++)for(let r=-4;r<=4;r++){
    const R3=inR(q,r,3), R2=inR(q,r,2);
    const corner3=R3&&!R2&&(Math.abs(q)===3||Math.abs(r)===3||Math.abs(q+r)===3)&&
      ((Math.abs(q)===3&&Math.abs(r)===3)||(Math.abs(q)===3&&Math.abs(q+r)===3)||(Math.abs(r)===3&&Math.abs(q+r)===3));
    if(kind==='R2'&&R2) cells.push([q,r]);
    if(kind==='flower'&&(R2||corner3)) cells.push([q,r]);
    if(kind==='R3trim'&&R3&&!corner3) cells.push([q,r]);
    if(kind==='R3'&&R3) cells.push([q,r]);
  }
  if(kind==='R3rim'){
    const base=maskCells('R3');
    const extra=[[0,-4],[4,-4],[4,0],[0,4],[-4,4],[-4,0]];
    return base.concat(extra);
  }
  return cells;
}

let cur=0, over=false, genOK=false;
let cells=[], byKey=new Map(), sections=[], chain=[];
let trackPts=[], trackLen=0, headD=0, speed=0, totalBal=0, popped=0;
let loopTimer=null, lastT=0, busyFly=0, epoch=0;
function stopLoop(){ if(loopTimer){ clearInterval(loopTimer); loopTimer=null; } }
function startLoop(){ stopLoop(); lastT=performance.now(); loopTimer=setInterval(()=>tick(performance.now()),16); }
let unlocked=+(localStorage.getItem('cargojam_v8')||1);
const key=(q,r)=>q+','+r;
function rng(seed){ let s=seed>>>0; return ()=>((s=Math.imul(s^s>>>15,s|1)^s+Math.imul(s^s>>>7,s|61))>>>0)/4294967296; }

/* ---------- трек ---------- */
let previewLen=0;
function buildTrack(){
  const pts=[];
  const seg=(a,b,n)=>{for(let i=0;i<=n;i++)pts.push([a[0]+(b[0]-a[0])*i/n,a[1]+(b[1]-a[1])*i/n]);};
  const arc=(cx,cy,r,a0,a1,n)=>{for(let i=1;i<n;i++){const a=a0+(a1-a0)*i/n;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}};
  // линия-превью: над полем, прячется за элементами HUD; полностью неактивна
  seg([520,-4],[62,-4],44); arc(62,29,33,-Math.PI/2,-Math.PI*1.5,16); // y=-4: головы фигурок не срезаются краем
  const previewIdx=pts.length;
  // основной маршрут
  seg([62,62],[440,62],38); arc(440,107,45,-Math.PI/2,Math.PI/2,16);
  seg([440,152],[80,152],40); arc(80,197,45,-Math.PI/2,-Math.PI*1.5,16);
  seg([80,242],[255,242],18);
  trackPts=pts; trackLen=0; previewLen=0;
  for(let i=1;i<pts.length;i++){
    trackLen+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    if(i===previewIdx-1) previewLen=trackLen;
  }
  const svg=document.getElementById('tracksvg');
  const dPrev='M'+pts.slice(0,previewIdx).map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
  const dMain='M'+pts.slice(previewIdx-1).map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
  svg.setAttribute('viewBox','0 0 520 300');
  const belt=(d,op)=>`<g opacity="${op}"><path d="${d}" fill="none" stroke="#c9b98f" stroke-width="${BELT+8}" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${d}" fill="none" stroke="#efe6cc" stroke-width="${BELT}" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${d}" fill="none" stroke="#e4d9b8" stroke-width="1.5" stroke-dasharray="6 9" opacity=".8"/></g>`;
  svg.innerHTML=belt(dPrev,0.45)+`<g style="filter:drop-shadow(0 4px 0 #a9b96f)">${belt(dMain,1)}</g>`;
}
function posAt(d){
  d=Math.max(0,Math.min(d,trackLen-0.01));
  let acc=0;
  for(let i=1;i<trackPts.length;i++){
    const L=Math.hypot(trackPts[i][0]-trackPts[i-1][0],trackPts[i][1]-trackPts[i-1][1]);
    if(acc+L>=d){
      const t=(d-acc)/L;
      return {x:trackPts[i-1][0]+(trackPts[i][0]-trackPts[i-1][0])*t,
              y:trackPts[i-1][1]+(trackPts[i][1]-trackPts[i-1][1])*t,
              dx:(trackPts[i][0]-trackPts[i-1][0])/L, dy:(trackPts[i][1]-trackPts[i-1][1])/L};
    }
    acc+=L;
  }
  return {x:trackPts.at(-1)[0],y:trackPts.at(-1)[1],dx:1,dy:0};
}

/* ---------- генерация: peel => секции; каждой плитке заряд num ---------- */
function generate(levelIdx){
  const L=LEVELS[levelIdx];
  genOK=false;
  for(let seed=1;seed<=40;seed++){
    const rand=rng(levelIdx*7919+seed*104729);
    const list=maskCells(L.mask).map(([q,r])=>({q,r,dir:-1,n:1}));
    const km=new Map(list.map(c=>[key(c.q,c.r),c]));
    const rayClear=(c,d,aliveSet)=>{
      let q=c.q+DIRS[d][0], r=c.r+DIRS[d][1];
      while(km.has(key(q,r))){
        const o=km.get(key(q,r));
        if(aliveSet.has(o)) return false;
        q+=DIRS[d][0]; r+=DIRS[d][1];
      }
      return true;
    };
    const alive=new Set(list);
    const seq=[];
    const dirUse={}; L.dirs.forEach(d=>dirUse[d]=0);
    let runDir=-1, runLen=0, runTarget=0, prevRunDir=-1, ok=true;
    let runCells=[];
    const lineId=(c,d)=>{const [dq,dr]=DIRS[d]; return c.q*dr-c.r*dq;};
    while(alive.size){
      let placed=false;
      if(runDir>=0 && runLen<runTarget){
        const cont=[...alive].filter(c=>rayClear(c,runDir,alive));
        if(cont.length){
          let pool=cont;
          const lines=new Set(runCells.map(rc=>lineId(rc,runDir)));
          const aligned=cont.filter(c=>lines.has(lineId(c,runDir)));
          if(aligned.length && rand()<L.chain) pool=aligned;
          const c=pool[(rand()*pool.length)|0];
          c.dir=runDir; alive.delete(c); seq.push(c); runCells.push(c); runLen++; placed=true;
        }
      }
      if(!placed){
        if(runDir>=0){ prevRunDir=runDir; }
        const options=[];
        for(const d of L.dirs){
          if(d===prevRunDir) continue;
          const cands=[...alive].filter(c=>rayClear(c,d,alive));
          if(cands.length) options.push({d,cands});
        }
        let pool=options;
        if(!pool.length){
          for(const d of L.dirs){
            const cands=[...alive].filter(c=>rayClear(c,d,alive));
            if(cands.length) pool.push({d,cands});
          }
        }
        if(!pool.length){ ok=false; break; }
        pool.sort((a,b)=>dirUse[a.d]-dirUse[b.d]);
        const minUse=dirUse[pool[0].d];
        const least=pool.filter(p=>dirUse[p.d]===minUse);
        const o=least[(rand()*least.length)|0];
        runDir=o.d; runLen=0; runTarget=L.run[0]+((rand()*(L.run[1]-L.run[0]+1))|0);
        dirUse[runDir]=(dirUse[runDir]||0)+runTarget;
        const c=o.cands[(rand()*o.cands.length)|0];
        c.dir=runDir; alive.delete(c); seq.push(c); runCells=[c]; runLen++;
      }
    }
    if(!ok) continue;
    // заряд каждой плитки; секции = раны, длина = сумма зарядов
    for(const c of seq) c.n=L.num[0]+((rand()*(L.num[1]-L.num[0]+1))|0);
    const secs=[];
    let prev=-2;
    for(const c of seq){
      if(secs.length && prev===c.dir) secs.at(-1).len+=c.n;
      else secs.push({dir:c.dir,len:c.n});
      prev=c.dir;
    }
    for(let i=secs.length-2;i>=0;i--)
      if(secs[i].dir===secs[i+1].dir){ secs[i].len+=secs[i+1].len; secs.splice(i+1,1); }
    cells=list; byKey=km; sections=secs;
    genOK=true;
    return true;
  }
  console.error('generation failed',levelIdx);
  return false;
}

/* ---------- построение сцены ---------- */
const board=document.getElementById('board'), hexEl=document.getElementById('hexes'),
      ordersEl=document.getElementById('orders'), tz=document.getElementById('trackzone');

function build(){
  const L=LEVELS[cur];
  chain=[];
  sections.forEach((s,si)=>{for(let i=0;i<s.len;i++)chain.push({dir:s.dir,sec:si,el:null,entered:false,seen:false,targeted:false,ph:Math.random()*6});});
  totalBal=chain.length; popped=0;
  tz.querySelectorAll('.balloon,#shead,#chick').forEach(e=>e.remove());
  board.querySelectorAll('.proj').forEach(e=>e.remove());
  const chick=document.createElement('div'); chick.id='chick'; chick.textContent='🐥';
  const cp=posAt(trackLen-2); chick.style.left=(cp.x+36)+'px'; chick.style.top=cp.y+'px';
  tz.appendChild(chick);
  const head=document.createElement('div'); head.id='shead';
  head.innerHTML='<img src="assets/snakehead.png" alt="" style="width:100%;height:100%;display:block">';
  tz.appendChild(head);
  // группа: 2 колонки вдоль пути × 3 ряда поперёк ленты, с лёгким джиттером (как толпа на рефе)
  chain.forEach(b=>{
    b.grp=[]; b.tk=null;
    for(let i=0;i<6;i++){
      const along=(i%2? 11:-11)+(Math.random()*6-3), across=((i>>1)-1)*16+(Math.random()*4-2);
      b.grp.push({a:along,c:across});
    }
  });
  headD=previewLen+(trackLen-previewLen)*0.42; // старт на основной линии; хвост тянется по превью
  speed=(trackLen-headD-20)/(totalBal*L.budget);
  adUnlocked=false;
  document.getElementById('adov').classList.remove('show');
  initSlots(); renderSlots();
  // гекс-поле
  hexEl.innerHTML='';
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  cells.forEach(c=>{const p=hexXY(c.q,c.r);minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const HW=2*S*0.98, HH=Math.sqrt(3)*S*0.98;
  cells.forEach(c=>{
    const p=hexXY(c.q,c.r);
    c.x=p.x-cx; c.y=p.y-cy; c.dead=false;
    const bg=document.createElement('div');
    bg.className='cellbg';
    bg.style.cssText=`left:${c.x-HW/2}px;top:${c.y-HH/2}px;width:${HW}px;height:${HH}px;
      clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%);background:#e2d4b2;`;
    hexEl.appendChild(bg);
    const el=document.createElement('div');
    el.className='htile';
    el.style.cssText=`left:${c.x-HW/2}px;top:${c.y-HH/2}px;width:${HW}px;height:${HH}px;z-index:2;font-size:${HW}px;`;
    el.innerHTML=tileHTML(c);
    el.addEventListener('pointerdown',()=>tap(c));
    hexEl.appendChild(el); c.el=el;
  });
  updateHud();
  requestAnimationFrame(fit);
  startLoop();
}
function tileHTML(c){
  const ang=60*c.dir;
  const layers=[];
  const lay=Math.max(1,Math.min(4,Math.ceil(c.n/4))); // визуальная лесенка от заряда
  for(let i=lay-1;i>=1;i--)
    layers.push(`<div class="plate" style="background:${shade(COLORS[c.dir],-14)};transform:translateY(${-5*i}px) scale(${1-0.03*i});filter:brightness(${1-0.07*i})"></div>`);
  layers.push(`<div class="plate" style="background:${COLORS[c.dir]};transform:translateY(0)"></div>`);
  const num=`<div class="num" style="font-size:${Math.round(S*0.62)}px">${c.n}</div>`;
  return layers.join('')+
    `<div class="arr" style="transform:rotate(${ang}deg)">
      <svg viewBox="0 0 24 24" style="width:63%;height:63%"><path d="M12 1.5 L22.5 13 L17.2 13 L17.2 22.5 L6.8 22.5 L6.8 13 L1.5 13 Z" fill="#fff"/></svg>
    </div>`+num;
}
function makeGroupEl(b){
  const el=document.createElement('div'); el.className='balloon';
  el.innerHTML=b.grp.map((g,i)=>`<div class="mini" style="--i:${i}">${persHTML(b.dir,`--wt:${(0.42+Math.random()*0.14).toFixed(2)}s;--ph:-${(Math.random()*0.6).toFixed(2)}s`)}</div>`).join('');
  b.minis=[...el.children];
  return el;
}
function layGroup(b,p){
  // смещения фигурок пересчитываем только когда меняется направление пути (на дугах)
  const tk=Math.round(p.dx*12)+','+Math.round(p.dy*12);
  if(b.tk===tk) return; b.tk=tk;
  const nx=-p.dy, ny=p.dx;
  b.grp.forEach((g,i)=>{
    const ox=p.dx*g.a+nx*g.c, oy=p.dy*g.a+ny*g.c;
    const m=b.minis[i];
    m.style.transform=`translate(${ox.toFixed(1)}px,${oy.toFixed(1)}px) scale(${MINI})`;
    m.style.zIndex=Math.round(oy)+40; // ниже на экране — поверх
  });
}
function persHTML(color,extra=''){
  const c=COLORS[color];
  return `<div class="pers" style="--c:${c};--cd:${shade(c,-24)};${extra}">
    <div class="sh"></div><div class="arm l"></div><div class="arm r"></div>
    <div class="head"></div><div class="torso"></div><div class="ft l"></div><div class="ft r"></div></div>`;
}
function shade(hex,p){
  const n=parseInt(hex.slice(1),16);
  const f=v=>Math.max(0,Math.min(255,v+Math.round(255*p/100)));
  return '#'+[f(n>>16&255),f(n>>8&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* ---------- СЛОТЫ-ПУШКИ: плитка занимает слот и отстреливает шары ---------- */
let slots=[], adUnlocked=false;
function chipBg(color){ return `radial-gradient(circle at 34% 28%, ${shade(COLORS[color],22)} 0%, ${COLORS[color]} 55%, ${shade(COLORS[color],-16)} 100%)`; }
function initSlots(){ slots=[0,1,2,3].map(i=>({i,color:-1,charges:0,inFlight:0,pending:false,cool:0,el:null})); }
function freeSlotFor(){ return slots.find(s=>s.color<0&&!s.pending&&(s.i!==3||adUnlocked))||null; }
function renderSlots(){
  ordersEl.innerHTML='';
  slots.forEach(sl=>{
    const el=document.createElement('div');
    if(sl.i===3&&!adUnlocked){
      el.className='ord locked';
      el.innerHTML='<div class="tv">📺</div><div class="lbl2">+СЛОТ</div>';
      el.addEventListener('pointerdown',showAd);
    } else if(sl.color<0&&!sl.pending){
      el.className='ord empty';
      el.innerHTML='<div class="plus">·</div><div class="lbl2">СЛОТ</div>';
    } else {
      el.className='ord'+(sl.pending?' pend':'');
      el.innerHTML=`<div class="chip">${persHTML(sl.color)}</div><div class="cnt">×${sl.pending?'?':sl.charges}</div>`;
    }
    ordersEl.appendChild(el); sl.el=el;
  });
}
function updateSlotCnt(sl){
  const c=sl.el&&sl.el.querySelector('.cnt');
  if(c) c.textContent='×'+sl.charges;
}
function slotCenter(sl){
  if(!sl.el||!sl.el.isConnected) return {x:260,y:343};
  return {x:sl.el.offsetLeft+sl.el.offsetWidth/2, y:302+sl.el.offsetTop+sl.el.offsetHeight/2};
}
function flashSlots(){
  slots.forEach(sl=>{ if(sl.el){ sl.el.classList.remove('need'); void sl.el.offsetWidth; sl.el.classList.add('need'); } });
}
function showAd(){
  if(over||adUnlocked) return;
  const ov=document.getElementById('adov'), fill=document.getElementById('adfill');
  ov.classList.add('show'); fill.style.width='0';
  requestAnimationFrame(()=>{ fill.style.width='100%'; });
  const ep=epoch;
  setTimeout(()=>{ if(ep!==epoch) return;
    ov.classList.remove('show'); adUnlocked=true; renderSlots();
  },1500);
}
function updateHud(){
  document.getElementById('lvlname').textContent='Level '+(cur+1);
  document.getElementById('prog').textContent=Math.round(popped/Math.max(1,totalBal)*100)+'%';
}

/* ---------- цикл: змея плывёт, слоты стреляют ---------- */
function tick(now){
  if(over) return;
  const dt=Math.min(0.12,(now-lastT)/1000); lastT=now;
  headD+=speed*dt;
  for(const sl of slots){
    if(sl.color>=0&&!sl.pending&&sl.charges>0){
      sl.cool-=dt;
      if(sl.cool<=0){
        const b=chain.find(x=>x.entered&&!x.targeted&&x.dir===sl.color);
        if(b){ b.targeted=true; sl.cool=SHOT_IV; fireProj(sl,b); }
      }
    }
  }
  layChain(now/1000,dt);
  if(headD>=trackLen-16){ over=true; stopLoop(); lose('Змея доползла 🐥','Птенец спасся бегством'); }
}
function layChain(t,dt){
  const hp=posAt(headD);
  const head=document.getElementById('shead');
  if(head){ head.style.left=hp.x+'px'; head.style.top=(hp.y-6)+'px';
    head.style.transform=`scaleX(${hp.dx>=0?-1:1})`; } // только зеркало, никаких переворотов
  let d=headD-46;
  chain.forEach(b=>{
    if(b.dcur===undefined) b.dcur=d;
    b.dcur+=(d-b.dcur)*Math.min(1,dt*7); // плавное сжатие после лопанья
    b.seen = b.seen || d>4;                    // виден (на линии-превью, полупрозрачен)
    b.entered = b.entered || d>previewLen+4;   // активен: перешёл на основной маршрут
    if(!b.seen){ d-=BAL_GAP; return; }
    if(!b.el){ b.el=makeGroupEl(b); tz.appendChild(b.el); } // DOM только для видимых групп
    b.el.classList.toggle('wait',!b.entered);
    const p=posAt(b.dcur);
    b.el.style.left=p.x+'px';
    b.el.style.top=(p.y+Math.sin(t*2.2+b.ph)*2)+'px';
    layGroup(b,p);
    d-=BAL_GAP;
  });
}

/* ---------- выстрелы и лопанье ---------- */
function fireProj(sl,b){
  sl.inFlight++; sl.charges--;
  updateSlotCnt(sl);
  if(sl.el){
    const chip=sl.el.querySelector('.chip');
    if(chip) chip.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:150});
  }
  const sc=slotCenter(sl);
  const tp=posAt(Math.max(6,b.dcur!==undefined?b.dcur:headD-46));
  const proj=document.createElement('div');
  proj.className='proj';
  proj.style.cssText=`left:${sc.x}px;top:${sc.y}px;background:${COLORS[sl.color]};color:${COLORS[sl.color]};`;
  board.appendChild(proj);
  const ep=epoch, color=sl.color;
  proj.animate([{transform:'translate(0,0) scale(.6)'},{transform:`translate(${tp.x-sc.x}px,${tp.y-sc.y}px) scale(1)`}],
    {duration:170,easing:'cubic-bezier(.3,0,.8,1)'}).onfinish=()=>{
    proj.remove();
    if(ep!==epoch) return;
    popBalloon(b,color);
    sl.inFlight--;
    if(sl.charges<=0&&sl.inFlight<=0&&sl.color>=0){ sl.color=-1; renderSlots(); }
  };
}
function burst(x,y,color){
  for(let i=0;i<10;i++){
    const p=document.createElement('div');
    p.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:7px;height:7px;border-radius:50%;background:${color};z-index:57;pointer-events:none;margin:-3px 0 0 -3px;`;
    tz.appendChild(p);
    const a=6.28*i/10+Math.random()*0.6, R=30+Math.random()*30;
    p.animate([{transform:'translate(0,0)',opacity:1},
      {transform:`translate(${Math.cos(a)*R}px,${Math.sin(a)*R}px) scale(.3)`,opacity:0}],
      {duration:340,easing:'cubic-bezier(.2,.7,.5,1)'}).onfinish=()=>p.remove();
  }
}
function popBalloon(b,color){
  const idx=chain.indexOf(b);
  if(idx>=0) chain.splice(idx,1);
  popped++;
  headD=Math.max(60,headD-PUSH);
  if(b.el){
    const p=posAt(b.dcur!==undefined?b.dcur:headD);
    b.el.classList.add('pop');
    burst(p.x,p.y,COLORS[color]);
    const el=b.el; b.el=null;
    setTimeout(()=>el.remove(),600);
  }
  updateHud();
  if(popped>=totalBal&&!over){
    over=true; stopLoop();
    const ep=epoch;
    setTimeout(()=>{ if(ep===epoch) win(); },1000);
  }
}

/* ---------- механика hexa arrows with merge ---------- */
function scanRay(c){
  let q=c.q, r=c.r;
  let first=null;
  const sames=[];
  while(true){
    q+=DIRS[c.dir][0]; r+=DIRS[c.dir][1];
    if(!byKey.has(key(q,r))) break;
    const o=byKey.get(key(q,r));
    if(o.dead) continue;
    if(!first){
      first=o;
      if(o.dir!==c.dir) return {type:'block'};
      sames.push(o);
    } else {
      if(o.dir===c.dir) sames.push(o);
      else break;
    }
  }
  if(!first) return {type:'edge'};
  return {type:'merge', chain:sames, land:sames[sames.length-1]};
}
function tap(c){
  if(over||c.dead||busyFly>0) return;
  const res=scanRay(c);
  if(res.type==='edge'){
    const sl=freeSlotFor();
    if(!sl){ denyTile(c); flashSlots(); return; }
    flyToSlot(c,sl);
  } else if(res.type==='merge'){
    doMerge(c,res.chain,res.land);
  } else denyTile(c);
}
function denyTile(c){ c.el.classList.add('deny'); setTimeout(()=>c.el&&c.el.classList.remove('deny'),320); }
function flyToSlot(c,sl){
  c.dead=true; busyFly++;
  sl.pending=true; sl.color=c.dir; renderSlots();
  const tx=260+c.x, ty=622+c.y;
  const p=slotCenter(sl);
  c.el.style.transition='transform .45s cubic-bezier(.45,-.15,.6,1),opacity .45s';
  c.el.style.zIndex=9;
  c.el.style.transform=`translate(${p.x-tx}px,${p.y-ty}px) scale(.42)`;
  const n=c.n, ep=epoch;
  setTimeout(()=>{
    if(ep!==epoch) return;
    if(c.el){c.el.remove();c.el=null;}
    busyFly--;
    sl.pending=false; sl.charges=n; sl.cool=0;
    renderSlots();
    if(sl.el){ sl.el.animate([{transform:'scale(.85)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:220}); }
    checkEndOrStuck();
  },450);
}
function doMerge(src,chainTiles,land){
  busyFly++;
  const mids=chainTiles.slice(0,-1);
  const dx=land.x-src.x, dy=land.y-src.y;
  src.el.style.transition='transform .28s ease-in';
  src.el.style.transform=`translate(${dx}px,${dy}px)`;
  src.el.style.zIndex=5;
  const ep=epoch;
  setTimeout(()=>{
    if(ep!==epoch) return;
    mids.forEach(m=>{ if(m.el){ m.el.style.transition='transform .15s,opacity .15s'; m.el.style.transform='scale(.4)'; m.el.style.opacity='0'; } });
  },120);
  setTimeout(()=>{
    if(ep!==epoch) return;
    let sum=src.n;
    mids.forEach(m=>{ sum+=m.n; m.dead=true; if(m.el){m.el.remove();m.el=null;} });
    src.dead=true; if(src.el){src.el.remove();src.el=null;}
    land.n+=sum;
    land.el.innerHTML=tileHTML(land);
    land.el.style.transform='scale(1.12)';
    setTimeout(()=>{ if(land.el) land.el.style.transform=''; },140);
    busyFly--;
    checkEndOrStuck();
  },300);
}
function anyMove(){
  for(const c of cells){
    if(c.dead) continue;
    const res=scanRay(c);
    if(res.type!=='block') return true; // edge (слот освободится сам) или merge
  }
  return false;
}
function checkEndOrStuck(){
  if(over||busyFly>0) return;
  if(cells.every(c=>c.dead)) return; // финал придёт из popBalloon
  if(!anyMove()){
    over=true; stopLoop();
    lose('Пат на поле 🎈','Все стрелки заперты');
  }
}

/* ---------- win/lose/экраны ---------- */
function win(){
  unlocked=Math.max(unlocked,Math.min(cur+2,LEVELS.length));
  localStorage.setItem('cargojam_v8',unlocked);
  document.getElementById('winTxt').textContent='Level '+(cur+1)+' пройден';
  document.getElementById('btnNext').textContent=(cur+1<LEVELS.length)?'Дальше':'🏠 Домой';
  document.getElementById('ovWin').classList.add('show');
  confetti();
  window.__game.state='won';
}
function lose(title,txt){
  document.getElementById('loseTitle').textContent=title;
  document.getElementById('loseTxt').textContent=txt;
  document.getElementById('ovLose').classList.add('show');
  window.__game.state='lost';
}
function confetti(){
  const phone=document.getElementById('phone');
  for(let i=0;i<26;i++){
    const c=document.createElement('div'); c.className='conf';
    c.style.background=COLORS[i%COLORS.length];
    c.style.left=(20+Math.random()*60)+'%'; c.style.top='-10px';
    phone.appendChild(c);
    const a=c.animate([{transform:'translateY(0) rotate(0)',opacity:1},
      {transform:`translateY(${phone.clientHeight*.8}px) rotate(${360+Math.random()*360}deg)`,opacity:0}],
      {duration:1400+Math.random()*800,easing:'cubic-bezier(.3,.6,.6,1)',delay:Math.random()*300});
    a.onfinish=()=>c.remove();
  }
}
function startLevel(i){
  epoch++; cur=i; over=false; busyFly=0;
  document.getElementById('ovWin').classList.remove('show');
  document.getElementById('ovLose').classList.remove('show');
  document.getElementById('home').classList.add('hide');
  generate(i); buildTrack(); build();

}
function showHome(){
  stopLoop();
  document.getElementById('home').classList.remove('hide');
  document.getElementById('ovWin').classList.remove('show');
  document.getElementById('ovLose').classList.remove('show');
  const wrap=document.getElementById('lvlbtns'); wrap.innerHTML='';
  for(let i=0;i<LEVELS.length;i++){
    const b=document.createElement('button');

}
document.getElementById('btnRestart').addEventListener('pointerdown',()=>startLevel(cur));
document.getElementById('btnRetry').addEventListener('pointerdown',()=>startLevel(cur));
document.getElementById('btnHome').addEventListener('pointerdown',showHome);
document.getElementById('btnLoseHome').addEventListener('pointerdown',showHome);
document.getElementById('btnNext').addEventListener('pointerdown',()=>{
  if(cur+1<LEVELS.length) startLevel(cur+1); else showHome();
});

/* ---------- fit ---------- */
function fit(){
  const stage=document.getElementById('stage');
  const sw=stage.clientWidth-10, sh=stage.clientHeight-8;
  const s=Math.max(.3,Math.min(sw/520, sh/846, 1.3));
  board.style.transform=`translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize',fit);

/* ---------- API для PLAY-бота ---------- */
window.__game={
  state:'home',
  get genOK(){return genOK;},
  startLevel, showHome,
  timeInfo(){ return {headD,trackLen,speed,left:(trackLen-16-headD)/speed}; },
  debug(){ return {over,busyFly,popped,totalBal,
    slots:slots.map(sl=>sl.color>=0?sl.color+':'+sl.charges+(sl.pending?'p':''):(sl.i===3&&!adUnlocked?'AD':'-')),
    tilesLeft:cells.filter(c=>!c.dead).length, anyMove:anyMove()}; },
  unlockAd(){ adUnlocked=true; renderSlots(); },
  snap(){
    const remain={}; chain.forEach(b=>{remain[b.dir]=(remain[b.dir]||0)+1;});
    const win=chain.filter(b=>b.entered&&!b.targeted).map(b=>b.dir);
    const front=chain.slice(0,18).map(b=>b.dir+(b.entered?'':'~')+(b.targeted?'*':''));
    const exits={}; cells.forEach(c=>{if(!c.dead&&scanRay(c).type==='edge') exits[c.dir]=(exits[c.dir]||0)+(''+c.n+',');});
    return {headD:Math.round(headD), popped, win:win.join(''), front:front.join(' '),
      remain, exits, slots:slots.map(sl=>sl.color>=0?sl.color+':'+sl.charges:'-')};
  },
  noMerge:false,
  botStep(){
    if(window.__game.state!=='playing'||busyFly>0) return;
    const free=freeSlotFor();
    const exits=cells.filter(c=>!c.dead&&scanRay(c).type==='edge');
    // потребность цвета в ближней очереди минус заряды, уже стоящие в слотах
    const q=chain.filter(b=>!b.targeted);
    const K=Math.min(q.length,26);
    const need={}; q.slice(0,K).forEach(b=>{need[b.dir]=(need[b.dir]||0)+1;});
    slots.forEach(sl=>{ if(sl.color>=0) need[sl.color]=(need[sl.color]||0)-sl.charges; });
    const rank=col=>{const i=q.findIndex(b=>b.dir===col); return i<0?1e9:i;};
    if(free&&exits.length){
      // 1) точная посадка: максимальный заряд, не превышающий потребность цвета
      const fit=exits.filter(c=>(need[c.dir]||0)>=c.n);
      if(fit.length){
        fit.sort((a,b)=>(b.n-a.n)||(rank(a.dir)-rank(b.dir)));
        tap(fit[0]); return;
      }
    }
    // 2) копим мержи (собираем крупные под большие секции)
    if(!window.__game.noMerge){
      let best=null,bl=0;
      for(const c of cells){
        if(c.dead) continue;
        const r=scanRay(c);
        if(r.type==='merge'&&r.chain.length>bl){ best=c; bl=r.chain.length; }
      }
      if(best){ tap(best); return; }
    }
    // 3) посадки нет и мержей нет — минимальный перелёт по нужному цвету
    if(free&&exits.length){
      const needed=exits.filter(c=>(need[c.dir]||0)>0);
      const pool=needed.length?needed:exits;
      pool.sort((a,b)=>(a.n-(need[a.dir]||0))-(b.n-(need[b.dir]||0))||(rank(a.dir)-rank(b.dir)));
      tap(pool[0]);
    }
  },
  autoplay(intervalMs=700){
    return new Promise(res=>{
      const t=setInterval(()=>{
        if(window.__game.state!=='playing'){ clearInterval(t); res(window.__game.state); return; }
        window.__game.botStep();
      },intervalMs);
      setTimeout(()=>{ clearInterval(t); res('timeout:'+window.__game.state); },480000);
    });
  }
};

showHome();
requestAnimationFrame(fit);
</script>
