<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Словоблок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@600;700;800&family=Rubik:wght@700;800&display=swap">
<style>
/* Layout: мобильная игра в один экран. Экраны (главная, путешествие, тема, галерея, словарь, игра) лежат стопкой и сменяются плавным переходом; деревянная панель вкладок снизу */
:root{
  --table:#1C140E; --walnut-lo:#2C1B10;
  --burn:#3A2113; --ink:#F3E4C8; --ink-dim:#B39B7B;
  --amber:#F0A845; --leaf:#A9C487; --leaf-lo:#7E9A5E; --danger:#E27A5E;
  --go:#78B046; --go-lo:#3F6E22; --hard:#E0573F; --hard-lo:#8C2A1C;
  --display:'Unbounded','Rubik',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tile:'Rubik','Nunito',system-ui,sans-serif;
  --spring:cubic-bezier(.2,1.3,.4,1); --smooth:cubic-bezier(.2,.9,.25,1);
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%)}
#phone{position:relative;overflow:hidden;color:var(--ink);font-family:var(--body);background-color:var(--table);
  background-image:radial-gradient(110% 55% at 50% 0%,rgba(255,176,96,.18),transparent 62%),repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0 2px,transparent 2px 25%),repeating-linear-gradient(90deg,rgba(255,220,170,.025) 0 1px,transparent 1px 7px),linear-gradient(#2E1F14,#1A110A);
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{position:relative;height:100%;width:100%;overflow:hidden}
@media (max-aspect-ratio:1/1){#phone{width:100vw;height:100dvh}}
@media (min-aspect-ratio:1/1){#phone{height:96dvh;aspect-ratio:9/16;width:auto;border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15}}

/* экраны */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:10px 16px;overflow-y:auto;overflow-x:hidden;
  opacity:0;visibility:hidden;transform:translateY(16px) scale(.985);transition:opacity .3s ease,transform .55s var(--smooth),visibility 0s linear .3s;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.on{opacity:1;visibility:visible;transform:none;transition:opacity .3s ease,transform .55s var(--smooth),visibility 0s}
.screen.tabbed{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.screen.game{overflow:hidden;gap:8px;padding-block:8px 6px}

.dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,214,150,.5);box-shadow:0 0 8px rgba(255,200,120,.6);animation:drift linear infinite}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(30px,-110vh)}}

/* общие элементы */
.ic{width:40px;height:40px;flex:none;border-radius:13px;border:0;cursor:pointer;display:grid;place-items:center;position:relative;
  background:linear-gradient(#74492C,#4C301C);box-shadow:inset 0 1px 0 rgba(255,228,186,.28),0 3px 0 var(--walnut-lo),0 6px 12px rgba(0,0,0,.25);color:var(--ink);transition:transform .15s var(--spring)}
.ic:active{transform:translateY(2px) scale(.94)}
.ic svg{width:20px;height:20px}
.bar{flex:none;display:flex;align-items:center;gap:10px;min-height:44px}
.bar h1{flex:1;min-width:0;margin:0;font:700 19px/1.2 var(--display);text-wrap:balance}
.bar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:rgba(255,220,170,.09);box-shadow:inset 0 0 0 1px rgba(255,220,170,.12);font-weight:800;font-size:13px;color:var(--ink)}
.chip svg{width:16px;height:16px;color:var(--amber)}
.eyebrow{margin:0 0 4px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.62}
.hardtag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:10px;background:linear-gradient(#EE6A4E,#C2402B);color:#FFF2E6;font:800 10px/20px var(--body);letter-spacing:.08em;text-transform:uppercase;box-shadow:0 2px 0 var(--hard-lo)}
.hardtag svg{width:11px;height:11px}
.frame{padding:7px;border-radius:12px;background:linear-gradient(145deg,#C08A52,#7A4A26 40%,#9A6636 70%,#5E3A1E);box-shadow:inset 0 1px 0 rgba(255,236,200,.45),inset 0 -2px 0 rgba(0,0,0,.25),0 8px 22px rgba(0,0,0,.45)}
.frame canvas{display:block;width:100%;aspect-ratio:3/4;height:auto;border-radius:4px;background:#24160C}
.prog{height:8px;border-radius:4px;background:rgba(0,0,0,.35);box-shadow:inset 0 1px 2px rgba(0,0,0,.4);overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(#B6DC7E,#78B046);transition:width .8s var(--smooth)}

/* главная */
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px}
.lrow{display:flex;gap:5px}
.lt{width:44px;height:48px;opacity:0}
.logo.go .lt{animation:drop .7s var(--spring) both;animation-delay:calc(var(--i)*60ms + 80ms)}
.lt b{display:grid;place-items:center;width:100%;height:100%;border-radius:12px;font:800 24px var(--tile);color:var(--burn);position:relative;
  background:linear-gradient(color-mix(in srgb,var(--c) 75%,#fff),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 5px 0 color-mix(in srgb,var(--c) 55%,#000),0 10px 16px rgba(0,0,0,.35);
  animation:bob 4s ease-in-out infinite;animation-delay:calc(var(--i)*-370ms)}
.lt b::before{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF8E8,#EBC991);box-shadow:0 2px 0 rgba(40,20,8,.3)}
.lt b span{position:relative}
@keyframes drop{0%{opacity:0;transform:translateY(-70px) rotate(-10deg)}60%{opacity:1;transform:translateY(5px) rotate(3deg)}80%{transform:translateY(-3px) rotate(-1deg)}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(1deg)}}
.tagline{margin:2px 0 0;font-size:13px;font-weight:700;color:var(--ink-dim);text-align:center}

.curcard{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;width:100%;text-align:left;border:0;cursor:pointer;border-radius:20px;padding:12px;
  background:linear-gradient(160deg,rgba(255,220,170,.12),rgba(255,220,170,.04));box-shadow:inset 0 0 0 1px rgba(255,220,170,.12),0 10px 24px rgba(0,0,0,.25);transition:transform .2s var(--spring)}
.curcard:active{transform:scale(.98)}
.curcard .frame{padding:5px;border-radius:10px}
.curcard b{display:block;font:700 17px/1.2 var(--display);margin:2px 0 4px}
.curcard small{display:block;font-size:13px;font-weight:700;color:var(--ink-dim);margin-bottom:10px}
.curcard .meta{font-size:12px;font-weight:800;color:var(--ink-dim);margin-top:6px;font-variant-numeric:tabular-nums}

.play{width:100%;border:0;cursor:pointer;border-radius:24px;padding:16px 18px;display:flex;align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(#9AD25E,#6CA63A);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 6px 0 var(--go-lo),0 16px 30px rgba(80,140,40,.35);color:#fff;
  animation:breathe 2.6s ease-in-out infinite;transition:transform .15s var(--spring)}
.play:active{transform:translateY(4px) scale(.98);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 2px 0 var(--go-lo)}
.play svg{width:30px;height:30px;filter:drop-shadow(0 2px 0 rgba(40,80,10,.4))}
.play .pt{text-align:left}
.play .pt b{display:block;font:800 23px/1.1 var(--display);text-shadow:0 2px 0 rgba(40,80,10,.4)}
.play .pt small{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;opacity:.95;margin-top:2px}
@keyframes breathe{50%{transform:scale(1.02)}}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:0;cursor:pointer;border-radius:18px;padding:12px;min-height:104px;position:relative;
  background:linear-gradient(#6A4329,#4A2E1B);box-shadow:inset 0 1px 0 rgba(255,228,186,.22),0 4px 0 var(--walnut-lo),0 10px 18px rgba(0,0,0,.25);transition:transform .18s var(--spring)}
.mode:active{transform:translateY(3px) scale(.97)}
.mode .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 3px 0 color-mix(in srgb,var(--c) 50%,#000);color:#fff}
.mode .mi svg{width:21px;height:21px}
.mode b{font:700 14px/1.2 var(--display)}
.mode small{font-size:12px;font-weight:700;color:var(--ink-dim);line-height:1.3}
.mode .dot{position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px rgba(226,122,94,.25);animation:ping 1.6s ease infinite}
@keyframes ping{50%{box-shadow:0 0 0 7px rgba(226,122,94,0)}}

/* вкладки */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;gap:6px;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(#5A3A24,#3A2415);box-shadow:inset 0 1px 0 rgba(255,228,186,.2),0 -10px 24px rgba(0,0,0,.35);border-radius:22px 22px 0 0;transition:transform .45s var(--smooth)}
.tabbar.off{transform:translateY(110%)}
.tab{flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;color:var(--ink-dim);font-weight:800;font-size:11.5px;transition:background .25s,color .25s}
.tab svg{width:24px;height:24px;transition:transform .3s var(--spring)}
.tab.on{color:var(--burn);background:linear-gradient(#F6C77A,#E09A3E);box-shadow:0 3px 0 #8A5617}
.tab.on svg{transform:translateY(-1px) scale(1.08)}

/* путешествие */
.tlist{display:flex;flex-direction:column;gap:12px}
.tcard{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center;border:0;cursor:pointer;text-align:left;border-radius:20px;padding:10px 14px 10px 10px;position:relative;
  background:linear-gradient(#6A4329,#4A2E1B);box-shadow:inset 0 1px 0 rgba(255,228,186,.2),0 4px 0 var(--walnut-lo),0 10px 18px rgba(0,0,0,.25);transition:transform .18s var(--spring)}
.tcard:active{transform:scale(.98)}
.tcard .frame{padding:4px;border-radius:9px}
.tcard b{display:block;font:700 16px/1.2 var(--display)}
.tcard small{display:block;font-size:12.5px;font-weight:700;color:var(--ink-dim);margin:2px 0 9px}
.tcard .meta{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink-dim);margin-top:6px;font-variant-numeric:tabular-nums}
.tcard.locked{filter:saturate(.3) brightness(.7)}
.tcard .lock{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.35)}
.tcard .lock svg{width:15px;height:15px}

/* тема */
.thead{display:grid;grid-template-columns:42% 1fr;gap:16px;align-items:center}
.thead p{margin:0 0 10px;font-size:13.5px;line-height:1.45;font-weight:700;color:var(--ink-dim)}
.thead b{display:block;font:700 18px/1.2 var(--display);margin-bottom:6px}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px;padding-top:4px}
.lnode{aspect-ratio:1;border:0;cursor:pointer;border-radius:50%;display:grid;place-items:center;position:relative;font:800 20px var(--display);color:var(--burn);
  background:radial-gradient(circle at 40% 30%,#FFF4DE,#E8C389);box-shadow:inset 0 -3px 0 rgba(120,70,20,.25),0 4px 0 #8C6239,0 8px 14px rgba(0,0,0,.3);transition:transform .18s var(--spring)}
.lnode:active{transform:scale(.92)}
.lnode.done{background:radial-gradient(circle at 40% 30%,#E8F6CF,#A9CF7A);box-shadow:inset 0 -3px 0 rgba(40,80,10,.2),0 4px 0 var(--leaf-lo),0 8px 14px rgba(0,0,0,.3);color:#2F4318}
.lnode.cur{animation:pulse 1.6s ease-in-out infinite}
.lnode.lock{background:radial-gradient(circle at 40% 30%,#6A4A30,#4A3020);color:rgba(243,228,200,.4);box-shadow:0 3px 0 var(--walnut-lo);cursor:default}
.lnode.hard{box-shadow:inset 0 0 0 3px var(--hard),0 4px 0 var(--hard-lo),0 8px 14px rgba(0,0,0,.3)}
.lnode .tag{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);white-space:nowrap}
.lnode .ck{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--go);display:grid;place-items:center;box-shadow:0 2px 0 var(--go-lo)}
.lnode .ck svg{width:12px;height:12px;color:#fff}
@keyframes pulse{0%,100%{box-shadow:inset 0 -3px 0 rgba(120,70,20,.25),0 4px 0 #8C6239,0 0 0 0 rgba(240,168,69,.6)}50%{box-shadow:inset 0 -3px 0 rgba(120,70,20,.25),0 4px 0 #8C6239,0 0 0 9px rgba(240,168,69,0)}}

/* галерея */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.gcard{border:0;background:none;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;gap:8px;transition:transform .2s var(--spring)}
.gcard:active{transform:scale(.97)}
.gcard b{font:700 13.5px/1.25 var(--display)}
.gcard small{display:block;font-size:12px;font-weight:800;color:var(--ink-dim);margin-top:2px}
.gcard .frame{transform:rotate(var(--r,0deg))}

/* словарь */
.dgroup h2{margin:6px 0 8px;font:700 14px var(--display);display:flex;justify-content:space-between;align-items:baseline}
.dgroup h2 span{font:800 12px var(--body);color:var(--ink-dim)}
.dwords{display:flex;flex-direction:column;gap:8px}
.wcard{border-radius:13px;padding:10px 12px;background:rgba(255,220,170,.07);box-shadow:inset 0 0 0 1px rgba(255,220,170,.1)}
.wcard b{font:800 15px var(--tile);letter-spacing:.1em;color:var(--leaf)}
.wcard i{display:block;font-style:normal;font-size:12.5px;font-weight:800;color:var(--ink-dim);margin:1px 0 4px}
.wcard span{display:block;font-size:13.5px;line-height:1.4;font-weight:600}
.wcard.lock b{color:rgba(243,228,200,.25);letter-spacing:.3em}
.sheet .wcard{background:rgba(255,250,238,.55);box-shadow:inset 0 0 0 1px rgba(70,40,20,.12)}
.sheet .wcard b{color:#2F4318}.sheet .wcard i{color:rgba(58,33,19,.6)}

/* игра */
.hud{flex:none;display:flex;align-items:center;gap:8px}
.lvl{flex:1;min-width:0}
.lvl small{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);font-weight:800;white-space:nowrap;overflow:hidden}
.lvl b{display:flex;align-items:center;gap:8px;font:600 15px/1.25 var(--display);white-space:nowrap;overflow:hidden}
.stat{text-align:right;flex:none}
.stat small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-weight:800}
.stat b{display:inline-block;font:700 16px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat.low b{color:var(--danger)}
.stat b.bump{animation:bump .35s var(--spring)}
@keyframes bump{40%{transform:scale(1.3)}}
.band{flex:none;border-radius:16px;padding:8px 10px 6px;color:var(--burn);cursor:pointer;
  background:repeating-linear-gradient(94deg,rgba(120,72,30,.06) 0 2px,transparent 2px 9px),linear-gradient(170deg,#F1D8AA,#DDB781);
  box-shadow:inset 0 1px 0 rgba(255,250,235,.7),0 4px 0 #8C6239,0 12px 24px rgba(0,0,0,.4)}
.band-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.band-head h2{margin:0;font:700 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.band-head .pg{font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;opacity:.7}
.cw-grid{--cs:24px;display:grid;gap:3px;grid-auto-rows:var(--cs);justify-content:center}
.cw-void{width:var(--cs);height:var(--cs)}
.cw-cell{width:var(--cs);height:var(--cs);border-radius:calc(var(--cs)*.22);position:relative;display:grid;place-items:center;
  background:rgba(70,40,20,.16);box-shadow:inset 0 2px 3px rgba(60,30,10,.28),inset 0 -1px 0 rgba(255,245,225,.5);transition:background .3s,box-shadow .3s}
.cw-cell .no{position:absolute;top:1px;left:2px;font:800 calc(var(--cs)*.28)/1 var(--body);opacity:.55}
.cw-grid.tiny .no{display:none}
.cw-cell .ch{font:800 calc(var(--cs)*.58)/1 var(--tile);opacity:0;transform:scale(.4);transition:opacity .2s,transform .35s var(--spring)}
.cw-cell.on{background:linear-gradient(#FFF3DA,#F0D6A6);box-shadow:0 2px 0 #B48650,0 3px 5px rgba(60,30,10,.22)}
.cw-cell.on .ch{opacity:1;transform:none}
.cw-cell.land::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid #FFB547;animation:ring .55s ease-out forwards;pointer-events:none}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.9);opacity:0}}
.cw-cell.done{background:linear-gradient(#EAF2D2,#C9DCA2);box-shadow:0 2px 0 var(--leaf-lo)}
.cw-cell.done .ch{color:#2F4318}
.cw-cell.wave{animation:wave .55s var(--spring)}
.cw-cell.sel{outline:2px solid #C06A1F;outline-offset:1px}
@keyframes wave{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px) scale(1.12)}}
.strip{display:flex;align-items:center;gap:6px;margin-top:6px;border-top:1px dashed rgba(58,33,19,.25);padding-top:6px}
.strip .nav{width:30px;height:30px;flex:none;border:0;border-radius:9px;background:rgba(70,40,20,.13);color:var(--burn);font-weight:800;font-size:18px;line-height:1;cursor:pointer}
.strip .cur{flex:1;min-width:0;border:0;background:none;text-align:left;font-weight:800;font-size:13.5px;line-height:1.25;color:var(--burn);padding:2px;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.strip .cur em{font-style:normal;color:#9A4E14;margin-right:4px}
.strip .cur .tap{opacity:.5;font-weight:700}
.tools{flex:none;display:flex;gap:8px}
.tool{flex:1;height:42px;border:0;border-radius:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;position:relative;
  background:linear-gradient(#5E3D25,#432916);box-shadow:inset 0 1px 0 rgba(255,228,186,.22),0 3px 0 var(--walnut-lo);color:var(--ink);font-weight:800;font-size:12.5px;transition:transform .15s var(--spring),opacity .2s}
.tool:active{transform:translateY(2px) scale(.96)}
.tool svg{width:20px;height:20px;flex:none}
.tool .n{min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--amber);color:var(--burn);font:800 12px/20px var(--tile);text-align:center}
.tool[data-empty="1"]{opacity:.5}
.tool[data-empty="1"] .n{background:rgba(255,228,186,.2);color:var(--ink)}
.tool.on{background:linear-gradient(#F3B55A,#D98C2B);color:var(--burn);box-shadow:inset 0 1px 0 rgba(255,250,220,.5),0 3px 0 #8A5617,0 0 18px rgba(240,168,69,.55)}
.tool.pulse{animation:tpulse .9s ease 3}
@keyframes tpulse{50%{transform:scale(1.07);box-shadow:0 0 0 3px rgba(240,168,69,.6),0 3px 0 var(--walnut-lo)}}
.ring{position:relative;width:24px;height:24px;flex:none}
.ring svg{position:absolute;inset:0;width:24px;height:24px;transform:rotate(-90deg)}
.ring svg circle{transition:stroke-dashoffset .5s var(--smooth)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 11px var(--tile)}
.playarea{flex:1;min-height:0;position:relative;display:flex;justify-content:center;align-items:flex-start}
#cv{display:block;touch-action:none}
.toast{position:absolute;left:50%;top:9%;transform:translate(-50%,8px) scale(.96);width:min(90%,360px);text-align:center;pointer-events:none;
  background:rgba(28,18,11,.93);border:1px solid rgba(240,168,69,.35);border-radius:16px;padding:11px 14px;box-shadow:0 12px 30px rgba(0,0,0,.5);
  font-weight:700;font-size:13.5px;line-height:1.4;transition:opacity .3s,transform .45s var(--spring);opacity:0;z-index:3}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast b{display:block;font:700 15px/1.3 var(--display);color:var(--amber);margin-bottom:3px;letter-spacing:.04em}
.toast .rew{display:block;margin-top:6px;color:var(--leaf);font-weight:800;font-size:12.5px}

#fly{position:fixed;inset:0;pointer-events:none;z-index:40}
.fl{position:fixed;display:grid;place-items:center;border-radius:22%;color:var(--burn);font-family:var(--tile);font-weight:800;
  background:linear-gradient(#FFF3DA,#EBCB93);box-shadow:0 3px 0 #A97A45,0 0 18px rgba(255,200,110,.75),0 8px 18px rgba(0,0,0,.4);will-change:transform}

/* нижний лист */
.sw{position:absolute;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(14,9,5,.62);animation:fade .25s ease}
.sw.closing .scrim{animation:fadeout .22s ease forwards}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,480px);max-height:92%;overflow:auto;
  border-radius:26px 26px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));color:var(--burn);
  background:repeating-linear-gradient(94deg,rgba(120,72,30,.06) 0 2px,transparent 2px 9px),linear-gradient(170deg,#F3DCB0,#DDB781);
  box-shadow:inset 0 1px 0 rgba(255,250,235,.7),0 -10px 40px rgba(0,0,0,.5);animation:up .45s var(--smooth)}
.sw.closing .sheet{animation:down .24s ease-in forwards}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:rgba(58,33,19,.25);margin:0 auto 12px}
.sheet.shake{animation:shake .4s}
@keyframes up{from{transform:translate(-50%,100%)}}
@keyframes down{to{transform:translate(-50%,100%)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes shake{0%,100%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% - 9px))}40%{transform:translateX(calc(-50% + 8px))}60%{transform:translateX(calc(-50% - 5px))}80%{transform:translateX(calc(-50% + 3px))}}
.sheet h3{margin:0 0 12px;font:700 19px/1.25 var(--display);text-wrap:balance}
.sheet p{margin:0 0 12px;font-size:14.5px;line-height:1.45;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;border:0;cursor:pointer;border-radius:14px;padding:14px;font:700 13.5px var(--display);
  background:linear-gradient(#6E462A,#4A2E1B);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,228,186,.28),0 4px 0 var(--walnut-lo);transition:transform .15s var(--spring)}
.btn:active{transform:translateY(3px)}
.btn.go{background:linear-gradient(#9AD25E,#6CA63A);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 var(--go-lo);text-shadow:0 1px 0 rgba(40,80,10,.4)}
.btn.alt{background:rgba(70,40,20,.13);color:var(--burn);box-shadow:inset 0 0 0 2px rgba(70,40,20,.22)}
.slots{display:flex;gap:5px;justify-content:center;margin:4px 0 6px}
.slot{flex:0 1 42px;aspect-ratio:.88;max-width:42px;border-radius:10px;display:grid;place-items:center;font:800 21px var(--tile);background:rgba(70,40,20,.14);box-shadow:inset 0 2px 3px rgba(60,30,10,.25)}
.slot.k{background:linear-gradient(#FFF3DA,#F0D6A6);box-shadow:0 2px 0 #B48650}
.slot.t{background:#FFF7E6;color:#9A4E14;box-shadow:0 2px 0 #C9A06A;animation:pop .25s var(--spring)}
.slot.next{box-shadow:inset 0 0 0 2px #C06A1F}
@keyframes pop{from{transform:scale(.5)}}
.gmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 2px;font-size:12.5px;font-weight:800;opacity:.8}
.lnk{border:0;background:rgba(70,40,20,.13);border-radius:10px;padding:7px 10px;font-weight:800;font-size:12.5px;color:var(--burn);cursor:pointer}
.lnk[disabled]{opacity:.4}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.kr{display:flex;gap:4px;justify-content:center}
.key{flex:1;max-width:40px;height:48px;border:0;padding:0;border-radius:9px;font:800 18px var(--tile);color:var(--burn);cursor:pointer;background:linear-gradient(#FFF4DE,#EBCB93);box-shadow:0 3px 0 #A97A45;transition:transform .08s}
.key:active{transform:translateY(2px) scale(.94);box-shadow:0 1px 0 #A97A45}
.key.wide{max-width:none;flex:1.7;background:linear-gradient(#6E462A,#4A2E1B);color:var(--ink);box-shadow:0 3px 0 var(--walnut-lo);font-size:14px}
.key.wide svg{width:20px;height:20px}
.clue{width:100%;display:grid;grid-template-columns:26px 16px 1fr auto;gap:6px;align-items:baseline;text-align:left;border:0;background:none;cursor:pointer;padding:9px 6px;border-radius:9px;color:var(--burn);font-size:14.5px;line-height:1.3;font-weight:700}
.clue:active{background:rgba(70,40,20,.1)}
.clue .n{font:700 13px var(--display);color:#9A4E14}
.clue .len{font-size:12px;opacity:.6;font-weight:800}
.clue.done .t{color:#4F6B2C}
.big-cw{margin:2px 0 12px}
.score-line{display:flex;gap:18px;margin:0 0 14px}
.score-line small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.score-line b{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.winart{display:grid;grid-template-columns:44% 1fr;gap:14px;align-items:center;margin-bottom:14px}
.winart p{margin:0 0 8px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:5px 9px;border-radius:9px;font:800 12.5px var(--tile);letter-spacing:.06em;background:linear-gradient(#EAF2D2,#C9DCA2);color:#2F4318;box-shadow:0 2px 0 var(--leaf-lo)}
.chips span.q{background:rgba(70,40,20,.12);color:rgba(58,33,19,.4);box-shadow:none;letter-spacing:.2em}
.steps{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.step i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:700 16px var(--display);font-style:normal;background:linear-gradient(#FFF3DA,#EBCB93);box-shadow:0 2px 0 #A97A45}
.step b{display:block;font:700 14px/1.3 var(--display);margin-bottom:2px}

/* просмотр картины */
.artv{position:absolute;inset:0;z-index:35;display:grid;place-items:center;padding:16px;background:radial-gradient(80% 60% at 50% 40%,rgba(60,36,18,.96),rgba(12,8,4,.98));animation:fade .35s ease;overflow:auto}
.artv-in{width:min(100%,420px);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}

.artv.reveal .rv{animation:rise .6s var(--smooth) both;animation-delay:calc(1.6s + var(--d,0s))}
@keyframes framein{from{transform:scale(.7) rotate(-4deg);opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

<script>
(()=>{
'use strict';
/* ---------- темы и слова ---------- */
const B=s=>s.trim().split('\n').map(l=>l.trim().split('|')).filter(a=>a.length===3);
const THEMES=[
{name:'Лес',art:'Лесной закат',hue:'#5E9E4A',bank:B(`
ЛИСА|Рыжая хитрая жительница леса|Лиса слышит мышь под снегом и ныряет за ней головой вниз. Это называют мышкованием.
ЛЕС|Много деревьев вместе|Леса покрывают примерно треть суши на Земле.
СОВА|Ночная птица, ухает в чаще|Сова не может вращать глазами, поэтому поворачивает всю голову.
БЕЛКА|Рыжая, прыгает по веткам с орехом|Белка забывает часть закопанных орехов, и из них вырастают новые деревья.
ЗАЯЦ|Длинноухий, к зиме белеет|Заяц-беляк к зиме меняет бурую шубку на белую.
ВОЛК|Серый хищник, воет на луну|Волки живут семьями — стаями — и охотятся вместе.
ЛОСЬ|Лесной великан с рогами-лопатами|Лось каждый год сбрасывает рога и отращивает новые.
ДУБ|Крепкое дерево с желудями|Отдельные дубы живут больше тысячи лет.
ЕЛЬ|Колючее дерево, которое наряжают зимой|Ель хорошо растёт в тени, поэтому в ельнике так сумрачно.
МОХ|Мягкий зелёный ковёр под ногами|У мха нет настоящих корней: воду он впитывает всей поверхностью.
ГРИБ|Его ищут в лесу с корзинкой|Шляпка гриба — лишь малая часть, главное — грибница под землёй.
ШИШКА|Её роняет сосна или ель|В шишке прячутся семена. Белки и клесты умеют их доставать.
ДЯТЕЛ|Лесной барабанщик|Дятел может стучать по дереву до двадцати раз в секунду.
СОСНА|Высокое дерево с длинными иглами|Сосна любит свет, поэтому в сосновом бору светло и просторно.
РОСА|Капли на траве ранним утром|Роса выпадает ясными ночами, когда трава остывает сильнее воздуха.
ТРОПА|Узкая дорожка в чаще|Многие лесные тропы сначала протоптали звери.
ПЕНЬ|Остаток спиленного дерева|По кольцам на пне можно сосчитать возраст дерева.
ЧАЩА|Самая густая часть леса|Слово «чаща» родственно слову «часто»: деревья стоят часто.
МЕДВЕДЬ|Хозяин леса, зимой спит|Медведь всю зиму спит в берлоге и почти не тратит сил.

function layoutOnce(words){
  const grid=new Map(),dirs=new Map(),placed=[];
  const K=(r,c)=>r+','+c, get=(r,c)=>grid.get(K(r,c));
  function score(w,r,c,dir){const dr=dir?1:0,dc=dir?0:1,n=w.length;
    if(get(r-dr,c-dc)||get(r+dr*n,c+dc*n))return -1;let inter=0;
    for(let i=0;i<n;i++){const rr=r+dr*i,cc=c+dc*i,g=get(rr,cc);
      if(g){if(g!==w[i])return -1;if((dirs.get(K(rr,cc))||[]).includes(dir))return -1;inter++}
      else if(get(rr+dc,cc+dr)||get(rr-dc,cc-dr))return -1}
    return inter}
  function put(o,r,c,dir){const dr=dir?1:0,dc=dir?0:1;for(let i=0;i<o.word.length;i++){const k=K(r+dr*i,c+dc*i);grid.set(k,o.word[i]);dirs.set(k,[...(dirs.get(k)||[]),dir])}placed.push({...o,r,c,dir})}
  function bbox(ex){let r0=1e9,r1=-1e9,c0=1e9,c1=-1e9;const add=(r,c)=>{r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c)};
    for(const k of grid.keys()){const[r,c]=k.split(',').map(Number);add(r,c)}
    if(ex){add(ex.r,ex.c);add(ex.r+(ex.dir?ex.n-1:0),ex.c+(ex.dir?0:ex.n-1))}return{r0,r1,c0,c1}}
  put(words[0],0,0,0);let rest=words.slice(1),prog=true;
  while(rest.length&&prog){prog=false;
    for(const o of [...rest]){let best=null;
      for(const p of placed)for(let j=0;j<p.word.length;j++){const pr=p.r+(p.dir?j:0),pc=p.c+(p.dir?0:j);
        for(let i=0;i<o.word.length;i++){if(o.word[i]!==p.word[j])continue;const dir=p.dir?0:1;const r=dir?pr-i:pr,c=dir?pc:pc-i;
          const s=score(o.word,r,c,dir);if(s<1)continue;const b=bbox({r,c,dir,n:o.word.length});const rows=b.r1-b.r0+1,cols=b.c1-b.c0+1;
          const val=s*60-rows*rows*4-cols*2;if(!best||val>best.val)best={r,c,dir,val}}}
      if(best){put(o,best.r,best.c,best.dir);rest=rest.filter(x=>x!==o);prog=true}}}
  const b=bbox();
  return{rows:b.r1-b.r0+1,cols:b.c1-b.c0+1,words:placed.map(p=>({...p,r:p.r-b.r0,c:p.c-b.c0})),unplaced:rest};
}
function buildCrossword(list,seed,maxCols){

    if(t===0)ws.sort((a,b)=>b.word.length-a.word.length);else for(let i=ws.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[ws[i],ws[j]]=[ws[j],ws[i]]}
    const r=layoutOnce(ws);const pen=r.unplaced.length*1000+(r.cols>maxCols?500:0)+r.rows*12+r.cols;
    if(!best||pen<best.pen)best={...r,pen}}
  return best}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function fitsLayout(ws){const r=layoutOnce(ws.map(([word,clue,fact])=>({word,clue,fact})).sort((a,b)=>b.word.length-a.word.length));return !r.unplaced.length&&r.rows<=7&&r.cols<=11}
function pickSet(pool,n,rng,tries){
  for(let a=0;a<(tries||60);a++){const sh=shuffleR(pool.slice(),rng);const set=[sh[0]];
    for(let k=1;k<sh.length&&set.length<n;k++){const test=set.concat([sh[k]]);if(fitsLayout(test))set.push(sh[k])}
    if(set.length===n)return set}

      for(let k=1;k<order.length&&set.length<n;k++){const test=set.concat([order[k]]);if(fitsLayout(test))set.push(order[k])}

/* --- фрагменты-пазлы --- */
const PROWS={5:[2,1,2],6:[2,2,2],7:[2,3,2],8:[3,2,3]};const PC={};
function edge(p,ax,ay,bx,by,s){if(!s){p.lineTo(bx,by);return}const len=Math.hypot(bx-ax,by-ay),K=Math.min(len*.24,40)*s,h=ay===by,nx=h?0:1,ny=h?1:0;
  const P=(t,o)=>[ax+(bx-ax)*t+nx*o*K,ay+(by-ay)*t+ny*o*K];p.lineTo(...P(.36,0));p.bezierCurveTo(...P(.42,.18),...P(.3,1),...P(.5,1));p.bezierCurveTo(...P(.7,1),...P(.58,.18),...P(.64,0));p.lineTo(bx,by)}
function pieces(n){if(PC[n])return PC[n];const rows=PROWS[n]||[n],R=rows.length,rh=AH/R,rng=mulberry(n*131+17),sg=()=>rng()<.5?-1:1;
  const vs={};rows.forEach((k,r)=>{for(let c=0;c<k-1;c++)vs[r+'_'+c]=sg()});
  const hs=[];for(let r=1;r<R;r++){const xs=new Set([0,AW]);[rows[r-1],rows[r]].forEach(k=>{for(let c=1;c<k;c++)xs.add(Math.round(AW*c/k))});const a=[...xs].sort((x,y)=>x-y);hs[r]=a.slice(0,-1).map((x,i)=>({a:x,b:a[i+1],s:sg()}))}
  const list=[],off=[];let o=0;
  rows.forEach((k,r)=>{off[r]=o;for(let c=0;c<k;c++){const x0=Math.round(AW*c/k),x1=Math.round(AW*(c+1)/k),y0=r*rh,y1=(r+1)*rh,p=new Path2D();p.moveTo(x0,y0);
    if(r>0)hs[r].filter(q=>q.a>=x0&&q.b<=x1).forEach(q=>{p.lineTo(q.a,y0);edge(p,q.a,y0,q.b,y0,q.s)});p.lineTo(x1,y0);
    if(c<k-1)edge(p,x1,y0,x1,y1,vs[r+'_'+c]);else p.lineTo(x1,y1);
    if(r<R-1)hs[r+1].filter(q=>q.a>=x0&&q.b<=x1).reverse().forEach(q=>{p.lineTo(q.b,y1);edge(p,q.b,y1,q.a,y1,q.s)});p.lineTo(x0,y1);
    if(c>0)edge(p,x0,y1,x0,y0,vs[r+'_'+(c-1)]);else p.lineTo(x0,y0);p.closePath();list.push({path:p,cx:(x0+x1)/2,cy:(y0+y1)/2})}o+=k});
  const index=(x,y)=>{const r=Math.min(R-1,Math.max(0,Math.floor(y/rh))),k=rows[r];return off[r]+Math.min(k-1,Math.max(0,Math.floor(x/(AW/k))))};
  return PC[n]={list,index}}
const PO={};function pieceOrder(t){if(PO[t])return PO[t];const n=SCHED[t].length;return PO[t]=shuffleR([...Array(n).keys()],mulberry(300+t*11))}

const ART={};
function artCanvas(t){if(ART[t])return ART[t];const c=document.createElement('canvas');c.width=AW*AS;c.height=AH*AS;const g=c.getContext('2d');g.scale(AS,AS);paintScene(g,t);return ART[t]=c}
function paintScene(g,t){
  const S=SCENES[t],LW=levelWords(t),P=pieces(LW.length),order=pieceOrder(t),lvlOf=[];order.forEach((pc,i)=>lvlOf[pc]=i);const ctr={};const rng=mulberry(500+t);
  const wordAt=(x,y)=>{const pi=P.index(x,y),ws=LW[lvlOf[pi]];ctr[pi]=(ctr[pi]||0)+1;return ws[(ctr[pi]+pi)%ws.length][0]};
  S.bg(g);
  for(const L of S.layers){if(L.pre)L.pre(g);const path=L.path(),box=L.box||[0,0,AW,AH];g.save();g.clip(path);
    if(L.fill){const st=L.fill.map((c,i)=>[i/(L.fill.length-1),c]);g.fillStyle=lin(g,0,box[1],0,box[3],st);g.fillRect(box[0]-2,box[1]-2,box[2]-box[0]+4,box[3]-box[1]+4)}
    if(L.paint)L.paint(g);if(L.size)fillWords(g,L,box,rng,wordAt);if(L.shade)L.shade(g);g.restore();
    if(L.glow)glow(g,...L.glow);if(L.after)L.after(g)}
  if(S.fx)S.fx(g);
  g.fillStyle=rad(g,AW/2,AH/2,AH*.3,AW/2,AH/2,AH*.75,[[0,'rgba(0,0,0,0)'],[1,'rgba(20,6,0,.45)']]);g.fillRect(0,0,AW,AH)}
function fillWords(g,L,box,rng,wordAt){
  const[x0,y0,x1,y1]=box,[a,b]=L.size,rot=L.rot||0,cx=(x0+x1)/2,cy=(y0+y1)/2,cr=Math.cos(rot),sr=Math.sin(rot);
  g.save();g.globalAlpha=L.alpha??.9;g.textBaseline='middle';let X0=x0,X1=x1,Y0=y0,Y1=y1;
  if(rot){g.translate(cx,cy);g.rotate(rot);const R=Math.hypot(x1-x0,y1-y0)/2;X0=Y0=-R;X1=Y1=R}
  let y=Y0+rng()*a*.4;
  while(y<Y1+b*.6){const s=a+rng()*(b-a);g.font=`800 ${s.toFixed(1)}px Rubik, Nunito, sans-serif`;let x=X0-rng()*s*4;
    while(x<X1){let rx=x,ry=y;if(rot){rx=cx+x*cr-y*sr;ry=cy+x*sr+y*cr}
      const w=wordAt(Math.min(AW-1,Math.max(0,rx)),Math.min(AH-1,Math.max(0,ry)));
      g.fillStyle=L.colorAt?L.colorAt(rx,ry):L.colors[Math.floor(rng()*L.colors.length)];g.fillText(w,x,y);x+=g.measureText(w).width+s*.42}
    y+=s*1.02}
  g.restore()}
/* картина с собранными фрагментами */
function drawArt(g,t,w,h,owned,o={}){
  const n=SCHED[t].length,P=pieces(n),art=artCanvas(t),full=owned.size>=n;
  g.save();g.clearRect(0,0,w,h);g.scale(w/AW,h/AH);
  if(full)g.drawImage(art,0,0,AW,AH);
  else{g.fillStyle=lin(g,0,0,0,AH,[[0,'#3B2717'],[1,'#22150C']]);g.fillRect(0,0,AW,AH);
    P.list.forEach((pc,i)=>{g.save();g.clip(pc.path);
      if(owned.has(i))g.drawImage(art,0,0,AW,AH);
      else{g.globalAlpha=.12;g.drawImage(art,0,0,AW,AH);g.globalAlpha=1;g.fillStyle='rgba(255,226,180,.32)';g.font='700 70px Unbounded, Rubik, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('?',pc.cx,pc.cy)}
      g.restore()})}
  const oa=o.outline??(full?0:1);
  if(oa>0){g.lineJoin='round';g.lineWidth=5;g.strokeStyle=`rgba(30,14,6,${.55*oa})`;P.list.forEach(pc=>g.stroke(pc.path));g.lineWidth=2;g.strokeStyle=`rgba(255,232,196,${.5*oa})`;P.list.forEach(pc=>g.stroke(pc.path))}
  g.restore()}

function initCW(words,seed,given){

    for(let i=0;i<w.word.length;i++){const r=w.r+(w.dir?i:0),c=w.c+(w.dir?0:i),k=r+','+c;if(!cw.cells.has(k))cw.cells.set(k,{key:k,r,c,letter:w.word[i],revealed:false,reserved:false,words:[],el:null});cw.cells.get(k).words.push(o);o.keys.push(k)}
    cw.words.push(o)});
  const starts=[...new Set(cw.words.map(w=>w.keys[0]))].map(k=>cw.cells.get(k)).sort((a,b)=>a.r-b.r||a.c-b.c);
  starts.forEach((c,i)=>{c.num=i+1});cw.words.forEach(w=>w.num=cw.cells.get(w.keys[0]).num);cw.words.sort((a,b)=>a.num-b.num||a.dir-b.dir);

function neededLetters(){
  const cnt={};for(const c of cw.cells.values())if(!c.revealed&&!c.reserved)cnt[c.letter]=(cnt[c.letter]||0)+1;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=board[r][c];if(t&&t.letter)cnt[t.letter]=(cnt[t.letter]||0)-1}
  for(const p of tray)if(p)for(const k in p.letters)cnt[p.letters[k]]=(cnt[p.letters[k]]||0)-1;
  const out=[];for(const l in cnt)for(let i=0;i<cnt[l];i++)out.push(l);return out}

  const c=cw.cells.get(k);if(!c||c.revealed)return;c.revealed=true;c.reserved=false;
  if(c.el){c.el.classList.add('on','land');setTimeout(()=>c.el&&c.el.classList.remove('land'),600)}
  chime(note(revealCount++%15,523),.2);addScore(opts.bonus??25);
  c.words.forEach(w=>{if(!w.done&&w.keys.every(x=>cw.cells.get(x).revealed))completeWord(w)});

  if(cw.words.every(x=>x.done)){if(cfg.mode==='endless'||cfg.mode==='zen')setTimeout(nextRound,1700);else if(over!=='done'){over='done';drag=null;hammerMode=false;setTimeout(win,1500)}}}
const prog=c=>Math.max(...c.words.map(w=>w.done?-1:w.keys.filter(k=>cw.cells.get(k).revealed).length/w.keys.length));

function flyLetter(letter,fx,fy,key,delay){

  const d=document.createElement('div');d.className='fl';d.textContent=letter;d.style.cssText=`left:${fx-sz/2}px;top:${fy-sz/2}px;width:${sz}px;height:${sz}px;font-size:${sz*.55}px`;

    if(now<f.t0){drawTile(x,y,cell,f.t,{flash:clamp(1-(f.t0-now)/140,0,1)*.85,scale:1+.06*clamp(1-(f.t0-now)/140,0,1)});continue}
    const e=(now-f.t0)/420;if(e>=1){fading.splice(i,1);continue}
    drawTile(x,y-ease(e)*cell*.55,cell,f.t,{scale:1+.2*Math.sin(e*Math.PI)-.5*e*e,alpha:1-e*e,rot:f.dir*e*.7,flash:Math.max(0,.8-e*3)})}
  ctx.save();rr(ctx,0,trayTop,W,trayH,cell*.38);ctx.fillStyle='rgba(0,0,0,.22)';ctx.fill();ctx.restore();
  tray.forEach((p,i)=>{if(!p||(drag&&drag.p===p))return;let[cx,cy]=slotCenter(i);const ps=pScale(p);let s=ps,a=1;
    const e=(now-p.spawn)/1000;if(e<0)return;if(e<.5){const k=backOut(clamp(e/.45,0,1));cy+=cell*1.4*(1-k);a=clamp(e/.18,0,1);s=ps*(.7+.3*k)}
    if(p.ret){const q=(now-p.ret.t0)/280;if(q<1){const b=backOut(q);cx=p.ret.x+(cx-p.ret.x)*b;cy=p.ret.y+(cy-p.ret.y)*b;s=p.ret.s+(ps-p.ret.s)*b}else p.ret=null}
    if(!over&&!anyFit(p))a*=.38;drawPiece(p,cx,cy,s,a)});
  if(drag){ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=cell*.6;ctx.shadowOffsetY=cell*.3;drawPiece(drag.p,drag.x,drag.y,drag.s,1);ctx.restore()}
  for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.k==='chip'){q.vy+=.3*dt;q.vx*=.985;q.rot+=q.vr*dt;q.life-=.022*dt}else{q.vy*=.97;q.life-=.03*dt}
    if(q.life<=0){particles.splice(i,1);continue}ctx.save();ctx.globalAlpha=Math.min(1,q.life*1.4);
    if(q.k==='chip'){ctx.translate(q.x,q.y);ctx.rotate(q.rot);ctx.fillStyle=q.color;ctx.fillRect(-q.w/2,-q.h/2,q.w,q.h)}
    else{ctx.globalCompositeOperation='lighter';const s=q.s*q.life;ctx.fillStyle='rgba(255,226,150,.95)';ctx.beginPath();ctx.moveTo(q.x,q.y-s);ctx.quadraticCurveTo(q.x,q.y,q.x+s,q.y);ctx.quadraticCurveTo(q.x,q.y,q.x,q.y+s);ctx.quadraticCurveTo(q.x,q.y,q.x-s,q.y);ctx.quadraticCurveTo(q.x,q.y,q.x,q.y-s);ctx.fill()}
    ctx.restore()}
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i],k=(now-f.t0)/1200;if(k<0)continue;if(k>=1){floaters.splice(i,1);continue}
    const sz=f.size*(k<.22?backOut(k/.22):1);ctx.save();ctx.globalAlpha=1-Math.pow(k,3);ctx.font=`700 ${Math.round(sz)}px Unbounded, Rubik, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    const fx=clamp(f.x,ctx.measureText(f.text).width/2+6,W-ctx.measureText(f.text).width/2-6),fy=f.y-ease(k)*cell*1.1;ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeStyle='rgba(40,22,10,.85)';ctx.strokeText(f.text,fx,fy);ctx.fillStyle=f.color;ctx.fillText(f.text,fx,fy);ctx.restore()}}
function drawPiece(p,cx,cy,s,a){const ts=cell*s,ox=cx-p.w*ts/2,oy=cy-p.h*ts/2;p.cells.forEach(([dr,dc],i)=>drawTile(ox+dc*ts,oy+dr*ts,ts,{color:p.color,v:(p.v+i)%4,letter:p.letters[i]||null,hp:1},{alpha:a}))}
