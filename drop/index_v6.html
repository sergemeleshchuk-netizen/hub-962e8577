<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drop + Picture — v6</title>
<style>
  :root{
    --ink:#1b1b2e; --accent:#6b6be0; --accent2:#9b5cf6;
    --bg1:#eef0ff; --bg2:#dfe3ff; --good:#34c759; --bad:#ff4d5e; --warn:#ff8a3d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%, var(--bg1), var(--bg2));
    color:var(--ink); display:flex; justify-content:center; align-items:flex-start;
    min-height:100%; padding:14px;
  }
  #app{width:100%; max-width:480px; display:flex; flex-direction:column; gap:10px;}

  /* ---- верхние контролы: идентичны Arrows+Words v4–v6 ---- */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .level-label{font-weight:700; font-size:18px; color:#3a3a55;}
  .hearts{display:flex; gap:4px; font-size:22px; min-width:90px; justify-content:flex-end;}
  .heart{filter:drop-shadow(0 1px 1px rgba(0,0,0,.15)); transition:transform .2s, opacity .2s;}
  .heart.lost{opacity:.22; transform:scale(.8);}
  .timer{height:12px; border-radius:8px; background:#ffffff80; overflow:hidden; box-shadow:inset 0 1px 3px #0001;}
  #timerbar{height:100%; width:100%; border-radius:8px;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .1s linear;}
  #timerbar.low{background:linear-gradient(90deg,#ff8a3d,var(--bad));}

  #wordZone{display:flex; flex-direction:column; align-items:center; gap:8px;}
  #wordProg{display:flex; gap:6px; flex-wrap:wrap; justify-content:center;}
  .wtag{font-size:13px; font-weight:800; min-width:24px; text-align:center; padding:2px 8px; border-radius:999px;
    background:#ffffff; color:#c2c6e6; box-shadow:0 1px 4px #0000000d;}
  .wtag.now{background:var(--c,#6b6be0); color:#fff;}
  .wtag.done{background:#eafff0; color:var(--good);}
  #picCanvas{image-rendering:pixelated; image-rendering:crisp-edges; border-radius:14px;
    background:#fbfcff; box-shadow:inset 0 1px 0 #fff, 0 4px 14px #6b6be022; width:152px; height:152px;}

  #trayWrap{display:flex; flex-direction:column; align-items:center; gap:3px;}
  #tray{display:flex; gap:10px;}
  .tile{width:42px; height:42px; border-radius:10px; background:#fff;
    border:2px solid #e6e8f7; border-bottom-width:4px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; transition:all .12s;}
  .tile.has{box-shadow:0 3px 8px #0000000f;}
  .tile:not(.has){background:#eef0fa; border-style:dashed; border-bottom-style:solid;}
  .tile img{width:100%; height:100%; image-rendering:pixelated; object-fit:cover;}
  .tile.warn{box-shadow:0 0 0 3px #ff8a3d33;}
  .tile.over{box-shadow:0 0 0 3px #ff4d5e55; animation:buzz .3s;}
  @keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .tray-cap{font-size:11px; color:#9a9ab5;}

  /* ---- игровое поле ---- */
  #board-wrap{background:#5b6080; border-radius:22px; padding:14px;
    box-shadow:0 10px 30px #5b5bd133, 0 2px 6px #0000000d;}
  #board{display:block; width:100%; max-width:320px; height:auto; margin:0 auto;
    overflow:visible; touch-action:none;}
  .mk{fill:none; stroke:#ffffff; stroke-opacity:.16; stroke-width:1.1;}
  .block{cursor:grab; transition:transform .12s ease, opacity .26s ease;
    transform-box:fill-box; transform-origin:center;}
  .block.gone{opacity:0;}
  .ball-g{transition:transform .2s ease, opacity .2s ease;
    transform-box:fill-box; transform-origin:center;}
  .ball-g.pop{transform:scale(0); opacity:0;}

  footer{display:flex; gap:10px; justify-content:center;}
  button{font:inherit; font-weight:700; border:none; border-radius:14px; padding:11px 16px;
    cursor:pointer; transition:transform .08s, box-shadow .15s, background .15s;}
  button:active{transform:translateY(1px) scale(.99);}
  .btn-ghost{background:#ffffff; color:#4a4a6a; box-shadow:0 2px 8px #0000000f;}
  .btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#fff;
    box-shadow:0 6px 18px #6b6be055;}
  .overlay{position:fixed; inset:0; background:#1b1b2e88; backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:50; transition:opacity .2s;}
  .overlay.hidden{opacity:0; pointer-events:none;}
  .card{background:#fff; border-radius:24px; padding:28px 26px; width:86%; max-width:360px;
    text-align:center; box-shadow:0 20px 60px #00000033; animation:pop .25s ease;}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .card h2{margin:0 0 6px; font-size:26px;}
  .card p{margin:0 0 18px; color:#6a6a85; font-size:15px; line-height:1.45;}
  .card .emoji{font-size:50px; margin-bottom:6px;}
  .card img.win{image-rendering:pixelated; width:160px; height:160px; border-radius:14px;
    margin:0 auto 14px; display:block; box-shadow:0 6px 18px #0003;}
  #confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:60;}
  .hint{text-align:center; color:#8a8aa5; font-size:13px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button id="btnHome" class="btn-ghost">⟲ Reset</button>
    <div class="level-label">Level <span id="lvlNum">1</span>/<span id="lvlTot">1</span></div>
    <div class="hearts" id="hearts"></div>
  </div>
  <div class="timer"><div id="timerbar"></div></div>

  <div id="wordZone">
    <div id="wordProg"></div>
    <canvas id="picCanvas"></canvas>
    <div id="trayWrap">
      <div id="tray"></div>
      <div class="tray-cap">tray buffer · overflow = game over</div>
    </div>
  </div>

  <div id="board-wrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div class="hint">Drag a shape to sweep its same-color balls — each ball is a piece of the picture. Assemble it!</div>
  <footer><button id="btnReset" class="btn-ghost">↻ Restart level</button></footer>
</div>

<div id="overlay" class="overlay hidden">
  <div class="card">
    <div class="emoji" id="ovEmoji"></div>
    <h2 id="ovTitle"></h2>
    <p id="ovText"></p>
    <button id="ovBtn" class="btn-primary"></button>
  </div>
</div>
<canvas id="confetti"></canvas>

<script src="pieces_v6.js"></script>
<script>
/* ---- drop-words v5: вместо букв — КУСОЧКИ КАРТИНКИ; цель — собрать изображение ----
   Картинка: пиксельный мухомор + радуга (модуль pieces_v5.js, 32×32, 4×4 куска по 8×8).
   Каждый цвет фигуры = один ряд картинки; собираешь ряды по порядку (порядок = solver),
   подходящий кусок встаёт на место, прочие — в трей; overflow = проигрыш.
   Поле прямоугольное (без карманов). Данные проверены solver_v2. */
const LEVELS = [
{"cols":6,"rows":8,"time":160,"lives":3,"traySize":5,
 "order":["lime","red","purple","sky"],
 "blocks":[
   {"color":"red","cells":[[3,1],[3,2],[3,3],[4,2]],"count":4},
   {"color":"sky","cells":[[0,3],[1,2],[1,3],[2,2]],"count":4},
   {"color":"lime","cells":[[0,6],[1,6],[2,5],[2,6]],"count":4},
   {"color":"purple","cells":[[1,0],[1,1],[2,0],[2,1]],"count":4}],
 "balls":[
   {"color":"red","cell":[3,7]},{"color":"red","cell":[4,3]},{"color":"red","cell":[4,1]},{"color":"red","cell":[4,6]},
   {"color":"sky","cell":[4,7]},{"color":"sky","cell":[2,7]},{"color":"sky","cell":[0,2]},{"color":"sky","cell":[5,2]},
   {"color":"lime","cell":[2,3]},{"color":"lime","cell":[1,4]},{"color":"lime","cell":[2,4]},{"color":"lime","cell":[3,5]},
   {"color":"purple","cell":[5,0]},{"color":"purple","cell":[5,5]},{"color":"purple","cell":[0,1]},{"color":"purple","cell":[5,6]}]}
];

const COLORS={
  sky:   {a:'#7db4ff', b:'#2f7bf0'},
  lime:  {a:'#9fe06f', b:'#54b81f'},
  red:   {a:'#ff8a96', b:'#f0394b'},
  purple:{a:'#c39bff', b:'#8a45f0'}};

const NS='http://www.w3.org/2000/svg';
const XLINK='http://www.w3.org/1999/xlink';
const CELL=46;
const board=document.getElementById('board');
const heartsEl=document.getElementById('hearts');
const timerbar=document.getElementById('timerbar');
const overlay=document.getElementById('overlay');

let state=null;
let timer={raf:null, end:0, paused:true};
let drag=null;
let defsEl=null;

function sign(x){ return x>0?1:x<0?-1:0; }
function key(c,r){ return c+','+r; }
function px(v){ return v*CELL; }

/* ---------- полнотелый контур союза клеток ---------- */
function outlinePath(cells, rr){
  const set=new Set(cells.map(c=>c[0]+','+c[1]));
  const has=(c,r)=>set.has(c+','+r);
  const edges=[];
  for(const [c,r] of cells){
    if(!has(c,r-1)) edges.push([[c,r],[c+1,r]]);
    if(!has(c+1,r)) edges.push([[c+1,r],[c+1,r+1]]);
    if(!has(c,r+1)) edges.push([[c+1,r+1],[c,r+1]]);
    if(!has(c-1,r)) edges.push([[c,r+1],[c,r]]);
  }
  const startMap=new Map();
  edges.forEach(e=>startMap.set(e[0][0]+','+e[0][1], e));
  let cur=edges[0]; const pts=[cur[0]];
  for(let i=0;i<edges.length;i++){
    pts.push(cur[1]);
    cur=startMap.get(cur[1][0]+','+cur[1][1]);
    if(!cur || (cur[0][0]===pts[0][0]&&cur[0][1]===pts[0][1])) break;
  }
  if(pts.length>1 && pts[0][0]===pts[pts.length-1][0] && pts[0][1]===pts[pts.length-1][1]) pts.pop();
  const simp=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[(i-1+pts.length)%pts.length], b=pts[i], c=pts[(i+1)%pts.length];
    const cross=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);
    if(cross!==0) simp.push(b);
  }
  const P=simp.map(p=>[px(p[0]),px(p[1])]);
  let d=''; const n=P.length;
  for(let i=0;i<n;i++){
    const prev=P[(i-1+n)%n], cur2=P[i], next=P[(i+1)%n];
    const v1=[prev[0]-cur2[0],prev[1]-cur2[1]], v2=[next[0]-cur2[0],next[1]-cur2[1]];
    const l1=Math.hypot(...v1), l2=Math.hypot(...v2);
    const r1=Math.min(rr,l1/2), r2=Math.min(rr,l2/2);
    const A=[cur2[0]+v1[0]/l1*r1, cur2[1]+v1[1]/l1*r1];
    const B=[cur2[0]+v2[0]/l2*r2, cur2[1]+v2[1]/l2*r2];
    d+=(i===0?`M ${A[0]} ${A[1]} `:`L ${A[0]} ${A[1]} `)+`Q ${cur2[0]} ${cur2[1]} ${B[0]} ${B[1]} `;
  }
  return d+'Z';
}

/* ---------- состояние ---------- */
function loadLevel(idx){
  hideOverlay();
  const L=LEVELS[idx];
  const allCells=[]; for(let c=0;c<L.cols;c++) for(let r=0;r<L.rows;r++) allCells.push([c,r]);
  const valid=new Set(allCells.map(c=>key(c[0],c[1])));
  // назначить кускам картинки: цвет k-й в order = ряд k; шары цвета -> куски ряда
  const order=L.order;
  const ballsByColor={};
  L.balls.forEach(b=>{ (ballsByColor[b.color]=ballsByColor[b.color]||[]).push(b); });
  const pieceOf=new Map();
  order.forEach((col,row)=>{
    const arr=(ballsByColor[col]||[]).slice().sort((a,b)=> (a.cell[1]-b.cell[1])||(a.cell[0]-b.cell[0]));
    arr.forEach((b,k)=> pieceOf.set(b, row*Pieces.COLS + k));
  });
  state={idx, L, lives:L.lives, busy:false, valid,
    blocks:L.blocks.map((b,i)=>({...b, cells:b.cells.map(c=>c.slice()),
        base:b.cells.map(c=>c.slice()), count:b.count, id:i, el:null, badgeEl:null, cleared:false})),
    balls:L.balls.map((b,i)=>({...b, c:b.cell[0], r:b.cell[1], id:i, absorbed:false, el:null, piece:pieceOf.get(b)}))
  };
  window.state=state;
  document.getElementById('lvlNum').textContent=idx+1;
  timerbar.style.width='100%'; timerbar.classList.remove('low');
  renderBoard(); renderHearts();
  Pieces.init({ traySize:L.traySize, bandColors:order.map(c=>COLORS[c].b),
    onOverflow:()=>failLevel('Tray overflow','Buffer is full and the current picture row can’t be finished.'),
    onAllDone:()=>winLevel() });
  startTimer(L.time);
}

function renderBoard(){
  const {cols,rows}=state.L, W=cols*CELL, H=rows*CELL;
  board.setAttribute('viewBox',`0 0 ${W} ${H}`);
  board.innerHTML='';
  defsEl=document.createElementNS(NS,'defs');
  for(const k in COLORS){
    defsEl.insertAdjacentHTML('beforeend',
      `<linearGradient id="g_${k}" x1="0" y1="0" x2="0" y2="1">
         <stop offset="0" stop-color="${COLORS[k].a}"/><stop offset="1" stop-color="${COLORS[k].b}"/></linearGradient>`);
  }
  board.appendChild(defsEl);
  const allCells=[]; for(let c=0;c<cols;c++) for(let r=0;r<rows;r++) allCells.push([c,r]);
  const bg=document.createElementNS(NS,'path');
  bg.setAttribute('d', outlinePath(allCells, 16));
  bg.setAttribute('fill','#aeb4ce');
  bg.setAttribute('filter','drop-shadow(0 2px 4px #0002)');
  board.appendChild(bg);
  const g=document.createElementNS(NS,'g');
  allCells.forEach(([c,r])=>{
    const rc=document.createElementNS(NS,'rect');
    rc.setAttribute('x',px(c)+2);rc.setAttribute('y',px(r)+2);
    rc.setAttribute('width',CELL-4);rc.setAttribute('height',CELL-4);
    rc.setAttribute('rx',8); rc.setAttribute('class','mk'); g.appendChild(rc);
  });
  board.appendChild(g);
  state.blocks.forEach(drawBlock);
  state.balls.forEach(drawBall);
}

function drawBlock(b){
  const col=COLORS[b.color], d=outlinePath(b.base, 20);   // v6: фигуры скруглены сильнее
  const grp=document.createElementNS(NS,'g'); grp.setAttribute('class','block');
  const path=document.createElementNS(NS,'path');
  path.setAttribute('d',d); path.setAttribute('fill',`url(#g_${b.color})`);
  path.setAttribute('stroke',col.b); path.setAttribute('stroke-width','2.5');
  path.setAttribute('stroke-linejoin','round');
  path.setAttribute('filter','drop-shadow(0 3px 5px #0003)');
  grp.appendChild(path);
  const hi=document.createElementNS(NS,'path');
  hi.setAttribute('d',d); hi.setAttribute('fill','none');
  hi.setAttribute('stroke','#ffffff66'); hi.setAttribute('stroke-width','2');
  hi.setAttribute('transform','translate(0,1.5)'); grp.appendChild(hi);
  let br=b.base[0]; for(const c of b.base){ if(c[1]>br[1]||(c[1]===br[1]&&c[0]>br[0])) br=c; }
  const bx=px(br[0]+1)-12, by=px(br[1]+1)-12;
  const bc=document.createElementNS(NS,'circle');
  bc.setAttribute('cx',bx);bc.setAttribute('cy',by);bc.setAttribute('r',12);
  bc.setAttribute('fill','#fff');bc.setAttribute('filter','drop-shadow(0 1px 3px #0005)');grp.appendChild(bc);
  const bt=document.createElementNS(NS,'text');
  bt.setAttribute('x',bx);bt.setAttribute('y',by+1);bt.setAttribute('text-anchor','middle');
  bt.setAttribute('dominant-baseline','central');bt.setAttribute('font-size','14');
  bt.setAttribute('font-weight','900');bt.setAttribute('fill','#222');bt.textContent=b.count;
  grp.appendChild(bt); b.badgeEl=bt;
  grp.addEventListener('pointerdown', e=>onGrab(e,b));
  b.el=grp; board.appendChild(grp);
}

function drawBall(b){
  // v6: КВАДРАТНАЯ плитка-кусок (вместо круга) в цветной рамке = цвет фигуры
  const S=CELL*0.80, cx=px(b.c+0.5), cy=px(b.r+0.5);
  const x0=cx-S/2, y0=cy-S/2, rx=S*0.26;        // скруглённый квадрат
  const col=COLORS[b.color];
  const grp=document.createElementNS(NS,'g'); grp.setAttribute('class','ball-g');
  // цветная рамка-подложка
  const frame=document.createElementNS(NS,'rect');
  frame.setAttribute('x',x0);frame.setAttribute('y',y0);
  frame.setAttribute('width',S);frame.setAttribute('height',S);frame.setAttribute('rx',rx);
  frame.setAttribute('fill',col.b);frame.setAttribute('filter','drop-shadow(0 2px 3px #0004)');grp.appendChild(frame);
  // лицо = кусок картинки, обрезанный в скруглённый квадрат
  const pad=S*0.12, IS=S-2*pad, irx=rx*0.7;
  const clipId='clip_'+b.id;
  defsEl.insertAdjacentHTML('beforeend',
    `<clipPath id="${clipId}"><rect x="${x0+pad}" y="${y0+pad}" width="${IS}" height="${IS}" rx="${irx}"/></clipPath>`);
  const img=document.createElementNS(NS,'image');
  const url=Pieces.pieceDataURL(b.piece, 6);
  img.setAttribute('href',url); img.setAttributeNS(XLINK,'href',url);
  img.setAttribute('x',x0+pad);img.setAttribute('y',y0+pad);
  img.setAttribute('width',IS);img.setAttribute('height',IS);
  img.setAttribute('preserveAspectRatio','xMidYMid slice');
  img.setAttribute('clip-path',`url(#${clipId})`);
  img.setAttribute('style','image-rendering:pixelated');
  grp.appendChild(img);
  b.el=grp; board.appendChild(grp);
}

function moveBlockEl(b){
  const tx=(b.cells[0][0]-b.base[0][0])*CELL, ty=(b.cells[0][1]-b.base[0][1])*CELL;
  b.el.style.transform=`translate(${tx}px,${ty}px)`;
}

function renderHearts(){
  heartsEl.innerHTML='';
  for(let i=0;i<3;i++){
    const s=document.createElement('span');
    s.className='heart'+(i<state.lives?'':' lost'); s.textContent='❤️';
    heartsEl.appendChild(s);
  }
}

/* ---------- занятость / шаги ---------- */
function blockAt(c,r,except){
  for(const b of state.blocks){ if(b.cleared||b===except) continue;
    for(const cc of b.cells) if(cc[0]===c&&cc[1]===r) return b; }
  return null;
}
function ballAt(c,r){
  for(const b of state.balls){ if(!b.absorbed && b.c===c && b.r===r) return b; }
  return null;
}
function canStep(blk,dc,dr){
  const own=new Set(blk.cells.map(c=>key(c[0],c[1])));
  for(const c of blk.cells){
    const nc=c[0]+dc, nr=c[1]+dr, k=key(nc,nr);
    if(!state.valid.has(k)) return false;
    if(own.has(k)) continue;
    if(blockAt(nc,nr,blk)) return false;
    const ball=ballAt(nc,nr);
    if(ball && ball.color!==blk.color) return false;
  }
  return true;
}
function step(blk,dc,dr){
  for(const c of blk.cells){ c[0]+=dc; c[1]+=dr; }
  moveBlockEl(blk);
  const cset=new Set(blk.cells.map(c=>key(c[0],c[1])));
  for(const ball of state.balls){
    if(ball.absorbed||ball.color!==blk.color) continue;
    if(cset.has(key(ball.c,ball.r))) absorb(ball,blk);
  }
}
function absorb(ball,blk){
  ball.absorbed=true;
  if(ball.el){ ball.el.classList.add('pop'); setTimeout(()=>ball.el&&ball.el.remove(),220); }
  blk.count--; if(blk.badgeEl) blk.badgeEl.textContent=blk.count;
  if(blk.count<=0) clearBlock(blk);
  Pieces.collect(ball.piece);
}
function clearBlock(blk){
  blk.cleared=true;
  if(blk.el){ blk.el.classList.add('gone'); setTimeout(()=>blk.el&&blk.el.remove(),280); }
}

/* ---------- free-drag ---------- */
function cellFromEvent(e){
  const rect=board.getBoundingClientRect(); const {cols,rows}=state.L;
  let c=Math.floor((e.clientX-rect.left)/(rect.width/cols));
  let r=Math.floor((e.clientY-rect.top)/(rect.height/rows));
  return [Math.max(0,Math.min(cols-1,c)), Math.max(0,Math.min(rows-1,r))];
}
function blockBBox(b){
  let minc=1e9,minr=1e9,maxc=-1e9,maxr=-1e9;
  for(const c of b.cells){ minc=Math.min(minc,c[0]); minr=Math.min(minr,c[1]); maxc=Math.max(maxc,c[0]); maxr=Math.max(maxr,c[1]); }
  return {minc,minr,maxc,maxr};
}
function onGrab(e,b){
  if(state.busy||timer.paused||b.cleared) return;
  e.preventDefault();
  const [pc,pr]=cellFromEvent(e);
  const bb=blockBBox(b);
  drag={b, goc:pc-bb.minc, gor:pr-bb.minr};
  if(e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId);
}
function onMove(e){
  if(!drag||timer.paused) return;
  const b=drag.b; if(b.cleared){ drag=null; return; }
  const {cols,rows}=state.L;
  const [pc,pr]=cellFromEvent(e);
  let guard=0;
  while(guard++<12){
    const bb=blockBBox(b);
    const w=bb.maxc-bb.minc, h=bb.maxr-bb.minr;
    let targetC=Math.max(0,Math.min(cols-1-w, pc-drag.goc));
    let targetR=Math.max(0,Math.min(rows-1-h, pr-drag.gor));
    const sc=sign(targetC-bb.minc), sr=sign(targetR-bb.minr);
    if(!sc && !sr) break;
    if(sc && canStep(b,sc,0)) step(b,sc,0);
    else if(sr && canStep(b,0,sr)) step(b,0,sr);
    else break;
  }
}
function onDrop(){ drag=null; }
board.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onDrop);
window.addEventListener('pointercancel', onDrop);

/* ---------- таймер ---------- */
function startTimer(seconds){
  timer.paused=false; timer.end=performance.now()+seconds*1000;
  cancelAnimationFrame(timer.raf);
  function tick(now){
    if(timer.paused) return;
    const remain=Math.max(0, timer.end-now);
    const frac=remain/(state.L.time*1000);
    timerbar.style.width=(frac*100)+'%';
    timerbar.classList.toggle('low', frac<0.33);
    if(remain<=0){ timer.paused=true; failLevel("Time's up",'Run out before finishing the picture.'); return; }
    timer.raf=requestAnimationFrame(tick);
  }
  timer.raf=requestAnimationFrame(tick);
}
function stopTimer(){ timer.paused=true; cancelAnimationFrame(timer.raf); }

/* ---------- исходы ---------- */
function winLevel(){
  if(timer.paused) return;
  stopTimer(); confettiBurst();
  showOverlay('','Picture complete!','','Play again',()=>loadLevel(0));
  document.getElementById('ovEmoji').innerHTML='<img class="win" src="'+Pieces.fullDataURL(6)+'">';
}
function failLevel(title,text){
  if(timer.paused && title!=="Time's up") return;
  stopTimer(); showOverlay('💥',title,text,'Retry',()=>loadLevel(state.idx));
}

function showOverlay(emoji,title,text,btn,cb){
  document.getElementById('ovEmoji').textContent=emoji;
  document.getElementById('ovTitle').textContent=title;
  document.getElementById('ovText').textContent=text;
  const b=document.getElementById('ovBtn'); b.textContent=btn; b.onclick=cb;
  overlay.classList.remove('hidden');
}
function hideOverlay(){ overlay.classList.add('hidden'); }

document.getElementById('btnReset').onclick=()=>loadLevel(state.idx);
document.getElementById('btnHome').onclick=()=>loadLevel(0);

/* ---------- конфетти ---------- */
const cc=document.getElementById('confetti'), ctx=cc.getContext('2d');
let confParts=[], confRaf=null;
function resizeCC(){ cc.width=innerWidth; cc.height=innerHeight; }
addEventListener('resize',resizeCC); resizeCC();
function confettiBurst(){
  const colors=['#6b6be0','#9b5cf6','#34c759','#ff4d5e','#ffcc00','#ff8a3d'];
  for(let i=0;i<160;i++){
    confParts.push({x:innerWidth/2,y:innerHeight*0.30,
      vx:(Math.random()-0.5)*14, vy:Math.random()*-14-4,
      g:0.35+Math.random()*0.2, s:6+Math.random()*7,
      c:colors[i%colors.length], a:1, rot:Math.random()*6.28, vr:(Math.random()-.5)*.4});
  }
  if(!confRaf) confLoop();
}
function confLoop(){
  ctx.clearRect(0,0,cc.width,cc.height);
  confParts.forEach(p=>{
    p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.a-=0.006;
    ctx.save(); ctx.globalAlpha=Math.max(0,p.a); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore();
  });
  confParts=confParts.filter(p=>p.a>0 && p.y<cc.height+40);
  if(confParts.length) confRaf=requestAnimationFrame(confLoop);
  else { ctx.clearRect(0,0,cc.width,cc.height); confRaf=null; }
}

document.getElementById('lvlTot').textContent=LEVELS.length;
showOverlay('🍄','Drop + Picture',
  'No letters this time — every ball carries a piece of a hidden picture (a pixel fly-agaric under a rainbow). Drag a shape to sweep its same-color balls; pieces snap into place row by row. Collect the rows IN ORDER, don’t flood the tray, and rebuild the whole picture!',
  'Play',()=>loadLevel(0));
</script>
