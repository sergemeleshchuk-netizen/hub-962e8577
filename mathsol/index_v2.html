<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Math Solitaire — v2</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b3d22;font-family:Arial,Helvetica,sans-serif;touch-action:none}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:360px;height:640px;overflow:hidden;transform-origin:center center;
         background:radial-gradient(120% 80% at 50% 0%,#3bb068,#1f8a4c 70%,#187a41)}

  /* HUD */
  .coins{position:absolute;top:12px;left:14px;display:flex;align-items:center;gap:6px;
         background:rgba(0,0,0,.22);border-radius:20px;padding:4px 12px 4px 6px;z-index:6}
  .coins .c{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#f1b417);border:2px solid #d99b0c}
  .coins span{color:#fff;font-weight:800;font-size:14px}
  .menu{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:8px;background:rgba(0,0,0,.22);z-index:6;
        display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}
  .menu i{width:14px;height:2px;background:#fff;border-radius:2px}

  /* pipeline */
  .pipe{position:absolute;top:48px;left:14px;z-index:5}
  .moves{background:#fff;border-radius:12px;padding:5px 14px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.25)}
  .moves .lbl{font-size:8px;font-weight:800;color:#2b7a3a;letter-spacing:1px}
  .moves .num{font-size:22px;font-weight:900;color:#1b5e2a;line-height:1}
  .pipe-right{position:absolute;top:48px;right:14px;display:flex;align-items:flex-start;gap:8px;z-index:5}

  /* card */
  .card{width:54px;height:74px;border-radius:8px;background:#fff;border:1px solid #d7d7d7;
        box-shadow:0 2px 4px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;
        font-size:17px;font-weight:900;color:#1b3a23}
  .card.back{background:repeating-linear-gradient(45deg,#e23b3b 0 6px,#c52f2f 6px 12px);border:2px solid #fff}
  .badge{position:absolute;bottom:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:#222;
         color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .deckwrap{position:relative}

  /* foundations */
  .founds{position:absolute;top:140px;left:14px;right:14px;display:flex;gap:8px;z-index:3}
  .found{flex:1;height:84px;border-radius:10px;background:#fff;box-shadow:0 3px 6px rgba(0,0,0,.22);
         display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
         transition:transform .12s,box-shadow .12s}
  .found .dots{display:flex;gap:3px;position:absolute;top:8px}
  .found .dots i{width:6px;height:6px;border-radius:50%;background:#dcdcdc;transition:background .2s}
  .found .dots i.on{background:#37c06a}
  .found .val{font-size:26px;font-weight:900;color:#1b5e2a;margin-top:6px}
  .found .gate{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:34px;height:6px;border-radius:4px;background:#ffd23f}
  .found.hot{box-shadow:0 0 0 3px #ffd23f,0 0 16px rgba(255,210,63,.8);transform:translateY(-2px)}
  .found.complete{background:#dff7e6;box-shadow:0 0 0 3px #37c06a}
  .found.pop{transform:scale(1.1)}

  /* tableau */
  .tableau{position:absolute;top:250px;left:14px;right:14px;bottom:74px;display:flex;gap:8px;z-index:2}
  .col{flex:1;position:relative}
  .col .card{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:60px}
  .col .card.buried{color:#9bb0a2}
  .col .card.front{cursor:grab;box-shadow:0 3px 7px rgba(0,0,0,.3)}

  /* drag layer — single coordinate origin = stage */
  #dragLayer{position:absolute;inset:0;z-index:120;pointer-events:none}
  #dragLayer .card{position:absolute;width:60px;max-width:60px;transform:scale(1.06);cursor:grabbing;
                   box-shadow:0 12px 22px rgba(0,0,0,.45)}
  .card.snap{transition:left .18s ease,top .18s ease,transform .18s ease}

  /* boosters */
  .boosters{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:18px;z-index:5}
  .booster{position:relative;width:50px;height:50px;border-radius:14px;background:#fff;box-shadow:0 3px 6px rgba(0,0,0,.25);
           display:flex;align-items:center;justify-content:center;font-size:22px}
  .booster .badge{background:#e23b3b}

  /* tutorial hand */
  .hand{position:absolute;width:42px;height:42px;z-index:130;pointer-events:none;opacity:0;
        transition:left .35s ease,top .35s ease,opacity .2s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
  .hand.tap{animation:tap 1s ease-in-out infinite}
  @keyframes tap{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-3px,-7px) scale(.92)}}

  .spark{position:absolute;width:8px;height:8px;border-radius:2px;z-index:115;pointer-events:none}

  /* end card */
  #end{position:absolute;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;
       background:radial-gradient(120% 80% at 50% 0%,#3bb068,#157a41);text-align:center}
  #end.show{display:flex;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #end .logo{font-size:30px;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.4);letter-spacing:1px}
  #end .ribbon{background:#e23b3b;color:#fff;font-weight:900;font-size:15px;letter-spacing:3px;padding:3px 18px;border-radius:5px;margin:10px 0 26px}
  .play{background:linear-gradient(#7ed957,#4caf3f);color:#fff;font-size:24px;font-weight:900;letter-spacing:1px;border:none;
        border-radius:14px;padding:16px 52px;box-shadow:0 5px 0 #2f7a2a,0 8px 16px rgba(0,0,0,.4);cursor:pointer;animation:cta 1.2s ease-in-out infinite}
  @keyframes cta{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>
</head>
<body>
<div id="fit"><div id="stage">

  <div class="coins"><div class="c"></div><span id="coins">1,690</span></div>
  <div class="menu"><i></i><i></i><i></i></div>

  <div class="pipe"><div class="moves"><div class="lbl">MOVES</div><div class="num" id="moves">18</div></div></div>
  <div class="pipe-right" id="pipe"></div>

  <div class="founds" id="founds"></div>
  <div class="tableau" id="tableau"></div>

  <div class="boosters">
    <div class="booster">🃏<div class="badge" id="bjoker">1</div></div>
    <div class="booster">💡<div class="badge" id="bhint">3</div></div>
    <div class="booster">↶<div class="badge" id="bundo">1</div></div>
  </div>

  <div id="dragLayer"></div>

  <svg class="hand" id="hand" viewBox="0 0 64 64"><path fill="#ffe0bd" stroke="#caa17a" stroke-width="2"
    d="M26 6c3 0 5 2 5 5v18l3-1c2-1 4 0 5 2l8 16c2 5 1 12-4 16-4 3-9 4-14 4-7 0-12-3-15-9L9 42c-1-3 0-6 3-7s6 0 7 3l2 4V11c0-3 2-5 5-5z"/></svg>

  <div id="end">
    <div class="logo">MATH</div><div class="ribbon">SOLITAIRE</div>
    <button class="play" onclick="ctaClick()">PLAY NOW</button>
  </div>

</div></div>

<script>
/* ============================================================
   Math Solitaire — v2 playable.  Build: Meta + Google.
   ============================================================ */
var STORE_URL = "https://play.google.com/store/apps/details?id=YOUR.PACKAGE"; // TODO replace

/* ---------- LEVEL DATA (data-first) ---------- */
var LEVEL = {
  moves: 18, coins:"1,690", boosters:{joker:1,hint:3,undo:1},
  pipe:{next:"4×5", deckCount:2},
  foundations:[ {value:20,need:3},{value:16,need:3},{value:15,need:2},{value:8,need:3} ],
  tableau:[
    ["8","4×5","16"],
    ["15","2×8","8"],
    ["10+10","8","√225"],
    ["16","20"]
  ]
};

/* ---------- expression -> value ---------- */
function val(expr){
  var s=(""+expr).replace(/×|X|x/g,"*").replace(/÷/g,"/").replace(/−|–/g,"-").replace(/\s/g,""),m;
  if((m=s.match(/^√(\d+)$/)))return Math.round(Math.sqrt(+m[1]));
  if((m=s.match(/^(\d+)²$/)))return (+m[1])*(+m[1]);
  if((m=s.match(/^(\d+)\^(\d+)$/)))return Math.pow(+m[1],+m[2]);
  if((m=s.match(/^(\d+)([*/+\-])(\d+)$/))){var a=+m[1],b=+m[3];return m[2]==="*"?a*b:m[2]==="/"?a/b:m[2]==="+"?a+b:a-b;}
  return +s;
}

/* ---------- VALIDATE ---------- */
function validate(L){
  var errs=[],fvals={},need={};
  L.foundations.forEach(function(f){fvals[f.value]=true;need[f.value]=(need[f.value]||0)+f.need;});
  var have={},total=0;
  L.tableau.forEach(function(col){col.forEach(function(c){var v=val(c);total++;have[v]=(have[v]||0)+1;if(!fvals[v])errs.push("card "+c+"="+v+" no foundation");});});
  Object.keys(need).forEach(function(v){if((have[v]||0)!==need[v])errs.push("value "+v+": have "+(have[v]||0)+" need "+need[v]);});
  if(total>L.moves)errs.push("cards "+total+">moves "+L.moves);
  console.log(errs.length?"VALIDATE ERRORS:\n"+errs.join("\n"):"VALIDATE OK ("+total+" cards, "+L.moves+" moves)");
  return {ok:errs.length===0,errs:errs,total:total};
}

/* ---------- state ---------- */
var stage=document.getElementById("stage"), dragLayer=document.getElementById("dragLayer");
var hand=document.getElementById("hand");
var founds=[], cols=[], moves=LEVEL.moves, totalCards=0, placed=0;

/* ---------- render from data ---------- */
function render(L){
  document.getElementById("coins").textContent=L.coins;
  document.getElementById("moves").textContent=L.moves;
  document.getElementById("bjoker").textContent=L.boosters.joker;
  document.getElementById("bhint").textContent=L.boosters.hint;
  document.getElementById("bundo").textContent=L.boosters.undo;

  var pipe=document.getElementById("pipe");pipe.innerHTML="";
  var nc=document.createElement("div");nc.className="card";nc.textContent=L.pipe.next;pipe.appendChild(nc);
  var dw=document.createElement("div");dw.className="deckwrap";
  var db=document.createElement("div");db.className="card back";dw.appendChild(db);
  var bd=document.createElement("div");bd.className="badge";bd.textContent=L.pipe.deckCount;dw.appendChild(bd);
  pipe.appendChild(dw);

  var fe=document.getElementById("founds");fe.innerHTML="";founds=[];
  L.foundations.forEach(function(f){
    var d=document.createElement("div");d.className="found";
    var dots="";for(var i=0;i<f.need;i++)dots+="<i></i>";
    d.innerHTML='<div class="gate"></div><div class="dots">'+dots+'</div><div class="val">'+f.value+'</div>';
    fe.appendChild(d);
    founds.push({el:d,value:f.value,need:f.need,count:0,dots:d.querySelectorAll(".dots i")});
  });

  var te=document.getElementById("tableau");te.innerHTML="";cols=[];totalCards=0;placed=0;
  L.tableau.forEach(function(col,ci){
    var c=document.createElement("div");c.className="col";te.appendChild(c);
    var cards=[];
    col.forEach(function(expr,idx){
      totalCards++;
      var el=document.createElement("div");el.className="card";el.textContent=expr;
      el.style.top=(idx*24)+"px";
      c.appendChild(el);
      cards.push({el:el,expr:expr,value:val(expr),col:ci,baseTop:idx*24});
    });
    cols.push({el:c,cards:cards});
    refreshCol(ci);
  });
}
/* front = last; face up & draggable, others buried (dim) */
function refreshCol(ci){
  var col=cols[ci];
  col.cards.forEach(function(card,idx){
    var front=(idx===col.cards.length-1);
    card.el.className="card"+(front?" front":" buried");
  });
}

/* ---------- target foundation for a value (incomplete, matching) ---------- */
function targetFoundation(v){
  for(var i=0;i<founds.length;i++) if(founds[i].value===v && founds[i].count<founds[i].need) return i;
  return -1;
}
/* suggested next move */
function nextMove(){
  for(var ci=0;ci<cols.length;ci++){
    var col=cols[ci]; if(!col.cards.length) continue;
    var card=col.cards[col.cards.length-1];
    var fi=targetFoundation(card.value);
    if(fi>=0) return {card:card,fi:fi};
  }
  return null;
}

/* ---------- scale helpers (single origin = stage) ---------- */
function scale(){return Math.min(window.innerWidth/360, window.innerHeight/640);}
function toStage(clientX,clientY){var r=stage.getBoundingClientRect(),s=scale();return {x:(clientX-r.left)/s,y:(clientY-r.top)/s};}
function rectInStage(el){var r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect(),s=scale();
  return {x:(r.left-sr.left)/s,y:(r.top-sr.top)/s,w:r.width/s,h:r.height/s};}

/* ---------- tutorial hand ---------- */
function guide(){
  var mv=nextMove();
  if(!mv){hand.style.opacity=0;return;}
  var rc=rectInStage(mv.card.el);
  hand.style.opacity=1;hand.classList.add("tap");
  hand.style.left=(rc.x+rc.w*0.55)+"px";
  hand.style.top=(rc.y+rc.h*0.5)+"px";
}

/* ============================================================
   DRAG — lift card into #dragLayer (origin = stage) => no jump
   ============================================================ */
var drag=null;
stage.addEventListener("pointerdown",function(ev){
  var el=ev.target.closest(".col .card.front"); if(!el) return;
  var card=null,col=null;
  cols.forEach(function(c){var f=c.cards[c.cards.length-1];if(f&&f.el===el){card=f;col=c;}});
  if(!card) return;
  ev.preventDefault();
  hand.style.opacity=0;hand.classList.remove("tap");

  var rc=rectInStage(el);                 // card position in stage coords
  var p=toStage(ev.clientX,ev.clientY);
  drag={card:card,col:col,grabX:p.x-rc.x,grabY:p.y-rc.y,w:rc.w,h:rc.h};

  // move element into drag layer, keep visual position
  dragLayer.appendChild(el);
  el.className="card";                    // plain look while dragging
  el.style.left=rc.x+"px"; el.style.top=rc.y+"px"; el.style.transform="scale(1.06)";
  moveDrag(ev);
});
window.addEventListener("pointermove",function(ev){if(drag)moveDrag(ev);});
window.addEventListener("pointerup",function(ev){if(drag)dropDrag(ev);});

function moveDrag(ev){
  var p=toStage(ev.clientX,ev.clientY);
  var el=drag.card.el;
  el.style.left=(p.x-drag.grabX)+"px";
  el.style.top=(p.y-drag.grabY)+"px";
  var fi=targetFoundation(drag.card.value);
  founds.forEach(function(f,i){f.el.classList.toggle("hot",i===fi);});
}

function dropDrag(ev){
  var el=drag.card.el, fi=targetFoundation(drag.card.value);
  var over=foundationUnder(ev.clientX,ev.clientY);
  founds.forEach(function(f){f.el.classList.remove("hot");});
  var accept=(over===fi) || (over<0 && nearFoundRow(ev.clientY) && fi>=0);
  if(accept && fi>=0) land(drag.card,drag.col,fi);
  else returnCard(drag.card,drag.col);
  drag=null;
}
function foundationUnder(x,y){
  for(var i=0;i<founds.length;i++){var r=founds[i].el.getBoundingClientRect();
    if(x>=r.left-14&&x<=r.right+14&&y>=r.top-14&&y<=r.bottom+14)return i;}
  return -1;
}
function nearFoundRow(y){var r=document.getElementById("founds").getBoundingClientRect();return y<r.bottom+40;}

function returnCard(card,col){
  var el=card.el, ci=cols.indexOf(col);
  // put back into its column DOM, snap to base position
  col.el.appendChild(el);
  el.className="card front";
  el.classList.add("snap");
  el.style.left="50%";el.style.top=card.baseTop+"px";el.style.transform="translateX(-50%)";
  setTimeout(function(){el.classList.remove("snap");el.style.transform="translateX(-50%)";guide();},190);
}

function land(card,col,fi){
  col.cards.pop(); refreshCol(cols.indexOf(col));
  var f=founds[fi], rc=rectInStage(f.el), el=card.el;
  el.classList.add("snap");
  el.style.left=(rc.x+(rc.w-drag.w)/2)+"px";
  el.style.top=(rc.y+(rc.h-drag.h)/2)+"px";
  el.style.transform="scale(.9)";
  setTimeout(function(){
    el.remove();
    f.count++; if(f.dots[f.count-1])f.dots[f.count-1].classList.add("on");
    f.el.classList.add("pop");setTimeout(function(){f.el.classList.remove("pop");},140);
    if(f.count>=f.need) f.el.classList.add("complete");
    burst(f.el);
    placed++; moves--; document.getElementById("moves").textContent=moves;
    if(placed>=totalCards) win(); else guide();
  },180);
}

function burst(target){
  var rc=rectInStage(target), cx=rc.x+rc.w/2, cy=rc.y+rc.h/2, cl=["#ffe066","#7ed957","#fff","#37c06a"];
  for(var i=0;i<12;i++){var p=document.createElement("div");p.className="spark";p.style.background=cl[i%cl.length];
    p.style.left=cx+"px";p.style.top=cy+"px";stage.appendChild(p);
    var a=Math.PI*2*i/12,d=28+(i%3)*12;(function(p,dx,dy){p.animate([{transform:"translate(0,0) scale(1)",opacity:1},
      {transform:"translate("+dx+"px,"+dy+"px) scale(0)",opacity:0}],{duration:520,easing:"cubic-bezier(.2,.7,.3,1)"});
      setTimeout(function(){p.remove();},540);})(p,Math.cos(a)*d,Math.sin(a)*d);}
}

/* ---------- WIN / CTA ---------- */
function win(){ setTimeout(function(){document.getElementById("end").classList.add("show");},450); }
var ctaFired=false;
function ctaClick(){
  if(ctaFired)return;ctaFired=true;
  try{if(window.FbPlayableAd&&FbPlayableAd.onCTAClick){FbPlayableAd.onCTAClick();return;}}catch(e){}
  try{if(typeof ExitApi!=="undefined"&&ExitApi.exit){ExitApi.exit();return;}}catch(e){}
  try{if(window.mraid&&mraid.open){mraid.open(STORE_URL);return;}}catch(e){}
  try{window.open(STORE_URL,"_blank");}catch(e){}
}

/* ---------- boot ---------- */
function fit(){stage.style.transform="scale("+scale()+")";}
window.addEventListener("resize",function(){fit();guide();});
validate(LEVEL); render(LEVEL); fit();
requestAnimationFrame(function(){requestAnimationFrame(function(){fit();guide();});});
setTimeout(guide,400);
</script>
</body>
</html>
