<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pin Box — v7 · Пушки-хрюшки по бокам</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  #phone{position:relative;overflow:hidden;background:#b7aee9;}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }
  #game{position:absolute;inset:0;width:100%;height:100%;display:block;}

  .ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
      background:rgba(40,32,80,.55);opacity:0;pointer-events:none;transition:opacity .25s;}
  .ov.show{opacity:1;pointer-events:auto;}
  .card{background:#fff;border-radius:22px;padding:26px 30px 24px;text-align:center;
        box-shadow:0 18px 50px rgba(30,20,80,.45);min-width:230px;transform:scale(.9);transition:transform .25s;}
  .ov.show .card{transform:scale(1);}
  .card h2{margin:0 0 6px;font-size:24px;color:#4a3f8f;}
  .card p{margin:0 0 16px;font-size:14px;color:#8b84b8;}
  .card button{border:0;border-radius:14px;padding:12px 28px;font-size:17px;font-weight:700;color:#fff;
        background:linear-gradient(180deg,#7ed44b,#57b32a);box-shadow:0 4px 0 #3f8c1c;cursor:pointer;}
  .card button:active{transform:translateY(2px);box-shadow:0 2px 0 #3f8c1c;}
</style>
</head>
<body>
<div id="phone">
  <canvas id="game"></canvas>
  <div class="ov" id="ovWin"><div class="card"><h2>Level Complete!</h2><p>The picture is fully blasted 🎨</p><button onclick="G.restart()">Play again</button></div></div>
  <div class="ov" id="ovLose"><div class="card"><h2 id="loseTitle">Tray Full!</h2><p id="loseText">No triple — the tray overflowed</p><button onclick="G.restart()">Retry</button></div></div>
</div>

<script>
'use strict';
/* ============ PIN BOX v4 · Pinball Bumpers ============
   Вместо полок — КРУГЛЫЕ БАМПЕРЫ как в пинболе: центральный
   разделитель кидает коробку влево или вправо, отбойники в
   стенах возвращают её к центру. 10 пушек: 5 нужных +
   5 ПРИМАНОК — пушка цвета, который уже не нужен, встаёт в
   слот и ЗАСТРЕВАЕТ (стрелять не по чему). Все 3 слота
   застряли = Cannons Jammed, проигрыш.
   ======================================================
   Коробка падает по шахте на пинах. По пути — пушки цветов:
   пушки размещены так, что нужно вытянуть ПРАВИЛЬНЫЙ пин,
   чтобы коробка соскользнула на пушку. Подобранная пушка
   встаёт в слот под картинкой и отстреливает свой боезапас
   по пикселям своего цвета (механика Pixel Flow).
   Трей с пинами — ВНИЗУ. Победа: картинка уничтожена.
   Проигрыши: трей полон без тройки / коробка на полу,
   а пушки упущены и картинка не добита. */

const W = 390;
const WORLD_H = 2030, FLOOR_Y = 1960;
const WALL_L = 10, WALL_R = 380;      // шире: почти вся ширина экрана
const TRAY_CAP = 7;
const ACTIVE_R = 175;
const PIN_R = 13;

/* layout экрана */
const PIC_PX = 18;                     // размер большого пикселя
const PIC_X0 = 114, PIC_Y0 = 44;       // левый-верх картинки (9 колонок)
/* слоты пушек ПО БОКАМ картинки (стреляют вбок, как шутеры Pixel Flow) */
const SLOT_DEFS = [{x:57,y:88,d:1},{x:57,y:158,d:1},{x:333,y:88,d:-1},{x:333,y:158,d:-1}];
const SH_TOP = 252, SH_H = 354;        // окно шахты
const TRAY_BAR_Y = 612;                // трей внизу

const COLORS = {
  Y:{main:'#ffd23f',dark:'#e0a818',lite:'#fff2b0'},
  O:{main:'#ff9838',dark:'#d96f12',lite:'#ffd2a0'},
  B:{main:'#3fb9f2',dark:'#1a86c2',lite:'#bfe9ff'},
  P:{main:'#a26bf0',dark:'#7a44c8',lite:'#ddc8ff'},
};

/* ---- картинка: сердце 9×8, полосы цветов (46 пикселей) ---- */
const PIC_MASK = [
  '.XX...XX.',
  'XXXX.XXXX',
  'XXXXXXXXX',
  'XXXXXXXXX',
  '.XXXXXXX.',
  '..XXXXX..',
  '...XXX...',
  '....X....',
];
const ROW_COLOR = ['Y','Y','O','O','B','B','P','P'];  // Y12 O18 B12 P4 = 46

/* ---- пушки: 5 НУЖНЫХ (сумма по цвету = пикселям) + 5 ПРИМАНОК ----
   5 ярусов; на каждом разделитель кидает коробку влево или вправо:
   с одной стороны нужная пушка, с другой — приманка.
   Нужные: Y12(L) O9(R) O9(L) B12(R) P4(L) = 46 */
const CANNON_DEF = [
  // пушки у СТЕН: дивертер швыряет коробку к стене выбранной стороны;
  // 4 яруса: слева/справа нужная или приманка
  {x:60, y:480, c:'Y', n:12},  // ярус 1 L — НУЖНАЯ
  {x:330,y:480, c:'O', n:7},   // ярус 1 R — приманка
  {x:60, y:920, c:'B', n:6},   // ярус 2 L — приманка
  {x:330,y:920, c:'O', n:18},  // ярус 2 R — НУЖНАЯ (большая!)
  {x:60, y:1360,c:'B', n:12},  // ярус 3 L — НУЖНАЯ
  {x:330,y:1360,c:'Y', n:6},   // ярус 3 R — приманка
  {x:60, y:1800,c:'P', n:5},   // ярус 4 L — приманка
  {x:330,y:1800,c:'P', n:4},   // ярус 4 R — НУЖНАЯ
];

/* ---- пины ---- */
const PIN_DEF = [
  // ряды-станции по 5 пинов одного цвета (ловят прилёт по всей ширине):
  // тяни пины так, чтобы опорой остался крайний с противоположной стороны —
  // коробка перевалится к нужной пушке
  // шаг 60: зазор между пинами либо мал для входа (34), либо свободно
  // проходим после вытяжки (94+) — коробке НЕГДЕ заклиниться
  [105,200,'Y'],[165,200,'Y'],[225,200,'Y'],[285,200,'Y'],      // ярус 1 -> влево
  [105,640,'O'],[165,640,'O'],[225,640,'O'],[285,640,'O'],      // ярус 2 -> вправо
  [105,1080,'B'],[165,1080,'B'],[225,1080,'B'],[285,1080,'B'],  // ярус 3 -> влево
  [105,1520,'P'],[165,1520,'P'],[225,1520,'P'],[285,1520,'P'],  // ярус 4 -> вправо
  // филлеры для троек — тихие карманы у стен над пушками
  [30,280,'P'],[360,280,'B'],[30,720,'Y'],
  [360,1160,'P'],[30,1600,'O'],[360,1840,'B'],
];

const LEDGES = [];   // в v4 полок нет — только бамперы

/* ---- КРУГЛЫЕ БАМПЕРЫ (пинбол): разделители в центре + отбойники в стенах ---- */
/* линия пегов ВНАХЛЁСТ (шаг 18 < диаметра 20): гладкая «гусеница» из
   кружков — нет выемок-сёдел, куда мог бы провалиться угол коробки */
function pegLine(x1,y1,x2,y2){
  const out=[], n=Math.ceil(Math.hypot(x2-x1,y2-y1)/18);
  for(let i=0;i<=n;i++) out.push([x1+(x2-x1)*i/n, y1+(y2-y1)*i/n, 10, 0]);
  return out;
}
const BUMPER_DEF = [
  // КУПОЛ-горка по центру под каждым рядом: любой наклон однозначно
  // решает сторону съезда; зазор купол-стена 140 > коробки 78
  [195,350,46,0],[195,790,46,0],[195,1230,46,0],[195,1670,46,0],
  // гладкие горки из кружков: скатывают коробку от стены к центру
  // просвет между концами горок 100 > диагонали коробки 92 — в V-щель не клинит
  ...pegLine(25,560,135,612),  ...pegLine(365,560,255,612),
  ...pegLine(25,1000,135,1052),...pegLine(365,1000,255,1052),
  ...pegLine(25,1440,135,1492),...pegLine(365,1440,255,1492),
  ...pegLine(25,1880,135,1932),...pegLine(365,1880,255,1932),
];

/* ================= физика коробки ================= */
const BOX_W = 78, BOX_H = 48;         // коробка меньше — больше простора
const GRAV = 300, LIN_DAMP = 0.45, ANG_DAMP = 2.6, RIGHTING = 3.5, MU_PIN = 0.30, MU_WALL = 0.15;
const COM_MAX = 14, COM_RATE = 1.4;   // перетекающий центр тяжести (груз внутри)
const COMY_MAX = 22;                  // аварийный подъём груза при застревании
const MASS = 1, INERTIA = MASS*(BOX_W*BOX_W+BOX_H*BOX_H)/12 * 1.8;

let box, pins, tray, flying, particles, state, camY, tick, winAt;
let pixels, pixelsLeft, cannons, slots, cannonQueue, shots, loseReason, floorSettle, hopelessT;
let bumpers;
let lastContacts = 0;   // выравнивание только в воздухе: на опоре коробка живёт сама
let bumpDx = null;      // контакт с кружком в этом шаге: box.x - bumper.x (сторона склона)
let comStuckT = 0;      // сколько коробка стоит с контактом (детектор застревания)

function reset(){
  box = {x:195, y:110, a:0.03, vx:0, vy:0, va:0, com:0, comY:0};
  pins = PIN_DEF.map((p,i)=>({id:i, x:p[0], y:p[1], c:p[2], alive:true}));
  tray = []; flying = []; particles = []; shots = [];
  pixels = PIC_MASK.map((row,r)=>row.split('').map(ch=>ch==='X'?{c:ROW_COLOR[r],alive:true,rsv:false,pop:0}:null));
  pixelsLeft = 0; pixels.forEach(r=>r.forEach(p=>{ if(p) pixelsLeft++; }));
  cannons = CANNON_DEF.map((c,i)=>({id:i, ...c, st:'field', fx:0, fy:0, t:0, left:c.n, cool:0}));
  bumpers = BUMPER_DEF.map(b=>({x:b[0], y:b[1], r:b[2], e:b[3], hit:0}));
  slots = SLOT_DEFS.map(()=>null); cannonQueue = [];
  state = 'play'; camY = 0; tick = 0; winAt = 0; loseReason=''; floorSettle = 0; hopelessT = 0; physAcc = 0; comStuckT = 0;
  ovWin.classList.remove('show'); ovLose.classList.remove('show');
}

function toLocal(px,py){
  const c=Math.cos(box.a), s=Math.sin(box.a);
  const dx=px-box.x, dy=py-box.y;
  return {x:dx*c+dy*s, y:-dx*s+dy*c};
}
function toWorld(lx,ly){
  const c=Math.cos(box.a), s=Math.sin(box.a);
  return {x:box.x+lx*c-ly*s, y:box.y+lx*s+ly*c};
}
function boxCircle(cx,cy,r){
  const hw=BOX_W/2, hh=BOX_H/2;
  const l=toLocal(cx,cy);
  const qx=Math.max(-hw,Math.min(hw,l.x)), qy=Math.max(-hh,Math.min(hh,l.y));
  let dx=l.x-qx, dy=l.y-qy;
  let d2=dx*dx+dy*dy;
  if(d2 > r*r) return null;
  let nlx, nly, pen;
  if(d2 > 1e-9){
    const d=Math.sqrt(d2);
    nlx=dx/d; nly=dy/d; pen=r-d;
  } else {
    const ox=hw-Math.abs(l.x), oy=hh-Math.abs(l.y);
    if(ox<oy){ nlx=l.x<0?-1:1; nly=0; pen=r+ox; } else { nlx=0; nly=l.y<0?-1:1; pen=r+oy; }
  }
  const c=Math.cos(box.a), s=Math.sin(box.a);
  const nx=-(nlx*c-nly*s), ny=-(nlx*s+nly*c);
  const pw=toWorld(qx,qy);
  return {nx,ny,px:pw.x,py:pw.y,pen};
}
function closestOnSeg(x1,y1,x2,y2,px,py){
  const dx=x2-x1, dy=y2-y1;
  const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));
  return {x:x1+t*dx, y:y1+t*dy};
}
function applyImpulse(px,py,jx,jy){
  box.vx += jx/MASS; box.vy += jy/MASS;
  box.va += ((px-box.x)*jy-(py-box.y)*jx)/INERTIA;
}
function velAt(px,py){
  return {x:box.vx - box.va*(py-box.y), y:box.vy + box.va*(px-box.x)};
}
function solveContact(ct,mu){
  const rx=ct.px-box.x, ry=ct.py-box.y;
  const v=velAt(ct.px,ct.py);
  const vn=v.x*ct.nx+v.y*ct.ny;
  if(vn<0){
    const rn=rx*ct.ny-ry*ct.nx;
    const em=1/MASS + rn*rn/INERTIA;
    const j=-(1+(ct.e||0))*vn/em;    // ct.e — упругость (бамперы)
    applyImpulse(ct.px,ct.py,j*ct.nx,j*ct.ny);
    const v2=velAt(ct.px,ct.py);
    const tx=-ct.ny, ty=ct.nx;
    const vt=v2.x*tx+v2.y*ty;
    const rt=rx*ty-ry*tx;
    const emt=1/MASS + rt*rt/INERTIA;
    let jt=-vt/emt;
    const maxF=mu*j;
    jt=Math.max(-maxF,Math.min(maxF,jt));
    applyImpulse(ct.px,ct.py,jt*tx,jt*ty);
  }
  const corr=Math.max(ct.pen-0.4,0)*0.35;
  box.x+=ct.nx*corr; box.y+=ct.ny*corr;
}
function collectContacts(){
  const cts=[];
  const hw=BOX_W/2, hh=BOX_H/2;
  for(const [lx,ly] of [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh],[0,-hh],[0,hh]]){
    const p=toWorld(lx,ly);
    if(p.x < WALL_L) cts.push({nx:1,ny:0,px:p.x,py:p.y,pen:WALL_L-p.x,mu:MU_WALL});
    if(p.x > WALL_R) cts.push({nx:-1,ny:0,px:p.x,py:p.y,pen:p.x-WALL_R,mu:MU_WALL});
    if(p.y > FLOOR_Y) cts.push({nx:0,ny:-1,px:p.x,py:p.y,pen:p.y-FLOOR_Y,mu:0.6});
  }
  for(const [x1,y1,x2,y2,r] of LEDGES){
    if(Math.abs((y1+y2)/2-box.y)>160) continue;
    let q=closestOnSeg(x1,y1,x2,y2,box.x,box.y);
    let ct=boxCircle(q.x,q.y,r);
    if(ct){
      q=closestOnSeg(x1,y1,x2,y2,ct.px,ct.py);
      ct=boxCircle(q.x,q.y,r);
      if(ct){ ct.mu=MU_WALL; cts.push(ct); }
    }
  }
  // горки: БЕЗ отскока и кика — коробка скользит и СЪЕЗЖАЕТ с кружков
  // (перетекающий центр тяжести сам сваливает её с макушки)
  for(const b of bumpers){
    if(Math.abs(b.y-box.y)>140 || Math.abs(b.x-box.x)>140) continue;
    const ct=boxCircle(b.x,b.y,b.r);
    if(ct){
      ct.mu=0.06; ct.e=0;
      bumpDx = box.x - b.x;
      const v=velAt(ct.px,ct.py);
      if(v.x*ct.nx+v.y*ct.ny < -80) b.hit=1;
      cts.push(ct);
    }
  }
  for(const p of pins){
    if(!p.alive) continue;
    if(Math.abs(p.y-box.y)>140 || Math.abs(p.x-box.x)>140) continue;
    const ct=boxCircle(p.x,p.y,PIN_R+2);
    if(ct){ ct.mu=MU_PIN; cts.push(ct); }
  }
  return cts;
}
/* фиксированный шаг физики: headless/слабые устройства с редкими кадрами
   получают ту же скорость игры, что и 60fps */
let physAcc=0;
function physStep(dtReal){
  physAcc=Math.min(physAcc+dtReal,0.3);
  const FIX=1/60;
  while(physAcc>=FIX){ physAcc-=FIX; physFixed(FIX); }
}
function physFixed(dt){
  const SUB=5, h=dt/SUB;
  for(let s=0;s<SUB;s++){
    box.vy += GRAV*h;
    if(lastContacts===0) box.va += -Math.sin(2*box.a)*RIGHTING*h; // плашмя только в полёте
    // перетекающий центр тяжести: при наклоне содержимое стекает вниз,
    // наклон растёт — коробка ПОЛЗЁТ со склонов и краёв; на КРУЖКЕ груз
    // дополнительно сползает в сторону склона (качели на макушке невозможны)
    let comTgt = Math.abs(Math.sin(box.a))>0.05 ? Math.sin(box.a)*COM_MAX : 0;
    if(bumpDx!==null && Math.abs(box.vx)<25 && Math.abs(box.vy)<25)
      comTgt += Math.sign(bumpDx||1)*8;
    comTgt = Math.max(-COM_MAX, Math.min(COM_MAX, comTgt));
    box.com += (comTgt - box.com) * Math.min(1, COM_RATE*h);
    // застряли (стоим с контактом >1с) -> груз ползёт ВВЕРХ: коробка
    // становится неустойчивой и ПЕРЕВАЛИВАЕТСЯ из любого клина
    if(lastContacts>0 && Math.hypot(box.vx,box.vy)<12) comStuckT+=h;
    else comStuckT=Math.max(0,comStuckT-3*h);
    const comYT = comStuckT>1.0 ? -COMY_MAX : 0;
    box.comY += (comYT-box.comY)*Math.min(1,2.5*h);
    box.va += (box.com*Math.cos(box.a) - box.comY*Math.sin(box.a)) * GRAV / INERTIA * h;
    if(comStuckT>1.3 && Math.abs(Math.sin(box.a))<0.05) box.va += (box.x>195?-1:1)*1.5*h;
    bumpDx = null;
    // спасение от стойки на торце: почти вертикальную и неподвижную коробку заваливает
    if(Math.abs(Math.sin(box.a))>0.87 && Math.abs(box.va)<0.6){
      const am=((box.a%Math.PI)+Math.PI)%Math.PI;
      box.va += (am>Math.PI/2?1:-1)*6*h;
    }
    box.vx *= Math.exp(-LIN_DAMP*h);
    box.vy *= Math.exp(-LIN_DAMP*h);
    box.va *= Math.exp(-ANG_DAMP*h);
    box.x += box.vx*h; box.y += box.vy*h; box.a += box.va*h;
    lastContacts=0;
    for(let it=0;it<6;it++){
      const cts=collectContacts();
      lastContacts=cts.length;
      if(!cts.length) break;
      for(const ct of cts) solveContact(ct,ct.mu);
    }
  }
  // подбор пушек
  for(const cn of cannons){
    if(cn.st!=='field') continue;
    if(boxCircle(cn.x,cn.y,34)){
      cn.st='fly'; cn.t=0;
      cn.fx=cn.x; cn.fy=cn.y-camY+SH_TOP;   // старт в экранных координатах
      cannonQueue.push(cn);
    }
  }
  // все оставшиеся пушки уже ВЫШЕ коробки (не достать), стрелять нечем,
  // картинка не добита -> партия безнадёжна, завершаем
  if(state==='play' && pixelsLeft>0){
    const pend = cannons.some(c=>c.st==='fly'||c.st==='mounted') || shots.length>0 || cannonQueue.length>0;
    const reachable = cannons.some(c=>c.st==='field' && c.y > box.y - 60);
    if(!pend && !reachable) hopelessT += dt; else hopelessT = 0;
    if(hopelessT > 4){
      state='lose'; loseReason='missed';
      loseTitle.textContent='Cannons Missed!';
      loseText.textContent='The needed cannons are out of reach';
      setTimeout(()=>ovLose.classList.add('show'),500);
    }
  }
  // коробка обездвижена (пол или баланс на полке), пинов под ней нет,
  // стрелять нечем, а картинка не добита -> проигрыш
  const pinContact = pins.some(p=>p.alive && boxCircle(p.x,p.y,PIN_R+6));
  // ползание по кружку (контакт + наклон) — это ДВИЖЕНИЕ, не застревание
  const creeping = Math.abs(Math.sin(box.a))>0.08 && bumpers.some(b=>boxCircle(b.x,b.y,b.r+4));
  if(state==='play' && Math.abs(box.vy)<8 && Math.abs(box.vx)<8 && !pinContact && !creeping){
    floorSettle += dt;
  } else floorSettle = 0;
  if(state==='play' && pixelsLeft>0 && floorSettle > 2.2){
    const pending = cannons.some(c=>c.st==='fly'||c.st==='mounted') || shots.length>0 || cannonQueue.length>0;
    if(!pending){
      state='lose'; loseReason='missed';
      loseTitle.textContent='Box Stuck!';
      loseText.textContent='The box can\'t move on — the picture is not finished';
      setTimeout(()=>ovLose.classList.add('show'),500);
    }
  }
}

/* ================= пушки и выстрелы ================= */
function updateCannons(dt){
  // подлёт пушки к слоту
  for(const cn of cannons){
    if(cn.st!=='fly') continue;
    let si=slots.indexOf(cn);
    if(si<0){
      si=slots.findIndex(s=>s===null);
      if(si<0) continue;             // ждём свободный слот
      slots[si]=cn;
      cannonQueue.splice(cannonQueue.indexOf(cn),1);
    }
    cn.t+=dt;
    if(cn.t>=0.45){ cn.st='mounted'; cn.cool=0.15; }
  }
  // стрельба
  for(let si=0;si<SLOT_DEFS.length;si++){
    const cn=slots[si];
    if(!cn || cn.st!=='mounted') continue;
    cn.cool-=dt;
    while(cn.cool<=0 && cn.left>0){   // при редких кадрах выпускаем несколько за кадр
      const tgt=pickPixel(cn.c);
      if(tgt){
        tgt.px.rsv=true;
        shots.push({x:SLOT_DEFS[si].x+SLOT_DEFS[si].d*26, y:SLOT_DEFS[si].y, tx:PIC_X0+tgt.cix*PIC_PX+PIC_PX/2, ty:PIC_Y0+tgt.rix*PIC_PX+PIC_PX/2, c:cn.c, t:-Math.max(0,-cn.cool), px:tgt.px});
        cn.left--; cn.cool+=0.12;
      } else {
        cn.st='stuck';               // приманка: стрелять не по чему — застряла в слоте
        break;
      }
    }
    if(cn.left===0 && cn.st==='mounted'){ cn.st='spent'; cn.t=0; }
    if(cn.cool<0) cn.cool=0;
  }
  // отработанные пушки освобождают слот; застрявшие — НЕТ
  for(let si=0;si<SLOT_DEFS.length;si++){
    const cn=slots[si];
    if(cn && cn.st==='spent'){
      cn.t+=dt;
      if(cn.t>0.35) slots[si]=null;
    }
  }
  // все 3 слота заняты застрявшими пушками, а картинка не добита -> проигрыш
  if(state==='play' && pixelsLeft>0 && slots.every(s=>s && s.st==='stuck')){
    state='lose'; loseReason='jammed';
    loseTitle.textContent='Cannons Jammed!';
    loseText.textContent='All slots are stuck with useless cannons';
    setTimeout(()=>ovLose.classList.add('show'),500);
  }
  // полёт снарядов
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    s.t+=dt;
    const k=Math.max(0,Math.min(1,s.t/0.22));
    s.cx=s.x+(s.tx-s.x)*k; s.cy=s.y+(s.ty-s.y)*k - Math.sin(k*Math.PI)*24;
    if(k>=1){
      shots.splice(i,1);
      if(s.px.alive){ s.px.alive=false; pixelsLeft--; popPixel(s.tx,s.ty,s.c); }
      if(pixelsLeft===0 && state==='play'){
        state='win'; winConfetti();
        setTimeout(()=>ovWin.classList.add('show'),1000);   // пауза ~1с перед попапом
      }
    }
  }
}
/* нижние пиксели цвета выбиваются первыми (как в Pixel Flow) */
function pickPixel(c){
  for(let r=pixels.length-1;r>=0;r--){
    for(let cix=0;cix<pixels[r].length;cix++){
      const px=pixels[r][cix];
      if(px && px.alive && !px.rsv && px.c===c) return {px, rix:r, cix};
    }
  }
  return null;
}
function popPixel(x,y,c){
  for(let i=0;i<5;i++){
    const a=Math.random()*Math.PI*2, sp=25+Math.random()*55;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-20,life:0.45,t:0,col:COLORS[c].main,r:1.5+Math.random()*2,screen:true});
  }
}
function winConfetti(){
  for(let i=0;i<30;i++){
    const a=-Math.PI/2+(Math.random()-0.5)*2, sp=90+Math.random()*170;
    const cols=['#ffd23f','#ff9838','#3fb9f2','#a26bf0','#7ed44b'];
    particles.push({x:195,y:130,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1.2,t:0,col:cols[i%5],r:3+Math.random()*3,screen:true});
  }
}

/* ================= трей (внизу) ================= */
let trayShake=0;
function reserved(){ return tray.filter(t=>!t.burn).length + flying.length; }
function tapPin(pin){
  if(state!=='play') return false;
  if(reserved() >= TRAY_CAP){ trayShake=12; return false; }
  const d=Math.hypot(pin.x-box.x, pin.y-box.y);
  if(d > ACTIVE_R) return false;
  pin.alive=false;
  flying.push({c:pin.c, x:pin.x, y:pin.y, sx:pin.x, sy:pin.y, t:0});
  return true;
}
function landPin(c){
  let idx=-1;
  for(let i=tray.length-1;i>=0;i--) if(tray[i].c===c){ idx=i; break; }
  const item={c, burn:0, pop:8};
  if(idx>=0) tray.splice(idx+1,0,item); else tray.push(item);
  let run=1;
  for(let i=1;i<=tray.length;i++){
    if(i<tray.length && tray[i].c===tray[i-1].c && !tray[i].burn && !tray[i-1].burn) run++;
    else {
      if(run>=3){
        for(let k=i-run;k<i;k++) tray[k].burn=1;
        sparkleAtSlot(i-run+1);
        break;
      }
      run=1;
    }
  }
  const liveCnt=tray.filter(t=>!t.burn).length;
  if(liveCnt>=TRAY_CAP && state==='play'){
    state='lose'; loseReason='tray';
    loseTitle.textContent='Tray Full!';
    loseText.textContent='No triple — the tray overflowed';
    setTimeout(()=>ovLose.classList.add('show'),450);
  }
}
function sparkleAtSlot(slotIdx){
  const p=slotPos(slotIdx);
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, sp=40+Math.random()*90;
    particles.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,life:0.6,t:0,col:'#ffe98a',r:2+Math.random()*2.5,screen:true});
  }
}

/* ================= рендер ================= */
const phone=document.getElementById('phone');
const cvs=document.getElementById('game');
const ctx=cvs.getContext('2d');
let SCALE=1, VIEW_H=693;
function fitCanvas(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=phone.clientWidth;
  cvs.width=w*dpr; cvs.height=phone.clientHeight*dpr;
  SCALE=w/W * dpr;
  VIEW_H=cvs.height/SCALE;
}
window.addEventListener('resize',fitCanvas);

function slotPos(i){
  const sw=46, x0=W/2-(TRAY_CAP*sw)/2+sw/2;
  return {x:x0+i*sw, y:TRAY_BAR_Y+34};
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawPinHead(x,y,c,dim,r){
  const col=COLORS[c];
  if(dim){
    ctx.fillStyle=col.main; ctx.globalAlpha=0.55;
    ctx.beginPath(); ctx.arc(x,y,r*0.82,0,7); ctx.fill();
    ctx.globalAlpha=1;
    return;
  }
  ctx.strokeStyle='rgba(90,80,140,.55)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x,y+r*0.4); ctx.lineTo(x,y+r+7); ctx.stroke();
  ctx.fillStyle='rgba(60,50,110,.35)';
  ctx.beginPath(); ctx.ellipse(x,y+r+8,6,2.6,0,0,7); ctx.fill();
  const g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.15,x,y,r);
  g.addColorStop(0,col.lite); g.addColorStop(0.55,col.main); g.addColorStop(1,col.dark);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.beginPath(); ctx.ellipse(x-r*0.32,y-r*0.42,r*0.28,r*0.18,-0.6,0,7); ctx.fill();
}
function drawCannon(x,y,c,n,scale,dir){ // dir: 1 пятачок вправо, -1 влево, 0 вверх
  const col=COLORS[c];
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  ctx.fillStyle=col.dark;                                  // пятачок-ствол
  if(dir===1) rr(12,-8,15,16,5);
  else if(dir===-1) rr(-27,-8,15,16,5);
  else rr(-8,-27,16,15,5);
  ctx.fill();
  const g=ctx.createLinearGradient(0,-17,0,17);            // квадратный корпус
  g.addColorStop(0,col.lite); g.addColorStop(0.5,col.main); g.addColorStop(1,col.dark);
  ctx.fillStyle=g; rr(-16,-16,32,32,9); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2; rr(-16,-16,32,32,9); ctx.stroke();
  ctx.fillStyle='rgba(70,45,25,.6)';                       // ноздри пятачка
  ctx.beginPath();
  if(dir===1){ ctx.arc(22,-3.5,1.9,0,7); ctx.arc(22,3.5,1.9,0,7); }
  else if(dir===-1){ ctx.arc(-22,-3.5,1.9,0,7); ctx.arc(-22,3.5,1.9,0,7); }
  else { ctx.arc(-3.5,-22,1.9,0,7); ctx.arc(3.5,-22,1.9,0,7); }
  ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='800 13px -apple-system,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(n,0,1);
  ctx.restore();
}

function draw(){
  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  ctx.clearRect(0,0,W,VIEW_H);
  ctx.fillStyle='#b7aee9'; ctx.fillRect(0,0,W,VIEW_H);

  /* ---- верх: картинка из пикселей ---- */
  ctx.fillStyle='rgba(255,255,255,.35)';
  rr(PIC_X0-10,PIC_Y0-10,PIC_MASK[0].length*PIC_PX+20,PIC_MASK.length*PIC_PX+20,12); ctx.fill();
  for(let r=0;r<pixels.length;r++){
    for(let cix=0;cix<pixels[r].length;cix++){
      const px=pixels[r][cix];
      if(!px) continue;
      const x=PIC_X0+cix*PIC_PX, y=PIC_Y0+r*PIC_PX;
      if(px.alive){
        const col=COLORS[px.c];
        ctx.fillStyle=col.main;
        rr(x+1,y+1,PIC_PX-2,PIC_PX-2,3); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.28)';
        rr(x+1,y+1,PIC_PX-2,(PIC_PX-2)*0.42,3); ctx.fill();
      } else {
        ctx.fillStyle='rgba(120,105,190,.16)';
        rr(x+2.5,y+2.5,PIC_PX-5,PIC_PX-5,3); ctx.fill();
      }
    }
  }
  // счётчик пикселей — в верхней строке, чтобы не налезал на слоты
  ctx.fillStyle='rgba(74,63,143,.9)'; ctx.font='800 15px -apple-system,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(pixelsLeft+' px', W/2, 23);

  /* ---- слоты пушек по бокам картинки ---- */
  for(let i=0;i<SLOT_DEFS.length;i++){
    const S=SLOT_DEFS[i];
    ctx.fillStyle='rgba(74,63,143,.35)';
    rr(S.x-24,S.y-22,48,44,10); ctx.fill();
    ctx.strokeStyle='rgba(74,63,143,.5)'; ctx.lineWidth=2; ctx.setLineDash([4,4]);
    rr(S.x-24,S.y-22,48,44,10); ctx.stroke(); ctx.setLineDash([]);
    const cn=slots[i];
    if(cn && (cn.st==='mounted'||cn.st==='spent'||cn.st==='stuck')){
      const sc=cn.st==='spent'?Math.max(0,1-cn.t/0.35):1;
      drawCannon(S.x,S.y,cn.c,cn.left,sc,S.d);
      if(cn.st==='stuck'){   // застрявшая приманка: серая вуаль + крест
        ctx.fillStyle='rgba(90,90,110,.45)';
        rr(S.x-16,S.y-16,32,32,9); ctx.fill();
        ctx.strokeStyle='#e04848'; ctx.lineWidth=3; ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(S.x-8,S.y-8); ctx.lineTo(S.x+8,S.y+8);
        ctx.moveTo(S.x+8,S.y-8); ctx.lineTo(S.x-8,S.y+8);
        ctx.stroke();
      }
    }
  }
  // летящие к слоту пушки
  for(const cn of cannons){
    if(cn.st!=='fly') continue;
    const si=slots.indexOf(cn);
    const k=si<0?0:Math.min(1,cn.t/0.45), e=1-Math.pow(1-k,3);
    const tx=si<0?cn.fx:SLOT_DEFS[si].x, ty=si<0?cn.fy:SLOT_DEFS[si].y;
    const mx=(cn.fx+tx)/2+30, my=Math.min(cn.fy,ty)-60;
    const x=(1-e)*(1-e)*cn.fx+2*(1-e)*e*mx+e*e*tx;
    const y=(1-e)*(1-e)*cn.fy+2*(1-e)*e*my+e*e*ty;
    drawCannon(x,y,cn.c,cn.left,1,0);
  }
  // снаряды
  for(const s of shots){
    ctx.fillStyle=COLORS[s.c].main;
    ctx.beginPath(); ctx.arc(s.cx??s.x,s.cy??s.y,4.5,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.beginPath(); ctx.arc((s.cx??s.x)-1.2,(s.cy??s.y)-1.2,1.6,0,7); ctx.fill();
  }

  /* ---- окно шахты ---- */
  ctx.save();
  ctx.beginPath(); ctx.rect(0,SH_TOP,W,SH_H); ctx.clip();
  ctx.translate(0,SH_TOP-camY);

  const shaft=ctx.createLinearGradient(0,camY,0,camY+SH_H);
  shaft.addColorStop(0,'#d6cff7'); shaft.addColorStop(1,'#cfc7f4');
  ctx.fillStyle=shaft;
  ctx.fillRect(WALL_L,camY-10,WALL_R-WALL_L,SH_H+20);

  // пол-шашечки
  const sq=(WALL_R-WALL_L)/8;
  for(let r=0;r<2;r++)for(let i=0;i<8;i++){
    ctx.fillStyle=(i+r)%2?'#ffffff':'#2e2a45';
    ctx.fillRect(WALL_L+i*sq,FLOOR_Y+r*sq,sq,sq);
  }
  ctx.fillStyle='#b7aee9';
  ctx.fillRect(0,camY-10,WALL_L,SH_H+20);
  ctx.fillRect(WALL_R,camY-10,W-WALL_R,SH_H+20);
  ctx.strokeStyle='rgba(120,105,190,.35)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(WALL_L,camY-10); ctx.lineTo(WALL_L,camY+SH_H+10);
  ctx.moveTo(WALL_R,camY-10); ctx.lineTo(WALL_R,camY+SH_H+10); ctx.stroke();

  // круглые бамперы (пинбол)
  for(const b of bumpers){
    if(b.hit>0) b.hit=Math.max(0,b.hit-0.06);
    const rr2=b.r*(1+b.hit*0.18);
    ctx.fillStyle='rgba(120,105,190,.25)';
    ctx.beginPath(); ctx.arc(b.x,b.y+3,rr2,0,7); ctx.fill();
    const g=ctx.createRadialGradient(b.x-rr2*0.3,b.y-rr2*0.35,rr2*0.2,b.x,b.y,rr2);
    g.addColorStop(0,'#efeaff'); g.addColorStop(0.7,'#c9c0f2'); g.addColorStop(1,'#a89bde');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(b.x,b.y,rr2,0,7); ctx.fill();
    ctx.strokeStyle=b.hit>0?'#fff':'rgba(255,255,255,.75)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(b.x,b.y,rr2-3,0,7); ctx.stroke();
    ctx.fillStyle='rgba(120,105,190,.55)';
    ctx.beginPath(); ctx.arc(b.x,b.y,rr2*0.28,0,7); ctx.fill();
  }

  // круг активности
  ctx.save();
  ctx.beginPath(); ctx.arc(box.x,box.y,ACTIVE_R,0,7);
  ctx.fillStyle='rgba(255,255,255,.16)'; ctx.fill();
  ctx.setLineDash([7,8]); ctx.lineDashOffset=-tick*0.35;
  ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.restore();

  // пушки на поле
  for(const cn of cannons){
    if(cn.st!=='field') continue;
    // постамент-подсветка
    ctx.fillStyle='rgba(255,255,255,.3)';
    ctx.beginPath(); ctx.arc(cn.x,cn.y+2,24,0,7); ctx.fill();
    drawCannon(cn.x,cn.y,cn.c,cn.n,1,0);
  }

  // пины
  for(const p of pins){
    if(!p.alive) continue;
    const dim=Math.hypot(p.x-box.x,p.y-box.y) > ACTIVE_R;
    drawPinHead(p.x,p.y,p.c,dim,PIN_R);
  }

  // коробка
  ctx.save();
  ctx.translate(box.x,box.y); ctx.rotate(box.a);
  ctx.fillStyle='rgba(60,45,110,.25)';
  rr(-BOX_W/2+4,-BOX_H/2+7,BOX_W,BOX_H,10); ctx.fill();
  const bg=ctx.createLinearGradient(0,-BOX_H/2,0,BOX_H/2);
  bg.addColorStop(0,'#e8ab6b'); bg.addColorStop(1,'#cf8a45');
  ctx.fillStyle=bg;
  rr(-BOX_W/2,-BOX_H/2,BOX_W,BOX_H,10); ctx.fill();
  ctx.strokeStyle='rgba(140,85,30,.5)'; ctx.lineWidth=2;
  rr(-BOX_W/2,-BOX_H/2,BOX_W,BOX_H,10); ctx.stroke();
  ctx.fillStyle='rgba(255,244,214,.85)';
  ctx.fillRect(-BOX_W/2,-6,BOX_W,12);
  ctx.fillStyle='#fffdf6'; rr(6,-24,34,22,4); ctx.fill();
  ctx.fillStyle='#4a4a58';
  for(let i=0;i<7;i++) ctx.fillRect(10+i*4.2,-20,(i%3===0?2.4:1.3),14);
  ctx.restore();

  ctx.restore(); // конец окна шахты

  // рамки-разделители окна шахты
  ctx.strokeStyle='rgba(74,63,143,.4)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,SH_TOP); ctx.lineTo(W,SH_TOP);
  ctx.moveTo(0,SH_TOP+SH_H); ctx.lineTo(W,SH_TOP+SH_H); ctx.stroke();

  // летящие в трей пины (экранные координаты)
  for(const f of flying) drawPinHead(f.x,f.y,f.c,false,PIN_R);
  // частицы (все экранные)
  for(const pt of particles){
    ctx.globalAlpha=Math.max(0,1-pt.t/pt.life);
    ctx.fillStyle=pt.col;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,7); ctx.fill();
    ctx.globalAlpha=1;
  }

  drawTray();

  // бейдж и рестарт
  ctx.fillStyle='rgba(74,63,143,.92)';
  rr(14,10,86,26,13); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='700 14px -apple-system,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Level 1',57,24);
  ctx.fillStyle='rgba(74,63,143,.92)';
  ctx.beginPath(); ctx.arc(358,23,15,0,7); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.arc(358,23,7,0.6,5.4); ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(363.5,17); ctx.lineTo(368,21.5); ctx.lineTo(361,22.5); ctx.closePath(); ctx.fill();
}

function drawTray(){
  const shx=trayShake>0 ? Math.sin(tick*1.4)*Math.min(5,trayShake) : 0;
  ctx.save();
  ctx.translate(shx,0);
  ctx.fillStyle='rgba(74,63,143,.92)';
  rr(14,TRAY_BAR_Y,W-28,68,20); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2;
  rr(14,TRAY_BAR_Y,W-28,68,20); ctx.stroke();
  for(let i=0;i<TRAY_CAP;i++){
    const p=slotPos(i);
    ctx.fillStyle='rgba(30,22,70,.55)';
    ctx.beginPath(); ctx.arc(p.x,p.y,17,0,7); ctx.fill();
  }
  let vi=0;
  for(const t of tray){
    const p=slotPos(vi);
    let r=13.5;
    if(t.burn) r*=Math.max(0,1-t.burn/8);
    if(t.pop>0) r*=1+t.pop*0.03;
    if(r>0.5){
      const col=COLORS[t.c];
      const g=ctx.createRadialGradient(p.x-r*0.35,p.y-r*0.4,r*0.15,p.x,p.y,r);
      g.addColorStop(0,col.lite); g.addColorStop(0.55,col.main); g.addColorStop(1,col.dark);
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fill();
    }
    vi++;
  }
  ctx.restore();
}

/* ================= цикл =================
   Вся логика — в tickGame(dt): её зовёт и rAF, и G.step()
   (синхронный прогон для тестов/слабого rAF в headless) */
let lastT=0;
function loop(ts){
  const dt=Math.min(0.05,(ts-lastT)/1000||0.016); lastT=ts;
  tickGame(dt);
  draw();
  requestAnimationFrame(loop);
}
function tickGame(dt){
  tick++;

  if(state==='play'||state==='win') updateCannons(dt);
  if(state==='play') physStep(dt);

  const targetCam=Math.max(0,Math.min(WORLD_H-SH_H, box.y-SH_H*0.45));
  camY += (targetCam-camY)*0.08;

  for(let i=flying.length-1;i>=0;i--){
    const f=flying[i];
    f.t+=dt;
    const idx=Math.min(TRAY_CAP-1, tray.filter(t=>!t.burn).length + i);
    const tp=slotPos(idx);
    const sx=f.sx, sy=f.sy-camY+SH_TOP;
    const k=Math.min(1,f.t/0.38);
    const e=1-Math.pow(1-k,3);
    const mx=(sx+tp.x)/2-40, my=(sy+tp.y)/2;
    f.x=(1-e)*(1-e)*sx+2*(1-e)*e*mx+e*e*tp.x;
    f.y=(1-e)*(1-e)*sy+2*(1-e)*e*my+e*e*tp.y;
    if(k>=1){ flying.splice(i,1); landPin(f.c); }
  }

  for(const t of tray){ if(t.burn) t.burn++; if(t.pop>0) t.pop--; }
  for(let i=tray.length-1;i>=0;i--) if(tray[i].burn>8) tray.splice(i,1);

  for(let i=particles.length-1;i>=0;i--){
    const pt=particles[i];
    pt.t+=dt; pt.vy+=250*dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt;
    if(pt.t>pt.life) particles.splice(i,1);
  }
  if(trayShake>0)trayShake--;
}

/* ================= ввод ================= */
cvs.addEventListener('pointerdown',e=>{
  const rect=cvs.getBoundingClientRect();
  const sx=(e.clientX-rect.left)*(W/rect.width);
  const sy=(e.clientY-rect.top)*(W/rect.width);
  handleTap(sx,sy);
});
function handleTap(sx,sy){
  if(Math.hypot(sx-358,sy-23)<20){ reset(); return; }
  if(state!=='play') return;
  if(sy<SH_TOP || sy>SH_TOP+SH_H) return;
  const wx=sx, wy=sy-SH_TOP+camY;
  let best=null, bd=1e9;
  for(const p of pins){
    if(!p.alive) continue;
    const d=Math.hypot(p.x-wx,p.y-wy);
    if(d<30 && d<bd){ bd=d; best=p; }
  }
  if(best) tapPin(best);
}

/* ================= API для тестов ================= */
window.G={
  restart:()=>reset(),
  state:()=>({mode:state, boxY:Math.round(box.y), boxX:Math.round(box.x), a:+box.a.toFixed(2),
              vy:Math.round(box.vy), vx:Math.round(box.vx),
              tray:tray.filter(t=>!t.burn).map(t=>t.c).join(''), flying:flying.length,
              alive:pins.filter(p=>p.alive).length, camY:Math.round(camY),
              pixelsLeft, shots:shots.length, lose:loseReason,
              cannonsField:cannons.filter(c=>c.st==='field').length}),
  pins:()=>pins.filter(p=>p.alive).map(p=>({id:p.id,x:p.x,y:p.y,c:p.c,
              inCircle:Math.hypot(p.x-box.x,p.y-box.y)<=ACTIVE_R})),
  cannons:()=>cannons.map(c=>({id:c.id,x:c.x,y:c.y,c:c.c,n:c.n,st:c.st,left:c.left})),
  pixC:()=>{ const m={Y:0,O:0,B:0,P:0};
    pixels.forEach(r=>r.forEach(p=>{ if(p&&p.alive&&!p.rsv) m[p.c]++; })); return m; },
  tapId:(id)=>{ const p=pins.find(q=>q.id===id); return p&&p.alive ? tapPin(p) : false; },
  flyColors:()=>flying.map(f=>f.c),
  snap:()=>({ s:window.G.state(), pins:window.G.pins(), cn:window.G.cannons(),
              fly:flying.map(f=>f.c), pc:window.G.pixC() }),
  step:(secs)=>{ const n=Math.round(secs*60); for(let i=0;i<n;i++) tickGame(1/60); draw(); },
};

reset();
fitCanvas();
requestAnimationFrame(loop);
</script>
