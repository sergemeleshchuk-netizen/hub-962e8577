<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sand Blocks Liquid — proto v3</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:linear-gradient(180deg,#cbdbfc 0%,#b3c9f7 55%,#9fbaf3 100%);}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }

  #hud{width:100%;padding:10px 12px;z-index:3;display:flex;align-items:center;gap:8px;}
  .pill{background:#fff;color:#2b4a8f;border-radius:16px;padding:7px 14px;font-weight:800;
        font-size:15px;box-shadow:0 3px 8px rgba(43,74,143,.22);}
  #timer{font-variant-numeric:tabular-nums;font-size:18px;min-width:86px;text-align:center;}
  .ibtn{width:38px;height:38px;border-radius:50%;background:#fff;color:#4b7bd8;border:0;
        font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;
        cursor:pointer;box-shadow:0 3px 8px rgba(43,74,143,.22);}
  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  .ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:14px;background:rgba(214,228,255,.88);backdrop-filter:blur(3px);}
  .ov h1{color:#274a94;font-size:34px;margin:0;text-shadow:0 2px 0 #fff;}
  .ov .sub{color:#4a63a0;font-size:15px;margin:0 28px;text-align:center;line-height:1.45;}
  .btn{background:linear-gradient(180deg,#ffd54d,#f4a825);border:0;border-radius:18px;padding:14px 34px;
       font-size:19px;font-weight:900;color:#5b3a00;cursor:pointer;box-shadow:0 5px 0 #b97b12;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b97b12;}
  .btn.sec{background:linear-gradient(180deg,#6fa2f2,#4b7bd8);color:#fff;box-shadow:0 5px 0 #2d55a8;}
  #lvls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:300px;}
  .lv{width:52px;height:52px;border-radius:14px;font-size:20px;font-weight:900;border:0;cursor:pointer;
      background:linear-gradient(180deg,#6fa2f2,#4b7bd8);color:#fff;box-shadow:0 4px 0 #2d55a8;}
  .lv.lock{background:#c3d2f0;color:#8fa4cf;box-shadow:0 4px 0 #9db1da;cursor:default;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="phone">
  <div id="hud">
    <button class="ibtn" id="btnHome">⌂</button>
    <div style="flex:1"></div>
    <div class="pill" id="timer">0:00</div>
    <div style="flex:1"></div>
    <div class="pill" id="lvlLab">Level 1</div>
    <button class="ibtn" id="btnRetry">⟳</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>

  <div class="ov" id="home">
    <h1>WATER BLOCKS</h1>
    <p class="sub">В баке жидкости лежат слоями. Подвинь контейнер вплотную к баку —<br>нижний слой <b>его цвета</b> стечёт в него. Полный контейнер исчезает.<br>Осуши весь бак до конца таймера!</p>
    <div id="lvls"></div>
  </div>
  <div class="ov hidden" id="win">
    <h1>LEVEL DONE!</h1>
    <button class="btn" id="btnNext">Next level</button>
    <button class="btn sec" id="btnWinHome">Home</button>
  </div>
  <div class="ov hidden" id="lose">
    <h1>TIME'S UP</h1>
    <button class="btn" id="btnRetryOv">Retry</button>
    <button class="btn sec" id="btnLoseHome">Home</button>
  </div>
</div>

<script>
/* ================= Water Blocks proto v3 =================
   Бак-«сцена» сверху: жидкости лежат СЛОЯМИ (как песок в v1).
   Нижний слой стекает в пристыкованные контейнеры своего цвета
   (по колонкам), контейнер наполняется и исчезает, слой выше
   опускается. Лоток-клоцки и реверс-экономика — как в v1/v2.
   ========================================================= */
/*CORE-BEGIN*/
const BC=6, BR=7, CELL=56;           // лоток 6x7
const LW=396, LH=672;                // логическая сцена
const BX=30, BY=264;                 // лоток x,y
const TX=BX, TW=BC*CELL;             // бак: во всю ширину лотка
const TTOP=14, TBOT=238;             // бак: верх/низ жидкости (стекло)
const RATE=0.55;                     // налив на ОДНУ открытую колонку, клеток/с

const PAL=[
  {n:'yellow', a:'#f7c843', b:'#d9a318', f:'#ffe27a'},
  {n:'purple', a:'#9257e0', b:'#6f3cba', f:'#b58af0'},
  {n:'green',  a:'#4fc85e', b:'#37a447', f:'#7fe08a'},
  {n:'red',    a:'#ef5350', b:'#c93a38', f:'#ff8683'},
  {n:'blue',   a:'#4b8ff0', b:'#3671cc', f:'#7fb3ff'},
];
const SH={
  S1:[[0,0]], H2:[[0,0],[1,0]], V2:[[0,0],[0,1]],
  H3:[[0,0],[1,0],[2,0]], L3:[[0,0],[0,1],[1,1]],
  O4:[[0,0],[1,0],[0,1],[1,1]], T4:[[0,0],[1,0],[2,0],[1,1]],
};
// уровень: c=[цвет,форма,x,y]; layers СНИЗУ ВВЕРХ [цвет,объём в клетках]
const LEVELS=[
 {t:45, c:[[1,'O4',2,1],[0,'O4',0,4],[0,'H3',3,5]],
  layers:[[1,4],[0,7]]},
 {t:55, c:[[0,'O4',0,2],[1,'H3',2,4],[2,'L3',4,1],[0,'H2',1,6]],
  layers:[[2,1.5],[0,3],[1,3],[0,3],[2,1.5]]},
 {t:70, c:[[4,'T4',1,1],[3,'O4',4,2],[3,'V2',3,3],[2,'L3',0,4],[4,'H2',2,5],[2,'V2',5,5]],
  layers:[[3,2],[4,3],[2,2.5],[3,2],[4,3],[2,2.5],[3,2]]},
 {t:95, c:[[0,'O4',0,1],[4,'T4',2,2],[1,'O4',4,4],[2,'L3',0,4],[2,'S1',5,1],[0,'H3',1,6],[4,'H2',2,4]],
  layers:[[4,2],[0,2.5],[1,2],[2,2],[4,2],[0,2.5],[1,2],[2,2],[4,2],[0,2]]},
 {t:120, c:[[0,'O4',0,1],[1,'O4',2,1],[0,'H2',4,1],[4,'H2',4,2],[3,'V2',0,3],[1,'V2',5,3],
            [3,'S1',1,4],[4,'T4',2,4],[2,'S1',0,6],[2,'S1',5,6]],
  layers:[[3,1],[0,1.5],[1,1.5],[4,2],[2,1],[0,1.5],[3,1],[1,1.5],[4,2],[0,1.5],[1,1.5],[4,2],[3,1],[0,1.5],[1,1.5],[2,1]]},
];

let layers, conts, tick=0, timeLeft=0, level=0, playing=false;
let winFlag=false, loseFlag=false, winAt=0, clearedAll=false;
let ffMult=1, botOn=false, botCd=0, botHist=[];
let pourCols=[];                     // колонки, куда сейчас льётся (для рендера)

function mkCont(col,shape,x,y,id){
  const cells=SH[shape].map(c=>c.slice());
  return {id,col,cells,x,y,cap:cells.length,fill:0,
          state:'idle',popT:0,lastGain:-9};
}
function occMap(skip){
  const m=new Array(BC*BR).fill(0);
  for(const c of conts){ if(c.state!=='idle'||c===skip) continue;
    for(const[dx,dy]of c.cells) m[(c.y+dy)*BC+(c.x+dx)]=1; }
  return m;
}
function canPlace(c,nx,ny,m){
  for(const[dx,dy]of c.cells){ const x=nx+dx,y=ny+dy;
    if(x<0||x>=BC||y<0||y>=BR) return false; if(m[y*BC+x]) return false; }
  return true;
}
function buildLevel(n){
  const L=LEVELS[n];
  conts=L.c.map((d,i)=>mkCont(d[0],d[1],d[2],d[3],i));
  layers=L.layers.map(l=>({c:l[0],vol:l[1]}));
  tick=0; timeLeft=L.t; winFlag=loseFlag=false; winAt=0; clearedAll=false;
  botHist=[]; pourCols=[];
  // реверс-экономика: объём цвета в слоях = ёмкость его контейнеров
  const q=new Array(PAL.length).fill(0);
  for(const c of conts) q[c.col]+=c.cap;
  for(const l of layers) q[l.c]-=l.vol;
  console.assert(q.every(v=>Math.abs(v)<1e-6),'economy mismatch L'+(n+1),q);
}
function receiver(col){ // приёмник колонки: самая верхняя клетка пристыкованного
  let best=null;
  for(const c of conts){ if(c.state!=='idle'||c.y!==0) continue;
    for(const[dx,dy]of c.cells){ if(c.x+dx!==col) continue;
      if(!best||dy<best.row) best={c,row:dy}; }
  }
  return best&&best.c;
}
function pour(dt){
  pourCols=[];
  if(!layers.length) return;
  const L0=layers[0];
  for(let col=0;col<BC&&layers.length;col++){
    const c=receiver(col);
    if(!c||c.col!==L0.c||c.fill>=c.cap) continue;
    const amt=Math.min(RATE*dt, L0.vol, c.cap-c.fill);
    if(amt<=0) continue;
    c.fill+=amt; L0.vol-=amt; c.lastGain=tick/60;
    pourCols.push({col,c});
    if(c.fill>=c.cap-1e-6&&c.state==='idle'){ c.fill=c.cap; c.state='clear'; c.popT=0; }
    if(L0.vol<=1e-4){ layers.shift(); break; }
  }
}
function fillH(c){
  const maxdy=Math.max(...c.cells.map(k=>k[1]));
  return (c.fill/c.cap)*(maxdy+1)*CELL;
}
function step(dt){
  tick++;
  pour(dt);
  for(const c of conts){ if(c.state==='clear'){ c.popT+=dt; if(c.popT>.45) c.state='gone'; } }
  if(!winFlag&&!loseFlag){
    timeLeft-=dt;
    if(conts.every(c=>c.state==='gone')&&!clearedAll){ clearedAll=true; winAt=tick/60+1; }
    if(clearedAll&&tick/60>=winAt){ winFlag=true; playing=false; showWin(); }
    else if(timeLeft<=0){ timeLeft=0; loseFlag=true; playing=false; showLose(); }
  }
}
/*CORE-END*/

/* ================= рендер ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let scale=1, offX=0, offY=0;
function fit(){
  const st=document.getElementById('stage');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=st.clientWidth*dpr; cv.height=st.clientHeight*dpr;
  scale=Math.min(st.clientWidth/LW, st.clientHeight/LH);
  offX=(st.clientWidth-LW*scale)/2; offY=(st.clientHeight-LH*scale)/2;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
}
window.addEventListener('resize',fit);

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
const colX=col=>BX+(col+.5)*CELL;

// пузырьки: фоновые и в баке
const bgBub=[], tkBub=[];
for(let i=0;i<12;i++) bgBub.push({x:Math.random()*LW,y:Math.random()*LH,
  r:3+Math.random()*6,s:6+Math.random()*10});
for(let i=0;i<10;i++) tkBub.push({x:TX+8+Math.random()*(TW-16),y:TBOT-Math.random()*100,
  r:1.5+Math.random()*3,s:8+Math.random()*14});

function pxPerVol(){ // высота 1 клетки объёма: бак заполнен «сценой» красиво
  const tot=LEVELS[level].layers.reduce((a,l)=>a+l[1],0);
  return Math.max(8.5, Math.min(24, (TBOT-TTOP-24)/tot));
}
function draw(){
  const t=tick/60;
  ctx.clearRect(-offX/scale,-offY/scale,LW+2*offX/scale,LH+2*offY/scale);
  // фоновые пузырьки
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5;
  for(const b of bgBub){
    b.y-=b.s/60; if(b.y<-10){b.y=LH+10;b.x=Math.random()*LW;}
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.stroke();
  }
  drawTank(t);
  // --- панель лотка ---
  rr(BX-12,BY-12,BC*CELL+24,BR*CELL+24,20);
  ctx.fillStyle='#41498f'; ctx.fill();
  ctx.strokeStyle='#2e3570'; ctx.lineWidth=3; ctx.stroke();
  for(let y=0;y<BR;y++)for(let x=0;x<BC;x++){
    rr(BX+x*CELL+3,BY+y*CELL+3,CELL-6,CELL-6,9);
    ctx.fillStyle='#4a53a2'; ctx.fill();
  }
  // --- струи (за контейнерами) ---
  for(const pc of pourCols){
    const c=pc.c; if(c.state==='gone') continue;
    const maxdy=Math.max(...c.cells.map(k=>k[1]));
    const surf=BY+(c.y+maxdy+1)*CELL-4-fillH(c);
    const x=colX(pc.col), col=PAL[c.col];
    ctx.fillStyle=col.a; ctx.globalAlpha=.92;
    rr(x-9,TBOT,18,surf-TBOT,9); ctx.fill();
    ctx.fillStyle=col.f; ctx.globalAlpha=.7;
    rr(x-3,TBOT,5,surf-TBOT,3); ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=col.f;
    ctx.beginPath(); ctx.ellipse(x,surf,15,4.5,0,0,7); ctx.fill();
  }
  // --- контейнеры ---
  for(const c of conts){
    if(c.state==='gone') continue;
    ctx.save();
    const maxdx=Math.max(...c.cells.map(k=>k[0])),maxdy=Math.max(...c.cells.map(k=>k[1]));
    const px=BX+c.x*CELL, py=BY+c.y*CELL;
    if(c.state==='clear'){ const f=c.popT/.45;
      ctx.globalAlpha=1-f;
      const cx=px+(maxdx+1)*CELL/2, cy=py+(maxdy+1)*CELL/2;
      ctx.translate(cx,cy); ctx.scale(1+f*.25,1+f*.25); ctx.translate(-cx,-cy);
    }
    const ga=ctx.globalAlpha;
    const fh=fillH(c), bot=py+(maxdy+1)*CELL;
    for(const[dx,dy]of c.cells){
      const x=px+dx*CELL, y=py+dy*CELL;
      ctx.fillStyle='#38407e'; ctx.globalAlpha=ga*.55; ctx.fillRect(x+4,y+4,CELL-8,CELL-8);
      ctx.fillStyle=PAL[c.col].a; ctx.globalAlpha=ga*.16; ctx.fillRect(x+4,y+4,CELL-8,CELL-8);
      ctx.globalAlpha=ga;
      const top=Math.max(y+5, bot-5-fh), bh=(y+CELL-5)-top;
      if(bh>0){
        ctx.fillStyle=PAL[c.col].a; ctx.globalAlpha=ga*.95;
        ctx.beginPath();
        const w1=Math.sin(t*4+x*.15)*2, w2=Math.sin(t*4+x*.15+2.4)*2;
        ctx.moveTo(x+5,top+w1); ctx.lineTo(x+CELL-5,top+w2);
        ctx.lineTo(x+CELL-5,y+CELL-5); ctx.lineTo(x+5,y+CELL-5); ctx.closePath(); ctx.fill();
        ctx.strokeStyle=PAL[c.col].f; ctx.lineWidth=2.5; ctx.globalAlpha=ga*.9;
        ctx.beginPath(); ctx.moveTo(x+5,top+w1); ctx.lineTo(x+CELL-5,top+w2); ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.22)';
        ctx.fillRect(x+8,Math.max(top+3,y+8),6,Math.max(0,bh-8));
        ctx.globalAlpha=ga;
      }
    }
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.lineWidth=9; ctx.strokeStyle=PAL[c.col].b; strokeShape(c,px,py);
    ctx.lineWidth=5.5; ctx.strokeStyle=PAL[c.col].a; strokeShape(c,px,py);
    ctx.lineWidth=1.8; ctx.strokeStyle='rgba(255,255,255,.5)'; strokeShape(c,px,py,4);
    const pct=Math.floor(100*c.fill/c.cap+1e-6);
    const bx=px+(maxdx+1)*CELL-30, by=bot-16;
    rr(bx-16,by-9,44,18,9); ctx.fillStyle='#fff'; ctx.fill();
    ctx.fillStyle='#2b4a8f'; ctx.font='800 11px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(pct+'%',bx+6,by+1);
    ctx.restore();
  }
  drawConfetti();
}
function drawTank(t){
  const PXV=pxPerVol();
  // стеклянный корпус
  rr(TX-10,TTOP-10,TW+20,TBOT-TTOP+26,18);
  ctx.fillStyle='rgba(255,255,255,.30)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=3; ctx.stroke();
  rr(TX-3,TTOP-3,TW+6,TBOT-TTOP+10,10);
  ctx.fillStyle='rgba(226,238,255,.45)'; ctx.fill();
  // слои жидкости снизу вверх, волнистые границы
  ctx.save();
  rr(TX-3,TTOP-3,TW+6,TBOT-TTOP+6,10); ctx.clip();
  let yB=TBOT;
  const dipC=pourCols.map(pc=>colX(pc.col));
  for(let i=0;i<layers.length;i++){
    const l=layers[i], h=l.vol*PXV, yT=yB-h, col=PAL[l.c];
    ctx.fillStyle=col.a;
    ctx.beginPath();
    ctx.moveTo(TX-3,yB+2);
    for(let x=TX-3;x<=TX+TW+3;x+=8){
      let w=Math.sin(t*2.2+x*.045+i*1.7)*2.2;
      if(i===0) for(const dc of dipC){ const d=Math.abs(x-dc);
        if(d<30) w+=(1-d/30)*6; }               // воронка над сливом
      ctx.lineTo(x,yT+w);
    }
    ctx.lineTo(TX+TW+3,yB+2); ctx.closePath(); ctx.fill();
    // светлая кромка слоя
    ctx.strokeStyle=col.f; ctx.lineWidth=2; ctx.globalAlpha=.85;
    ctx.beginPath();
    for(let x=TX-3;x<=TX+TW+3;x+=8){
      let w=Math.sin(t*2.2+x*.045+i*1.7)*2.2;
      if(i===0) for(const dc of dipC){ const d=Math.abs(x-dc);
        if(d<30) w+=(1-d/30)*6; }
      x===TX-3?ctx.moveTo(x,yT+w):ctx.lineTo(x,yT+w);
    }
    ctx.stroke(); ctx.globalAlpha=1;
    yB=yT;
  }
  // пузырьки в жидкости
  if(layers.length){
    ctx.fillStyle='rgba(255,255,255,.45)';
    for(const b of tkBub){
      b.y-=b.s/60;
      if(b.y<yB+6){ b.y=TBOT-4; b.x=TX+8+Math.random()*(TW-16); }
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
    }
  }
  ctx.restore();
  // дно-решётка + капля-подсказка текущего цвета
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.fillRect(TX-3,TBOT+4,TW+6,3);
  if(layers.length&&!pourCols.length){
    const col=PAL[layers[0].c];
    const x=TX+TW/2, pul=1+Math.sin(t*5)*.12;
    ctx.fillStyle=col.a; ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x-9*pul,TBOT+8); ctx.lineTo(x+9*pul,TBOT+8); ctx.lineTo(x,TBOT+8+13*pul);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function strokeShape(c,px,py,inset=0){
  ctx.beginPath();
  for(const[dx,dy]of c.cells){
    const has=(ax,ay)=>c.cells.some(k=>k[0]===ax&&k[1]===ay);
    const x=px+dx*CELL,y=py+dy*CELL,i=inset;
    if(!has(dx,dy-1)){ctx.moveTo(x+2+i,y+2+i);ctx.lineTo(x+CELL-2-i,y+2+i);}
    if(!has(dx,dy+1)){ctx.moveTo(x+2+i,y+CELL-2-i);ctx.lineTo(x+CELL-2-i,y+CELL-2-i);}
    if(!has(dx-1,dy)){ctx.moveTo(x+2+i,y+2+i);ctx.lineTo(x+2+i,y+CELL-2-i);}
    if(!has(dx+1,dy)){ctx.moveTo(x+CELL-2-i,y+2+i);ctx.lineTo(x+CELL-2-i,y+CELL-2-i);}
  }
  ctx.stroke();
}

/* ================= конфетти (умеренно) ================= */
let confetti=[];
function popConfetti(){ confetti=[];
  for(let i=0;i<60;i++) confetti.push({x:LW/2,y:LH*.4,vx:(Math.random()-.5)*420,
    vy:-Math.random()*420-80,c:PAL[(Math.random()*PAL.length)|0].a,r:3+Math.random()*4,l:1.6});
}
function drawConfetti(){ if(!confetti.length) return;
  for(let i=confetti.length-1;i>=0;i--){ const p=confetti[i];
    p.vy+=800/60; p.x+=p.vx/60; p.y+=p.vy/60; p.l-=1/60;
    if(p.l<=0){confetti.splice(i,1);continue;}
    ctx.globalAlpha=Math.min(1,p.l); ctx.fillStyle=p.c;
    ctx.fillRect(p.x,p.y,p.r,p.r); ctx.globalAlpha=1; }
}

/* ================= управление (драг) ================= */
let grab=null;
function toLocal(e){ const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left-offX)/scale, y:(e.clientY-r.top-offY)/scale}; }
function contAt(p){
  const cx=Math.floor((p.x-BX)/CELL), cy=Math.floor((p.y-BY)/CELL);
  for(const c of conts){ if(c.state!=='idle') continue;
    for(const[dx,dy]of c.cells) if(c.x+dx===cx&&c.y+dy===cy) return c; }
  return null;
}
cv.addEventListener('pointerdown',e=>{ if(!playing) return;
  const p=toLocal(e), c=contAt(p); if(!c) return;
  grab={c, ox:p.x-(BX+c.x*CELL), oy:p.y-(BY+c.y*CELL)};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{ if(!grab||!playing) return;
  const p=toLocal(e);
  const txc=Math.round((p.x-grab.ox-BX)/CELL), tyc=Math.round((p.y-grab.oy-BY)/CELL);
  moveToward(grab.c,txc,tyc);
});
cv.addEventListener('pointerup',()=>{grab=null;});
cv.addEventListener('pointercancel',()=>{grab=null;});
function moveToward(c,txc,tyc){
  const m=occMap(c);
  for(let s=0;s<12;s++){
    const dx=Math.sign(txc-c.x), dy=Math.sign(tyc-c.y);
    if(!dx&&!dy) break;
    const tryX=Math.abs(txc-c.x)>=Math.abs(tyc-c.y);
    let moved=false;
    const seq=tryX?[[dx,0],[0,dy]]:[[0,dy],[dx,0]];
    for(const[mx,my]of seq){ if(!mx&&!my) continue;
      if(canPlace(c,c.x+mx,c.y+my,m)){ c.x+=mx; c.y+=my; moved=true; break; } }
    if(!moved) break;
  }
}

/* ================= бот (для верификации/лимитов) ================= */
function bfsAll(c){
  const m=occMap(c), seen=new Map([[c.x+','+c.y,[]]]), q=[[c.x,c.y]];
  while(q.length){ const[x,y]=q.shift(); const path=seen.get(x+','+y);
    for(const[mx,my]of[[0,-1],[1,0],[-1,0],[0,1]]){
      const nx=x+mx,ny=y+my,k=nx+','+ny;
      if(seen.has(k)||!canPlace(c,nx,ny,m)) continue;
      seen.set(k,path.concat([[nx,ny]])); q.push([nx,ny]);
    }
  } return seen;
}
function bfsPath(c,gx,gy){ const p=bfsAll(c).get(gx+','+gy); return p===undefined?null:p; }
function botStep(){
  if(!playing) return 'stopped';
  const now=tick/60;
  const flowing=c=>c.state==='idle'&&c.y===0&&c.fill<c.cap&&now-c.lastGain<0.5;
  if(!layers.length) return 'drained';
  const cur=layers[0].c;
  let best=null, bestAny=null;
  for(const c of conts){ if(c.state!=='idle'||c.fill>=c.cap||c.col!==cur) continue;
    if(flowing(c)) continue;
    const maxdx=Math.max(...c.cells.map(k=>k[0]));
    for(let x=0;x<=BC-1-maxdx;x++){
      let sc=0;
      for(const[dx]of c.cells){ const col=x+dx;
        const minRow=Math.min(...c.cells.filter(k=>k[0]===dx).map(k=>k[1]));
        if(minRow>0){ // колонку перехватит чужой пристыкованный контейнер ряда 0
          if(conts.some(o=>o!==c&&o.state==='idle'&&o.y===0&&
             o.cells.some(([ax,ay])=>o.x+ax===col&&ay===0))) continue;
        }
        sc++;
      }
      if(sc>0){
        if(!bestAny||sc>bestAny.sc) bestAny={c,x,sc};
        if(!best||sc>best.sc){ const path=bfsPath(c,x,0); if(path) best={c,x,sc,path}; }
      }
    }
  }
  if(best){ for(const[nx,ny]of best.path){ best.c.x=nx; best.c.y=ny; } return 'docked'; }
  if(bestAny){
    const cand=bestAny.c;
    const region=cand.cells.map(([dx,dy])=>[bestAny.x+dx,dy]);
    const corr=new Set(region.map(r=>r[0]));
    const others=conts.filter(o=>o!==cand&&o.state==='idle'&&!flowing(o))
      .sort((a,b)=>{const ai=a.cells.some(([dx])=>corr.has(a.x+dx))?0:1;
                    const bi=b.cells.some(([dx])=>corr.has(b.x+dx))?0:1; return ai-bi;});
    const spotsOf=o=>[...bfsAll(o).entries()].map(([k,path])=>{
        const[x,y]=k.split(',').map(Number); return {x,y,path}; })
      .filter(s=>(s.x!==o.x||s.y!==o.y)&&
        !o.cells.some(([dx,dy])=>region.some(r=>r[0]===s.x+dx&&r[1]===s.y+dy)))
      .map(s=>{ const dcol=Math.min(...o.cells.map(([dx])=>{
          let m=99; for(const cc of corr) m=Math.min(m,Math.abs(s.x+dx-cc)); return m;}));
        s.score=dcol*3+s.y; return s; })
      .sort((a,b)=>b.score-a.score);
    for(const o of others){ // глубина 1
      for(const s of spotsOf(o)){
        const ox=o.x,oy=o.y; o.x=s.x; o.y=s.y;
        const p=bfsPath(cand,bestAny.x,0);
        o.x=ox; o.y=oy;
        if(p){ for(const[nx,ny]of s.path){o.x=nx;o.y=ny;} return 'shuffle'; }
      }
    }
    for(const o1 of others.slice(0,5)){ // глубина 2: коммитим первый сдвиг пары
      for(const s1 of spotsOf(o1).slice(0,7)){
        const ox1=o1.x,oy1=o1.y; o1.x=s1.x; o1.y=s1.y;
        let ok=false;
        for(const o2 of others){ if(o2===o1) continue;
          for(const[k2]of bfsAll(o2)){
            const[x2,y2]=k2.split(',').map(Number);
            if(x2===o2.x&&y2===o2.y) continue;
            if(o2.cells.some(([dx,dy])=>region.some(r=>r[0]===x2+dx&&r[1]===y2+dy))) continue;
            const ox2=o2.x,oy2=o2.y; o2.x=x2; o2.y=y2;
            if(bfsPath(cand,bestAny.x,0)) ok=true;
            o2.x=ox2; o2.y=oy2;
            if(ok) break;
          }
          if(ok) break;
        }
        o1.x=ox1; o1.y=oy1;
        if(ok){ for(const[nx,ny]of s1.path){o1.x=nx;o1.y=ny;} return 'shuffle-2ply'; }
      }
    }
    for(const o of others){
      const s=spotsOf(o).find(s=>!botHist.includes(o.id+'@'+s.x+','+s.y));
      if(s){ for(const[nx,ny]of s.path){o.x=nx;o.y=ny;}
        botHist.push(o.id+'@'+s.x+','+s.y); if(botHist.length>24) botHist.shift();
        return 'shuffle2'; }
    }
    return 'stuck';
  }
  return 'idle';
}

/* ================= экраны/цикл ================= */
const $=s=>document.querySelector(s);
const PKEY='sandblocks_v3_progress';
let unlocked=+(localStorage.getItem(PKEY)||1);
function renderHome(){
  const d=$('#lvls'); d.innerHTML='';
  for(let i=1;i<=LEVELS.length;i++){
    const b=document.createElement('button');
    b.className='lv'+(i>unlocked?' lock':''); b.textContent=i>unlocked?'🔒':i;
    if(i<=unlocked) b.onclick=()=>startLevel(i-1);
    d.appendChild(b);
  }
}
function startLevel(n){
  level=n; buildLevel(n); playing=true; confetti=[];
  $('#home').classList.add('hidden'); $('#win').classList.add('hidden'); $('#lose').classList.add('hidden');
  $('#lvlLab').textContent='Level '+(n+1);
}
function showWin(){ popConfetti();
  unlocked=Math.max(unlocked,Math.min(LEVELS.length,level+2));
  localStorage.setItem(PKEY,unlocked);
  $('#btnNext').style.display=level+1<LEVELS.length?'':'none';
  setTimeout(()=>{ if(winFlag) $('#win').classList.remove('hidden'); },150);
}
function showLose(){ $('#lose').classList.remove('hidden'); }
$('#btnHome').onclick=()=>{playing=false;renderHome();$('#home').classList.remove('hidden');};
$('#btnWinHome').onclick=$('#btnHome').onclick;
$('#btnLoseHome').onclick=$('#btnHome').onclick;
$('#btnRetry').onclick=()=>startLevel(level);
$('#btnRetryOv').onclick=()=>startLevel(level);
$('#btnNext').onclick=()=>startLevel(level+1);

function fmt(t){ t=Math.max(0,Math.ceil(t)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last) last=ts;
  let dt=Math.min(.1,(ts-last)/1000); last=ts;
  if(playing){
    let steps=Math.round(dt*60*ffMult);
    for(let i=0;i<Math.max(1,steps);i++) step(1/60);
    if(botOn&&--botCd<=0){ botStep(); botCd=Math.max(3,18/ffMult); }
  }
  $('#timer').textContent=fmt(timeLeft);
  draw();
}
buildLevel(0); renderHome();
requestAnimationFrame(loop); fit();

/* ================= тест-хуки ================= */
window.__game={
  start:n=>startLevel(n),
  snap:()=>({level:level+1,time:+timeLeft.toFixed(1),win:winFlag,lose:loseFlag,playing,
    tankLeft:+layers.reduce((a,l)=>a+l.vol,0).toFixed(2),
    layers:layers.map(l=>PAL[l.c].n[0]+':'+l.vol.toFixed(1)),
    conts:conts.map(c=>({col:PAL[c.col].n,x:c.x,y:c.y,fill:+c.fill.toFixed(2),cap:c.cap,state:c.state}))}),
  ff:m=>{ffMult=m;},
  bot:on=>{botOn=on;},
  botStep,
  setTime:s=>{timeLeft=s;},
};
</script>
