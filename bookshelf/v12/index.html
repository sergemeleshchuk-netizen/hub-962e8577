<style id="difficultyCurveStyle">
/* v12 25% move budget and difficulty curve */
.curve-scroll{--curve-text:var(--ink);--curve-muted:var(--muted);--curve-grid:#DCC5A5;--curve-blue:var(--blue);--curve-purple:var(--purple-o);--curve-gold:var(--gold-o)}
.curve-note,.curve-explain{width:100%;font:700 12px/1.4 var(--f-ui);color:var(--curve-muted);text-align:left}
.curve-overview,.curve-detail{width:100%}
.curve-svg{width:100%;height:auto;display:block;margin:4px 0}
.curve-svg text{fill:var(--curve-muted);font:11px var(--f-ui)}
.curve-svg .curve-axis{fill:var(--curve-text);font-weight:700}
.curve-svg .curve-frame{fill:none;stroke:var(--curve-grid);stroke-width:1}
.curve-svg .curve-grid{fill:none;stroke:var(--curve-grid);stroke-width:1}
.curve-svg .curve-line{fill:none;stroke-width:2;stroke-linejoin:round}
.curve-svg .curve-line.difficulty{stroke:var(--curve-purple)}
.curve-svg .curve-line.books{stroke:var(--curve-gold)}
.curve-svg .curve-line.budget{stroke:var(--curve-blue)}
.curve-svg .curve-line.clean{stroke:#48A368}
.curve-svg .curve-mechanic{fill:var(--curve-gold);stroke:var(--panel);stroke-width:1}
.curve-svg .curve-ten{fill:none;stroke:var(--curve-muted);stroke-width:1;stroke-dasharray:2 3;opacity:.55}
.curve-tables{width:100%;display:flex;flex-direction:column;gap:6px;margin:2px 0 6px}
.curve-tens{width:100%;border-collapse:collapse;table-layout:fixed;font:700 11px/1 var(--f-ui);color:var(--curve-text);background:#F3E9D9;border-radius:8px;overflow:hidden}
.curve-tens caption{text-align:left;font:800 12px var(--f-ui);color:var(--curve-text);padding:2px 2px 3px}
.curve-tens th{width:64px;text-align:left;padding:3px 4px;font:700 10px/1 var(--f-ui);color:var(--curve-muted);white-space:nowrap}
.curve-tens td{text-align:center;padding:3px 0;border-left:1px solid var(--curve-grid)}
.curve-tens tr+tr td,.curve-tens tr+tr th{border-top:1px solid var(--curve-grid)}
.curve-tens tr.lv td{font-weight:800;color:var(--curve-muted)}
.curve-tens tr.given td{color:var(--blue-o);font-weight:800}
.curve-tens td.mark{background:#FFE7A8}
.curve-tens i,.curve-catkey i{display:inline-block;min-width:20px;padding:2px 2px;border-radius:5px;font:800 10px/1 var(--f-ui);font-style:normal;color:#fff}
.curve-tens i.norm,.curve-catkey i.norm{background:#7FA88A}
.curve-tens i.med,.curve-catkey i.med{background:#E3A23B}

.curve-tens i.super,.curve-catkey i.super{background:#8455E3}
.curve-catkey{width:100%;font:700 11px/1.5 var(--f-ui);color:var(--curve-muted);text-align:left}
.curve-catkey i{min-width:12px;margin:0 3px 0 6px}.curve-catkey i:first-child{margin-left:0}
.curve-nav{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0}
.curve-nav .btn{min-width:44px;padding:0 11px}
.curve-range{font:700 13px var(--f-ui);color:var(--curve-text)}
.curve-legend{width:100%;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;font:700 11px var(--f-ui);color:var(--curve-muted)}
.curve-legend i{display:inline-block;width:13px;height:3px;margin-left:5px}
.curve-legend i.budget{background:var(--curve-blue)}.curve-legend i.clean{background:#48A368}
.curve-picker{display:block;width:100%;font:800 12px var(--f-ui);color:var(--curve-text);text-align:left}
.curve-picker input{display:block;width:100%;accent-color:var(--curve-blue);margin:7px 0}
.curve-stat{width:100%;padding:8px;border-radius:9px;background:#F3E9D9;text-align:left;font:700 12px/1.45 var(--f-ui);color:var(--curve-text)}
.curve-stat strong{color:var(--blue-o);font-size:15px}
.curve-heading{width:100%;padding-top:8px;font:800 14px var(--f-ui);color:var(--curve-text);text-align:left}
.curve-event,.curve-booster{width:100%;display:flex;align-items:flex-start;text-align:left;gap:9px;padding:7px 4px;border-bottom:1px solid var(--curve-grid);font:700 12px/1.3 var(--f-ui);color:var(--curve-text)}
.curve-event b,.curve-booster b{min-width:27px;color:var(--curve-purple)}
.curve-event span{display:flex;flex-direction:column;gap:2px}

</style>

<style id="hdZoneCss">

<style id="padBubCss">#brPad .brBub.lo{top:auto;transform:none;border-radius:16px;pointer-events:none;box-shadow:0 0 0 3px #FFE14D,0 8px 18px rgba(0,0,0,.25);animation:padBubIn .35s cubic-bezier(.34,1.56,.64,1) both}#brPad .brBub.lo::after{content:"";position:absolute;left:calc(var(--ax,50%) - 8px);bottom:-7px;width:16px;height:16px;background:#fff;transform:rotate(45deg);box-shadow:3px 3px 0 0 #FFE14D}#brPad .brBub.lo.go{opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}@keyframes padBubIn{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen portrait app (max 440px) — sunny cozy library, glossy soft-3D components, the bookcase is the hero */
:root{
  --green:#53D96B;--green-d:#279A48;--green-o:#1F7E3B;
  --gold:#FFC548;--gold-d:#D99120;--gold-o:#A86A12;
  --sky:#69CBF5;--blue:#357BE8;--blue-d:#2156B8;--blue-o:#173F8C;
  --coral:#FF735F;--coral-d:#D9473A;--coral-o:#A8301F;
  --purple:#A77AF4;--purple-d:#7A4FD3;--purple-o:#5634A3;
  --cream:#FFF4DB;--panel:#FFF9EB;--line:#D6AA75;--line-d:#E2C08F;
  --brown:#69452D;--outline:#8A583B;--ink:#5A3A22;--muted:#9C7A5B;
  --wood1:#C98A4E;--wood2:#A2652F;--wood3:#7A4A22;--inner:#4B2C17;
  --night:#24160D;
  --f-hero:'Fredoka','Baloo 2','Nunito',system-ui,sans-serif;
  --f-num:'Baloo 2','Fredoka','Nunito',system-ui,sans-serif;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:absolute;inset:0;overflow:hidden;background:#E9B877;box-shadow:0 0 60px rgba(0,0,0,.6)}
img{-webkit-user-drag:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}

/* ---------- outlined text ---------- */
.ol{--o:var(--outline);text-shadow:0 2px 0 var(--o),0 -1.5px 0 var(--o),1.5px 0 0 var(--o),-1.5px 0 0 var(--o),1.5px 1.5px 0 var(--o),-1.5px 1.5px 0 var(--o),1.5px -1.5px 0 var(--o),-1.5px -1.5px 0 var(--o),0 4px 0 rgba(60,30,10,.22)}

/* ---------- glossy 3D buttons ---------- */
.btn{--c:var(--green);--cd:var(--green-d);--co:var(--green-o);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:58px;padding:0 26px;border-radius:20px;border:2px solid var(--co);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 46%,color-mix(in srgb,var(--c) 88%,#000) 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.08),0 6px 0 var(--cd),0 7px 0 var(--co),0 12px 16px rgba(57,33,13,.3);
  font:800 24px/1 var(--f-num);color:#fff;letter-spacing:.3px;
  transition:transform .16s cubic-bezier(.34,1.9,.6,1),box-shadow .16s;transform:translateY(0)}
.btn>*{position:relative;z-index:1}
.btn::before{content:"";position:absolute;left:7px;right:7px;top:4px;height:42%;border-radius:15px 15px 50% 50%/15px 15px 10px 10px;background:linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.1));pointer-events:none}
.btn .t{--o:var(--co);text-shadow:0 2px 0 var(--o),0 -1.5px 0 var(--o),1.5px 0 0 var(--o),-1.5px 0 0 var(--o),1.5px 1.5px 0 var(--o),-1.5px 1.5px 0 var(--o),1.5px -1.5px 0 var(--o),-1.5px -1.5px 0 var(--o)}
.btn.down,.btn:active{transform:translateY(5px) scale(.96);transition-duration:.085s;box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.08),0 1px 0 var(--cd),0 2px 0 var(--co),0 4px 6px rgba(57,33,13,.3)}
.btn.gold{--c:var(--gold);--cd:var(--gold-d);--co:var(--gold-o)}
.btn.blue{--c:#4C93F2;--cd:var(--blue-d);--co:var(--blue-o)}
.btn.coral{--c:var(--coral);--cd:var(--coral-d);--co:var(--coral-o)}
.btn.purple{--c:var(--purple);--cd:var(--purple-d);--co:var(--purple-o)}
.btn.grey{--c:#C9B9A6;--cd:#9C8873;--co:#7B6855}
.btn.sm{min-height:46px;padding:0 16px;font-size:19px;border-radius:16px}
.btn.wide{width:100%}
.btn.big{min-height:66px;font-size:30px;padding:0 40px}
.btn[disabled]{filter:grayscale(.8) brightness(.95);pointer-events:none}
.btn .coin{width:28px;height:28px}
.btn .sub{display:block;font:800 13px/1 var(--f-ui);opacity:.95;margin-top:2px}
.btn .stack{display:flex;flex-direction:column;align-items:center}
/* the rewarded-ad button of the Unity build (template ButtonOrange + AdsIcon), 2026-11-04 */
.btn.adBtn{--co:#B4400A;--cd:transparent;background:none;box-shadow:none;border:0;min-height:66px;padding:0 24px 4px;
  border-image:url(ui/ad_btn.webp) 54 62 51 54 fill/22px 25px 21px 22px}
.btn.adBtn::before,.btn.adBtn::after{display:none}
.btn.adBtn .adI{width:48px;height:48px;object-fit:contain;margin:-2px 2px 0 -6px;filter:drop-shadow(0 2px 2px rgba(120,40,0,.35))}
.link{font:800 16px var(--f-ui);color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px 12px}

/* round icon buttons */
.ibtn{position:relative;flex:none;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;border:2px solid var(--line);
  background:linear-gradient(#fffdf6,#F6E3BF);box-shadow:inset 0 2px 0 #fff,0 4px 0 #CFA36C,0 8px 12px rgba(57,33,13,.28);transition:transform .16s cubic-bezier(.34,1.9,.6,1)}
.ibtn:active{transform:translateY(3px) scale(.94);transition-duration:.085s}
.ibtn svg{width:26px;height:26px}

/* ---------- counters ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px 0;position:relative;z-index:5}
.ctr{position:relative;flex:none;height:42px;min-width:118px;border-radius:21px;padding:0 38px 0 40px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(rgba(64,36,18,.86),rgba(48,26,12,.86));border:2px solid rgba(255,236,200,.35);box-shadow:inset 0 3px 6px rgba(0,0,0,.35),0 3px 0 rgba(0,0,0,.18)}
.ctr .v{font:800 21px/1 var(--f-num);color:#fff;font-variant-numeric:tabular-nums;padding-top:2px}
.ctr .sv{font:800 11px/1 var(--f-ui);color:#FFE7B8;position:absolute;bottom:-14px;left:40px;right:0;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.ctr>img{position:absolute;left:-8px;top:50%;width:46px;height:46px;transform:translateY(-50%);filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.ctr .plus{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:11px;border:2px solid var(--green-o);
  background:linear-gradient(#9AF0A8,var(--green) 50%,#3EC157);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 var(--green-d);display:grid;place-items:center;font:800 24px/1 var(--f-num);color:#fff}

.ctr.bump{animation:bump .4s cubic-bezier(.34,1.9,.6,1)}

/* =================== HOME =================== */
#sHome{background:#d9a56a url(ui/home_bg.jpg) center/cover no-repeat}
#sHome::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,230,180,0) 55%,rgba(120,70,30,.35));pointer-events:none}
.logo{position:relative;text-align:center;margin-top:14px;line-height:.86;transform:rotate(-2.5deg)}
.logo .a{display:block;font:700 30px var(--f-hero);color:#fff;letter-spacing:.5px;--o:#6B3D1C}
.logo .b{display:block;font:700 54px var(--f-hero);color:var(--gold);letter-spacing:.5px;--o:#6B3D1C;
  text-shadow:0 3px 0 #6B3D1C,0 -2px 0 #6B3D1C,2.5px 0 0 #6B3D1C,-2.5px 0 0 #6B3D1C,2px 2px 0 #6B3D1C,-2px 2px 0 #6B3D1C,2px -2px 0 #6B3D1C,-2px -2px 0 #6B3D1C,0 7px 0 rgba(80,40,10,.35)}
.homeMid{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;min-height:0;padding-top:6px}
.side{position:absolute;top:50%;transform:translateY(-58%);display:flex;flex-direction:column;gap:20px;z-index:3}
.side.l{left:12px}.side.r{right:12px}
.sbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:66px}
.sbtn .tile{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;border:2px solid var(--line);
  background:linear-gradient(#fffdf6,#F3DDB2);box-shadow:inset 0 3px 0 #fff,0 5px 0 #C9965A,0 10px 14px rgba(57,33,13,.32);transition:transform .16s cubic-bezier(.34,1.9,.6,1)}
.sbtn .tile img,.sbtn .tile svg{width:46px;height:46px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.2))}
.sbtn:active .tile{transform:translateY(3px) scale(.94)}
.sbtn .lb{font:700 14px/1 var(--f-hero);color:#fff;--o:#6B3D1C}
.sbtn.locked .tile{filter:grayscale(.85) brightness(.92)}
.sbtn .pad{position:absolute;top:30px;left:50%;transform:translate(-50%,-50%);width:30px;height:30px}
.sbtn .lvl{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font:800 11px/1 var(--f-ui);padding:3px 6px;border-radius:8px;white-space:nowrap}
.dot{position:absolute;top:-4px;right:-2px;min-width:22px;height:22px;border-radius:11px;background:linear-gradient(#FF8B7A,#F0412E);border:2px solid #fff;color:#fff;font:800 12px/18px var(--f-ui);text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.3);animation:dotp 1.6s ease-in-out infinite}
@keyframes dotp{50%{transform:scale(1.15)}}

/* teaser painting: shuffled strips in a gold frame */
.easelWrap{position:relative;width:min(80cqw,340px,calc(100cqh - 470px));min-width:150px;aspect-ratio:1}
@supports (container-type:size){.homeMid{container-type:size}.easelWrap{margin-bottom:20px;width:min(84cqw,340px,calc(100cqh - var(--botH,128px) - var(--midGap,34px) - 70px))}}
.easel{position:relative;width:100%;height:100%}
.slot{position:absolute;z-index:3}
.slot.tl{left:-2px;bottom:calc(100% + 10px)}.slot.tr{right:-2px;bottom:calc(100% + 10px)}
.slot.bl{left:-2px;top:calc(100% + 12px)}.slot.br{right:-2px;top:calc(100% + 12px)}
.frame{position:absolute;inset:0;border-radius:14px;padding:12px;
  background:linear-gradient(135deg,#FFE9A3,#E2A93A 30%,#FFE08A 52%,#C98A1E 78%,#FFD56A);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(120,70,10,.4),0 8px 0 #9A6114,0 18px 26px rgba(60,30,8,.45)}
.frame::before{content:"";position:absolute;inset:9px;border-radius:6px;box-shadow:inset 0 0 0 2px rgba(120,70,10,.45)}
.strips{position:relative;width:100%;height:100%;display:flex;gap:2px;border-radius:5px;overflow:hidden;background:var(--inner)}
.strips.grid{display:grid;gap:3px;padding:2px;background:linear-gradient(#5A3720,#3B2311)}
.strips.grid i{border-radius:3px 3px 1px 1px}
.strips i{flex:1;background-repeat:no-repeat;background-size:auto 100%;box-shadow:inset -2px 0 3px rgba(0,0,0,.35),inset 2px 0 2px rgba(255,255,255,.18)}
.easel .q{position:absolute;inset:12px;display:grid;place-items:center;font:700 88px var(--f-hero);color:#fff;--o:#6B3D1C;pointer-events:none;animation:qbob 2.4s ease-in-out infinite}
@keyframes qbob{50%{transform:translateY(-6px) rotate(4deg)}}
.plate{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);white-space:nowrap;padding:7px 16px 6px;border-radius:14px;border:2px solid var(--line);
  background:linear-gradient(#fffdf6,#F3DDB2);box-shadow:inset 0 2px 0 #fff,0 4px 0 #C9965A,0 8px 12px rgba(57,33,13,.3);font:700 16px/1 var(--f-hero);color:var(--ink);display:flex;gap:8px;align-items:center}
.chip{display:inline-block;padding:4px 9px 3px;border-radius:10px;font:800 12px/1 var(--f-ui);color:#fff;letter-spacing:.3px;text-transform:uppercase}
.chip.hard{background:linear-gradient(#FF8E7D,#E9483A);box-shadow:0 2px 0 var(--coral-o)}
.chip.super{background:linear-gradient(#C29BFF,#8455E3);box-shadow:0 2px 0 var(--purple-o)}
.homeBot{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;padding:0 16px;z-index:3}
.nav{position:relative;z-index:4;display:flex;justify-content:space-around;align-items:flex-end;margin:0 12px calc(34px + env(safe-area-inset-bottom,0px));padding:8px 6px 8px;border-radius:26px;border:3px solid var(--line);
  background:linear-gradient(#fffdf6,var(--panel) 40%,#F6E6C4);box-shadow:inset 0 3px 0 #fff,0 5px 0 #CFA36C,0 10px 16px rgba(57,33,13,.32)}
.nav .sbtn{width:72px}
.nav .sbtn .tile{width:56px;height:56px;border-radius:18px}
.nav .sbtn .tile img,.nav .sbtn .tile svg{width:40px;height:40px}
.nav .sbtn .lb{color:var(--ink);text-shadow:none;font-size:13px;margin-top:2px}
.nav .sbtn .pad{top:28px}.nav .sbtn .lvl{top:40px}
.homeMid .side{transform:translateY(-50%)}
.playBtn{width:min(272px,100%)}
.playBtn .stack .sub{font:700 14px/1 var(--f-ui)}
.progressStrip{display:flex;gap:6px;align-items:center;font:800 13px var(--f-ui);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.progressStrip b{display:inline-block;width:18px;height:18px;border-radius:6px;background:rgba(60,30,10,.5);border:2px solid rgba(255,255,255,.5)}
.progressStrip b.on{background:linear-gradient(#FFE08A,#E3A62A);border-color:#fff}
.progressStrip b.peak{width:22px;height:22px;border-radius:7px}

/* =================== GAME =================== */
#sGame{background:#c78f55}
#sGame::before{content:"";position:absolute;inset:-20px;background:url(ui/home_bg.jpg) center/cover;filter:blur(7px) brightness(.82) saturate(1.1);pointer-events:none}
#sGame>*{position:relative}
.hud{display:flex;align-items:center;gap:10px;padding:26px 16px 0;z-index:6}
.hudPanel{flex:1;height:76px;border-radius:24px;border:3px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:8px;
  background:linear-gradient(#fffdf6,var(--panel) 40%,#F6E6C4);box-shadow:inset 0 3px 0 #fff,0 5px 0 #CFA36C,0 10px 16px rgba(57,33,13,.32)}
.goal{position:relative;width:54px;height:54px;border-radius:12px;padding:4px;background:linear-gradient(135deg,#FFE9A3,#E2A93A 40%,#FFE08A 60%,#C98A1E);box-shadow:0 3px 0 #9A6114;flex:none;cursor:zoom-in;touch-action:none}
.goal i{display:block;width:100%;height:100%;border-radius:8px;background-size:cover;filter:blur(3px) saturate(.8)}
.goal{overflow:visible;cursor:pointer}
.goal .eye img{width:24px;height:24px}
.goal .eye{position:absolute;right:-8px;bottom:-8px;width:28px;height:28px;display:grid;place-items:center;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}
.goal .eye svg{width:15px;height:15px}
.hcol{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.hlab{font:800 11px/1 var(--f-ui);letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.moves{flex:none;position:relative;width:76px;height:76px;margin:-10px 0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:radial-gradient(circle at 35% 30%,#8FC2FF,#3F86EE 55%,#2A63CC);border:3px solid #fff;box-shadow:0 0 0 3px var(--blue-o),0 6px 0 3px #1B3F86,0 12px 16px rgba(20,30,70,.35)}
.moves::before{content:"";position:absolute;left:14px;right:14px;top:6px;height:30%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0))}
.moves .n{position:relative;font:800 34px/.8 var(--f-num);color:#fff;--o:var(--blue-o);margin-top:6px;text-align:center;font-variant-numeric:tabular-nums}
.moves .ml{position:relative;font:800 9.5px/1 var(--f-ui);color:#E4F0FF;letter-spacing:.9px;text-align:center;text-indent:.9px}
.moves.low{background:radial-gradient(circle at 35% 30%,#FFB2A5,#F5604A 55%,#D5402C);box-shadow:0 0 0 3px var(--coral-o),0 6px 0 3px #8A2416,0 12px 16px rgba(70,20,10,.35);animation:lowp .9s ease-in-out infinite}
.moves.low .n{--o:var(--coral-o)}
@keyframes lowp{50%{transform:scale(1.07)}}
.moves .free{position:absolute;top:-12px;right:-14px;width:38px;height:38px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));animation:qbob 1.2s ease-in-out infinite}
.pieces{flex:1;min-width:0;align-items:stretch}
.pbar{position:relative;height:18px;border-radius:9px;background:#E9D3AE;box-shadow:inset 0 2px 3px rgba(90,50,20,.3);overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(#A4F2B0,var(--green) 50%,#36B551);box-shadow:inset 0 2px 0 rgba(255,255,255,.5);transition:width .4s cubic-bezier(.34,1.5,.6,1)}
.pnum{font:800 17px/1 var(--f-num);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.lvlrow{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:12px;font:700 18px/1 var(--f-hero);color:#fff;--o:#5A3418;z-index:4}
#stage{flex:1;position:relative;min-height:0;margin:14px 0 4px}

/* bookcase */
#case{position:absolute;border-radius:18px;transition:left .9s cubic-bezier(.6,0,.2,1),top .9s cubic-bezier(.6,0,.2,1),width .9s cubic-bezier(.6,0,.2,1),height .9s cubic-bezier(.6,0,.2,1);
  background:linear-gradient(180deg,#D99A5B,var(--wood2) 40%,var(--wood3));
  box-shadow:inset 0 3px 0 rgba(255,225,180,.6),inset 0 -4px 0 rgba(60,30,10,.35),inset 3px 0 0 rgba(255,220,170,.25),inset -3px 0 0 rgba(60,30,10,.25),0 8px 0 #5B3416,0 18px 28px rgba(40,20,5,.5)}
#case::after{content:"";position:absolute;inset:-9px;border-radius:24px;pointer-events:none;opacity:0;transition:opacity .9s ease .2s;
  background:linear-gradient(135deg,#FFE9A3,#E2A93A 30%,#FFE08A 52%,#C98A1E 78%,#FFD56A);z-index:-1;box-shadow:0 8px 0 #9A6114,0 20px 34px rgba(60,30,8,.5)}
#case.framed::after{opacity:1}
#case.solved{background:#3b230f}
.rowback{position:absolute;border-radius:6px;background:linear-gradient(180deg,#2E1A0C 0%,var(--inner) 40%,#5A3720 100%);box-shadow:inset 0 10px 14px -6px rgba(0,0,0,.75),inset 0 -2px 0 rgba(0,0,0,.2);transition:all .9s cubic-bezier(.6,0,.2,1)}
.plank{position:absolute;border-radius:5px;z-index:2;background:linear-gradient(180deg,#F2C084 0%,#D99A5B 30%,#A8693A 75%,#7E4C24);box-shadow:inset 0 2px 0 rgba(255,240,210,.7),0 3px 4px rgba(40,20,5,.45);transition:all .9s cubic-bezier(.6,0,.2,1)}
#case.solved .rowback,#case.solved .plank,#case.solved .crown,#case.solved .base{opacity:0}
.crown{position:absolute;left:-12px;right:-12px;top:-16px;height:22px;border-radius:10px 10px 4px 4px;z-index:1;transition:opacity .5s;
  background:linear-gradient(180deg,#F2C084,#C98A4E 40%,#8E5629);box-shadow:inset 0 2px 0 rgba(255,240,210,.7),0 4px 0 #6B3D1C,0 6px 8px rgba(40,20,5,.35)}
.crown::after{content:"";position:absolute;left:14px;right:14px;bottom:-6px;height:6px;background:repeating-linear-gradient(90deg,#B67840 0 10px,#7E4C24 10px 12px);border-radius:0 0 3px 3px}
.base{position:absolute;left:-8px;right:-8px;bottom:-14px;height:16px;border-radius:4px 4px 8px 8px;z-index:0;transition:opacity .5s;
  background:linear-gradient(180deg,#A8693A,#6B3D1C);box-shadow:0 6px 10px rgba(40,20,5,.4)}
.base::before,.base::after{content:"";position:absolute;bottom:-10px;width:26px;height:12px;border-radius:0 0 6px 6px;background:#5B3416}
.base::before{left:12px}.base::after{right:12px}
.book{position:absolute;left:0;top:0;background-repeat:no-repeat;background-image:var(--art);border-radius:5px 5px 2px 2px;transform-origin:50% 100%;cursor:grab;z-index:3;will-change:transform;touch-action:none;
  transition:transform .21s cubic-bezier(.22,.9,.3,1),box-shadow .2s,width .3s cubic-bezier(.2,.8,.2,1),height .3s cubic-bezier(.2,.8,.2,1),background-position .3s cubic-bezier(.2,.8,.2,1),filter .2s,border-radius .3s;
  box-shadow:0 2px 0 rgba(50,25,8,.4),0 4px 6px rgba(40,20,5,.35)}
.book>i{position:absolute;inset:0;border-radius:inherit;pointer-events:none;transition:opacity .8s;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.18);
  background:
   linear-gradient(180deg,transparent 6%,rgba(255,214,120,var(--band)) 6%,rgba(255,214,120,var(--band)) 7.8%,transparent 7.8%,transparent 91.4%,rgba(255,214,120,var(--band)) 91.4%,rgba(255,214,120,var(--band)) 93.2%,transparent 93.2%),
   linear-gradient(90deg,rgba(40,20,5,.42) 0%,rgba(255,245,225,.28) 16%,rgba(255,245,225,.06) 46%,rgba(0,0,0,.1) 78%,rgba(40,20,5,.48) 100%),
   linear-gradient(rgba(0,0,0,var(--dk)),rgba(0,0,0,var(--dk)))}
.book::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 50%,rgba(255,240,170,.95),rgba(255,210,110,.25) 70%,transparent)}
.book.ok::after{animation:okglow .8s ease-out}
.book.ok{animation:squash .34s cubic-bezier(.34,1.6,.6,1)}
@keyframes okglow{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes squash{0%{scale:1 1}35%{scale:1.04 .93}70%{scale:.98 1.06}100%{scale:1 1}}
.book.lift{z-index:40;box-shadow:0 16px 22px -4px rgba(30,15,5,.6),0 0 0 2px rgba(255,255,255,.6);filter:brightness(1.07);cursor:grabbing}
.book.sel{box-shadow:0 16px 22px -4px rgba(30,15,5,.6),0 0 0 3px var(--gold)}
.book.dragging{z-index:60;transition:width .3s,height .3s,box-shadow .2s,filter .2s}
.book.target{filter:brightness(1.16);box-shadow:0 0 0 2.5px #fff,0 8px 16px rgba(0,0,0,.45)}
.book.hint{animation:hintp .8s ease-in-out infinite;z-index:30}
@keyframes hintp{0%,100%{box-shadow:0 0 0 3px var(--gold),0 0 16px 4px rgba(255,200,70,.7)}50%{box-shadow:0 0 0 5px #fff,0 0 26px 8px rgba(255,200,70,.95)}}
.book.glued>i{opacity:.32}
.book.glued::before{content:"";position:absolute;left:0;right:0;bottom:-6px;height:5px;border-radius:3px;background:linear-gradient(#FFF0B0,#F2B53A 55%,#C98A1E);box-shadow:0 1px 0 #8A560E}
.book.gl-l{border-top-left-radius:0;border-bottom-left-radius:0}.book.gl-l::before{border-top-left-radius:0;border-bottom-left-radius:0}
.book.gl-r{border-top-right-radius:0;border-bottom-right-radius:0}.book.gl-r::before{border-top-right-radius:0;border-bottom-right-radius:0}
.book.gl-r{box-shadow:0 2px 0 rgba(50,25,8,.4)}
.book.glued.lift{box-shadow:0 14px 18px -6px rgba(30,15,5,.6)}
.book.shake{animation:shake .38s}
.book.framed{cursor:default}
.book.framed>i{opacity:1!important;background:linear-gradient(90deg,rgba(40,20,5,.25),transparent 18%,transparent 82%,rgba(40,20,5,.25));box-shadow:inset 0 0 0 2px #FFD56A,inset 0 0 0 3.5px rgba(150,95,15,.55),inset 0 3px 0 rgba(255,255,255,.45)}
.book.framed>i::after{content:"";position:absolute;top:5px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6C8,#E2A93A 60%,#A86A12);box-shadow:0 1px 1px rgba(0,0,0,.45)}
.book.pin{animation:pin .5s cubic-bezier(.34,1.7,.6,1)}
@keyframes pin{0%{scale:1}35%{scale:1.06 1.03;filter:brightness(1.35)}100%{scale:1}}
.book.loose{animation:loose 1s ease-in-out infinite}
.book.loose::before{background:repeating-linear-gradient(90deg,#FFE08A 0 6px,transparent 6px 10px)!important}
@keyframes loose{0%,100%{rotate:0deg}25%{rotate:-2deg}75%{rotate:2deg}}
@keyframes shake{20%{translate:-5px 0}40%{translate:5px 0}60%{translate:-3px 0}80%{translate:2px 0}}
#case.solved .book{transition-duration:.9s;box-shadow:none;border-radius:0;cursor:default}
#case.solved .book>i,#case.solved .book::before{opacity:0}
/* modifiers */
.book .cover{position:absolute;inset:0;border-radius:inherit;pointer-events:none;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.25),transparent 40%),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px),linear-gradient(90deg,#3B2266,#7A4FD3 30%,#6A40C0 70%,#3B2266);
  box-shadow:inset 0 0 0 2px rgba(255,214,120,.55);transition:opacity .4s,transform .4s;font:700 clamp(16px,4cqw,26px)/1 var(--f-hero);color:var(--gold);--o:#3B2266}
.book .cover.gone{opacity:0;transform:scaleX(0)}
.book .chains{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(35deg,transparent 0 10px,rgba(70,70,80,.0) 10px),linear-gradient(35deg,transparent 44%,#9BA3AE 44%,#D9DEE4 48%,#7D8590 52%,transparent 52%),linear-gradient(-35deg,transparent 44%,#9BA3AE 44%,#D9DEE4 48%,#7D8590 52%,transparent 52%);transition:opacity .35s,transform .35s}
.book .chains b{position:absolute;left:50%;top:50%;width:min(30px,80%);aspect-ratio:1;transform:translate(-50%,-50%);display:block;background:url(ui/i_key.png) 0 0/0 0}
.book .chains svg{position:absolute;left:50%;top:50%;width:min(30px,84%);height:auto;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.book .chains em{position:absolute;left:50%;top:50%;transform:translate(-50%,8%);font:800 11px/1 var(--f-num);font-style:normal;color:#fff;--o:#6B3D1C}
.book.lockd{cursor:not-allowed}
.book.lockd>i{background-color:rgba(30,20,10,.25)}
.book .chains.gone{opacity:0;transform:translateY(30px) rotate(12deg)}
.book .tie{position:absolute;left:-3px;right:-3px;top:44%;height:12px;pointer-events:none;border-radius:3px;
  background:linear-gradient(#F7A6FF,#C35BE0 50%,#8E2FB3);box-shadow:0 2px 0 rgba(70,10,90,.5),inset 0 2px 0 rgba(255,255,255,.5);transition:opacity .3s,transform .3s}
.book .tie.knot::after{content:"";position:absolute;right:-9px;top:-5px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFC7FF,#C35BE0 60%,#7E2299);box-shadow:0 2px 0 rgba(70,10,90,.6);z-index:2}
.book .tie.gone{opacity:0;transform:scaleY(0)}
.ghost{position:absolute;border-radius:6px;border:3px dashed var(--gold);background:rgba(255,220,120,.18);z-index:2;pointer-events:none;animation:ghostp .8s ease-in-out infinite}
@keyframes ghostp{50%{background:rgba(255,220,120,.42);border-color:#fff}}
.final{position:absolute;background-image:var(--art);background-size:100% 100%;opacity:0;transition:opacity .7s ease;pointer-events:none;z-index:5;overflow:hidden;border-radius:4px}
.final.on{opacity:1}
.final::after{content:"";position:absolute;inset:-20% -60%;background:linear-gradient(105deg,transparent 40%,rgba(255,245,210,.55) 50%,transparent 60%);transform:translateX(-80%)}
.final.on::after{animation:sheen 1.6s cubic-bezier(.4,0,.2,1) .3s forwards}
@keyframes sheen{to{transform:translateX(80%)}}
#peek{position:absolute;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .18s}
#peek.on{opacity:1}
#peek .pf{width:min(calc(100% - 28px),360px);aspect-ratio:1;border-radius:16px;padding:12px;background:linear-gradient(135deg,#FFE9A3,#E2A93A 30%,#FFE08A 52%,#C98A1E 78%,#FFD56A);box-shadow:0 8px 0 #9A6114,0 24px 40px rgba(30,15,5,.6);transform:scale(.9);transition:transform .26s cubic-bezier(.34,1.6,.6,1)}
#peek.on .pf{transform:scale(1)}
#peek .pf{position:relative}
#peek .pf>i{display:block;width:100%;height:100%;border-radius:6px;background-size:cover}
#peek .pk-n{position:absolute;top:-22px;right:-16px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 28px/1 var(--f-num);color:#fff;--o:var(--blue-o);
  background:radial-gradient(circle at 35% 30%,#8FC2FF,#3F86EE 55%,#2A63CC);border:3px solid #fff;box-shadow:0 4px 0 var(--blue-o),0 8px 12px rgba(0,0,0,.3)}
#peek .pk-bar{position:absolute;left:18px;right:18px;bottom:-22px;height:12px;border-radius:6px;background:rgba(60,30,10,.5);box-shadow:inset 0 2px 3px rgba(0,0,0,.35);overflow:hidden}
#peek .pk-bar i{display:block;height:100%;width:100%;border-radius:6px;background:linear-gradient(#FFF0B0,#F2B53A 55%,#C98A1E)}
#peek::before{content:"";position:absolute;inset:-200px;background:rgba(40,20,8,.45);z-index:-1}

/* booster bar */
.bbar{margin:12px 12px 34px;padding:10px 8px 12px;border-radius:26px;border:3px solid var(--line);display:flex;justify-content:space-around;gap:6px;z-index:6;
  background:linear-gradient(#fffdf6,var(--panel) 40%,#F6E6C4);box-shadow:inset 0 3px 0 #fff,0 5px 0 #CFA36C,0 10px 16px rgba(57,33,13,.32)}
.bt{position:relative;width:62px;height:68px;border-radius:18px;display:grid;place-items:center;border:2px solid #E4C48E;
  background:linear-gradient(#FFFFFF,#FCEFD3);box-shadow:inset 0 2px 0 #fff,0 4px 0 #D9B47C,0 6px 10px rgba(57,33,13,.2);transition:transform .16s cubic-bezier(.34,1.9,.6,1)}
.bt:active{transform:translateY(3px) scale(.94);transition-duration:.085s}
.bt img{width:46px;height:46px;filter:drop-shadow(0 3px 2px rgba(60,30,10,.28));transition:transform .2s}
.bt .cnt{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;padding:0 5px;border-radius:13px;background:linear-gradient(#FF8B7A,#F0412E);border:2px solid #fff;font:800 15px/22px var(--f-num);color:#fff;text-align:center;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.bt .price{position:absolute;left:-2px;right:-2px;bottom:-9px;height:24px;display:flex;align-items:center;justify-content:center;gap:3px;padding:0 4px;border-radius:11px;
  background:linear-gradient(#8CCBFF,#4C93F2 55%,var(--blue));border:2px solid #fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 2px 0 var(--blue-o),0 4px 6px rgba(0,0,0,.25);
  font:800 14px/1 var(--f-num);color:#fff;white-space:nowrap;text-shadow:0 1px 0 var(--blue-o),0 -1px 0 var(--blue-o),1px 0 0 var(--blue-o),-1px 0 0 var(--blue-o)}
.bt .price img{width:17px;height:17px;flex:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.bt .plus2{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:13px;background:linear-gradient(#9AF0A8,var(--green));border:2px solid #fff;font:800 20px/22px var(--f-num);color:#fff;text-align:center;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.bt.locked img{filter:grayscale(1) brightness(1.1) opacity(.45)}
.bt.locked .lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 12px/1 var(--f-ui);color:var(--ink)}
.bt.locked .lk svg{width:26px;height:26px}
.bt.na img{filter:grayscale(.7) opacity(.55)}
.bt.armed{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(255,190,60,.8),0 4px 0 #D9B47C}
.bt.armed img{transform:scale(1.1) rotate(-8deg)}
.bt.nudge{animation:nudge 1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateY(-8px) scale(1.06)}50%{transform:none}}

/* =================== OVERLAYS & POPUPS =================== */
.ov{position:absolute;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(40,20,8,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .22s ease}
.ov.clear{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
.ov.out{animation:fade .18s ease reverse forwards}
@keyframes fade{from{opacity:0}}
.pop{position:relative;width:min(338px,100%);max-height:calc(100cqh - 60px);border-radius:28px;border:3px solid var(--line);padding:46px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;
  background:linear-gradient(#fffdf6,var(--panel) 30%,#F8EBCF);box-shadow:inset 0 4px 0 #fff,0 8px 0 var(--line-d),0 9px 0 var(--line),0 22px 34px rgba(40,20,5,.45);animation:popin .26s cubic-bezier(.34,1.56,.64,1)}
.pop.tall{height:min(640px,calc(100cqh - 70px));margin-top:20px;padding-bottom:16px}
.pop.wide{width:min(400px,100%)}
@keyframes popin{from{transform:scale(.82);opacity:0}}
.ribbon{position:absolute;top:-26px;left:50%;transform:translateX(-50%);height:54px;min-width:200px;padding:0 26px;display:grid;place-items:center;border-radius:18px;border:3px solid #FFD56A;white-space:nowrap;
  background:linear-gradient(#78B1FF,#4C93F2 45%,var(--blue));box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 5px 0 var(--blue-o),0 10px 14px rgba(20,30,70,.35);font:700 27px/1 var(--f-hero);color:#fff;--o:var(--blue-o);z-index:2}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:16px;width:26px;height:34px;background:#2A63CC;z-index:-1;border-radius:4px}
.ribbon::before{left:-18px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}
.ribbon::after{right:-18px;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
.ribbon.green{background:linear-gradient(#9AF0A8,#53D96B 45%,#38B852);--o:var(--green-o);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 5px 0 var(--green-o),0 10px 14px rgba(20,60,30,.35)}
.ribbon.green::before,.ribbon.green::after{background:#2B9A47}
.ribbon.coral{background:linear-gradient(#FFB0A3,#FF735F 45%,#EC5440);--o:var(--coral-o);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 5px 0 var(--coral-o),0 10px 14px rgba(70,20,10,.35)}
.ribbon.coral::before,.ribbon.coral::after{background:#C63A28}
.ribbon.purple{background:linear-gradient(#D3B8FF,#A77AF4 45%,#8C5BE6);--o:var(--purple-o);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 5px 0 var(--purple-o),0 10px 14px rgba(40,20,70,.35)}
.ribbon.purple::before,.ribbon.purple::after{background:#6E44C6}
.xbtn{position:absolute;top:-14px;right:-12px;width:44px;height:44px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;z-index:3;
  background:radial-gradient(circle at 35% 30%,#FFB2A5,#F5604A 55%,#D5402C);box-shadow:0 4px 0 var(--coral-o),0 8px 10px rgba(0,0,0,.3);transition:transform .16s cubic-bezier(.34,1.9,.6,1)}
.xbtn:active{transform:scale(.9)}
.xbtn svg{width:18px;height:18px}
.ptext{font:700 16px/1.35 var(--f-ui);color:var(--ink);text-align:center;text-wrap:balance}
.ptitle{font:700 24px/1.1 var(--f-hero);color:var(--ink);text-align:center;text-wrap:balance}
.well{width:100%;border-radius:18px;padding:12px;background:#F3E1BE;box-shadow:inset 0 3px 5px rgba(120,70,30,.22),0 2px 0 #fff}
.row{display:flex;gap:10px;align-items:center;justify-content:center;width:100%}
.col{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.scroll{flex:1;min-height:0;overflow-y:auto;width:100%;padding:4px 2px 10px;scrollbar-width:thin}
.bigicon{width:110px;height:110px;filter:drop-shadow(0 6px 4px rgba(60,30,10,.3));animation:qbob 2.2s ease-in-out infinite}
.mods{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mod{display:flex;align-items:center;gap:5px;padding:5px 10px 5px 6px;border-radius:12px;background:#fff;border:2px solid #E4C48E;font:800 13px/1 var(--f-ui);color:var(--ink)}
.mod svg,.mod img{width:22px;height:22px}
.preb{display:flex;gap:12px;justify-content:center}
.preb .bt{width:72px;height:76px}
#toast,.toast{pointer-events:none}
.preb .bt.on{border-color:var(--green);box-shadow:0 0 0 3px var(--green),0 4px 0 #2B9A47,0 8px 14px rgba(40,120,60,.35)}
.preb .bt .tick{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:13px;background:linear-gradient(#9AF0A8,var(--green));border:2px solid #fff;display:none;place-items:center}
.preb .bt.on .tick{display:grid}
.preb .bt .tick svg{width:14px;height:14px}
.lbl{font:800 12px/1 var(--f-ui);letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.thumb{position:relative;width:132px;aspect-ratio:1;border-radius:12px;padding:7px;background:linear-gradient(135deg,#FFE9A3,#E2A93A 30%,#FFE08A 52%,#C98A1E 78%,#FFD56A);box-shadow:0 5px 0 #9A6114,0 10px 14px rgba(60,30,8,.35)}
.thumb .strips{border-radius:6px}

/* win */
#sGame .hud,#sGame .lvlrow,#sGame .bbar{transition:opacity .4s,transform .4s}
#sGame.won .hud,#sGame.won .lvlrow{opacity:0;transform:translateY(-30px);pointer-events:none}
#sGame.won .bbar{opacity:0;transform:translateY(40px);pointer-events:none}
#winWrap{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.winTitle{font:700 44px/1 var(--f-hero);color:var(--gold);text-align:center;
  text-shadow:0 3px 0 #6B3D1C,0 -2px 0 #6B3D1C,2.5px 0 0 #6B3D1C,-2.5px 0 0 #6B3D1C,2px 2px 0 #6B3D1C,-2px 2px 0 #6B3D1C,2px -2px 0 #6B3D1C,-2px -2px 0 #6B3D1C,0 7px 0 rgba(80,40,10,.35);animation:winIn .6s cubic-bezier(.34,1.7,.6,1)}
@keyframes winIn{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.winArt{aspect-ratio:1;max-width:100%;border-radius:18px;padding:10px;flex:none;
  background:linear-gradient(135deg,#FFE9A3,#E2A93A 30%,#FFE08A 52%,#C98A1E 78%,#FFD56A);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 8px 0 #9A6114,0 20px 34px rgba(60,30,8,.5);animation:artIn .5s cubic-bezier(.34,1.4,.6,1)}
.winArt i{display:block;width:100%;height:100%;border-radius:9px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.winArt i::after{content:"";position:absolute;inset:-20% -60%;background:linear-gradient(105deg,transparent 40%,rgba(255,245,210,.55) 50%,transparent 60%);transform:translateX(-80%);animation:sheen 1.6s cubic-bezier(.4,0,.2,1) .2s forwards}
@keyframes artIn{from{transform:scale(.92);opacity:0}}
#sGame #case{transition:left .9s cubic-bezier(.6,0,.2,1),top .9s cubic-bezier(.6,0,.2,1),width .9s cubic-bezier(.6,0,.2,1),height .9s cubic-bezier(.6,0,.2,1),opacity .35s}
#sGame.won2 #case{opacity:0}
.sheet{position:relative;width:100%;max-width:420px;flex:none;transition:opacity .35s,transform .45s cubic-bezier(.34,1.4,.6,1);border-radius:28px;border:3px solid var(--line);padding:16px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;
  background:linear-gradient(#fffdf6,var(--panel) 30%,#F8EBCF);box-shadow:inset 0 4px 0 #fff,0 8px 0 var(--line-d),0 -8px 30px rgba(40,20,5,.35);}
@keyframes sheetIn{from{transform:translateY(110%)}}
.sheet.pending{opacity:0;transform:translateY(40px);pointer-events:none}
.artname{font:700 22px/1.1 var(--f-hero);color:var(--ink);text-align:center}
.after{font:700 13px/1 var(--f-ui);color:var(--muted);font-style:italic}
.reward{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 8px;border-radius:20px;background:#F3E1BE;box-shadow:inset 0 2px 4px rgba(120,70,30,.22)}
.reward img{width:38px;height:38px}
.reward.bump{animation:bump .4s var(--pop)}
.reward .v{font-variant-numeric:tabular-nums;font:800 30px/1 var(--f-num);color:var(--gold);--o:var(--gold-o)}
.tiers{display:flex;gap:6px;align-items:center;font:800 13px var(--f-ui);color:var(--ink)}
.tier{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.2);display:grid;place-items:center;font:800 11px var(--f-num);color:#fff;opacity:.35}
.tier.on{opacity:1}
.tier.b{background:linear-gradient(#F0B98A,#B8743F)}.tier.s{background:linear-gradient(#F3F6FA,#A9B4C2)}.tier.g{background:linear-gradient(#FFE9A3,#E2A93A)}

/* tip bubble + hand */
#tip{position:absolute;left:16px;right:16px;top:132px;z-index:80;padding:12px 16px;border-radius:20px;border:3px solid var(--line);background:linear-gradient(#fffdf6,var(--panel));box-shadow:0 5px 0 #CFA36C,0 10px 18px rgba(40,20,5,.35);
  font:700 16px/1.3 var(--f-ui);color:var(--ink);text-align:center;animation:popin .3s cubic-bezier(.34,1.56,.64,1);display:flex;gap:10px;align-items:center}
#tip img{width:44px;height:44px;flex:none}
#tip b{color:var(--blue)}
#hand{position:absolute;z-index:85;width:54px;height:66px;pointer-events:none;left:0;top:0;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}
#fx{position:absolute;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.pt{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);background:var(--c);border-radius:2px;animation:pt var(--d) cubic-bezier(.2,.7,.3,1) forwards}
.pt.star{clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%)}
@keyframes pt{0%{transform:translate(0,0) scale(.4) rotate(0)}20%{transform:translate(calc(var(--x)*.4),calc(var(--y)*.4)) scale(1.1) rotate(60deg)}100%{transform:translate(var(--x),calc(var(--y) + var(--g))) scale(.2) rotate(240deg);opacity:0}}
.flytext{position:absolute;z-index:210;font:700 34px/1 var(--f-hero);color:#fff;--o:var(--purple-o);white-space:nowrap;transform:translate(-50%,-50%);animation:flyt 1.1s cubic-bezier(.34,1.6,.6,1) forwards}
@keyframes flyt{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{transform:translate(-50%,-80%) scale(1)}100%{transform:translate(-50%,-130%) scale(.9);opacity:0}}
#toast{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);z-index:220;max-width:calc(100% - 40px);padding:10px 16px;border-radius:16px;background:rgba(48,26,12,.92);color:#fff;font:700 15px/1.3 var(--f-ui);text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.35);animation:popin .25s cubic-bezier(.34,1.56,.64,1)}

/* lists (gallery / shop / league / daily) */
.album{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.albumHead{display:flex;justify-content:space-between;align-items:center;font:700 18px var(--f-hero);color:var(--ink)}
.albumHead small{font:800 13px var(--f-ui);color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gcard{position:relative;border-radius:12px;padding:6px;background:linear-gradient(135deg,#FFE9A3,#E2A93A 30%,#FFE08A 52%,#C98A1E 78%,#FFD56A);box-shadow:0 4px 0 #9A6114,0 8px 10px rgba(60,30,8,.3)}
.gcard.t1{background:linear-gradient(135deg,#F8D0A8,#B8743F 40%,#F0B98A 60%,#8E5228);box-shadow:0 4px 0 #6B3A18,0 8px 10px rgba(60,30,8,.3)}
.gcard.t2{background:linear-gradient(135deg,#FFFFFF,#A9B4C2 40%,#F3F6FA 60%,#7F8B9A);box-shadow:0 4px 0 #5D6876,0 8px 10px rgba(60,30,8,.3)}
.gcard.t0{background:linear-gradient(#CDBBA4,#A99278);box-shadow:0 4px 0 #7B6855}
.gcard i{display:block;aspect-ratio:1;border-radius:6px;background-size:cover}
.gcard.t0 i{filter:brightness(.15) sepia(1) blur(3px)}
.gcard .nm{font:800 12px/1.2 var(--f-ui);color:#fff;text-align:center;margin-top:5px;text-shadow:0 1px 2px rgba(0,0,0,.55);min-height:29px;display:grid;place-items:center}
.gcard .lq{position:absolute;inset:6px 6px auto;aspect-ratio:1;display:grid;place-items:center;font:700 40px var(--f-hero);color:#fff;--o:#5a4632}
.shopItem{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:#fff;border:2px solid #E4C48E;box-shadow:0 3px 0 #E2C08F;margin-bottom:10px}
.shopItem .ic{width:56px;height:56px;flex:none;display:grid;place-items:center;position:relative}
.shopItem .ic img{width:54px;height:54px;filter:drop-shadow(0 3px 2px rgba(60,30,10,.25))}
.shopItem .ic img+img{position:absolute;width:34px;height:34px;right:-8px;bottom:-6px}
.shopItem .tx{flex:1;min-width:0}
.shopItem .tx b{display:block;font:700 17px/1.1 var(--f-hero);color:var(--ink)}
.shopItem .tx small{display:block;font:700 13px/1.25 var(--f-ui);color:var(--muted);margin-top:2px}
.shopItem .btn{min-height:42px;padding:0 12px;font-size:18px;border-radius:14px;flex:none}
.starter{width:100%;border-radius:22px;padding:14px;margin-bottom:12px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#B48CFF,#7A4FD3);border:3px solid #FFD56A;box-shadow:0 5px 0 var(--purple-o),inset 0 3px 0 rgba(255,255,255,.35)}
.starter h4{margin:0;font:700 22px var(--f-hero);--o:var(--purple-o)}
.starter .items{display:flex;gap:10px;margin:10px 0;align-items:flex-end}
.starter .items div{display:flex;flex-direction:column;align-items:center;font:800 14px var(--f-num)}
.starter .items img{width:44px;height:44px}
.starter .tag{position:absolute;top:12px;right:-30px;transform:rotate(35deg);background:var(--coral);padding:3px 34px;font:800 12px var(--f-ui)}
.sect{width:100%;font:700 18px var(--f-hero);color:var(--ink);margin:6px 0 8px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:#fff;border:2px solid #EAD3A8;margin-bottom:6px;font:700 15px var(--f-ui)}
.lrow .rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--f-num);color:#fff;background:#C9B9A6;flex:none}
.lrow .rk.r1{background:linear-gradient(#FFE9A3,#E2A93A)}.lrow .rk.r2{background:linear-gradient(#F3F6FA,#A9B4C2)}.lrow .rk.r3{background:linear-gradient(#F0B98A,#B8743F)}
.lrow .av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 15px var(--f-hero);color:#fff;flex:none}
.lrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.lrow .pts{font:800 17px var(--f-num);color:var(--ink);font-variant-numeric:tabular-nums}
.lrow.me{background:linear-gradient(#E6F7FF,#C9EBFF);border-color:var(--sky)}
.zone{font:800 11px var(--f-ui);letter-spacing:.8px;text-transform:uppercase;text-align:center;padding:4px;margin:2px 0 8px;border-radius:8px}
.zone.up{color:#1F7E3B;background:#D8F7DD}.zone.dn{color:#A8301F;background:#FFE0DA}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.day{position:relative;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:2px solid #E4C48E;box-shadow:0 3px 0 #E2C08F;font:800 13px var(--f-ui);color:var(--ink)}

.book .cover{inset:0;z-index:4;overflow:hidden;pointer-events:none;border-radius:6px;container-type:size;display:block;font-size:0;color:transparent;
  --ct:min(calc(100cqw * 94 / 332),11cqh);--cb:min(calc(100cqw * 126 / 332),14cqh);
