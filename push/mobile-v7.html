<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Push Tiles · v8 · 3 levels (images only)</title>
<link rel="stylesheet" href="mobile-v7.css" />
</head>
<body>

  <div class="phone">
    <div class="phone-notch"></div>
    <div class="screen">

      <div class="hud">
        <div class="title">PUSH TILES</div>
        <div class="level-tabs">
          <button class="lvl-tab active" data-level="easy">Easy</button>
          <button class="lvl-tab" data-level="medium">Med</button>
          <button class="lvl-tab" data-level="hard">Hard</button>
        </div>
        <div class="moves">Ходов: <b id="moves">0</b></div>
        <button id="restart" title="Перезапуск">↻</button>
      </div>

      <div class="board">
        <div class="row checks-row" id="checks-top"></div>
        <div class="grid" id="grid"></div>
        <div class="row checks-row" id="checks-bottom"></div>
      </div>

      <div class="hand-area">
        <div class="hand-label">В РУКЕ</div>
        <div class="hand" id="hand"></div>
        <div class="hint">Колонка красится, когда тема собрана.<br/>Верни ★ в руку — победа.</div>
      </div>

      <div class="modal hidden" id="modal">
        <div class="modal-content">
          <div class="modal-title" id="modal-title">ПОБЕДА!</div>
          <div class="modal-sub" id="modal-sub">Отличная сортировка</div>
          <button id="modal-restart">Играть снова</button>
        </div>
      </div>

    </div>
  </div>

  <script src="game-mobile-v7.js"></script>
</body>
</html>
