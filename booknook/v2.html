<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Book Nook — v2</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:linear-gradient(180deg,#54301c 0%,#452617 45%,#331a0e 100%);}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }

  #bg{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .ripple{position:absolute;border:2px solid rgba(255,205,130,.07);border-radius:50%;
          animation:rip 9s linear infinite;}
  @keyframes rip{0%{transform:scale(.2);opacity:0}15%{opacity:.6}100%{transform:scale(1.6);opacity:0}}
  .glint{position:absolute;width:46px;height:8px;border-radius:6px;background:rgba(255,214,150,.07);
         transform:rotate(-12deg);}

  /* ===== HOME ===== */
  #home{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
        padding:40px 20px;color:#eafcff;}
  #home h1{margin:18px 0 2px;font-size:44px;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.25);}
  #home .sub{opacity:.75;margin-bottom:8px;font-size:15px;}
  #map{position:relative;width:340px;max-width:94%;height:560px;max-height:calc(100% - 130px);
       flex:0 0 auto;margin:auto 0;}
  .lvbtn{position:absolute;width:26%;aspect-ratio:1;border:none;cursor:pointer;background:transparent;padding:0;}
  .lvbtn .cover{position:absolute;inset:6px;border-radius:5px 11px 11px 5px;background:var(--cv,#a04a33);
        box-shadow:inset 9px 0 0 rgba(0,0,0,.28), inset -3px 3px 6px rgba(255,255,255,.18),
                   0 7px 12px rgba(0,0,0,.4);}
  .lvbtn .cover::after{content:'';position:absolute;left:20px;right:9px;top:16px;bottom:16px;
        border:2px solid rgba(255,240,205,.5);border-radius:6px;}
  .lvbtn span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
              font-size:30px;font-weight:800;color:#fdf1d2;padding-left:9px;text-shadow:0 2px 0 rgba(0,0,0,.3);}
  .lvbtn:active{transform:scale(.93);}
  #map path.trail{stroke:rgba(255,225,170,.32);stroke-width:4;stroke-dasharray:2 12;stroke-linecap:round;fill:none;}
  .homefrog{position:absolute;font-size:30px;transform:scaleX(-1);}

  /* ===== GAME ===== */
  #game{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;}
  #hud{width:100%;padding:14px 16px;z-index:3;display:flex;align-items:center;gap:10px;color:#eafcff;}
  .hbtn{width:42px;height:42px;border-radius:13px;border:none;background:rgba(0,0,0,.25);color:#eafcff;
        font-size:20px;cursor:pointer;flex:0 0 auto;}
  .hbtn:active{transform:scale(.92);}
  #lvlName{font-weight:800;font-size:18px;flex:1;text-align:center;}
  #goalBox{background:rgba(0,0,0,.25);border-radius:13px;padding:7px 12px;font-weight:800;font-size:17px;
           display:flex;align-items:center;gap:6px;}
  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  #board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center;}
  .cell{position:absolute;border-radius:10px;
        background:linear-gradient(180deg,#2c170c 0%,#241108 60%,#1d0d06 100%);
        box-shadow:inset 0 6px 14px rgba(0,0,0,.55), inset 0 -2px 5px rgba(255,190,120,.07),
                   0 1px 0 rgba(255,205,140,.10);}
  .cell.hl{background:linear-gradient(180deg,#4a2c14,#3a2010);
        box-shadow:inset 0 0 0 4px rgba(255,214,130,.55), inset 0 6px 14px rgba(0,0,0,.4);}
  .rock{position:absolute;border-radius:12px;
        background:linear-gradient(160deg,#cbb188 0%,#b89a6e 55%,#a3855c 100%);
        box-shadow:0 6px 10px rgba(0,0,0,.35), inset 0 3px 5px rgba(255,255,255,.3),
                   inset 0 -4px 8px rgba(0,0,0,.18);}
  .rock::before{content:'';position:absolute;left:0;right:0;top:44%;height:14%;
        background:rgba(146,84,60,.65);box-shadow:0 -2px 0 rgba(0,0,0,.08);}
  .rock::after{content:'';position:absolute;top:0;bottom:0;left:44%;width:14%;
        background:rgba(146,84,60,.65);}
  .pad{position:absolute;transition:transform .18s ease;}
  .pad svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 7px 8px rgba(0,0,0,.28));}
  @keyframes padpop{0%{transform:scale(.4)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
  .pad.pop{animation:padpop .28s ease;}
  @keyframes padsink{0%{transform:scale(1);opacity:1}100%{transform:scale(.25) rotate(35deg);opacity:0}}
  .pad.sink{animation:padsink .5s ease forwards;}
  @keyframes padrise{0%{transform:translateY(52px);opacity:0}100%{transform:translateY(0);opacity:1}}
  .pad.rise{animation:padrise .4s ease-out;}
  .layerTag{position:absolute;z-index:8;transform:translateX(-50%);pointer-events:none;
        background:rgba(0,0,0,.55);color:#ffe9b8;font-weight:800;font-size:21px;
        padding:4px 12px;border-radius:11px;box-shadow:0 2px 5px rgba(0,0,0,.4);}

  .frog{position:absolute;width:20px;height:64px;z-index:6;will-change:transform,left,top;}
  .frog .spine{position:absolute;inset:0;border-radius:3px 6px 6px 3px;
        background:linear-gradient(90deg,
          color-mix(in srgb,var(--c) 62%,#000) 0%,
          color-mix(in srgb,var(--c) 88%,#000) 18%,
          var(--c) 45%,
          var(--c) 72%,
          color-mix(in srgb,var(--c) 78%,#fff) 100%);
        box-shadow:0 3px 4px rgba(0,0,0,.35), inset 1px 0 0 rgba(0,0,0,.25);}
  .frog .spine::before,.frog .spine::after{content:'';position:absolute;left:3px;right:3px;height:3px;
        border-radius:2px;background:rgba(255,243,214,.8);}
  .frog .spine::before{top:7px;box-shadow:0 5px 0 rgba(255,243,214,.45);}
  .frog .spine::after{bottom:9px;box-shadow:0 -5px 0 rgba(255,243,214,.35);}

  /* очередь */
  #tray{width:100%;padding:8px 14px 20px;z-index:3;display:flex;justify-content:center;gap:14px;}
  .qslot{width:96px;height:96px;border-radius:14px;
         background:linear-gradient(180deg,#2c170c,#1f0e06);
         box-shadow:inset 0 5px 12px rgba(0,0,0,.5), 0 1px 0 rgba(255,205,140,.12);position:relative;}
  .qpad{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;
        transform:scale(.58);cursor:grab;touch-action:none;}
  .qpad svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));}
  .qpad .frog{pointer-events:none;}
  #dragGhost{position:absolute;z-index:30;pointer-events:none;display:none;}
  #dragGhost .frog{pointer-events:none;}

  /* попапы */
  .ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
      background:rgba(6,20,26,.55);backdrop-filter:blur(3px);}
  .card{background:#fdf6e8;border-radius:26px;padding:28px 30px;text-align:center;min-width:250px;
        box-shadow:0 24px 60px rgba(0,0,0,.45);color:#4a2a16;}
  .card h2{margin:0 0 6px;font-size:28px;}
  .card p{margin:0 0 18px;opacity:.75;font-size:16px;}
  .card button{border:none;border-radius:15px;padding:13px 26px;font-size:18px;font-weight:800;
        cursor:pointer;background:#c0693b;color:#fff;margin:0 5px;box-shadow:0 4px 0 #8f4a26;}
  .card button.gray{background:#a89684;box-shadow:0 4px 0 #7d6e5f;}
  .card button:active{transform:translateY(2px);box-shadow:none;}

  @keyframes splashUp{0%{transform:translateY(0) scale(.6);opacity:.95}100%{transform:translateY(-46px) scale(1.5);opacity:0}}
  .splash{position:absolute;z-index:12;font-size:24px;pointer-events:none;animation:splashUp .6s ease forwards;}
  @keyframes toastIn{0%{transform:translate(-50%,10px);opacity:0}20%{opacity:1}80%{opacity:1;transform:translate(-50%,-6px)}100%{opacity:0;transform:translate(-50%,-14px)}}
  #toast{position:absolute;left:50%;bottom:150px;z-index:15;transform:translate(-50%,0);display:none;
         background:rgba(0,0,0,.5);color:#fff;font-weight:800;padding:9px 18px;border-radius:14px;font-size:17px;}
</style>

<body>
<div id="phone">
  <div id="bg"></div>

  <!-- скрытые шаблоны SVG -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="padGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c99257"/><stop offset="45%" stop-color="#a9744a"/>
        <stop offset="100%" stop-color="#7d5231"/>
      </linearGradient>
      <g id="padShape">
        <!-- деревянная полочка-подставка: доска внизу, книги стоят на ней -->
        <rect x="3.5" y="79" width="93" height="10" rx="3" fill="url(#padGrad)" stroke="#5e3c22" stroke-width="1.6"/>
        <rect x="6" y="81" width="88" height="2" rx="1" fill="rgba(255,235,200,.35)"/>
        <rect x="8" y="89" width="84" height="3" rx="1.5" fill="rgba(0,0,0,.25)"/>
      </g>
    </defs>
  </svg>

  <div id="home">
    <h1>📚 Book Nook</h1>
    <div class="sub">Собери 6 одинаковых книг на одной полке</div>
    <div id="map"></div>
  </div>

  <div id="game">
    <div id="hud">
      <button class="hbtn" id="btnHome">🏠</button>
      <div id="lvlName">Уровень 1</div>
      <div id="goalBox">📕 <span id="goalTxt">0/3</span></div>
      <button class="hbtn" id="btnRetry">↻</button>
    </div>
    <div id="stage"><div id="board"></div></div>
    <div id="tray"></div>
  </div>

  <div id="dragGhost"></div>
  <div id="toast"></div>

  <div class="ov" id="ovWin"><div class="card">
    <h2>📚 Порядок в библиотеке!</h2><p id="winTxt">Все комплекты собраны</p>
    <button class="gray" id="wHome">🏠</button><button id="wNext">Дальше ➜</button>
  </div></div>
  <div class="ov" id="ovLose"><div class="card">
    <h2>📚 Полки забиты</h2><p>Не осталось места для книг</p>
    <button class="gray" id="lHome">🏠</button><button id="lRetry">Ещё раз ↻</button>
  </div></div>
</div>

<script>
'use strict';
/* ============================================================
   Book Nook v2 — как v1 (перелёты книг между соседними полочками,
   6 одинаковых = комплект, полочка убирается), плюс:
   - стеллаж предзаполнен на ~80% (полки уже стоят; расстановка
     стабильная: у соседей нет общих цветов, автокаскада на старте нет);
   - «слои» на ур.2-5: у помеченных отсеков после освобождения снизу
     выезжает ещё одна предзаполненная полочка (на 5-м есть отсек ×3 —
     его нужно освободить трижды).
   ============================================================ */

const COLORS = ['#ff6b6b','#ffd93d','#5ac8fa','#b388ff','#ff9f43','#ff8fce'];

/* prefill: доля предзаполненных отсеков; layers: {клетка: сколько всего слоёв}
   Победа = комплекты (goal) И каждый слоёный отсек освобождён layers[i] раз.
   Винрейт жадного бота (botStats, 300 игр): 94/73/63/39/23 % — рампа со спайком на 5-м */
const LEVELS = [
  {cols:3, rows:3, colors:3, goal:3, rocks:[], prefill:.8, layers:{}},
  {cols:3, rows:3, colors:4, goal:5, rocks:[], prefill:.8, layers:{1:2}},
  {cols:3, rows:4, colors:4, goal:7, rocks:[], prefill:.8, layers:{4:2,7:2}},
  {cols:3, rows:4, colors:5, goal:8, rocks:[], prefill:.8, layers:{1:2,10:2}},
  {cols:3, rows:4, colors:5, goal:9, rocks:[4], prefill:.8, layers:{7:3,10:2}}, // спайк: камень + тройной слой
];

const CELL=150, GAP=16, PAD=140, FROG_W=20, FROG_H=64;
// книги стоят в ряд на доске: 6 слотов слева направо, низ книги на полке
// (доска в padShape: верх на y=79 из 100 → 110.6px из 140; центр книги y = 110.6 - 32 ≈ 78.6 → s.y=8.6)
const SEATS=[...Array(6)].map((_,k)=>({x:(k-2.5)*22, y:8.6, rot:0}));

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- ЧИСТАЯ ЛОГИКА (общая для игры и бота) ---------- */
function neighbors(i,L){const c=i%L.cols,r=(i/L.cols)|0,res=[];
  if(c>0)res.push(i-1); if(c<L.cols-1)res.push(i+1);
  if(r>0)res.push(i-L.cols); if(r<L.rows-1)res.push(i+L.cols); return res;}

function cnt(arr,c){let n=0;for(const x of arr)if(x===c)n++;return n;}

// cells: (null|'rock'|color[])[] → лучший перескок или null
function nextTransfer(cells,L){
  let best=null;
  for(let i=0;i<cells.length;i++){
    const A=cells[i]; if(!Array.isArray(A))continue;
    for(const j of neighbors(i,L)){
      if(j<i)continue;
      const B=cells[j]; if(!Array.isArray(B))continue;
      const shared=[...new Set(A)].filter(c=>B.includes(c));
      for(const c of shared){
        const ca=cnt(A,c), cb=cnt(B,c);
        let from,to;
        if(ca>cb){from=j;to=i;}
        else if(cb>ca){from=i;to=j;}
        else{
          const oa=A.length-ca, ob=B.length-cb;
          if(oa<ob){from=j;to=i;} else if(ob<oa){from=i;to=j;} else {from=j;to=i;}
        }
        const src=cells[from], dst=cells[to];
        const space=6-dst.length; if(space<=0)continue;
        const move=Math.min(cnt(src,c),space); if(move<=0)continue;
        const dstC=cnt(dst,c), dstOther=dst.length-dstC;
        const completes=(dstOther===0 && dstC+move===6)?1:0;
        const score=completes*1000 + move*10 + dstC;
        if(!best||score>best.score)best={from,to,c,move,score};
      }
    }
  }
  return best;
}

function applyTransfer(cells,t){ // на массивах цветов; возвращает индексы убранных
  const src=cells[t.from];
  let moved=0;
  for(let k=src.length-1;k>=0 && moved<t.move;k--)
    if(src[k]===t.c){src.splice(k,1);moved++;}
  for(let m=0;m<moved;m++)cells[t.to].push(t.c);
}

function findComplete(cells){
  const res=[];
  for(let i=0;i<cells.length;i++){
    const p=cells[i];
    if(Array.isArray(p)&&p.length===6&&p.every(c=>c===p[0]))res.push(i);
  }
  return res;
}

function genPad(rng,L,colorCounts,maxPerPad,forceMono){
  const n=2+Math.floor(rng()*3); // 2..4 книги
  // активные цвета (недособранные семьи на поле) сильно приоритетнее:
  // калибровано ботом 2026-08-30, иначе поле забивается разноцветьем
  // вес цвета = насколько его лучшая стопка близка к комплекту:
  // очередь приносит «завершители», иначе набитое поле не разгрузить
  const w=[];
  for(let c=0;c<L.colors;c++){
    const mx=maxPerPad?(maxPerPad[c]||0):((colorCounts[c]||0)%6);
    w.push(mx>0?1+mx*2.2:0.6);
  }
  const pick=()=>{let s=w.reduce((a,b)=>a+b,0),r=rng()*s;
    for(let c=0;c<w.length;c++){r-=w[c];if(r<=0)return c;}return w.length-1;};
  // спасательное правило: когда отсеков почти нет, приходят только моно-полки;
  // трёхцветные полки — только на уровнях с 5+ цветами
  let distinct=forceMono?1:(rng()<.62?1:(rng()<.92||L.colors<5?2:3));
  distinct=Math.min(distinct,n,L.colors);
  const chosen=[];let guard=0;
  while(chosen.length<distinct&&guard++<60){const c=pick();if(!chosen.includes(c))chosen.push(c);}
  const frogs=[];
  for(let k=0;k<distinct;k++)frogs.push(chosen[k]);
  while(frogs.length<n)frogs.push(chosen[Math.floor(rng()*distinct)]);
  for(let k=frogs.length-1;k>0;k--){const j=Math.floor(rng()*(k+1));[frogs[k],frogs[j]]=[frogs[j],frogs[k]];}
  return frogs;
}

function boardColorCounts(cells,nColors){
  const cc=Array(nColors).fill(0);
  for(const p of cells)if(Array.isArray(p))for(const c of p)cc[c]++;
  return cc;
}

// лучшая (максимальная) стопка каждого цвета среди полочек на поле
function boardMaxPerPad(cells,nColors){
  const mx=Array(nColors).fill(0);
  for(const p of cells)if(Array.isArray(p))for(const c of new Set(p))mx[c]=Math.max(mx[c],cnt(p,c));
  return mx;
}

/* Предзаполнение стеллажа: ~prefill доля отсеков занята, расстановка стабильная
   (у ортогональных соседей нет общих цветов → на старте нет автокаскада).
   Клетки со слоями входят в предзаполнение обязательно; их дополнительные
   слои генерируются здесь же (детерминированно от rng — бот видит то же). */
function genPrefill(rng,L){
  const N=L.cols*L.rows;
  const cells=Array(N).fill(null);
  for(const r of L.rocks)cells[r]='rock';
  const free=[];for(let i=0;i<N;i++)if(cells[i]===null)free.push(i);
  for(let k=free.length-1;k>0;k--){const j=Math.floor(rng()*(k+1));[free[k],free[j]]=[free[j],free[k]];}
  const layerCells=Object.keys(L.layers||{}).map(Number);
  const target=Math.max(Math.round(free.length*(L.prefill||0)),layerCells.length);
  const chosen=new Set(layerCells);
  for(const i of free){if(chosen.size>=target)break;chosen.add(i);}
  // моно-полки (стопка одинаковых книг 2-4): поставленная игроком полка того же
  // цвета сразу сливается с соседней — иначе поле с 80% заполнением непроходимо
  for(const i of chosen){
    const nb=new Set();
    for(const j of neighbors(i,L))if(Array.isArray(cells[j]))for(const c of cells[j])nb.add(c);
    const avail=[];for(let c=0;c<L.colors;c++)if(!nb.has(c))avail.push(c);
    if(!avail.length)continue;
    const c=avail[Math.floor(rng()*avail.length)];
    cells[i]=Array(3+Math.floor(rng()*2)).fill(c); // стопка 3-4: две такие = почти комплект
  }
  const layers=Array(N).fill(null);
  const cc=boardColorCounts(cells,L.colors),mp=boardMaxPerPad(cells,L.colors);
  for(const k of layerCells){
    const extra=Math.max(0,(L.layers[k]|0)-1),arr=[];
    for(let m=0;m<extra;m++)arr.push(genPad(rng,L,cc,mp));
    layers[k]=arr;
  }
  return {cells,layers};
}

/* ---------- СИМУЛЯЦИЯ (для бота/калибровки) ---------- */
function simResolve(cells,L,layers,freed){
  let cleared=0,guard=0;
  while(guard++<400){
    let changed=false;
    // опустевшая полочка убирается — отсек освобождается
    for(let i=0;i<cells.length;i++)
      if(Array.isArray(cells[i])&&cells[i].length===0){cells[i]=null;changed=true;if(freed)freed[i]++;}
    for(const i of findComplete(cells)){cells[i]=null;cleared++;changed=true;if(freed)freed[i]++;}
    // из освободившегося отсека со слоями выезжает следующая полочка
    if(layers)for(let i=0;i<cells.length;i++)
      if(cells[i]===null&&layers[i]&&layers[i].length){cells[i]=layers[i].shift().slice();changed=true;}
    if(changed)continue;
    const t=nextTransfer(cells,L); if(!t)break;
    applyTransfer(cells,t);
  }
  return cleared;
}

/* победа = комплекты собраны И каждый слоёный отсек освобождён нужное число раз */
function layersGoal(L){let s=0;for(const k in (L.layers||{}))s+=L.layers[k]|0;return s;}
function layersDone(L,freed){let s=0;for(const k in (L.layers||{}))s+=Math.min(freed[+k]||0,L.layers[k]|0);return s;}
function goalMet(progress,L,freed){return progress>=L.goal&&layersDone(L,freed)>=layersGoal(L);}

function botPlay(levelIdx,seed){
  const L=LEVELS[levelIdx], rng=mulberry32(seed);
  const N=L.cols*L.rows;
  const pre=genPrefill(rng,L);
  const cells=pre.cells.map(p=>Array.isArray(p)?p.slice():p);
  const layers=pre.layers.map(a=>a?a.map(p=>p.slice()):null);
  const freed=Array(N).fill(0);
  let queue=[],progress=0,placements=0;
  const refill=()=>{const cc=boardColorCounts(cells,L.colors),mp=boardMaxPerPad(cells,L.colors);
    const tight=cells.filter(c=>c===null).length<=(N<=9?3:2);
    queue=[genPad(rng,L,cc,mp,tight),genPad(rng,L,cc,mp,tight),genPad(rng,L,cc,mp,tight)];};
  refill();
  while(placements<400){
    if(goalMet(progress,L,freed))return{win:true,placements};
    const empt=[];for(let i=0;i<N;i++)if(cells[i]===null)empt.push(i);
    if(!empt.length)return{win:false,placements};
    // жадный выбор: (pad × cell) с лучшим счётом после симуляции
    let best=null;
    for(let q=0;q<queue.length;q++){
      if(!queue[q])continue;
      for(const cell of empt){
        const sim=cells.map(p=>Array.isArray(p)?p.slice():p);
        const simLayers=layers.map(a=>a?a.map(p=>p.slice()):null);
        const simFreed=freed.slice();
        sim[cell]=queue[q].slice();
        const cl=simResolve(sim,L,simLayers,simFreed);
        let conc=0,pads=0;
        for(const p of sim)if(Array.isArray(p)){pads++;
          let mx=0;for(const c of new Set(p))mx=Math.max(mx,cnt(p,c));conc+=mx*mx;}
        const layerGain=layersDone(L,simFreed)-layersDone(L,freed);
        const score=cl*1e5+layerGain*2e4+conc*10-pads*40;
        if(!best||score>best.score)best={q,cell,score};
      }
    }
    const pad=queue[best.q];queue[best.q]=null;
    cells[best.cell]=pad.slice();
    progress+=simResolve(cells,L,layers,freed);placements++;
    if(queue.every(x=>!x))refill();
  }
  return{win:goalMet(progress,L,freed),placements};
}

function botStats(levelIdx,games=100,seed0=1){
  let wins=0,pl=[];
  for(let g=0;g<games;g++){const r=botPlay(levelIdx,seed0+g*7919);
    if(r.win)wins++;pl.push(r.placements);}
  pl.sort((a,b)=>a-b);
  return{level:levelIdx+1,winrate:wins/games,medianPlacements:pl[games>>1]};
}

/* ---------- ИГРА (DOM) ---------- */
const $=id=>document.getElementById(id);
const boardEl=$('board'),stageEl=$('stage'),trayEl=$('tray');
let G=null, lock=false, frogSeq=1, padSeq=1;

function padSVG(){return `<svg viewBox="0 0 100 100"><use href="#padShape"/></svg>`;}

function frogEl(color){
  const d=document.createElement('div');d.className='frog';
  d.style.setProperty('--c',COLORS[color]);
  d.innerHTML=`<div class="spine"></div>`;
  return d;
}

function cellXY(i,L){const c=i%L.cols,r=(i/L.cols)|0;
  return{x:c*(CELL+GAP),y:r*(CELL+GAP)};}

function fit(){
  if(!G)return;
  const sw=stageEl.clientWidth-24, sh=stageEl.clientHeight-24;
  if(!boardEl.offsetWidth)return;
  const s=Math.max(.3,Math.min(sw/boardEl.offsetWidth,sh/boardEl.offsetHeight,1.4));
  boardEl.style.transform=`translate(-50%,-50%) scale(${s})`;
  G.scale=s;
}
window.addEventListener('resize',fit);

function startLevel(idx){
  const L=LEVELS[idx];
  G={idx,L,cells:Array(L.cols*L.rows).fill(null),queue:[null,null,null],
     progress:0,scale:1,pads:{},frogs:{},layers:Array(L.cols*L.rows).fill(null),layerEls:{},
     freed:Array(L.cols*L.rows).fill(0)};
  for(const r of L.rocks)G.cells[r]='rock';
  G.rng=mulberry32(Date.now()%2147483647||42);
  const pre=genPrefill(G.rng,L);
  G.layers=pre.layers;
  $('home').style.display='none';$('game').style.display='flex';
  $('ovWin').style.display='none';$('ovLose').style.display='none';
  $('lvlName').textContent='Уровень '+(idx+1);
  buildBoard();
  for(let i=0;i<pre.cells.length;i++)
    if(Array.isArray(pre.cells[i]))mountPad(i,pre.cells[i],false);
  for(let i=0;i<G.layers.length;i++)updateLayerTag(i);
  refillQueue();updateHUD();
  requestAnimationFrame(fit);
  lock=false;
}

/* бейдж «сколько ещё слоёв выедет снизу» */
function updateLayerTag(i){
  const n=G.layers[i]?G.layers[i].length:0;
  let el=G.layerEls[i];
  if(!n){if(el){el.remove();delete G.layerEls[i];}return;}
  if(!el){
    el=document.createElement('div');el.className='layerTag';
    const {x,y}=cellXY(i,G.L);
    el.style.left=(x+CELL/2)+'px';el.style.top=(y+CELL-24)+'px';
    boardEl.appendChild(el);G.layerEls[i]=el;
  }
  el.textContent='📚+'+n;
}

function buildBoard(){
  const L=G.L;
  boardEl.innerHTML='';
  boardEl.style.width=(L.cols*CELL+(L.cols-1)*GAP)+'px';
  boardEl.style.height=(L.rows*CELL+(L.rows-1)*GAP)+'px';
  for(let i=0;i<G.cells.length;i++){
    const {x,y}=cellXY(i,L);
    if(G.cells[i]==='rock'){
      const rk=document.createElement('div');rk.className='rock';
      rk.style.cssText=`left:${x+18}px;top:${y+18}px;width:${CELL-36}px;height:${CELL-36}px;`;
      boardEl.appendChild(rk);
    }else{
      const el=document.createElement('div');el.className='cell';el.dataset.i=i;
      el.style.cssText=`left:${x+6}px;top:${y+6}px;width:${CELL-12}px;height:${CELL-12}px;`;
      boardEl.appendChild(el);
    }
  }
}

function makePadEl(frogColors){
  const pad=document.createElement('div');pad.className='pad';
  pad.style.width=PAD+'px';pad.style.height=PAD+'px';
  pad.innerHTML=padSVG();
  frogColors.forEach((c,k)=>{
    const f=frogEl(c);
    const s=SEATS[k];
    f.style.left=(PAD/2+s.x-FROG_W/2)+'px';
    f.style.top=(PAD/2+s.y-FROG_H/2)+'px';
    f.style.transform=`rotate(${s.rot}deg)`;
    pad.appendChild(f);
  });
  return pad;
}

/* --- очередь --- */
function refillQueue(){
  const cc=boardColorCounts(G.cells,G.L.colors),mp=boardMaxPerPad(G.cells,G.L.colors);
  const tight=G.cells.filter(c=>c===null).length<=(G.cells.length<=9?3:2);
  for(let q=0;q<3;q++)G.queue[q]=genPad(G.rng,G.L,cc,mp,tight);
  renderQueue();
}
function renderQueue(){
  trayEl.innerHTML='';
  G.queue.forEach((padColors,q)=>{
    const slot=document.createElement('div');slot.className='qslot';
    if(padColors){
      const p=makePadEl(padColors);p.classList.add('qpad');p.classList.remove('pad');
      p.dataset.q=q;
      p.addEventListener('pointerdown',onDragStart);
      slot.appendChild(p);
    }
    trayEl.appendChild(slot);
  });
}

/* --- drag & drop --- */
let drag=null;
function onDragStart(e){
  if(lock)return;
  const q=+e.currentTarget.dataset.q;
  if(!G.queue[q])return;
  e.preventDefault();
  const ghost=$('dragGhost');
  ghost.innerHTML='';
  const p=makePadEl(G.queue[q]);p.style.position='static';
  ghost.appendChild(p);
  const sc=G.scale;
  ghost.style.width=PAD+'px';ghost.style.height=PAD+'px';
  ghost.style.display='block';
  ghost.style.transformOrigin='center';
  drag={q,ghost,sc};
  e.currentTarget.style.opacity=.25;
  moveGhost(e);
  window.addEventListener('pointermove',moveGhost);
  window.addEventListener('pointerup',onDrop,{once:true});
}
function phonePoint(e){
  const pr=$('phone').getBoundingClientRect();
  return{x:e.clientX-pr.left,y:e.clientY-pr.top};
}
function moveGhost(e){
  if(!drag)return;
  const {x,y}=phonePoint(e);
  drag.ghost.style.left=(x-PAD/2)+'px';
  drag.ghost.style.top=(y-PAD/2-40)+'px'; // палец не закрывает
  drag.ghost.style.transform=`scale(${drag.sc})`;
  // подсветка ближайшей свободной клетки
  const cell=hitCell(e);
  document.querySelectorAll('.cell.hl').forEach(el=>el.classList.remove('hl'));
  if(cell!=null){
    const el=boardEl.querySelector(`.cell[data-i="${cell}"]`);
    if(el)el.classList.add('hl');
  }
}
function hitCell(e){
  const gr=drag?{x:e.clientX,y:e.clientY-40*1}:null;
  let best=null,bd=Infinity;
  document.querySelectorAll('.cell').forEach(el=>{
    const i=+el.dataset.i;
    if(G.cells[i]!==null)return;
    const r=el.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const d=Math.hypot(gr.x-cx,gr.y-cy);
    if(d<bd){bd=d;best={i,r};}
  });
  if(best&&bd<best.r.width*0.85)return best.i;
  return null;
}
async function onDrop(e){
  window.removeEventListener('pointermove',moveGhost);
  if(!drag)return;
  const {q}=drag;
  drag.ghost.style.display='none';
  document.querySelectorAll('.cell.hl').forEach(el=>el.classList.remove('hl'));
  const cell=hitCell(e);
  drag=null;
  if(cell==null||lock){renderQueue();return;}
  await placePad(q,cell);
}

/* --- размещение и каскад с анимацией --- */
function padScreenPos(i){const {x,y}=cellXY(i,G.L);return{x:x+(CELL-PAD)/2,y:y+(CELL-PAD)/2};}

function mountPad(i,frogColors,pop){
  const id='p'+(padSeq++);
  const el=makePadEl([]);
  const {x,y}=padScreenPos(i);
  el.style.left=x+'px';el.style.top=y+'px';
  if(pop)el.classList.add('pop');
  boardEl.appendChild(el);
  const frogs=frogColors.map((c,k)=>{
    const f=frogEl(c);const fid='f'+(frogSeq++);
    f.dataset.fid=fid;
    positionFrog(f,i,k);
    f.style.transition='left .3s ease,top .3s ease';
    boardEl.appendChild(f);
    return{fid,c,el:f};
  });
  G.pads[i]={id,el,frogs};
  G.cells[i]=frogColors.slice();
  return G.pads[i];
}
function positionFrog(f,cellI,seat){
  const {x,y}=padScreenPos(cellI);
  const s=SEATS[seat];
  f.style.left=(x+PAD/2+s.x-FROG_W/2)+'px';
  f.style.top=(y+PAD/2+s.y-FROG_H/2)+'px';
  f.style.transform=`rotate(${s.rot}deg)`;
}
function reseat(i){
  const p=G.pads[i];if(!p)return;
  p.frogs.forEach((fr,k)=>positionFrog(fr.el,i,k));
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function animateHop(t){
  const src=G.pads[t.from],dst=G.pads[t.to];
  // забираем t.move лягушек цвета t.c с конца
  const movers=[];
  for(let k=src.frogs.length-1;k>=0&&movers.length<t.move;k--)
    if(src.frogs[k].c===t.c)movers.push(src.frogs.splice(k,1)[0]);
  movers.forEach((fr,m)=>{
    dst.frogs.push(fr);
    const seat=dst.frogs.length-1;
    // прыжок: приподнять + переставить
    fr.el.animate([{transform:fr.el.style.transform+' translateY(0) scale(1)'},
                   {transform:fr.el.style.transform+' translateY(-26px) scale(1.15)',offset:.5},
                   {transform:fr.el.style.transform+' translateY(0) scale(1)'}],{duration:300,easing:'ease'});
    positionFrog(fr.el,t.to,seat);
  });
  reseat(t.from);
  applyTransfer(G.cells,t);
  await wait(230);
}

async function animateClear(i,family){
  const p=G.pads[i];
  const {x,y}=padScreenPos(i);
  if(family)splash(x+PAD/2,y+PAD/2);
  p.frogs.forEach((fr,k)=>{
    const a=(k/6)*Math.PI*2;
    fr.el.style.transition='left .45s ease-in,top .45s ease-in,opacity .45s';
    fr.el.style.left=(parseFloat(fr.el.style.left)+Math.cos(a)*120)+'px';
    fr.el.style.top=(parseFloat(fr.el.style.top)+Math.sin(a)*120)+'px';
    fr.el.style.opacity=0;
  });
  p.el.classList.add('sink');
  await wait(family?480:300);
  p.frogs.forEach(fr=>fr.el.remove());
  p.el.remove();
  delete G.pads[i];
  G.cells[i]=null;
  G.freed[i]++;
  if(family)G.progress++;
  updateHUD();
}

async function popLayer(i){
  const padColors=G.layers[i].shift();
  const p=mountPad(i,padColors,false);
  p.el.classList.add('rise');
  p.frogs.forEach(fr=>fr.el.animate(
    [{opacity:0,transform:fr.el.style.transform+' translateY(52px)'},
     {opacity:1,transform:fr.el.style.transform+' translateY(0)'}],
    {duration:400,easing:'ease-out'}));
  updateLayerTag(i);
  toast('📚 Снизу выехала новая полка!');
  await wait(430);
}

function splash(bx,by){
  const s=document.createElement('div');s.className='splash';s.textContent='✨';
  s.style.left=(bx-12)+'px';s.style.top=(by-12)+'px';
  boardEl.appendChild(s);setTimeout(()=>s.remove(),650);
}

function toast(msg){
  const t=$('toast');t.textContent=msg;t.style.display='block';
  t.style.animation='none';void t.offsetWidth;t.style.animation='toastIn 1.2s ease forwards';
  setTimeout(()=>t.style.display='none',1200);
}

async function placePad(q,cell){
  lock=true;
  const colors=G.queue[q];G.queue[q]=null;
  renderQueue();
  mountPad(cell,colors,true);
  await wait(180);
  // каскад
  let guard=0;
  while(guard++<400){
    // опустевшие полочки убираются, освобождая отсеки
    const empties=[];
    for(let i=0;i<G.cells.length;i++)
      if(Array.isArray(G.cells[i])&&G.cells[i].length===0)empties.push(i);
    if(empties.length){for(const i of empties)await animateClear(i,false);continue;}
    const done=findComplete(G.cells);
    if(done.length){
      toast('📚 Комплект собран!');
      for(const i of done)await animateClear(i,true);
      continue;
    }
    // из освободившихся отсеков со слоями выезжает следующая полочка
    const pops=[];
    for(let i=0;i<G.cells.length;i++)
      if(G.cells[i]===null&&G.layers[i]&&G.layers[i].length)pops.push(i);
    if(pops.length){for(const i of pops)await popLayer(i);continue;}
    const t=nextTransfer(G.cells,G.L);
    if(!t)break;
    await animateHop(t);
  }
  updateHUD();
  if(goalMet(G.progress,G.L,G.freed)){await wait(1000);showWin();return;}
  if(G.queue.every(x=>!x))refillQueue();
  const hasFree=G.cells.some(c=>c===null);
  if(!hasFree){showLose();return;}
  lock=false;
}

function updateHUD(){
  let txt=G.progress+'/'+G.L.goal;
  const need=layersGoal(G.L);
  if(need)txt+=' · 🗄'+layersDone(G.L,G.freed)+'/'+need; // слоёные отсеки тоже обязательны
  $('goalTxt').textContent=txt;
}

function showWin(){
  $('winTxt').textContent=G.idx<4?'Уровень '+(G.idx+1)+' пройден':'Все уровни пройдены!';
  $('wNext').textContent=G.idx<4?'Дальше ➜':'🏠 Домой';
  $('ovWin').style.display='flex';
}
function showLose(){$('ovLose').style.display='flex';}

/* --- home --- */
function buildHome(){
  const map=$('map');
  map.innerHTML=`<svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 340 560" preserveAspectRatio="none">
    <path class="trail" d="M60 500 C 200 470, 280 430, 260 370 C 240 310, 90 320, 80 250 C 72 190, 230 200, 250 130 C 262 85, 190 60, 160 60"/>
  </svg>`;
  const pos=[[16,456],[216,326],[36,206],[206,86],[116,16]];
  const covers=['#a04a33','#3f6f8e','#5f8a4a','#8a5fa0','#b3823c'];
  for(let i=0;i<5;i++){
    const b=document.createElement('button');b.className='lvbtn';
    b.style.left=(pos[i][0]/340*100)+'%';b.style.top=(pos[i][1]/560*100)+'%';
    b.style.setProperty('--cv',covers[i]);
    b.innerHTML=`<div class="cover"></div><span>${i+1}</span>`;
    b.addEventListener('click',()=>startLevel(i));
    map.appendChild(b);
  }
  const f=document.createElement('div');f.className='homefrog';
  f.style.left='38%';f.style.top='80%';f.textContent='🐈';
  map.appendChild(f);
}

/* --- фон --- */

$('btnHome').onclick=()=>{$('game').style.display='none';$('home').style.display='flex';};
$('btnRetry').onclick=()=>startLevel(G.idx);
$('wHome').onclick=()=>{$('ovWin').style.display='none';$('game').style.display='none';$('home').style.display='flex';};
$('wNext').onclick=()=>{$('ovWin').style.display='none';
  if(G.idx<4)startLevel(G.idx+1);else{$('game').style.display='none';$('home').style.display='flex';}};
$('lHome').onclick=()=>{$('ovLose').style.display='none';$('game').style.display='none';$('home').style.display='flex';};
$('lRetry').onclick=()=>startLevel(G.idx);

buildHome();

/* --- API для PLAY-проверки и калибровки --- */
window.__game={
  get state(){return G&&{idx:G.idx,cells:G.cells.map(c=>Array.isArray(c)?c.slice():c),
    queue:G.queue.map(q=>q&&q.slice()),progress:G.progress,goal:G.L.goal,lock,
    layersLeft:G.layers.map(a=>a?a.length:0)};},
  start:startLevel,
  place:(q,cell)=>placePad(q,cell),
  botStats, botPlay,
};
