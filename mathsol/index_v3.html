<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Math Solitaire — v3 (CATEGORIZE)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b3d22;font-family:Arial,Helvetica,sans-serif;touch-action:none}
  #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:360px;height:640px;overflow:hidden;transform-origin:center center;background:#34763b}

  /* logo */
  .logo{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:6;text-align:center;line-height:1}
  .logo .cards{position:relative;height:22px}
  .logo .lc{display:inline-block;width:16px;height:21px;background:#fff;border-radius:3px;border:1px solid #cfd8df;
            font-weight:900;font-size:12px;line-height:21px;color:#2b7a3a;margin:0 1px;vertical-align:middle}
  .logo .lc.r{color:#d33;transform:rotate(8deg)}
  .logo .x{display:inline-block;color:#d33;font-weight:900;font-size:11px;vertical-align:middle}
  .logo .math{display:block;color:#ffcf33;font-weight:900;font-size:11px;letter-spacing:1px;margin-top:0;
              text-shadow:0 1px 0 #b9890a}
  .logo .sol{display:inline-block;background:#d33;color:#fff;font-weight:900;font-size:8px;letter-spacing:2px;
             padding:1px 6px;border-radius:3px;margin-top:1px}

  /* top row */
  .moves{position:absolute;top:62px;left:14px;width:74px;background:#fff;border-radius:14px;padding:7px 0 9px;text-align:center;
         box-shadow:0 2px 5px rgba(0,0,0,.25);z-index:5}
  .moves .lbl{font-size:10px;font-weight:800;color:#2b7a3a;letter-spacing:1px;border-bottom:2px dashed #b9d3bd;
              display:inline-block;padding-bottom:2px;margin-bottom:3px}
  .moves .num{font-size:24px;font-weight:900;color:#1b5e2a;line-height:1}

  .stock{position:absolute;top:62px;right:14px;width:56px;height:78px;border-radius:9px;z-index:5;
         background:#da5853;border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3);
         display:flex;align-items:center;justify-content:center}
  .stock::after{content:"";width:26px;height:26px;border:3px solid #c9433e;border-radius:6px;transform:rotate(45deg)}
  .stock .badge{position:absolute;bottom:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:#222;
                color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}

  /* center dealt-card slot */
  .center{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:56px;height:78px;z-index:5}

  /* headlines */
  .h1{position:absolute;top:120px;left:0;right:0;text-align:center;z-index:4;color:#bdf0c6;font-size:18px;font-weight:900;
      letter-spacing:.5px;text-shadow:0 1px 2px rgba(0,0,0,.45);transition:opacity .4s}
  .h2{position:absolute;top:250px;left:0;right:0;text-align:center;z-index:4;color:#fff;font-size:15px;font-weight:800;
      text-shadow:0 1px 2px rgba(0,0,0,.5);transition:opacity .4s}
  .faded{opacity:0}

  /* foundations */
  .founds{position:absolute;top:150px;left:14px;right:14px;display:flex;gap:8px;z-index:3}
  .found{flex:1;height:88px;border-radius:10px;background:#1d4314;position:relative;transition:transform .12s}
  .found.hot{box-shadow:0 0 0 3px #f5d986,0 0 16px rgba(245,217,134,.85);transform:translateY(-2px)}
  .found.pop{transform:scale(1.08)}
  .found .inner{position:absolute;inset:0;border-radius:10px;background:#f5f7f9;display:none;
                flex-direction:column;align-items:center;justify-content:center}
  .found.on .inner{display:flex}
  .found .tab{position:absolute;top:-7px;left:50%;transform:translateX(-50%);min-width:34px;height:18px;border-radius:5px;
              background:#f5d986;color:#5b4a12;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .found .val{font-size:26px;font-weight:900;color:#520b06;margin-top:4px}
  .found .dots{display:flex;gap:3px;position:absolute;bottom:9px}
  .found .dots i{width:6px;height:6px;border-radius:50%;background:#d2d8d2;transition:background .2s}
  .found .dots i.fill{background:#37c06a}
  .found .gold{position:absolute;inset:0;border-radius:10px;background:#f5d986;opacity:0;pointer-events:none}
  .found.flash .gold{animation:goldflash .55s ease}
  @keyframes goldflash{0%{opacity:.95}100%{opacity:0}}

  /* card */
  .card{width:56px;height:78px;border-radius:8px;background:#f5f7f9;border:2px solid #d7e3ee;
        box-shadow:0 2px 4px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;
        font-size:17px;font-weight:900;color:#520b06}
  .card.back{background:#da5853;border:2px solid #fff}
  .card.back::after{content:"";width:18px;height:18px;border:2px solid #c9433e;border-radius:4px;transform:rotate(45deg)}

  /* tableau */
  .tableau{position:absolute;top:282px;left:14px;right:14px;bottom:66px;display:flex;gap:8px;z-index:2}
  .col{flex:1;position:relative}
  .col .card{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:60px}
  .col .card.front{cursor:grab;box-shadow:0 3px 7px rgba(0,0,0,.3)}

  /* drag layer */
  #dragLayer{position:absolute;inset:0;z-index:140;pointer-events:none}
  #dragLayer .card{position:absolute;width:60px;max-width:60px;transform:scale(1.06);box-shadow:0 12px 22px rgba(0,0,0,.45)}
  .card.snap{transition:left .18s ease,top .18s ease,transform .18s ease}

  /* play now (persistent) */
  .playbar{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;z-index:8}
  .playbar button{background:linear-gradient(#8ed24f,#69aa32);color:#fff;font-size:24px;font-weight:900;letter-spacing:1px;
        border:none;border-radius:14px;padding:14px 56px;box-shadow:0 5px 0 #4e8424,0 8px 14px rgba(0,0,0,.35);cursor:pointer;
        text-shadow:0 1px 1px rgba(0,0,0,.25);animation:cta 1.3s ease-in-out infinite}
  @keyframes cta{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  /* hand */
  .hand{position:absolute;width:42px;height:42px;z-index:150;pointer-events:none;opacity:0;
        transition:left .35s ease,top .35s ease,opacity .2s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
  .hand.tap{animation:tap 1s ease-in-out infinite}
  @keyframes tap{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-3px,-7px) scale(.92)}}
  .spark{position:absolute;width:8px;height:8px;border-radius:2px;z-index:135;pointer-events:none}

  /* end overlay */
  #end{position:absolute;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;background:#34763b}
  #end.show{display:flex;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="fit"><div id="stage">

  <div class="logo">
    <div class="cards"><span class="lc">3</span><span class="x">×</span><span class="lc r">7</span></div>
    <span class="math">MATH</span><br><span class="sol">SOLITAIRE</span>
  </div>

  <div class="moves"><span class="lbl">MOVES</span><div class="num" id="moves">130</div></div>
  <div class="center" id="center"></div>
  <div class="stock" id="stock"><div class="badge" id="stockBadge">2</div></div>

  <div class="h1" id="h1">CATEGORIZE ALL CARDS</div>
  <div class="founds" id="founds"></div>
  <div class="h2" id="h2">DRAG THE CARDS!</div>
  <div class="tableau" id="tableau"></div>

  <div id="dragLayer"></div>

  <svg class="hand" id="hand" viewBox="0 0 64 64"><path fill="#ffe0bd" stroke="#caa17a" stroke-width="2"
    d="M26 6c3 0 5 2 5 5v18l3-1c2-1 4 0 5 2l8 16c2 5 1 12-4 16-4 3-9 4-14 4-7 0-12-3-15-9L9 42c-1-3 0-6 3-7s6 0 7 3l2 4V11c0-3 2-5 5-5z"/></svg>

  <div class="playbar"><button onclick="ctaClick()">PLAY NOW</button></div>

  <div id="end">
    <div class="logo" style="position:static;transform:none;margin-bottom:24px">
      <div class="cards"><span class="lc" style="width:40px;height:56px;font-size:26px;line-height:56px">3</span>
      <span class="x" style="font-size:22px">×</span>
      <span class="lc r" style="width:40px;height:56px;font-size:26px;line-height:56px">7</span></div>
      <span class="math" style="font-size:26px">MATH</span><br>
      <span class="sol" style="font-size:14px;letter-spacing:3px">SOLITAIRE</span>
    </div>
    <div class="playbar" style="position:static"><button onclick="ctaClick()">PLAY NOW</button></div>
  </div>

</div></div>

<script>
/* ============================================================
   Math Solitaire v3 — CATEGORIZE playable.  Meta + Google.
   ============================================================ */
var STORE_URL="https://play.google.com/store/apps/details?id=YOUR.PACKAGE"; // TODO replace

/* ---------- LEVEL (data-first) ---------- */
var LEVEL = {
  movesStart: 130,
  // 4 stacks, front = last; values must reduce to one of 4 categories
  stacks: [
    ["20−4","10+5","3²","6+6"],     // 16,15,9,12
    ["3×5","8+8","18/2","24/2"],     // 15,16,9,12
    ["32/2","20−5","√81","3×4"],     // 16,15,9,12
    ["4×4","45/3","16","48/4"]       // 16,15,16,12
  ],
  // stock deals to center, oldest first
  stock: ["12","√225"]               // 12,15
};

/* ---------- expression -> value ---------- */
function val(expr){
  var s=(""+expr).replace(/×|X|x/g,"*").replace(/÷|\//g,"/").replace(/−|–/g,"-").replace(/\s/g,""),m;
  if((m=s.match(/^√(\d+)$/)))return Math.round(Math.sqrt(+m[1]));
  if((m=s.match(/^(\d+)²$/)))return (+m[1])*(+m[1]);
  if((m=s.match(/^(\d+)³$/)))return (+m[1])*(+m[1])*(+m[1]);
  if((m=s.match(/^(\d+)([*/+\-])(\d+)$/))){var a=+m[1],b=+m[3];return m[2]==="*"?a*b:m[2]==="/"?a/b:m[2]==="+"?a+b:a-b;}
  return +s;
}

/* ---------- derive need[value] from all cards ---------- */
var need={}, allCards=[];
LEVEL.stacks.forEach(function(c){c.forEach(function(e){allCards.push(e);});});
LEVEL.stock.forEach(function(e){allCards.push(e);});
allCards.forEach(function(e){var v=val(e);need[v]=(need[v]||0)+1;});
var distinctValues=Object.keys(need).length;     // must be <= 4 (foundation slots)

/* ---------- VALIDATE ---------- */
function validate(){
  var errs=[];
  if(distinctValues>4)errs.push("distinct values "+distinctValues+" > 4 slots");
  if(allCards.length>LEVEL.movesStart)errs.push("cards>"+LEVEL.movesStart);
  console.log(errs.length?"VALIDATE ERRORS:\n"+errs.join("\n"):"VALIDATE OK ("+allCards.length+" cards, "+distinctValues+" categories, needs "+JSON.stringify(need)+")");
  return {ok:errs.length===0,errs:errs,total:allCards.length};
}

/* ---------- state ---------- */
var stage=document.getElementById("stage"), dragLayer=document.getElementById("dragLayer"), hand=document.getElementById("hand");
var founds=[], cols=[], stockArr=LEVEL.stock.slice(), centerCard=null;
var moves=LEVEL.movesStart, placed=0, total=allCards.length, started=false;
var pick=new Map();   // card element -> {card, source:'col'|'center', col}

/* ---------- render ---------- */
function render(){
  document.getElementById("moves").textContent=moves;
  document.getElementById("stockBadge").textContent=stockArr.length;

  var fe=document.getElementById("founds");fe.innerHTML="";founds=[];
  for(var i=0;i<4;i++){
    var d=document.createElement("div");d.className="found";
    d.innerHTML='<div class="gold"></div><div class="inner"><div class="tab"></div><div class="val"></div><div class="dots"></div></div>';
    fe.appendChild(d);
    founds.push({el:d,value:null,need:0,count:0});
  }

  var te=document.getElementById("tableau");te.innerHTML="";cols=[];pick.clear();
  LEVEL.stacks.forEach(function(stack,ci){
    var c=document.createElement("div");c.className="col";te.appendChild(c);
    var cards=[];
    stack.forEach(function(expr,idx){
      var el=document.createElement("div");el.className="card";el.textContent=expr;
      el.style.top=(idx*15)+"px";
      c.appendChild(el);
      cards.push({el:el,expr:expr,value:val(expr),baseTop:idx*15});
    });
    cols.push({el:c,cards:cards});
    refreshCol(ci);
  });
}
function refreshCol(ci){
  var col=cols[ci];
  col.cards.forEach(function(card,idx){
    var front=(idx===col.cards.length-1);
    pick.delete(card.el);
    if(front){ card.el.className="card front"; card.el.textContent=card.expr; pick.set(card.el,{card:card,source:"col",col:ci}); }
    else { card.el.className="card back"; card.el.textContent=""; }
  });
}

/* ---------- stock dealing to center ---------- */
function dealCenter(){
  if(centerCard || !stockArr.length) return;
  var expr=stockArr.shift();
  document.getElementById("stockBadge").textContent=stockArr.length;
  var el=document.createElement("div");el.className="card front";el.textContent=expr;
  el.style.position="absolute";el.style.left="0";el.style.top="0";el.style.width="56px";
  document.getElementById("center").appendChild(el);
  centerCard={el:el,expr:expr,value:val(expr)};
  pick.set(el,{card:centerCard,source:"center"});
  guide();
}

/* ---------- foundation targeting ---------- */
function targetFoundation(v){
  for(var i=0;i<founds.length;i++) if(founds[i].value===v && founds[i].count<founds[i].need) return i;
  for(var i=0;i<founds.length;i++) if(founds[i].value===null) return i;  // open a new slot
  return -1;
}
function nextMove(){
  // prefer the center dealt card, then tableau fronts
  if(centerCard){var fi=targetFoundation(centerCard.value);if(fi>=0)return{card:centerCard,source:"center",fi:fi};}
  for(var ci=0;ci<cols.length;ci++){var col=cols[ci];if(!col.cards.length)continue;
    var card=col.cards[col.cards.length-1];var fi=targetFoundation(card.value);if(fi>=0)return{card:card,source:"col",col:ci,fi:fi};}
  return null;
}

/* ---------- scale / coords ---------- */
function scale(){return Math.min(window.innerWidth/360, window.innerHeight/640);}
function toStage(x,y){var r=stage.getBoundingClientRect(),s=scale();return{x:(x-r.left)/s,y:(y-r.top)/s};}
function rectInStage(el){var r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect(),s=scale();
  return{x:(r.left-sr.left)/s,y:(r.top-sr.top)/s,w:r.width/s,h:r.height/s};}

/* ---------- hand ---------- */
function guide(){
  var mv=nextMove();
  if(!mv){hand.style.opacity=0;return;}
  var rc=rectInStage(mv.card.el);
  hand.style.opacity=1;hand.classList.add("tap");
  hand.style.left=(rc.x+rc.w*0.55)+"px";hand.style.top=(rc.y+rc.h*0.5)+"px";
}
function fadeHeadlines(){if(!started){started=true;document.getElementById("h1").classList.add("faded");document.getElementById("h2").classList.add("faded");}}

/* ============================================================
   DRAG (lift into #dragLayer, single origin = stage)
   ============================================================ */
var drag=null;
stage.addEventListener("pointerdown",function(ev){
  var el=ev.target.closest(".card"); if(!el||!pick.has(el))return;
  var info=pick.get(el), card=info.card;
  ev.preventDefault();
  hand.style.opacity=0;hand.classList.remove("tap");
  var rc=rectInStage(el), p=toStage(ev.clientX,ev.clientY);
  drag={info:info,card:card,grabX:p.x-rc.x,grabY:p.y-rc.y,w:rc.w,h:rc.h};
  pick.delete(el);
  dragLayer.appendChild(el);
  el.className="card";el.style.left=rc.x+"px";el.style.top=rc.y+"px";el.style.transform="scale(1.06)";
  el.textContent=card.expr;
  moveDrag(ev);
});
window.addEventListener("pointermove",function(ev){if(drag)moveDrag(ev);});
window.addEventListener("pointerup",function(ev){if(drag)dropDrag(ev);});

function moveDrag(ev){
  var p=toStage(ev.clientX,ev.clientY),el=drag.card.el;
  el.style.left=(p.x-drag.grabX)+"px";el.style.top=(p.y-drag.grabY)+"px";
  var fi=targetFoundation(drag.card.value);
  founds.forEach(function(f,i){f.el.classList.toggle("hot",i===fi);});
}
function dropDrag(ev){
  var fi=targetFoundation(drag.card.value), over=foundationUnder(ev.clientX,ev.clientY);
  founds.forEach(function(f){f.el.classList.remove("hot");});
  var accept=(over===fi)||(over<0&&nearFoundRow(ev.clientY)&&fi>=0);
  if(accept&&fi>=0) land(drag.info,fi); else returnCard(drag.info);
  drag=null;
}
function foundationUnder(x,y){for(var i=0;i<founds.length;i++){var r=founds[i].el.getBoundingClientRect();
  if(x>=r.left-14&&x<=r.right+14&&y>=r.top-14&&y<=r.bottom+14)return i;}return -1;}
function nearFoundRow(y){var r=document.getElementById("founds").getBoundingClientRect();return y<r.bottom+44;}

function returnCard(info){
  var el=info.card.el;
  if(info.source==="col"){
    cols[info.col].el.appendChild(el);
    el.className="card front snap";el.style.left="50%";el.style.top=info.card.baseTop+"px";el.style.transform="translateX(-50%)";
    pick.set(el,info);
    setTimeout(function(){el.classList.remove("snap");el.style.transform="translateX(-50%)";guide();},190);
  } else {
    document.getElementById("center").appendChild(el);
    el.className="card front snap";el.style.left="0";el.style.top="0";el.style.transform="scale(1)";
    pick.set(el,info);
    setTimeout(function(){el.classList.remove("snap");guide();},190);
  }
}

function land(info,fi){
  var card=info.card, el=card.el, f=founds[fi];
  // detach from source model
  if(info.source==="col"){cols[info.col].cards.pop();refreshCol(info.col);}
  else { centerCard=null; }

  // open foundation if new
  if(f.value===null){
    f.value=card.value; f.need=need[card.value];
    f.el.classList.add("on","flash");
    f.el.querySelector(".tab").textContent=card.value;
    f.el.querySelector(".val").textContent=card.value;
    var dots="";for(var i=0;i<f.need;i++)dots+="<i></i>";
    f.el.querySelector(".dots").innerHTML=dots;
    setTimeout(function(){f.el.classList.remove("flash");},560);
  }
  // fly card into foundation, then absorb
  var rc=rectInStage(f.el);
  el.classList.add("snap");
  el.style.left=(rc.x+(rc.w-drag.w)/2)+"px";el.style.top=(rc.y+(rc.h-drag.h)/2)+"px";el.style.transform="scale(.85)";
  setTimeout(function(){
    el.remove();
    f.count++;
    var di=f.el.querySelectorAll(".dots i"); if(di[f.count-1])di[f.count-1].classList.add("fill");
    f.el.classList.add("pop");setTimeout(function(){f.el.classList.remove("pop");},140);
    burst(f.el);
    placed++; moves--; document.getElementById("moves").textContent=moves;
    fadeHeadlines();
    if(placed>=total){ win(); }
    else { dealCenter(); guide(); }
  },170);
}

function burst(target){var rc=rectInStage(target),cx=rc.x+rc.w/2,cy=rc.y+rc.h/2,cl=["#ffe066","#7ed957","#fff","#37c06a"];
  for(var i=0;i<12;i++){var p=document.createElement("div");p.className="spark";p.style.background=cl[i%cl.length];
    p.style.left=cx+"px";p.style.top=cy+"px";stage.appendChild(p);
    var a=Math.PI*2*i/12,d=26+(i%3)*12;(function(p,dx,dy){p.animate([{transform:"translate(0,0) scale(1)",opacity:1},
      {transform:"translate("+dx+"px,"+dy+"px) scale(0)",opacity:0}],{duration:520,easing:"cubic-bezier(.2,.7,.3,1)"});
      setTimeout(function(){p.remove();},540);})(p,Math.cos(a)*d,Math.sin(a)*d);}}

/* ---------- WIN / CTA ---------- */
function win(){ setTimeout(function(){document.getElementById("end").classList.add("show");},500); }
var ctaFired=false;
function ctaClick(){
  if(ctaFired)return;ctaFired=true;
  try{if(window.FbPlayableAd&&FbPlayableAd.onCTAClick){FbPlayableAd.onCTAClick();return;}}catch(e){}
  try{if(typeof ExitApi!=="undefined"&&ExitApi.exit){ExitApi.exit();return;}}catch(e){}
  try{if(window.mraid&&mraid.open){mraid.open(STORE_URL);return;}}catch(e){}
  try{window.open(STORE_URL,"_blank");}catch(e){}
}

/* ---------- boot ---------- */
function fit(){stage.style.transform="scale("+scale()+")";}
window.addEventListener("resize",function(){fit();guide();});
validate(); render(); fit();
requestAnimationFrame(function(){requestAnimationFrame(function(){fit();guide();});});
setTimeout(guide,400);
</script>
</body>
</html>
