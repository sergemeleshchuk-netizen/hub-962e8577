<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hidden Books demo</title>
<link rel="stylesheet" href="hidden_books.css">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;box-sizing:border-box;
    background:radial-gradient(circle at 50% 30%,#5a2a32,#2a1014);font-family:system-ui,sans-serif;color:#fff}
  h1{font-size:18px;margin:4px 0 0}
  #wrap{position:relative}
  #shelf{display:grid;grid-template-columns:repeat(var(--c,6),1fr);gap:6px 4px;width:min(360px,92vw);padding:12px;border-radius:14px;background:#3b0f18;box-shadow:inset 0 0 0 4px #E9B44C}
  .book{position:relative;aspect-ratio:var(--ar,1/2.4);border-radius:6px;background-image:url(demo_art.jpg);background-repeat:no-repeat;box-shadow:0 3px 4px rgba(0,0,0,.4)}
  #fx{position:absolute;inset:0;pointer-events:none}
  button{font:600 15px system-ui;padding:10px 18px;border-radius:12px;border:0;background:#4FD67A;color:#123;cursor:pointer}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #log{font-size:13px;opacity:.8}
</style></head><body>
<h1>Hidden Books — demo</h1>
<div id="wrap"><div id="shelf"></div><div id="fx"></div></div>
<div class="row"><button id="mv">Make a move</button><button id="gl">Move + glue next to a mystery book</button><button id="rs" style="background:#E9B44C">Restart</button></div>
<div class="row"><button data-g="3,2,1/1.5">Few books</button><button data-g="5,3,1/2">Medium</button><button data-g="8,4,1/2.6">Many</button><button data-g="6,3,1/2.4">Default</button></div>
<div id="log"></div>
<script src="hidden_books.js"></script>
<script>
let COLS=6,ROWS=3,N=COLS*ROWS;const shelf=document.getElementById('shelf');let hb,books;
function build(){shelf.innerHTML='';books=[];
  for(let i=0;i<N;i++){const b=document.createElement('div');b.className='book';
    b.style.backgroundSize=`${COLS*100}% ${ROWS*100}%`;b.style.backgroundPosition=`${(i%COLS)/(COLS-1)*100}% ${Math.floor(i/COLS)/(ROWS-1)*100}%`;shelf.appendChild(b);books.push(b)}
  hb=HiddenBooks.create({ids:HiddenBooks.pick(N,Math.min(4,Math.ceil(N/5))),el:id=>books[id],isHome:()=>false,fx:document.getElementById('fx')});hb.mount();log()}
function log(){document.getElementById('log').textContent='hidden: '+hb.count()+'   timers: '+JSON.stringify(hb.timers())}
document.getElementById('mv').onclick=()=>{hb.onMove();log()};
document.getElementById('gl').onclick=()=>{const t=hb.timers(),id=+Object.keys(t)[0];hb.onMove({glued:isNaN(id)?[]:[id]});log()};
document.getElementById('rs').onclick=build;
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const [c,r,ar]=b.dataset.g.split(',');COLS=+c;ROWS=+r;N=COLS*ROWS;shelf.style.setProperty('--c',COLS);shelf.style.setProperty('--ar',ar);build()});build();
</script></body></html>
