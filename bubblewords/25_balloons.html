<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Balloon Words 🎈</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#bfe3ff;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  #wrap{position:relative;width:100%;max-width:430px;height:100%;max-height:900px;margin:0 auto;
        background:linear-gradient(180deg,#7cc4f7 0%,#a9d9fb 45%,#dff1ff 78%,#f6fbff 100%);overflow:hidden;touch-action:none;}
  canvas{position:absolute;inset:0;width:100%;height:100%;}
  /* top bar */
  #bar{position:absolute;top:0;left:0;right:0;height:64px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;
       background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));z-index:20;color:#1b4a72;pointer-events:none;}
  #title{font-weight:800;font-size:17px;letter-spacing:.3px;text-shadow:0 1px 2px rgba(255,255,255,.6);}
  #lvl{font-size:11px;opacity:.8;font-weight:600;margin-top:2px;}
  #stats{display:flex;gap:14px;align-items:center;font-size:13px;font-weight:700;}
  .stat{text-align:center;}
  .stat b{display:block;font-size:18px;line-height:1;}
  .stat span{opacity:.8;font-size:10px;text-transform:uppercase;letter-spacing:.5px;}
  #restart{pointer-events:auto;cursor:pointer;width:38px;height:38px;border-radius:50%;border:none;
           background:rgba(255,255,255,.55);color:#1b4a72;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  #restart:active{background:rgba(255,255,255,.8);}
  /* toast */
  #toast{position:absolute;top:80px;left:50%;transform:translateX(-50%) translateY(-12px);opacity:0;
         background:rgba(255,255,255,.96);color:#175;padding:10px 18px;border-radius:22px;font-weight:800;font-size:15px;
         box-shadow:0 6px 18px rgba(60,110,160,.3);z-index:30;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* overlay */
  #overlay{position:absolute;inset:0;z-index:40;background:rgba(120,180,230,.78);display:none;flex-direction:column;
           align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px;}
  #overlay.show{display:flex;}
  #ovEmoji{font-size:64px;margin-bottom:8px;}
  #ovTitle{font-size:30px;font-weight:900;margin-bottom:6px;text-shadow:0 2px 6px rgba(0,0,0,.2);}
  #ovText{font-size:15px;opacity:.95;margin-bottom:22px;}
  #ovBtn{cursor:pointer;border:none;border-radius:30px;padding:15px 38px;font-size:17px;font-weight:800;
         background:linear-gradient(180deg,#ffd34e,#f6a32a);color:#5a3a06;box-shadow:0 6px 16px rgba(0,0,0,.25);}
  #ovBtn:active{transform:scale(.96);}
  /* booster bar */
  #boosters{position:absolute;left:0;right:0;bottom:0;height:84px;z-index:25;
            display:flex;justify-content:center;align-items:center;gap:18px;
            background:linear-gradient(0deg,rgba(255,255,255,.55),rgba(255,255,255,0));}
  .boost{position:relative;width:60px;height:60px;border:none;cursor:pointer;border-radius:18px;
         background:rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(60,110,160,.28);
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
  .boost:active{transform:scale(.93);}
  .boost .ic{font-size:26px;line-height:1;}
  .boost .lb{font-size:8.5px;font-weight:800;color:#1b4a72;text-transform:uppercase;letter-spacing:.3px;}
  .boost .cnt{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;
              background:#f6a32a;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;
              box-shadow:0 2px 5px rgba(0,0,0,.25);}
  .boost.empty{opacity:.45;filter:grayscale(.6);}
  .boost.empty .cnt{background:#9bb0c2;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="bar">
    <div>
      <div id="title">Balloon Words 🎈</div>
      <div id="lvl">Level 1</div>
    </div>
    <div id="stats">
      <div class="stat"><b id="moves">16</b><span>Moves</span></div>
      <div class="stat"><b id="prog">0/4</b><span>Set Free</span></div>
      <button id="restart" title="Restart">↻</button>
    </div>
  </div>
  <div id="toast"></div>
  <div id="boosters">
    <button class="boost" id="bMoves"><span class="ic">➕</span><span class="lb">+5 Moves</span><span class="cnt">2</span></button>
    <button class="boost" id="bHint"><span class="ic">🔍</span><span class="lb">Hint</span><span class="cnt">3</span></button>
    <button class="boost" id="bMagnet"><span class="ic">🧲</span><span class="lb">Magnet</span><span class="cnt">1</span></button>
  </div>
  <div id="overlay">
    <div id="ovEmoji">🎈</div>
    <div id="ovTitle">You Win!</div>
    <div id="ovText"></div>
    <button id="ovBtn">Next Level</button>
  </div>
</div>
<script>
"use strict";
(function(){
  // ---- content (verbatim from SHARED.md) ----
  const CATS = [
   {name:'Planets',     emoji:'🪐', color:'#7a5cf6', words:['MERCURY','VENUS','MARS','SATURN']},
   {name:'Royalty',     emoji:'👑', color:'#e6a33f', words:['KING','QUEEN','PRINCE','PRINCESS']},
   {name:'Writing',     emoji:'✏️', color:'#36c6c0', words:['PEN','PENCIL','CRAYON','MARKER']},
   {name:'Boats',       emoji:'⛵', color:'#3f8fe6', words:['BOAT','SHIP','BARGE','RAFT']},
   {name:'Organs',      emoji:'🫀', color:'#e8563f', words:['HEART','LIVER','LUNG','KIDNEY']},
   {name:'Weather',     emoji:'🌪️', color:'#5b7cf5', words:['STORM','TORNADO','CYCLONE','BLIZZARD']},
   {name:'Veggies',     emoji:'🥕', color:'#7da04a', words:['CARROT','CELERY','ONION','PEPPER']},
   {name:'Reptiles',    emoji:'🦎', color:'#2ea49a', words:['GECKO','IGUANA','SNAKE','LIZARD']},
   {name:'Birds',       emoji:'🦜', color:'#ef6aa0', words:['CROW','EAGLE','PARROT','ROBIN']},
   {name:'Continents',  emoji:'🌍', color:'#4aa6a0', words:['EUROPE','AFRICA','ASIA','AMERICA']},
   {name:'Pastry',      emoji:'🥐', color:'#d99b3f', words:['DONUT','BAGEL','MUFFIN','PRETZEL']},
   {name:'Temperature', emoji:'🌡️', color:'#e07a3f', words:['HOT','WARM','COLD','COOL']},
  ];

  // ---- canvas / world ----
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const wrap = document.getElementById('wrap');
  let W=430, H=900, DPR=1;
  function resize(){
    const r = wrap.getBoundingClientRect();
    W = r.width; H = r.height;
    DPR = Math.min(window.devicePixelRatio||1, 2);
    cv.width = W*DPR; cv.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  // play field bounds: invisible ceiling/net near the top keeps balloons clustered up
  const TOP = 78;          // ceiling (net) — balloons float up to here, never escape
  function bottomY(){ return H - 96; }   // leave room for the booster bar

  // ---- state ----
  let level=1, balloons=[], moves=0, movesMax=0, freed=0, freedTotal=0, activeCats=[];
  let drag=null;          // {b, dx, dy}
  let gameOver=false;
  let clouds=[];
  let boosters={moves:2, hint:3, magnet:1};   // limited-use boosters (like Bubble Words)
  let hintCat=-1, hintT=0;                     // currently highlighted category + remaining ms

  function rand(a,b){ return a + Math.random()*(b-a); }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  // a Balloon holds words of ONE category; count = words.length, full when ==4
  function makeBalloon(catIdx, words, x, y){
    return {
      cat:catIdx, words:words.slice(),
      x, y,
      vx:rand(-0.25,0.25),
      phase: Math.random()*Math.PI*2,
      sway: rand(0.6,1.0),
      release:false, gone:false, snap:null
    };
  }
  // bigger / puffier as it grows
  function balloonR(b){ return 42 + (b.words.length-1)*8; }
  function balloonH(b){ return balloonR(b)*2.35; }   // teardrop height (incl. taper)

  function startLevel(){
    gameOver=false;
    boosters={moves:2, hint:3, magnet:1};
    hintCat=-1; hintT=0;
    document.getElementById('overlay').classList.remove('show');
    const nCats = 3 + level;                 // level1 -> 4 categories
    freedTotal = nCats;
    freed = 0;
    // pick categories
    const idxs = shuffle(CATS.map((_,i)=>i)).slice(0,nCats);
    activeCats = idxs.slice();
    // moves budget: minimum needed = 3 merges per category; give a little slack
    movesMax = nCats*3 + Math.max(2, Math.round(nCats*0.7));
    moves = movesMax;
    // seed: each category -> 4 single-word balloons
    balloons = [];
    idxs.forEach(ci=>{
      CATS[ci].words.forEach(w=>{
        balloons.push(makeBalloon(ci, [w], 0, 0));
      });
    });
    shuffle(balloons);
    // place spread out
    const padX=64, padTop=20;
    balloons.forEach(b=>{
      b.x = rand(padX, W-padX);
      b.y = rand(TOP+padTop, bottomY()-60);
    });
    clouds = [
      {x:rand(40,W-40), y:H*0.30, s:rand(34,46), v:rand(0.01,0.025)},
      {x:rand(40,W-40), y:H*0.55, s:rand(40,56), v:rand(0.01,0.02)},
      {x:rand(40,W-40), y:H*0.78, s:rand(30,42), v:rand(0.012,0.03)},
    ];
    updateHUD();
  }

  function updateHUD(){
    document.getElementById('moves').textContent = moves;
    document.getElementById('prog').textContent = freed+'/'+freedTotal;
    document.getElementById('lvl').textContent = 'Level '+level;
    updateBoosters();
  }
  function updateBoosters(){
    [['bMoves','moves'],['bHint','hint'],['bMagnet','magnet']].forEach(([id,key])=>{
      const el=document.getElementById(id);
      el.querySelector('.cnt').textContent = boosters[key];
      el.classList.toggle('empty', boosters[key]<=0);
    });
  }

  // ---- toast ----
  let toastT=null;
  function toast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    clearTimeout(toastT);
    toastT=setTimeout(()=>t.classList.remove('show'), 1300);
  }

  // ---- hit test ----
  function balloonAt(px,py){
    for(let i=balloons.length-1;i>=0;i--){
      const b=balloons[i];
      if(b.gone||b.release) continue;
      const r=balloonR(b);
      const cy=b.y - r*0.25;             // bulb center sits above object anchor
      const dx=(px-b.x), dy=(py-cy);
      if(dx*dx/(r*r) + dy*dy/((r*1.12)*(r*1.12)) <= 1) return b;
    }
    return null;
  }

  // ---- merge logic (CORE rules — invariant) ----
  function tryMerge(dragB, targetB){
    if(dragB===targetB) return false;
    if(dragB.cat!==targetB.cat){ return false; }      // different category -> no merge
    // same category: combine words (unique)
    const set = new Set(targetB.words.concat(dragB.words));
    targetB.words = Array.from(set);
    // remove dragged balloon
    dragB.gone = true;
    balloons = balloons.filter(b=>b!==dragB);
    moves--;                                            // successful merge costs a move
    // completed set?
    if(targetB.words.length >= 4){
      targetB.words = targetB.words.slice(0,4);
      targetB.release = true;                           // floats away up off the top
      freed++;
      toast('Up and away! 🎈');
    } else {
      toast(['Nice!','Pop together!','Floaty!','Tied up!'][Math.floor(Math.random()*4)]);
    }
    updateHUD();
    return true;
  }

  function checkEnd(){
    if(gameOver) return;
    if(freed>=freedTotal){ win(); }
    else if(moves<=0){ lose(); }
  }

  function win(){
    gameOver=true;
    const o=document.getElementById('overlay');
    document.getElementById('ovEmoji').textContent='🎈';
    document.getElementById('ovTitle').textContent='You Win!';
    document.getElementById('ovText').textContent='Every bunch floated away. Higher skies ahead!';
    document.getElementById('ovBtn').textContent='Next Level ▸';
    o.dataset.action='next';
    o.classList.add('show');
  }
  function lose(){
    gameOver=true;
    const o=document.getElementById('overlay');
    document.getElementById('ovEmoji').textContent='💨';
    document.getElementById('ovTitle').textContent='Out of Moves';
    document.getElementById('ovText').textContent='The balloons stayed grounded. Try again!';
    document.getElementById('ovBtn').textContent='Retry';
    o.dataset.action='retry';
    o.classList.add('show');
  }

  // ---- pointer ----
  function getPos(e){
    const r = cv.getBoundingClientRect();
    const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
    return { x:(p.clientX-r.left), y:(p.clientY-r.top) };
  }
  function onDown(e){
    if(gameOver) return;
    const p=getPos(e);
    const b=balloonAt(p.x,p.y);
    if(b){
      drag={ b, dx:b.x-p.x, dy:b.y-p.y };
      b.snap=null;
      e.preventDefault();
    }
  }
  function onMove(e){
    if(!drag) return;
    const p=getPos(e);
    drag.b.x = p.x + drag.dx;
    drag.b.y = p.y + drag.dy;
    e.preventDefault();
  }
  function onUp(e){
    if(!drag) return;
    const b=drag.b;
    // find target whose bulb contains this balloon's bulb center, excluding self
    let target=null;
    const r=balloonR(b), cy=b.y - r*0.25;
    for(let i=balloons.length-1;i>=0;i--){
      const o=balloons[i];
      if(o===b||o.gone||o.release) continue;
      const or=balloonR(o), ocy=o.y-or*0.25;
      const dx=b.x-o.x, dy=cy-ocy;
      if(dx*dx+dy*dy <= (or*1.05)*(or*1.05)){ target=o; break; }
    }
    if(target){
      const ok=tryMerge(b, target);
      if(!ok){
        // wrong category: snap back, no move spent
        b.snap={ x:clampX(b), y:clampY(b) };
        toast('Different bunch! ✋');
      }
    } else {
      // dropped on nothing: keep position (clamp into sky), no move
      b.x=clampX(b); b.y=clampY(b);
    }
    drag=null;
    checkEnd();
    e.preventDefault();
  }
  function clampX(b){ const r=balloonR(b); return Math.max(r+6, Math.min(W-r-6, b.x)); }
  function clampY(b){ const r=balloonR(b); return Math.max(TOP+r*0.6, Math.min(bottomY()-6, b.y)); }

  cv.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  // ---- boosters (mirrors Bubble Words: +moves / hint / magnet) ----
  function useMoves(){
    if(gameOver||boosters.moves<=0) return;
    boosters.moves--; moves+=5; toast('+5 moves! ➕'); updateHUD();
  }
  function useHint(){
    if(gameOver||boosters.hint<=0) return;
    // highlight an unfinished category that still has 2+ balloons to merge
    const cnt={};
    balloons.forEach(b=>{ if(!b.release) cnt[b.cat]=(cnt[b.cat]||0)+1; });
    const cand=Object.keys(cnt).filter(c=>cnt[c]>=2);
    if(!cand.length){ toast('Nothing to hint 🔍'); return; }
    boosters.hint--;
    hintCat=+cand[Math.floor(Math.random()*cand.length)];
    hintT=2600;                                  // glow for ~2.6s
    toast('Same bunch glows! 🔍'); updateHUD();
  }
  function useMagnet(){
    if(gameOver||boosters.magnet<=0) return;
    // gather one whole category into a single complete bunch and set it free
    const groups={};
    balloons.forEach(b=>{ if(!b.release) (groups[b.cat]=groups[b.cat]||[]).push(b); });
    // prefer the category that's furthest along (most words collected on the field)
    let best=null, bestScore=-1;
    Object.keys(groups).forEach(c=>{
      const g=groups[c]; if(g.length<2) return;
      const words=new Set(); g.forEach(b=>b.words.forEach(w=>words.add(w)));
      if(words.size>bestScore){ bestScore=words.size; best=c; }
    });
    if(best===null){ toast('Magnet has nothing 🧲'); return; }
    boosters.magnet--;
    const g=groups[best];
    const keep=g[0], words=new Set();
    g.forEach(b=>b.words.forEach(w=>words.add(w)));
    keep.words=Array.from(words).slice(0,4);
    for(let i=1;i<g.length;i++){ g[i].gone=true; }
    balloons=balloons.filter(b=>!b.gone);
    keep.release=true; freed++;
    toast('Magnet pulled them up! 🧲'); updateHUD();
    checkEnd();
  }
  document.getElementById('bMoves').addEventListener('click', useMoves);
  document.getElementById('bHint').addEventListener('click', useHint);
  document.getElementById('bMagnet').addEventListener('click', useMagnet);

  document.getElementById('restart').addEventListener('click', ()=>{ level=1; startLevel(); });
  document.getElementById('ovBtn').addEventListener('click', ()=>{
    const a=document.getElementById('overlay').dataset.action;
    if(a==='next') level++;
    startLevel();
  });

  // ---- physics / drift (balloons float UP, kept under the ceiling) ----
  function step(dt){
    const held = drag&&drag.b;
    if(hintT>0){ hintT-=dt; if(hintT<=0){ hintT=0; hintCat=-1; } }
    for(const b of balloons){
      if(b===held) continue;             // paused while dragging (so it can be grabbed)
      b.phase += dt*0.003*b.sway;
      if(b.release){
        // released: float up and off the top
        b.y -= 0.45*dt;
        b.x += Math.sin(b.phase)*0.5;
        if(b.y < -balloonH(b)-20){ b.gone=true; }
        continue;
      }
      if(b.snap){
        b.x += (b.snap.x-b.x)*0.18;
        b.y += (b.snap.y-b.y)*0.18;
        if(Math.abs(b.snap.x-b.x)<0.6 && Math.abs(b.snap.y-b.y)<0.6){ b.snap=null; }
        continue;
      }
      // gentle drift in place — NO net rise, so balloons stay spread over the field
      b.x += (b.vx + Math.sin(b.phase)*0.35) * dt * 0.05;
      b.y += Math.sin(b.phase*1.6)*0.12;
      // occasional small drift change
      if(Math.random()<0.004){ b.vx += rand(-0.12,0.12); b.vx=Math.max(-0.45,Math.min(0.45,b.vx)); }
    }
    // separation: balloons push each other apart so none pile up in a clump
    for(let i=0;i<balloons.length;i++){
      const a=balloons[i]; if(a.release||a.snap||a===held) continue;
      const ar=balloonR(a), acy=a.y-ar*0.25;
      for(let j=i+1;j<balloons.length;j++){
        const b=balloons[j]; if(b.release||b.snap||b===held) continue;
        const br=balloonR(b), bcy=b.y-br*0.25;
        let dx=b.x-a.x, dy=bcy-acy;
        let d=Math.hypot(dx,dy)||0.01;
        const min=(ar+br)*0.94;
        if(d<min){
          const push=(min-d)/d*0.5;
          const ox=dx*push, oy=dy*push;
          a.x-=ox; a.y-=oy; b.x+=ox; b.y+=oy;
        }
      }
    }
    // keep everyone inside the sky
    for(const b of balloons){
      if(b.release) continue;
      const r=balloonR(b);
      const ceil=TOP+r*0.6;
      if(b.x<r+6){ b.x=r+6; b.vx=Math.abs(b.vx); }
      if(b.x>W-r-6){ b.x=W-r-6; b.vx=-Math.abs(b.vx); }
      if(b.y<ceil){ b.y=ceil; }
      if(b.y>bottomY()){ b.y=bottomY(); }
    }
    balloons = balloons.filter(b=>!b.gone);
    // clouds drift slowly sideways
    for(const c of clouds){ c.x += c.v*dt; if(c.x > W+c.s*1.6) c.x = -c.s*1.6; }
  }

  // ---- rendering ----
  function roundRect(c,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }

  function drawCloud(c){
    ctx.save();
    ctx.fillStyle='rgba(255,255,255,.85)';
    const s=c.s;
    [[0,0,1],[ -0.7,0.15,0.72],[0.7,0.15,0.72],[ -0.35,-0.3,0.6],[0.4,-0.25,0.62]].forEach(p=>{
      ctx.beginPath(); ctx.arc(c.x+p[0]*s, c.y+p[1]*s, s*p[2], 0, 7); ctx.fill();
    });
    ctx.restore();
  }

  function drawBalloon(b){
    const r=balloonR(b);
    const c=CATS[b.cat].color;
    const x=b.x, cy=b.y - r*0.25;        // bulb center
    ctx.save();
    // hint glow: pulsing halo around balloons of the highlighted category
    if(b.cat===hintCat && !b.release){
      const pulse=0.55+0.45*Math.sin(b.phase*4);
      ctx.save();
      ctx.globalAlpha=0.85;
      ctx.shadowColor=lighten(c,0.2); ctx.shadowBlur=18+10*pulse;
      ctx.strokeStyle='#fff'; ctx.lineWidth=3+2*pulse;
      ctx.beginPath();
      ctx.ellipse(x, cy, r*1.18, r*1.3, 0, 0, 7);
      ctx.stroke();
      ctx.restore();
    }
    // string (from knot at bottom of bulb, gently wavy)
    const knotY = cy + r*1.04;
    ctx.strokeStyle='rgba(80,90,110,.55)'; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(x, knotY);
    for(let k=1;k<=4;k++){
      const yy=knotY + k*(r*0.42);
      ctx.lineTo(x + Math.sin(b.phase*1.4 + k*0.9)*4, yy);
    }
    ctx.stroke();
    // balloon bulb (teardrop: ellipse, slightly taller, narrowing to knot)
    ctx.beginPath();
    ctx.moveTo(x, cy-r*1.08);
    ctx.bezierCurveTo(x+r*1.08, cy-r*1.0, x+r*1.04, cy+r*0.72, x, knotY);
    ctx.bezierCurveTo(x-r*1.04, cy+r*0.72, x-r*1.08, cy-r*1.0, x, cy-r*1.08);
    ctx.closePath();
    // glossy radial fill
    const g=ctx.createRadialGradient(x-r*0.35, cy-r*0.45, r*0.1, x, cy, r*1.25);
    g.addColorStop(0, lighten(c,0.5));
    g.addColorStop(0.55, c);
    g.addColorStop(1, darken(c,0.18));
    ctx.fillStyle=g;
    ctx.fill();
    // knot triangle
    ctx.fillStyle=darken(c,0.12);
    ctx.beginPath();
    ctx.moveTo(x-r*0.12, knotY-1);
    ctx.lineTo(x+r*0.12, knotY-1);
    ctx.lineTo(x, knotY + r*0.18);
    ctx.closePath(); ctx.fill();
    // highlight
    ctx.globalAlpha=0.45;
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.ellipse(x-r*0.34, cy-r*0.42, r*0.22, r*0.36, -0.5, 0, 7);
    ctx.fill();
    ctx.globalAlpha=1;
    ctx.restore();

    // label (white capsule across the bulb) — first word readable
    const word=b.words[0];
    let fs=Math.round(14 + (b.words.length-1)*1.5);
    ctx.font='800 '+fs+'px -apple-system,Segoe UI,Arial,sans-serif';
    const tw=ctx.measureText(word).width;
    const maxCap = r*1.7;
    const pad=7;
    let capW=Math.min(tw+pad*2, maxCap);
    const capH=fs+8;
    ctx.fillStyle='rgba(255,255,255,0.94)';
    roundRect(ctx, x-capW/2, cy-capH/2, capW, capH, capH/2); ctx.fill();
    ctx.fillStyle='#16324a'; ctx.textAlign='center'; ctx.textBaseline='middle';
    // shrink text if too wide
    while(ctx.measureText(word).width > capW-pad*2 && fs>8){
      ctx.font='800 '+(--fs)+'px -apple-system,Segoe UI,Arial,sans-serif';
    }
    ctx.fillText(word, x, cy+0.5);

    // n/4 badge if a bunch (>1)
    if(b.words.length>1){
      const bx=x+r*0.78, by=cy-r*0.82;
      ctx.fillStyle=darken(c,0.1);
      ctx.beginPath(); ctx.arc(bx,by,12,0,7); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='800 11px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.words.length+'/4', bx, by+0.5);
    }
  }

  // color helpers
  function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
  function lighten(h,t){ const c=hexToRgb(h); return 'rgb('+c.map(v=>Math.round(v+(255-v)*t)).join(',')+')'; }
  function darken(h,t){ const c=hexToRgb(h); return 'rgb('+c.map(v=>Math.round(v*(1-t))).join(',')+')'; }

  let last=0;
  function loop(ts){
    const dt=Math.min(40, ts-last||16); last=ts;
    if(!gameOver) step(dt);
    ctx.clearRect(0,0,W,H);
    for(const c of clouds){ drawCloud(c); }
    // draw balloons sorted so bigger draw on top a bit; simple order is fine
    for(const b of balloons){ if(!b.gone) drawBalloon(b); }
    requestAnimationFrame(loop);
  }

  function init(){
    resize();
    startLevel();
    requestAnimationFrame(loop);
  }
  if(document.readyState==='loading') window.addEventListener('DOMContentLoaded', init);
  else init();

  // expose for verification
  window.__bl = { get balloons(){return balloons;}, tryMerge, startLevel, get state(){return {moves,freed,freedTotal,level};} };
})();
</script>
