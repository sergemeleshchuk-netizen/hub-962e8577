<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Word Shikaku v18 — Генератор ∞</title>
<style>
  :root{ --bg:#141821; --cell:#2c3140; --ink:#e6e9f0; --muted:#7b8190; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; overscroll-behavior:none; }
  #app{ max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
    align-items:center; padding:16px 14px 28px; }
  header{ width:100%; display:flex; align-items:center; justify-content:center; position:relative; margin:4px 0; }
  header h1{ font-size:18px; font-weight:700; margin:0; }
  #reset{ position:absolute; right:0; top:-2px; background:var(--cell); color:var(--ink);
    border:none; border-radius:10px; padding:7px 12px; font-size:13px; cursor:pointer; }
  #levels{ display:flex; gap:7px; margin:12px 0 6px; flex-wrap:wrap; justify-content:center; }
  #levels button{ background:var(--cell); color:var(--muted); border:none; border-radius:10px;
    padding:7px 11px; font-size:13px; font-weight:700; cursor:pointer; }
  #levels button.cur{ color:#fff; }
  #dots{ display:flex; gap:8px; margin:10px 0; }
  #dots .d{ width:10px; height:10px; border-radius:50%; background:var(--cell); }
  #hint{ color:var(--muted); font-size:13px; margin:6px 0 14px; text-align:center; min-height:18px; }
  #board{ position:relative; display:grid; gap:7px; touch-action:none; user-select:none; }
  .cell{ position:relative; border-radius:13px; background:var(--cell);
    display:flex; align-items:center; justify-content:center; font-weight:800; color:transparent;
    transition:background .16s, color .16s; }
  .cell.clue{ color:var(--c); }
  .cell.solved{ background:var(--c); color:#fff; }
  .cell.sel{ outline:3px solid rgba(255,255,255,.85); outline-offset:-3px; color:#fff; }
  .cell.bad{ outline:3px solid #e2566a; outline-offset:-3px; }
  .cell .badge{ position:absolute; top:4px; right:4px; width:18px; height:18px; border-radius:50%;
    background:#000; color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .cell.solved .badge{ display:none; }
  #win{ position:fixed; inset:0; background:rgba(10,13,20,.86); display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; z-index:10; }
  #win.show{ display:flex; }
  #win .big{ font-size:38px; font-weight:800; font-style:italic; }
  #win .lbl{ color:#aab; font-size:15px; }
  #win button{ background:#fff; color:#141821; border:none; border-radius:14px; padding:13px 28px;
    font-size:16px; font-weight:700; cursor:pointer; }

<script>
const LEVELS = [

{name:"L3 · Beach",theme:"Пляж",W:6,H:4,words:[{text:"SEA",color:"#2ea49a",r:0,c:0,h:1,w:3},{text:"LAGOON",color:"#6c9ed6",r:0,c:3,h:3,w:2},{text:"TIDE",color:"#b8a082",r:0,c:5,h:4,w:1},{text:"ANCHOR",color:"#a896d2",r:1,c:0,h:2,w:3},{text:"CORAL",color:"#d6c460",r:3,c:0,h:1,w:5}]},
{name:"L4 · Ocean",theme:"Океан",W:6,H:5,words:[{text:"BAY",color:"#2ea49a",r:0,c:0,h:1,w:3},{text:"FISH",color:"#6c9ed6",r:0,c:3,h:2,w:2},{text:"WHALE",color:"#b8a082",r:0,c:5,h:5,w:1},{text:"CRAB",color:"#a896d2",r:1,c:0,h:4,w:1},{text:"STARFISH",color:"#d6c460",r:1,c:1,h:4,w:2},{text:"TURTLE",color:"#e0796f",r:2,c:3,h:3,w:2}]},
{name:"L5 · Tropics",theme:"Тропики",W:6,H:6,words:[{text:"SUN",color:"#2ea49a",r:0,c:0,h:1,w:3},{text:"BOAT",color:"#6c9ed6",r:0,c:3,h:2,w:2},{text:"PEBBLE",color:"#b8a082",r:0,c:5,h:6,w:1},{text:"MARINA",color:"#a896d2",r:1,c:0,h:2,w:3},{text:"FLAMINGO",color:"#d6c460",r:2,c:3,h:4,w:2},{text:"JELLYFISH",color:"#e0796f",r:3,c:0,h:3,w:3}]}
];


// ===== процедурный генератор уровней (после L5 — бесконечно) =====
const POOL={
 3:["SEA","SUN","BAY","RAY","OAR","FIN","KOI","ICE"],
 4:["SAND","WAVE","PALM","REEF","TIDE","FISH","CRAB","BOAT","GULL","KELP","DUNE","SAIL","COVE","MIST","SWIM","CALM"],
 5:["BEACH","CORAL","WHALE","SHELL","SHARK","OCEAN","SHORE","CONCH","ALGAE","SQUID","PEARL"],
 6:["ISLAND","LAGOON","ANCHOR","TURTLE","PEBBLE","MARINA","SUNSET","BREEZE","URCHIN","WALRUS"],
 7:["DOLPHIN","OCTOPUS","SEAWEED","LOBSTER","PELICAN"],
 8:["STARFISH","FLAMINGO","SEAHORSE","SAILBOAT","PLANKTON"],
 9:["JELLYFISH","DRIFTWOOD","SURFBOARD"]};
const PALETTE=["#2ea49a","#6c9ed6","#b8a082","#a896d2","#d6c460","#e0796f","#6fb87a"];
const usedWords=new Set();
const rnd=n=>Math.floor(Math.random()*n);
function rectOpts(Ln,H,W){ const o=[]; for(let h=1;h<=Ln;h++) if(Ln%h===0&&h<=H&&Ln/h<=W) o.push([h,Ln/h]); return o; }
function pickLengths(area){ // разбить площадь на длины 3..9 (с учётом запаса слов в пуле)
  for(let t=0;t<200;t++){
    const lens=[]; let rem=area; const cnt={};
    let ok=true;
    while(rem>0){
      const cand=[];
      for(let l=3;l<=9;l++){
        if(l>rem) continue;
        if(rem-l!==0&&rem-l<3) continue;
        if((cnt[l]||0)>=POOL[l].length) continue;
        cand.push(l);
      }
      if(!cand.length){ ok=false; break; }
      const l=cand[rnd(cand.length)];
      lens.push(l); cnt[l]=(cnt[l]||0)+1; rem-=l;
    }
    if(ok) return lens;
  }
  return null;
}
function tileJS(W,H,lengths){
  const grid=[...Array(H)].map(()=>Array(W).fill(-1));
  const placed=[];
  function fe(){ for(let r=0;r<H;r++)for(let c=0;c<W;c++) if(grid[r][c]<0) return [r,c]; return null; }
  function bt(rem){
    const cell=fe(); if(!cell) return true;
    const [r,c]=cell; const seen=new Set();
    // перемешанный порядок длин
    const order=[...rem.keys()].sort(()=>Math.random()-0.5);
    for(const k of order){
      const Ln=rem[k]; if(seen.has(Ln)) continue; seen.add(Ln);
      const opts=rectOpts(Ln,H,W).sort(()=>Math.random()-0.5);
      for(const [h,w] of opts){
        if(r+h>H||c+w>W) continue;
        let free=true;
        for(let i=0;i<h&&free;i++)for(let j=0;j<w;j++) if(grid[r+i][c+j]>=0){ free=false; break; }
        if(!free) continue;
        for(let i=0;i<h;i++)for(let j=0;j<w;j++) grid[r+i][c+j]=placed.length;
        placed.push([r,c,h,w,Ln]);
        if(bt(rem.slice(0,k).concat(rem.slice(k+1)))) return true;
        placed.pop();
        for(let i=0;i<h;i++)for(let j=0;j<w;j++) grid[r+i][c+j]=-1;
      }
    }
    return false;
  }
  return bt(lengths)?placed:null;
}
function genLevel(n){ // n — номер уровня (6,7,8...)
  const Wg=6, Hg=4+Math.min(2,Math.floor((n-6)/2)); // 6×4 → 6×5 → 6×6
  for(let t=0;t<60;t++){
    const lens=pickLengths(Wg*Hg); if(!lens) continue;
    const placed=tileJS(Wg,Hg,lens); if(!placed) continue;
    // слова: на каждую длину — случайное, не использованное раньше; первые буквы в уровне разные
    const words=[]; const firsts=new Set(); let fail=false;
    for(const [r,c,h,w,Ln] of placed){
      let cand=POOL[Ln].filter(x=>!usedWords.has(x)&&!firsts.has(x[0]));
      if(!cand.length) cand=POOL[Ln].filter(x=>!firsts.has(x[0]));
      if(!cand.length){ fail=true; break; }
      const txt=cand[rnd(cand.length)];
      usedWords.add(txt); firsts.add(txt[0]);
      words.push({text:txt,color:PALETTE[words.length%PALETTE.length],r,c,h,w});
    }
    if(fail) continue;
    return {name:'L'+n+' · Шахта #'+(n-5),theme:'Океан ∞',W:Wg,H:Hg,words};
  }
  return null;
}
window.__gen=genLevel; // для автотеста

let cur=0, L, W, H, letter, owner, cells=[];
const solved=new Set();
const board=document.getElementById('board');
const fidx=(i,j,h,w)=> (w>=h) ? i*w+j : j*h+i;   // широкий→строки, высокий→столбцы

function buildBoard(){
  W=L.W; H=L.H;
  letter=[...Array(H)].map(()=>Array(W).fill(""));
  owner =[...Array(H)].map(()=>Array(W).fill(-1));
  L.words.forEach((wd,idx)=>{
    for(let i=0;i<wd.h;i++)for(let j=0;j<wd.w;j++){
      letter[wd.r+i][wd.c+j]=wd.text[fidx(i,j,wd.h,wd.w)];
      owner[wd.r+i][wd.c+j]=idx;
    }
  });
  board.style.gridTemplateColumns=`repeat(${W}, 1fr)`;
  board.innerHTML=''; cells=[];
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const d=document.createElement('div'); d.className='cell'; d.dataset.r=r; d.dataset.c=c;
    board.appendChild(d); cells.push(d);
  }
  board.appendChild(hand); // рука живёт внутри board, координаты — offsetLeft/Top клеток
}
const cellAt=(r,c)=>cells[r*W+c];

function sizeBoard(){
  const bw=Math.min(window.innerWidth-28, 560), gap=7;
  const cw=(bw-gap*(W-1))/W;
  board.style.width=bw+'px';
  cells.forEach(c=>{ c.style.height=cw+'px'; c.style.fontSize=(cw*0.4)+'px'; });
}

function levelsBar(){
  const box=document.getElementById('levels'); box.innerHTML='';
  LEVELS.slice(-7).forEach((lv,ii)=>{
    const i=LEVELS.length<=7?ii:LEVELS.length-7+ii;
    const b=document.createElement('button'); b.textContent='L'+(i+1);
    if(i===cur){ b.classList.add('cur'); b.style.background=lv.words[0].color; }
    b.onclick=()=>loadLevel(i); box.appendChild(b);
  });
}
function dots(){
  const box=document.getElementById('dots'); box.innerHTML='';
  L.words.forEach((wd,i)=>{ const d=document.createElement('div'); d.className='d';
    if(solved.has(i)) d.style.background=wd.color; box.appendChild(d); });
}
function paint(){
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const cell=cellAt(r,c), idx=owner[r][c], wd=L.words[idx];
    cell.className='cell'; cell.textContent=''; cell.style.removeProperty('--c');
    if(idx<0) continue;
    const isClue=(wd.r===r&&wd.c===c);
    if(solved.has(idx)){ cell.classList.add('solved'); cell.style.setProperty('--c',wd.color); cell.textContent=letter[r][c]; }
    else if(isClue){ cell.classList.add('clue'); cell.style.setProperty('--c',wd.color); cell.textContent=wd.text[0];
      const b=document.createElement('div'); b.className='badge'; b.textContent=wd.h*wd.w; cell.appendChild(b); }
  }
  dots();
}

// ---- tutorial hand (из Math Solitaire playable): показывает жест на 1-м уровне ----
const hand=document.getElementById('hand');
let guideTimer=null;
function stopGuide(){ clearTimeout(guideTimer); guideTimer=null; hand.classList.remove('tap'); hand.style.opacity=0; }
function guide(){
  stopGuide();
  if(cur!==0) return;
  const idx=L.words.findIndex((wd,i)=>!solved.has(i));
  if(idx<0) return;
  const wd=L.words[idx];
  const ctr=(r,c)=>{ const el=cellAt(r,c); return {x:el.offsetLeft+el.offsetWidth*0.5-42.7, y:el.offsetTop+el.offsetHeight*0.55-2.1}; }; // палец арта в точке (42.7,2.1)
  const A=ctr(wd.r,wd.c), B=ctr(wd.r+wd.h-1,wd.c+wd.w-1);
  (function cycle(){
    hand.style.transition='opacity .2s';
    hand.style.left=A.x+'px'; hand.style.top=A.y+'px';
    hand.style.opacity=1; hand.classList.add('tap');
    guideTimer=setTimeout(()=>{
      hand.classList.remove('tap');
      hand.style.transition='left .9s ease, top .9s ease, opacity .2s';
      hand.style.left=B.x+'px'; hand.style.top=B.y+'px';
      guideTimer=setTimeout(()=>{ hand.style.opacity=0; guideTimer=setTimeout(cycle,600); },1050);
    },800);
  })();
}

// ---- drag ----
let dragging=false, sr=0, sc=0;
function pos(e){
  // на touchend список e.touches пуст (палец поднят) → берём changedTouches
  const t=(e.touches&&e.touches.length)?e.touches[0]
        :(e.changedTouches&&e.changedTouches.length)?e.changedTouches[0]:e;
  const rc=board.getBoundingClientRect();
  const cw=rc.width/W, ch=rc.height/H;
  let c=Math.floor((t.clientX-rc.left)/cw), r=Math.floor((t.clientY-rc.top)/ch);
  return {r:Math.max(0,Math.min(H-1,r)), c:Math.max(0,Math.min(W-1,c))}; }
function bbox(r,c){ return {r0:Math.min(sr,r),c0:Math.min(sc,c),r1:Math.max(sr,r),c1:Math.max(sc,c)}; }
function showSel(bb){ paint();
  for(let r=bb.r0;r<=bb.r1;r++)for(let c=bb.c0;c<=bb.c1;c++){ const cell=cellAt(r,c);
    if(!cell.classList.contains('solved')){ cell.classList.add('sel'); if(owner[r][c]>=0) cell.textContent=letter[r][c]; } } }
function start(e){ e.preventDefault(); stopGuide(); const p=pos(e); sr=p.r; sc=p.c; dragging=true; showSel(bbox(sr,sc)); }
function move(e){ if(!dragging)return; e.preventDefault(); const p=pos(e); showSel(bbox(p.r,p.c)); }
function end(e){ if(!dragging)return; dragging=false; e.preventDefault();
  const p=pos(e), bb=bbox(p.r,p.c), h=bb.r1-bb.r0+1, w=bb.c1-bb.c0+1;
  const idx=L.words.findIndex((wd,i)=>!solved.has(i)&&wd.r===bb.r0&&wd.c===bb.c0&&wd.h===h&&wd.w===w);
  if(idx>=0){ solved.add(idx); paint(); document.getElementById('hint').textContent=`${L.words[idx].text} ✓`;
    if(solved.size===L.words.length) setTimeout(showWin,350);
  } else { for(let r=bb.r0;r<=bb.r1;r++)for(let c=bb.c0;c<=bb.c1;c++){ const cell=cellAt(r,c);
      if(!cell.classList.contains('solved')) cell.classList.add('bad'); } setTimeout(paint,260); }
  guide(); }
board.addEventListener('mousedown',start); board.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
board.addEventListener('touchstart',start,{passive:false}); board.addEventListener('touchmove',move,{passive:false}); board.addEventListener('touchend',end,{passive:false});

function showWin(){
  document.getElementById('winlbl').textContent=L.name+' ✓';
  document.getElementById('next').textContent='Дальше ▶';
  document.getElementById('win').classList.add('show');
}
document.getElementById('next').onclick=()=>{
  document.getElementById('win').classList.remove('show');
  if(cur===LEVELS.length-1){ // конец списка — генерируем новый уровень
    const lv=genLevel(LEVELS.length+1);
    if(lv){ LEVELS.push(lv); loadLevel(LEVELS.length-1); return; }
  }
  loadLevel(cur+1);
};
document.getElementById('reset').onclick=()=>loadLevel(cur);

function loadLevel(idx){
  cur=idx; L=LEVELS[idx]; solved.clear();
  document.getElementById('win').classList.remove('show');
  document.getElementById('title').textContent='Word Shikaku — '+L.name;
  document.getElementById('hint').textContent=L.theme?('Тема: '+L.theme):'Протяни прямоугольник от подсказки';
  buildBoard(); levelsBar(); paint(); sizeBoard(); guide();
}
window.addEventListener('resize',()=>{ sizeBoard(); guide(); });
loadLevel(0);
</script>
