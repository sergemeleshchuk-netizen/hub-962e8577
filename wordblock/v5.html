<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Wordblock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one-screen mobile game. Screens stack and cross-fade; chunky 3D tab bar at the bottom; popups float in the centre, sheets slide up. Single committed look: candy-3D on a deep violet sky */
:root{
  --sky1:#6A4BFF; --sky2:#3A22C4; --sky3:#1A0E6B;
  --navy:#1D1B5E; --navy2:#2E2C86; --muted:#7B7FB8; --panel:#FFFFFF; --panel2:#E6EBFF; --line:#C9D0F5;
  --gold:#FFD23F; --coin:#FFB800;
  --green1:#8BEA4F; --green2:#3DBB2A; --green3:#23801A;
  --blue1:#5CC2FF; --blue2:#2179F0; --blue3:#1448A8;
  --orange1:#FFD047; --orange2:#FF8F12; --orange3:#B95600;
  --red1:#FF7A88; --red2:#F0304F; --red3:#A0122E;
  --purple1:#C38CFF; --purple2:#8B46F0; --purple3:#5521A8;
  --display:'Lilita One','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --spring:cubic-bezier(.2,1.35,.4,1); --smooth:cubic-bezier(.2,.9,.25,1);
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%)}
#phone{position:relative;overflow:hidden;color:#fff;font-family:var(--body);font-weight:800;background-color:var(--sky3);
  background-image:radial-gradient(circle at 20% 15%,rgba(255,255,255,.14) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.1) 0 1.5px,transparent 2.5px),
    radial-gradient(120% 70% at 50% 0%,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 100%);
  background-size:90px 90px,60px 60px,100% 100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;width:100%;overflow:hidden}
@media (max-aspect-ratio:1/1){#phone{width:100vw;height:100dvh}}
@media (min-aspect-ratio:1/1){#phone{height:96dvh;aspect-ratio:9/16;width:auto;border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15}}
.out{text-shadow:0 2px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy),0 -2px 0 var(--navy),2px 2px 0 var(--navy),-2px 2px 0 var(--navy),2px -2px 0 var(--navy),-2px -2px 0 var(--navy),0 4px 0 var(--navy)}
.sout{text-shadow:0 1.5px 0 rgba(20,10,60,.55),1px 0 0 rgba(20,10,60,.35),-1px 0 0 rgba(20,10,60,.35),0 -1px 0 rgba(20,10,60,.35)}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:10px 16px;overflow-y:auto;overflow-x:hidden;
  opacity:0;visibility:hidden;transform:translateY(18px) scale(.98);transition:opacity .3s ease,transform .55s var(--smooth),visibility 0s linear .3s;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.on{opacity:1;visibility:visible;transform:none;transition:opacity .3s ease,transform .55s var(--smooth),visibility 0s}
.screen.tabbed{padding-bottom:calc(98px + env(safe-area-inset-bottom,0px))}
.screen.game{overflow:hidden;gap:8px;padding-block:8px 6px}
.bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubbles i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08) 60%,transparent 70%);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-120vh)}}

/* 3D buttons */
.b3{--t:var(--blue1);--m:var(--blue2);--d:var(--blue3);position:relative;border:0;cursor:pointer;border-radius:18px;color:#fff;font:22px/1 var(--display);letter-spacing:.02em;
  background:linear-gradient(var(--t),var(--m));box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.14),0 6px 0 var(--d),0 12px 20px rgba(10,0,60,.35);
  transition:transform .14s var(--spring),box-shadow .14s;text-shadow:0 2px 0 rgba(0,0,0,.22)}
.b3::after{content:"";position:absolute;left:8%;right:8%;top:5px;height:36%;border-radius:12px 12px 40% 40%;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.05));pointer-events:none}
.b3:active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.14),0 1px 0 var(--d),0 4px 8px rgba(10,0,60,.3)}
.b3[disabled]{filter:grayscale(.8) brightness(.9);opacity:.7;cursor:default}
.green{--t:var(--green1);--m:var(--green2);--d:var(--green3)}
.orange{--t:var(--orange1);--m:var(--orange2);--d:var(--orange3)}
.red{--t:var(--red1);--m:var(--red2);--d:var(--red3)}
.purple{--t:var(--purple1);--m:var(--purple2);--d:var(--purple3)}
.ic{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;padding:0}
.ic::after{border-radius:10px 10px 40% 40%;top:4px}
.ic svg{width:22px;height:22px;position:relative;z-index:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.bar{flex:none;display:flex;align-items:center;gap:10px;min-height:46px}
.bar h1{flex:1;min-width:0;margin:0;font:30px/1.1 var(--display);letter-spacing:.02em}
.bar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 6px;border-radius:18px;background:linear-gradient(#2A2A86,#1B1A60);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.25),0 3px 0 rgba(10,0,40,.4);font:18px var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.pill .pi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.coin{background:radial-gradient(circle at 35% 30%,#FFF2A8,#FFC21A 55%,#D68A00);box-shadow:inset 0 -2px 0 rgba(150,80,0,.4),0 0 0 2px #B86E00}
.coin::before{content:"";width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(150,80,0,.55)}
.book{background:linear-gradient(#5CC2FF,#2179F0);box-shadow:0 0 0 2px #1448A8}
.book svg{width:15px;height:15px}
.hardtag{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 9px;border-radius:11px;background:linear-gradient(var(--red1),var(--red2));color:#fff;font:13px/22px var(--display);letter-spacing:.04em;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 2px 0 var(--red3);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.hardtag svg{width:12px;height:12px}
.frame{padding:8px;border-radius:16px;background:linear-gradient(150deg,#FFF1A8,#FFC93A 30%,#E8920E 65%,#FFD86A);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(140,70,0,.35),0 6px 0 #9A5A06,0 14px 26px rgba(10,0,60,.45)}
.frame canvas{display:block;width:100%;aspect-ratio:3/4;height:auto;border-radius:8px;background:#1B1A60;box-shadow:0 0 0 2px rgba(140,70,0,.5)}
.prog{height:12px;border-radius:6px;background:#D6DCFA;box-shadow:inset 0 2px 3px rgba(20,20,80,.25);overflow:hidden}
.prog i{display:block;height:100%;border-radius:6px;background:linear-gradient(var(--green1),var(--green2));box-shadow:inset 0 2px 0 rgba(255,255,255,.45);transition:width .8s var(--smooth)}
.card{border-radius:22px;color:var(--navy);background:linear-gradient(#FFFFFF,#E8EDFF);box-shadow:inset 0 2px 0 #fff,inset 0 -3px 0 rgba(120,130,220,.25),0 6px 0 #A9B3EE,0 14px 26px rgba(10,0,60,.35)}

/* home */
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:2px}
.lrow{display:flex;gap:5px}
.lt{width:46px;height:50px;opacity:0}
.logo.go .lt{animation:drop .75s var(--spring) both;animation-delay:calc(var(--i)*60ms + 80ms)}
.lt b{display:grid;place-items:center;width:100%;height:100%;border-radius:12px;font:26px var(--display);color:var(--navy);position:relative;
  background:linear-gradient(color-mix(in srgb,var(--c) 60%,#fff),var(--c) 55%);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.15),0 5px 0 color-mix(in srgb,var(--c) 55%,#000),0 10px 16px rgba(10,0,60,.4);
  animation:bob 4s ease-in-out infinite;animation-delay:calc(var(--i)*-370ms)}
.lt b::before{content:"";position:absolute;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#E9EEFF);box-shadow:0 2px 0 rgba(20,20,80,.25)}
.lt b span{position:relative;top:1px}
@keyframes drop{0%{opacity:0;transform:translateY(-80px) rotate(-12deg) scale(.8)}60%{opacity:1;transform:translateY(6px) rotate(3deg) scale(1.05)}80%{transform:translateY(-3px) rotate(-1deg)}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(1.5deg)}}
.tagline{margin:0;font-size:14px;color:#D9D6FF;text-align:center}
.curcard{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;width:100%;text-align:left;border:0;cursor:pointer;padding:12px;transition:transform .2s var(--spring)}
.curcard:active{transform:scale(.97)}
.curcard .frame{padding:5px;border-radius:12px}
.curcard .eb{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.curcard b{display:block;font:24px/1.1 var(--display);margin:2px 0 2px}
.curcard small{display:block;font-size:13.5px;color:var(--muted);margin-bottom:9px}
.curcard .meta{font-size:12.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.play{width:100%;padding:18px 18px 16px;display:flex;align-items:center;justify-content:center;gap:14px;animation:breathe 2.4s ease-in-out infinite}
.play svg{width:34px;height:34px;position:relative;z-index:1;filter:drop-shadow(0 3px 0 rgba(20,80,10,.45))}
.play .pt{text-align:left;position:relative;z-index:1}
.play .pt b{display:block;font:34px/1 var(--display);letter-spacing:.03em}
.play .pt small{display:flex;align-items:center;gap:8px;font:800 15px var(--body);margin-top:3px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
@keyframes breathe{50%{transform:scale(1.025)}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:12px 12px 14px;min-height:112px;border-radius:20px}
.mode .mi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.25);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.15);position:relative;z-index:1}
.mode .mi svg{width:24px;height:24px}
.mode b{font:20px/1.05 var(--display);letter-spacing:.02em;position:relative;z-index:1}
.mode small{font:800 12.5px/1.25 var(--body);opacity:.95;position:relative;z-index:1;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.mode .dot{position:absolute;top:-5px;right:-5px;min-width:24px;height:24px;border-radius:12px;background:linear-gradient(var(--red1),var(--red2));box-shadow:0 2px 0 var(--red3),0 0 0 3px #fff;font:14px/24px var(--display);text-align:center;z-index:2;animation:ping 1.4s ease infinite}
@keyframes ping{50%{transform:scale(1.15)}}

/* tab bar */
.tabbar{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:8px;padding:8px;border-radius:26px;
  background:linear-gradient(#2E2C96,#1D1B66);box-shadow:inset 0 2px 0 rgba(255,255,255,.15),inset 0 -3px 0 rgba(0,0,0,.3),0 6px 0 #0F0E3E,0 14px 30px rgba(0,0,0,.45);transition:transform .45s var(--smooth)}
.tabbar.off{transform:translateY(160%)}
.tab{flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:18px;color:#9EA2E8;font:15px var(--display);letter-spacing:.03em;transition:color .2s,transform .3s var(--spring)}
.tab svg{width:26px;height:26px;transition:transform .35s var(--spring)}
.tab.on{color:#fff;background:linear-gradient(var(--orange1),var(--orange2));box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 4px 0 var(--orange3);transform:translateY(-4px);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.tab.on svg{transform:scale(1.12);filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}

/* journey */
.tlist{display:flex;flex-direction:column;gap:14px}
.tcard{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;border:0;cursor:pointer;text-align:left;padding:10px 14px 10px 10px;position:relative;transition:transform .18s var(--spring)}
.tcard:active{transform:scale(.97)}
.tcard .frame{padding:4px;border-radius:10px}
.tcard .eb{font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tcard b{display:block;font:22px/1.1 var(--display)}
.tcard small{display:block;font-size:13px;color:var(--muted);margin:1px 0 8px}
.tcard .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.tcard.locked{filter:saturate(.25) brightness(.8)}
.tcard .lock{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff}
.tcard .lock svg{width:15px;height:15px}

/* theme */
.thead{display:grid;grid-template-columns:44% 1fr;gap:16px;align-items:center}
.thead .eb{font-size:12px;color:#C8C4FF;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px}
.thead b{display:block;font:24px/1.1 var(--display);margin-bottom:8px}
.thead p{margin:0 0 12px;font-size:14px;line-height:1.4;color:#DCD9FF}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 12px;padding-top:6px}
.lnode{--t:#FFFFFF;--m:#DCE2FF;--d:#8F99D8;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:var(--navy);font-size:26px;padding:0;text-shadow:none}
.lnode::after{border-radius:50%;left:18%;right:18%;top:6%;height:34%}
.lnode span.n{position:relative;z-index:1}
.lnode.done{--t:var(--green1);--m:var(--green2);--d:var(--green3);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.lnode.cur{--t:var(--orange1);--m:var(--orange2);--d:var(--orange3);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);animation:pulse 1.4s ease-in-out infinite}
.lnode.lock{--t:#4B4AA8;--m:#363488;--d:#1F1E5E;color:rgba(255,255,255,.5);cursor:default}
.lnode.hard:not(.done):not(.lock){box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 0 0 4px var(--red2),0 6px 0 var(--red3),0 12px 20px rgba(10,0,60,.35)}
.lnode .tag{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:2}
.lnode .ck{position:absolute;top:-4px;right:-4px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--green2);display:grid;place-items:center;box-shadow:0 2px 0 var(--green3);z-index:2}
.lnode .ck svg{width:14px;height:14px}
.lnode svg.lk{width:22px;height:22px;position:relative;z-index:1}
@keyframes pulse{50%{transform:scale(1.08)}}

/* gallery */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.gcard{border:0;background:none;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;gap:8px;transition:transform .2s var(--spring)}
.gcard:active{transform:scale(.96)}
.gcard b{font:18px/1.1 var(--display);letter-spacing:.02em}
.gcard small{display:block;font-size:12.5px;color:#C8C4FF;margin-top:2px}
.gcard .frame{transform:rotate(var(--r,0deg))}

/* words */
.dgroup h2{margin:8px 0 8px;font:22px var(--display);display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.02em}
.dgroup h2 span{font:800 13px var(--body);color:#C8C4FF}
.dwords{display:flex;flex-direction:column;gap:10px}
.wcard{padding:12px 14px;border-radius:18px}
.wcard b{font:20px var(--display);letter-spacing:.06em;color:var(--blue2)}
.wcard i{display:block;font-style:normal;font-size:13px;color:var(--muted);margin:1px 0 5px}
.wcard span{display:block;font-size:14.5px;line-height:1.4;font-weight:700}
.wcard.lock b{color:var(--line);letter-spacing:.3em}

/* game */
.hud{flex:none;display:flex;align-items:center;gap:8px}
.lvl{flex:1;min-width:0}
.lvl small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#C8C4FF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl b{display:flex;align-items:center;gap:6px;font:21px/1.15 var(--display);letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.stat{flex:none;min-width:56px;padding:3px 10px 4px;border-radius:14px;background:linear-gradient(#2A2A86,#1B1A60);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 3px 0 rgba(10,0,40,.45);text-align:center}
.stat small{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#A9A6F0}
.stat b{display:inline-block;font:19px/1.05 var(--display);font-variant-numeric:tabular-nums;color:var(--gold)}
.stat.low b{color:var(--red1);animation:ping .8s ease infinite}
.stat b.bump{animation:bump .35s var(--spring)}
@keyframes bump{40%{transform:scale(1.35)}}
.band{flex:none;border-radius:20px;padding:8px 10px 6px;cursor:pointer}
.band-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.band-head h2{margin:0;font:15px/1 var(--display);letter-spacing:.06em;color:var(--navy2)}
.band-head .pg{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cw-grid{--cs:24px;display:grid;gap:3px;grid-auto-rows:var(--cs);justify-content:center}
.cw-void{width:var(--cs);height:var(--cs)}
.cw-cell{width:var(--cs);height:var(--cs);border-radius:calc(var(--cs)*.24);position:relative;display:grid;place-items:center;background:#D9DFFB;box-shadow:inset 0 2px 3px rgba(40,40,120,.28);transition:background .3s,box-shadow .3s}
.cw-cell .no{position:absolute;top:1px;left:3px;font:900 calc(var(--cs)*.27)/1 var(--body);color:var(--muted)}
.cw-grid.tiny .no{display:none}
.cw-cell .ch{font:calc(var(--cs)*.62)/1 var(--display);color:var(--navy);opacity:0;transform:scale(.3);transition:opacity .2s,transform .4s var(--spring)}
.cw-cell.on{background:linear-gradient(#FFF07A,#FFC21A);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 2px 0 #C98500}
.cw-cell.on .ch{opacity:1;transform:none}
.cw-cell.land::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:3px solid var(--orange2);animation:ring .55s ease-out forwards;pointer-events:none}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(2);opacity:0}}
.cw-cell.done{background:linear-gradient(var(--green1),var(--green2));box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 2px 0 var(--green3)}
.cw-cell.done .ch{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.cw-cell.done .no{color:rgba(255,255,255,.75)}
.cw-cell.wave{animation:wave .55s var(--spring)}
.cw-cell.sel{outline:3px solid var(--blue2);outline-offset:1px}
@keyframes wave{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px) scale(1.15)}}
.strip{display:flex;align-items:center;gap:6px;margin-top:6px;border-top:2px dashed var(--line);padding-top:6px}
.strip .nav{width:32px;height:32px;flex:none;border:0;border-radius:10px;background:var(--panel2);color:var(--navy2);font:22px/1 var(--display);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.strip .cur{flex:1;min-width:0;border:0;background:none;text-align:left;font-weight:800;font-size:14px;line-height:1.25;color:var(--navy);padding:2px;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.strip .cur em{font-style:normal;font-family:var(--display);color:var(--blue2);margin-right:4px}
.strip .cur .tap{color:var(--muted)}
.tools{flex:none;display:flex;gap:8px}
.tool{flex:1;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:6px;font:16px var(--display);letter-spacing:.02em}

function layoutOnce(words){
  const grid=new Map(),dirs=new Map(),placed=[];
  const K=(r,c)=>r+','+c, get=(r,c)=>grid.get(K(r,c));
  function score(w,r,c,dir){const dr=dir?1:0,dc=dir?0:1,n=w.length;
    if(get(r-dr,c-dc)||get(r+dr*n,c+dc*n))return -1;let inter=0;
    for(let i=0;i<n;i++){const rr=r+dr*i,cc=c+dc*i,g=get(rr,cc);
      if(g){if(g!==w[i])return -1;if((dirs.get(K(rr,cc))||[]).includes(dir))return -1;inter++}
      else if(get(rr+dc,cc+dr)||get(rr-dc,cc-dr))return -1}
    return inter}
  function put(o,r,c,dir){const dr=dir?1:0,dc=dir?0:1;for(let i=0;i<o.word.length;i++){const k=K(r+dr*i,c+dc*i);grid.set(k,o.word[i]);dirs.set(k,[...(dirs.get(k)||[]),dir])}placed.push({...o,r,c,dir})}
  function bbox(ex){let r0=1e9,r1=-1e9,c0=1e9,c1=-1e9;const add=(r,c)=>{r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c)};
    for(const k of grid.keys()){const[r,c]=k.split(',').map(Number);add(r,c)}
    if(ex){add(ex.r,ex.c);add(ex.r+(ex.dir?ex.n-1:0),ex.c+(ex.dir?0:ex.n-1))}return{r0,r1,c0,c1}}
  put(words[0],0,0,0);let rest=words.slice(1),prog=true;
  while(rest.length&&prog){prog=false;
    for(const o of [...rest]){let best=null;
      for(const p of placed)for(let j=0;j<p.word.length;j++){const pr=p.r+(p.dir?j:0),pc=p.c+(p.dir?0:j);
        for(let i=0;i<o.word.length;i++){if(o.word[i]!==p.word[j])continue;const dir=p.dir?0:1;const r=dir?pr-i:pr,c=dir?pc:pc-i;
          const s=score(o.word,r,c,dir);if(s<1)continue;const b=bbox({r,c,dir,n:o.word.length});const rows=b.r1-b.r0+1,cols=b.c1-b.c0+1;

}
function buildCrossword(list,seed,maxCols){
  const rng=mulberry(seed||1);const base=list.map(([word,clue,fact])=>({word,clue,fact}));
  let best=null;
  for(let t=0;t<80;t++){const ws=base.slice();
    if(t===0)ws.sort((a,b)=>b.word.length-a.word.length);else for(let i=ws.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[ws[i],ws[j]]=[ws[j],ws[i]]}
    const r=layoutOnce(ws);const pen=r.unplaced.length*1000+(r.cols>maxCols?500:0)+r.rows*12+r.cols;
    if(!best||pen<best.pen)best={...r,pen}}
  return best}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffleR(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fitsLayout(ws){const r=layoutOnce(ws.map(([word,clue,fact])=>({word,clue,fact})).sort((a,b)=>b.word.length-a.word.length));return !r.unplaced.length&&r.rows<=7&&r.cols<=11}
function pickSet(pool,n,rng,tries){
  for(let a=0;a<(tries||60);a++){const sh=shuffleR(pool.slice(),rng);const set=[sh[0]];
    for(let k=1;k<sh.length&&set.length<n;k++){const test=set.concat([sh[k]]);if(fitsLayout(test))set.push(sh[k])}
    if(set.length===n)return set}
  return null}

function levelWords(t){

    for(let a=0;a<80&&!best;a++){
      const g1=shuffleR(bank.filter(w=>!used.has(w[0])&&w[0].length<=maxLen),rng),g2=shuffleR(bank.filter(w=>!used.has(w[0])&&w[0].length>maxLen),rng),g3=shuffleR(bank.filter(w=>used.has(w[0])),rng);
      const order=g1.concat(g2,g3);if(!order.length)break;const set=[order[0]];
      for(let k=1;k<order.length&&set.length<n;k++){const test=set.concat([order[k]]);if(fitsLayout(test))set.push(order[k])}
      if(set.length===n)best=set}
    if(!best)best=bank.slice(0,n);best.forEach(w=>used.add(w[0]));out.push(best)});
  return LWC[t]=out}

const union=(...ps)=>{const p=new Path2D();ps.forEach(q=>p.addPath(q));return p};
function wave(y0,amp,len,ph){const p=new Path2D();p.moveTo(0,AH);p.lineTo(0,y0);for(let x=0;x<=AW;x+=8)p.lineTo(x,y0+Math.sin(x/len*6.283+ph)*amp+Math.sin(x/len*13.2+ph*1.7)*amp*.35);p.lineTo(AW,AH);p.closePath();return p}
function leaf(x,y,len,wid,ang){const c=Math.cos(ang),s=Math.sin(ang),T=(u,v)=>[x+u*c-v*s,y+u*s+v*c];const p=new Path2D();p.moveTo(...T(0,0));p.quadraticCurveTo(...T(len*.45,-wid),...T(len,0));p.quadraticCurveTo(...T(len*.45,wid),...T(0,0));p.closePath();return p}
function birds(g,list,col){g.save();g.strokeStyle=col;g.lineWidth=2.4;g.lineCap='round';for(const[x,y,s]of list){g.beginPath();g.moveTo(x-s,y-s*.25);g.quadraticCurveTo(x-s*.45,y-s*.7,x,y);g.quadraticCurveTo(x+s*.45,y-s*.7,x+s,y-s*.25);g.stroke()}g.restore()}
function glow(g,x,y,r,c){g.save();g.globalCompositeOperation='lighter';g.fillStyle=rad(g,x,y,0,x,y,r,[[0,c],[1,'rgba(0,0,0,0)']]);g.fillRect(x-r,y-r,r*2,r*2);g.restore()}
function sparkle(g,x,y,s,c){g.save();g.globalCompositeOperation='lighter';g.fillStyle=c;g.beginPath();g.moveTo(x,y-s);g.quadraticCurveTo(x,y,x+s,y);g.quadraticCurveTo(x,y,x,y+s);g.quadraticCurveTo(x,y,x-s,y);g.quadraticCurveTo(x,y,x,y-s);g.fill();g.restore()}

function drips(cx,cy,rx,ry,list){const p=new Path2D();p.moveTo(cx-rx,cy);p.ellipse(cx,cy,rx,ry,0,Math.PI,Math.PI*2);
  for(let x=cx+rx;x>=cx-rx;x-=3){const u=(x-cx)/rx;let y=cy+ry*Math.sqrt(Math.max(0,1-u*u))+7;for(const[dx,l,w]of list)y+=l*Math.exp(-Math.pow((x-dx)/w,2));p.lineTo(x,y)}p.closePath();return p}

  const hs=[];for(let r=1;r<R;r++){const xs=new Set([0,AW]);[rows[r-1],rows[r]].forEach(k=>{for(let c=1;c<k;c++)xs.add(Math.round(AW*c/k))});const a=[...xs].sort((x,y)=>x-y);hs[r]=a.slice(0,-1).map((x,i)=>({a:x,b:a[i+1],s:sg()}))}
  const list=[],off=[];let o=0;

/* ---------- glossy 3D blocks ---------- */

/* ---------- board layout ---------- */

/* ---------- crossword ---------- */
function initCW(words,seed,given){

    for(let i=0;i<w.word.length;i++){const r=w.r+(w.dir?i:0),c=w.c+(w.dir?0:i),k=r+','+c;if(!cw.cells.has(k))cw.cells.set(k,{key:k,r,c,letter:w.word[i],revealed:false,reserved:false,words:[],el:null});cw.cells.get(k).words.push(o);o.keys.push(k)}
    cw.words.push(o)});
  const starts=[...new Set(cw.words.map(w=>w.keys[0]))].map(k=>cw.cells.get(k)).sort((a,b)=>a.r-b.r||a.c-b.c);
  starts.forEach((c,i)=>{c.num=i+1});cw.words.forEach(w=>w.num=cw.cells.get(w.keys[0]).num);cw.words.sort((a,b)=>a.num-b.num||a.dir-b.dir);
  const rng=mulberry(seed+5),all=[...cw.cells.values()];for(let i=0;i<given&&i<all.length-2;i++){const pool=all.filter(c=>!c.revealed);pool[Math.floor(rng()*pool.length)].revealed=true}
  renderCW()}
function gridEl(cs,withEl){

  for(let r=0;r<cw.rows;r++)for(let c=0;c<cw.cols;c++){const k=r+','+c,cl=cw.cells.get(k),d=document.createElement('div');
    if(!cl){d.className='cw-void';g.appendChild(d);continue}
    d.className='cw-cell'+(cl.revealed?' on':'')+(cl.revealed&&cl.words.some(w=>w.done)?' done':'');d.dataset.key=k;
    d.innerHTML=(cl.num?`<span class="no">${cl.num}</span>`:'')+`<span class="ch">${cl.letter}</span>`;if(withEl)cl.el=d;g.appendChild(d)}
  return g}
function bandCS(){const bw=$('#band').clientWidth-20,maxH=clamp($('#phone').clientHeight*.2,70,170);return Math.max(12,Math.floor(Math.min(28,(bw-(cw.cols-1)*3)/cw.cols,(maxH-(cw.rows-1)*3)/cw.rows)))}

  stripIdx=(stripIdx%open.length+open.length)%open.length;const w=open[stripIdx];el.innerHTML=`<em>${w.num}${w.dir?'↓':'→'}</em>${w.clue} <span class="tap">(${w.word.length})</span>`}

/* ---------- letters ---------- */
function neededLetters(){
  const cnt={};for(const c of cw.cells.values())if(!c.revealed&&!c.reserved)cnt[c.letter]=(cnt[c.letter]||0)+1;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=board[r][c];if(t&&t.letter)cnt[t.letter]=(cnt[t.letter]||0)-1}
  for(const p of tray)if(p)for(const k in p.letters)cnt[p.letters[k]]=(cnt[p.letters[k]]||0)-1;
  const out=[];for(const l in cnt)for(let i=0;i<cnt[l];i++)out.push(l);return out}
function revealCell(k,opts={}){
  if(!cw)return;const c=cw.cells.get(k);if(!c||c.revealed)return;c.revealed=true;c.reserved=false;
  if(c.el){c.el.classList.add('on','land');const el=c.el;setTimeout(()=>el.classList.remove('land'),600)}
  chime(note(revealCount++%15,523),.2);addScore(opts.bonus??25);
  c.words.forEach(w=>{if(!w.done&&w.keys.every(x=>cw.cells.get(x).revealed))completeWord(w)});
  renderStrip();if(sheetKind==='cw')openCrossword(true);else if(sheetKind==='guess'&&guessRender)guessRender()}
function completeWord(w){
  w.done=true;w.keys.forEach((k,i)=>{const el=cw.cells.get(k).el;if(el)setTimeout(()=>{el.classList.add('done','wave');setTimeout(()=>el.classList.remove('wave'),560)},i*70)});
  setTimeout(()=>arp(392),120);haptic(20);addScore(100);addCoins(5);store.patch(s=>{s.learned=s.learned||{};s.learned[w.word]=1});
  const k=cw.words.filter(x=>x.done).length;let rew;if(k%2===1){hammers++;rew='+1 Hammer'}else{rerolls++;rew='+1 Shuffle'}
  updateTools();showToast(`<b>${w.word}</b>${w.fact}<br><span class="rew">${rew} · +5 coins</span>`,4200);updateProg();
  if(cw.words.every(x=>x.done)){if(cfg.mode==='endless'||cfg.mode==='zen')setTimeout(nextRound,1700);else if(over!=='done'){over='done';drag=null;hammerMode=false;closePop();setTimeout(win,1500)}}}
const prog=c=>Math.max(...c.words.map(w=>w.done?-1:w.keys.filter(k=>cw.cells.get(k).revealed).length/w.keys.length));
function releaseLetter(letter,x,y){

  if(!cand.length){addScore(15);floaters.push({x:x-cell*.3,y,t0:now,text:'+15',size:cell*.38,color:'#FFFFFF'});return}
  cand.sort((a,b)=>prog(b)-prog(a));const tgt=cand[0];tgt.reserved=true;const r=cv.getBoundingClientRect();flyLetter(letter,r.left+x,r.top+y,tgt.key,0)}
function flyLetter(letter,fx,fy,key,delay){
  const cwRef=cw,cl=cw.cells.get(key);if(!cl||!cl.el){if(cl){cl.reserved=false;revealCell(key)}return}
  const tr=cl.el.getBoundingClientRect(),sz=Math.max(30,cell*.68);
  const d=document.createElement('div');d.className='fl';d.textContent=letter;d.style.cssText=`left:${fx-sz/2}px;top:${fy-sz/2}px;width:${sz}px;height:${sz}px;font-size:${sz*.6}px`;
  $('#fly').appendChild(d);flights++;const dx=tr.left+tr.width/2-fx,dy=tr.top+tr.height/2-fy,end=Math.max(.3,tr.width/sz),side=dx>0?-1:1;
  const kf=[{transform:'translate(0,0) scale(.3) rotate(-20deg)',opacity:0},{transform:`translate(${dx*.1+side*30}px,${dy*.2-50}px) scale(1.35) rotate(${side*8}deg)`,opacity:1,offset:.32},{transform:`translate(${dx*.75}px,${dy*.85}px) scale(${end*1.2}) rotate(0)`,opacity:1,offset:.85},{transform:`translate(${dx}px,${dy}px) scale(${end})`,opacity:1}];
  let done=false;const fin=()=>{if(done)return;done=true;d.remove();flights=Math.max(0,flights-1);if(cw===cwRef)revealCell(key);checkEnd()};
  try{const a=d.animate(kf,{duration:820,delay,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});a.onfinish=fin}catch(e){setTimeout(fin,delay+50)}setTimeout(fin,delay+1500)}

/* ---------- blocks ---------- */
function makePiece(){
  const sh=SHAPES[pickShape(cfg.pool)],p={cells:sh.cells,w:sh.w,h:sh.h,color:pick(COLORS),letters:{},spawn:now,ret:null};const need=neededLetters();
  if(need.length&&Math.random()<cfg.chance){const i=ri(p.cells.length);p.letters[i]=pick(need);
    if(p.cells.length>=4&&Math.random()<.35){need.splice(need.indexOf(p.letters[i]),1);if(need.length){let j=ri(p.cells.length);if(j===i)j=(j+1)%p.cells.length;p.letters[j]=pick(need)}}}
  return p}
function fits(p,r0,c0){for(const[dr,dc]of p.cells){const r=r0+dr,c=c0+dc;if(r<0||c<0||r>=N||c>=N||board[r][c])return false}return true}
function anyFit(p){for(let r=0;r<=N-p.h;r++)for(let c=0;c<=N-p.w;c++)if(fits(p,r,c))return true;return false}
function deal(){
  for(let a=0;a<14;a++){tray=[null,null,null];for(let i=0;i<3;i++)tray[i]=makePiece();if(tray.some(anyFit))break}
  if(!tray.some(anyFit)){const s=SHAPES.o1;tray[0]={cells:s.cells,w:1,h:1,color:pick(COLORS),letters:{},spawn:now,ret:null}}
  tray.forEach((p,i)=>{p.spawn=now+i*90});swish(.05,.3)}
function place(p,r0,c0){
  p.cells.forEach(([dr,dc],i)=>{board[r0+dr][c0+dc]={color:p.color,letter:p.letters[i]||null,hp:1,pop:now+i*22}});
  p.cells.forEach((_,i)=>tock(300+Math.random()*60,.42,.1,i*.022));haptic(10);moves++;if(movesLeft)movesLeft--;
  addScore(p.cells.length);tray[tray.indexOf(p)]=null;resolveLines(r0+p.h/2,c0+p.w/2);
  if(tray.every(x=>!x))setTimeout(()=>{if(!over)deal()},280);updateHud();setTimeout(checkEnd,950)}
function fullLines(extra){
  const filled=(r,c)=>board[r][c]||(extra&&extra.has(r+','+c)),rows=[],cols=[];
  for(let r=0;r<N;r++){let f=true;for(let c=0;c<N;c++)if(!filled(r,c)){f=false;break}if(f)rows.push(r)}
  for(let c=0;c<N;c++){let f=true;for(let r=0;r<N;r++)if(!filled(r,c)){f=false;break}if(f)cols.push(c)}return{rows,cols}}
function breakSet(cells,cr,cc,force){
  const list=cells.map(([r,c])=>({r,c,d:Math.hypot(r+.5-cr,c+.5-cc)})).sort((a,b)=>a.d-b.d);let broken=0;
  list.forEach(({r,c,d},i)=>{const t=board[r][c];if(!t)return;const delay=70+d*45;
    if(t.hp>1&&!force){t.hp=1;t.strap=now+delay;events.push({t:now+delay,fn:()=>{const[x,y]=cellXY(r,c);chips(x+cell/2,y+cell/2,'#C9D0E0',8);tock(1500,.12,.06)}})}
    else{broken++;board[r][c]=null;fading.push({r,c,t,t0:now+delay,dir:Math.random()<.5?-1:1});
      events.push({t:now+delay,fn:()=>{const[x,y]=cellXY(r,c);chips(x+cell/2,y+cell/2,t.color,9);sparks(x+cell/2,y+cell/2,3);tock(note(i,330),.32,.12);if(t.letter)releaseLetter(t.letter,x+cell/2,y+cell/2)}})}});
  return{broken,span:list.length}}
function resolveLines(cr,cc){
  const{rows,cols}=fullLines(),lines=rows.length+cols.length;if(!lines){streak=0;return}streak++;
  const set=new Map();rows.forEach(r=>{for(let c=0;c<N;c++)set.set(r+','+c,[r,c])});cols.forEach(c=>{for(let r=0;r<N;r++)set.set(r+','+c,[r,c])});
  const{broken,span}=breakSet([...set.values()],cr,cc);
  swish(.07+lines*.02,.35);haptic(lines>1?[12,40,18]:16);if(lines>1)shake(3+lines,340);
  const pts=broken*10*lines*Math.max(1,streak);addScore(pts);const x=bx+cc*cell,y=by+cr*cell;
  floaters.push({x,y,t0:now,text:'+'+pts,size:cell*.62,color:'#FFD23F'});
  const label=lines>=3?'AMAZING!':lines===2?'DOUBLE!':streak>=2?`COMBO x${streak}`:'';
  if(label)floaters.push({x,y:y-cell*.85,t0:now+120,text:label,size:cell*.6,color:'#FFFFFF'});
  lineCharge+=lines;let gained=0;while(lineCharge>=4){lineCharge-=4;hintsLeft++;gained++}
  if(gained)floaters.push({x:W*.82,y:trayTop-cell*.2,t0:now+300,text:'+1 HINT',size:cell*.4,color:'#8BEA4F'});updateTools();
  if(board.every(row=>row.every(t=>!t))){addScore(300);setTimeout(()=>{arp(523);floaters.push({x:W/2,y:boardH/2,t0:now,text:'CLEAR BOARD! +300',size:cell*.5,color:'#8BEA4F'});shake(6,420)},span*28+380)}}

function cellXY(r,c){return[bx+c*cell,by+r*cell]}
function chips(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=1.5+Math.random()*3.8;particles.push({k:'chip',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3.2,rot:Math.random()*6,vr:(Math.random()-.5)*.45,life:1,color:shade(color,(Math.random()-.3)*.4),w:cell*(.1+Math.random()*.12),h:cell*(.1+Math.random()*.1)})}}

function confetti(){try{const c=$('#confetti'),g=c.getContext('2d'),innerWidth=c.clientWidth,innerHeight=c.clientHeight;c.width=innerWidth*DPR;c.height=innerHeight*DPR;g.setTransform(DPR,0,0,DPR,0,0);
  const P=Array.from({length:110},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-6-Math.random()*12,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:pick(COLORS),w:6+Math.random()*6,h:4+Math.random()*4}));const t0=performance.now();
  const step=t=>{g.clearRect(0,0,innerWidth,innerHeight);const e=(t-t0)/1000;P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=clamp(2.6-e,0,1);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()});if(e<2.6)requestAnimationFrame(step);else g.clearRect(0,0,innerWidth,innerHeight)};requestAnimationFrame(step)}catch(e){}}

  $('#nHammer').textContent=hammers;$('#tHammer').dataset.empty=hammers?0:1;$('#tHammer').classList.toggle('on',hammerMode);
  $('#nReroll').textContent=rerolls;$('#tReroll').dataset.empty=rerolls?0:1;$('#nHint').textContent=hintsLeft;$('#tHint').dataset.empty=hintsLeft?0:1;
  $('#ringArc').setAttribute('stroke-dashoffset',(62.83*(1-lineCharge/4)).toFixed(2))}

$('#tHammer').addEventListener('click',()=>{ensureAudio();if(over)return;if(!hammers){showToast('<b>No hammers</b>Solve words to earn hammers and shuffles.',2600);return}
  hammerMode=!hammerMode;updateTools();tock(hammerMode?260:600,.3,.12);if(hammerMode)showToast('<b>Hammer ready</b>Tap any block on the board to smash it.',2600)});

  const pool=[...cw.cells.values()].filter(c=>!c.revealed&&!c.reserved);if(!pool.length)return;pool.sort((a,b)=>prog(b)-prog(a));const c=pool[0];c.reserved=true;hintsLeft--;updateTools();

  chips(x+cell/2,y+cell/2,t.color,16);sparks(x+cell/2,y+cell/2,5);tock(150,.65,.22);tock(420,.3,.1,.03);haptic([30,20,15]);shake(6,260);
  if(t.letter)releaseLetter(t.letter,x+cell/2,y+cell/2);hammers--;hammerMode=false;stuckNote=false;updateTools();setTimeout(checkEnd,700)}

/* ---------- start a level ---------- */
function startGame(c){
  cfg=c;over=false;score=0;shownScore=0;moves=0;hintsLeft=c.hints||1;hammers=1;rerolls=1;lineCharge=0;streak=0;flights=0;revealCount=0;round=1;hammerMode=false;stuckNote=false;adUsed=false;solveUsed=false;rescue=false;
  fading=[];particles=[];floaters=[];events=[];drag=null;stripIdx=0;selWord=null;$('#fly').innerHTML='';closeSheet(true);closePop();
  board=Array.from({length:N},()=>Array(N).fill(null));tray=[null,null,null];
  showScreen('sGame');initCW(c.words,c.seed,c.given);
  movesLeft=c.moves==='auto'?Math.round([...cw.cells.values()].filter(x=>!x.revealed).length*2.2+12):(c.moves||0);
  const rng=mulberry(c.seed),rowCnt=Array(N).fill(0),colCnt=Array(N).fill(0);
  const spot=()=>{for(let a=0;a<200;a++){const r=Math.floor(rng()*N),q=Math.floor(rng()*N);if(!board[r][q]&&rowCnt[r]<3&&colCnt[q]<3){rowCnt[r]++;colCnt[q]++;return[r,q]}}return null};
  for(let k=0;k<(c.crates||0);k++){const s=spot();if(!s)break;const need=neededLetters();board[s[0]][s[1]]={color:CRATE,letter:need.length?need[Math.floor(rng()*need.length)]:null,hp:1,pop:now+k*60}}
  for(let k=0;k<(c.bound||0);k++){const s=spot();if(!s)break;const need=neededLetters();board[s[0]][s[1]]={color:COLORS[Math.floor(rng()*COLORS.length)],letter:need.length&&rng()<.55?need[Math.floor(rng()*need.length)]:null,hp:2,pop:now+300+k*60}}
  setHudTitle();layout();deal();updateHud();
  const intro=c.mode==='journey'?(c.g===0?'Drop blocks and fill lines. Letters inside smashed blocks fly into the crossword!':c.hard?'Hard level: your moves are limited. Solve words early!':c.g===2?'Some lettered blocks are already on the board. Clear lines around them.':c.g===11?'New: steel-strapped blocks. They take two hits to break.':''):
    c.mode==='daily'?'One crossword for today. Solve it to keep your streak going!':c.mode==='zen'?'No moves, no losing. When you run out of room, a breeze clears the way.':'Finish a crossword and a new one arrives. The board carries over.';
  if(intro)setTimeout(()=>showToast(`<b>${$('#gBig').textContent}</b>${intro}`,3800),350);
  if(!store.get().seenHow)setTimeout(()=>{if(curScreen==='sGame')showHow()},600)}
function setHudTitle(){
  let small='',big='';if(cfg.mode==='journey'){small=`${THEMES[cfg.t].name} · ${cfg.i+1} of ${SCHED[cfg.t].length}`;big=`Level ${cfg.g+1}`}
  else if(cfg.mode==='daily'){const d=new Date();small='Daily Puzzle';big=`${MONTHS[d.getMonth()]} ${d.getDate()}`}
  else if(cfg.mode==='endless'){small='Endless';big=`Puzzle #${round}`}else{small='Zen';big=`Puzzle #${round}`}
  $('#gSmall').textContent=small;$('#gBig').textContent=big;$('#gHard').hidden=!cfg.hard}
function nextRound(){
  if(curScreen!=='sGame'||!cfg||(cfg.mode!=='endless'&&cfg.mode!=='zen'))return;
  round++;cfg={...cfg,words:randomWords(5,mulberry(ri(1e9))),pool:round>=3?'hard':'mid'};initCW(cfg.words,ri(1e9),2);
  const want=new Set([...cw.cells.values()].filter(c=>!c.revealed).map(c=>c.letter));for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=board[r][c];if(t&&t.letter&&!want.has(t.letter))t.letter=null}
  tray.forEach(p=>{if(p)for(const k in p.letters)if(!want.has(p.letters[k]))delete p.letters[k]});
  setHudTitle();arp(523);showToast(`<b>Puzzle #${round}</b>Fresh words, same board. Keep going!`,2800);updateHud()}

/* ---------- end of level ---------- */
function checkEnd(){
  if(over||!cw||curScreen!=='sGame')return;if(cw.words.every(w=>w.done))return;if(flights>0||events.length){setTimeout(checkEnd,300);return}
  if(cfg.moves&&movesLeft<=0)return lose('moves');
  const live=tray.filter(Boolean);
  if(live.length&&!live.some(anyFit)){
    if(cfg.mode==='zen'){breeze();return}
    if(hammers>0||rerolls>0){if(!stuckNote){stuckNote=true;showToast('<b>No room!</b>Smash a block with the hammer or shuffle for new ones.',3600);if(hammers)pulse('#tHammer');if(rerolls)pulse('#tReroll')}return}
    return lose('board')}
  stuckNote=false}
function blastRows(n){const cnt=board.map((row,r)=>[r,row.filter(Boolean).length]).sort((a,b)=>b[1]-a[1]).slice(0,n);const cells=[];cnt.forEach(([r])=>{for(let c=0;c<N;c++)if(board[r][c])cells.push([r,c])});
  breakSet(cells,cnt[0][0]+.5,N/2,true);swish(.14,.6);shake(7,420)}
function breeze(){blastRows(2);showToast('<b>A gentle breeze</b>Two rows cleared. Keep playing!',2200);setTimeout(()=>{tray=[null,null,null];deal();setTimeout(checkEnd,800)},700)}
const BOOST_COST=150;

    <div class="picon">${mv?ICON.clock:ICON.grid}</div><p>${mv?'Get <b>+5 moves</b> and keep your progress!':'Blast the <b>3 fullest rows</b> and get fresh blocks!'}</p>

    <div class="have"><span class="pi coin" style="display:grid;place-items:center"></span>You have ${c} coins${c<BOOST_COST?' · not enough for a booster':''}</div>`);

/* разгадывание после проигрыша: слова по очереди, одна ошибка закрывает экран и возвращает к бустерам; всё угадано = победа */

  if(failWhy==='moves'){movesLeft+=5;updateHud();floaters.push({x:W/2,y:boardH/2,t0:now,text:'+5 MOVES',size:cell*.7,color:'#FFD23F'})}

function openPop(html){$('#popbox').innerHTML=html;const p=$('#pop');p.hidden=false;const b=$('#popbox');b.style.animation='none';void b.offsetWidth;b.style.animation='';swish(.04,.22)}

  const scoreLine=(b,cn)=>`<div class="score-line"><div><small>Score</small><b>${score}</b></div><div><small>Best</small><b>${b}</b></div><div class="cn"><small>Coins</small><b>+${cn}</b></div></div>`;
  if(cfg.mode==='daily'){let first=false;const s=store.patch(s=>{s.daily=s.daily||{};if(!s.daily[cfg.key]){first=true;const y=new Date();y.setDate(y.getDate()-1);s.streak=(s.daily[todayKey(y)]?(s.streak||0):0)+1;s.daily[cfg.key]=1}s.bestDaily=Math.max(s.bestDaily||0,score)});

     <div class="row"><button class="b3 green" id="mHome">Home</button></div>`,true);$('#mHome').onclick=goHome;return}
  const{t,i,g}=cfg,n=SCHED[t].length,before=owned(t),np=pieceOrder(t)[i],fresh=!before.has(np),cn=fresh?(cfg.hard?50:30):10;addCoins(cn);

   ${scoreLine(s.best[g],cn)}<div class="chips" style="margin-bottom:16px">${cw.words.map(w=>`<span>${w.word}</span>`).join('')}</div>

/* ---------- paintings ---------- */
function fitCanvas(c){const w=c.clientWidth||c.width,h=c.clientHeight||w*4/3;c.width=Math.round(w*DPR);c.height=Math.round(h*DPR);const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);return{w,h,g}}
function paintCanvas(c,t,own,o){const{w,h,g}=fitCanvas(c);drawArt(g,t,w,h,own||owned(t),o)}
function animateReveal(c,t,before,np,done){
  const{w,h,g}=fitCanvas(c),P=pieces(SCHED[t].length),art=artCanvas(t),pc=P.list[np],t0=performance.now();let landed=false;
  const step=ts=>{try{const e=(ts-t0)/1000;drawArt(g,t,w,h,before);
    const k=clamp((e-.3)/.55,0,1);if(k>0){const b=backOut(k),s=1.7-.7*b,dy=-AH*.22*(1-b);g.save();g.scale(w/AW,h/AH);g.translate(pc.cx,pc.cy+dy);g.scale(s,s);g.rotate((1-b)*.25);g.translate(-pc.cx,-pc.cy);g.globalAlpha=Math.min(1,k*2.5);
      g.save();g.clip(pc.path);g.drawImage(art,0,0,AW,AH);g.restore();g.lineWidth=7/s;g.strokeStyle='#FFD23F';g.stroke(pc.path);g.restore()}
    if(k>=1&&!landed){landed=true;chime(784,.2);chime(1175,.12,.08);tock(220,.4,.15);haptic(15)}
    const f=(e-.85)/.7;if(f>0&&f<1){g.save();g.scale(w/AW,h/AH);g.clip(pc.path);g.fillStyle=`rgba(255,255,255,${.6*(1-f)})`;g.fillRect(0,0,AW,AH);g.restore()}
    if(e<1.6)requestAnimationFrame(step);else{const a=new Set(before);a.add(np);drawArt(g,t,w,h,a);done&&done()}}catch(err){console.warn(err)}};
  requestAnimationFrame(step)}
function openArt(t,reveal){
  const own=owned(t),n=SCHED[t].length,full=own.size>=n,LW=levelWords(t);const av=$('#artv');av.classList.toggle('reveal',!!reveal);av.hidden=false;

  $('#avWords').innerHTML=words.map(x=>x.ok?`<span>${x.w}</span>`:`<span class="q">${'•'.repeat(Math.min(6,x.w.length))}</span>`).join('');
  const nextT=t+1<THEMES.length?t+1:null;
  $('#avBtns').innerHTML=reveal?`<button class="b3 purple" id="avGal">Gallery</button><button class="b3 green" id="avNext">${nextT!==null?'Next World':'Home'}</button>`:
    `<button class="b3 purple" id="avClose">Close</button>${full?'':`<button class="b3 green" id="avPlay">Play World</button>`}`;
  const c=$('#avCv');
  if(reveal){store.patch(s=>{s.revealed=s.revealed||{};s.revealed[t]=1});arp(523);setTimeout(()=>arp(784),500);haptic([20,30,20,30,40]);setTimeout(confetti,900);
    requestAnimationFrame(()=>{const{w,h,g}=fitCanvas(c),t0=performance.now();const step=ts=>{try{const e=(ts-t0)/1000;drawArt(g,t,w,h,own,{outline:clamp(1-(e-.5)/.8,0,1)});
      const sx=(e-1.1)/1;if(sx>0&&sx<1){g.save();g.globalCompositeOperation='lighter';const x=-w*.6+sx*w*2.2;g.fillStyle=lin(g,x-w*.3,0,x+w*.3,h,[[0,'rgba(255,255,255,0)'],[.5,'rgba(255,255,255,.5)'],[1,'rgba(255,255,255,0)']]);g.fillRect(0,0,w,h);g.restore()}
      if(e<2.2)requestAnimationFrame(step)}catch(err){console.warn(err)}};requestAnimationFrame(step)})}
  else requestAnimationFrame(()=>paintCanvas(c,t,own));
  const close=()=>{av.hidden=true};
  if(reveal){$('#avGal').onclick=()=>{close();showScreen('sGallery')};$('#avNext').onclick=()=>{close();if(nextT!==null)openTheme(nextT);else goHome()}}
  else{$('#avClose').onclick=close;const p=$('#avPlay');if(p)p.onclick=()=>{close();openTheme(t)}}}
