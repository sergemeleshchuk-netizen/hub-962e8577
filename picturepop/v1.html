const Game = {
  def:null, model:null, view:null, busy:false, ended:true, combo:0, lastClear:0, attempt:0, stats:null, pendingSuper:0, keyMode:false, sel:null, drag:null, hoverT:null, hoverCell:null, limit:0, paused:false,
  start(n){
    Lives.tick(); if(Save.data.lives <= 0){ UI.noLives(); return; }
    const def = buildLevel(n); this.def = def; this.attempt++; Save.data.stats.attempts++; Save.write();
    this.model = new Model(def, mulberry32(def.seed)); this.view = new View(this.model, def); this.limit = def.moveLimit;
    Object.assign(this, { busy:true, ended:false, combo:0, lastClear:0, pendingSuper:0, keyMode:false, sel:null, drag:null, paused:false });
    this.stats = { t0:Date.now(), boosters:0, matches:0 };
    UI.show('game'); UI.renderHud(); this.updateHud(); this.updateCombo(true); UI.renderBoosters();
    const tk = this.attempt;
    requestAnimationFrame(async () => {
      this.view.layout(); await this.view.dealIntro(); if(tk !== this.attempt) return; this.busy = false; this.stats.t0 = Date.now(); Idle.start();
      if(def.tutorial === 'drag' && !Save.data.tutorial.drag){ Analytics.track('tutorial_start', {}); const h = this.model.bestHint(); if(h){ this.view.showHand(h, 99); Idle.stage = 2; UI.tip('Drag a card onto another to swap them'); } }
      if(def.intro && !Save.data.intros[def.intro]) UI.introPop(def.intro);
      await this.resolve();
    });
    Analytics.track('level_start', { level:n, label:def.label, diff:+def.diff.toFixed(2), cards:this.model.cards.size, pictures:this.model.pics.length, limit:this.limit, par:def.par });
  },
  movesLeft(){ return this.limit - this.model.moves; },
  updateHud(){ const m = this.model, n = m.pics.length; $('#g-count').textContent = `${m.done}/${n}`; $('#g-bar').style.width = (m.done/n*100) + '%';
    const left = this.movesLeft(), mv = $('#g-moves'); mv.querySelector('b').textContent = left; mv.classList.toggle('low', left <= 5); },

  bindInput(){ const b = $('#board'); b.addEventListener('pointerdown', e => this.onDown(e)); addEventListener('pointermove', e => this.onMove(e), { passive:true }); addEventListener('pointerup', e => this.onUp(e)); addEventListener('pointercancel', e => this.onUp(e, true)); },
  bp(e){ const r = $('#board').getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; },
  onDown(e){
    Sfx.init(); if(this.busy || this.ended || this.paused || !this.view) return; Idle.poke(); this.view.hideHand();
    const el = e.target.closest('.slot'); const cd = el && this.model.cards.get(+el.dataset.id);
    if(this.keyMode){ if(cd?.closed) this.useKeyOn(cd); else this.setKey(false); return; }
    if(!cd){ const p = this.bp(e); const cell = this.view.cellAt(p.x, p.y); if(this.sel && cell && !this.model.at(cell.r, cell.c)){ const a = this.sel; this.select(null); this.doMove(a, cell.r, cell.c); } else this.select(null); return; }
    if(cd.closed){ Juice.shake(el.querySelector('.cd'), 4); Juice.wrong(); this.view.seal(cd, true); const k = cd.closed;
      UI.toast(k.type === 'lock' ? `Locked. Opens after ${k.n} more ${k.n === 1 ? 'picture' : 'pictures'}` : k.type === 'chain' ? 'Chained. Finish a picture next to it' : `Hidden. Turns over in ${k.n} ${k.n === 1 ? 'move' : 'moves'}`); return; }
    e.preventDefault(); this.drag = { cd, el, sx:e.clientX, sy:e.clientY, ox:parseFloat(el.style.left), oy:parseFloat(el.style.top), moved:false }; Haptics.light();
  },
  onMove(e){ const d = this.drag; if(!d) return; const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    if(!d.moved && Math.hypot(dx, dy) > 8){ d.moved = true; d.el.classList.add('lift', 'nodelay'); $('#board').classList.add('dragging'); Sfx.play('pickup'); if(this.sel) this.select(null); }
    if(!d.moved) return; d.el.style.left = (d.ox + dx) + 'px'; d.el.style.top = (d.oy + dy) + 'px';
    const p = this.bp(e); const t = this.view.cardAt(p.x, p.y, d.cd); const ok = t && !t.closed ? t : null;
    let cell = null; if(!t){ const c = this.view.cellAt(p.x, p.y); if(c && !this.model.at(c.r, c.c)) cell = c; }
    if(ok !== this.hoverT){ this.hoverT = ok; this.view.hover(ok); if(ok) Haptics.soft(); }
    if(JSON.stringify(cell) !== JSON.stringify(this.hoverCell)){ this.hoverCell = cell; this.view.dropCell(cell); } },
  onUp(e, cancel){ const d = this.drag; if(!d) return; this.drag = null; $('#board').classList.remove('dragging'); d.el.classList.remove('nodelay', 'lift');
    const t = this.hoverT, cell = this.hoverCell; this.hoverT = null; this.hoverCell = null; this.view.hover(null); this.view.dropCell(null);
    if(d.moved){ if(cancel){ this.view.reject(d.cd); return; } if(t) return this.doSwap(d.cd, t); if(cell) return this.doMove(d.cd, cell.r, cell.c); this.view.place(d.cd, false, 'bounce'); Sfx.play('drop'); return; }
    if(cancel) return;
    if(this.sel && this.sel !== d.cd){ const a = this.sel; this.select(null); this.doSwap(a, d.cd); } else if(this.sel === d.cd) this.select(null); else { this.select(d.cd); Sfx.play('tap'); } },
  select(cd){ if(this.sel) this.view.setSel(this.sel, false); this.sel = cd; if(cd) this.view.setSel(cd, true); },
  async doSwap(a, b){ if(this.busy || this.ended) return; this.busy = true; this.model.swap(a, b); this.view.place(a); this.view.place(b); Sfx.play('drop'); Haptics.light(); await this.afterMove(); },
  async doMove(a, r, c){ if(this.busy || this.ended || !this.model.moveTo(a, r, c)) return; this.busy = true; this.view.place(a); Sfx.play('drop'); await this.afterMove(); },
  async afterMove(){
    Idle.poke(); if(!Save.data.tutorial.drag && this.def.tutorial === 'drag'){ Save.data.tutorial.drag = true; Save.write(); Analytics.track('tutorial_complete', {}); this.view.hideHand(); UI.tip(null); }
    const opened = this.model.tickMove(); Analytics.track('move', { level:this.def.n, n:this.model.moves });
    this.updateHud(); const mc = $('#g-moves'); mc.classList.remove('tick'); void mc.offsetWidth; mc.classList.add('tick');
    for(const cd of this.model.boardCards()) if(cd.closed?.type === 'time' || cd.bomb) this.view.seal(cd, true);
    opened.forEach(cd => this.view.open(cd));
    await wait(opened.length ? 380 : 230); await this.resolve(); if(this.ended) return;
    const boom = this.model.boom; if(boom && !boom.pic.done){ return this.fail('bomb'); } this.model.boom = null;
    if(this.movesLeft() <= 0) return this.fail('moves');
    if(this.movesLeft() === 5){ UI.toast('5 moves left'); Sfx.play('wrong'); }
    this.busy = false;
  },

  bump(){ const t = Date.now(); this.combo = t - this.lastClear < C('combo.windowMs') ? this.combo + 1 : 1; this.lastClear = t; this.updateCombo(); return this.combo; },
  updateCombo(reset){ const el = $('#combo'); clearTimeout(this._ct); if(reset || this.combo < 2){ el.classList.remove('on', 'hot'); return; }
    el.querySelector('b').textContent = 'x' + this.combo; el.classList.add('on'); el.classList.toggle('hot', this.combo >= 4);
    anim(el, [{transform:'translateX(-50%) scale(1.35)'},{transform:'translateX(-50%) scale(1)'}], { duration:320, easing:'cubic-bezier(.34,1.6,.64,1)' });
    anim(el.querySelector('i'), [{transform:'scaleX(1)'},{transform:'scaleX(0)'}], { duration:C('combo.windowMs'), easing:'linear', fill:'forwards' }); this._ct = setTimeout(() => el.classList.remove('on', 'hot'), C('combo.windowMs')); },

  async resolve(forced = []){
    for(let guard=0; guard<60; guard++){
      let ps = this.model.completes(); forced = forced.filter(p => !p.done && this.model.completable(p)); ps = [...new Set([...ps, ...forced])]; forced = [];
      if(!ps.length){ if(this.pendingSuper > 0){ const p = this.model.pics.find(q => this.model.completable(q)); if(p){ this.pendingSuper--; forced = [p]; continue; } } break; }
      const before = this.combo;
      const merged = await Promise.all(ps.map(async (p, i) => { await wait(i*90); const combo = this.bump(); this.stats.matches++; const r = await this.view.merge(p); Juice.match(r.pt, ['#FFC83D','#FFF1B8','#FF78C4'], combo); return r; }));
      const sa = C('combo.superAt'); if(Math.floor(this.combo/sa) > Math.floor(before/sa)){ this.pendingSuper++; this.superBanner(); }
      const opened = this.model.remove(ps); this.updateHud(); Save.data.league.score += 10*ps.length;
      merged.forEach(r => this.view.flyOff(r.m, $('#g-prog')));
      for(const cd of this.model.boardCards()) if(cd.closed?.type === 'lock') this.view.seal(cd, true);
      opened.forEach(cd => this.view.open(cd));
      await wait(140); await this.view.drops(this.model.settle());
    }
    if(this.model.win()) return this.complete();
    if(this.model.stuck()){ await wait(200); await this.freshDeal(); }
  },
  async freshDeal(){ UI.toast('Fresh deal: the missing pieces are on the table'); const acts = this.model.freshDeal(); Analytics.track('fresh_deal', { level:this.def.n });
    for(const a of acts){ if(a.type === 'open') this.view.open(a.cd); else await this.view.pull(a); await wait(140); } this.view.renderDecks(); await wait(420); if(!this.model.stuck()) await this.resolve(); },
  superBanner(){ const b = document.createElement('div'); b.className = 'banner d'; b.textContent = 'Super combo!'; $('#board-wrap').appendChild(b); Sfx.play('super'); Haptics.strong(); Economy.earn(10, 'super');

  async useBooster(id){

    const spend = () => { inv[id]--; Save.write(); this.stats.boosters++; Analytics.track('booster_used', { id, level:this.def.n }); UI.renderBoosters(); };
    if(id === 'moves'){ spend(); this.limit += C('difficulty.continueMoves'); this.updateHud(); Sfx.play('reveal'); UI.floatText('#g-moves', '+5'); return; }
    if(id === 'key'){ if(!this.model.boardCards().some(cd => cd.closed)){ UI.toast('No locked or hidden cards right now'); return; } this.setKey(!this.keyMode); return; }
    const ready = this.model.pics.filter(p => this.model.completable(p)); if(!ready.length){ UI.toast('Nothing ready yet. Make a move first'); return; }

  stars(){ const r = this.movesLeft()/this.limit; return r >= .3 ? 3 : r >= .12 ? 2 : 1; },
  async complete(){
    if(this.ended) return; this.ended = true; this.busy = true; Idle.stop(); await wait(260); Juice.levelComplete();
    const n = this.def.n, sec = Math.round((Date.now() - this.stats.t0)/1000), stars = this.stars(); const fresh = n === Save.data.level;
    Save.data.stats.wins++; Save.data.stats.failStreak = 0; Analytics.track('level_complete', { level:n, sec, moves:this.model.moves, left:this.movesLeft(), stars, boosters:this.stats.boosters, attempts_per_win:+(Save.data.stats.attempts/Save.data.stats.wins).toFixed(2) });
    const base = this.def.boss ? C('economy.boss') : this.def.label === 'breath' ? C('economy.breath') : C('economy.level'); const coins = fresh ? base + (stars - 1)*5 : Math.round(base/4);
    Economy.earn(coins, 'level', `win:${n}:${this.attempt}:${today()}`);
    const prev = Save.data.stars[n] || 0; const gained = Math.max(0, stars - prev); if(stars > prev) Save.data.stars[n] = stars; Save.data.chest.stars += gained; Save.data.league.score += 25*stars;
    let card = null; if(fresh && (n % 3 === 0 || this.def.boss)){ const ids = COLL_BY_ART[this.def.ch]; card = Collections.award(ids[(n/3|0) % ids.length], `card:${n}`); }
    if(n >= Save.data.level) Save.data.level = n + 1; Save.write(); Analytics.session.levels++;
    UI.winPop({ coins, stars, card, sec });
  },
  fail(kind){
    if(this.ended) return; this.ended = true; this.busy = true; Idle.stop(); Save.data.stats.fails++; Save.data.stats.failStreak++; Save.write(); Sfx.play('wrong'); Haptics.strong();
    if(kind === 'bomb'){ const b = this.model.boom; if(b){ const p = this.view.center(b); FX.emit(p.x, p.y, { n:60, colors:['#FF9A1F','#FF4B5C','#FFD43B','#2B2440'], speed:9, size:7, grav:.12 }); FX.ring(p.x, p.y, { color:'#FF9A1F', grow:16, width:16, life:40 }); Juice.shake($('#board'), 10); } }
    Analytics.track('level_fail', { level:this.def.n, kind, pictures_left:this.model.pics.length - this.model.done });
    setTimeout(() => UI.failPop(kind), kind === 'bomb' ? 700 : 300);
  },
  continueRun(kind){ if(kind === 'bomb'){ const b = this.model.boom; if(b){ b.bomb = C('difficulty.continueMoves'); this.view.seal(b); } this.model.boom = null; } else this.limit += C('difficulty.continueMoves');
    this.ended = false; this.busy = false; this.updateHud(); Idle.start(); Analytics.track('continue', { level:this.def.n, kind }); },
  quit(){ Idle.stop(); this.attempt++; this.ended = true; this.view?.hideHand(); UI.tip(null); },

const Collections = {
  owned(id){ return Save.data.cards[id] || []; },
  total(){ return COLLECTIONS.reduce((s, c) => s + this.owned(c.id).length, 0); },
  award(collId, tx){ if(tx && !Save.tx(tx)) return null; const coll = COLLECTIONS.find(c => c.id === collId) || COLLECTIONS[0]; const have = this.owned(coll.id); const miss = coll.items.map((_, i) => i).filter(i => !have.includes(i));
    if(!miss.length){ Economy.earn(25, 'dup_card'); return { coll, idx:0, dup:true }; } const idx = miss[0]; Save.data.cards[coll.id] = [...have, idx]; Save.data.seen.newCard = true; Save.write(); Analytics.track('collection_item', { coll:coll.id, idx }); return { coll, idx, dup:false }; },
};

      if(a.startsWith('t:')){ const k = a.slice(2); Save.data.settings[k] = !Save.data.settings[k]; b.setAttribute('aria-checked', Save.data.settings[k]); Save.write(); if(k === 'music') Sfx.syncMusic?.(); }
      if(a === 'debug'){ close(); setTimeout(() => Debug.open(), 250); } }); },
  daily(){ const d = Save.data.daily; if(d.last === today()){ this.toast('Come back tomorrow for the next gift'); return; } const cont = d.last && (new Date(today()) - new Date(d.last))/864e5 === 1; const streak = cont ? d.streak + 1 : 1, ladder = [40,60,80,100,150,200,300], amt = ladder[(streak - 1) % 7];
    this.pop(`<div class="ribbon gold d">Daily Gift</div><div class="days">${ladder.map((c, i) => `<div class="day ${i === (streak - 1) % 7 ? 'today' : i < (streak - 1) % 7 ? 'done' : ''}">D${i + 1}<b>${c}</b></div>`).join('')}</div><div class="reward d"><span class="coin"></span>+${amt}</div><button class="btn" data-a="claim">Claim</button>`, (a, close) => {
      if(a === 'claim'){ d.last = today(); d.streak = streak; Economy.earn(amt, 'daily', 'daily:' + today()); if((streak - 1) % 7 === 6) Economy.addBooster('magnet', 1, 'daily'); Save.write(); Sfx.play('coin'); close(); this.renderHome(); Analytics.track('daily_claim', { streak }); } }); },
  chest(){ const ch = Save.data.chest, need = C('economy.chestEvery'); if(ch.stars < need){ this.toast(`Collect ${need - ch.stars} more stars to open the chest`); return; }
    const tier = ch.tier, coins = 100 + tier*50, boost = ['spotlight','moves','magnet','key'][tier % 4];
    this.pop(`<div class="ribbon gold d">Star Chest ${tier + 1}</div><div class="chest-art">${CHEST_SVG}</div><div class="reward d"><span class="coin"></span>+${coins}</div><p>Plus 1 ${BOOSTERS.find(b => b.id === boost).name}. Each chest pays more than the last.</p><button class="btn" data-a="open">Collect</button>`, (a, close) => {
      if(a === 'open'){ ch.stars -= need; ch.tier++; Economy.earn(coins, 'chest', 'chest:' + ch.tier); Economy.addBooster(boost, 1, 'chest'); Save.write(); FX.confetti($('#app').clientWidth); Sfx.play('reveal'); close(); this.renderHome(); Analytics.track('chest_open', { tier:ch.tier }); } }); },
  starterOffer(){ Analytics.track('offer_show', { id:'starter' }); this.pop(`<div class="ribbon gold d">Starter Pack</div><div class="offer" style="margin:0"><h3>Gallery Bundle</h3><div class="items"><span class="it"><span class="coin" style="width:20px;height:20px"></span>1,500</span><span class="it">3× +5 Moves</span><span class="it">2× Magnet</span><span class="it">2× Key</span><span class="it">No ads</span></div></div><p>One-time offer. 70% better value than buying separately.</p><button class="btn gold" data-a="buy">$4.99</button>`, async (a, close) => {
    if(a === 'buy' && await Store.buy('starter')){ Economy.earn(1500, 'iap'); Economy.addBooster('moves', 3, 'iap'); Economy.addBooster('magnet', 2, 'iap'); Economy.addBooster('key', 2, 'iap'); Save.data.noAds = true; Save.write(); close(); Analytics.track('offer_buy', { id:'starter' }); } }); },
  renderShop(){ const packs = [[500,'$1.99'],[1400,'$4.99'],[3200,'$9.99'],[7500,'$19.99']];
    $('#shop-body').innerHTML = `<div class="offer"><span class="timer">Ends in 23:59</span><h3>Gallery Bundle</h3><div class="items"><span class="it"><span class="coin" style="width:20px;height:20px"></span>1,500</span><span class="it">7 boosters</span><span class="it">No ads</span></div><button class="btn gold" data-a="starter" style="width:100%">$4.99</button></div>
      <div class="card" style="display:flex;align-items:center;gap:12px"><div style="flex:1"><h3>No Ads</h3><p>Removes breaks between levels. Rewarded ads stay optional.</p></div><button class="price-btn" style="width:96px" data-a="noads">${Save.data.noAds ? 'Owned' : '$3.99'}</button></div>
      <div class="shop-grid">${packs.map(([n, p], i) => `<div class="pack"><div class="coins-pile">${'<span class="coin"></span>'.repeat(i + 2)}</div><span class="big">${n.toLocaleString('en-US')}</span><button class="price-btn" data-a="pack:${n}">${p}</button></div>`).join('')}
      <div class="pack"><span class="heart" style="width:48px;height:44px;font-size:18px"><span>5</span></span><span class="big">Refill lives</span><button class="price-btn" data-a="lives">${C('economy.refillLives')} coins</button></div>
      <div class="pack"><div class="bst" style="width:56px;height:56px;box-shadow:none">${BOOSTERS[0].icon}</div><span class="big">3× +5 Moves</span><button class="price-btn" data-a="moves">150 coins</button></div></div>`; },
  renderLeague(){ const rows = League.table(), me = rows.findIndex(r => r.me) + 1;
    $('#league-body').innerHTML = `<div class="league-hero">${CUP_SVG}<div><h3 class="d">Bronze League</h3><span style="font-size:13px">Ends in ${League.ends()} · You are #${me}</span><br><span style="font-size:12px;opacity:.9">Top 3 win 500 / 300 / 200 coins. 10 points per picture, 25 per star.</span></div></div>
      ${rows.map((r, i) => `<div class="lb-row ${r.me ? 'me' : ''} ${i < 3 ? 'zone' : ''}"><span class="rk d">${i + 1}</span><span class="av" style="background:${r.col}">${r.nm[0]}</span><span class="nm">${r.nm}</span><span class="sc">${r.sc.toLocaleString('en-US')}</span></div>`).join('')}`; },
  renderAlbum(){ Save.data.seen.newCard = false; Save.write(); $('#album-total').textContent = `${Collections.total()} / ${COLLECTIONS.length*6}`;
    const box = $('#album-body'); box.innerHTML = COLLECTIONS.map(c => { const own = Collections.owned(c.id);
      return `<section class="apage"><div class="apage-head"><h3>${c.name}</h3><span class="count ${own.length === 6 ? 'done' : ''}">${own.length} / 6</span></div><div class="pgrid">${c.items.map((it, i) => own.includes(i) ? `<div class="pola" style="--rot:${((i*37 + c.id.length*11) % 9) - 4}deg"><canvas data-w="${it[0]}"></canvas><div class="cap">${it[1]}</div></div>` : `<div class="pola locked"><div class="ph">?</div><div class="cap">???</div></div>`).join('')}</div><div class="apage-foot">${own.length === 6 ? 'Collection complete' : 'Win every 3rd level and every boss to collect cards'}</div></section>`; }).join('');
    requestAnimationFrame(() => box.querySelectorAll('canvas[data-w]').forEach(cv => Art.draw(cv, cv.dataset.w))); },
};
const CHEST_SVG = IC('chest');
const CUP_SVG = IC('trophy','cup');

/* ===================== DEBUG ===================== */
const Debug = {
  open(){ const s = Save.data.stats, aps = s.wins ? (s.attempts/s.wins).toFixed(2) : '—', d = Game.def;
    UI.pop(`<div class="ribbon gold d">Developer</div><div class="dbg"><input id="dbg-n" type="number" min="1" value="${Save.data.level}" aria-label="Level"><button data-a="jump">Jump to level</button>
      <button data-a="coins">+1000 coins</button><button data-a="boost">+3 each booster</button><button data-a="lives">Refill lives</button><button data-a="nolives">Lives to 0</button>
      <button data-a="win">Win level</button><button data-a="fail">Fail level</button><button data-a="stars">+15 stars</button><button data-a="day">Simulate new day</button>
      <button data-a="week">New league week</button><button data-a="ab">A/B → ${RemoteConfig.variant === 'A' ? 'B' : 'A'}</button><button data-a="reset">Reset progress</button><button data-a="plan">Level table</button></div>
      <p style="font-size:12px;text-align:left">Attempts per win: <b>${aps}</b> · wins ${s.wins} · fails ${s.fails}${d ? `<br>Level ${d.n}: ${d.label}, diff ${d.diff.toFixed(2)}, ${d.cols}×${d.rows}+deck ${d.deck}, par ${d.par} moves, limit ${d.moveLimit}` : ''}</p>
      <div class="log">${Analytics.log.slice(-30).reverse().map(e => `${new Date(e.t).toLocaleTimeString()} ${e.name} ${JSON.stringify(e.p)}`).join('\n') || 'No events yet'}</div>`, async (a, close, b) => {
      if(a === 'jump'){ const n = Math.max(1, +$('#dbg-n').value || 1); Save.data.level = n; Save.write(); close(); ProtoKit.play(n); }
      if(a === 'coins') Economy.earn(1000, 'debug');
      if(a === 'boost'){ BOOSTERS.forEach(x => Save.data.boosters[x.id] += 3); Save.write(); if(UI.cur === 'game') UI.renderBoosters(); UI.toast('Boosters added'); }
      if(a === 'lives'){ Save.data.lives = C('lives.max'); Save.write(); UI.toast('Lives full'); }
      if(a === 'nolives'){ Save.data.lives = 0; Save.data.livesAt = now(); Save.write(); UI.toast('Lives 0'); }
      if(a === 'win'){ close(); if(UI.cur === 'game' && !Game.ended){ Game.model.pics.forEach(p => p.done = true); Game.model.done = Game.model.pics.length; Game.view.els.forEach(el => el.remove()); Game.view.els.clear(); Game.complete(); } else UI.toast('Open a level first'); }
      if(a === 'fail'){ close(); if(UI.cur === 'game' && !Game.ended) Game.fail('moves'); else UI.toast('Open a level first'); }
      if(a === 'stars'){ Save.data.chest.stars += 15; Save.write(); UI.toast('+15 stars'); if(UI.cur === 'home') UI.renderHome(); }
      if(a === 'day'){ Save.data.dayOffset++; Save.write(); UI.toast('A day passed'); if(UI.cur === 'home') UI.renderHome(); }
      if(a === 'week'){ Save.data.dayOffset += 7; Save.write(); League.ensure(); UI.toast('New league week'); }
      if(a === 'ab'){ Save.data.ab = RemoteConfig.variant === 'A' ? 'B' : 'A'; RemoteConfig.variant = Save.data.ab; _planCache.clear(); Save.write(); close(); UI.toast('Config ' + RemoteConfig.variant); }
      if(a === 'reset'){ if(b.dataset.armed){ Save.reset(); RemoteConfig.init(); close(); UI.go('home'); } else { b.dataset.armed = 1; b.textContent = 'Tap again'; } }
      if(a === 'plan'){ const rows = []; for(let n=Math.max(1, Save.data.level - 2); n < Math.max(1, Save.data.level - 2) + 12; n++){ const p = buildLevel(n); rows.push(`${n}  ${p.label.padEnd(6)} ${p.cols}x${p.rows}+${p.deck}  par ${p.par}  limit ${p.moveLimit}${p.timers.length ? '  hidden' : ''}${p.locks.length ? '  lock' : ''}${p.chains ? '  chain' : ''}${p.bombs.length ? '  bomb ' + p.bombs[0] : ''}${p.mono ? '  mono' : ''}`); } b.closest('.pop').querySelector('.log').textContent = rows.join('\n'); }
    }); },
};

/* ===================== BOOT ===================== */
const LEVELS = CHAPTERS.length*10;
function boot(){
  Save.load(); RemoteConfig.init(); Save.write(); FX.init(); Game.bindInput(); League.ensure();
  Analytics.track('app_open', {}); Analytics.track('session_start', { level:Save.data.level });
  $$('.nv').forEach(n => n.onclick = () => { Sfx.init(); Sfx.play('tap'); n.dataset.go === 'home' ? ProtoKit.home() : UI.go(n.dataset.go); });
  $('#btn-play').onclick = () => { Sfx.init(); Sfx.play('tap'); ProtoKit.play(Save.data.level); };
  $('#btn-settings').onclick = () => { Sfx.init(); UI.settings(); };
  $('#g-pause').onclick = () => { Sfx.init(); UI.pause(); };
  $('#side-daily').onclick = () => { Sfx.init(); UI.daily(); };
  $('#side-offer').onclick = () => { Sfx.init(); UI.starterOffer(); };
  $('#chest-btn').onclick = () => { Sfx.init(); UI.chest(); };
  $$('[data-coins]').forEach(b => b.addEventListener('click', () => { if(UI.cur !== 'game') UI.go('shop'); }));
  $('#boosters').addEventListener('click', e => { const b = e.target.closest('.bst[data-b]'); if(b){ Sfx.init(); Sfx.play('tap'); Game.useBooster(b.dataset.b); } });
  $('#shop-body').addEventListener('click', async e => { const b = e.target.closest('[data-a]'); if(!b) return; const a = b.dataset.a; Sfx.init();
    if(a === 'starter') UI.starterOffer(); if(a === 'noads' && !Save.data.noAds && await Store.buy('noads')){ Save.data.noAds = true; Save.write(); UI.renderShop(); }
    if(a.startsWith('pack:') && await Store.buy(a)){ Economy.earn(+a.slice(5), 'iap'); Sfx.play('coin'); }
    if(a === 'lives'){ if(Economy.spend(C('economy.refillLives'), 'lives')){ Save.data.lives = C('lives.max'); Save.write(); UI.toast('Lives refilled'); } else UI.toast('Not enough coins'); }
    if(a === 'moves'){ if(Economy.spend(150, 'moves_pack')){ Economy.addBooster('moves', 3, 'shop'); UI.toast('+3 boosters'); } else UI.toast('Not enough coins'); } });
  addEventListener('resize', () => { if(UI.cur === 'game' && Game.view?.g && !Game.drag && !Game.busy) Game.view.layout(); });
  setInterval(() => { if(UI.cur === 'home'){ Lives.tick(); $('#lives-n').textContent = Save.data.lives; $('#lives-t').textContent = Save.data.lives >= C('lives.max') ? 'Full' : Lives.left(); } }, 1000);
  document.addEventListener('visibilitychange', () => { if(document.hidden) Save.write(); });
  UI.coins();
  /* ---------- proto-kit (стандарт хаба) + хук для аудитора/бота ---------- */
  $('#home-steps').onclick = $('#chap-title').onclick = () => { Sfx.init(); Sfx.play('tap'); UI.levels(); };
  $('#home-steps').style.cursor = $('#chap-title').style.cursor = 'pointer';
  let dailyShown = false;
  window.__game = {
    get state(){ return Game.def ? { level:Game.def.n, moves:Game.model?.moves, done:Game.model?.done, pics:Game.model?.pics.length, ended:Game.ended } : null; },
    load(n){ Save.data.lives = Math.max(1, Save.data.lives); Game.start(n); },
    bounds(){ const r = $('#board').getBoundingClientRect(); return { left:r.left, top:r.top, right:r.right, bottom:r.bottom }; },
  };
  ProtoKit.init({ slug:'picturepop', name:'Picture Pop', icon:'icon.png', iconEmoji:'🖼️', accent:'#FF5C8A', levels:LEVELS,
    startLevel(n){ Lives.tick(); if(Save.data.lives <= 0){ UI.go('home'); UI.noLives(); return; } UI.renderHome(); Game.start(n); },
    showHome(){ UI.go('home'); if(!dailyShown && Save.data.daily.last !== today() && Save.data.level > 2){ dailyShown = true; setTimeout(() => UI.daily(), 500); } } });
}
ArtImg.load(Paint.WORKS.map(w => w.id)).then(boot);

</script>
</body>
</html>
