<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Словоблок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@500;700;800&family=Rubik:wght@700;800&display=swap">
<style>
/* Layout: тёмный столярный стол — светлая кленовая табличка-кроссворд и деревянная доска для брусков; на телефоне стопкой, на десктопе рядом */
:root{
  --table:#1C140E; --table-hi:#3B291C; --walnut:#5B3B26; --walnut-lo:#2C1B10;
  --maple:#EDD2A0; --maple-lo:#D4AE77; --burn:#3A2113; --ink:#F3E4C8; --ink-dim:#B39B7B;
  --amber:#F0A845; --leaf:#A9C487; --leaf-lo:#7E9A5E; --danger:#E27A5E;
  --display:'Unbounded','Rubik',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tile:'Rubik','Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--table);background-image:radial-gradient(120% 60% at 50% -8%,var(--table-hi) 0%,var(--table) 64%);background-attachment:fixed;color:var(--ink);font-family:var(--body);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:10px 28px;display:flex;flex-direction:column;gap:12px}

/* HUD */
.hud{display:flex;align-items:center;gap:10px}
.ic{width:42px;height:42px;flex:none;border-radius:13px;border:0;cursor:pointer;display:grid;place-items:center;position:relative;
  background:linear-gradient(#70482C,#4C301C);box-shadow:inset 0 1px 0 rgba(255,228,186,.28),0 3px 0 var(--walnut-lo),0 6px 12px rgba(0,0,0,.35);color:var(--ink);transition:transform .08s}
.ic:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,228,186,.28),0 1px 0 var(--walnut-lo)}
.ic:focus-visible,.btn:focus-visible,.clue:focus-visible,.plank:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.ic svg{width:20px;height:20px}
.ic .cnt{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--amber);color:var(--burn);font:800 11px/19px var(--tile);text-align:center}
.ic[disabled]{opacity:.45;cursor:default}
.lvl{flex:1;min-width:0}
.lvl small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-weight:700}
.lvl b{display:block;font:600 17px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:14px;align-items:flex-end}
.stat{text-align:right}
.stat small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-weight:700}
.stat b{font:700 18px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat.low b{color:var(--danger)}

/* Stage */
.stage{display:grid;gap:14px;grid-template-areas:"cw" "play" "clues"}
@media (min-width:880px){
  .stage{grid-template-columns:minmax(300px,370px) 1fr;grid-template-areas:"cw play" "clues play";align-items:start}
  .strip{display:none!important}
}

/* Crossword plaque */
.cw-panel{grid-area:cw;position:relative;border-radius:18px;padding:12px 12px 10px;color:var(--burn);
  background:repeating-linear-gradient(94deg,rgba(120,72,30,.06) 0 2px,transparent 2px 9px),linear-gradient(170deg,#F1D8AA,#DDB781);
  box-shadow:inset 0 1px 0 rgba(255,250,235,.7),0 5px 0 #8C6239,0 16px 30px rgba(0,0,0,.45)}
.cw-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.cw-head h2{margin:0;font:700 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.cw-head span{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;opacity:.75}
.cw-wrap{display:flex;justify-content:center;overflow-x:auto}
.cw-grid{--cs:30px;display:grid;gap:3px;grid-auto-rows:var(--cs);padding:2px}
.cw-void{width:var(--cs);height:var(--cs)}
.cw-cell{width:var(--cs);height:var(--cs);border-radius:calc(var(--cs)*.2);position:relative;cursor:pointer;display:grid;place-items:center;
  background:rgba(70,40,20,.16);box-shadow:inset 0 2px 3px rgba(60,30,10,.28),inset 0 -1px 0 rgba(255,245,225,.5);transition:background .25s,box-shadow .25s}
.cw-cell .no{position:absolute;top:1px;left:3px;font:800 calc(var(--cs)*.26)/1 var(--body);opacity:.55}
.cw-cell .ch{font:800 calc(var(--cs)*.56)/1 var(--tile);opacity:0}
.cw-cell.on{background:linear-gradient(#FFF3DA,#F0D6A6);box-shadow:0 2px 0 #B48650,0 3px 5px rgba(60,30,10,.25)}
.cw-cell.on .ch{opacity:1}
.cw-cell.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
.cw-cell.done{background:linear-gradient(#EAF2D2,#C9DCA2);box-shadow:0 2px 0 var(--leaf-lo),0 3px 6px rgba(60,80,20,.25)}
.cw-cell.done .ch{color:#2F4318}
.cw-cell.wave{animation:wave .5s ease}
.cw-cell.sel{outline:2px solid #C06A1F;outline-offset:1px}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes wave{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px) scale(1.08)}}
.strip{display:flex;align-items:center;gap:6px;margin-top:10px;border-top:1px dashed rgba(58,33,19,.25);padding-top:8px}
.strip button{border:0;background:none;cursor:pointer}
.strip .nav{width:30px;height:30px;border-radius:9px;background:rgba(70,40,20,.12);color:var(--burn);font-weight:800;font-size:18px;line-height:1}
.strip .cur{flex:1;min-width:0;text-align:left;font-weight:700;font-size:14px;line-height:1.25;color:var(--burn);padding:2px 4px}
.strip .cur em{font-style:normal;font-weight:800;color:#9A4E14;margin-right:4px}

/* Clues */
.clues{grid-area:clues;border-radius:16px;padding:12px 10px;background:linear-gradient(#3A2719,#2C1D12);box-shadow:inset 0 1px 0 rgba(255,220,170,.12),0 10px 24px rgba(0,0,0,.35)}
.clues h3{margin:2px 6px 8px;font:700 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.clues ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.clue{width:100%;display:grid;grid-template-columns:26px 18px 1fr auto;gap:6px;align-items:baseline;text-align:left;border:0;background:none;cursor:pointer;padding:7px 6px;border-radius:9px;color:var(--ink);font-size:14px;line-height:1.3}
.clue:hover{background:rgba(255,220,170,.07)}
.clue .n{font:700 13px var(--display);color:var(--amber);font-variant-numeric:tabular-nums}
.clue .d{color:var(--ink-dim);font-weight:800}
.clue .t{min-width:0}
.clue .len{font-size:12px;color:var(--ink-dim);font-weight:800;font-variant-numeric:tabular-nums}
.clue.done .t{color:var(--leaf);text-decoration:line-through;text-decoration-color:rgba(169,196,135,.5)}
.clue.done .len{color:var(--leaf)}

/* Play */
.play{grid-area:play;position:relative;display:flex;justify-content:center;min-width:0}
#cv{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.toast{position:absolute;left:50%;top:14%;transform:translate(-50%,0);width:min(88%,380px);text-align:center;pointer-events:none;
  background:rgba(28,18,11,.88);border:1px solid rgba(240,168,69,.35);border-radius:14px;padding:12px 16px;box-shadow:0 12px 30px rgba(0,0,0,.5);
  font-weight:700;font-size:14px;line-height:1.4;transition:opacity .35s,transform .35s;opacity:0}
.toast.show{opacity:1;transform:translate(-50%,-6px)}
.toast b{display:block;font:700 15px/1.3 var(--display);color:var(--amber);margin-bottom:4px}

/* Flying letters */
#fly{position:fixed;inset:0;pointer-events:none;z-index:40}
.fl{position:fixed;display:grid;place-items:center;border-radius:22%;color:var(--burn);font-family:var(--tile);font-weight:800;
  background:linear-gradient(#FFF3DA,#EBCB93);box-shadow:0 3px 0 #A97A45,0 8px 18px rgba(0,0,0,.4);will-change:transform}

/* Overlay */
.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(14,9,5,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.card{width:min(100%,430px);max-height:calc(100% - 20px);overflow:auto;border-radius:22px;padding:22px 20px 18px;color:var(--burn);
  background:repeating-linear-gradient(94deg,rgba(120,72,30,.06) 0 2px,transparent 2px 9px),linear-gradient(170deg,#F3DCB0,#DDB781);
  box-shadow:inset 0 1px 0 rgba(255,250,235,.7),0 6px 0 #8C6239,0 30px 60px rgba(0,0,0,.55);animation:rise .35s cubic-bezier(.2,1.3,.4,1)}
.card.shake{animation:shake .4s}
@keyframes rise{from{transform:translateY(16px) scale(.97);opacity:0}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.eyebrow{margin:0 0 6px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.card h3{margin:0 0 14px;font:700 21px/1.25 var(--display);text-wrap:balance}
.card p{margin:0 0 14px;font-size:15px;line-height:1.45}
.slots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.slot{width:36px;height:40px;border-radius:9px;display:grid;place-items:center;font:800 20px var(--tile);background:rgba(70,40,20,.14);box-shadow:inset 0 2px 3px rgba(60,30,10,.25)}
.slot.k{background:linear-gradient(#FFF3DA,#F0D6A6);box-shadow:0 2px 0 #B48650}
.slot.t{color:#9A4E14}
.gin{width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:12px 14px;font:800 20px var(--tile);letter-spacing:.12em;text-transform:uppercase;color:var(--burn);
  background:#FFF6E4;box-shadow:inset 0 2px 4px rgba(60,30,10,.25);margin-bottom:14px}
.gin:focus{outline:2px solid #C06A1F}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;border:0;cursor:pointer;border-radius:13px;padding:13px 16px;font:700 14px var(--display);letter-spacing:.02em;
  background:linear-gradient(#6E462A,#4A2E1B);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,228,186,.28),0 4px 0 var(--walnut-lo)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,228,186,.28),0 1px 0 var(--walnut-lo)}
.btn.alt{background:rgba(70,40,20,.14);color:var(--burn);box-shadow:inset 0 0 0 2px rgba(70,40,20,.25)}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.words span{padding:6px 10px;border-radius:9px;font:800 14px var(--tile);letter-spacing:.08em;background:linear-gradient(#EAF2D2,#C9DCA2);color:#2F4318;box-shadow:0 2px 0 var(--leaf-lo)}
.score-line{display:flex;gap:18px;margin:0 0 16px}
.score-line div small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.score-line div b{font:700 26px var(--display);font-variant-numeric:tabular-nums}

/* Level map */
.planks{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.plank{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-align:left;border:0;cursor:pointer;border-radius:14px;padding:10px 12px;
  background:linear-gradient(#6E462A,#4A2E1B);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,228,186,.25),0 4px 0 var(--walnut-lo)}
.plank:active{transform:translateY(2px)}
.plank .num{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font:700 20px var(--display);color:var(--burn);background:linear-gradient(#FFF3DA,#EBCB93);box-shadow:0 2px 0 #A97A45}
.plank.ok .num{background:linear-gradient(#EAF2D2,#C9DCA2);color:#2F4318;box-shadow:0 2px 0 var(--leaf-lo)}
.plank b{display:block;font:600 15px/1.2 var(--display)}
.plank small{display:block;font-size:12.5px;line-height:1.35;color:var(--ink-dim);margin-top:2px}
.plank .best{font:700 13px var(--display);color:var(--amber);font-variant-numeric:tabular-nums;text-align:right}
.rules{font-size:13.5px!important;line-height:1.45;opacity:.85}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="app">
  <header class="hud">
    <button class="ic" id="bMenu" aria-label="Уровни"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></button>
    <div class="lvl"><small id="lvlNo">Уровень 1</small><b id="lvlName">Опушка</b></div>
    <div class="stats">
      <div class="stat" id="movesBox" hidden><small>Ходы</small><b id="moves">0</b></div>
      <div class="stat"><small>Очки</small><b id="score">0</b></div>
    </div>
    <button class="ic" id="bHint" aria-label="Подсказка: открыть букву"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><span class="cnt" id="hintCnt">2</span></button>
    <button class="ic" id="bSound" aria-label="Звук"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path id="sndWave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path id="sndOff" d="M16 9l5 6M21 9l-5 6" style="display:none"/></svg></button>
  </header>

  <main class="stage">
    <section class="cw-panel" aria-label="Кроссворд">
      <div class="cw-head"><h2>Кроссворд</h2><span id="cwProg">0/0</span></div>
      <div class="cw-wrap" id="cwWrap"><div class="cw-grid" id="cw"></div></div>
      <div class="strip" id="strip">
        <button class="nav" id="sPrev" aria-label="Предыдущий вопрос">‹</button>
        <button class="cur" id="sCur"></button>
        <button class="nav" id="sNext" aria-label="Следующий вопрос">›</button>
      </div>
    </section>
    <section class="play" id="play">
      <canvas id="cv" aria-label="Игровая доска"></canvas>
      <div class="toast" id="toast"></div>
    </section>
    <section class="clues" aria-label="Вопросы">
      <h3>Вопросы · нажми, чтобы угадать</h3>
      <ol id="clues"></ol>
    </section>
  </main>
</div>
<div id="fly"></div>
<div class="ov" id="ov" hidden><div class="card" id="card"></div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
let DPR=Math.min(window.devicePixelRatio||1,2.5);

/* ---------- utils ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function shade(h,a){const[r,g,b]=hexRgb(h);const f=a<0?0:255,k=Math.abs(a);return`rgb(${Math.round(r+(f-r)*k)},${Math.round(g+(f-g)*k)},${Math.round(b+(f-b)*k)})`}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const ri=n=>Math.floor(Math.random()*n);
const pick=a=>a[ri(a.length)];
const ease=k=>1-Math.pow(1-k,3);
function plural(n,a,b,c){const m=n%100,d=n%10;if(m>10&&m<20)return c;if(d===1)return a;if(d>=2&&d<=4)return b;return c}
const store={get(){try{return JSON.parse(localStorage.getItem('slovoblok-v1'))||{}}catch(e){return{}}},set(v){try{localStorage.setItem('slovoblok-v1',JSON.stringify(v))}catch(e){}}};

/* ---------- levels ---------- */
const LEVELS=[
 {name:'Опушка',tag:'Знакомство',info:'Ставь бруски на доску и собирай полные ряды. Буквы из разбитых брусков летят в кроссворд. Знаешь слово раньше — нажми на него и впиши.',
  pool:'easy',chance:.62,given:1,hints:2,seed:11,
  words:[['ЛИСА','Рыжая хитрая жительница леса'],['ЛЕС','Много деревьев вместе'],['АИСТ','Длинноногая птица, вьёт гнёзда на крышах'],['СОВА','Не спит ночью, ухает в чаще']]},
 {name:'Мастерская',tag:'Новое: бруски с буквами уже на доске',info:'На доске лежат бруски с буквами. Достраивай вокруг них ряды, чтобы их освободить.',
  pool:'easy',chance:.55,given:2,hints:2,crates:8,seed:27,
  words:[['ДОСКА','Её пилят, строгают и шлифуют'],['ПИЛА','Зубастый инструмент столяра'],['КЛЕЙ','Скрепляет детали без гвоздей'],['ДУБ','Крепкое дерево с желудями'],['ЛАК','Им покрывают мебель для блеска']]},
 {name:'Осень',tag:'Новое: окованные бруски',info:'Окованные бруски ломаются со второго раза: первый собранный ряд сбивает железо, второй разбивает брусок.',
  pool:'mid',chance:.6,given:2,hints:2,bound:8,seed:43,
  words:[['ШАРФ','Тёплый, наматывают на шею'],['КЛЕН','Дерево с резными листьями'],['ЗОНТ','Спасает от дождя'],['ДОЖДЬ','Стучит по крыше всю ночь'],['ТЫКВА','Большой оранжевый овощ']]},
 {name:'Чаепитие',tag:'Новое: лимит ходов',info:'Всего 40 ходов. Угадывай слова заранее — это экономит ходы и даёт бонус.',

 {name:'У костра',tag:'Финал: всё сразу',info:'Финал: бруски с буквами, окованные бруски и 55 ходов. Сложные фигуры.',

  words:[['ОГОНЬ','Пляшет в костре'],['ЗВЕЗДА','Светит ночью на небе'],['ПАЛАТКА','Дом туриста'],['ГИТАРА','Шесть струн у костра'],['ЛУНА','Ночное светило'],['ДРОВА','Их подкладывают в огонь']]}
];

/* ---------- shapes ---------- */
const SH_SRC={o1:['#'],i2:['##'],i2v:['#','#'],i3:['###'],i3v:['#','#','#'],i4:['####'],i4v:['#','#','#','#'],i5:['#####'],i5v:['#','#','#','#','#'],
 sq2:['##','##'],sq3:['###','###','###'],
 c1:['##','#.'],c2:['##','.#'],c3:['#.','##'],c4:['.#','##'],
 l1:['#.','#.','##'],l2:['.#','.#','##'],l3:['###','#..'],l4:['###','..#'],l5:['##','#.','#.'],l6:['##','.#','.#'],l7:['#..','###'],l8:['..#','###'],
 t1:['###','.#.'],t2:['.#.','###'],t3:['#.','##','#.'],t4:['.#','##','.#'],
 s1:['.##','##.'],s2:['##.','.##'],s3:['#.','##','.#'],s4:['.#','##','#.'],
 b1:['###','#..','#..'],b2:['###','..#','..#'],b3:['#..','#..','###'],b4:['..#','..#','###']};
const SHAPES={};

/* ---------- crossword layout ---------- */
// CW-START
function buildCrossword(list){
  const words=list.map(([w,clue],i)=>({word:w,clue,i})).sort((a,b)=>b.word.length-a.word.length);
  const grid=new Map(),dirs=new Map(),placed=[];
  const K=(r,c)=>r+','+c, get=(r,c)=>grid.get(K(r,c));
  function score(w,r,c,dir){
    const dr=dir?1:0,dc=dir?0:1,n=w.length;
    if(get(r-dr,c-dc)||get(r+dr*n,c+dc*n))return -1;
    let inter=0;
    for(let i=0;i<n;i++){const rr=r+dr*i,cc=c+dc*i,g=get(rr,cc);
      if(g){if(g!==w[i])return -1;if((dirs.get(K(rr,cc))||[]).includes(dir))return -1;inter++}
      else if(get(rr+dc,cc+dr)||get(rr-dc,cc-dr))return -1}
    return inter}
  function put(o,r,c,dir){const dr=dir?1:0,dc=dir?0:1;for(let i=0;i<o.word.length;i++){const k=K(r+dr*i,c+dc*i);grid.set(k,o.word[i]);dirs.set(k,[...(dirs.get(k)||[]),dir])}placed.push({...o,r,c,dir})}
  function bbox(extra){let r0=1e9,r1=-1e9,c0=1e9,c1=-1e9;const add=(r,c)=>{r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c)};
    for(const k of grid.keys()){const[r,c]=k.split(',').map(Number);add(r,c)}
    if(extra){const{w,r,c,dir}=extra;add(r,c);add(r+(dir?w.length-1:0),c+(dir?0:w.length-1))}
    return{r0,r1,c0,c1}}
  put(words[0],0,0,0);
  let rest=words.slice(1),progress=true;
  while(rest.length&&progress){progress=false;
    for(const o of [...rest]){let best=null;
      for(const p of placed)for(let j=0;j<p.word.length;j++){const pr=p.r+(p.dir?j:0),pc=p.c+(p.dir?0:j);
        for(let i=0;i<o.word.length;i++){if(o.word[i]!==p.word[j])continue;const dir=p.dir?0:1;const r=dir?pr-i:pr,c=dir?pc:pc-i;
          const s=score(o.word,r,c,dir);if(s<1)continue;const b=bbox({w:o.word,r,c,dir});const area=(b.r1-b.r0+1)*(b.c1-b.c0+1);const asp=Math.abs((b.r1-b.r0)-(b.c1-b.c0));
          const val=s*100-area-asp*3;if(!best||val>best.val)best={r,c,dir,val}}}
      if(best){put(o,best.r,best.c,best.dir);rest=rest.filter(x=>x!==o);progress=true}}}
  const b=bbox();
  const out=placed.map(p=>({word:p.word,clue:p.clue,r:p.r-b.r0,c:p.c-b.c0,dir:p.dir}));
  return{rows:b.r1-b.r0+1,cols:b.c1-b.c0+1,words:out,unplaced:rest.map(x=>x.word)};
}

let AC=null,master=null,noiseBuf=null,muted=false;
function ensureAudio(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();master=AC.createGain();master.gain.value=.85;master.connect(comp);comp.connect(AC.destination);
  const len=Math.floor(AC.sampleRate*.3);noiseBuf=AC.createBuffer(1,len,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume()}catch(e){}}
function tock(f=520,vol=.45,dec=.09,when=0){if(!AC||muted)return;const t=AC.currentTime+when;
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f*1.7,t);o.frequency.exponentialRampToValueAtTime(f,t+.018);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+dec);o.connect(g).connect(master);o.start(t);o.stop(t+dec+.03);
  const n=AC.createBufferSource(),bp=AC.createBiquadFilter(),ng=AC.createGain();n.buffer=noiseBuf;bp.type='bandpass';bp.frequency.value=f*2.6;bp.Q.value=2.5;
  ng.gain.setValueAtTime(vol*.7,t);ng.gain.exponentialRampToValueAtTime(.0001,t+dec*.45);n.connect(bp).connect(ng).connect(master);n.start(t);n.stop(t+dec)}
function chime(f,vol=.2,when=0){if(!AC||muted)return;const t=AC.currentTime+when;
  [[1,vol,1.1],[3.98,vol*.22,.3],[10.2,vol*.06,.12]].forEach(([m,v,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*m;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)})}
function swish(vol=.09,dur=.28){if(!AC||muted)return;const t=AC.currentTime;const n=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();n.buffer=noiseBuf;f.type='bandpass';f.Q.value=.9;
  f.frequency.setValueAtTime(600,t);f.frequency.exponentialRampToValueAtTime(3200,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*.4);g.gain.linearRampToValueAtTime(0,t+dur);
  n.connect(f).connect(g).connect(master);n.start(t);n.stop(t+dur+.02)}
const PENTA=[1,9/8,5/4,3/2,5/3];
const note=(i,base)=>base*PENTA[i%5]*Math.pow(2,Math.floor(i/5));
function arp(base){[0,4,7,12,16].forEach((s,i)=>chime(base*Math.pow(2,s/12),.18,i*.085))}

/* ---------- sprites ---------- */
function makeSprite(color,v,s){
  const c=document.createElement('canvas');c.width=c.height=Math.ceil(s*DPR);const g=c.getContext('2d');g.scale(DPR,DPR);
  const ins=s*.045,r=s*.18,dep=s*.075,x=ins,y=ins,w=s-ins*2,h=s-ins*2-dep;
  rr(g,x,y+dep,w,h,r);g.fillStyle=shade(color,-.42);g.fill();
  rr(g,x,y,w,h,r);const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,shade(color,.17));gr.addColorStop(1,shade(color,-.07));g.fillStyle=gr;g.fill();
  g.save();rr(g,x,y,w,h,r);g.clip();
  const rnd=mulberry(v*7919+parseInt(color.slice(1),16));g.strokeStyle=shade(color,-.35);g.lineWidth=Math.max(.7,s*.014);
  const vert=v%2===1;
  for(let i=0;i<8;i++){g.globalAlpha=.08+rnd()*.15;g.beginPath();const o0=(i+rnd()*.7)*(vert?w:h)/7.5;const amp=s*(.008+rnd()*.03),ph=rnd()*6.28,fr=.6+rnd()*1.6;
    for(let p=-2;p<=s+2;p+=2){const q=o0+Math.sin(p/s*fr*6.28+ph)*amp;if(vert){p===-2?g.moveTo(x+q,p):g.lineTo(x+q,p)}else{p===-2?g.moveTo(p,y+q):g.lineTo(p,y+q)}}g.stroke()}
  if(rnd()<.4){g.globalAlpha=.22;const kx=x+w*(.2+rnd()*.6),ky=y+h*(.25+rnd()*.5);for(let k=0;k<3;k++){g.beginPath();g.ellipse(kx,ky,s*(.05+k*.04),s*(.025+k*.02),vert?Math.PI/2:0,0,6.29);g.stroke()}}
  g.globalAlpha=1;const sh=g.createLinearGradient(x,y,x+w,y+h);sh.addColorStop(0,'rgba(255,255,255,.2)');sh.addColorStop(.45,'rgba(255,255,255,0)');g.fillStyle=sh;g.fillRect(x,y,w,h);
  g.restore();
  rr(g,x+1,y+1,w-2,h-2,r-1);g.strokeStyle='rgba(255,242,215,.38)';g.lineWidth=1.2;g.stroke();
  return c}
function sprite(color,v){const k=color+v;let s=sprites.get(k);if(!s){s=makeSprite(color,v,cell);sprites.set(k,s)}return s}

function makeBoardBG(){
  const c=document.createElement('canvas');c.width=Math.ceil(W*DPR);c.height=Math.ceil(boardH*DPR);const g=c.getContext('2d');g.scale(DPR,DPR);

  g.save();rr(g,0,0,W,boardH,cell*.42);g.clip();const rnd=mulberry(99);g.strokeStyle='#2B190D';

    for(let x=-4;x<=W+4;x+=4){const yy=y0+Math.sin(x/W*fr*6.28+ph)*amp;x===-4?g.moveTo(x,yy):g.lineTo(x,yy)}g.stroke()}

/* ---------- drawing tiles ---------- */
function drawTile(x,y,s,t,o={}){
  const a=o.alpha??1,k=o.scale??1;if(a<=0)return;
  ctx.save();ctx.globalAlpha=a;
  if(k!==1){ctx.translate(x+s/2,y+s/2);ctx.scale(k,k);ctx.translate(-x-s/2,-y-s/2)}
  if(o.rot){ctx.translate(x+s/2,y+s/2);ctx.rotate(o.rot);ctx.translate(-x-s/2,-y-s/2)}
  ctx.drawImage(sprite(t.color,t.v),x,y,s,s);
  const fx=x+s/2,fy=y+s*.46;
  if(t.hp>1||(t.strap&&now<t.strap)){
    for(const yy of[y+s*.2,y+s*.62]){const bh=s*.13;const bg=ctx.createLinearGradient(0,yy,0,yy+bh);bg.addColorStop(0,'#9AA0A6');bg.addColorStop(.5,'#5E646A');bg.addColorStop(1,'#3B4045');
      ctx.fillStyle=bg;ctx.fillRect(x+s*.05,yy,s*.9,bh);ctx.fillStyle='#C9CED2';for(const xx of[x+s*.16,x+s*.84]){ctx.beginPath();ctx.arc(xx,yy+bh/2,s*.03,0,6.29);ctx.fill()}}}
  if(t.letter){
    const R=s*.27;const dg=ctx.createRadialGradient(fx-R*.3,fy-R*.4,R*.1,fx,fy,R);dg.addColorStop(0,'#FFF6E2');dg.addColorStop(1,'#E9C891');
    ctx.beginPath();ctx.arc(fx,fy+s*.02,R,0,6.29);ctx.fillStyle='rgba(40,20,8,.35)';ctx.fill();
    ctx.beginPath();ctx.arc(fx,fy,R,0,6.29);ctx.fillStyle=dg;ctx.fill();
    ctx.fillStyle='#3A2113';ctx.font=`800 ${Math.round(s*.34)}px Rubik, Nunito, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.letter,fx,fy+s*.02)}
  ctx.restore()}

/* ---------- crossword state + DOM ---------- */
function initCW(rng){
  const res=buildCrossword(L.words);
  cw={rows:res.rows,cols:res.cols,cells:new Map(),words:[]};
  res.words.forEach(w=>{const o={word:w.word,clue:w.clue,r:w.r,c:w.c,dir:w.dir,keys:[],done:false,num:0};
    for(let i=0;i<w.word.length;i++){const r=w.r+(w.dir?i:0),c=w.c+(w.dir?0:i),k=r+','+c;
      if(!cw.cells.has(k))cw.cells.set(k,{key:k,r,c,letter:w.word[i],revealed:false,reserved:false,words:[],el:null});
      cw.cells.get(k).words.push(o);o.keys.push(k)}
    cw.words.push(o)});
  const starts=[...new Set(cw.words.map(w=>w.keys[0]))].map(k=>cw.cells.get(k)).sort((a,b)=>a.r-b.r||a.c-b.c);
  starts.forEach((c,i)=>{c.num=i+1});cw.words.forEach(w=>w.num=cw.cells.get(w.keys[0]).num);
  cw.words.sort((a,b)=>a.num-b.num||a.dir-b.dir);
  const all=[...cw.cells.values()];for(let i=0;i<L.given&&i<all.length;i++){const pool=all.filter(c=>!c.revealed);pool[Math.floor(rng()*pool.length)].revealed=true}
  renderCW()}
function renderCW(){
  const g=$('#cw');g.innerHTML='';g.style.gridTemplateColumns=`repeat(${cw.cols},var(--cs))`;
  for(let r=0;r<cw.rows;r++)for(let c=0;c<cw.cols;c++){const k=r+','+c,cl=cw.cells.get(k),d=document.createElement('div');
    if(!cl){d.className='cw-void';g.appendChild(d);continue}
    d.className='cw-cell'+(cl.revealed?' on':'');d.dataset.key=k;d.innerHTML=(cl.num?`<span class="no">${cl.num}</span>`:'')+`<span class="ch">${cl.letter}</span>`;
    cl.el=d;g.appendChild(d)}
  sizeCW();renderClues();updateProg()}
function sizeCW(){if(!cw)return;const w=$('#cwWrap').clientWidth;const maxH=innerWidth<880?Math.min(200,innerHeight*.24):320;
  const cs=Math.max(20,Math.floor(Math.min((w-4-(cw.cols-1)*3)/cw.cols,(maxH-(cw.rows-1)*3)/cw.rows,40)));$('#cw').style.setProperty('--cs',cs+'px')}

  const ol=$('#clues');ol.innerHTML='';
  cw.words.forEach(w=>{const li=document.createElement('li');const b=document.createElement('button');b.className='clue'+(w.done?' done':'');
    b.innerHTML=`<span class="n">${w.num}</span><span class="d">${w.dir?'↓':'→'}</span><span class="t">${w.clue}</span><span class="len">${w.word.length}</span>`;

function mark(w,on){w.keys.forEach(k=>cw.cells.get(k).el.classList.toggle('sel',on))}

  let ws=cl.words.filter(w=>!w.done);if(!ws.length)ws=cl.words;let w=ws[0];if(ws.length>1&&selWord===ws[0])w=ws[1];selWord=w;openGuess(w)});

/* ---------- letters economy ---------- */
function neededLetters(){
  const cnt={};for(const c of cw.cells.values())if(!c.revealed&&!c.reserved)cnt[c.letter]=(cnt[c.letter]||0)+1;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=board[r][c];if(t&&t.letter)cnt[t.letter]=(cnt[t.letter]||0)-1}
  for(const p of tray)if(p)for(const k in p.letters)cnt[p.letters[k]]=(cnt[p.letters[k]]||0)-1;
  const out=[];for(const l in cnt)for(let i=0;i<cnt[l];i++)out.push(l);return out}
function revealCell(k,opts={}){
  const c=cw.cells.get(k);if(!c||c.revealed)return;c.revealed=true;c.reserved=false;
  c.el.classList.add('on','pop');setTimeout(()=>c.el.classList.remove('pop'),450);
  chime(note(revealCount++,523),.2);addScore(opts.bonus??25);
  c.words.forEach(w=>{if(!w.done&&w.keys.every(x=>cw.cells.get(x).revealed))completeWord(w)});
  renderStrip()}
function completeWord(w){
  w.done=true;w.keys.forEach((k,i)=>{const el=cw.cells.get(k).el;setTimeout(()=>{el.classList.add('done','wave');setTimeout(()=>el.classList.remove('wave'),520)},i*70)});
  setTimeout(()=>arp(392),120);haptic(20);addScore(100);
  showToast(`<b>${w.word}</b>Слово разгадано · +100`,1500);
  renderClues();updateProg();
  if(cw.words.every(x=>x.done)&&over!=='done'){over='done';drag=null;setTimeout(win,1300)}}

/* ---------- pieces ---------- */
function makePiece(){
  const sh=SHAPES[pickShape(L.pool)];const p={cells:sh.cells,w:sh.w,h:sh.h,color:pick(STAINS),v:ri(4),letters:{},spawn:now,ret:null};
  let need=neededLetters();
  if(need.length&&Math.random()<L.chance){const i=ri(p.cells.length);p.letters[i]=pick(need);
    if(p.cells.length>=4&&Math.random()<.35){need.splice(need.indexOf(p.letters[i]),1);if(need.length){let j=ri(p.cells.length);if(j===i)j=(j+1)%p.cells.length;p.letters[j]=pick(need)}}}
  return p}
function fits(p,r0,c0){for(const[dr,dc]of p.cells){const r=r0+dr,c=c0+dc;if(r<0||c<0||r>=N||c>=N||board[r][c])return false}return true}
function anyFit(p){for(let r=0;r<=N-p.h;r++)for(let c=0;c<=N-p.w;c++)if(fits(p,r,c))return true;return false}
function deal(){
  for(let a=0;a<14;a++){tray=[null,null,null];for(let i=0;i<3;i++)tray[i]=makePiece();if(tray.some(anyFit))break}
  if(!tray.some(anyFit)){const s=SHAPES.o1;tray[0]={cells:s.cells,w:1,h:1,color:pick(STAINS),v:0,letters:{},spawn:now,ret:null}}
  tray.forEach((p,i)=>{p.spawn=now+i*80});
  swish(.05,.3)}

/* ---------- placement ---------- */
function place(p,r0,c0){
  p.cells.forEach(([dr,dc],i)=>{board[r0+dr][c0+dc]={color:p.color,v:(p.v+i)%4,letter:p.letters[i]||null,hp:1,pop:now+i*24}});
  p.cells.forEach((_,i)=>tock(300+Math.random()*60,.42,.1,i*.024));haptic(10);
  moves++;if(L.moves){movesLeft--;}
  addScore(p.cells.length);
  tray[tray.indexOf(p)]=null;
  resolveLines(r0+p.h/2,c0+p.w/2,p);
  if(tray.every(x=>!x))setTimeout(()=>{if(!over)deal()},260);
  updateHud();
  setTimeout(checkEnd,900)}
function fullLines(extra){
  const filled=(r,c)=>board[r][c]||(extra&&extra.has(r+','+c));const rows=[],cols=[];
  for(let r=0;r<N;r++){let f=true;for(let c=0;c<N;c++)if(!filled(r,c)){f=false;break}if(f)rows.push(r)}
  for(let c=0;c<N;c++){let f=true;for(let r=0;r<N;r++)if(!filled(r,c)){f=false;break}if(f)cols.push(c)}
  return{rows,cols}}
function resolveLines(cr,cc){
  const{rows,cols}=fullLines();const lines=rows.length+cols.length;
  if(!lines){streak=0;return}
  streak++;
  const set=new Map();rows.forEach(r=>{for(let c=0;c<N;c++)set.set(r+','+c,[r,c])});cols.forEach(c=>{for(let r=0;r<N;r++)set.set(r+','+c,[r,c])});
  const list=[...set.values()].map(([r,c])=>({r,c,d:Math.hypot(r+.5-cr,c+.5-cc)})).sort((a,b)=>a.d-b.d);
  let broken=0;
  list.forEach(({r,c,d},i)=>{const t=board[r][c];const delay=60+d*48;
    if(t.hp>1){t.hp=1;t.strap=now+delay;events.push({t:now+delay,fn:()=>{const[x,y]=cellXY(r,c);chips(x+cell/2,y+cell/2,'#7C8288',7,true);tock(1500,.12,.06)}})}
    else{broken++;board[r][c]=null;fading.push({r,c,t,t0:now+delay});
      events.push({t:now+delay,fn:()=>{const[x,y]=cellXY(r,c);chips(x+cell/2,y+cell/2,t.color,9);tock(note(i,330),.32,.12);if(t.letter)releaseLetter(t.letter,x+cell/2,y+cell/2)}})}});
  swish(.07+lines*.02,.35);haptic(lines>1?[12,40,18]:16);
  const mult=Math.max(1,streak);const pts=broken*10*lines*mult;addScore(pts);
  const[x,y]=[bx+cc*cell,by+cr*cell];
  floaters.push({x,y,t0:now,text:'+'+pts,size:cell*.55,color:'#FFE4B0'});
  const label=lines>=3?'Щепки летят!':lines===2?'Дважды!':streak>=2?`Серия ×${streak}`:'';
  if(label)floaters.push({x,y:y-cell*.75,t0:now+120,text:label,size:cell*.4,color:'#F0A845'})}
function releaseLetter(letter,x,y){
  const cand=[...cw.cells.values()].filter(c=>!c.revealed&&!c.reserved&&c.letter===letter);
  if(!cand.length){addScore(15);floaters.push({x:x-cell*.3,y,t0:now,text:'+15',size:cell*.36,color:'#E9D2A6'});return}
  cand.sort((a,b)=>prog(b)-prog(a));const tgt=cand[0];tgt.reserved=true;
  const r=cv.getBoundingClientRect();flyLetter(letter,r.left+x,r.top+y,tgt.key,0)}
const prog=c=>Math.max(...c.words.map(w=>w.done?-1:w.keys.filter(k=>cw.cells.get(k).revealed).length/w.keys.length));
function flyLetter(letter,fx,fy,key,delay){
  const cl=cw.cells.get(key);const tr=cl.el.getBoundingClientRect();const sz=Math.max(30,cell*.62);
  const d=document.createElement('div');d.className='fl';d.textContent=letter;d.style.cssText=`left:${fx-sz/2}px;top:${fy-sz/2}px;width:${sz}px;height:${sz}px;font-size:${sz*.55}px`;
  $('#fly').appendChild(d);flights++;
  const dx=tr.left+tr.width/2-fx,dy=tr.top+tr.height/2-fy,end=tr.width/sz;
  const kf=[{transform:'translate(0,0) scale(.4) rotate(-10deg)',opacity:0},{transform:`translate(${dx*.18}px,${dy*.18-70}px) scale(1.3) rotate(6deg)`,opacity:1,offset:.32},{transform:`translate(${dx}px,${dy}px) scale(${end}) rotate(0)`,opacity:1}];
  let done=false;const fin=()=>{if(done)return;done=true;d.remove();flights--;revealCell(key);checkEnd()};
  try{const a=d.animate(kf,{duration:780,delay,easing:'cubic-bezier(.45,0,.25,1)',fill:'both'});a.onfinish=fin}catch(e){setTimeout(fin,delay+50)}
  setTimeout(fin,delay+1400)}

/* ---------- particles & floaters ---------- */
function cellXY(r,c){return[bx+c*cell,by+r*cell]}
function chips(x,y,color,n,metal){for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=1.5+Math.random()*3.5;
  particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1,color:metal?color:shade(color,(Math.random()-.4)*.4),w:cell*(.08+Math.random()*.12),h:cell*(.04+Math.random()*.06)})}}

/* ---------- score / hud ---------- */
function addScore(n){score+=n;$('#score').textContent=score}
function updateHud(){
  $('#score').textContent=score;
  $('#movesBox').hidden=!L.moves;if(L.moves){$('#moves').textContent=movesLeft;$('#movesBox').classList.toggle('low',movesLeft<=8)}
  $('#hintCnt').textContent=hintsLeft;$('#bHint').disabled=hintsLeft<=0}
let toastT=0;
function showToast(html,ms){const t=$('#toast');t.innerHTML=html;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)}

/* ---------- start level ---------- */
function startLevel(i){
  LI=i;L=LEVELS[i];over=false;score=0;moves=0;movesLeft=L.moves||0;hintsLeft=L.hints;hintsUsed=0;streak=0;flights=0;revealCount=0;
  fading=[];particles=[];floaters=[];events=[];drag=null;stripIdx=0;selWord=null;$('#fly').innerHTML='';
  board=Array.from({length:N},()=>Array(N).fill(null));tray=[null,null,null];
  const rng=mulberry(L.seed);initCW(rng);
  const rowCnt=Array(N).fill(0),colCnt=Array(N).fill(0);
  const spot=()=>{for(let a=0;a<200;a++){const r=Math.floor(rng()*N),c=Math.floor(rng()*N);if(!board[r][c]&&rowCnt[r]<3&&colCnt[c]<3){rowCnt[r]++;colCnt[c]++;return[r,c]}}return null};
  for(let k=0;k<(L.crates||0);k++){const s=spot();if(!s)break;const need=neededLetters();board[s[0]][s[1]]={color:CRATE,v:Math.floor(rng()*4),letter:need.length?need[Math.floor(rng()*need.length)]:null,hp:1,pop:0}}
  for(let k=0;k<(L.bound||0);k++){const s=spot();if(!s)break;const need=neededLetters();board[s[0]][s[1]]={color:STAINS[Math.floor(rng()*STAINS.length)],v:Math.floor(rng()*4),letter:need.length&&rng()<.55?need[Math.floor(rng()*need.length)]:null,hp:2,pop:0}}
  $('#lvlNo').textContent=`Уровень ${i+1} из ${LEVELS.length}`;$('#lvlName').textContent=L.name;
  layout();deal();updateHud();
  showToast(`<b>${L.name}</b>${L.info}`,i===0?5200:4000)}

/* ---------- end states ---------- */
function checkEnd(){
  if(over)return;if(cw.words.every(w=>w.done))return;if(flights>0||events.length){setTimeout(checkEnd,300);return}
  if(L.moves&&movesLeft<=0)return lose('moves');
  const live=tray.filter(Boolean);if(live.length&&!live.some(anyFit))return lose('board')}
function lose(why){
  over='guess';drag=null;tock(150,.5,.25);
  const left=cw.words.filter(w=>!w.done).length;
  modal(`<p class="eyebrow">Уровень ${LI+1} · ${L.name}</p><h3>${why==='moves'?'Ходы закончились':'Брускам больше некуда встать'}</h3>
   <p>Осталось ${left} ${plural(left,'слово','слова','слов')}. Доска заблокирована, но слова ещё можно угадать — разгадай все и уровень засчитается.</p>
   <div class="row"><button class="btn alt" id="mGuess">Угадывать слова</button><button class="btn" id="mRetry">Заново</button></div>`);
  $('#mGuess').onclick=closeModal;$('#mRetry').onclick=()=>{closeModal();startLevel(LI)}}
function win(){
  const s=store.get();s.best=s.best||{};s.done=s.done||{};s.best[LI]=Math.max(s.best[LI]||0,score);s.done[LI]=true;store.set(s);
  arp(523);setTimeout(()=>arp(659),420);
  const last=LI===LEVELS.length-1;
  modal(`<p class="eyebrow">Уровень ${LI+1} пройден</p><h3>${last?'Все пять уровней пройдены':'Все слова разгаданы'}</h3>
   <div class="words">${cw.words.map(w=>`<span>${w.word}</span>`).join('')}</div>
   <div class="score-line"><div><small>Очки</small><b>${score}</b></div><div><small>Рекорд</small><b>${s.best[LI]}</b></div><div><small>Ходов</small><b>${moves}</b></div></div>
   <div class="row"><button class="btn alt" id="mMap">Уровни</button><button class="btn" id="mNext">${last?'Сыграть снова':'Дальше'}</button></div>`);
  $('#mMap').onclick=showMap;$('#mNext').onclick=()=>{closeModal();startLevel(last?0:LI+1)}}
function showMap(){
  const s=store.get();const best=s.best||{},done=s.done||{};
  modal(`<p class="eyebrow">Словоблок</p><h3>Выбери уровень</h3>
   <div class="planks">${LEVELS.map((l,i)=>`<button class="plank${done[i]?' ok':''}" data-i="${i}"><span class="num">${done[i]?'✓':i+1}</span><span><b>${l.name}</b><small>${l.tag}</small></span><span class="best">${best[i]?best[i]:''}</span></button>`).join('')}</div>
   <p class="rules">Ставь бруски, собирай полные ряды и столбцы. Буквы из разбитых брусков сами встают в кроссворд. Нажми на слово, чтобы угадать его раньше и получить бонус.</p>
   <div class="row"><button class="btn alt" id="mClose">Продолжить</button></div>`);
  document.querySelectorAll('.plank').forEach(b=>b.onclick=()=>{ensureAudio();tock(420,.3,.1);closeModal();startLevel(+b.dataset.i)});
  $('#mClose').onclick=closeModal}

/* ---------- guess ---------- */
function openGuess(w){
  ensureAudio();if(over==='done')return;
  if(w.done){mark(w,true);setTimeout(()=>mark(w,false),600);return}
  tock(700,.15,.06);
  const slots=()=>w.keys.map((k,i)=>{const c=cw.cells.get(k);const typed=($('#gIn')?.value||'')[i];
    return c.revealed?`<span class="slot k">${c.letter}</span>`:`<span class="slot${typed?' t':''}">${typed||''}</span>`}).join('');
  const hidden=w.keys.filter(k=>!cw.cells.get(k).revealed).length;
  modal(`<p class="eyebrow">${w.num} ${w.dir?'по вертикали':'по горизонтали'} · ${w.word.length} ${plural(w.word.length,'буква','буквы','букв')}</p><h3>${w.clue}</h3>
   <div class="slots" id="gSlots">${slots()}</div>
   <input class="gin" id="gIn" maxlength="${w.word.length}" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="characters" placeholder="Слово целиком" aria-label="Ответ">
   <p class="rules" style="margin-top:-4px">Верный ответ откроет ${hidden} ${plural(hidden,'букву','буквы','букв')} и даст +${hidden*40} очков.</p>
   <div class="row"><button class="btn alt" id="gNo">Отмена</button><button class="btn" id="gOk">Проверить</button></div>`);
  const inp=$('#gIn');
  inp.addEventListener('input',()=>{inp.value=inp.value.toUpperCase().replace(/Ё/g,'Е').replace(/[^А-Я]/g,'');$('#gSlots').innerHTML=slots();tock(1100+inp.value.length*40,.05,.03)});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
  $('#gNo').onclick=closeModal;$('#gOk').onclick=check;
  setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(e){}},60);
  function check(){
    const v=inp.value;if(!v)return;
    if(v===w.word.replace(/Ё/g,'Е')){closeModal();const ks=w.keys.filter(k=>{const c=cw.cells.get(k);return!c.revealed&&!c.reserved});
      ks.forEach((k,i)=>setTimeout(()=>revealCell(k,{bonus:40}),i*120));haptic(15)}
    else{const card=$('#card');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');tock(140,.5,.2);haptic([20,40,20]);inp.select()}}}

/* ---------- hint ---------- */
$('#bHint').addEventListener('click',()=>{ensureAudio();if(hintsLeft<=0||over==='done')return;
  const pool=[...cw.cells.values()].filter(c=>!c.revealed&&!c.reserved);if(!pool.length)return;
  pool.sort((a,b)=>prog(b)-prog(a));const c=pool[0];c.reserved=true;hintsLeft--;hintsUsed++;updateHud();
  const r=$('#bHint').getBoundingClientRect();flyLetter(c.letter,r.left+r.width/2,r.top+r.height/2,c.key,0);chime(880,.12)});

/* ---------- modal ---------- */
function modal(html){$('#card').innerHTML=html;$('#card').classList.remove('shake');$('#ov').hidden=false}
function closeModal(){$('#ov').hidden=true}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&over!=='done')closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden&&over!=='done')closeModal()});
$('#bMenu').addEventListener('click',()=>{ensureAudio();tock(420,.2,.08);showMap()});
$('#bSound').addEventListener('click',()=>{muted=!muted;$('#sndWave').style.display=muted?'none':'';$('#sndOff').style.display=muted?'':'none';const s=store.get();s.muted=muted;store.set(s);if(!muted){ensureAudio();tock(500,.3,.1)}});

/* ---------- input ---------- */
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function slotCenter(i){return[W/6*(2*i+1),trayTop+trayH/2]}
cv.addEventListener('pointerdown',e=>{
  ensureAudio();if(over||!$('#ov').hidden)return;const{x,y}=pt(e);if(y<trayTop-cell*.3)return;
  const i=Math.min(2,Math.max(0,Math.floor(x/(W/3))));const p=tray[i];if(!p)return;
  drag={i,p,x,y,lift:e.pointerType==='touch'?cell*1.7:cell*.4,ghost:null};p.ret=null;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  tock(900,.12,.05);haptic(6);updGhost();e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(drag){const{x,y}=pt(e);drag.x=x;drag.y=y;updGhost()}else{const{y}=pt(e);cv.style.cursor=y>trayTop?'grab':'default'}});
const endDrag=e=>{if(!drag)return;const{p,ghost}=drag;
  if(ghost&&!over){drag=null;place(p,ghost.r,ghost.c)}
  else{const[cx,cy]=dragCenter();p.ret={x:cx,y:cy,t0:now};drag=null;tock(600,.08,.05)}};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
function dragCenter(){return[drag.x,drag.y-drag.lift]}
function updGhost(){
  const p=drag.p,[cx,cy]=dragCenter();const tlx=cx-p.w*cell/2,tly=cy-p.h*cell/2;
  const c=Math.round((tlx-bx)/cell),r=Math.round((tly-by)/cell);
  let g=null;if(fits(p,r,c)){const ex=new Set(p.cells.map(([dr,dc])=>(r+dr)+','+(c+dc)));const{rows,cols}=fullLines(ex);const hl=new Set();rows.forEach(rr=>{for(let q=0;q<N;q++)hl.add(rr+','+q)});cols.forEach(cc=>{for(let q=0;q<N;q++)hl.add(q+','+cc)});g={r,c,hl}}
  const prev=drag.ghost;drag.ghost=g;
  if(g&&(!prev||prev.r!==g.r||prev.c!==g.c))tock(g.hl.size?1250:1000,g.hl.size?.07:.035,.03)}

/* ---------- loop ---------- */
let last=0;
function frame(t){
  const dt=Math.min(50,t-(last||t))/16.67;last=t;now=t;
  for(let i=events.length-1;i>=0;i--)if(events[i].t<=now){const ev=events[i];events.splice(i,1);ev.fn()}
  draw(dt);requestAnimationFrame(frame)}
function draw(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  if(boardBG)ctx.drawImage(boardBG,0,0,W,boardH);
  const hl=drag&&drag.ghost?drag.ghost.hl:null;
  if(hl&&hl.size){ctx.save();const pulse=.18+.08*Math.sin(now/120);ctx.fillStyle=`rgba(255,214,140,${pulse})`;
    hl.forEach(k=>{const[r,c]=k.split(',').map(Number);rr(ctx,bx+c*cell+cell*.06,by+r*cell+cell*.06,cell*.88,cell*.88,cell*.15);ctx.fill()});ctx.restore()}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=board[r][c];if(!t)continue;const[x,y]=cellXY(r,c);
    let s=1,a=1;if(t.pop){const k=(now-t.pop)/240;if(k<0){a=0}else if(k<1)s=1+.16*Math.cos(k*Math.PI*1.4)*(1-k)}
    const glow=hl&&hl.has(r+','+c);drawTile(x,y,cell,t,{scale:glow?1.04+.02*Math.sin(now/90):s,alpha:a})}
  for(let i=fading.length-1;i>=0;i--){const f=fading[i];const k=(now-f.t0)/300;const[x,y]=cellXY(f.r,f.c);
    if(k>=1){fading.splice(i,1);continue}if(k<0){drawTile(x,y,cell,f.t);continue}
    drawTile(x,y-k*cell*.2,cell,f.t,{scale:1+.18*Math.sin(k*Math.PI)-.55*k*k,alpha:1-ease(k),rot:k*.25})}
  if(drag&&drag.ghost){const g=drag.ghost,p=drag.p;p.cells.forEach(([dr,dc],i)=>{const[x,y]=cellXY(g.r+dr,g.c+dc);drawTile(x,y,cell,{color:p.color,v:(p.v+i)%4,letter:p.letters[i]||null,hp:1},{alpha:.38})})}
  // tray
  ctx.save();rr(ctx,cell*.1,trayTop+cell*.1,W-cell*.2,trayH-cell*.2,cell*.35);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fill();ctx.restore();
  tray.forEach((p,i)=>{if(!p||(drag&&drag.p===p))return;
    let[cx,cy]=slotCenter(i);let s=sc,a=1;
    const k=(now-p.spawn)/380;if(k<0)return;if(k<1){cx+=(1-ease(k))*W*.5;a=ease(k)}
    if(p.ret){const q=(now-p.ret.t0)/220;if(q<1){const e=ease(q);cx=p.ret.x+(cx-p.ret.x)*e;cy=p.ret.y+(cy-p.ret.y)*e;s=1+(sc-1)*e}else p.ret=null}
    if(!over&&!anyFit(p))a*=.38;
    drawPiece(p,cx,cy,s,a)});
  if(drag){const[cx,cy]=dragCenter();ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=cell*.5;ctx.shadowOffsetY=cell*.25;drawPiece(drag.p,cx,cy,1.04,1);ctx.restore()}
  // particles
  for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.28*dt;q.vx*=.985;q.rot+=q.vr*dt;q.life-=.022*dt;
    if(q.life<=0){particles.splice(i,1);continue}ctx.save();ctx.globalAlpha=Math.min(1,q.life*1.4);ctx.translate(q.x,q.y);ctx.rotate(q.rot);ctx.fillStyle=q.color;ctx.fillRect(-q.w/2,-q.h/2,q.w,q.h);ctx.restore()}
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];const k=(now-f.t0)/1150;if(k<0)continue;if(k>=1){floaters.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=1-k*k;ctx.font=`700 ${Math.round(f.size*(1+.25*Math.sin(Math.min(1,k*4)*Math.PI)))}px Unbounded, Rubik, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(40,22,10,.85)';ctx.strokeText(f.text,f.x,f.y-k*cell*1.1);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y-k*cell*1.1);ctx.restore()}}
function drawPiece(p,cx,cy,s,a){const ts=cell*s;const ox=cx-p.w*ts/2,oy=cy-p.h*ts/2;
  p.cells.forEach(([dr,dc],i)=>drawTile(ox+dc*ts,oy+dr*ts,ts,{color:p.color,v:(p.v+i)%4,letter:p.letters[i]||null,hp:1},{alpha:a}))}

/* ---------- boot ---------- */
new ResizeObserver(()=>{if(L){layout()}}).observe($('#play'));
addEventListener('resize',()=>{DPR=Math.min(window.devicePixelRatio||1,2.5);if(L)layout()});
{const s=store.get();if(s.muted){muted=true;$('#sndWave').style.display='none';$('#sndOff').style.display=''}}
startLevel(0);requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){Promise.all(['800 20px Rubik','700 20px Unbounded'].map(f=>document.fonts.load(f))).then(()=>{sprites.clear()}).catch(()=>{})}
})();
</script>

</body></html>
