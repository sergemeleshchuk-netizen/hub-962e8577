<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hexa Arrows with merge — v3</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:#e9e6f2;}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }

  /* ===== HUD ===== */
  #hud{width:100%;padding:18px 16px 0;z-index:3;position:relative;height:110px;flex:none;}
  #gearBtn{position:absolute;left:16px;top:22px;width:52px;height:52px;border:none;cursor:pointer;
    border-radius:16px;background:linear-gradient(#5b64cf,#4a53bd);
    box-shadow:0 5px 0 #363e96,0 8px 14px rgba(60,60,120,.35);
    color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;}
  #gearBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #363e96;}
  #lvlWrap{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center;}
  #lvlBadge{display:inline-block;background:#3d4b9e;color:#fff;font-weight:800;font-size:15px;
    letter-spacing:1px;padding:5px 20px;border-radius:10px;box-shadow:0 3px 0 #2c3778;}
  #movesBanner{margin-top:-4px;background:#fff;color:#273a7a;font-weight:800;font-size:26px;
    padding:6px 34px;border:3px solid #94a3e4;position:relative;
    clip-path:polygon(0 50%,7% 0,93% 0,100% 50%,93% 100%,7% 100%);
    filter:drop-shadow(0 3px 3px rgba(80,80,140,.3));}

  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #fx{z-index:15;pointer-events:none;}
  #hint{position:absolute;bottom:10px;left:0;width:100%;text-align:center;color:#8a8ab0;
    font-weight:700;font-size:13px;z-index:3;padding:0 24px;pointer-events:none;}

  /* ===== Оверлеи ===== */
  .ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
      flex-direction:column;background:rgba(20,16,40,.66);}
  .hidden{display:none !important;}

  .card{position:relative;width:78%;max-width:360px;background:#efe9fa;border:6px solid #a44de0;
    border-radius:28px;padding:64px 22px 26px;display:flex;flex-direction:column;align-items:center;
    box-shadow:0 24px 60px rgba(0,0,0,.45);}
  .ribbon{position:absolute;top:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:linear-gradient(#ff9b2e,#f07713);color:#fff;font-weight:900;font-size:26px;
    letter-spacing:1px;padding:12px 34px;border-radius:14px;
    text-shadow:0 3px 0 rgba(160,70,0,.55);box-shadow:0 6px 0 #c85c08,0 10px 18px rgba(0,0,0,.3);}
  .ribbon.red{background:linear-gradient(#ff5964,#e0333f);box-shadow:0 6px 0 #b0222c,0 10px 18px rgba(0,0,0,.3);
    text-shadow:0 3px 0 rgba(150,20,30,.55);}
  .emoji{font-size:84px;margin:6px 0 14px;}
  .rewardPill{background:#b98fe8;color:#fff;font-weight:900;font-size:26px;border-radius:40px;
    padding:12px 30px;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
  .bigBtn{border:none;cursor:pointer;color:#fff;font-weight:900;font-size:26px;letter-spacing:1px;
    padding:15px 60px;border-radius:18px;background:linear-gradient(#5fd435,#3fae1e);
    box-shadow:0 6px 0 #2e8514,0 10px 18px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(30,90,10,.5);}
  .bigBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #2e8514;}
  .bigBtn.blue{background:linear-gradient(#5b8cf0,#3a68d8);box-shadow:0 6px 0 #2749a8,0 10px 18px rgba(0,0,0,.25);}
  .bigBtn.blue:active{box-shadow:0 2px 0 #2749a8;}

  /* Домашний экран */
  #home{background:linear-gradient(#e9e6f2,#d9d4ec);z-index:25;}
  #home h1{margin:0 0 6px;font-size:44px;font-weight:900;color:#3d4b9e;letter-spacing:2px;
    text-shadow:0 3px 0 #fff,0 6px 10px rgba(80,80,150,.25);text-align:center;line-height:1.1;}
  #home .sub{color:#8a8ab0;font-weight:700;margin-bottom:34px;}
  #homeHexes{font-size:44px;letter-spacing:6px;margin-bottom:26px;filter:drop-shadow(0 4px 4px rgba(80,80,140,.3));}

  /* Мини-меню шестерёнки */
  #menuCard{background:#efe9fa;border:5px solid #5b64cf;border-radius:24px;padding:26px 30px;
    display:flex;flex-direction:column;gap:14px;align-items:stretch;box-shadow:0 20px 50px rgba(0,0,0,.4);}
  #menuCard .bigBtn{font-size:20px;padding:12px 40px;}
</style>
</head>
<body>
<div id="phone">
  <div id="hud">
    <button id="gearBtn">⚙</button>
    <div id="lvlWrap">
      <div id="lvlBadge">LEVEL 1</div>
      <div id="movesBanner">Moves: 0</div>
    </div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
  </div>
  <div id="hint"></div>
  <canvas id="fx"></canvas>

  <div id="winOv" class="ov hidden">
    <div class="card">
      <div class="ribbon">CONGRATS!!</div>
      <div class="emoji">😍</div>
      <div class="rewardPill">🪙 +20</div>
      <button class="bigBtn" id="nextBtn">NEXT</button>
    </div>
  </div>

  <div id="loseOv" class="ov hidden">
    <div class="card">
      <div class="ribbon red">OUT OF MOVES</div>
      <div class="emoji">😵</div>
      <button class="bigBtn blue" id="retryBtn">RETRY</button>
    </div>
  </div>

  <div id="menuOv" class="ov hidden">
    <div id="menuCard">
      <button class="bigBtn blue" id="mRestart">RESTART</button>
      <button class="bigBtn" id="mHome" style="background:linear-gradient(#f79e2d,#e0801a);box-shadow:0 6px 0 #b56412;">HOME</button>
      <button class="bigBtn blue" id="mClose" style="background:#8a8ab0;box-shadow:0 6px 0 #6b6b8f;">CLOSE</button>
    </div>
  </div>

  <div id="home" class="ov">
    <div id="homeHexes">⬡⬢⬡</div>
    <h1>HEXA ARROWS<br>WITH MERGE</h1>
    <div class="sub" id="homeLvl">Уровень 1</div>
    <button class="bigBtn" id="playBtn">PLAY</button>
  </div>
</div>

<script>
'use strict';
/* ======== Hexa Arrows v3 — слияние по направлению ========
   Поле закрыто одноуровневыми фишками на 100% (как v1), цвет = направление.
   ТАП — фишка летит по своей стрелке до первого препятствия:
   • путь до края свободен — улетает с поля (цепочка пластинок);
   • первым на пути стоит фишка с ТОЙ ЖЕ стрелкой — задняя летит по лучу
     и собирает ВСЮ цепочку одинаковых стрелок: подбирает каждую и оседает
     стопкой на самой дальней (все клетки позади освобождаются);
   • стоит фишка с другой стрелкой — бамп.
   Стопка ведёт себя как одна фишка: летает и прыгает целиком.
   Любой тап = -1 ход. Слияние цепочки из k фишек убирает с поля k-1 фишку
   за один тап, поэтому минимум ходов ТЕПЕРЬ <= числа фишек — лимиты v1
   стали немного щедрее, оставлены как есть.
   Слияния не экономят ходы, но освобождают клетки и открывают лучи. */

const $=id=>document.getElementById(id);
const stage=$('stage'), cvs=$('game'), ctx=cvs.getContext('2d');
const fxCvs=$('fx'), fxCtx=fxCvs.getContext('2d');

/* ---------- Константы визуала ---------- */
const ROT=-0.10;              // наклон поля, рад (~ -6°)
const SQUASH=0.92;            // лёгкая перспектива по Y
const CELL_GAP=0.94;          // зазор между гексами
const CELL_DEPTH=7;           // толщина серой подложки
const LAYER_H=13;             // толщина одной пластинки стопки
const COLORS=[
  {top:'#45c454',side:'#2f9139'},  // green
  {top:'#f79e2d',side:'#c4761a'},  // orange
  {top:'#3a7cf6',side:'#2456bd'},  // blue
  {top:'#f2404f',side:'#bd2733'},  // red
  {top:'#b04ef5',side:'#8231c2'},  // purple
  {top:'#f8c92e',side:'#cc9c14'},  // yellow
];
/* Направления flat-top гекса: N, NE, SE, S, SW, NW (axial q,r) */
const DIRS=[[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]];
/* Цвет жёстко привязан к направлению (как в референсе и v1):
   ↑ красный, ↗ синий, ↘ зелёный, ↓ жёлтый, ↙ фиолетовый, ↖ оранжевый */
const DIR_COLOR=[3,2,0,5,4,1];

/* ---------- Уровни (полное покрытие, все фишки высоты 1) ---------- */
function hexRegion(R){
  const out=[];
  for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++)
    if(Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=R)out.push([q,r]);
  return out;
}
const CORNERS3=[[3,0],[0,3],[-3,0],[0,-3],[3,-3],[-3,3]];   // углы гекса R=3
const RIM4=[[4,-2],[2,2],[-2,4],[-4,2],[-2,-2],[2,-4]];     // кайма: середины рёбер R=4
const LEVELS=[
  {mask:()=>hexRegion(2),                  dirs:[0,1,3,4],     fac:1.8 },  // 19 ячеек
  {mask:()=>hexRegion(2).concat(CORNERS3), dirs:[0,1,2,3,4],   fac:1.7 },  // 25
  {mask:()=>hexRegion(3).filter(c=>!CORNERS3.some(k=>k[0]===c[0]&&k[1]===c[1])),
                                           dirs:[0,1,2,3,4,5], fac:1.55},  // 31
  {mask:()=>hexRegion(3),                  dirs:[0,1,2,3,4,5], fac:1.4 },  // 37
  {mask:()=>hexRegion(3).concat(RIM4),     dirs:[0,1,2,3,4,5], fac:1.28},  // 43, спайк
];

/* ---------- Seeded RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- Состояние ---------- */
let level=parseInt(localStorage.getItem('hexaArrows3.merge.level')||'1');
if(!(level>=1&&level<=LEVELS.length)) level=1;
let cells=[], cellSet=new Set(), tiles=[], flyers=[], mergeFx=[], moves=0, S=34;
let playing=false, winPending=false, shake=0;
let W=0,H=0,DPR=1, cx=0, cy=0;

const key=(q,r)=>q+','+r;

/* ---------- Генерация уровня (полное покрытие, гарантированно решаемая) ----------
   Очистка с края, как в v1: порядок снятия = решение. Слияние решаемость
   сохраняет: стопка садится на клетку передней фишки с её же направлением,
   т.е. поле всегда = подмножество исходного расклада, а исходный порядок
   снятия для подмножества валиден. */
function buildLevel(n){
  const cfg=LEVELS[n-1];
  cells=cfg.mask(); cellSet.clear();
  for(const c of cells)cellSet.add(key(c[0],c[1]));
  const rng=mulberry32(n*7919+1);
  const rem=new Set(cells.map(c=>key(c[0],c[1])));
  const pool=cells.slice(), res=[];
  while(pool.length){
    const cand=[];
    for(const c of pool){
      const dirs=[];
      for(const d of cfg.dirs){
        let q=c[0]+DIRS[d][0], r=c[1]+DIRS[d][1], free=true;
        while(cellSet.has(key(q,r))){
          if(rem.has(key(q,r))){free=false;break;}
          q+=DIRS[d][0]; r+=DIRS[d][1];
        }
        if(free)dirs.push(d);
      }
      if(dirs.length)cand.push([c,dirs]);
    }
    const [c,dirs]=cand[(rng()*cand.length)|0];
    rem.delete(key(c[0],c[1]));
    pool.splice(pool.indexOf(c),1);
    const dir=dirs[(rng()*dirs.length)|0];
    res.push({q:c[0],r:c[1],dir,
      color:DIR_COLOR[dir],           // цвет = направление
      layers:1, pop:0});
  }
  tiles=res;
  flyers=[]; mergeFx=[];
  // минимум ходов = число фишек (каждый удачный тап убирает с поля ровно одну)
  moves=Math.ceil(tiles.length*cfg.fac);
  winPending=false; playing=true;
  tiles.forEach((t,i)=>t.pop=-i*0.03);   // стаггер появления
  $('lvlBadge').textContent='LEVEL '+n;
  $('hint').textContent=n===1?'Тап — фишка летит по стрелке: путь свободен — улетает, впереди такие же стрелки — соберёт всю линию в одну стопку.':'';
  updateMoves();
  layout();
}
function updateMoves(){$('movesBanner').textContent='Moves: '+moves;}

/* ---------- Геометрия ---------- */
function hexCenter(q,r){
  let x=1.5*S*q, y=Math.sqrt(3)*S*(r+q/2);
  const rx=x*Math.cos(ROT)-y*Math.sin(ROT), ry=x*Math.sin(ROT)+y*Math.cos(ROT);
  return [cx+rx, cy+ry*SQUASH];
}
function hexVerts(x,y,s){
  const v=[];
  for(let i=0;i<6;i++){
    const a=Math.PI/3*i;
    let px=Math.cos(a)*s, py=Math.sin(a)*s;
    const rx=px*Math.cos(ROT)-py*Math.sin(ROT), ry=px*Math.sin(ROT)+py*Math.cos(ROT);
    v.push([x+rx,y+ry*SQUASH]);
  }
  return v;
}
function dirVec(d){
  const [ax,ay]=hexCenter(0,0), [bx,by]=hexCenter(DIRS[d][0],DIRS[d][1]);
  const dx=bx-ax, dy=by-ay, l=Math.hypot(dx,dy);
  return [dx/l,dy/l];
}
function pointInPoly(px,py,v){
  let inside=false;
  for(let i=0,j=v.length-1;i<v.length;j=i++){
    if((v[i][1]>py)!==(v[j][1]>py) &&
       px<(v[j][0]-v[i][0])*(py-v[i][1])/(v[j][1]-v[i][1])+v[i][0]) inside=!inside;
  }
  return inside;
}

/* ---------- Рендер ---------- */
function drawHexPrism(x,y,s,depth,topCol,sideCol){
  const v=hexVerts(x,y,s);
  ctx.fillStyle=sideCol;
  for(let i=0;i<6;i++){
    const a=v[i], b=v[(i+1)%6];
    if((a[1]+b[1])/2>=y-0.5){
      ctx.beginPath();
      ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
      ctx.lineTo(b[0],b[1]+depth);ctx.lineTo(a[0],a[1]+depth);
      ctx.closePath();ctx.fill();
    }
  }
  ctx.beginPath();
  v.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.closePath();
  ctx.fillStyle=topCol;ctx.fill();
  return v;
}
function drawArrow(x,y,ang,s,col,shadow){
  ctx.save();
  ctx.translate(x,y);ctx.scale(1,SQUASH);ctx.rotate(ang);
  ctx.strokeStyle=col;ctx.fillStyle=col;
  ctx.lineWidth=s*0.24;ctx.lineCap='round';ctx.lineJoin='round';
  if(shadow){ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowOffsetY=s*0.09/SQUASH;ctx.shadowBlur=1;}
  ctx.beginPath();ctx.moveTo(-s*0.34,0);ctx.lineTo(s*0.30,0);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(s*0.14,-s*0.30);ctx.lineTo(s*0.48,0);ctx.lineTo(s*0.14,s*0.30);
  ctx.lineTo(s*0.26,0);ctx.closePath();ctx.fill();
  ctx.restore();
}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,Math.max(0,((n>>16)&255)*f))|0,
        g=Math.min(255,Math.max(0,((n>>8)&255)*f))|0,
        b=Math.min(255,Math.max(0,(n&255)*f))|0;
  return `rgb(${r},${g},${b})`;
}

let sparkles=[];
function layout(){
  const rect=stage.getBoundingClientRect();
  DPR=window.devicePixelRatio||1;
  W=rect.width;H=rect.height;
  cvs.width=W*DPR;cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const phone=$('phone').getBoundingClientRect();
  fxCvs.width=phone.width*DPR;fxCvs.height=phone.height*DPR;
  fxCtx.setTransform(DPR,0,0,DPR,0,0);
  // масштаб от фактических габаритов маски
  let exq=1.5, ey=Math.sqrt(3);
  for(const [q,r] of cells){
    exq=Math.max(exq,Math.abs(1.5*q));
    ey=Math.max(ey,Math.abs(Math.sqrt(3)*(r+q/2)));
  }
  S=Math.min((W-46)/(2*exq+2), (H-60)/(2*ey+2.8));
  cx=W/2; cy=H/2-S*0.4;
  const rng=mulberry32(42);
  sparkles=[];
  for(let i=0;i<14;i++){
    const c=cells[(rng()*cells.length)|0];
    if(!c)break;
    const [x,y]=hexCenter(c[0],c[1]);
    const a=rng()*Math.PI*2, rr=S*(0.8+rng()*0.25);
    sparkles.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr*SQUASH,1+rng()*1.6]);
  }
}
window.addEventListener('resize',layout);

function draw(dt){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0){shake-=dt;ctx.translate((Math.random()-0.5)*4,(Math.random()-0.5)*4);}
  // подложка
  for(const [q,r] of cells)
    drawHexPrism(...hexCenter(q,r),S*CELL_GAP,CELL_DEPTH,'#b6b5c9','#8f8ea8');
  ctx.fillStyle='rgba(255,255,255,.8)';
  for(const [x,y,r] of sparkles){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
  // фишки: сортируем по экранному Y, чтобы нижние перекрывали верхние
  const sorted=tiles.slice().sort((a,b)=>hexCenter(a.q,a.r)[1]-hexCenter(b.q,b.r)[1]);
  for(const t of sorted){
    t.pop=Math.min(1,t.pop+dt*3.2);
    if(t.pop<=0)continue;
    const sc=t.pop<1?(0.5+0.5*(1-Math.pow(1-t.pop,3))):1;
    const [x0,y0]=hexCenter(t.q,t.r);
    const x=x0+(t.ox||0), y=y0+(t.oy||0);
    const s=S*CELL_GAP*0.99*sc;
    const vis=Math.max(1,t.layers-(t.hideH||0));  // прилетающие пластинки дорисует mergeFx
    let topV=null;
    for(let l=0;l<vis;l++){
      const ly=y-CELL_DEPTH-l*LAYER_H*sc;
      const c=COLORS[t.color];
      topV=drawHexPrism(x,ly,s,LAYER_H*sc, l===vis-1?c.top:shade(c.top,0.93), c.side);
      if(l<vis-1){ // шов между пластинками
        ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1;
        ctx.beginPath();
        topV.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
        ctx.closePath();ctx.stroke();
      }
    }
    const [vx,vy]=dirVec(t.dir);
    drawArrow(x,y-CELL_DEPTH-(vis-1)*LAYER_H*sc,Math.atan2(vy/SQUASH,vx),s,'#fff',true);
    t.topV=topV; t.topY=y-CELL_DEPTH-(vis-1)*LAYER_H*sc;
  }
  // прыжок стопки на фишку впереди: по клеткам луча, с подскоком на каждой
  const MSTEP=0.1;
  for(let i=mergeFx.length-1;i>=0;i--){
    const m=mergeFx[i];
    m.t+=dt;
    const prog=m.t/MSTEP;
    // стопки цепочки, мимо которых уже пролетели, вливаются в летящую
    while(m.pickups.length&&prog>=m.pickups[0].idx){m.h+=m.pickups.shift().h;}
    if(prog>=m.path.length-1||!tiles.includes(m.dst)){
      if(tiles.includes(m.dst)){m.dst.hideH=Math.max(0,(m.dst.hideH||0)-m.h);m.dst.pop=0.65;}
      mergeFx.splice(i,1);continue;
    }
    // ждущие стопки цепочки рисуем на месте (из tiles они уже удалены)
    const c=COLORS[m.color];
    const [avx,avy]=dirVec(m.dir);
    for(const p of m.pickups){
      const [px,py]=m.path[p.idx];
      for(let l=0;l<p.h;l++)
        drawHexPrism(px,py-CELL_DEPTH-l*LAYER_H,S*CELL_GAP*0.99,LAYER_H,l===p.h-1?c.top:shade(c.top,0.93),c.side);
      drawArrow(px,py-CELL_DEPTH-(p.h-1)*LAYER_H,Math.atan2(avy/SQUASH,avx),S*CELL_GAP*0.99,'#fff',true);
    }
    const idx=prog|0, fr=prog-idx;
    const A=m.path[idx], B=m.path[idx+1];
    const x=A[0]+(B[0]-A[0])*fr, y=A[1]+(B[1]-A[1])*fr;
    const hop=Math.sin(fr*Math.PI)*6;
    // подъём на вершину: на последнем шаге — на стопку-цель, по пути — на очередную стопку цепочки
    const landVis=m.dst.layers-(m.dst.hideH||0);
    const pick=m.pickups.length&&m.pickups[0].idx===idx+1?m.pickups[0].h:0;
    const climb=idx===m.path.length-2?fr*landVis*LAYER_H:fr*pick*LAYER_H;
    const base=y-CELL_DEPTH-hop-climb;
    for(let l=0;l<m.h;l++)
      drawHexPrism(x,base-l*LAYER_H,S*CELL_GAP*0.99,LAYER_H,l===m.h-1?c.top:shade(c.top,0.93),c.side);
    drawArrow(x,base-(m.h-1)*LAYER_H,Math.atan2(avy/SQUASH,avx),S*CELL_GAP*0.99,'#fff',true);
  }
  // улетающие: стопка из h пластинок-третей, цепочкой по клеткам на вылет,
  // за краем поля — свободный кувырок (анимация «пересыпания» из референса)
  const PH=LAYER_H/3, STEP=0.11;
  for(let i=flyers.length-1;i>=0;i--){
    const f=flyers[i];
    f.t+=dt;
    const lead=f.t/STEP;
    let chainActive=false;
    for(let p=f.n-1;p>=0;p--){
      if(f.gone[p])continue;
      const prog=Math.max(0,lead-p);            // пластинка p идёт на p клеток позади
      if(prog>=f.path.length-1){
        const A=f.path[f.path.length-2],B=f.path[f.path.length-1];
        const dx=B[0]-A[0],dy=B[1]-A[1],l=Math.hypot(dx,dy)||1;
        const spd=l/STEP;
        f.parts.push({x:B[0],y:B[1]-CELL_DEPTH,
          vx:dx/l*spd*(0.9+Math.random()*0.3)+(Math.random()-0.5)*120,
          vy:dy/l*spd*(0.9+Math.random()*0.3)+(Math.random()-0.5)*120,
          rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*9,
          flip:Math.random()*Math.PI, vf:5+Math.random()*6});
        f.gone[p]=true;continue;
      }
      chainActive=true;
      const idx=prog|0, fr=prog-idx;
      const A=f.path[idx],B=f.path[idx+1];
      const x=A[0]+(B[0]-A[0])*fr, y=A[1]+(B[1]-A[1])*fr;
      const hop=Math.sin(fr*Math.PI)*4;                       // подскок между клетками
      const lift=(f.n-1-p)*PH*Math.max(0,1-prog);             // расстопка на первом шаге
      const c=COLORS[f.color];
      drawHexPrism(x,y-CELL_DEPTH-hop-lift,S*CELL_GAP,PH,c.top,c.side);
    }
    {
      let alive=false;
      for(const p of f.parts){
        p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.flip+=p.vf*dt;
        if(p.x>-S*2&&p.x<W+S*2&&p.y>-S*2&&p.y<H+S*2){
          alive=true;
          ctx.save();
          ctx.translate(p.x,p.y);ctx.rotate(p.rot);
          ctx.scale(1,Math.max(0.14,Math.abs(Math.cos(p.flip))));
          const c=COLORS[f.color];
          ctx.fillStyle=shade(c.side,0.95);
          ctx.beginPath();
          for(let i=0;i<6;i++){const a=Math.PI/3*i;i?ctx.lineTo(Math.cos(a)*S,Math.sin(a)*S):ctx.moveTo(S,0);}
          ctx.closePath();ctx.fill();
          ctx.fillStyle=c.top;
          ctx.beginPath();
          for(let i=0;i<6;i++){const a=Math.PI/3*i;i?ctx.lineTo(Math.cos(a)*S*0.92,Math.sin(a)*S*0.92):ctx.moveTo(S*0.92,0);}
          ctx.closePath();ctx.fill();
          ctx.restore();
        }
      }
      if(!chainActive&&!alive)flyers.splice(i,1);
    }
  }
  ctx.restore();
}

/* ---------- Логика ---------- */
function firstBlocker(t){
  let q=t.q+DIRS[t.dir][0], r=t.r+DIRS[t.dir][1];
  while(cellSet.has(key(q,r))){
    const o=tiles.find(o=>o!==t&&o.q===q&&o.r===r);
    if(o)return o;
    q+=DIRS[t.dir][0]; r+=DIRS[t.dir][1];
  }
  return null;   // путь до края свободен
}
function hitAt(px,py){
  // фронтальные (ниже по экрану) в приоритете
  const sorted=tiles.slice().sort((a,b)=>hexCenter(b.q,b.r)[1]-hexCenter(a.q,a.r)[1]);
  for(const t of sorted){
    if(t.topV&&pointInPoly(px,py,t.topV))return t;
    const [x,y]=hexCenter(t.q,t.r);
    if(Math.abs(px-x)<S*0.8&&py>t.topY-S*0.5&&py<y+CELL_DEPTH)return t;
  }
  return null;
}
function doMerge(src,chain){
  // src летит по лучу, подбирая ВСЕ стопки цепочки, оседает на последней.
  // Логика мгновенная (dst сразу «толстеет»), прыжок с подбором — только визуал.
  const dst=chain[chain.length-1];
  tiles.splice(tiles.indexOf(src),1);
  const path=[hexCenter(src.q,src.r)];
  const pickups=[];   // промежуточные стопки цепочки: {idx клетки на пути, h слоёв}
  let q=src.q+DIRS[src.dir][0], r=src.r+DIRS[src.dir][1];
  while(!(q===dst.q&&r===dst.r)){
    const mid=chain.find(t=>t.q===q&&t.r===r);
    if(mid){pickups.push({idx:path.length,h:mid.layers});tiles.splice(tiles.indexOf(mid),1);}
    path.push(hexCenter(q,r));
    q+=DIRS[src.dir][0];r+=DIRS[src.dir][1];
  }
  path.push(hexCenter(dst.q,dst.r));
  const total=src.layers+pickups.reduce((s,p)=>s+p.h,0);
  dst.layers+=total;
  dst.hideH=(dst.hideH||0)+total;
  mergeFx.push({path,t:0,color:src.color,h:src.layers,dir:src.dir,dst,pickups});
}
function tapAt(px,py){
  if(!playing)return;
  const hit=hitAt(px,py);
  if(!hit)return;
  moves--;updateMoves();
  const blk=firstBlocker(hit);
  if(!blk){
    // путь свободен — вся стопка улетает с поля
    tiles.splice(tiles.indexOf(hit),1);
    const path=[hexCenter(hit.q,hit.r)];
    let q=hit.q+DIRS[hit.dir][0], r=hit.r+DIRS[hit.dir][1];
    while(cellSet.has(key(q,r))){path.push(hexCenter(q,r));q+=DIRS[hit.dir][0];r+=DIRS[hit.dir][1];}
    for(let i=0;i<3;i++){path.push(hexCenter(q,r));q+=DIRS[hit.dir][0];r+=DIRS[hit.dir][1];}
    const n=3*hit.layers;   // каждая пластинка стопки = 3 тонких «трети», как в референсе
    flyers.push({path,t:0,color:hit.color,n,gone:new Array(n).fill(false),parts:[]});
    if(!tiles.length){
      playing=false;winPending=true;
      setTimeout(win,1000);                 // пауза ~1с перед победой
      return;
    }
  }else if(blk.dir===hit.dir){
    // такая же стрелка впереди — собрать ВСЮ цепочку одинаковых по лучу:
    // задняя прыгает по линии, подбирая каждую, и оседает на самой дальней
    const chain=[blk];
    let cur=blk,nxt;
    while((nxt=firstBlocker(cur))&&nxt.dir===hit.dir){chain.push(nxt);cur=nxt;}
    doMerge(hit,chain);
  }else{
    const [vx,vy]=dirVec(hit.dir);
    bump(hit,vx,vy);
    shake=0.12;
  }
  if(moves<=0&&tiles.length){playing=false;lose();}
}
function bump(t,vx,vy){
  const amp=S*0.42;let tt=0;
  const iv=setInterval(()=>{
    tt+=1/60;
    const k=tt/0.28;
    if(k>=1){t.ox=0;t.oy=0;clearInterval(iv);return;}
    const e=Math.sin(k*Math.PI)*(1-k*0.3);
    t.ox=vx*amp*e;t.oy=vy*amp*e;
  },1000/60);
}

cvs.addEventListener('pointerdown',e=>{
  const r=cvs.getBoundingClientRect();
  tapAt(e.clientX-r.left,e.clientY-r.top);
});

/* ---------- Конфетти ---------- */
let confetti=[],confettiOn=false;
function startConfetti(){
  confetti=[];confettiOn=true;
  const w=fxCvs.width/DPR,h=fxCvs.height/DPR;
  const cols=['#ff5964','#f8c92e','#3a7cf6','#45c454','#ff8ac2','#59e0e8','#b04ef5','#ff9b2e'];
  for(let i=0;i<130;i++)confetti.push({
    x:Math.random()*w,y:-Math.random()*h*0.8,
    vy:110+Math.random()*160,ph:Math.random()*7,om:2+Math.random()*3,
    s:4+Math.random()*6,c:cols[(Math.random()*cols.length)|0],r:Math.random()*7});
}
function stopConfetti(){confettiOn=false;fxCtx.clearRect(0,0,fxCvs.width,fxCvs.height);}
function drawConfetti(dt){
  if(!confettiOn)return;
  const w=fxCvs.width/DPR,h=fxCvs.height/DPR;
  fxCtx.clearRect(0,0,w,h);
  for(const p of confetti){
    p.y+=p.vy*dt;p.ph+=p.om*dt;p.r+=3*dt;
    if(p.y>h+20){p.y=-20;p.x=Math.random()*w;}
    fxCtx.save();
    fxCtx.translate(p.x+Math.sin(p.ph)*14,p.y);
    fxCtx.rotate(p.r);fxCtx.scale(1,Math.abs(Math.cos(p.ph)));
    fxCtx.fillStyle=p.c;
    fxCtx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);
    fxCtx.restore();
  }
}

/* ---------- Экраны ---------- */
function win(){
  startConfetti();
  $('winOv').classList.remove('hidden');
}
function lose(){ $('loseOv').classList.remove('hidden'); }   // проигрыш — сразу, без пауз
$('nextBtn').onclick=()=>{
  stopConfetti();$('winOv').classList.add('hidden');
  level=level%LEVELS.length+1;
  localStorage.setItem('hexaArrows3.merge.level',level);
  buildLevel(level);
};
$('retryBtn').onclick=()=>{$('loseOv').classList.add('hidden');buildLevel(level);};
$('playBtn').onclick=()=>{$('home').classList.add('hidden');buildLevel(level);};
$('gearBtn').onclick=()=>{if(playing)$('menuOv').classList.remove('hidden');};
$('mClose').onclick=()=>$('menuOv').classList.add('hidden');
$('mRestart').onclick=()=>{$('menuOv').classList.add('hidden');buildLevel(level);};
$('mHome').onclick=()=>{$('menuOv').classList.add('hidden');playing=false;$('home').classList.remove('hidden');
  $('homeLvl').textContent='Уровень '+level;};
$('homeLvl').textContent='Уровень '+level;

/* ---------- Цикл ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  draw(dt);drawConfetti(dt);
  requestAnimationFrame(loop);
}
buildLevel(level);       // строим сразу (скрыто под home), чтобы layout был готов
playing=false;           // играть можно после PLAY
requestAnimationFrame(loop);
</script>
