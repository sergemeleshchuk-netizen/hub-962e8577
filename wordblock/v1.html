<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Словоблок v1</title>
<link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%)}
#phone{position:relative;overflow:hidden;background:#3b2414}
@media (max-aspect-ratio:1/1){#phone{width:100vw;height:100dvh}}
@media (min-aspect-ratio:1/1){#phone{height:96dvh;aspect-ratio:9/16;width:auto;border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15}}
#phone iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
</style></head><body>
<div id="phone"><iframe src="v1-game.html" title="Словоблок v1" allow="autoplay; vibrate"></iframe></div>
</body></html>
