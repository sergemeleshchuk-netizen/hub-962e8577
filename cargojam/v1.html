<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cargo Jam — v1</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:linear-gradient(180deg,#cde8b5 0%,#bfe0a4 42%,#f3e3c2 42%,#eed7ac 100%);}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }

  #hud{width:100%;padding:10px 14px;z-index:6;display:flex;align-items:center;gap:10px;}
  .hbtn{width:40px;height:40px;border:none;border-radius:13px;background:#fffdf4;color:#6b4d2a;
    font-size:19px;box-shadow:0 3px 0 #c9b28c,0 6px 14px #6b4d2a30;cursor:pointer;flex:0 0 auto;}
  .hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9b28c;}
  #lvlname{flex:1;text-align:center;font-weight:800;font-size:18px;color:#4c5b2f;letter-spacing:.4px;}
  #prog{flex:0 0 auto;background:#fffdf4;border-radius:12px;padding:7px 12px;font-weight:800;
    color:#4c5b2f;font-size:14px;box-shadow:0 3px 0 #c9b28c;min-width:64px;text-align:center;}

  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  #board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center;
         width:520px;height:846px;}

  /* --- верх: рельсы + поезд --- */
  #trackzone{position:absolute;left:0;top:0;width:520px;height:300px;}
  #tracksvg{position:absolute;inset:0;overflow:visible;}
  .car{position:absolute;width:30px;height:20px;margin:-10px 0 0 -15px;border-radius:5px;
    box-shadow:inset 0 2px 0 #ffffff66,inset 0 -3px 0 #00000033,0 3px 5px #00000030;}
  .car .wh{position:absolute;bottom:-3px;width:6px;height:6px;border-radius:50%;background:#3a3a44;}
  #loco{position:absolute;width:40px;height:28px;margin:-14px 0 0 -20px;font-size:26px;line-height:28px;
    text-align:center;filter:drop-shadow(0 3px 3px #00000040);}
  #cow{position:absolute;font-size:26px;margin:-14px 0 0 -13px;filter:drop-shadow(0 2px 2px #00000040);}
  .car.gone{transition:transform .35s,opacity .35s;transform:scale(.2) translateY(-40px)!important;opacity:0;}

  /* --- заказы --- */
  #orders{position:absolute;left:0;top:302px;width:520px;height:96px;display:flex;gap:10px;
    align-items:center;justify-content:center;}
  .ord{width:150px;height:84px;border-radius:16px;background:#fffdf4;box-shadow:0 4px 0 #c9b28c,0 8px 16px #6b4d2a25;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    transition:transform .3s,opacity .3s;}
  .ord .chip{width:44px;height:28px;border-radius:6px;box-shadow:inset 0 2px 0 #ffffff66,inset 0 -3px 0 #00000033;}
  .ord .cnt{font-weight:800;font-size:17px;color:#5a4326;}
  .ord.done{transform:scale(1.12);}
  .ord.out{transform:translateY(-30px) scale(.6);opacity:0;}
  .ord.nextcard{width:104px;height:66px;opacity:.55;filter:saturate(.55);}
  .ord .lbl{font-size:10px;font-weight:700;color:#b09a72;letter-spacing:.6px;}

  /* --- склад ящиков --- */
  #yard{position:absolute;left:0;top:408px;width:520px;height:438px;}
  #grid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
  .tile{position:absolute;border-radius:11px;cursor:pointer;
    box-shadow:inset 0 3px 0 #ffffff55,inset 0 -5px 0 #00000030,0 4px 7px #00000035;
    display:flex;align-items:center;justify-content:center;transition:transform .1s;}
  .tile svg{width:62%;height:62%;filter:drop-shadow(0 1.5px 0 #00000040);}
  .tile:active{transform:scale(.94);}
  .tile.deny{animation:deny .3s;}
  @keyframes deny{0%,100%{transform:translate(0)}30%{transform:translate(-4px,0)}70%{transform:translate(4px,0)}}
  .flytile{position:absolute;z-index:40;pointer-events:none;border-radius:11px;
    box-shadow:inset 0 3px 0 #ffffff55,inset 0 -5px 0 #00000030,0 6px 12px #00000045;
    display:flex;align-items:center;justify-content:center;
    transition:left .42s cubic-bezier(.4,.7,.4,1),top .42s cubic-bezier(.55,-.15,.6,1),width .42s,height .42s;}
  .flytile svg{width:62%;height:62%;}

  /* --- оверлеи --- */
  .ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:#2c3a1bb0;opacity:0;pointer-events:none;transition:opacity .3s;}
  .ov.show{opacity:1;pointer-events:auto;}
  .card{background:#fffdf4;border-radius:26px;padding:30px 34px;text-align:center;
    box-shadow:0 20px 50px #00000066;transform:scale(.8);transition:transform .3s;max-width:82%;}
  .ov.show .card{transform:scale(1);}
  .card h2{margin:0 0 6px;font-size:26px;color:#4c5b2f;}
  .card p{margin:0 0 18px;color:#8a7a54;font-weight:600;}
  .cbtn{border:none;border-radius:16px;padding:14px 30px;font-size:17px;font-weight:800;cursor:pointer;
    background:linear-gradient(180deg,#8fc94e,#63a832);color:#fff;
    box-shadow:0 4px 0 #47791f,0 8px 18px #63a83255;margin:0 5px;}
  .cbtn.alt{background:linear-gradient(180deg,#f7fafc,#e8edf2);color:#6b4d2a;box-shadow:0 4px 0 #c9b8a5;}
  .cbtn:active{transform:translateY(2px);}

  #home{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:8px;background:linear-gradient(180deg,#cde8b5,#eed7ac);}
  #home.hide{display:none;}
  #home h1{margin:0;font-size:42px;color:#4c5b2f;text-shadow:0 3px 0 #ffffffaa;}
  #home .tag{color:#7d8a53;font-weight:700;margin-bottom:20px;text-align:center;padding:0 30px;}
  .lvlbtn{width:230px;border:none;border-radius:18px;font-size:18px;font-weight:800;
    cursor:pointer;background:#fffdf4;color:#5a4326;box-shadow:0 4px 0 #c9b28c,0 8px 16px #6b4d2a25;
    display:flex;align-items:center;justify-content:space-between;padding:15px 22px;margin:5px 0;}
  .lvlbtn:disabled{opacity:.45;cursor:default;}
  .lvlbtn:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 #c9b28c;}
  .conf{position:absolute;width:10px;height:4px;border-radius:2px;z-index:25;pointer-events:none;}
</style>
</head>
<body>
<div id="phone">
  <div id="home">
    <div style="font-size:70px;line-height:1;margin-bottom:6px;">🚂</div>
    <h1>Cargo Jam</h1>
    <div class="tag">разгрузи состав по заказам,<br>пока поезд не доехал до коровы</div>
    <div id="lvlbtns"></div>
  </div>

  <div id="hud">
    <button class="hbtn" id="btnHome">🏠</button>
    <div id="lvlname">Level 1</div>
    <div id="prog">0%</div>
    <button class="hbtn" id="btnRestart">↺</button>
  </div>
  <div id="stage"><div id="board">
    <div id="trackzone"><svg id="tracksvg"></svg></div>
    <div id="orders"></div>
    <div id="yard"><div id="grid"></div></div>
  </div></div>

  <div class="ov" id="ovWin"><div class="card">
    <h2>Разгружено! 🎉</h2><p id="winTxt">Уровень пройден</p>
    <button class="cbtn" id="btnNext">Дальше</button>
  </div></div>
  <div class="ov" id="ovLose"><div class="card">
    <h2 id="loseTitle">Поезд доехал 🐄</h2><p id="loseTxt">Корова осталась недовольна</p>
    <button class="cbtn alt" id="btnLoseHome">🏠</button>
    <button class="cbtn" id="btnRetry">Ещё раз</button>
  </div></div>
</div>

<script>
/* ================= Cargo Jam v1 =================
   Механика Wool Crush (wool sort «конвейер»), сеттинг: грузовой поезд.
   3 зоны: состав из цветных секций ползёт по серпантину к корове (таймер);
   заказы «цвет ×N» (2 активных + превью); склад ящиков со стрелками —
   тап: ящик вылетает по стрелке, если путь свободен, и идёт в заказ
   своего цвета. Полный заказ отцепляет свою секцию, состав откатывается.
   Победа: все вагоны разгружены. Проигрыш: поезд доехал / тупик на складе.
================================================== */
const COLORS=[
  {name:'red',   c:'#e2574c'},
  {name:'blue',  c:'#4a90e2'},
  {name:'green', c:'#53b95e'},
  {name:'yellow',c:'#eec33f'},
  {name:'purple',c:'#9b6bd4'},
  {name:'orange',c:'#ef8a3c'},
];
const CAR_GAP=26, PUSHBACK=45, TILE=68, TGAP=8;
/* уровни: cols×rows склада = число вагонов; budgetPerCar — секунд пути на вагон */
const LEVELS=[
  {colors:2, cols:3, rows:3, budget:3.4},
  {colors:3, cols:4, rows:3, budget:2.8},
  {colors:4, cols:4, rows:4, budget:2.3},
  {colors:5, cols:5, rows:4, budget:1.9},
  {colors:6, cols:6, rows:5, budget:1.0},
];
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]]; // up right down left
const ARROWS=['M12 3 L20 13 L15 13 L15 21 L9 21 L9 13 L4 13 Z', // up (path в 24x24)
  'M21 12 L11 20 L11 15 L3 15 L3 9 L11 9 L11 4 Z',
  'M12 21 L4 11 L9 11 L9 3 L15 3 L15 11 L20 11 Z',
  'M3 12 L13 4 L13 9 L21 9 L21 15 L13 15 L13 20 Z'];

let cur=0, over=false, genOK=false;
let sections=[], train=[], tiles=[], orders=[], ordIdx=0;
let trackPts=[], trackLen=0, headD=0, speed=0, totalCars=0, removedCars=0;
let raf=null, lastT=0, flightsN=0;
let unlocked=+(localStorage.getItem('cargojam_v1')||1);
function rng(seed){ let s=seed>>>0; return ()=>((s=Math.imul(s^s>>>15,s|1)^s+Math.imul(s^s>>>7,s|61))>>>0)/4294967296; }

/* ---------- трек: серпантин 4 ряда ---------- */
function buildTrack(){
  trackPts=[];
  const pts=[];
  const seg=(a,b,n)=>{for(let i=0;i<=n;i++)pts.push([a[0]+(b[0]-a[0])*i/n,a[1]+(b[1]-a[1])*i/n]);};
  const arc=(cx,cy,r,a0,a1,n)=>{for(let i=1;i<n;i++){const a=a0+(a1-a0)*i/n;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}};
  seg([38,46],[447,46],40); arc(447,81,35,-Math.PI/2,Math.PI/2,14);
  seg([447,116],[73,116],40); arc(73,151,35,-Math.PI/2,-Math.PI*1.5,14);
  seg([73,186],[447,186],40); arc(447,221,35,-Math.PI/2,Math.PI/2,14);
  seg([447,256],[250,256],20);
  trackPts=pts; trackLen=0;
  for(let i=1;i<pts.length;i++) trackLen+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  // рисуем
  const svg=document.getElementById('tracksvg');
  const d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
  svg.setAttribute('viewBox','0 0 520 300');
  svg.innerHTML=`<path d="${d}" fill="none" stroke="#c9a06a" stroke-width="22" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="#8a6a3e" stroke-width="3" stroke-dasharray="3 14" opacity=".7"/>
    <path d="${d}" fill="none" stroke="#fff8" stroke-width="1.5" stroke-dasharray="12 10" />`;
}
function posAt(d){ // точка и угол на дистанции d
  d=Math.max(0,Math.min(d,trackLen-0.01));
  let acc=0;
  for(let i=1;i<trackPts.length;i++){
    const L=Math.hypot(trackPts[i][0]-trackPts[i-1][0],trackPts[i][1]-trackPts[i-1][1]);
    if(acc+L>=d){
      const t=(d-acc)/L;
      return {x:trackPts[i-1][0]+(trackPts[i][0]-trackPts[i-1][0])*t,
              y:trackPts[i-1][1]+(trackPts[i][1]-trackPts[i-1][1])*t,
              a:Math.atan2(trackPts[i][1]-trackPts[i-1][1],trackPts[i][0]-trackPts[i-1][0])};
    }
    acc+=L;
  }
  const p=trackPts[trackPts.length-1];
  return {x:p[0],y:p[1],a:0};
}

/* ---------- генерация уровня ---------- */
function makeSections(L,rand){
  const total=L.cols*L.rows;
  // режем total на секции 2-4, циклично раздаём цвета без соседних повторов
  for(let t=0;t<60;t++){
    const lens=[]; let rest=total;
    while(rest>0){
      let l=2+((rand()*3)|0); if(l>rest)l=rest;
      if(rest-l===1){l=Math.min(l+1,rest);}
      lens.push(l); rest-=l;
    }
    if(lens.length<L.colors) continue;
    const secs=[]; let prev=-1, pool=[];
    let okAll=true;
    for(const l of lens){
      if(!pool.length){ pool=[...Array(L.colors).keys()]; for(let i=pool.length-1;i>0;i--){const j=(rand()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]];} }
      let pi=pool.findIndex(c=>c!==prev);
      if(pi<0){ okAll=false; break; }
      const c=pool.splice(pi,1)[0];
      secs.push({color:c,len:l}); prev=c;
    }
    if(okAll) return secs;
  }
  return null;
}
function isFreeIn(t,set){
  const [dx,dy]=DIRS[t.dir];
  for(const o of set){
    if(o===t||o.dead) continue;
    if(dx!==0 && o.gy===t.gy && Math.sign(o.gx-t.gx)===dx) return false;
    if(dy!==0 && o.gx===t.gx && Math.sign(o.gy-t.gy)===dy) return false;
  }
  return true;
}
function generate(levelIdx){
  /* Реверс-генерация: строим порядок разбора склада конструктивно.
     На каждом шаге берём клетку, у которой есть направление с уже
     очищенным лучом, даём ей цвет одного из двух активных заказов и
     стрелку в это направление. Итог гарантированно решаем. */
  const L=LEVELS[levelIdx];
  genOK=false;
  for(let seed=1;seed<=60;seed++){
    const rand=rng(levelIdx*7919+seed*104729);
    const secs=makeSections(L,rand);
    if(!secs) continue;
    const cells=[];
    for(let gy=0;gy<L.rows;gy++)for(let gx=0;gx<L.cols;gx++)
      cells.push({gx,gy,color:-1,dir:-1,dead:false});
    const freeDirs=(c)=>{
      const out=[];
      for(let d=0;d<4;d++){
        const [dx,dy]=DIRS[d];
        let clear=true;
        for(const o of cells){
          if(o===c||o.color!==-1) continue; // уже "снятые" (назначенные) не мешают
          if(dx!==0 && o.gy===c.gy && Math.sign(o.gx-c.gx)===dx){clear=false;break;}
          if(dy!==0 && o.gx===c.gx && Math.sign(o.gy-c.gy)===dy){clear=false;break;}
        }
        if(clear) out.push(d);
      }
      return out;
    };
    const need=secs.map(s=>({color:s.color,left:s.len}));
    let ok=true;
    for(let step=0;step<cells.length;step++){
      const act=[]; for(let i=0;i<need.length&&act.length<2;i++) if(need[i].left>0) act.push(need[i]);
      const peel=cells.filter(c=>c.color===-1 && freeDirs(c).length>0);
      if(!peel.length||!act.length){ ok=false; break; }
      const cell=peel[(rand()*peel.length)|0];
      const ord=act[(rand()*act.length)|0];
      const fd=freeDirs(cell);
      cell.color=ord.color; cell.dir=fd[(rand()*fd.length)|0];
      ord.left--;
    }
    if(!ok || need.some(n=>n.left>0)) continue;
    sections=secs; tiles=cells; genOK=true;
    return true;
  }
  console.error('generation failed', levelIdx);
  return false;
}

/* ---------- построение сцены ---------- */
const board=document.getElementById('board'), gridEl=document.getElementById('grid'),
      ordersEl=document.getElementById('orders'), tz=document.getElementById('trackzone');
function build(){
  const L=LEVELS[cur];
  // поезд: вагоны от головы (секция 0 сразу за локомотивом)
  train=[];
  sections.forEach((s,si)=>{for(let i=0;i<s.len;i++)train.push({color:s.color,sec:si,el:null});});
  totalCars=train.length; removedCars=0;
  tz.querySelectorAll('.car,#loco,#cow').forEach(e=>e.remove());
  const cow=document.createElement('div'); cow.id='cow'; cow.textContent='🐄';
  const cp=posAt(trackLen-6); cow.style.left=cp.x+'px'; cow.style.top=cp.y+'px';
  tz.appendChild(cow);
  const loco=document.createElement('div'); loco.id='loco'; loco.textContent='🚂';
  tz.appendChild(loco);
  train.forEach(c=>{
    const el=document.createElement('div'); el.className='car';
    el.style.background=COLORS[c.color].c;
    el.innerHTML='<div class="wh" style="left:4px"></div><div class="wh" style="right:4px"></div>';
    tz.appendChild(el); c.el=el;
  });
  headD=Math.min(totalCars*CAR_GAP+70, trackLen*0.62);
  speed=(trackLen-headD-20)/(totalCars*L.budget); // px/сек до коровы
  // заказы: очередь = секции по порядку
  ordIdx=0; orders=sections.map((s,i)=>({color:s.color,left:s.len,done:false,el:null,idx:i}));
  renderOrders();
  // склад
  gridEl.innerHTML='';
  const W=L.cols*(TILE+TGAP)-TGAP, H=L.rows*(TILE+TGAP)-TGAP;
  gridEl.style.width=W+'px'; gridEl.style.height=H+'px';
  tiles.forEach(t=>{
    const el=document.createElement('div'); el.className='tile';
    el.style.cssText=`left:${t.gx*(TILE+TGAP)}px;top:${t.gy*(TILE+TGAP)}px;width:${TILE}px;height:${TILE}px;background:${COLORS[t.color].c};`;
    el.innerHTML=`<svg viewBox="0 0 24 24"><path d="${ARROWS[t.dir]}" fill="#fff"/></svg>`;
    el.addEventListener('pointerdown',()=>tap(t));
    gridEl.appendChild(el); t.el=el;
  });
  updateHud();
  requestAnimationFrame(fit);
  lastT=performance.now();
  if(raf) cancelAnimationFrame(raf);
  raf=requestAnimationFrame(tick);
}
function activeOrders(){
  const act=[];
  for(let i=0;i<orders.length&&act.length<2;i++) if(!orders[i].done) act.push(orders[i]);
  return act;
}
function renderOrders(){
  ordersEl.innerHTML='';
  const act=activeOrders();
  act.forEach(o=>{
    const el=document.createElement('div'); el.className='ord';
    el.innerHTML=`<div class="chip" style="background:${COLORS[o.color].c}"></div><div class="cnt">×${o.left}</div>`;
    ordersEl.appendChild(el); o.el=el;
  });
  const next=orders.find(o=>!o.done && !act.includes(o));
  if(next){
    const el=document.createElement('div'); el.className='ord nextcard';
    el.innerHTML=`<div class="lbl">СЛЕДУЮЩИЙ</div><div class="chip" style="background:${COLORS[next.color].c};width:34px;height:22px"></div><div class="cnt" style="font-size:14px">×${next.left}</div>`;
    ordersEl.appendChild(el);
  }
}
function updateHud(){
  document.getElementById('lvlname').textContent='Level '+(cur+1);
  document.getElementById('prog').textContent=Math.round(removedCars/Math.max(1,totalCars)*100)+'%';
}

/* ---------- игровой цикл: поезд ползёт ---------- */
function tick(now){
  if(over) return;
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  headD+=speed*dt;
  layTrain();
  if(headD>=trackLen-18){ over=true; cancelAnimationFrame(raf); lose('Поезд доехал 🐄','Корова осталась на рельсах'); return; }
  raf=requestAnimationFrame(tick);
}
function layTrain(){
  const lp=posAt(headD);
  const loco=document.getElementById('loco');
  if(loco){ loco.style.left=lp.x+'px'; loco.style.top=(lp.y-6)+'px';
    loco.style.transform=`scaleX(${Math.cos(lp.a)>=0?1:-1})`; }
  let d=headD-34;
  train.forEach(c=>{
    if(!c.el) return;
    const p=posAt(d);
    c.el.style.left=p.x+'px'; c.el.style.top=p.y+'px';
    c.el.style.transform=`rotate(${p.a}rad)`;
    d-=CAR_GAP;
  });
}

/* ---------- тап по ящику ---------- */
function isFree(t){ return !t.dead && isFreeIn(t,tiles); }
function tap(t){
  if(over||t.dead) return;
  const act=activeOrders();
  const ord=act.find(o=>o.color===t.color && o.left>0);
  if(!ord || !isFree(t)){
    t.el.classList.add('deny'); setTimeout(()=>t.el&&t.el.classList.remove('deny'),320);
    return;
  }
  t.dead=true;
  ord.left--; flightsN++;
  // полёт ящика к карточке заказа (общая система координат #board)
  const fly=document.createElement('div'); fly.className='flytile';
  fly.style.cssText=`left:${gridEl.offsetLeft+t.gx*(TILE+TGAP) + document.getElementById('yard').offsetTop*0}px;`;
  const yard=document.getElementById('yard');
  const sx=yard.offsetLeft+gridEl.offsetLeft+t.gx*(TILE+TGAP), sy=yard.offsetTop+gridEl.offsetTop+t.gy*(TILE+TGAP);
  fly.style.left=sx+'px'; fly.style.top=sy+'px';
  fly.style.width=TILE+'px'; fly.style.height=TILE+'px';
  fly.style.background=COLORS[t.color].c;
  fly.innerHTML=t.el.innerHTML;
  board.appendChild(fly);
  t.el.remove(); t.el=null;
  const oel=ord.el && ord.el.isConnected ? ord.el : null;
  const ox=oel ? ordersEl.offsetLeft+oel.offsetLeft+oel.offsetWidth/2-17
               : ordersEl.offsetLeft+ordersEl.offsetWidth/2-17;
  const oy=oel ? ordersEl.offsetTop+oel.offsetTop+oel.offsetHeight/2-17
               : ordersEl.offsetTop+ordersEl.offsetHeight/2-17;
  requestAnimationFrame(()=>{ fly.style.left=ox+'px'; fly.style.top=oy+'px';
    fly.style.width='34px'; fly.style.height='34px'; });
  const countEl=oel?oel.querySelector('.cnt'):null;
  setTimeout(()=>{
    fly.remove(); flightsN--;
    if(countEl) countEl.textContent='×'+ord.left;
    if(ord.left<=0 && !ord.done) completeOrder(ord);
    else checkStuck();
  },430);
}

/* ---------- заказ собран: отцепляем секцию ---------- */
function completeOrder(ord){
  ord.done=true;
  if(ord.el) ord.el.classList.add('done');
  // вагоны секции улетают с откатом состава
  const carsOfSec=train.filter(c=>c.sec===ord.idx);
  carsOfSec.forEach((c,i)=>{
    setTimeout(()=>{ if(c.el){ c.el.classList.add('gone'); setTimeout(()=>{c.el&&c.el.remove();c.el=null;},360); } }, i*80);
  });
  setTimeout(()=>{
    train=train.filter(c=>c.sec!==ord.idx);
    removedCars+=carsOfSec.length;
    headD=Math.max(60,headD-PUSHBACK);
    updateHud();
    if(ord.el) ord.el.classList.add('out');
    setTimeout(()=>{ renderOrders();
      if(orders.every(o=>o.done)){ over=true; cancelAnimationFrame(raf); setTimeout(win,1000); }
      else checkStuck();
    },300);
  },carsOfSec.length*80+250);
}

/* ---------- пат-чек: нет доступных ящиков активных цветов ---------- */
function checkStuck(){
  if(over||flightsN>0) return;
  const act=activeOrders();
  if(!act.length) return;
  const any=tiles.some(t=>!t.dead && act.some(o=>o.color===t.color) && isFree(t));
  if(!any && tiles.some(t=>!t.dead)){
    over=true; cancelAnimationFrame(raf);
    lose('Тупик на складе 📦','Нужные ящики заблокированы');
  }
}

/* ---------- win/lose/экраны ---------- */
function win(){
  unlocked=Math.max(unlocked,Math.min(cur+2,LEVELS.length));
  localStorage.setItem('cargojam_v1',unlocked);
  document.getElementById('winTxt').textContent='Level '+(cur+1)+' пройден';
  document.getElementById('btnNext').textContent=(cur+1<LEVELS.length)?'Дальше':'🏠 Домой';
  document.getElementById('ovWin').classList.add('show');
  confetti();
  window.__game.state='won';
}
function lose(title,txt){
  document.getElementById('loseTitle').textContent=title;
  document.getElementById('loseTxt').textContent=txt;
  document.getElementById('ovLose').classList.add('show');
  window.__game.state='lost';
}
function confetti(){
  const phone=document.getElementById('phone');
  for(let i=0;i<26;i++){
    const c=document.createElement('div'); c.className='conf';
    c.style.background=COLORS[i%COLORS.length].c;
    c.style.left=(20+Math.random()*60)+'%'; c.style.top='-10px';
    phone.appendChild(c);
    const a=c.animate([{transform:'translateY(0) rotate(0)',opacity:1},
      {transform:`translateY(${phone.clientHeight*.8}px) rotate(${360+Math.random()*360}deg)`,opacity:0}],
      {duration:1400+Math.random()*800,easing:'cubic-bezier(.3,.6,.6,1)',delay:Math.random()*300});
    a.onfinish=()=>c.remove();
  }
}
function startLevel(i){
  cur=i; over=false; flightsN=0;
  document.getElementById('ovWin').classList.remove('show');
  document.getElementById('ovLose').classList.remove('show');
  document.getElementById('home').classList.add('hide');
  board.querySelectorAll('.flytile').forEach(e=>e.remove());
  generate(i); buildTrack(); build();
  window.__game.state='playing';
}
function showHome(){
  if(raf) cancelAnimationFrame(raf);
  document.getElementById('home').classList.remove('hide');
  document.getElementById('ovWin').classList.remove('show');
  document.getElementById('ovLose').classList.remove('show');
  const wrap=document.getElementById('lvlbtns'); wrap.innerHTML='';
  for(let i=0;i<LEVELS.length;i++){
    const b=document.createElement('button');
    b.className='lvlbtn'; b.disabled=i+1>unlocked;
    b.innerHTML=`<span>Level ${i+1}</span><span>${i+1>unlocked?'🔒':'🚃'}</span>`;
    b.addEventListener('pointerdown',()=>startLevel(i));
    wrap.appendChild(b);
  }
  window.__game.state='home';
}
document.getElementById('btnRestart').addEventListener('pointerdown',()=>startLevel(cur));
document.getElementById('btnRetry').addEventListener('pointerdown',()=>startLevel(cur));
document.getElementById('btnHome').addEventListener('pointerdown',showHome);
document.getElementById('btnLoseHome').addEventListener('pointerdown',showHome);
document.getElementById('btnNext').addEventListener('pointerdown',()=>{
  if(cur+1<LEVELS.length) startLevel(cur+1); else showHome();
});

/* ---------- fit ---------- */
function fit(){
  const stage=document.getElementById('stage');
  const sw=stage.clientWidth-10, sh=stage.clientHeight-8;
  const s=Math.max(.3,Math.min(sw/520, sh/846, 1.3));
  board.style.transform=`translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize',fit);

/* ---------- API для PLAY-бота ---------- */
window.__game={
  state:'home',
  get genOK(){return genOK;},
  startLevel, showHome,
  setSpeedMult(m){ speed*=m; },
  timeInfo(){ return {headD,trackLen,speed,left:(trackLen-18-headD)/speed}; },
  debug(){
    const act=activeOrders();
    return {over,flightsN,headD:Math.round(headD),
      orders:orders.map(o=>({c:o.color,left:o.left,done:o.done})),
      act:act.map(o=>o.color+':'+o.left),
      tilesLeft:tiles.filter(t=>!t.dead).length,
      freeMatch:window.__game.freeMatching().length,
      freeAny:tiles.filter(t=>!t.dead&&isFree(t)).length};
  },
  freeMatching(){
    const act=activeOrders();
    return tiles.filter(t=>!t.dead && act.some(o=>o.color===t.color&&o.left>0) && isFree(t)).map(t=>t.gx+','+t.gy);
  },
  tapAt(key){ const [gx,gy]=key.split(',').map(Number);
    const t=tiles.find(t=>t.gx===gx&&t.gy===gy&&!t.dead); if(t) tap(t); },
  botStep(){
    if(window.__game.state!=='playing') return;
    const act=activeOrders();
    const free=tiles.filter(t=>!t.dead && act.some(o=>o.color===t.color&&o.left>0) && isFree(t));
    if(!free.length) return;
    // приоритет: цвет заказа с меньшим остатком (быстрее откат)
    free.sort((a,b)=>{
      const oa=act.find(o=>o.color===a.color&&o.left>0), ob=act.find(o=>o.color===b.color&&o.left>0);
      return oa.left-ob.left;
    });
    tap(free[0]);
  },
  autoplay(intervalMs=700){
    return new Promise(res=>{
      const t=setInterval(()=>{
        if(window.__game.state!=='playing'){ clearInterval(t); res(window.__game.state); return; }
        window.__game.botStep();
      },intervalMs);
      setTimeout(()=>{ clearInterval(t); res('timeout:'+window.__game.state); },180000);
    });
  }
};

showHome();
requestAnimationFrame(fit);
</script>
