<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Exit 8 — anomaly corridor · v1</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;
    user-select:none;touch-action:none;color:#e9e6dc;
    background:radial-gradient(120% 120% at 50% 0%,#1a1c24,#0a0b10 80%);}
  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;background:#0b0c10;}
  @media (max-aspect-ratio:1/1){#phone{width:100vw;height:100dvh;border-radius:0;}}
  @media (min-aspect-ratio:1/1){#phone{height:96dvh;aspect-ratio:9/16;width:auto;border-radius:32px;
    box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}}

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;}
  .hidden{display:none!important;}

  /* ===== HOME ===== */
  #home{background:radial-gradient(90% 60% at 50% 20%,#20232c,#0b0c10 80%);align-items:center;padding:22px 18px 16px;}
  .signTitle{margin-top:8px;background:#f2c400;color:#111;border-radius:6px;padding:10px 22px;font-weight:900;
    font-size:34px;letter-spacing:1px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(242,196,0,.25);}
  .signTitle small{font-size:15px;font-weight:700;opacity:.75;letter-spacing:0;}
  .rules{margin:14px 6px 6px;font-size:13.5px;line-height:1.4;color:#b9b6ab;text-align:center;max-width:320px;}
  .rules b{color:#f2c400;}
  #path{flex:1;width:100%;position:relative;display:flex;flex-direction:column-reverse;align-items:center;
    justify-content:space-evenly;padding:8px 0;}
  #path::before{content:"";position:absolute;left:50%;top:14px;bottom:14px;border-left:3px dashed #3a3d48;transform:translateX(-50%);}
  .node{position:relative;display:flex;align-items:center;gap:14px;width:250px;cursor:pointer;}
  .node:nth-child(odd){flex-direction:row-reverse;text-align:right;}
  .node .num{width:54px;height:54px;border-radius:50%;background:#f2c400;color:#111;font-weight:900;font-size:22px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.5);flex:none;}
  .node .num.done{background:#5cc46a;}
  .node .info{font-size:12.5px;line-height:1.3;color:#cfcbbe;}
  .node .info b{display:block;font-size:14px;color:#fff;}
  .node:active .num{transform:scale(.94);}

  /* ===== GAME ===== */
  #game{background:#0b0c10;}
  #hud{width:100%;padding:12px 14px 6px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  #hud .btn{background:#1f222b;border:1px solid #33374a;color:#ddd;border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer;}
  #hud .lvl{font-weight:800;font-size:15px;}
  #hearts{font-size:17px;letter-spacing:2px;color:#ff5c6a;}
  #hearts .off{color:#3a3d48;}
  #pips{display:flex;gap:5px;justify-content:center;padding:2px 14px 8px;z-index:3;}
  #pips span{width:26px;height:22px;border-radius:5px;background:#1f222b;color:#666;font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;border:1px solid #2c303c;}
  #pips span.on{background:#f2c400;color:#111;border-color:#f2c400;}
  #pips span.cur{outline:2px solid #fff;}
  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:5;pointer-events:none;
    background:rgba(10,12,18,.88);border:1px solid #3a3d48;border-radius:12px;padding:8px 14px;font-size:14px;
    font-weight:700;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;}
  #toast.show{opacity:1;}
  #toast.ok{border-color:#5cc46a;color:#9ff0a8;}
  #toast.bad{border-color:#ff5c6a;color:#ffb3ba;}
  #ctrls{display:flex;gap:10px;padding:10px 14px 16px;z-index:3;}
  .big{flex:1;height:78px;border-radius:16px;border:none;font-size:17px;font-weight:900;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 8px 20px rgba(0,0,0,.45);}
  .big small{font-size:11.5px;font-weight:600;opacity:.8;}
  #bBack{background:#e0483f;color:#fff;}
  #bFwd{background:#f2c400;color:#111;}
  .big:active{transform:translateY(2px);filter:brightness(.92);}
  #flash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .35s;}

  /* ===== OVERLAYS ===== */
  .ov{position:absolute;inset:0;z-index:20;background:rgba(5,6,10,.78);display:flex;align-items:center;justify-content:center;}
  .card{background:#171922;border:1px solid #2f3340;border-radius:20px;padding:22px 20px 18px;width:82%;max-width:330px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .card .sign{display:inline-block;background:#f2c400;color:#111;font-weight:900;font-size:30px;border-radius:6px;padding:6px 18px;}
  .card.lose .sign{background:#e0483f;color:#fff;font-size:22px;}
  .card h2{margin:12px 0 4px;font-size:20px;}
  .card p{margin:4px 0 14px;color:#b9b6ab;font-size:14px;line-height:1.4;}
  .card .row{display:flex;gap:10px;}
  .card button{flex:1;height:48px;border-radius:12px;border:none;font-size:15px;font-weight:800;cursor:pointer;}
  .card .pri{background:#f2c400;color:#111;}
  .card .sec{background:#2a2e3a;color:#ddd;}
  #confetti{position:absolute;inset:0;z-index:25;pointer-events:none;}
</style>
</head>
<body>
<div id="phone">

  <!-- HOME -->
  <div id="home" class="screen">
    <div class="signTitle">出口 8 <small>EXIT 8</small></div>
    <div class="rules">Walk the underground passage. Each corridor is the same, except when it is not.<br>
      <b>Anomaly? → Turn back.</b> Nothing odd? → Go forward.<br>
      Right call: exit +1. Mistake: back to Exit 0 and a heart lost.</div>
    <div id="path"></div>
  </div>

  <!-- GAME -->
  <div id="game" class="screen hidden">
    <div id="hud">
      <button class="btn" id="bMap">◂ Map</button>
      <div class="lvl" id="lvlLabel">Level 1</div>
      <div id="hearts"></div>
    </div>
    <div id="pips"></div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="flash"></div>
      <div id="toast"></div>
    </div>
    <div id="ctrls">
      <button class="big" id="bBack">↩ Turn back<small>there is an anomaly</small></button>
      <button class="big" id="bFwd">Go forward ↑<small>everything is normal</small></button>
    </div>
  </div>

  <!-- WIN -->
  <div id="winOv" class="ov hidden">
    <div class="card">
      <div class="sign" id="winSign">出口 8</div>
      <h2 id="winTitle">You found the exit</h2>
      <p id="winText"></p>
      <div class="row"><button class="sec" id="wMap">Map</button><button class="pri" id="wNext">Next level</button></div>
    </div>
  </div>

  <!-- LOSE -->
  <div id="loseOv" class="ov hidden">
    <div class="card lose">
      <div class="sign">LOST IN THE PASSAGE</div>
      <h2>No hearts left</h2>
      <p id="loseText"></p>
      <div class="row"><button class="sec" id="lMap">Map</button><button class="pri" id="lRetry">Retry</button></div>
    </div>
  </div>

  <canvas id="confetti"></canvas>
</div>

<script>
/* =====================================================================
   EXIT 8 — playable prototype v1
   Mechanic (The Exit 8, KOTAKE CREATE): endless identical underground
   corridor. Each pass is either the normal corridor or has ONE anomaly.
   Anomaly → turn back. No anomaly → go forward. Correct: exit +1.
   Wrong: back to Exit 0 (+ lose a heart, our loseability). Reach target exit.
   The walking man is the timer: when he passes you, the pass counts as a miss.
   ===================================================================== */
const $=id=>document.getElementById(id);

const LEVELS=[
  {n:1,target:4,tiers:{1:1},         time:40,hearts:3,p:.5, desc:'Obvious anomalies · 40s'},
  {n:2,target:5,tiers:{1:.4,2:.6},   time:28,hearts:3,p:.5, desc:'Obvious + medium · 28s'},
  {n:3,target:6,tiers:{2:1},         time:20,hearts:3,p:.5, desc:'Medium anomalies · 20s'},
  {n:4,target:7,tiers:{2:.4,3:.6},   time:15,hearts:3,p:.5, desc:'Medium + subtle · 15s'},
  {n:5,target:8,tiers:{2:.2,3:.8},   time:12,hearts:3,p:.5, desc:'Subtle anomalies · 12s · the real Exit 8'},
];

/* ---------- baseline corridor ---------- */
function baseScene(){
  return {
    lightColor:'#fff8e6', lightsOut:[], lightStep:2.6, tint:null,
    posters:[
      {wall:'L',z:2.3,type:'A',mirror:false,eyeClosed:false,scale:1},
      {wall:'L',z:4.6,type:'B',vertical:false},
      {wall:'R',z:6.2,type:'C',color:'#e86aa0'},
      {wall:'L',z:6.8,type:'D'},
    ],
    postersBlack:false,
    door:{present:true,open:false,window:true,handleFar:false},
    vent:{wall:'R'},
    ext:{present:true,wall:'R'},
    noentry:{color:'#d63a3a',vertical:false},
    cctv:true,
    tactile:true, flood:false, grout:true,
    sign:{color:'#f2c400',arrowLeft:false,number:null,kanji:'出口'},
    man:{x:.55,scale:1,briefcase:true,tie:'#1b1f2a',back:false,clone:false},
  };
}

/* ---------- anomalies ---------- */
const ANOMALIES=[
  // tier 1 — obvious
  {id:'lightsRed',  tier:1,name:'The lights were red',            f:s=>{s.lightColor='#ff3b3b';s.tint='rgba(255,40,40,.22)';}},
  {id:'postersBlack',tier:1,name:'All posters were black',        f:s=>{s.postersBlack=true;}},
  {id:'doorOpen',   tier:1,name:'The door was wide open',         f:s=>{s.door.open=true;}},
  {id:'posterGiant',tier:1,name:'The blue poster was huge',       f:s=>{s.posters[0].scale=2.3;}},
  {id:'signRed',    tier:1,name:'The exit sign was red',          f:s=>{s.sign.color='#e0483f';}},
  {id:'manGiant',   tier:1,name:'The man was a giant',            f:s=>{s.man.scale=1.9;}},
  {id:'twoMen',     tier:1,name:'There were two men',             f:s=>{s.man.clone=true;}},
  {id:'flood',      tier:1,name:'The floor was flooded',          f:s=>{s.flood=true;}},
  // tier 2 — medium
  {id:'lightOut',   tier:2,name:'The second light was out',       f:s=>{s.lightsOut=[1];}},
  {id:'posterMirror',tier:2,name:'The blue poster was mirrored',  f:s=>{s.posters[0].mirror=true;}},
  {id:'extraPoster',tier:2,name:'An extra purple poster on the right',f:s=>{s.posters.push({wall:'R',z:7.8,type:'E'});}},
  {id:'ventLeft',   tier:2,name:'The vent was on the left wall',  f:s=>{s.vent.wall='L';}},
  {id:'extMissing', tier:2,name:'The fire extinguisher was gone', f:s=>{s.ext.present=false;}},
  {id:'noBriefcase',tier:2,name:'The man had no briefcase',       f:s=>{s.man.briefcase=false;}},
  {id:'arrowLeft',  tier:2,name:'The sign arrow pointed left',    f:s=>{s.sign.arrowLeft=true;}},
  {id:'noentryGreen',tier:2,name:'The no-entry sign was green',   f:s=>{s.noentry.color='#2fa84f';}},
  {id:'doorNoWindow',tier:2,name:'The door had no window',        f:s=>{s.door.window=false;}},
  {id:'noCctv',     tier:2,name:'The camera was missing',         f:s=>{s.cctv=false;}},
  {id:'posterBVert',tier:2,name:'The green poster stripes were vertical',f:s=>{s.posters[1].vertical=true;}},
  {id:'manLeft',    tier:2,name:'The man walked on the left side',f:s=>{s.man.x=-.55;}},
  // tier 3 — subtle
  {id:'posterCHue', tier:3,name:'The pink poster was orange',     f:s=>{s.posters[2].color='#ef8a5a';}},
  {id:'tieRed',     tier:3,name:'The man wore a red tie',         f:s=>{s.man.tie='#d62828';}},
  {id:'noTactile',  tier:3,name:'The yellow floor strip was gone',f:s=>{s.tactile=false;}},
  {id:'extLeft',    tier:3,name:'The extinguisher was on the left wall',f:s=>{s.ext.wall='L';}},
  {id:'noGrout',    tier:3,name:'The wall tiles had no seams',    f:s=>{s.grout=false;}},
  {id:'lightsTight',tier:3,name:'There were more ceiling lights', f:s=>{s.lightStep=1.7;}},
  {id:'eyeClosed',  tier:3,name:'The eye on the poster was closed',f:s=>{s.posters[0].eyeClosed=true;}},
  {id:'handleFar',  tier:3,name:'The door handle was on the other side',f:s=>{s.door.handleFar=true;}},
  {id:'signKanji',  tier:3,name:'The sign said 入口 (entrance), not 出口',f:s=>{s.sign.kanji='入口';}},
  {id:'signNumber', tier:3,name:'The sign number was wrong',      f:s=>{s.sign.number='+1';}},
  {id:'manBack',    tier:3,name:'The man walked facing away',     f:s=>{s.man.back=true;}},
  {id:'noentryVert',tier:3,name:'The no-entry bar was vertical',  f:s=>{s.noentry.vertical=true;}},
];

/* ---------- state ---------- */
const state={
  level:null, exit:0, hearts:3, phase:'home', // home | idle | walk | turn | fade | win | lose
  scene:null, anomaly:null, used:[], elapsed:0, T:40,
  trans:null, tintWin:0, toastTimer:null, done:{},
};
let camZ=0,camX=0,camBob=0,walkDist=0;

function pickAnomaly(L){
  const r=Math.random(); let acc=0, tier=1;
  for(const t of Object.keys(L.tiers)){acc+=L.tiers[t]; if(r<=acc){tier=+t;break;}}
  let pool=ANOMALIES.filter(a=>a.tier===tier && !state.used.includes(a.id));
  if(!pool.length){ state.used=state.used.filter(id=>ANOMALIES.find(a=>a.id===id).tier!==tier); pool=ANOMALIES.filter(a=>a.tier===tier); }
  const a=pool[(Math.random()*pool.length)|0]; state.used.push(a.id); return a;
}

function newSegment(forceNormal){
  const L=state.level;
  state.scene=baseScene();
  state.anomaly=null;
  if(!forceNormal && Math.random()<L.p){ const a=pickAnomaly(L); a.f(state.scene); state.anomaly=a; }
  state.elapsed=0; state.T=L.time; walkDist=0; camZ=0; camX=0;
  state.phase='idle';
  renderHud();
}

function load(n){
  state.level=LEVELS[n-1]; state.exit=0; state.hearts=state.level.hearts; state.used=[];
  $('home').classList.add('hidden'); $('game').classList.remove('hidden');
  $('winOv').classList.add('hidden'); $('loseOv').classList.add('hidden');
  $('lvlLabel').textContent='Level '+n;
  stopConfetti(); hideToast();
  newSegment(true); // Exit 0 is always the normal corridor (learn the baseline)
  resize();
}

function renderHud(){
  const L=state.level; if(!L) return;
  $('hearts').innerHTML=Array.from({length:L.hearts},(_,i)=>`<span class="${i<state.hearts?'':'off'}">♥</span>`).join('');
  let h=''; for(let i=0;i<=L.target;i++) h+=`<span class="${i<=state.exit?'on':''} ${i===state.exit?'cur':''}">${i}</span>`;
  $('pips').innerHTML=h;
}

function toast(msg,cls){
  const t=$('toast'); t.textContent=msg; t.className='show '+cls;
  clearTimeout(state.toastTimer); state.toastTimer=setTimeout(hideToast,2200);
}
function hideToast(){ $('toast').className=''; }
function flash(color){ const f=$('flash'); f.style.background=color; f.style.opacity=.6; setTimeout(()=>f.style.opacity=0,120); }

/* ---------- decisions ---------- */
function decide(dir){ // 'back' | 'fwd'
  if(state.phase!=='idle') return false;
  const a=state.anomaly, L=state.level;
  const correct=(dir==='back')===(a!=null);
  if(correct){
    state.exit++;
    flash('rgba(92,196,106,.5)');
    if(state.exit>=L.target){ renderHud(); hideToast(); state.phase='win'; startTransition('walk',true); return true; }
    toast(a?`✓ Anomaly spotted: ${a.name.toLowerCase()}`:'✓ Nothing odd — Exit '+state.exit,'ok');
    startTransition(dir==='back'?'turn':'walk',false);
  }else{
    resolveMiss(a?`✗ You missed: ${a.name.toLowerCase()}`:'✗ There was no anomaly',dir);
  }
  renderHud(); return true;
}
function resolveMiss(msg,dir){
  const a=state.anomaly;
  state.hearts--; state.exit=0; flash('rgba(224,72,63,.55)'); renderHud();
  if(state.hearts<=0){
    state.phase='lose';
    $('loseText').textContent=msg.replace('✗ ','')+'. The passage keeps you.';
    hideToast(); $('loseOv').classList.remove('hidden'); // lose shows immediately
    return;
  }
  toast(msg+' — back to Exit 0','bad');
  startTransition(dir==='back'?'turn':'walk',false);
}
function timeout(){ resolveMiss('✗ Too slow — the man walked past you','walk'); }

function startTransition(kind,win){
  state.phase=win?'win':kind;
  state.trans={kind,win,t:0,dur:win?1400:(kind==='walk'?900:800),done:false};
}

function finishWin(){
  const L=state.level; state.done[L.n]=true;
  $('winSign').textContent=L.target===8?'出口 8':'出口 '+L.target;
  $('winTitle').textContent=L.target===8?'You found the real exit':'Exit '+L.target+' reached';
  $('winText').textContent=`Level ${L.n} cleared · ${state.hearts}/${L.hearts} ♥ left`;
  $('wNext').textContent=L.n<5?'Next level':'Play again';
  startConfetti(); $('winOv').classList.remove('hidden');
}

/* ---------- rendering ---------- */
const cv=$('cv'), ctx=cv.getContext('2d');
let W=360,H=480,DPR=1,f=200,cx=180,cy=210;
function resize(){
  const r=$('stage').getBoundingClientRect(); if(!r.width) return;
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  f=W*.66; cx=W/2; cy=H*.47;
}
window.addEventListener('resize',resize);
new ResizeObserver(resize).observe($('stage'));

const NEAR=.45;
function P(x,y,z){ const s=f/(z-camZ); return [cx+camX+(x)*s, cy+camBob-(y)*s]; }
function poly(pts,color,stroke){
  ctx.beginPath(); pts.forEach((p,i)=>{const q=P(p[0],p[1],p[2]); i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);}); ctx.closePath();
  if(color){ctx.fillStyle=color;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}
}
function line3(a,b,color,w){ const p=P(...a),q=P(...b); ctx.strokeStyle=color; ctx.lineWidth=w||1; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke(); }
// rectangle on a side wall: wall 'L'|'R', z range, y range
function wallRect(wall,z0,z1,y0,y1,color,stroke){ const x=wall==='L'?-1:1; poly([[x,y0,z0],[x,y0,z1],[x,y1,z1],[x,y1,z0]],color,stroke); }
function wallCircle(wall,zc,yc,r,color){ const x=wall==='L'?-1:1; const pts=[]; for(let i=0;i<24;i++){const a=i/24*Math.PI*2; pts.push([x,yc+Math.sin(a)*r,zc+Math.cos(a)*r]);} poly(pts,color); }

const ZF=18, FLOOR=-.7, CEIL=.6;
function draw(){
  const s=state.scene; if(!s){ctx.clearRect(0,0,W,H);return;}
  const zn=camZ+NEAR, zf=camZ+ZF;
  ctx.clearRect(0,0,W,H);
  // surfaces
  poly([[-1,FLOOR,zn],[1,FLOOR,zn],[1,FLOOR,zf],[-1,FLOOR,zf]], s.flood?'#4d6d84':'#8d8a83');
  poly([[-1,CEIL,zn],[1,CEIL,zn],[1,CEIL,zf],[-1,CEIL,zf]], '#e6e3da');
  poly([[-1,FLOOR,zn],[-1,FLOOR,zf],[-1,CEIL,zf],[-1,CEIL,zn]], '#d6d0c0');
  poly([[1,FLOOR,zn],[1,FLOOR,zf],[1,CEIL,zf],[1,CEIL,zn]], '#cfc9b8');
  // end wall (corridor turns right into darkness)
  poly([[-1,FLOOR,zf],[1,FLOOR,zf],[1,CEIL,zf],[-1,CEIL,zf]], '#57544f');
  poly([[.2,FLOOR,zf],[1,FLOOR,zf],[1,CEIL-.2,zf],[.2,CEIL-.2,zf]], '#1a1a1c');
  // floor: tactile strip + tiles
  if(s.tactile) poly([[-.09,FLOOR+.001,zn],[.09,FLOOR+.001,zn],[.09,FLOOR+.001,zf],[-.09,FLOOR+.001,zf]], s.flood?'#b39a3c':'#e3b93a');
  ctx.lineWidth=1;
  for(let z=Math.ceil(zn);z<zf;z++) line3([-1,FLOOR,z],[1,FLOOR,z], s.flood?'rgba(255,255,255,.12)':'rgba(0,0,0,.18)');
  for(const x of [-.5,.5]) line3([x,FLOOR,zn],[x,FLOOR,zf],'rgba(0,0,0,.14)');
  // wall tiles
  if(s.grout){
    for(let z=Math.ceil(zn);z<zf;z++){ line3([-1,FLOOR,z],[-1,CEIL,z],'rgba(0,0,0,.09)'); line3([1,FLOOR,z],[1,CEIL,z],'rgba(0,0,0,.09)'); }
    for(const y of [-.25,.2]){ line3([-1,y,zn],[-1,y,zf],'rgba(0,0,0,.09)'); line3([1,y,zn],[1,y,zf],'rgba(0,0,0,.09)'); }
  }
  // baseboards
  poly([[-1,FLOOR,zn],[-1,FLOOR,zf],[-1,FLOOR+.08,zf],[-1,FLOOR+.08,zn]],'#5a564f');
  poly([[1,FLOOR,zn],[1,FLOOR,zf],[1,FLOOR+.08,zf],[1,FLOOR+.08,zn]],'#5a564f');
  // ceiling lights
  for(let i=0,z=1.8;z<zf;i++,z+=s.lightStep){
    if(z-1<zn) continue;
    const out=s.lightsOut.includes(i);
    poly([[-.24,CEIL,z-.6],[.24,CEIL,z-.6],[.24,CEIL,z+.6],[-.24,CEIL,z+.6]], out?'#6a6a66':s.lightColor);
    if(!out) poly([[-.55,FLOOR+.002,z-1],[.55,FLOOR+.002,z-1],[.55,FLOOR+.002,z+1],[-.55,FLOOR+.002,z+1]], s.lightColor==='#fff8e6'?'rgba(255,255,230,.10)':'rgba(255,60,60,.15)');
  }
  // door (right wall)
  if(s.door.present){
    wallRect('R',3.5,4.4,FLOOR,.52,'#4b4f58');
    wallRect('R',3.57,4.33,FLOOR,.46,s.door.open?'#07070a':'#8e939d');
    if(!s.door.open){
      if(s.door.window) wallRect('R',3.75,4.15,.05,.36,'#2b3a4a');
      const hz=s.door.handleFar?4.22:3.68; wallRect('R',hz-.05,hz+.05,-.14,-.1,'#222');
    }
  }
  // vent
  { const w=s.vent.wall; wallRect(w,1.5,2.05,.32,.54,'#9a9a95','#666');
    for(const y of [.36,.4,.44,.48,.52]) line3([w==='L'?-1:1,y,1.52],[w==='L'?-1:1,y,2.03],'#66665f'); }
  // extinguisher
  if(s.ext.present){ const w=s.ext.wall; wallRect(w,5.2,5.4,FLOOR+.05,FLOOR+.4,'#d1262b'); wallRect(w,5.24,5.36,FLOOR+.4,FLOOR+.46,'#222'); }
  // no-entry sign (left wall)
  wallCircle('L',3.45,.34,.17,s.noentry.color);
  if(s.noentry.vertical) wallRect('L',3.42,3.48,.23,.45,'#fff'); else wallRect('L',3.33,3.57,.31,.37,'#fff');
  // cctv (right wall near ceiling)
  if(s.cctv){ wallRect('R',1.15,1.35,.44,.56,'#2a2a2e'); wallRect('R',1.05,1.17,.47,.53,'#111'); }
  // posters
  for(const p of s.posters){
    if(p.z+1<zn) continue;
    const sc=p.scale||1, h=.6*sc, w=.8*sc, y0=.05-h/2, y1=.05+h/2, z0=p.z+.45-w/2, z1=p.z+.45+w/2;
    const X=p.wall==='L'?-1:1;
    const U=(u,v)=>[X, y0+v*h, z0+u*w]; // u along z, v up
    const rect=(u0,u1,v0,v1,c)=>poly([U(u0,v0),U(u1,v0),U(u1,v1),U(u0,v1)],c);
    const circ=(uc,vc,r,c)=>{const pts=[];for(let i=0;i<20;i++){const a=i/20*Math.PI*2;pts.push(U(uc+Math.cos(a)*r*.66,vc+Math.sin(a)*r));}poly(pts,c);};
    if(s.postersBlack){ rect(0,1,0,1,'#111'); continue; }
    if(p.type==='A'){ rect(0,1,0,1,'#2a5bd7'); const eu=p.mirror?.68:.32;
      if(p.eyeClosed) rect(eu-.15,eu+.15,.6,.64,'#fff'); else { circ(eu,.62,.2,'#fff'); circ(eu,.62,.09,'#111'); }
      rect(.1,.9,.12,.3,'#f2c400'); }
    else if(p.type==='B'){ rect(0,1,0,1,'#2e9e5b');
      if(p.vertical){ for(const u of [.2,.5,.8]) rect(u-.06,u+.06,.1,.9,'#fff'); } else { for(const v of [.25,.5,.75]) rect(.1,.9,v-.05,v+.05,'#fff'); } }
    else if(p.type==='C'){ rect(0,1,0,1,p.color); poly([U(.5,.85),U(.15,.3),U(.85,.3)],'#fff'); rect(.35,.65,.1,.2,'#3a2030'); }
    else if(p.type==='D'){ rect(0,1,0,1,'#e8862b'); circ(.5,.55,.3,'#3a1f0a'); circ(.5,.55,.18,'#e8862b'); rect(.2,.8,.1,.2,'#fff'); }
    else if(p.type==='E'){ rect(0,1,0,1,'#7a3fd1'); rect(.2,.8,.4,.75,'#fff'); }
    poly([U(0,0),U(1,0),U(1,1),U(0,1)],null,'rgba(0,0,0,.25)');
  }
  // dynamic objects sorted far → near
  const objs=[{z:2.6,fn:drawSign}];
  const mz=manZ(); objs.push({z:mz,fn:()=>drawMan(s.man.x,mz,s.man.scale)});
  if(s.man.clone) objs.push({z:mz+4,fn:()=>drawMan(-.55,mz+4,s.man.scale)});
  objs.sort((a,b)=>b.z-a.z).forEach(o=>{ if(o.z>zn+.1) o.fn(); });
  // fog to the far end
  const vp=P(0,0,camZ+ZF);
  const g=ctx.createRadialGradient(vp[0],vp[1],0,vp[0],vp[1],f*.5);
  g.addColorStop(0,'rgba(0,0,0,.62)'); g.addColorStop(.3,'rgba(0,0,0,.25)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if(s.tint){ ctx.fillStyle=s.tint; ctx.fillRect(0,0,W,H); }
  // transition overlays
  if(state.trans){ const tr=state.trans, k=tr.t/tr.dur;
    if(tr.win){ ctx.fillStyle=`rgba(255,250,230,${Math.min(1,Math.max(0,(k-.3)/.7))})`; ctx.fillRect(0,0,W,H); }
    else { const a=k<.6?0:(k-.6)/.4; ctx.fillStyle=`rgba(0,0,0,${a})`; ctx.fillRect(0,0,W,H); }
  }
  if(state.fadeIn>0){ ctx.fillStyle=`rgba(0,0,0,${state.fadeIn})`; ctx.fillRect(0,0,W,H); }
}

function drawSign(){
  const s=state.scene.sign, z=2.6;
  const num=s.number==='+1'?state.exit+1:state.exit;
  line3([-.35,CEIL,z],[-.35,.52,z],'#333',2); line3([.35,CEIL,z],[.35,.52,z],'#333',2);
  const a=P(-.45,.52,z), b=P(.45,.26,z);
  ctx.fillStyle=s.color; ctx.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=2; ctx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
  const h=b[1]-a[1], w=b[0]-a[0];
  ctx.fillStyle=s.color==='#f2c400'?'#111':'#fff'; ctx.textBaseline='middle';
  ctx.font=`900 ${h*.52}px -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif`; ctx.textAlign='left';
  ctx.fillText(`${s.kanji} ${num}`,a[0]+w*.06,a[1]+h*.42);
  ctx.font=`700 ${h*.2}px sans-serif`; ctx.fillText('Exit',a[0]+w*.07,a[1]+h*.8);
  ctx.font=`900 ${h*.6}px sans-serif`; ctx.textAlign='right'; ctx.fillText(s.arrowLeft?'←':'→',b[0]-w*.05,a[1]+h*.5);
}

function manZ(){ return .6+13.4*(1-Math.min(1,state.elapsed/state.T)); }
function drawMan(x,z,scale){
  const m=state.scene.man;
  const foot=P(x,FLOOR,z), top=P(x,FLOOR+1.15*scale,z);
  const h=foot[1]-top[1]; if(h<2) return;
  const X=foot[0], Y=top[1];
  const ph=walkDist*5.2, sw=Math.sin(ph);
  ctx.lineCap='round';
  // legs
  ctx.strokeStyle='#1b1f2a'; ctx.lineWidth=h*.075;
  ctx.beginPath(); ctx.moveTo(X-h*.04,Y+h*.56); ctx.lineTo(X-h*.04+sw*h*.07,Y+h*.98); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X+h*.04,Y+h*.56); ctx.lineTo(X+h*.04-sw*h*.07,Y+h*.98); ctx.stroke();
  // body
  ctx.fillStyle='#1b1f2a'; ctx.beginPath(); ctx.roundRect(X-h*.13,Y+h*.19,h*.26,h*.4,h*.04); ctx.fill();
  if(!m.back){ ctx.fillStyle='#f4f4f0'; ctx.beginPath(); ctx.moveTo(X-h*.05,Y+h*.19); ctx.lineTo(X+h*.05,Y+h*.19); ctx.lineTo(X,Y+h*.36); ctx.fill();
    ctx.fillStyle=m.tie; ctx.fillRect(X-h*.012,Y+h*.2,h*.024,h*.16); }
  // arms
  ctx.strokeStyle='#1b1f2a'; ctx.lineWidth=h*.06;
  ctx.beginPath(); ctx.moveTo(X-h*.12,Y+h*.22); ctx.lineTo(X-h*.15-sw*h*.04,Y+h*.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X+h*.12,Y+h*.22); ctx.lineTo(X+h*.15+sw*h*.04,Y+h*.5); ctx.stroke();
  // head
  ctx.fillStyle=m.back?'#26221f':'#e6c19c'; ctx.beginPath(); ctx.arc(X,Y+h*.1,h*.09,0,Math.PI*2); ctx.fill();
  if(!m.back){ ctx.fillStyle='#26221f'; ctx.beginPath(); ctx.arc(X,Y+h*.08,h*.09,Math.PI,Math.PI*2); ctx.fill();
    ctx.fillStyle='#333'; ctx.fillRect(X-h*.06,Y+h*.1,h*.05,h*.02); ctx.fillRect(X+h*.01,Y+h*.1,h*.05,h*.02); }
  // briefcase
  if(m.briefcase){ ctx.fillStyle='#3b2a1e'; ctx.fillRect(X+h*.14+sw*h*.04,Y+h*.5,h*.16,h*.12); }
}

/* ---------- loop (setInterval with real dt: honest in headless too) ---------- */
let last=performance.now(); state.fadeIn=0;
setInterval(()=>{
  const now=performance.now(); let dt=(now-last)/1000; last=now; dt=Math.min(.12,dt);
  if(state.phase==='idle'){
    state.elapsed+=dt; walkDist+=dt*1.1;
    camBob=Math.sin(now/900)*1.5;
    if(state.elapsed>=state.T) timeout();
  }
  if(state.trans){
    const tr=state.trans; tr.t+=dt*1000; const k=Math.min(1,tr.t/tr.dur);
    if(tr.kind==='walk'){ camZ=k*2.4; camBob=Math.sin(k*Math.PI*4)*4; walkDist+=dt*2.2; }
    else { camX=-k*k*W*1.1; camZ=k*.4; }
    if(k>=1){ state.trans=null;
      if(tr.win){ state.phase='win'; setTimeout(finishWin,700); }
      else { newSegment(state.exit===0); state.fadeIn=1; }
    }
  }
  if(state.fadeIn>0) state.fadeIn=Math.max(0,state.fadeIn-dt*3.5);
  draw();
},16);

/* ---------- home: level path ---------- */
function buildHome(){
  $('path').innerHTML=LEVELS.map(L=>`<div class="node" data-n="${L.n}"><div class="num ${state.done[L.n]?'done':''}">${L.n}</div>
    <div class="info"><b>Exit ${L.target}</b>${L.desc}</div></div>`).join('');
  $('path').querySelectorAll('.node').forEach(el=>el.onclick=()=>load(+el.dataset.n));
}
function goHome(){ state.phase='home'; state.scene=null; $('game').classList.add('hidden'); $('winOv').classList.add('hidden'); $('loseOv').classList.add('hidden'); stopConfetti(); buildHome(); $('home').classList.remove('hidden'); }
buildHome();
$('bBack').onclick=()=>decide('back'); $('bFwd').onclick=()=>decide('fwd');
$('bMap').onclick=goHome; $('wMap').onclick=goHome; $('lMap').onclick=goHome;
$('wNext').onclick=()=>{ const n=state.level.n; load(n<5?n+1:5); };
$('lRetry').onclick=()=>load(state.level.n);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='a') decide('back'); if(e.key==='ArrowUp'||e.key==='ArrowRight'||e.key==='w'||e.key==='d') decide('fwd'); });

/* ---------- confetti ---------- */
const cc=$('confetti'), cctx=cc.getContext('2d'); let confP=[],confRun=false;
function startConfetti(){ const r=$('phone').getBoundingClientRect(); cc.width=r.width; cc.height=r.height; confP=[];
  for(let i=0;i<90;i++) confP.push({x:Math.random()*cc.width,y:-20-Math.random()*cc.height*.5,vx:(Math.random()-.5)*60,vy:80+Math.random()*120,r:4+Math.random()*4,c:['#f2c400','#fff','#5cc46a','#e0483f','#2a5bd7'][i%5],a:Math.random()*6});
  confRun=true; requestAnimationFrame(confTick); }
function confTick(){ if(!confRun) return; cctx.clearRect(0,0,cc.width,cc.height); let alive=0;
  for(const p of confP){ p.x+=p.vx/60; p.y+=p.vy/60; p.a+=.1; if(p.y<cc.height+20) alive++;
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.a); cctx.fillStyle=p.c; cctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cctx.restore(); }
  if(alive) requestAnimationFrame(confTick); else confRun=false; }
function stopConfetti(){ confRun=false; cctx.clearRect(0,0,cc.width,cc.height); }

/* ---------- debug / PLAY-verification hooks ---------- */
window.__game={state,LEVELS,ANOMALIES,load,decide,goHome,
  setAnomaly(id){ state.scene=baseScene(); const a=ANOMALIES.find(x=>x.id===id); if(a){a.f(state.scene);state.anomaly=a;} else state.anomaly=null; state.elapsed=0; },
  setElapsed(t){ state.elapsed=t; }};
</script>
