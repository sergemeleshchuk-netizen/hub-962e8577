function isComplete(box, cap) { return box.length === cap && box.every(c => c === box[0]); }
function canPark(box, color, cap) {
  if (isComplete(box, cap)) return false;
  if (box.length >= cap) return false;
  return box.length === 0 || box[box.length - 1] === color;
}
function topGroup(box) {
  if (!box.length) return null;
  const color = box[box.length - 1];
  let size = 0;
  for (let i = box.length - 1; i >= 0 && box[i] === color; i--) size++;
  return { color, size };
}
// приоритет парковки: сперва загон с СОВПАДАЮЩИМ верхним цветом, потом первый пустой
function pickDest(boxes, src, color, cap) {
  const n = boxes.length;
  for (let d = 1; d <= n; d++) {
    const j = (src + d) % n, b = boxes[j];
    if (b.length > 0 && b.length < cap && b[b.length - 1] === color) return j;
  }
  for (let d = 1; d <= n; d++) {
    const j = (src + d) % n;
    if (boxes[j].length === 0) return j;
  }

}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

let ring = { x0: 36, y0: 226, x1: W - 36, y1: 436, r: 26 };
let PATH = null;
function ringPath() {
  const { x0, y0, x1, y1, r } = ring;
  const arc = Math.PI * r / 2;
  const segs = [
    { type: 'h', x: x0 + r, y: y0, len: (x1 - r) - (x0 + r), dir: 1 },
    { type: 'a', cx: x1 - r, cy: y0 + r, a0: -Math.PI / 2, len: arc },
    { type: 'v', x: x1, y: y0 + r, len: (y1 - r) - (y0 + r), dir: 1 },
    { type: 'a', cx: x1 - r, cy: y1 - r, a0: 0, len: arc },
    { type: 'h', x: x1 - r, y: y1, len: (x1 - r) - (x0 + r), dir: -1 },
    { type: 'a', cx: x0 + r, cy: y1 - r, a0: Math.PI / 2, len: arc },
    { type: 'v', x: x0, y: y1 - r, len: (y1 - r) - (y0 + r), dir: -1 },
    { type: 'a', cx: x0 + r, cy: y0 + r, a0: Math.PI, len: arc },
  ];
  let acc = 0;
  for (const s of segs) { s.start = acc; acc += s.len; }
  return { segs, total: acc };
}
function pointAt(s) {
  s = ((s % PATH.total) + PATH.total) % PATH.total;
  for (const seg of PATH.segs) {
    if (s <= seg.start + seg.len) {
      const t = s - seg.start;
      if (seg.type === 'h') return { x: seg.x + seg.dir * t, y: seg.y };
      if (seg.type === 'v') return { x: seg.x, y: seg.y + seg.dir * t };
      const a = seg.a0 + t / seg.len * Math.PI / 2;
      return { x: seg.cx + ring.r * Math.cos(a), y: seg.cy + ring.r * Math.sin(a) };
    }
  }
  return pointAt(0);
}
function dirAt(s) { const a = pointAt(s - 4), b = pointAt(s + 4); return Math.atan2(b.y - a.y, b.x - a.x); }
function nearestS(px, py) {
  let best = 0, bd = 1e9, N = 720;
  for (let i = 0; i < N; i++) {
    const s = i / N * PATH.total, p = pointAt(s);
    const d = (p.x - px) ** 2 + (p.y - py) ** 2;
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}

// ---------- загоны: вертикальные / горизонтальные, крупные ячейки (cap=6) ----------
const VW = 80, VH = 122, HW = 112, HHt = 82, PAD = 7;
function vp(x, y, gate) { return { x, y, w: VW, h: VH, gate }; }
function hp(x, y, gate) { return { x, y, w: HW, h: HHt, gate }; }
function isVert(p) { return p.gate === 'up' || p.gate === 'down'; }
function penGeom(p) {
  const depth = spec.cap / 2; // пар по 2 в ряд
  if (isVert(p)) return { cw: (p.w - 2 * PAD) / 2, ch: (p.h - 2 * PAD) / depth };
  return { cw: (p.w - 2 * PAD) / depth, ch: (p.h - 2 * PAD) / 2 };
}
function penSheepScale(p) { const g = penGeom(p); return Math.min(g.cw, g.ch) / 22; }
function gatePoint(p) {
  if (p.gate === 'down') return { x: p.x + p.w / 2, y: p.y + p.h };
  if (p.gate === 'up') return { x: p.x + p.w / 2, y: p.y };
  if (p.gate === 'right') return { x: p.x + p.w, y: p.y + p.h / 2 };
  return { x: p.x, y: p.y + p.h / 2 };
}
function cellForK(p, k) {
  const g = penGeom(p), dg = Math.floor(k / 2), lane = k % 2;
  if (isVert(p)) {
    const x = p.x + PAD + lane * g.cw + g.cw / 2;
    const y = p.gate === 'down'
      ? p.y + p.h - PAD - dg * g.ch - g.ch / 2
      : p.y + PAD + dg * g.ch + g.ch / 2;
    return { x, y };
  }
  const y = p.y + PAD + lane * g.ch + g.ch / 2;
  const x = p.gate === 'right'
    ? p.x + p.w - PAD - dg * g.cw - g.cw / 2
    : p.x + PAD + dg * g.cw + g.cw / 2;
  return { x, y };
}

// ---------- состояние ----------
let lvlIdx = 0, boxes = [], spec = null, pens = [], docks = [];
let road = [];             // овцы на тропе: {color, src, s, prev, dest}
let over = false, won = false, tapped = false, fastFinish = false, winTimer = null;
const GAP = 30, SPEED = 150, WIN_DELAY = 1000;

let decos = [];            // камни/цветы/кустики на траве (декор, детерминирован по уровню)
let silos = [];            // полосатые башни-силосы
function mulberry32(a){ return function(){ a|=0;a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

function buildGeo(n) {
  const g = GEOS(n);
  ring = g.ring; PATH = ringPath();
  pens = g.pens.map(p => ({ ...p }));
  docks = pens.map(p => { const gp = gatePoint(p); return nearestS(gp.x, gp.y); });
  // силосы: у двух дальних углов кольца, снаружи
  silos = [
    { x: Math.min(ring.x1 + 4, W - 26), y: Math.max(ring.y0 - 2, 44) },
    { x: Math.max(ring.x0 - 4, 26), y: Math.min(ring.y1 + 2, H - 46) },
  ];
  // декор по краю травы (вне кольца и загонов)
  decos = [];
  const rng = mulberry32(2000 + n * 131);
  const kinds = ['rock', 'flower', 'tuft', 'tuft', 'flower', 'rock', 'flower'];
  let tries = 0;
  while (decos.length < 30 && tries < 700) {
    tries++;
    const x = rng() * W, y = 34 + rng() * (H - 44);
    if (x > ring.x0 - 22 && x < ring.x1 + 22 && y > ring.y0 - 22 && y < ring.y1 + 22) continue;
    if (pens.some(p => x > p.x - 18 && x < p.x + p.w + 18 && y > p.y - 18 && y < p.y + p.h + 18)) continue;
    if (silos.some(s => Math.hypot(x - s.x, y - s.y) < 40)) continue;
    decos.push({ kind: kinds[(decos.length * 3 + (rng() * 7 | 0)) % kinds.length], x, y, s: 0.65 + rng() * 0.8, h: rng() });
  }
}
function ringCenter() { return { x: (ring.x0 + ring.x1) / 2, y: (ring.y0 + ring.y1) / 2 }; }

function load(n) {
  clearTimeout(winTimer);
  lvlIdx = n; over = false; won = false; tapped = false; fastFinish = false; road = [];
  spec = LEVELS[n].spec;
  boxes = spec.boxes.map(b => b.slice());
  buildGeo(n);
  document.getElementById('overlay').style.display = 'none';
  document.querySelectorAll('#bar button[data-lvl]').forEach((el, i) =>
    el.classList.toggle('active', i === n));
  updateHand();
}

function assignDests() {
  const cap = spec.cap, sim = boxes.map(b => b.slice());
  for (const c of road) c.dest = null;
  let changed = true;
  while (changed) {
    changed = false;
    for (const c of road) {
      if (c.dest !== null) continue;
      const j = pickDest(sim, c.src, c.color, cap);
      if (j !== -1) { c.dest = j; sim[j].push(c.color); changed = true; }
    }
  }
}

function tapPen(i) {
  if (over) return false;
  const b = boxes[i];
  if (!b.length || isComplete(b, spec.cap)) return false;
  const g = topGroup(b);
  for (let k = 0; k < g.size; k++) b.pop();
  for (let k = 0; k < g.size; k++)
    road.push({ color: g.color, src: i, s: docks[i] + 8 + (g.size - 1 - k) * GAP, prev: null, dest: null });
  tapped = true; updateHand();
  if (road.length > spec.ringCap) { finish(false); return true; } // затор
  assignDests();
  return true;
}

function finish(win) {
  over = true; won = win; updateHand();
  if (win) winTimer = setTimeout(() => showResult(true), WIN_DELAY);
  else showResult(false);
}
function showResult(win) {
  const ov = document.getElementById('overlay');
  document.getElementById('ovTitle').textContent = win ? 'Все овечки дома! 🎉🐑' : 'Затор на тропе! 🚦';
  const btn = document.getElementById('ovBtn');
  btn.textContent = win ? (lvlIdx + 1 < LEVELS.length ? 'Дальше' : 'Сначала') : 'Ещё раз';
  btn.className = win ? '' : 'retry';
  btn.onclick = () => load(win ? (lvlIdx + 1) % LEVELS.length : lvlIdx);
  ov.style.display = 'flex';
}

// эндшпиль: припарковать всё кружащее в фоне → если победа, ускоряем ×2
function relaxCopy(b, r) {
  let prog = true;
  while (prog) {
    prog = false;
    for (let i = 0; i < r.length; i++) {
      const j = pickDest(b, r[i].src, r[i].color, spec.cap);
      if (j !== -1) { b[j].push(r[i].color); r.splice(i, 1); i--; prog = true; }
    }
  }
}
function isEndgame() {
  if (!road.length) return false;
  const b = boxes.map(x => x.slice()), r = road.map(c => ({ color: c.color, src: c.src }));
  relaxCopy(b, r);
  return r.length === 0 && b.every(x => !x.length || isComplete(x, spec.cap));
}

function step(dt) {
  if (over) return;
  fastFinish = isEndgame();
  const sp = SPEED * (fastFinish ? 2 : 1);
  for (const c of road) { c.prev = c.s; c.s += sp * dt; }
  let parked = false;
  for (let idx = road.length - 1; idx >= 0; idx--) {
    const c = road[idx];
    if (c.prev === null || c.dest === null) continue;
    const d = docks[c.dest];
    const a = ((c.prev % PATH.total) + PATH.total) % PATH.total;
    const bb = ((c.s % PATH.total) + PATH.total) % PATH.total;
    const crossed = a <= bb ? (d > a && d <= bb) : (d > a || d <= bb);
    if (!crossed) continue;
    // не занимаем пустой загон, если есть подходящий цветной
    if (boxes[c.dest].length === 0) {
      const better = pickDest(boxes, c.src, c.color, spec.cap);
      if (better !== -1 && boxes[better].length > 0) { c.dest = better; continue; }
    }
    if (canPark(boxes[c.dest], c.color, spec.cap)) {
      boxes[c.dest].push(c.color); road.splice(idx, 1); parked = true;
    }
  }
  if (parked) assignDests();
  if (!road.length && boxes.every(b => !b.length || isComplete(b, spec.cap))) finish(true);
}

// ---------- рука-подсказка (только на 1-м уровне) ----------

function showHand(boxIndex) {

  const scale = cv.clientWidth / W;

  hand.style.top = (cv.offsetTop + (L.y + L.h / 2) * scale - 4) + 'px';

// ---------- отрисовка ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawSheepAt(cx, cy, s, col, dir = 0) {
  const img = SHEEP_IMG[col];
  if (!(img && img.complete && img.naturalWidth)) return drawSheepVec(cx, cy, s, col, dir);
  const h = s * 24, w = h * img.naturalWidth / img.naturalHeight;
  ctx.fillStyle = 'rgba(30,40,20,.20)';
  ctx.beginPath(); ctx.ellipse(cx, cy + h * 0.40, w * 0.40, h * 0.15, 0, 0, TAU); ctx.fill();
  ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
}
function drawSheepVec(cx, cy, s, col, dir = 0) {
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(30,40,20,.18)';
  ctx.beginPath(); ctx.ellipse(0, 11 * s, 12 * s, 4.5 * s, 0, 0, TAU); ctx.fill();
  if (dir) ctx.rotate(dir);

  for (const lx of [-5 * s, 4 * s]) { rr(lx, 5 * s, 2.6 * s, 6 * s, 1.3 * s); ctx.fill(); }
  const bumps = [[-7, -4, 7], [-8, 2, 6.5], [-3, 5, 7], [3, 5, 7], [7, 2, 7], [6, -4, 6.5], [1, -6, 7], [-1, 0, 9]];

  for (const [dx, dy, r] of bumps) { ctx.beginPath(); ctx.arc(dx * s, dy * s + 1, r * s, 0, TAU); ctx.fill(); }
  ctx.fillStyle = col;
  for (const [dx, dy, r] of bumps) { ctx.beginPath(); ctx.arc(dx * s, dy * s, r * s * 0.93, 0, TAU); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.arc(-2 * s, -3 * s, 3.2 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = '#46392f'; ctx.beginPath(); ctx.ellipse(9 * s, 0, 6 * s, 5 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3a2f27';
  ctx.beginPath(); ctx.ellipse(6.5 * s, -5 * s, 3 * s, 1.8 * s, -0.7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6.5 * s, 5 * s, 3 * s, 1.8 * s, 0.7, 0, TAU); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(5.5 * s, 0, 3.2 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(11 * s, -2 * s, 1.5 * s, 0, TAU); ctx.arc(11 * s, 2 * s, 1.5 * s, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1c150f';
  ctx.beginPath(); ctx.arc(11.5 * s, -2 * s, 0.8 * s, 0, TAU); ctx.arc(11.5 * s, 2 * s, 0.8 * s, 0, TAU); ctx.fill();
  ctx.restore();
}

// индикатор тропы (в центре кольца)
function drawMeter() {
  const c = ringCenter(), n = road.length, cap = spec.ringCap;
  const ratio = Math.min(1, n / cap), danger = n >= cap;
  const bw = Math.min((ring.x1 - ring.x0) - 28, 188), bh = 18;
  const bx = c.x - bw / 2, by = c.y - 4;
  if (danger) {
    const g = 0.5 + 0.5 * Math.sin(frameN * 0.2);
    ctx.save(); ctx.shadowColor = '#e74c3c'; ctx.shadowBlur = 14 + 10 * g;
    ctx.fillStyle = 'rgba(231,76,60,' + (0.25 + 0.3 * g) + ')';
    rr(bx - 6, by - 6, bw + 12, bh + 12, 12); ctx.fill(); ctx.restore();
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3f5a28'; ctx.font = 'bold 13px sans-serif';
  ctx.fillText('🐑 овец на тропе', c.x, by - 12);
  ctx.fillStyle = '#2b3055'; rr(bx, by, bw, bh, 9); ctx.fill();
  const fill = ratio >= 0.85 ? '#e74c3c' : ratio >= 0.6 ? '#f1c40f' : '#2ecc71';
  if (n > 0) { ctx.fillStyle = fill; rr(bx + 2, by + 2, Math.max(6, (bw - 4) * ratio), bh - 4, 7); ctx.fill(); }
  ctx.fillStyle = danger ? '#e23b2e' : '#2c3f1a'; ctx.font = 'bold 16px sans-serif';
  ctx.fillText(danger ? 'Затор! 🚦' : (n + ' / ' + cap), c.x, by + bh + 18);
  ctx.textAlign = 'left';
}

// --- строку скруг.прямоугольника обвести ---
function strokeRR(x, y, w, h, r) { rr(x, y, w, h, r); ctx.stroke(); }

// --- декор на траве ---
function drawDeco(d) {
  ctx.save(); ctx.translate(d.x, d.y);
  const s = d.s;
  if (d.kind === 'rock') {
    ctx.fillStyle = 'rgba(20,30,10,.20)'; ctx.beginPath(); ctx.ellipse(0, 6 * s, 11 * s, 4 * s, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#8f8b80'; ctx.beginPath(); ctx.ellipse(0, 0, 10 * s, 8 * s, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#b3afa4'; ctx.beginPath(); ctx.ellipse(-2.5 * s, -2.5 * s, 5.5 * s, 4 * s, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#6f6b61'; ctx.beginPath(); ctx.ellipse(3 * s, 3 * s, 4 * s, 2.6 * s, 0, 0, TAU); ctx.fill();
  } else if (d.kind === 'flower') {
    const pet = d.h < .33 ? '#ffffff' : d.h < .66 ? '#ff8fbf' : '#ffd84a';
    ctx.fillStyle = pet;
    for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; ctx.beginPath(); ctx.arc(Math.cos(a) * 3.4 * s, Math.sin(a) * 3.4 * s, 2.4 * s, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#f2b200'; ctx.beginPath(); ctx.arc(0, 0, 2 * s, 0, TAU); ctx.fill();
  } else { // tuft
    ctx.strokeStyle = '#5c9432'; ctx.lineWidth = 2 * s; ctx.lineCap = 'round';
    for (const dx of [-4 * s, 0, 4 * s]) { ctx.beginPath(); ctx.moveTo(dx, 4 * s); ctx.quadraticCurveTo(dx * 1.3, -3 * s, dx * 1.6 + (dx === 0 ? 2 * s : 0), -8 * s); ctx.stroke(); }
    ctx.strokeStyle = '#77b048'; ctx.beginPath(); ctx.moveTo(0, 4 * s); ctx.lineTo(1 * s, -7 * s); ctx.stroke();
  }
  ctx.restore();
}

// --- полосатая башня-силос ---
function drawSilo(cx, cy) {
  const w = 40, h = 58, x = cx - w / 2, y = cy - h * 0.62;
  ctx.fillStyle = 'rgba(20,30,10,.24)'; ctx.beginPath(); ctx.ellipse(cx, y + h - 2, w * 0.55, 8, 0, 0, TAU); ctx.fill();
  ctx.save(); rr(x, y, w, h, 9); ctx.clip();
  const bands = 5, bh = h / bands;
  for (let i = 0; i < bands; i++) { ctx.fillStyle = i % 2 ? '#e0554c' : '#f4efe1'; ctx.fillRect(x, y + i * bh, w, bh + 1); }
  ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(x, y, w * 0.34, h); // блик слева
  ctx.restore();
  ctx.strokeStyle = 'rgba(90,60,40,.35)'; ctx.lineWidth = 2; strokeRR(x, y, w, h, 9);
  // купол-обод
  ctx.fillStyle = '#c9ccd2'; ctx.beginPath(); ctx.ellipse(cx, y, w * 0.52, 10, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#eef0f3'; ctx.beginPath(); ctx.ellipse(cx - 3, y - 2, w * 0.34, 6, 0, 0, TAU); ctx.fill();
}

// --- шеврон-стрелка на тропе ---
function drawChevron(x, y, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.strokeStyle = 'rgba(247,240,216,.7)'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(5, 0); ctx.lineTo(-6, 8); ctx.stroke();
  ctx.restore();
}

// --- дорога-кольцо ---
function drawPath() {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const rw = ring.x1 - ring.x0, rh = ring.y1 - ring.y0;
  ctx.strokeStyle = '#a4834c'; ctx.lineWidth = 46; strokeRR(ring.x0, ring.y0, rw, rh, ring.r);
  ctx.strokeStyle = '#cdaf74'; ctx.lineWidth = 38; strokeRR(ring.x0, ring.y0, rw, rh, ring.r);
  ctx.strokeStyle = '#d9bd84'; ctx.lineWidth = 20; strokeRR(ring.x0, ring.y0, rw, rh, ring.r);
}
function drawArrows() {
  const n = Math.max(5, Math.round(PATH.total / 190));
  for (let k = 0; k < n; k++) { const s = (k + 0.5) / n * PATH.total, p = pointAt(s); drawChevron(p.x, p.y, dirAt(s)); }
}

// --- загон = глянцевая цветная труба-оградка (цвет = нижняя овца) ---
function drawPenFloor(p) {
  ctx.fillStyle = 'rgba(205,175,110,.55)';
  rr(p.x + 3, p.y + 3, p.w - 6, p.h - 6, 10); ctx.fill();
}
function drawPenRail(p) {
  const b = boxes[pens.indexOf(p)];
  const col = (b && b.length) ? COLOR_HEX[b[0]] : '#e7dcc2';
  const R = Math.min(15, Math.min(p.w, p.h) / 3);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 15; strokeRR(p.x, p.y + 2.5, p.w, p.h, R);
  ctx.strokeStyle = shade(col, -48); ctx.lineWidth = 15; strokeRR(p.x, p.y, p.w, p.h, R);
  ctx.strokeStyle = col; ctx.lineWidth = 10; strokeRR(p.x, p.y, p.w, p.h, R);
  ctx.strokeStyle = shade(col, 62); ctx.lineWidth = 3.5; strokeRR(p.x, p.y, p.w, p.h, R);
}
function drawConnector(p, i) {
  const gp = gatePoint(p), dp = pointAt(docks[i]);
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#a4834c'; ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(gp.x, gp.y); ctx.lineTo(dp.x, dp.y); ctx.stroke();
  ctx.strokeStyle = '#cdaf74'; ctx.lineWidth = 20; ctx.beginPath(); ctx.moveTo(gp.x, gp.y); ctx.lineTo(dp.x, dp.y); ctx.stroke();
}
function drawPenSheep(p) {
  const i = pens.indexOf(p), b = boxes[i], done = isComplete(b, spec.cap), sc = penSheepScale(p);
  for (let k = b.length; k < spec.cap; k++) {
    const cc = cellForK(p, k);
    ctx.fillStyle = 'rgba(90,110,55,.16)';
    ctx.beginPath(); ctx.ellipse(cc.x, cc.y + 4, 11 * sc, 4 * sc, 0, 0, TAU); ctx.fill();
  }
  for (let si = 0; si < b.length; si++) {
    const cc = cellForK(p, b.length - 1 - si);
    drawSheepAt(cc.x, cc.y, sc, COLOR_HEX[b[si]], 0);
  }
  if (done) {
    ctx.save(); ctx.fillStyle = '#2f7d1a'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
    ctx.strokeText('✓', p.x + p.w / 2, p.y + p.h / 2 + 10); ctx.fillText('✓', p.x + p.w / 2, p.y + p.h / 2 + 10);
    ctx.restore(); ctx.textAlign = 'left';
  }
}

function draw() {
  frameN++;
  ctx.clearRect(0, 0, W, H);
  // трава
  if (!grassPat && grassImg.complete && grassImg.naturalWidth) grassPat = ctx.createPattern(grassImg, 'repeat');
  if (grassPat) { ctx.fillStyle = grassPat; ctx.fillRect(0, 0, W, H); }
  else { const grad = ctx.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, '#93c552'); grad.addColorStop(1, '#7cb043'); ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H); }
  for (const d of decos) drawDeco(d);

  drawPath();
  drawArrows();
  for (const s of silos) drawSilo(s.x, s.y);
  drawMeter();

  pens.forEach(p => drawPenFloor(p));
  pens.forEach(p => drawPenRail(p));
  pens.forEach((p, i) => drawConnector(p, i)); // прорезает ворота поверх оградки
  pens.forEach(p => drawPenSheep(p));

  for (const c of road) { const p = pointAt(c.s); drawSheepAt(p.x, p.y, 1.5, COLOR_HEX[c.color], dirAt(c.s)); }

  // заголовок-плашка
  ctx.fillStyle = 'rgba(60,90,30,.55)'; rr(8, 10, 210, 26, 13); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif';
  ctx.fillText(LEVELS[lvlIdx].name + ' · 🐑 Овечий Сорт', 16, 28);
}

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width), y = (e.clientY - r.top) * (H / r.height);
  pens.forEach((p, i) => {
    if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) tapPen(i);
  });
});

const bar = document.getElementById('bar');
LEVELS.forEach((l, i) => {
  const b = document.createElement('button');
  b.dataset.lvl = i; b.textContent = (i + 1);
  b.onclick = () => load(i);
  bar.appendChild(b);
});
const rb = document.createElement('button');
rb.textContent = '↻ заново'; rb.onclick = () => load(lvlIdx);
bar.appendChild(rb);

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  step(dt); draw(); requestAnimationFrame(frame);
}
load(0);
requestAnimationFrame(frame);

window.__game = {
  load, tapPen,
  step: (dt) => step(dt),
  tick: (n, dt = 0.05) => { for (let k = 0; k < n; k++) step(dt); },
  roadCount: () => road.length,
  ringCap: () => spec.ringCap,
  boxesState: () => boxes.map(b => b.join('')),
  isOver: () => over, isWon: () => won, isFast: () => fastFinish,
  title: () => document.getElementById('ovTitle').textContent,
  overlayShown: () => document.getElementById('overlay').style.display === 'flex',
};
</script>
</body>
</html>
