<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Donut Jam — v1</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    height:100dvh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
    background:radial-gradient(120% 120% at 50% 0%,#222838,#10131c 80%);}

  #phone{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
         background:linear-gradient(180deg,#ffe9d6 0%,#ffd9b8 55%,#f7c79a 100%);}
  @media (max-aspect-ratio:1/1){ #phone{width:100vw;height:100dvh;border-radius:0;} }
  @media (min-aspect-ratio:1/1){
    #phone{height:96dvh;aspect-ratio:9/16;width:auto;
           border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 8px #0c0e15;}
  }

  #bg{position:absolute;inset:0;z-index:0;pointer-events:none;}
  #bg .stripe{position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,#ffffff12 0 34px,#ffffff00 34px 68px);}
  #hud{width:100%;padding:12px 14px;z-index:3;display:flex;align-items:center;gap:10px;}
  .hbtn{width:42px;height:42px;border:none;border-radius:14px;background:#fffdf7;color:#8a5a3b;
    font-size:20px;box-shadow:0 3px 0 #d9b28c,0 6px 14px #a86a3540;cursor:pointer;flex:0 0 auto;}
  .hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #d9b28c;}
  #lvlname{flex:1;text-align:center;font-weight:800;font-size:19px;color:#7c4a24;letter-spacing:.4px;}
  #left{flex:0 0 auto;background:#fffdf7;border-radius:12px;padding:7px 12px;font-weight:800;
    color:#8a5a3b;font-size:14px;box-shadow:0 3px 0 #d9b28c;}

  #stage{flex:1;width:100%;position:relative;z-index:2;min-height:0;}
  #board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center;
         width:520px;height:640px;}

  /* доски-подносы */
  .tray{position:absolute;border-radius:22px;
    background:linear-gradient(160deg,#f2c891 0%,#e2a763 60%,#d1954f 100%);
    box-shadow:inset 0 2px 0 #ffe3b6,inset 0 -4px 0 #b57a3c,0 10px 18px #7c4a2455;
    transition:transform .55s cubic-bezier(.5,-.4,.8,.6),opacity .5s;}
  .tray::after{content:"";position:absolute;inset:9px;border-radius:15px;
    border:2px dashed #b57a3c55;pointer-events:none;}
  .tray.z1{background:linear-gradient(160deg,#f7d6a6 0%,#eab475 60%,#dda361 100%);
    box-shadow:inset 0 2px 0 #fff0d2,inset 0 -4px 0 #bd8347,0 16px 26px #7c4a2466;}
  .tray.z2{background:linear-gradient(160deg,#fbe3bf 0%,#f2c48c 60%,#e7b276 100%);
    box-shadow:inset 0 2px 0 #fff7e4,inset 0 -4px 0 #c98f52,0 22px 34px #7c4a2477;}
  .tray.gone{transform:translateY(70px) rotate(7deg) !important;opacity:0;}

  /* пончик */
  .donut{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
    cursor:pointer;transition:transform .12s;}
  .donut .glaze{position:absolute;inset:0;border-radius:50%;
    box-shadow:inset 0 -6px 0 #00000022,inset 0 3px 0 #ffffff55,0 4px 8px #00000033;}
  .donut .hole{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;
    border-radius:50%;background:#a06a35;box-shadow:inset 0 3px 5px #00000055;}
  .donut .spr{position:absolute;width:8px;height:3px;border-radius:2px;background:#fff;opacity:.9;}
  .donut:active{transform:scale(.92);}
  .donut.deny{animation:deny .3s;}
  @keyframes deny{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* коробка внизу */
  #boxwrap{width:100%;z-index:4;padding:8px 12px 18px;display:flex;justify-content:center;}
  #box{position:relative;width:min(96%,420px);height:74px;border-radius:18px;
    background:linear-gradient(180deg,#f78fb3,#ef6f9d);
    box-shadow:inset 0 4px 0 #ffc2d8,inset 0 -6px 0 #c74d7b,0 10px 20px #a8355f44;
    display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;}
  #box .slot{width:50px;height:54px;border-radius:12px;background:#00000022;
    box-shadow:inset 0 3px 6px #00000033;flex:0 0 auto;}
  .boxdonut{position:absolute;width:48px;height:48px;border-radius:50%;
    transition:left .25s ease,transform .25s;}
  .boxdonut .hole{width:18px;height:18px;margin:-9px 0 0 -9px;background:#c74d7b;}
  .boxdonut.pop{transform:scale(0) rotate(120deg);}

  .fly{position:absolute;width:64px;height:64px;border-radius:50%;z-index:30;pointer-events:none;
    transition:left .38s cubic-bezier(.35,.8,.4,1),top .38s cubic-bezier(.6,-.2,.7,1),
      width .38s,height .38s;}

  /* оверлеи */
  .ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:#3a1f0eb8;opacity:0;pointer-events:none;transition:opacity .3s;}
  .ov.show{opacity:1;pointer-events:auto;}
  .card{background:#fffdf7;border-radius:26px;padding:30px 34px;text-align:center;
    box-shadow:0 20px 50px #00000066;transform:scale(.8);transition:transform .3s;max-width:82%;}
  .ov.show .card{transform:scale(1);}
  .card h2{margin:0 0 6px;font-size:28px;color:#7c4a24;}
  .card p{margin:0 0 18px;color:#a3743f;font-weight:600;}
  .cbtn{border:none;border-radius:16px;padding:14px 30px;font-size:17px;font-weight:800;cursor:pointer;
    background:linear-gradient(180deg,#ffb14e,#f78f1e);color:#fff;
    box-shadow:0 4px 0 #c96f10,0 8px 18px #f78f1e55;margin:0 5px;}
  .cbtn.alt{background:linear-gradient(180deg,#f7fafc,#e8edf2);color:#8a5a3b;box-shadow:0 4px 0 #c9b8a5;}
  .cbtn:active{transform:translateY(2px);}

  /* домашний экран */
  #home{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:8px;background:linear-gradient(180deg,#ffe9d6,#ffd0a6);}
  #home.hide{display:none;}
  #home h1{margin:0;font-size:44px;color:#7c4a24;text-shadow:0 3px 0 #ffffffaa;}
  #home .tag{color:#b0824e;font-weight:700;margin-bottom:22px;}
  .lvlbtn{width:230px;border:none;border-radius:18px;padding:15px;font-size:18px;font-weight:800;
    cursor:pointer;background:#fffdf7;color:#8a5a3b;box-shadow:0 4px 0 #d9b28c,0 8px 16px #a86a3530;
    display:flex;align-items:center;justify-content:space-between;padding:15px 22px;margin:5px 0;}
  .lvlbtn:disabled{opacity:.45;cursor:default;}
  .lvlbtn:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 #d9b28c;}
  .conf{position:absolute;width:10px;height:4px;border-radius:2px;z-index:25;pointer-events:none;}
</style>
</head>
<body>
<div id="phone">
  <div id="bg"><div class="stripe"></div></div>

  <div id="home">
    <div style="font-size:74px;line-height:1;margin-bottom:6px;">🍩</div>
    <h1>Donut Jam</h1>
    <div class="tag">собери пончики тройками в коробку</div>
    <div id="lvlbtns"></div>
  </div>

  <div id="hud">
    <button class="hbtn" id="btnHome">🏠</button>
    <div id="lvlname">Level 1</div>
    <div id="left">🍩 0</div>
    <button class="hbtn" id="btnRestart">↺</button>
  </div>
  <div id="stage"><div id="board"></div></div>
  <div id="boxwrap"><div id="box"></div></div>

  <div class="ov" id="ovWin"><div class="card">
    <h2>Sweet! 🎉</h2><p id="winTxt">Уровень пройден</p>
    <button class="cbtn" id="btnNext">Дальше</button>
  </div></div>
  <div class="ov" id="ovLose"><div class="card">
    <h2>Коробка полна 😵</h2><p>Тройки не сложились</p>
    <button class="cbtn alt" id="btnLoseHome">🏠</button>
    <button class="cbtn" id="btnRetry">Ещё раз</button>
  </div></div>
</div>

<script>
/* ================= Donut Jam v1 =================
   Механика wool sort / screw jam: тап по свободному пончику -> летит в коробку
   (7 ячеек), 3 одинаковых схлопываются. Доски-подносы слоями: пустая доска
   падает и открывает пончики под ней. Проигрыш: коробка заполнена без тройки.
================================================== */
const COLORS=[
  {name:'rose', glaze:'#ff6fa5'},
  {name:'choco',glaze:'#8a5a3b'},
  {name:'mint', glaze:'#57d9a3'},
  {name:'blue', glaze:'#5b8ff0'},
  {name:'lemon',glaze:'#f7c948'},
  {name:'lav',  glaze:'#a97ff0'},
];
const BOX_CAP=7, INSET=6;

/* T(x,y,w,h,z,cols,rows) — поднос с сеткой слотов */
function T(x,y,w,h,z,cols,rows){
  const slots=[];
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++)
    slots.push({dx:w*(i+.5)/cols, dy:h*(j+.5)/rows});
  return {x,y,w,h,z,slots};
}
const LEVELS=[
  {colors:2, trays:[ T(70,120,380,150,0,3,1), T(70,350,380,150,0,3,1) ]},
  {colors:3, trays:[ T(60,110,400,300,0,3,2), T(60,460,400,150,0,3,1), T(140,180,240,150,1,3,1) ]},
  {colors:4, trays:[ T(50,100,420,340,0,3,3), T(50,490,420,140,0,3,1),
                     T(70,140,220,130,1,3,1), T(240,270,220,130,1,3,1) ]},
  {colors:5, trays:[ T(50,90,420,360,0,3,3), T(50,500,420,130,0,4,1),
                     T(60,120,240,180,1,2,2), T(250,260,210,180,1,2,2), T(140,190,240,150,2,3,1) ]},
  {colors:6, trays:[ T(40,80,440,380,0,3,4), T(40,510,440,120,0,4,1),
                     T(50,110,250,200,1,2,2), T(230,150,240,200,1,2,2),
                     T(50,330,250,200,1,2,2), T(230,370,240,200,1,2,2), T(140,220,240,220,2,2,2) ]},
];

let cur=0, trays=[], donuts=[], boxItems=[], flights=0, busy=false, over=false, genOK=false;
let unlocked=+(localStorage.getItem('donutjam_v1')||1);

/* ---------- seeded rng ---------- */
function rng(seed){ let s=seed>>>0; return ()=>((s=Math.imul(s^s>>>15,s|1)^s+Math.imul(s^s>>>7,s|61))>>>0)/4294967296; }

/* ---------- генерация: цвета назначаются реверс-симуляцией ---------- */
function covered(d, aliveTrays){
  const tr=trays[d.tray];
  for(const t of aliveTrays){
    if(t.z<=tr.z||t===tr) continue;
    if(d.x>t.x+INSET && d.x<t.x+t.w-INSET && d.y>t.y+INSET && d.y<t.y+t.h-INSET) return true;
  }
  return false;
}
function generate(levelIdx){
  const L=LEVELS[levelIdx];
  for(let seed=1;seed<=80;seed++){
    const rand=rng(levelIdx*1000+seed*7919);
    trays=L.trays.map(t=>({...t,left:0}));
    donuts=[];
    trays.forEach((t,ti)=>t.slots.forEach(s=>{
      donuts.push({id:donuts.length,tray:ti,x:t.x+s.dx,y:t.y+s.dy,color:-1,removed:false});
      t.left++;
    }));
    if(donuts.length%3!==0){ console.error('slots not /3'); return false; }
    // симуляция: снимаем тройки только из доступных
    const state=donuts.map(d=>({...d}));
    const tLeft=trays.map(t=>t.left);
    let ok=true, ci=0, remaining=state.length;
    const order=[]; // порядок цветов для перемешки
    const nTrip=state.length/3;
    for(let k=0;k<nTrip;k++) order.push(k%L.colors);
    for(let i=order.length-1;i>0;i--){const j=(rand()*(i+1))|0;[order[i],order[j]]=[order[j],order[i]];}
    while(remaining>0){
      const alive=trays.filter((t,ti)=>tLeft[ti]>0);
      const avail=state.filter(d=>!d.removed && d.color===-1 &&
        !covered(d,alive));
      if(avail.length<3){ ok=false; break; }
      const pick=[];
      for(let k=0;k<3;k++){
        const idx=(rand()*avail.length)|0;
        pick.push(avail.splice(idx,1)[0]);
      }
      const col=order[ci++];
      pick.forEach(p=>{ p.color=col; p.removed=true; tLeft[p.tray]--; });
      remaining-=3;
    }
    if(ok){
      state.forEach(s=>{ donuts[s.id].color=s.color; });
      genOK=true;
      return true;
    }
  }
  console.error('generation failed for level',levelIdx);
  genOK=false;
  return false;
}

/* ---------- рендер ---------- */
const board=document.getElementById('board'), boxEl=document.getElementById('box');
function build(){
  board.innerHTML='';
  trays.forEach((t,ti)=>{
    const el=document.createElement('div');
    el.className='tray z'+t.z;
    el.style.cssText=`left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px;z-index:${t.z*10};`;
    board.appendChild(el); t.el=el;
  });
  donuts.forEach(d=>{
    if(d.removed) return;
    const t=trays[d.tray], c=COLORS[d.color];
    const el=document.createElement('div');
    el.className='donut';
    el.style.cssText=`left:${d.x}px;top:${d.y}px;z-index:${t.z*10+1};`;
    el.innerHTML=donutHTML(c,64);
    el.addEventListener('pointerdown',()=>tap(d));
    board.appendChild(el); d.el=el;
  });
  boxEl.innerHTML='';
  for(let i=0;i<BOX_CAP;i++){const s=document.createElement('div');s.className='slot';boxEl.appendChild(s);}
  updateHud();
  requestAnimationFrame(fit);
}
function donutHTML(c,size){
  const sprs=[[30,18,-20],[52,30,15],[22,44,40],[46,50,-30]]
    .map(([x,y,r])=>`<div class="spr" style="left:${x/64*size}px;top:${y/64*size}px;transform:rotate(${r}deg)"></div>`).join('');
  return `<div class="glaze" style="background:${c.glaze}"></div>${sprs}<div class="hole"></div>`;
}
function updateHud(){
  document.getElementById('left').textContent='🍩 '+donuts.filter(d=>!d.removed).length;
  document.getElementById('lvlname').textContent='Level '+(cur+1);
}

/* ---------- ход ---------- */
function aliveTrays(){ return trays.filter(t=>t.left>0); }
function isFree(d){ return !d.removed && !covered(d,aliveTrays()); }
function slotX(i){ // левый край i-го слота внутри коробки
  const slots=boxEl.querySelectorAll('.slot');
  return slots[i]? slots[i].offsetLeft : 10+i*56;
}
function tap(d){
  if(over||d.removed) return;
  if(!isFree(d)){ d.el.classList.add('deny'); setTimeout(()=>d.el.classList.remove('deny'),320); return; }
  if(boxItems.length+flights>=BOX_CAP) return;
  d.removed=true;
  const t=trays[d.tray]; t.left--;
  // полёт
  const phone=document.getElementById('phone');
  const pr=phone.getBoundingClientRect(), dr=d.el.getBoundingClientRect();
  const fly=document.createElement('div');
  fly.className='fly';
  fly.innerHTML=donutHTML(COLORS[d.color],64);
  fly.style.left=(dr.left-pr.left)+'px'; fly.style.top=(dr.top-pr.top)+'px';
  fly.style.width=dr.width+'px'; fly.style.height=dr.height+'px';
  fly.querySelector('.glaze').style.borderRadius='50%';
  phone.appendChild(fly);
  d.el.remove();
  // куда встанет: после последнего такого же цвета
  let ins=boxItems.length;
  for(let i=boxItems.length-1;i>=0;i--) if(boxItems[i].color===d.color){ ins=i+1; break; }
  const item={color:d.color, el:null};
  boxItems.splice(ins,0,item);
  layoutBox();
  flights++;
  const br=boxEl.getBoundingClientRect();
  requestAnimationFrame(()=>{
    fly.style.left=(br.left-pr.left+slotX(boxItems.indexOf(item))+1)+'px';
    fly.style.top=(br.top-pr.top+13)+'px';
    fly.style.width='48px'; fly.style.height='48px';
  });
  if(t.left===0) setTimeout(()=>t.el.classList.add('gone'),200);
  updateHud();
  setTimeout(()=>{ // приземление
    fly.remove(); flights--;
    const el=document.createElement('div');
    el.className='boxdonut';
    el.innerHTML=donutHTML(COLORS[d.color],48);
    el.style.top='13px';
    item.el=el; boxEl.appendChild(el);
    layoutBox(true);
    afterLand(d.color);
  },390);
}
function layoutBox(instant){
  boxItems.forEach((it,i)=>{ if(it.el){ it.el.style.left=(slotX(i)+1)+'px'; } });
}
function afterLand(color){
  const same=boxItems.filter(b=>b.color===color && b.el);
  if(same.length>=3){
    busy=true;
    const three=same.slice(0,3);
    setTimeout(()=>{
      three.forEach(b=>b.el.classList.add('pop'));
      setTimeout(()=>{
        three.forEach(b=>{ b.el.remove(); boxItems.splice(boxItems.indexOf(b),1); });
        layoutBox(); busy=false;
        checkEnd();
      },240);
    },160);
  } else checkEnd();
}
function checkEnd(){
  if(over) return;
  const landed=boxItems.filter(b=>b.el).length;
  if(landed>=BOX_CAP && flights===0 && !busy){
    // есть ли собирающаяся тройка?
    const counts={};
    boxItems.forEach(b=>counts[b.color]=(counts[b.color]||0)+1);
    if(!Object.values(counts).some(v=>v>=3)){ over=true; lose(); return; }
  }
  if(donuts.every(d=>d.removed) && boxItems.length===0 && flights===0){
    over=true;
    setTimeout(win,1000); // пауза ~1с перед победой
  }
}

/* ---------- win / lose ---------- */
function win(){
  if(cur+1>unlocked && cur+1<=LEVELS.length){ unlocked=cur+1+(cur+1<LEVELS.length?1:0); }
  unlocked=Math.max(unlocked,Math.min(cur+2,LEVELS.length));
  localStorage.setItem('donutjam_v1',unlocked);
  document.getElementById('winTxt').textContent='Level '+(cur+1)+' пройден';
  document.getElementById('btnNext').textContent=(cur+1<LEVELS.length)?'Дальше':'🏠 Домой';
  document.getElementById('ovWin').classList.add('show');
  confetti();
  window.__game.state='won';
}
function lose(){
  document.getElementById('ovLose').classList.add('show');
  window.__game.state='lost';
}
function confetti(){
  const phone=document.getElementById('phone');
  for(let i=0;i<26;i++){
    const c=document.createElement('div');
    c.className='conf';
    c.style.background=COLORS[i%COLORS.length].glaze;
    c.style.left=(20+Math.random()*60)+'%'; c.style.top='-10px';
    phone.appendChild(c);
    const fall=c.animate([
      {transform:`translateY(0) rotate(0deg)`,opacity:1},
      {transform:`translateY(${phone.clientHeight*0.8}px) rotate(${360+Math.random()*360}deg)`,opacity:0}
    ],{duration:1400+Math.random()*800,easing:'cubic-bezier(.3,.6,.6,1)',delay:Math.random()*300});
    fall.onfinish=()=>c.remove();
  }
}

/* ---------- экраны ---------- */
function startLevel(i){
  cur=i; over=false; boxItems=[]; flights=0; busy=false;
  document.getElementById('ovWin').classList.remove('show');
  document.getElementById('ovLose').classList.remove('show');
  document.getElementById('home').classList.add('hide');
  generate(i); build();
  window.__game.state='playing';
}
function showHome(){
  document.getElementById('home').classList.remove('hide');
  document.getElementById('ovWin').classList.remove('show');
  document.getElementById('ovLose').classList.remove('show');
  const wrap=document.getElementById('lvlbtns'); wrap.innerHTML='';
  for(let i=0;i<LEVELS.length;i++){
    const b=document.createElement('button');
    b.className='lvlbtn'; b.disabled=i+1>unlocked;
    b.innerHTML=`<span>Level ${i+1}</span><span>${i+1>unlocked?'🔒':'🍩'}</span>`;
    b.addEventListener('pointerdown',()=>startLevel(i));
    wrap.appendChild(b);
  }
  window.__game.state='home';
}
document.getElementById('btnRestart').addEventListener('pointerdown',()=>startLevel(cur));
document.getElementById('btnRetry').addEventListener('pointerdown',()=>startLevel(cur));
document.getElementById('btnHome').addEventListener('pointerdown',showHome);
document.getElementById('btnLoseHome').addEventListener('pointerdown',showHome);
document.getElementById('btnNext').addEventListener('pointerdown',()=>{
  if(cur+1<LEVELS.length) startLevel(cur+1); else showHome();
});

/* ---------- fit ---------- */
function fit(){
  const stage=document.getElementById('stage');
  if(!board.offsetWidth) return;
  const sw=stage.clientWidth-16, sh=stage.clientHeight-12;
  const s=Math.max(.3,Math.min(sw/520, sh/640, 1.4));
  board.style.transform=`translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize',fit);

/* ---------- отладочный API + бот для PLAY-проверки ---------- */
window.__game={
  state:'home',
  get genOK(){return genOK;},
  startLevel, showHome,
  freeList(){ return donuts.filter(isFree).map(d=>({id:d.id,color:d.color})); },
  tapId(id){ tap(donuts[id]); },
  boxCount(){ return boxItems.length; },
  botStep(){
    if(window.__game.state!=='playing') return false;
    if(flights>0||busy) return true;
    const free=donuts.filter(isFree);
    if(!free.length) return true;
    const inBox={};
    boxItems.forEach(b=>inBox[b.color]=(inBox[b.color]||0)+1);
    const room=BOX_CAP-boxItems.length-flights;
    if(room<=0) return true;
    // 1) добить цвет, которого в коробке 2, потом 1
    for(const want of [2,1]){
      const d=free.find(d=>(inBox[d.color]||0)===want);
      if(d){ tap(d); return true; }
    }
    // 2) начать цвет, у которого >=3 свободных, если есть запас места
    const byColor={};
    free.forEach(d=>(byColor[d.color]=byColor[d.color]||[]).push(d));
    const trio=Object.values(byColor).find(a=>a.length>=3);
    if(trio && room>=3){ tap(trio[0]); return true; }
    // 3) иначе любой цвет с макс. числом свободных, если место >=2
    if(room>=2){
      const best=Object.values(byColor).sort((a,b)=>b.length-a.length)[0];
      tap(best[0]); return true;
    }
    return true;
  },
  autoplay(){
    return new Promise(res=>{
      const t=setInterval(()=>{
        if(window.__game.state!=='playing'){ clearInterval(t); res(window.__game.state); return; }
        window.__game.botStep();
      },120);
      setTimeout(()=>{ clearInterval(t); res(window.__game.state); },90000);
    });
  }
};

showHome();
requestAnimationFrame(fit);
</script>
